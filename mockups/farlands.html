};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ASTROMANCER — Far Lands IV/VI                                           ║
// ║  Star Alignments · Cosmic Cycle · Midnight-blue robes with silver star ║
// ║  embroidery, ★ orbital sun + moon ★ around head (slowly rotating),    ║
// ║  ★ crescent-moon staff ★, starlight-cyan-violet eye glow              ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Astromancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = astromancerAnimations;
  }

  // Override update — orbit the sun + moon around the head, alternate sun/moon brightness
  update(time, dt) {
    super.update(time, dt);
    if (this.cosmicOrbit) this.cosmicOrbit.rotation.y = time * 0.25;
    // Sun pulses bright during "day", moon during "night"
    if (this.sunOrb) {
      const dayPhase = (Math.sin(time * 0.4) + 1) * 0.5;  // 0-1 oscillating
      this.sunOrb.scale.setScalar(0.9 + dayPhase * 0.2);
    }
    if (this.moonOrb) {
      const nightPhase = (Math.cos(time * 0.4) + 1) * 0.5;
      this.moonOrb.scale.setScalar(0.9 + nightPhase * 0.2);
    }
  }

  build() {
    const root = this.group;

    // Legs — midnight robes
    const buildAstroLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.astroMidnight);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.astroMidnightHi);
      shin.position.y = 0.36; leg.add(shin);
      // Silver hem trim
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.astroSilverHi);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Star sprinkles on the lower robes (3 per side)
      for (let i = -1; i <= 1; i++) {
        const star = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.astroStar);
        star.position.set(i * 0.07, 0.15, 0.22);
        leg.add(star);
      }
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.astroMidnight);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildAstroLeg(-1));
    root.add(buildAstroLeg(1));

    // Pelvis
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.astroMidnightHi));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.astroSilver);
    belt.position.y = 0.04; pelvis.add(belt);
    // Sun-and-moon dual buckle
    const buckleSun = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.astroSun);
    buckleSun.position.set(-0.014, 0.04, 0.32);
    pelvis.add(buckleSun);
    const buckleMoon = mesh(new THREE.SphereGeometry(0.022, 12, 10, 0, Math.PI * 1.4, 0, Math.PI), M.astroMoon);
    buckleMoon.position.set(0.014, 0.04, 0.32); buckleMoon.rotation.y = Math.PI / 2;
    pelvis.add(buckleMoon);
    // Long robe drape
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.astroMidnight);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.astroSilverHi);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Sprinkled stars all around the lower robe
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2 + Math.random() * 0.2;
      const star = mesh(new THREE.SphereGeometry(0.008 + Math.random() * 0.005, 6, 4), M.astroStar);
      star.position.set(Math.cos(a) * 0.4, -0.32 + (Math.random() - 0.5) * 0.18, Math.sin(a) * 0.4);
      pelvis.add(star);
    }
    root.add(pelvis);

    // TORSO
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.astroMidnight);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.astroMidnightHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Silver constellation lines across the chest (connecting star points)
    const constellationPoints = [
      [-0.18, 0.25], [-0.05, 0.18], [0.08, 0.26], [0.18, 0.15],
      [-0.1, 0.05], [0.05, -0.05], [0.18, -0.1], [-0.18, -0.1],
    ];
    constellationPoints.forEach(p => {
      const star = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.astroStar);
      star.position.set(p[0], p[1], 0.36);
      torso.add(star);
    });
    // Connecting lines
    const lines = [[0,1],[1,2],[2,3],[1,4],[4,5],[5,6],[5,7]];
    lines.forEach(([a, b]) => {
      const pa = constellationPoints[a], pb = constellationPoints[b];
      const dx = pb[0] - pa[0], dy = pb[1] - pa[1];
      const dist = Math.sqrt(dx * dx + dy * dy);
      const line = mesh(new THREE.CylinderGeometry(0.002, 0.002, dist, 4), M.astroSilver);
      line.position.set((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, 0.355);
      line.rotation.z = Math.atan2(dy, dx) - Math.PI / 2;
      torso.add(line);
    });

    // CHEST EMBLEM — sun + moon eclipse (overlapping discs)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.astroMidnightHi);
    emblemBack.position.set(0, 0.0, 0.4); torso.add(emblemBack);
    // Sun (left)
    const eSun = mesh(new THREE.CircleGeometry(0.045, 18), M.astroSun);
    eSun.position.set(-0.018, 0.0, 0.41); torso.add(eSun);
    // 8 sun rays
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const ray = mesh(new THREE.BoxGeometry(0.005, 0.025, 0.005), M.astroSun);
      ray.position.set(-0.018 + Math.cos(a) * 0.05, Math.sin(a) * 0.05, 0.42);
      ray.rotation.z = a;
      torso.add(ray);
    }
    // Moon (right, crescent — half-shape over the sun)
    const eMoon = mesh(new THREE.CircleGeometry(0.04, 18), M.astroMoon);
    eMoon.position.set(0.018, 0.0, 0.42); torso.add(eMoon);
    const eMoonShadow = mesh(new THREE.CircleGeometry(0.034, 18), M.astroMidnight);
    eMoonShadow.position.set(0.005, 0.0, 0.425); torso.add(eMoonShadow);

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.astroMidnightHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.astroSilverHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Shoulders with star ornaments
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.astroMidnightHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.astroSilverHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Star ornament atop each shoulder (5-pointed)
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
        const ray = mesh(new THREE.ConeGeometry(0.007, 0.025, 4), M.astroStar);
        ray.position.set(side * 0.42 + Math.cos(a) * 0.018, 2.27 + Math.sin(a) * 0.018, 0);
        ray.rotation.z = a - Math.PI / 2;
        root.add(ray);
      }
    }

    // Arms
    const armPalette = { cloth: M.astroMidnight, mid: M.astroMidnightHi, dark: M.astroMidnight, hi: M.astroSilver, accent: M.astroSilverHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Star-trim sleeves
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.astroMidnightHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.astroSilverHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Constellation stars on the sleeve
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const star = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.astroStar);
        star.position.set(Math.cos(a) * 0.16, -0.95, Math.sin(a) * 0.16);
        arm.add(star);
      }
    });

    // CRESCENT-MOON STAFF
    const staff = this._buildCrescentStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // Cape
    const cape = buildCape({ material: M.astroMidnight, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.astroSilverHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // Star sprinkles on the cape
    for (let i = 0; i < 12; i++) {
      const star = mesh(new THREE.SphereGeometry(0.012, 6, 4), M.astroStar);
      star.position.set((Math.random() - 0.5) * 0.9, 0.7 + Math.random() * 1.2, -0.16);
      root.add(star);
    }

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — pointed star-cluster hat
    const head = this._buildAstromancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== ORBITAL SUN + MOON around the head (the marquee feature) =====
    this.cosmicOrbit = new THREE.Group();
    this.cosmicOrbit.position.set(0, 2.85, 0);
    // Sun orb
    this.sunOrb = mesh(new THREE.SphereGeometry(0.05, 14, 12), M.astroSun);
    this.sunOrb.position.set(0.5, 0, 0);
    this.cosmicOrbit.add(this.sunOrb);
    // 8 sun rays around the sun
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const ray = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.astroSun);
      ray.position.set(0.5 + Math.cos(a) * 0.075, Math.sin(a) * 0.075, 0);
      ray.rotation.z = a - Math.PI / 2;
      this.cosmicOrbit.add(ray);
    }
    // Moon orb (crescent — full disc with shadow disc to make crescent)
    this.moonOrb = mesh(new THREE.SphereGeometry(0.05, 14, 12), M.astroMoon);
    this.moonOrb.position.set(-0.5, 0, 0);
    this.cosmicOrbit.add(this.moonOrb);
    // Shadow on the moon (crescent shape)
    const moonShadow = mesh(new THREE.SphereGeometry(0.045, 14, 12), M.astroMidnight);
    moonShadow.position.set(-0.46, 0, 0);
    this.cosmicOrbit.add(moonShadow);
    // Connecting star-trail (small stars between sun + moon along the orbit)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const star = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.astroStar);
      star.position.set(Math.cos(a) * 0.5, Math.sin(a * 2) * 0.04, Math.sin(a) * 0.5);
      this.cosmicOrbit.add(star);
    }
    root.add(this.cosmicOrbit);

    M.astroEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.astroEye;
  }

  _buildCrescentStaff() {
    const staff = new THREE.Group();
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.astroSilverHi);
    staff.add(pommel);
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.astroMidnightHi);
    haft.position.y = 0.74; staff.add(haft);
    // Silver bands + stars
    for (let i = 0; i < 7; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.astroSilver);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.2;
      staff.add(wrap);
      // Star between rings
      if (i < 6) {
        const star = mesh(new THREE.SphereGeometry(0.012, 6, 4), M.astroStar);
        star.position.set(0.025, 0.2 + i * 0.2, 0);
        staff.add(star);
      }
    }
    // Mid-haft star gem
    const midStar = mesh(new THREE.SphereGeometry(0.024, 12, 10), M.astroStar);
    midStar.position.y = 0.74;
    staff.add(midStar);
    // ===== CRESCENT MOON at the top (the marquee — large silver crescent) =====
    // Outer disc
    const moonOuter = mesh(new THREE.CircleGeometry(0.13, 24), M.astroMoon);
    moonOuter.position.y = 1.55;
    staff.add(moonOuter);
    // Inner shadow (creates the crescent shape)
    const moonInner = mesh(new THREE.CircleGeometry(0.115, 24), M.astroMidnight);
    moonInner.position.set(0.05, 1.55, 0.005);
    staff.add(moonInner);
    // Crescent rim highlight
    const moonRim = mesh(new THREE.TorusGeometry(0.13, 0.005, 8, 24), M.astroSilverHi);
    moonRim.position.y = 1.55;
    staff.add(moonRim);
    // 3 small floating stars near the moon
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + Math.PI / 4;
      const star = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.astroStar);
      star.position.set(Math.cos(a) * 0.16, 1.55 + Math.sin(a) * 0.16, 0);
      staff.add(star);
    }
    return staff;
  }

  _buildAstromancerHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Long silver hair (mage scholar look)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.astroSilver);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), M.astroSilver);
    backHair.scale.set(1.05, 1.4, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);

    // Eyes — starlight
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.astroEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Brows
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.astroSilver);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.15;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Calm mouth
    const mouth = mesh(new THREE.BoxGeometry(0.05, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // ===== POINTED STAR-CLUSTER HAT =====
    // Brim
    const brim = mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.022, 18), M.astroMidnightHi);
    brim.position.y = 0.13; head.add(brim);
    // Brim trim
    const brimTrim = mesh(new THREE.TorusGeometry(0.28, 0.01, 8, 24), M.astroSilverHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.118;
    head.add(brimTrim);
    // Tall hat cone
    const hatCone = mesh(new THREE.ConeGeometry(0.22, 0.7, 14), M.astroMidnight);
    hatCone.position.y = 0.5; head.add(hatCone);
    // Hat band
    const hatBand = mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.04, 16), M.astroSilver);
    hatBand.position.y = 0.18; head.add(hatBand);
    // Sun + moon on the band (front)
    const bandSun = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.astroSun);
    bandSun.position.set(-0.018, 0.18, 0.225); head.add(bandSun);
    const bandMoon = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.astroMoon);
    bandMoon.position.set(0.018, 0.18, 0.225); head.add(bandMoon);
    // Stars dotting the hat cone
    for (let i = 0; i < 10; i++) {
      const t = Math.random();
      const a = Math.random() * Math.PI * 2;
      const r = 0.22 - t * 0.18;
      const star = mesh(new THREE.SphereGeometry(0.008 + Math.random() * 0.005, 6, 4), M.astroStar);
      star.position.set(Math.cos(a) * r, 0.2 + t * 0.6, Math.sin(a) * r);
      head.add(star);
    }
    // Top star cluster (3 stars at the very tip)
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const star = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.astroStar);
      star.position.set(Math.cos(a) * 0.025, 0.85, Math.sin(a) * 0.025);
      head.add(star);
    }
    // Top tip needle
    const topNeedle = mesh(new THREE.ConeGeometry(0.012, 0.06, 4), M.astroSilverHi);
    topNeedle.position.y = 0.9;
    head.add(topNeedle);

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SANDWALKER — Far Lands V/VI                                             ║
// ║  Mirages · Blind · Sand-tan robes with desert face-veil, ★ curved      ║
// ║  khopesh sword ★, ★ TWO MIRAGE-TWINS flanking ★ (semi-transparent      ║
// ║  ghost-copies), sand-swirl cloak, mirage-cyan eye glow                 ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Sandwalker extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = sandwalkerAnimations;
  }

  // Override update — gently float the mirage twins (out of phase from each other)
  update(time, dt) {
    super.update(time, dt);
    if (this.mirageL) this.mirageL.position.y = this.mirageBaseY + Math.sin(time * 0.8) * 0.04;
    if (this.mirageR) this.mirageR.position.y = this.mirageBaseY + Math.sin(time * 0.8 + Math.PI) * 0.04;
  }

  build() {
    const root = this.group;

    // Legs — tan desert pants
    const buildSwLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.55, 14), M.sandTan);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.13, 0.18, 0.5, 14), M.sandTanHi);
      shin.position.y = 0.36; leg.add(shin);
      // Cream wrap-bands spiraling up
      for (let i = 0; i < 5; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.135, 0.008, 6, 14, Math.PI * 1.6), M.sandCream);
        wrap.rotation.x = Math.PI / 2 + 0.1;
        wrap.rotation.y = i * 0.4;
        wrap.position.y = 0.55 - i * 0.07;
        leg.add(wrap);
      }
      // Hem trim (gold)
      const hemTrim = mesh(new THREE.TorusGeometry(0.18, 0.012, 8, 18), M.sandGoldHi);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Sandals (visible foot wraps)
      const sole = mesh(new THREE.BoxGeometry(0.18, 0.04, 0.32), M.sandTanDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      // Foot
      const foot = mesh(new THREE.BoxGeometry(0.16, 0.04, 0.28), M.skin);
      foot.position.set(0, 0.1, 0.06); leg.add(foot);
      // Crisscross sandal straps
      for (let i = 0; i < 3; i++) {
        const strapL = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.12), M.sandTanDark);
        strapL.position.set(-0.04, 0.13, -0.02 + i * 0.07); strapL.rotation.z = 0.4;
        leg.add(strapL);
        const strapR = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.12), M.sandTanDark);
        strapR.position.set(0.04, 0.13, -0.02 + i * 0.07); strapR.rotation.z = -0.4;
        leg.add(strapR);
      }
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildSwLeg(-1));
    root.add(buildSwLeg(1));

    // Pelvis — gold belt with hanging sash
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.16, 16), M.sandTanDark));
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.1, 18), M.sandGoldHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Sun-disc buckle
    const buckle = mesh(new THREE.CircleGeometry(0.04, 18), M.sandGold);
    buckle.position.set(0, 0.04, 0.32); pelvis.add(buckle);
    // 8 small rays
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const ray = mesh(new THREE.ConeGeometry(0.005, 0.015, 4), M.sandGoldHi);
      ray.position.set(Math.cos(a) * 0.045, 0.04 + Math.sin(a) * 0.045, 0.325);
      ray.rotation.z = a - Math.PI / 2;
      pelvis.add(ray);
    }
    // Cyan rune at center
    const buckleRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.sandTeal);
    buckleRune.position.set(0, 0.04, 0.34);
    pelvis.add(buckleRune);
    // Long flowing hip-sash (the desert robe extends below the belt)
    const sash = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.5, 16), M.sandTan);
    sash.position.y = -0.3; pelvis.add(sash);
    // Cream hem trim
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.sandCream);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.52;
    pelvis.add(hemTrim2);
    // Decorative sun-rune sigils around the hem
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const sigil = mesh(new THREE.CircleGeometry(0.02, 12), M.sandGoldHi);
      sigil.position.set(Math.cos(a) * 0.4, -0.43, Math.sin(a) * 0.4);
      sigil.lookAt(Math.cos(a) * 2, -0.43, Math.sin(a) * 2);
      pelvis.add(sigil);
    }
    root.add(pelvis);

    // TORSO — sand-tan tunic with cream cross-wrap
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const tunic = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.sandTan);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);
    // Cream wrap (diagonal across chest)
    const wrap = mesh(new THREE.BoxGeometry(0.1, 0.65, 0.022), M.sandCream);
    wrap.position.set(-0.04, 0.0, 0.36); wrap.rotation.z = 0.4;
    torso.add(wrap);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.sandTanHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — eye of the desert (stylized eye with sun rays)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.sandTanDark);
    emblemBack.position.set(0.05, 0.22, 0.41); torso.add(emblemBack);
    // Eye-shape oval (gold)
    const eyeOval = mesh(new THREE.SphereGeometry(0.05, 14, 10), M.sandGoldHi);
    eyeOval.position.set(0.05, 0.22, 0.42); eyeOval.scale.set(1.4, 0.7, 0.4);
    torso.add(eyeOval);
    // Cyan iris
    const eyeIris = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.sandTeal);
    eyeIris.position.set(0.05, 0.22, 0.435); eyeIris.scale.set(1, 1, 0.4);
    torso.add(eyeIris);
    // Pupil
    const pupil = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.sandTanDark);
    pupil.position.set(0.05, 0.22, 0.445);
    torso.add(pupil);
    // 5 desert sun rays around the eye
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const ray = mesh(new THREE.BoxGeometry(0.012, 0.05, 0.005), M.sandGoldHi);
      ray.position.set(0.05 + Math.cos(a) * 0.085, 0.22 + Math.sin(a) * 0.085, 0.42);
      ray.rotation.z = a - Math.PI / 2;
      torso.add(ray);
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.sandTanDark);
    collar.position.y = 0.4; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.sandGoldHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.46;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft shoulders with gold trim
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.sandTanHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.sandGoldHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Gold sun-ornament on top
      const sunOrn = mesh(new THREE.CircleGeometry(0.025, 16), M.sandGoldHi);
      sunOrn.position.set(side * 0.42, 2.27, 0); sunOrn.rotation.x = -Math.PI / 2;
      root.add(sunOrn);
    }

    // Arms
    const armPalette = { cloth: M.sandTan, mid: M.sandTanHi, dark: M.sandTanDark, hi: M.sandCream, accent: M.sandGoldHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Cream silk wraps spiraling up the forearms
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 5; i++) {
        const w = mesh(new THREE.TorusGeometry(0.094, 0.008, 6, 14, Math.PI * 1.6), M.sandCream);
        w.rotation.x = Math.PI / 2 + 0.1;
        w.rotation.y = i * 0.5;
        w.position.y = -0.5 - i * 0.08;
        arm.add(w);
      }
      // Gold wrist bracelet
      const bracelet = mesh(new THREE.TorusGeometry(0.092, 0.012, 6, 14), M.sandGoldHi);
      bracelet.rotation.x = Math.PI / 2; bracelet.position.y = -0.85;
      arm.add(bracelet);
    });

    // KHOPESH SWORD (curved Egyptian sickle-sword) — held in right hand
    const khopesh = this._buildKhopesh();
    rightArm.userData.hand.add(khopesh);
    khopesh.position.set(0, 0.04, 0.06);
    khopesh.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = khopesh;

    // Sand-swirl cape (light, flowing)
    const cape = buildCape({ material: M.sandCream, width: 1.4, height: 1.85 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.sandGoldHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.7, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — desert face-veil + headdress
    const head = this._buildSandwalkerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== TWO MIRAGE-TWIN COPIES — semi-transparent ghosts flanking the sandwalker (the marquee feature) =====
    this.mirageBaseY = 0;
    this.mirageL = this._buildMirageTwin();
    this.mirageL.position.set(-1.2, this.mirageBaseY, 0.1);
    root.add(this.mirageL);
    this.mirageR = this._buildMirageTwin();
    this.mirageR.position.set(1.2, this.mirageBaseY, 0.1);
    this.mirageR.scale.x = -1; // mirror
    root.add(this.mirageR);

    M.sandEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.sandEye;
  }

  _buildKhopesh() {
    const k = new THREE.Group();
    // Pommel
    const pommel = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.sandGoldHi);
    k.add(pommel);
    // Brown grip wrap
    const grip = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.18, 10), M.sandTanDark);
    grip.position.y = 0.1; k.add(grip);
    // Cream cord wraps
    for (let i = 0; i < 5; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.02, 0.0035, 5, 10), M.sandCream);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.05 + i * 0.03;
      k.add(wrap);
    }
    // Gold crossguard
    const cross = mesh(new THREE.BoxGeometry(0.1, 0.018, 0.022), M.sandGoldHi);
    cross.position.y = 0.21; k.add(cross);
    // BLADE — first goes straight up then curves into a sickle
    // Straight portion
    const straight = mesh(new THREE.BoxGeometry(0.024, 0.32, 0.014), M.sandGoldHi);
    straight.position.y = 0.4; k.add(straight);
    // Sickle curve (using extruded arc shape)
    const sickleShape = new THREE.Shape();
    sickleShape.moveTo(-0.012, 0); sickleShape.lineTo(0.012, 0);
    sickleShape.bezierCurveTo(0.5, 0.05, 0.6, 0.4, 0.3, 0.6);
    sickleShape.bezierCurveTo(0.32, 0.4, 0.18, 0.15, 0.0, 0.05);
    sickleShape.closePath();
    const sickle = mesh(new THREE.ExtrudeGeometry(sickleShape, { depth: 0.018, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.003, bevelSegments: 1 }), M.sandGoldHi);
    sickle.position.set(0, 0.55, -0.009); sickle.scale.set(0.7, 0.7, 1);
    k.add(sickle);
    // Cyan rune-engraving along the spine
    const inscription = mesh(new THREE.BoxGeometry(0.005, 0.28, 0.003), M.sandTeal);
    inscription.position.set(0, 0.4, 0.012);
    k.add(inscription);
    return k;
  }

  _buildMirageTwin() {
    const twin = new THREE.Group();
    // Body shape (silhouette of the sandwalker — translucent)
    // Torso (cylinder, semi-transparent cyan)
    const tBody = mesh(new THREE.CylinderGeometry(0.34, 0.32, 1.0, 16), M.sandMirage);
    tBody.position.y = 1.85;
    twin.add(tBody);
    // Legs
    for (let s = -1; s <= 1; s += 2) {
      const leg = mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.95, 12), M.sandMirage);
      leg.position.set(s * 0.18, 0.7, 0);
      twin.add(leg);
    }
    // Arms
    for (let s = -1; s <= 1; s += 2) {
      const arm = mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.8, 10), M.sandMirage);
      arm.position.set(s * 0.42, 1.6, 0);
      twin.add(arm);
    }
    // Head
    const tHead = mesh(new THREE.SphereGeometry(0.21, 16, 12), M.sandMirage);
    tHead.position.y = 2.52;
    twin.add(tHead);
    // Eyes (bright cyan dots)
    const tEyeL = mesh(new THREE.SphereGeometry(0.02, 8, 6), M.sandTeal);
    tEyeL.position.set(-0.075, 2.54, 0.21); twin.add(tEyeL);
    const tEyeR = tEyeL.clone(); tEyeR.position.x = 0.075; twin.add(tEyeR);
    // Subtle gold accents (echoing the original's gear)
    const beltAccent = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.06, 18), M.sandGoldHi);
    beltAccent.position.y = 1.32;
    twin.add(beltAccent);
    return twin;
  }

  _buildSandwalkerHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Long dark hair tucked under headwrap (only barely visible at back)
    const backHair = mesh(new THREE.SphereGeometry(0.21, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), M.sandTanDark);
    backHair.position.set(0, -0.05, -0.06); backHair.scale.set(1.0, 1.0, 1.05);
    head.add(backHair);

    // ===== HEADWRAP / TURBAN — wraps around the head =====
    // Main turban body
    const turban = mesh(new THREE.SphereGeometry(0.23, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.6), M.sandCream);
    turban.position.set(0, 0.02, 0);
    head.add(turban);
    // Wraps around the turban (visible texture)
    for (let i = 0; i < 4; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.22 - i * 0.005, 0.014, 6, 24, Math.PI * 1.2), M.sandTan);
      wrap.rotation.x = Math.PI / 2.1;
      wrap.rotation.y = -Math.PI / 2 + i * 0.3;
      wrap.position.y = 0.04 + i * 0.04;
      head.add(wrap);
    }
    // Gold star ornament on the turban's front
    const turbanGem = mesh(new THREE.CircleGeometry(0.04, 8), M.sandGoldHi);
    turbanGem.position.set(0, 0.12, 0.21); head.add(turbanGem);
    // 5-point star inside
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const ray = mesh(new THREE.ConeGeometry(0.006, 0.018, 4), M.sandGold);
      ray.position.set(Math.cos(a) * 0.022, 0.12 + Math.sin(a) * 0.022, 0.215);
      ray.rotation.z = a - Math.PI / 2;
      head.add(ray);
    }
    // Cyan rune-gem at center of star
    const turbanRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.sandTeal);
    turbanRune.position.set(0, 0.12, 0.22); head.add(turbanRune);

    // ===== DESERT FACE-VEIL — covers nose/mouth (lower face) =====
    const veilShape = new THREE.Shape();
    veilShape.moveTo(-0.16, 0); veilShape.lineTo(0.16, 0);
    veilShape.bezierCurveTo(0.18, -0.1, 0.08, -0.2, 0, -0.21);
    veilShape.bezierCurveTo(-0.08, -0.2, -0.18, -0.1, -0.16, 0);
    veilShape.closePath();
    const veil = mesh(new THREE.ExtrudeGeometry(veilShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 2 }), M.sandCream);
    veil.position.set(0, -0.05, 0.13);
    head.add(veil);
    // Veil tail (a piece of fabric flowing down the side)
    const veilTail = mesh(new THREE.BoxGeometry(0.08, 0.18, 0.012), M.sandCream);
    veilTail.position.set(0.18, -0.08, -0.05); veilTail.rotation.z = -0.2;
    head.add(veilTail);

    // Eyes — mirage-cyan glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.sandEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Dark eye-paint stripes (kohl) extending past the eyes
    for (let side = -1; side <= 1; side += 2) {
      const liner = mesh(new THREE.BoxGeometry(0.06, 0.005, 0.005), M.sandTanDark);
      liner.position.set(side * 0.12, -0.02, 0.21); liner.rotation.z = side * -0.15;
      head.add(liner);
    }

    return head;
  }
}

Sandwalker._sandBurst = function(champ, mgr, time) {
  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  // Random position around the champion
  const a = Math.random() * Math.PI * 2;
  const r = 0.5 + Math.random() * 1.6;
  const pos = new THREE.Vector3(champPos.x + Math.cos(a) * r, 1.3, champPos.z + Math.sin(a) * r);
  mgr.spawn(new ParticleBurst(champ.scene, pos, { color: 0xc89858, count: 30, speed: 4, duration: 1.0, upwardBias: 1.0, gravity: -1.0 }), time);
  mgr.spawn(new ParticleBurst(champ.scene, pos, { color: 0x80f0e0, count: 16, speed: 3, duration: 1.0, upwardBias: 0.8, gravity: -0.8 }), time);
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  VOIDCALLER — Far Lands VI/VI                                            ║
// ║  Risk/Reward Dark Magic · Void-black robes with crackling purple-veins, ║
// ║  ★ writhing tentacle-tendrils from the back ★, ★ abyss-orb staff ★,    ║
// ║  hooded gaunt face, void-magenta eye glow                              ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Voidcaller extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = voidcallerAnimations;
  }

  // Override update — writhe the tentacles + pulse the void orb
  update(time, dt) {
    super.update(time, dt);
    if (this.tentacles) {
      this.tentacles.forEach((t, i) => {
        // Each tentacle has its own writhing phase
        t.rotation.x = -0.2 + Math.sin(time * 1.0 + i * 0.6) * 0.18;
        t.rotation.z = Math.sin(time * 0.8 + i * 0.9) * 0.22;
      });
    }
    if (this.voidOrb) {
      this.voidOrb.scale.setScalar(1 + Math.sin(time * 1.6) * 0.07);
    }
  }

  build() {
    const root = this.group;

    // Legs — void-black robes
    const buildVcLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.voidBlack);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.voidBlackHi);
      shin.position.y = 0.36; leg.add(shin);
      // Void-crack glowing line down the leg (vertical)
      const crackLine = mesh(new THREE.BoxGeometry(0.005, 0.6, 0.004), M.voidCrack);
      crackLine.position.set(sx * 0.05, 0.6, 0.18);
      leg.add(crackLine);
      // Smaller crack branches
      for (let i = 0; i < 3; i++) {
        const branch = mesh(new THREE.BoxGeometry(0.014, 0.005, 0.004), M.voidCrack);
        branch.position.set(sx * 0.05 + sx * 0.018 * (i % 2 === 0 ? 1 : -1), 0.7 - i * 0.18, 0.18);
        leg.add(branch);
      }
      // Hem trim (void purple)
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.voidPurpleHi);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Ragged jagged hem
      for (let i = -1; i <= 1; i++) {
        const tatter = mesh(new THREE.ConeGeometry(0.03, 0.08, 4), M.voidPurple);
        tatter.position.set(i * 0.07, 0.16, 0.22);
        tatter.rotation.x = Math.PI;
        leg.add(tatter);
      }
      // Sole
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.voidBlack);

    root.add(buildVcLeg(-1));

    // Pelvis — void-black with purple-crack belt

    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.voidPurple);
    belt.position.y = 0.04; pelvis.add(belt);
    // Void buckle (black with magenta crack)
    const buckleBack = mesh(new THREE.BoxGeometry(0.06, 0.05, 0.018), M.voidBlackHi);
    buckleBack.position.set(0, 0.04, 0.32); pelvis.add(buckleBack);
    // Crack running through the buckle
    const buckleCrack = mesh(new THREE.BoxGeometry(0.06, 0.005, 0.005), M.voidCrack);
    buckleCrack.position.set(0, 0.04, 0.34); buckleCrack.rotation.z = 0.3;
    pelvis.add(buckleCrack);
    // Hanging void-shard charms
    for (let i = -2; i <= 2; i++) {
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.05, 4), M.voidPurple);
      cord.position.set(i * 0.06, -0.04, 0.31);
      pelvis.add(cord);
      // Jagged void crystal
      const shard = mesh(new THREE.OctahedronGeometry(0.015, 0), M.voidCrack);
      shard.position.set(i * 0.06, -0.1, 0.31); shard.scale.set(0.7, 1.4, 0.7);
      pelvis.add(shard);
    }
    // Robe drape
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.voidBlack);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    // Cracking glowing veins running through the lower robe
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const vein = mesh(new THREE.BoxGeometry(0.005, 0.3, 0.005), M.voidCrack);
      vein.position.set(Math.cos(a) * 0.36, -0.28, Math.sin(a) * 0.36);
      vein.rotation.y = -a;
      vein.rotation.x = (Math.random() - 0.5) * 0.1;
      pelvis.add(vein);
    }
    // Ragged jagged hem
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const tatter = mesh(new THREE.ConeGeometry(0.025, 0.08 + Math.random() * 0.04, 4), M.voidPurple);
      tatter.position.set(Math.cos(a) * 0.4, -0.45, Math.sin(a) * 0.4);
      tatter.rotation.x = Math.PI;
      tatter.rotation.z = (Math.random() - 0.5) * 0.3;
      pelvis.add(tatter);
    }
    root.add(pelvis);

    // TORSO — void-black robe with crack patterns
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.voidBlack);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.voidBlackHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CRACKING VOID-VEINS across the chest (the marquee surface detail)
    // Main vertical crack
    const mainCrack = mesh(new THREE.BoxGeometry(0.012, 0.65, 0.005), M.voidCrack);
    mainCrack.position.set(0, 0.0, 0.36); torso.add(mainCrack);
    // Branching cracks
    for (let i = -1; i <= 1; i += 2) {
      // Diagonal branches at chest level
      const branch1 = mesh(new THREE.BoxGeometry(0.005, 0.18, 0.004), M.voidCrack);
      branch1.position.set(i * 0.08, 0.15, 0.36);
      branch1.rotation.z = -i * Math.PI / 4;
      torso.add(branch1);
      // Smaller branches at hip level
      const branch2 = mesh(new THREE.BoxGeometry(0.005, 0.14, 0.004), M.voidCrack);
      branch2.position.set(i * 0.06, -0.18, 0.36);
      branch2.rotation.z = -i * Math.PI / 5;
      torso.add(branch2);
      // Tertiary tiny branches
      const branch3 = mesh(new THREE.BoxGeometry(0.004, 0.08, 0.003), M.voidCrack);
      branch3.position.set(i * 0.14, 0.05, 0.36);
      branch3.rotation.z = i * 0.6;
      torso.add(branch3);
    }
    // Glow-spots at junctions (where cracks meet)
    const junctions = [[0, 0.15], [0, -0.18], [0, 0.05], [0, -0.05]];
    junctions.forEach(j => {
      const dot = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.voidCrack);
      dot.position.set(j[0], j[1], 0.37);
      torso.add(dot);
    });

    // CHEST EMBLEM — void eye (a single black eye with magenta iris)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.voidBlackHi);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // Eye-oval
    const eyeOval = mesh(new THREE.SphereGeometry(0.05, 14, 10), M.voidPurpleHi);
    eyeOval.position.set(0, 0.22, 0.42); eyeOval.scale.set(1.4, 0.7, 0.4);
    torso.add(eyeOval);
    // Magenta iris
    const eyeIris = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.voidCrack);
    eyeIris.position.set(0, 0.22, 0.435); eyeIris.scale.set(1, 1, 0.4);
    torso.add(eyeIris);
    // Black slit pupil (vertical slit — eldritch look)
    const pupil = mesh(new THREE.BoxGeometry(0.005, 0.022, 0.003), M.voidBlack);
    pupil.position.set(0, 0.22, 0.45);
    torso.add(pupil);
    // Crack-rays radiating outward from the eye
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const ray = mesh(new THREE.BoxGeometry(0.004, 0.04, 0.004), M.voidCrack);
      ray.position.set(Math.cos(a) * 0.08, 0.22 + Math.sin(a) * 0.08, 0.42);
      ray.rotation.z = a - Math.PI / 2;
      torso.add(ray);
    }

    // Collar (high)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.16, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.voidBlackHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarCrack = mesh(new THREE.TorusGeometry(0.21, 0.008, 8, 18, Math.PI * 1.2), M.voidCrack);
    collarCrack.rotation.x = Math.PI / 2;
    collarCrack.rotation.y = -Math.PI / 2;
    collarCrack.position.y = 0.5;
    torso.add(collarCrack);

    root.add(torso);
    this.parts.body = torso;

    // Shoulder caps with void-shard spikes
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.voidBlackHi);
      cap.scale.set(1.05, 0.85, 1);
      cap.position.set(side * 0.42, 2.2, 0);
      root.add(cap);
      // 3 jagged void-shards on top of each shoulder
      for (let i = -1; i <= 1; i++) {
        const shard = mesh(new THREE.OctahedronGeometry(0.024, 0), M.voidCrack);
        shard.position.set(side * 0.42 + i * 0.04, 2.32 + Math.abs(i) * 0.02, 0);
        shard.scale.set(0.7, 1.5, 0.7);
        root.add(shard);
      }
    }

    // Arms
    const armPalette = { cloth: M.voidBlack, mid: M.voidBlackHi, dark: M.voidBlack, hi: M.voidPurpleHi, accent: M.voidCrack };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Glowing crack-veins along each arm
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.voidBlackHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.voidCrack);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Crack-vein down the forearm
      const vein = mesh(new THREE.BoxGeometry(0.005, 0.4, 0.005), M.voidCrack);
      vein.position.set(0, -0.62, 0.09);
      arm.add(vein);
      // Bone-claw fingertips
      for (let i = 0; i < 4; i++) {
        const claw = mesh(new THREE.ConeGeometry(0.012, 0.05, 4), M.voidCrack);
        claw.position.set((i - 1.5) * 0.025, -1.0, 0.04);
        claw.rotation.x = Math.PI;
        arm.add(claw);
      }
    });

    // ABYSS-ORB STAFF — held in right hand
    const staff = this._buildAbyssStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // Tattered void-cape
    const cape = buildCape({ material: M.voidBlackHi, width: 1.45, height: 2.0 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    // Crack-glow trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.voidCrack);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.55, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // Ragged jagged tattered fringes
    for (let i = -3; i <= 3; i++) {
      const tatter = mesh(new THREE.ConeGeometry(0.025, 0.12, 4), M.voidPurple);
      tatter.position.set(i * 0.16, 0.5, -0.13);
      tatter.rotation.x = Math.PI;
      root.add(tatter);
    }

    // Neck (pale skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — void-cowl + gaunt face
    const head = this._buildVoidcallerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== TENTACLE-TENDRILS emerging from the BACK (the marquee feature) =====
    this.tentacles = [];
    const tendrilPositions = [
      { x: -0.32, y: 2.05, z: -0.32, length: 0.7 },
      { x: -0.18, y: 2.20, z: -0.36, length: 0.85 },
      { x: 0.0, y: 2.30, z: -0.38, length: 1.0 },
      { x: 0.18, y: 2.20, z: -0.36, length: 0.85 },
      { x: 0.32, y: 2.05, z: -0.32, length: 0.7 },
    ];
    tendrilPositions.forEach((td, idx) => {
      const tentacle = new THREE.Group();
      tentacle.position.set(td.x, td.y, td.z);
      // Build segments along the tendril
      const segs = 6;
      for (let s = 0; s < segs; s++) {
        const t = s / segs;
        const seg = mesh(new THREE.SphereGeometry(0.04 - t * 0.025, 10, 8), s % 2 === 0 ? M.voidTendril : M.voidTendrilHi);
        // Position along an upward + backward curve
        const ax = (idx - 2) * 0.04 + Math.sin(t * Math.PI) * (idx - 2) * 0.03;
        seg.position.set(ax, t * td.length, -t * td.length * 0.3);
        tentacle.add(seg);
      }
      // Glowing tip
      const tip = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.voidCrack);
      tip.position.set((idx - 2) * 0.04 + Math.sin(Math.PI) * (idx - 2) * 0.03, td.length, -td.length * 0.3);
      tentacle.add(tip);
      // Sucker-bumps along the underside (3 per tentacle)
      for (let s = 0; s < 3; s++) {
        const t = (s + 1) / 4;
        const sucker = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.voidPurpleHi);
        sucker.position.set((idx - 2) * 0.04 + Math.sin(t * Math.PI) * (idx - 2) * 0.03, t * td.length, -t * td.length * 0.3 - 0.025);
        tentacle.add(sucker);
      }
      root.add(tentacle);
      this.tentacles.push(tentacle);
    });

    M.voidEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.voidEye;
  }

  _buildAbyssStaff() {
    const staff = new THREE.Group();
    // Pommel — bone-bone end
    const pommel = mesh(new THREE.OctahedronGeometry(0.034, 0), M.voidPurpleHi);
    pommel.scale.y = 0.8;
    staff.add(pommel);
    // Twisted black haft
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.028, 1.4, 8), M.voidBlackHi);
    haft.position.y = 0.74; staff.add(haft);
    // Crack-vein running up the haft
    const haftCrack = mesh(new THREE.BoxGeometry(0.005, 1.4, 0.004), M.voidCrack);
    haftCrack.position.set(0.022, 0.74, 0); haftCrack.rotation.z = 0.05;
    staff.add(haftCrack);
    // Twisted bumps along the haft (gnarly tentacle-like)
    for (let i = 0; i < 5; i++) {
      const knot = mesh(new THREE.SphereGeometry(0.04, 10, 8), M.voidPurple);
      knot.position.y = 0.2 + i * 0.22; knot.scale.set(1.1, 0.7, 1.1);
      staff.add(knot);
    }
    // Top section — claw-cradle holding the abyss-orb
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.06, 12), M.voidPurpleHi);
    cradle.position.y = 1.46; staff.add(cradle);
    // 5 black claw-spines curving up to hold the orb
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const claw = mesh(new THREE.CylinderGeometry(0.012, 0.005, 0.18, 6), M.voidPurple);
      claw.position.set(Math.cos(a) * 0.05, 1.55, Math.sin(a) * 0.05);
      claw.rotation.z = -Math.cos(a) * 0.5;
      claw.rotation.x = -Math.sin(a) * 0.5;
      staff.add(claw);
    }
    // ===== ABYSS ORB at the top (the marquee — pulsing void sphere) =====
    this.voidOrb = mesh(new THREE.SphereGeometry(0.085, 16, 14), M.voidOrb);
    this.voidOrb.position.y = 1.65;
    staff.add(this.voidOrb);
    // Inner darkness (smaller sphere)
    const orbCore = mesh(new THREE.SphereGeometry(0.05, 12, 10), M.voidBlack);
    orbCore.position.y = 1.65; staff.add(orbCore);
    // Crack-veins through the orb (3)
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const orbCrack = mesh(new THREE.BoxGeometry(0.005, 0.16, 0.004), M.voidCrack);
      orbCrack.position.set(Math.cos(a) * 0.04, 1.65, Math.sin(a) * 0.04);
      orbCrack.rotation.z = a;
      staff.add(orbCrack);
    }
    // Tiny tendrils emerging from the orb (4 short curling tendrils)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const tinyTendril = mesh(new THREE.ConeGeometry(0.012, 0.08, 5), M.voidPurple);
      tinyTendril.position.set(Math.cos(a) * 0.1, 1.7 + Math.sin(a * 2) * 0.02, Math.sin(a) * 0.1);
      tinyTendril.rotation.z = -Math.cos(a) * 0.4;
      tinyTendril.rotation.x = -Math.sin(a) * 0.4;
      staff.add(tinyTendril);
    }
    return staff;
  }

  _buildVoidcallerHead() {
    const head = new THREE.Group();
    // Pale gaunt face
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.9, 1.0, 0.95);
    head.add(face);

    // ===== VOID HOOD — pulled up =====
    const hood = mesh(new THREE.SphereGeometry(0.28, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.voidBlack);
    hood.scale.set(1.1, 1.2, 1.2);
    hood.position.set(0, 0.04, -0.02);
    head.add(hood);
    // Inner lining (purple-glowing)
    const hoodLining = mesh(new THREE.SphereGeometry(0.265, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.voidPurpleHi);
    hoodLining.scale.set(1.08, 1.18, 1.18);
    hoodLining.position.set(0, 0.04, -0.02);
    head.add(hoodLining);
    // Crack-veins on the hood exterior
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 0.8 - Math.PI * 0.4;
      const crack = mesh(new THREE.BoxGeometry(0.005, 0.22, 0.005), M.voidCrack);
      crack.position.set(Math.cos(a + Math.PI / 2) * 0.28, 0.18, Math.sin(a + Math.PI / 2) * 0.28);
      crack.rotation.y = -(a + Math.PI / 2);
      crack.rotation.x = -0.4;
      head.add(crack);
    }
    // Pointed hood tip behind
    const hoodTip = mesh(new THREE.ConeGeometry(0.05, 0.16, 8), M.voidBlack);
    hoodTip.position.set(0, 0.32, -0.18); hoodTip.rotation.x = -0.4;
    head.add(hoodTip);

    // Eyes — void-magenta glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.voidBlack);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.voidEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Crack-vein running from one eye down the cheek (eldritch feature)
    const cheekCrack = mesh(new THREE.BoxGeometry(0.004, 0.1, 0.004), M.voidCrack);
    cheekCrack.position.set(-0.075, -0.08, 0.215); cheekCrack.rotation.z = 0.18;
    head.add(cheekCrack);

    // Pale gaunt cheekbones
    for (let side = -1; side <= 1; side += 2) {
      const cheek = mesh(new THREE.SphereGeometry(0.04, 10, 8), M.voidBlack);
      cheek.position.set(side * 0.13, -0.07, 0.18); cheek.scale.set(1, 1.2, 0.4);
      head.add(cheek);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skinPale);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Grim mouth
    const mouth = mesh(new THREE.BoxGeometry(0.05, 0.005, 0.005), M.voidBlack);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Forehead void-rune mark
    const browRune = mesh(new THREE.OctahedronGeometry(0.022, 0), M.voidCrack);
    browRune.position.set(0, 0.05, 0.21); browRune.scale.set(1, 1.4, 0.4);
    head.add(browRune);

    return head;
  }
}

        mgr.spawn(new ParticleBurst(champ.scene, chestPos, { color: 0xc060f0, count: 50, speed: 3, duration: 1.2, upwardBias: 0.4, gravity: 0.3 }), time);
        // Void dome around the voidcaller (the buffed state)
        mgr.spawn(new EnergyDome(champ.scene, groundPos, { color: 0x9020c0, radius: 1.5, duration: 1.3 }), time);
        // Light pillar
        mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0xc060f0, height: 4.0, radius: 0.5, duration: 0.8 }), time);
      }},
    ],
  },
  // ABYSSAL MAW — channeled pull + AoE mag (costs HP per tick)
  spell2: {
    duration: 2.0,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.18, values: { leftArm: { rx: 0.85, rz: -0.65 }, rightArm: { rx: 0.85, rz: 0.65 }, body: { rx: -0.05 }, head: { rx: -0.06 } }, ease: ease.outBack },
      { t: 0.85, values: { leftArm: { rx: 0.85, rz: -0.65 }, rightArm: { rx: 0.85, rz: 0.65 }, body: { rx: -0.05 } }},
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.18, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const mawPos = new THREE.Vector3(champPos.x, 0.12, champPos.z + 1.6);
        // Big void-rune (the abyss opening)
        mgr.spawn(new RuneRing(champ.scene, mawPos, { color: 0x9020c0, maxRadius: 2.4, duration: 1.9, runeCount: 12, rotateSpeed: 1.4 }), time);
        // Dark void pit (energy dome but inverted — pulling things in)
        mgr.spawn(new EnergyDome(champ.scene, mawPos, { color: 0x402060, radius: 1.8, duration: 1.8 }), time);
      }},
      // Continuous tick effects (AoE drain pulses)
      { time: 0.4, fn: (champ, mgr, time) => Voidcaller._mawTick(champ, mgr, time) },
      { time: 0.55, fn: (champ, mgr, time) => Voidcaller._mawTick(champ, mgr, time) },
      { time: 0.7, fn: (champ, mgr, time) => Voidcaller._mawTick(champ, mgr, time) },
      { time: 0.85, fn: (champ, mgr, time) => Voidcaller._mawTick(champ, mgr, time) },
    ],
  },
};

Voidcaller._mawTick = function(champ, mgr, time) {
  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  const mawPos = new THREE.Vector3(champPos.x, 0.12, champPos.z + 1.6);
  // Pulse impact at maw center
  mgr.spawn(new ImpactFlash(champ.scene, new THREE.Vector3(mawPos.x, 0.5, mawPos.z), { color: 0xc060f0, maxScale: 0.6, duration: 0.4 }), time);
  // Inward-spiraling particles (the pull effect)
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const r = 1.6;
    const startPos = new THREE.Vector3(mawPos.x + Math.cos(a) * r, 1.0, mawPos.z + Math.sin(a) * r);
    mgr.spawn(new ParticleBurst(champ.scene, startPos, { color: 0xc060f0, count: 12, speed: 3, duration: 0.6, upwardBias: -0.6, gravity: 0.5 }), time);
  }
  // Self-tick HP drain visual (small purple flash on chest)
  const chestPos = new THREE.Vector3(champPos.x, 1.85, champPos.z);
  mgr.spawn(new ImpactFlash(champ.scene, chestPos, { color: 0x9020c0, maxScale: 0.3, duration: 0.4 }), time);
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  VIEWER — preview-only setup                                             ║
// ║  CC: ignore everything below this line — game runtime doesn't need it.  ║
// ╚══════════════════════════════════════════════════════════════════════════╝

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
scene.fog = new THREE.Fog(0x05060c, 9, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 2.4, 5.8);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.45, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

// ─── Lighting (3-point + counter-rim) ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x4a4a5a, 0.32));
const key = new THREE.DirectionalLight(0xfff0d8, 1.6);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8090c8, 0.55);
fill.position.set(-4, 4, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffaa50, 0.85);
rim.position.set(-2, 3, -5);
scene.add(rim);
const rimAmber = new THREE.PointLight(0xff8030, 1.2, 8, 1.5);
rimAmber.position.set(0, 1.7, -2.2);
scene.add(rimAmber);

// ─── Dais ─────────────────────────────────────────────────────────────────
const daisGroup = new THREE.Group();
const daisBase = mesh(new THREE.CylinderGeometry(2.2, 2.5, 0.18, 64), M.stone, { receive: true });
daisBase.position.y = 0.04; daisGroup.add(daisBase);
const daisTop = mesh(new THREE.CylinderGeometry(2.0, 2.05, 0.06, 64), M.stoneDark, { receive: true });
daisTop.position.y = 0.16; daisGroup.add(daisTop);
const daisRing = mesh(new THREE.TorusGeometry(2.0, 0.04, 12, 64), M.brass);
daisRing.rotation.x = Math.PI / 2; daisRing.position.y = 0.19; daisGroup.add(daisRing);
// 8 small runic engravings around the dais
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const rune = mesh(new THREE.BoxGeometry(0.18, 0.005, 0.04), M.stoneRune);
  rune.position.set(Math.cos(a) * 1.85, 0.195, Math.sin(a) * 1.85);
  rune.rotation.y = -a + Math.PI / 2;
  daisGroup.add(rune);
}
// Subtle cracks
for (let i = 0; i < 6; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.5 + Math.random() * 1.3;
  const crack = mesh(new THREE.BoxGeometry(0.4 + Math.random() * 0.4, 0.001, 0.012), M.stoneDark);
  crack.position.set(Math.cos(a) * r, 0.193, Math.sin(a) * r);
  crack.rotation.y = Math.random() * Math.PI;
  daisGroup.add(crack);
}
scene.add(daisGroup);

// ─── Aura ring (color-tinted per class) ───────────────────────────────────
const auraGeo = new THREE.RingGeometry(2.05, 2.35, 96, 1);
const auraMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8020) }, uOpacity: { value: 0.55 } },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xy);
      float a = atan(vPos.y, vPos.x);
      float pulse = 0.55 + 0.45 * sin(uTime * 1.2 + a * 4.0);
      float band = smoothstep(2.05, 2.18, r) * smoothstep(2.35, 2.18, r);
      gl_FragColor = vec4(uColor * pulse * 1.4, band * uOpacity * pulse);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});
const aura = new THREE.Mesh(auraGeo, auraMat);
aura.rotation.x = -Math.PI / 2;
aura.position.y = 0.205;
scene.add(aura);

// ─── Floating embers ──────────────────────────────────────────────────────
const EMBER_COUNT = 220;
const emberPositions = new Float32Array(EMBER_COUNT * 3);
const emberSeeds = new Float32Array(EMBER_COUNT);
for (let i = 0; i < EMBER_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4.5;
  emberPositions[i*3 + 0] = Math.cos(a) * r;
  emberPositions[i*3 + 1] = Math.random() * 4.5;
  emberPositions[i*3 + 2] = Math.sin(a) * r;
  emberSeeds[i] = Math.random();
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('seed', new THREE.Float32BufferAttribute(emberSeeds, 1));
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

// ─── Post-processing ──────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.78, 0.4, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ───────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Class registry ───────────────────────────────────────────────────────
const classRegistry = {
  engineer: {
    name: 'Engineer',
    family: 'Far Lands · I/VI',
    role: 'Turrets · Traps · Tinkerer',
    accent: '#ffb840',
    accentGlow: 'rgba(255, 184, 64, 0.5)',
    auraColor: 0xf0a020,
    emberColor: new THREE.Color(1.0, 0.7, 0.25),
    abilities: { attack: 'Wrench Toss', spell1: 'Deploy Turret', spell2: 'Spike Trap' },
    factory: () => new Engineer(scene, new THREE.Vector3(0, 0, 0)),
  },
  alchemist: {
    name: 'Alchemist',
    family: 'Far Lands · II/VI',
    role: 'Potions · Transmutation',
    accent: '#70e0a0',
    accentGlow: 'rgba(112, 224, 160, 0.5)',
    auraColor: 0x40c080,
    emberColor: new THREE.Color(0.45, 0.85, 0.6),
    abilities: { attack: 'Acid Splash', spell1: 'Healing Elixir', spell2: 'Volatile Mixture' },
    factory: () => new Alchemist(scene, new THREE.Vector3(0, 0, 0)),
  },
  beastmaster: {
    name: 'Beastmaster',
    family: 'Far Lands · III/VI',
    role: 'Multi-Pet · Pack Leader',
    accent: '#ff7878',
    accentGlow: 'rgba(255, 120, 120, 0.5)',
    auraColor: 0xff5050,
    emberColor: new THREE.Color(1.0, 0.4, 0.4),
    abilities: { attack: 'Whip Crack', spell1: 'Pack Hunt', spell2: 'Bear Companion' },
    factory: () => new Beastmaster(scene, new THREE.Vector3(0, 0, 0)),
  },
  astromancer: {
    name: 'Astromancer',
    family: 'Far Lands · IV/VI',
    role: 'Star Alignments · Cosmic Cycle',
    accent: '#a0c0ff',
    accentGlow: 'rgba(160, 192, 255, 0.5)',
    auraColor: 0x80a0ff,
    emberColor: new THREE.Color(0.7, 0.78, 1.0),
    abilities: { attack: 'Star Shard', spell1: 'Solar Flare', spell2: 'Lunar Veil' },
    factory: () => new Astromancer(scene, new THREE.Vector3(0, 0, 0)),
  },
  sandwalker: {
    name: 'Sandwalker',
    family: 'Far Lands · V/VI',
    role: 'Mirages · Blind · Sandstorm',
    accent: '#80f0e0',
    accentGlow: 'rgba(128, 240, 224, 0.5)',
    auraColor: 0x60d0c0,
    emberColor: new THREE.Color(0.5, 0.92, 0.85),
    abilities: { attack: 'Sand Slash', spell1: 'Mirage', spell2: 'Sandstorm' },
    factory: () => new Sandwalker(scene, new THREE.Vector3(0, 0, 0)),
  },
  voidcaller: {
    name: 'Voidcaller',
    family: 'Far Lands · VI/VI',
    role: 'Risk/Reward Dark Magic · From Below',
    accent: '#c060f0',
    accentGlow: 'rgba(192, 96, 240, 0.5)',
    auraColor: 0x9020c0,
    emberColor: new THREE.Color(0.75, 0.4, 0.95),
    abilities: { attack: 'Void Bolt', spell1: 'Sacrifice', spell2: 'Abyssal Maw' },
    factory: () => new Voidcaller(scene, new THREE.Vector3(0, 0, 0)),
  },
};

// ─── Build all champions up front (single per class — viewer only shows one)
const champions = {};
for (const key in classRegistry) {
  const champ = classRegistry[key].factory();
  champ.group.visible = false;
  champions[key] = champ;
}
let activeChampion = champions.engineer;
activeChampion.group.visible = true;

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

// ─── UI wiring ────────────────────────────────────────────────────────────
document.getElementById('classSelect').addEventListener('change', (e) => {
  selectClass(e.target.value);
});

const abilityButtons = document.querySelectorAll('.ab-btn');
abilityButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeChampion || activeChampion.isPlaying()) return;
    const animName = btn.dataset.anim;
    activeChampion.playAnimation(animName, clock.getElapsedTime(), effectMgr);
    btn.classList.add('cooling');
    setTimeout(() => btn.classList.remove('cooling'), (activeChampion.animations[animName]?.duration || 1) * 1000 + 100);
  });
});

let demoMode = false;
let demoIdx = 0;
let demoNextTime = 0;
const demoOrder = ['attack', 'spell1', 'attack', 'spell2'];
document.getElementById('demoBtn').addEventListener('click', (e) => {
  demoMode = !demoMode;
  demoIdx = 0;
  e.target.textContent = demoMode ? '⏸ Stop Demo' : '▶ Cycle Animations';
  demoNextTime = clock.getElapsedTime() + 0.4;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('engineer');

// Hide loading splash
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);

animate();

</script>
