const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  linear: t => t,
  inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;

class RuneRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.4;
    this.maxRadius = opts.maxRadius ?? 1.7;
    this.startRadius = opts.startRadius ?? 0.4;
    this.rotateSpeed = opts.rotateSpeed ?? 0.7;
    this.runeCount = opts.runeCount ?? 8;
    const geo = new THREE.RingGeometry(0.85, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {

      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;

        void main() {
          float r = length(vPos.xy);

          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.iron;
  const mid = palette.mid || M.ironHi;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.iron;
  const dark = palette.dark || M.iron;

  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);

  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;

}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ENGINEER — Far Lands I/VI                                               ║
// ║  Turrets · Traps · Tinkerer · Khaki explorer outfit, ★ pith helm with  ║
// ║  brass goggles ★, tool-belt with wrenches, ★ floating mini-turret      ║
// ║  drone companion ★, brass-orange eye glow                              ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Engineer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = engineerAnimations;
  }

  // Override update — rotate the floating turret's barrels + bob the drone
  update(time, dt) {
    super.update(time, dt);
    if (this.turret) {
      // Drone bobs in place
      this.turret.position.y = this.turretBaseY + Math.sin(time * 1.4) * 0.04;
      // Barrel-cluster slowly scans left/right
      if (this.turretBarrels) {
        this.turretBarrels.rotation.y = Math.sin(time * 0.6) * 0.6;
      }
    }
  }

  build() {
    const root = this.group;

    // Legs — khaki jodhpurs + leather boots
    const legPalette = { dark: M.engKhakiDark, mid: M.engKhaki, accent: M.engBrass, trim: M.engBrassHi, leather: M.engKhakiDark };
    root.add(buildLeg(-1, legPalette));
    root.add(buildLeg(1, legPalette));

    // Pelvis — brown leather tool-belt with hanging tools
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.engKhaki));
    // Wide leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.13, 18), M.engKhakiDark);
    belt.position.y = 0.04; pelvis.add(belt);
    // Brass square buckle
    const buckle = mesh(new THREE.BoxGeometry(0.08, 0.06, 0.018), M.engBrassHi);
    buckle.position.set(0, 0.04, 0.31); pelvis.add(buckle);
    // Engineering rune-emblem in buckle (gear shape)
    const buckleGearTeeth = 6;
    for (let i = 0; i < buckleGearTeeth; i++) {
      const a = (i / buckleGearTeeth) * Math.PI * 2;
      const tooth = mesh(new THREE.BoxGeometry(0.008, 0.014, 0.018), M.engEnergy);
      tooth.position.set(Math.cos(a) * 0.025, 0.04 + Math.sin(a) * 0.025, 0.32);
      tooth.rotation.z = a;
      pelvis.add(tooth);
    }
    // Hanging tools (wrench on right hip, spanner on left)
    // Wrench
    const wrench = new THREE.Group();
    wrench.position.set(0.28, -0.06, 0.18);
    const wrenchHaft = mesh(new THREE.BoxGeometry(0.018, 0.14, 0.018), M.engSteel);
    wrench.add(wrenchHaft);
    const wrenchHead = mesh(new THREE.BoxGeometry(0.04, 0.04, 0.018), M.engSteel);
    wrenchHead.position.y = 0.07; wrench.add(wrenchHead);
    pelvis.add(wrench);
    // Spanner (left hip)
    const spanner = new THREE.Group();
    spanner.position.set(-0.28, -0.06, 0.18);
    const spannerHaft = mesh(new THREE.BoxGeometry(0.018, 0.14, 0.018), M.engBrass);
    spanner.add(spannerHaft);
    const spannerHead = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.engBrassHi);
    spannerHead.position.y = 0.08; spannerHead.rotation.x = Math.PI / 2;
    spanner.add(spannerHead);
    pelvis.add(spanner);
    // Hanging gear charms (3 small gears clinking on the front)
    for (let i = -1; i <= 1; i++) {
      const gear = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.012, 10), M.engBrassHi);
      gear.rotation.x = Math.PI / 2; gear.position.set(i * 0.06, -0.1, 0.31);
      pelvis.add(gear);
      // Gear teeth
      for (let j = 0; j < 6; j++) {
        const a = (j / 6) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.006, 0.008, 0.014), M.engBrassHi);
        tooth.position.set(i * 0.06 + Math.cos(a) * 0.025, -0.1 + Math.sin(a) * 0.025, 0.31);
        tooth.rotation.z = a;
        pelvis.add(tooth);
      }
    }
    root.add(pelvis);

    // TORSO — khaki vest with brass mechanical chestpiece
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const tunic = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.engKhaki);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);
    // Brown leather vest (front-only)
    const vest = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.engKhakiDark);
    vest.scale.set(1.05, 1, 0.85);
    vest.position.y = 0.04;
    torso.add(vest);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.engKhakiHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Brass clockwork chestpiece — center mechanism with visible gears
    const chestPlate = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.025, 16), M.engBrassHi);
    chestPlate.rotation.x = Math.PI / 2;
    chestPlate.position.set(0, 0.0, 0.4);
    torso.add(chestPlate);
    // Inner gear (smaller)
    const innerGear = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.022, 12), M.engBrass);
    innerGear.rotation.x = Math.PI / 2;
    innerGear.position.set(0, 0.0, 0.41);
    torso.add(innerGear);
    // Inner gear teeth
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const tooth = mesh(new THREE.BoxGeometry(0.014, 0.018, 0.022), M.engBrassHi);
      tooth.position.set(Math.cos(a) * 0.07, Math.sin(a) * 0.07, 0.412);
      tooth.rotation.z = a;
      torso.add(tooth);
    }
    // Energy core (glowing center)
    const core = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.engEnergy);
    core.position.set(0, 0.0, 0.43);
    torso.add(core);
    // Pressure-gauge details (4 small dials around the chestpiece)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const dial = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.012, 10), M.engGlass);
      dial.rotation.x = Math.PI / 2;
      dial.position.set(Math.cos(a) * 0.16, Math.sin(a) * 0.16, 0.4);
      torso.add(dial);
      // Tiny needle in each dial
      const needle = mesh(new THREE.BoxGeometry(0.002, 0.014, 0.002), M.engRust);
      needle.position.set(Math.cos(a) * 0.16, Math.sin(a) * 0.16, 0.41);
      needle.rotation.z = i * 0.7;
      torso.add(needle);
    }

    // CHEST EMBLEM — gear-pattern (different from Crossbowman's gear emblem since this is mechanical/lighter feeling)
    // (The clockwork chestpiece IS the emblem, so no separate emblem needed)

    // Brown shoulder-strap suspenders
    for (let side = -1; side <= 1; side += 2) {
      const strap = mesh(new THREE.BoxGeometry(0.07, 0.55, 0.022), M.engKhakiDark);
      strap.position.set(side * 0.18, 0.05, 0.36); strap.rotation.z = -side * 0.18;
      torso.add(strap);
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.engKhakiDark);
    collar.position.y = 0.4; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // Brass shoulders (engineer's mechanical pauldrons)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.engBrass);
      cap.scale.set(1.05, 0.85, 1);
      cap.position.set(side * 0.42, 2.2, 0);
      root.add(cap);
      // Steel rim
      const capRim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.engBrassHi);
      capRim.rotation.x = Math.PI / 2; capRim.position.set(side * 0.42, 2.16, 0);
      root.add(capRim);
      // Rivet on top (steel bolt)
      const rivet = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.engSteel);
      rivet.position.set(side * 0.42, 2.32, 0);
      root.add(rivet);
      // Tiny gear ornament on top
      const shoulderGear = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.014, 10), M.engBrassHi);
      shoulderGear.rotation.x = Math.PI / 2; shoulderGear.position.set(side * 0.42, 2.34, 0);
      root.add(shoulderGear);
    }

    // Arms
    const armPalette = { cloth: M.engKhaki, mid: M.engBrass, dark: M.engKhakiDark, hi: M.engBrassHi, accent: M.engSteel };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Brass bracers with rivets
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.092, 0.012, 8, 16), M.engBrassHi);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.5 - i * 0.13;
        arm.add(ring);
      }
      // Tool gauntlet (small gear on the back of hand)
      const handGear = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.014, 10), M.engBrassHi);
      handGear.rotation.x = Math.PI / 2; handGear.position.y = -0.92;
      arm.add(handGear);
    });

    // WRENCH (right hand — primary throwing weapon)
    const handWrench = this._buildBigWrench();
    rightArm.userData.hand.add(handWrench);
    handWrench.position.set(0, 0.04, 0.06);
    handWrench.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = handWrench;

    // Khaki cape (short, more like a coat-tail)
    const cape = buildCape({ material: M.engKhakiDark, width: 1.3, height: 1.6 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    const capeTrim = mesh(new THREE.TorusGeometry(0.5, 0.014, 8, 28, Math.PI), M.engBrassHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.84, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — pith helm with brass goggles
    const head = this._buildEngineerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== FLOATING MINI-TURRET DRONE — hovers next to the engineer (the marquee feature) =====
    this.turretBaseY = 1.85;
    this.turret = new THREE.Group();
    this.turret.position.set(1.0, this.turretBaseY, 0.2);
    // Drone body (cylindrical with brass plating)
    const droneBody = mesh(new THREE.SphereGeometry(0.1, 14, 10), M.engBrass);
    droneBody.scale.set(1.2, 0.8, 1.0);
    this.turret.add(droneBody);
    // Drone center core (glowing)
    const droneCore = mesh(new THREE.SphereGeometry(0.04, 10, 8), M.engEnergy);
    droneCore.position.set(0, 0, 0.06);
    this.turret.add(droneCore);
    // Eye-lens
    const droneLens = mesh(new THREE.CircleGeometry(0.025, 12), M.engEye);
    droneLens.position.set(0, 0, 0.09);
    this.turret.add(droneLens);
    // Brass struts (4 on top + bottom)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const strut = mesh(new THREE.BoxGeometry(0.01, 0.01, 0.04), M.engSteel);
      strut.position.set(Math.cos(a) * 0.08, Math.sin(a) * 0.08, -0.04);
      this.turret.add(strut);
    }
    // BARRELS — 4 small gun-barrels in a cluster (the rotating part)
    this.turretBarrels = new THREE.Group();
    this.turretBarrels.position.set(0, 0, 0.06);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const barrel = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.12, 8), M.engSteel);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(Math.cos(a) * 0.025, Math.sin(a) * 0.025, 0.05);
      this.turretBarrels.add(barrel);
    }
    this.turret.add(this.turretBarrels);
    // Hover-energy underneath (blue-ish glow showing it's flying)
    const hoverGlow = mesh(new THREE.CircleGeometry(0.08, 16), M.engEnergy);
    hoverGlow.rotation.x = -Math.PI / 2;
    hoverGlow.position.set(0, -0.1, 0);
    this.turret.add(hoverGlow);
    root.add(this.turret);

    M.engEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.engEye;
  }

  _buildBigWrench() {
    const w = new THREE.Group();
    // Pommel — brass cap
    const pommel = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.engBrassHi);
    w.add(pommel);
    // Brown grip
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.18, 10), M.engKhakiDark);
    grip.position.y = 0.1; w.add(grip);
    // Brass rings on grip
    for (let i = 0; i < 4; i++) {
      const ring = mesh(new THREE.TorusGeometry(0.024, 0.004, 6, 12), M.engBrassHi);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.04 + i * 0.04;
      w.add(ring);
    }
    // Mid-haft brass collar
    const midCollar = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.04, 10), M.engBrassHi);
    midCollar.position.y = 0.21; w.add(midCollar);
    // Steel haft
    const haft = mesh(new THREE.BoxGeometry(0.024, 0.32, 0.024), M.engSteel);
    haft.position.y = 0.36; w.add(haft);
    // WRENCH HEAD — open-ended adjustable wrench shape
    const head = mesh(new THREE.BoxGeometry(0.1, 0.06, 0.04), M.engSteel);
    head.position.y = 0.55; w.add(head);
    // Jaws (the U-shape opening)
    const jawL = mesh(new THREE.BoxGeometry(0.018, 0.07, 0.03), M.engSteel);
    jawL.position.set(-0.04, 0.6, 0); w.add(jawL);
    const jawR = mesh(new THREE.BoxGeometry(0.018, 0.07, 0.03), M.engSteel);
    jawR.position.set(0.04, 0.6, 0); w.add(jawR);
    // Adjustment thumbwheel (small ridged disc on the side)
    const thumb = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.01, 12), M.engBrassHi);
    thumb.rotation.x = Math.PI / 2; thumb.position.set(0, 0.55, 0.025);
    w.add(thumb);
    // Energy rune (glowing brass-orange in the wrench base)
    const energyRune = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.engEnergy);
    energyRune.position.set(0, 0.55, -0.025);
    w.add(energyRune);
    return w;
  }

  _buildEngineerHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Eyes — brass-orange
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.engEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mustache (mechanic style — bushy)
    for (let side = -1; side <= 1; side += 2) {
      const mustache = mesh(new THREE.BoxGeometry(0.05, 0.014, 0.012), M.engKhakiDark);
      mustache.position.set(side * 0.04, -0.09, 0.22); mustache.rotation.z = side * 0.18;
      head.add(mustache);
    }

    // Mouth
    const mouth = mesh(new THREE.BoxGeometry(0.05, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // ===== PITH HELM (the marquee — tropical explorer hat) =====
    // Wide brim
    const brim = mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.025, 22), M.engKhaki);
    brim.position.y = 0.15; head.add(brim);
    // Brim trim (brass)
    const brimTrim = mesh(new THREE.TorusGeometry(0.32, 0.008, 8, 28), M.engBrassHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.138;
    head.add(brimTrim);
    // Helm body — short rounded dome
    const helmDome = mesh(new THREE.SphereGeometry(0.21, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2.2), M.engKhaki);
    helmDome.position.y = 0.18; helmDome.scale.set(1, 0.9, 1);
    head.add(helmDome);
    // Top air-vent gear cap
    const ventCap = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.025, 10), M.engBrassHi);
    ventCap.position.y = 0.32; head.add(ventCap);
    // Tiny ventilation slits around the cap
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const slit = mesh(new THREE.BoxGeometry(0.014, 0.005, 0.002), M.engKhakiDark);
      slit.position.set(Math.cos(a) * 0.032, 0.32, Math.sin(a) * 0.032);
      slit.rotation.y = -a;
      head.add(slit);
    }

    // ===== BRASS GOGGLES — propped up on the brim of the helm =====
    // Goggle strap (across the helm)
    const strap = mesh(new THREE.TorusGeometry(0.22, 0.012, 8, 24), M.engKhakiDark);
    strap.rotation.x = Math.PI / 2;
    strap.position.y = 0.16;
    head.add(strap);
    // Two goggle lenses (on top of the helm — propped up, not over eyes)
    for (let side = -1; side <= 1; side += 2) {
      // Brass rim
      const lensRim = mesh(new THREE.TorusGeometry(0.045, 0.008, 8, 16), M.engBrassHi);
      lensRim.position.set(side * 0.08, 0.22, 0.1);
      lensRim.rotation.x = -0.4;
      head.add(lensRim);
      // Glass lens
      const lens = mesh(new THREE.CircleGeometry(0.04, 16), M.engGlass);
      lens.position.set(side * 0.08, 0.22, 0.1);
      lens.rotation.x = -0.4;
      head.add(lens);
      // Brass stem connecting lens to body
      const stem = mesh(new THREE.BoxGeometry(0.012, 0.05, 0.012), M.engBrassHi);
      stem.position.set(side * 0.04, 0.18, 0.05);
      head.add(stem);
    }

    return head;
  }
}

      { time: 0.22, fn: (champ, mgr, time) => {
        // Energy core flash on the chestpiece (deploying signal)
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const corePos = new THREE.Vector3(champPos.x, 1.85, champPos.z + 0.4);
        mgr.spawn(new ImpactFlash(champ.scene, corePos, { color: 0xffb840, maxScale: 0.4, duration: 0.5 }), time);
      }},
      // Drone fires bursts at target
      { time: 0.4, fn: (champ, mgr, time) => Engineer._turretBurst(champ, mgr, time, 0) },
      { time: 0.55, fn: (champ, mgr, time) => Engineer._turretBurst(champ, mgr, time, 1) },
      { time: 0.7, fn: (champ, mgr, time) => Engineer._turretBurst(champ, mgr, time, 2) },
      { time: 0.85, fn: (champ, mgr, time) => Engineer._turretBurst(champ, mgr, time, 3) },
    ],
  },
  // SPIKE TRAP — kneel + plant trap, AoE rune (arms in 1s, lasts 8s)
  spell2: {
    duration: 1.5,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.22, values: { rightArm: { rx: -0.95, rz: -0.05 }, leftArm: { rx: -0.45, rz: 0.4 }, body: { rx: 0.15, py: -0.06 } }, ease: ease.out },
      { t: 0.5,  values: { rightArm: { rx: -0.95, rz: -0.05 }, leftArm: { rx: -0.45, rz: 0.4 }, body: { rx: 0.15, py: -0.06 } }},
      { t: 0.72, values: { rightArm: { rx: -0.4, rz: -0.3 }, leftArm: { rx: -0.4, rz: 0.4 }, body: { rx: -0.04 } }, ease: ease.out },
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.22, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const trapPos = new THREE.Vector3(champPos.x, 0.12, champPos.z + 1.3);
        // Place rune
        mgr.spawn(new RuneRing(champ.scene, trapPos, { color: 0xf0a020, maxRadius: 1.3, duration: 1.4, runeCount: 8, rotateSpeed: 0.6 }), time);
        // Hand-glow during placement
        const handPos = new THREE.Vector3(champPos.x + 0.4, 0.6, champPos.z + 0.8);
        mgr.spawn(new ImpactFlash(champ.scene, handPos, { color: 0xffb840, maxScale: 0.4, duration: 0.5 }), time);
      }},
      { time: 0.7, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const trapPos = new THREE.Vector3(champPos.x, 0.12, champPos.z + 1.3);
        // Spike trap arms — sharp rapid burst of brass spikes
        mgr.spawn(new ImpactFlash(champ.scene, new THREE.Vector3(trapPos.x, 0.5, trapPos.z), { color: 0xffb840, maxScale: 0.65, duration: 0.4 }), time);
        mgr.spawn(new ShockwaveRing(champ.scene, trapPos, { color: 0xf0a020, maxRadius: 1.4, duration: 0.6 }), time);
        // Brass spike particles erupting up
        mgr.spawn(new ParticleBurst(champ.scene, new THREE.Vector3(trapPos.x, 0.4, trapPos.z), { color: 0xeab070, count: 40, speed: 6, duration: 0.85, upwardBias: 2.0, gravity: -3.0 }), time);
        mgr.spawn(new ParticleBurst(champ.scene, new THREE.Vector3(trapPos.x, 0.4, trapPos.z), { color: 0x808890, count: 24, speed: 4, duration: 0.95, upwardBias: 1.8, gravity: -2.5 }), time);
      }},
    ],
  },
};

Engineer._turretBurst = function(champ, mgr, time, idx) {
  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  // Drone position (next to engineer)
  const dronePos = new THREE.Vector3(champPos.x + 1.0, 1.85, champPos.z + 0.2);
  // Muzzle flash at drone barrels
  mgr.spawn(new ImpactFlash(champ.scene, dronePos.clone().add(new THREE.Vector3(0, 0, 0.1)), { color: 0xffd068, maxScale: 0.3, duration: 0.18 }), time);
  // Target spread
  const xOff = -0.4 + idx * 0.25;
  const target = new THREE.Vector3(champPos.x + xOff, 1.5, champPos.z + 1.6);
  mgr.spawn(new ImpactFlash(champ.scene, target, { color: 0xffb840, maxScale: 0.4, duration: 0.22 }), time + 0.05);
  const groundPos = new THREE.Vector3(target.x, 0.12, target.z);
  mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xf0a020, maxRadius: 0.8, duration: 0.45 }), time + 0.05);
  mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0xffb840, count: 12, speed: 4, duration: 0.5, upwardBias: 0.4, gravity: -2.5 }), time + 0.05);
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ALCHEMIST — Far Lands II/VI                                             ║
// ║  Potions · Transmutation · Brown leather apron over green robes,        ║
// ║  ★ gas-mask respirator with twin tube hoses ★, ★ alembic backpack with ║
// ║  bubbling vials ★, vial-bandolier across chest, iridescent-cyan glow   ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Alchemist extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = alchemistAnimations;
  }

  // Override update — bubble the alembic potions
  update(time, dt) {
    super.update(time, dt);
    if (this.alembicVials) {
      this.alembicVials.forEach((v, i) => {
        v.scale.y = 1 + Math.sin(time * 2.4 + i * 0.7) * 0.06;
      });
    }
  }

  build() {
    const root = this.group;

    // Legs — green robe pants with leather greaves
    const buildAlcLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.55, 14), M.alcGreen);
      thigh.position.y = 0.95; leg.add(thigh);
      // Leather mid-shin wraps
      const shin = mesh(new THREE.CylinderGeometry(0.135, 0.16, 0.5, 14), M.alcLeather);
      shin.position.y = 0.36; leg.add(shin);
      // Brass-banded boot
      const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), M.alcLeatherHi);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Brass-band trim
      const bootBand = mesh(new THREE.CylinderGeometry(0.16, 0.155, 0.04, 14), M.alcBrass);
      bootBand.position.y = 0.16; leg.add(bootBand);
      // Brass buckle
      const buckle = mesh(new THREE.BoxGeometry(0.04, 0.025, 0.018), M.alcBrassHi);
      buckle.position.set(sx * 0.13, 0.15, 0.05); leg.add(buckle);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildAlcLeg(-1));
    root.add(buildAlcLeg(1));

    // Pelvis — leather apron with hanging vials
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.16, 16), M.alcGreen));
    // Leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.1, 18), M.alcLeather);
    belt.position.y = 0.04; pelvis.add(belt);
    // Brass buckle
    const buckle = mesh(new THREE.BoxGeometry(0.06, 0.04, 0.018), M.alcBrassHi);
    buckle.position.set(0, 0.04, 0.31); pelvis.add(buckle);
    // Vial-rack belt — multiple colored potions hanging from the belt
    this.alembicVials = this.alembicVials || [];
    const beltColors = [M.alcAcid, M.alcPotion, M.alcAcid, M.alcPotion, M.alcAcid];
    for (let i = -2; i <= 2; i++) {
      const colorMat = beltColors[i + 2];
      // Vial body (clear glass)
      const vBody = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.07, 8), M.alcGlass);
      vBody.position.set(i * 0.08, -0.06, 0.18);
      pelvis.add(vBody);
      // Bubbling potion inside
      const potion = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 8), colorMat);
      potion.position.set(i * 0.08, -0.06, 0.18);
      pelvis.add(potion);
      this.alembicVials.push(potion);
      // Brass cap
      const cap = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.012, 8), M.alcBrass);
      cap.position.set(i * 0.08, -0.025, 0.18);
      pelvis.add(cap);
    }
    // Long leather apron
    const apron = mesh(new THREE.BoxGeometry(0.4, 0.5, 0.018), M.alcLeather);
    apron.position.set(0, -0.27, 0.31); apron.rotation.x = -0.04;
    pelvis.add(apron);
    // Brass apron-strap rivets
    for (let i = -1; i <= 1; i += 2) {
      const rivet = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.alcBrassHi);
      rivet.position.set(i * 0.18, -0.1, 0.32); pelvis.add(rivet);
    }
    // Apron pocket (with vial-rack for additional potions)
    const pocket = mesh(new THREE.BoxGeometry(0.18, 0.08, 0.025), M.alcLeatherHi);
    pocket.position.set(0, -0.2, 0.32); pelvis.add(pocket);
    // 3 vials in apron pocket
    for (let i = -1; i <= 1; i++) {
      const pVial = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.05, 8), M.alcGlass);
      pVial.position.set(i * 0.05, -0.15, 0.34);
      pelvis.add(pVial);
      const pPotion = mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.035, 8), i === 0 ? M.alcPotion : M.alcAcid);
      pPotion.position.set(i * 0.05, -0.15, 0.34);
      pelvis.add(pPotion);
      this.alembicVials.push(pPotion);
    }
    root.add(pelvis);

    // TORSO — green robe + leather chest-apron
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.alcGreen);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Leather chest apron
    const chestApron = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.alcLeather);
    chestApron.scale.set(1.05, 1, 0.85);
    chestApron.position.y = 0.04;
    torso.add(chestApron);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.alcLeatherHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // VIAL BANDOLIER — diagonal across chest with multiple colorful potions
    const bandolier = mesh(new THREE.BoxGeometry(0.07, 0.65, 0.022), M.alcLeather);
    bandolier.position.set(-0.04, 0.0, 0.36); bandolier.rotation.z = 0.4;
    torso.add(bandolier);
    // 5 vials on the bandolier
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const px = -0.18 + t * 0.32;
      const py = 0.22 - t * 0.55;
      const colorMat = i % 2 === 0 ? M.alcPotion : M.alcAcid;
      // Vial body
      const vBody = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 8), M.alcGlass);
      vBody.position.set(px, py, 0.39); vBody.rotation.x = Math.PI / 2 - 0.4;
      torso.add(vBody);
      // Bubbling content
      const potion = mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.04, 8), colorMat);
      potion.position.set(px, py, 0.39); potion.rotation.x = Math.PI / 2 - 0.4;
      torso.add(potion);
      this.alembicVials.push(potion);
      // Brass cap
      const cap = mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.012, 8), M.alcBrass);
      cap.position.set(px - 0.018, py + 0.018, 0.39); cap.rotation.x = Math.PI / 2 - 0.4;
      torso.add(cap);
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.alcLeather);
    collar.position.y = 0.4; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // Brass shoulders with riveted pauldrons
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.alcLeatherHi);
      cap.scale.set(1.05, 0.8, 1);
      cap.position.set(side * 0.42, 2.2, 0);
      root.add(cap);
      const capRim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.alcBrass);
      capRim.rotation.x = Math.PI / 2; capRim.position.set(side * 0.42, 2.16, 0);
      root.add(capRim);
      // Brass tube/hose connection point
      const hosePort = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.04, 10), M.alcBrassHi);
      hosePort.position.set(side * 0.42, 2.27, 0); hosePort.rotation.x = Math.PI / 2;
      root.add(hosePort);
    }

    // Arms
    const armPalette = { cloth: M.alcGreen, mid: M.alcLeather, dark: M.alcLeatherHi, hi: M.alcBrass, accent: M.alcBrassHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Brass-banded forearms
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.092, 0.012, 8, 16), M.alcBrassHi);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.5 - i * 0.13;
        arm.add(ring);
      }
      // Wrist-mounted vial sprayer (thick leather glove + a small vial mounted on top)
      const sprayerVial = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.05, 8), M.alcGlass);
      sprayerVial.position.set(0, -0.85, 0.07);
      arm.add(sprayerVial);
      const sprayerPotion = mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.04, 8), M.alcPotion);
      sprayerPotion.position.set(0, -0.85, 0.07);
      arm.add(sprayerPotion);
    });

    // POTION-FLASK (held in right hand — primary "weapon")
    const flask = this._buildPotionFlask();
    rightArm.userData.hand.add(flask);
    flask.position.set(0, 0.04, 0.06);
    flask.rotation.set(Math.PI * 0.3, 0, 0);
    this.parts.weapon = flask;

    // ALEMBIC BACKPACK — multiple bubbling vials sticking up from behind (the marquee)
    this._buildAlembicPack(root);

    // Cape — short brown leather coat-tail
    const cape = buildCape({ material: M.alcLeather, width: 1.25, height: 1.55 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — gas mask
    const head = this._buildAlchemistHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.alcEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.alcEye;
  }

  _buildPotionFlask() {
    const flask = new THREE.Group();
    // Cork stopper
    const cork = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.03, 10), M.alcLeather);
    flask.add(cork);
    // Brass cap
    const brassCap = mesh(new THREE.CylinderGeometry(0.026, 0.022, 0.018, 10), M.alcBrassHi);
    brassCap.position.y = -0.024; flask.add(brassCap);
    // Neck
    const flaskNeck = mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.05, 10), M.alcGlass);
    flaskNeck.position.y = -0.06; flask.add(flaskNeck);
    // Bulbous body
    const flaskBody = mesh(new THREE.SphereGeometry(0.06, 14, 10), M.alcGlass);
    flaskBody.position.y = -0.13; flask.add(flaskBody);
    // Bubbling potion inside
    const potion = mesh(new THREE.SphereGeometry(0.05, 12, 10), M.alcPotion);
    potion.position.y = -0.13; flask.add(potion);
    this.alembicVials.push(potion);
    // Tiny bubbles
    for (let i = 0; i < 4; i++) {
      const bubble = mesh(new THREE.SphereGeometry(0.005 + Math.random() * 0.005, 6, 4), M.alcAcid);
      bubble.position.set((Math.random() - 0.5) * 0.04, -0.13 + (Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.04);
      flask.add(bubble);
    }
    return flask;
  }

  _buildAlembicPack(root) {
    // Backpack frame
    const packFrame = mesh(new THREE.BoxGeometry(0.28, 0.45, 0.16), M.alcLeather);
    packFrame.position.set(0, 1.95, -0.36);
    root.add(packFrame);
    // Brass corner-rivets
    for (let xs = -1; xs <= 1; xs += 2) {
      for (let ys = -1; ys <= 1; ys += 2) {
        const rivet = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.alcBrassHi);
        rivet.position.set(xs * 0.13, 1.95 + ys * 0.21, -0.27);
        root.add(rivet);
      }
    }
    // Tall vials sticking up from the pack (like a portable distillery)
    const packVialColors = [M.alcPotion, M.alcAcid, M.alcPotion, M.alcAcid];
    for (let i = 0; i < 4; i++) {
      const x = -0.09 + i * 0.06;
      // Vial body (tall glass)
      const vBody = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.18, 10), M.alcGlass);
      vBody.position.set(x, 2.28, -0.34);
      root.add(vBody);
      // Bubbling potion
      const potion = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.14, 10), packVialColors[i]);
      potion.position.set(x, 2.27, -0.34);
      root.add(potion);
      this.alembicVials.push(potion);
      // Brass cap
      const cap = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.014, 8), M.alcBrass);
      cap.position.set(x, 2.38, -0.34);
      root.add(cap);
    }
    // Brass connecting tubes between vials
    const tubeBar = mesh(new THREE.BoxGeometry(0.2, 0.014, 0.014), M.alcBrass);
    tubeBar.position.set(0, 2.4, -0.32);
    root.add(tubeBar);
    // Tubes going down to a "boiler" at the bottom of the pack
    for (let i = 0; i < 4; i++) {
      const x = -0.09 + i * 0.06;
      const downTube = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.1, 6), M.alcBrass);
      downTube.position.set(x, 2.13, -0.34);
      root.add(downTube);
    }
    // Boiler (small black cauldron at the bottom)
    const boiler = mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.08, 12), M.alcLeatherHi);
    boiler.position.set(0, 2.05, -0.32);
    root.add(boiler);
    // Boiler glow (warm bottom)
    const boilerGlow = mesh(new THREE.SphereGeometry(0.04, 10, 8), M.alcAcid);
    boilerGlow.position.set(0, 2.02, -0.3); boilerGlow.scale.set(1, 0.4, 1);
    root.add(boilerGlow);
    // Steam wisps rising from the boiler (small spheres staggered upward)
    for (let i = 0; i < 3; i++) {
      const wisp = mesh(new THREE.SphereGeometry(0.018 - i * 0.003, 8, 6), M.alcGlass);
      wisp.position.set((i - 1) * 0.02, 2.5 + i * 0.06, -0.3);
      root.add(wisp);
    }
  }

  _buildAlchemistHead() {
    const head = new THREE.Group();
    // Skin face (mostly hidden by mask)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== GAS MASK — brass respirator covering the face (the marquee feature) =====
    // Main mask body (covering the entire face)
    const maskShape = new THREE.Shape();
    maskShape.moveTo(-0.18, 0.08); maskShape.lineTo(0.18, 0.08);
    maskShape.bezierCurveTo(0.22, -0.04, 0.16, -0.18, 0, -0.2);
    maskShape.bezierCurveTo(-0.16, -0.18, -0.22, -0.04, -0.18, 0.08);
    maskShape.closePath();
    const mask = mesh(new THREE.ExtrudeGeometry(maskShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 2 }), M.alcBrassHi);
    mask.position.set(0, -0.05, 0.13);
    head.add(mask);
    // Brass rivets around the mask perimeter
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const rivet = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.alcBrass);
      const r = 0.18;
      rivet.position.set(Math.cos(a) * r, -0.05 + Math.sin(a) * r * 0.8, 0.21);
      head.add(rivet);
    }
    // GLASS LENSES — round goggles in the mask (showing the eye glow)
    for (let side = -1; side <= 1; side += 2) {
      // Brass rim around lens
      const lensRim = mesh(new THREE.TorusGeometry(0.05, 0.01, 8, 16), M.alcBrassHi);
      lensRim.position.set(side * 0.085, 0.0, 0.21);
      head.add(lensRim);
      // Glass lens
      const lens = mesh(new THREE.CircleGeometry(0.045, 16), M.alcEye);
      lens.position.set(side * 0.085, 0.0, 0.215);
      head.add(lens);
    }
    // RESPIRATOR SNOUT — a brass tube extending from the mouth area
    const snout = mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.1, 12), M.alcBrass);
    snout.position.set(0, -0.13, 0.2); snout.rotation.x = Math.PI / 2;
    head.add(snout);
    // Snout end (filter)
    const snoutFilter = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.025, 12), M.alcBrassHi);
    snoutFilter.position.set(0, -0.13, 0.27); snoutFilter.rotation.x = Math.PI / 2;
    head.add(snoutFilter);
    // Filter holes (4 small dark dots)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const hole = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.alcLeather);
      hole.position.set(Math.cos(a) * 0.024, -0.13 + Math.sin(a) * 0.024, 0.282);
      head.add(hole);
    }
    // ★ TUBES from the mask connecting back to the alembic backpack
    for (let side = -1; side <= 1; side += 2) {
      // Tube from mask side to back-pack
      const tube = mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.32, 8), M.alcLeather);
      tube.position.set(side * 0.18, -0.04, -0.05);
      tube.rotation.x = -0.4;
      tube.rotation.z = side * 0.4;
      head.add(tube);
      // Brass connector on the mask side
      const connector = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.025, 8), M.alcBrassHi);
      connector.position.set(side * 0.16, -0.05, 0.13);
      connector.rotation.z = side * Math.PI / 2;
      head.add(connector);
    }
    // Top air-vent ridge running over the head
    const topVent = mesh(new THREE.BoxGeometry(0.04, 0.04, 0.4), M.alcBrass);
    topVent.position.set(0, 0.18, 0.0);
    head.add(topVent);
    // Air-vent slits along the ridge
    for (let i = -1; i <= 1; i++) {
      const slit = mesh(new THREE.BoxGeometry(0.03, 0.018, 0.005), M.alcLeather);
      slit.position.set(0, 0.2, i * 0.1);
      head.add(slit);
    }

    // Side hair tassels (visible at the back, dark)
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.SphereGeometry(0.08, 12, 10), M.alcLeather);
      sideHair.position.set(side * 0.18, -0.05, -0.08); sideHair.scale.set(0.7, 1.2, 0.7);
      head.add(sideHair);
    }

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  BEASTMASTER — Far Lands III/VI                                          ║
// ║  Multi-Pet · Pack Leader · Wild leather harness with multiple leashes,  ║
// ║  ★ bear cub companion at side ★, ★ whip in right hand ★, fang-necklace,║
// ║  bare tattooed arms, mohawk hair, wild-red eye glow                    ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Beastmaster extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = beastmasterAnimations;
  }

  // Override update — bear cub breathes + sways slightly
  update(time, dt) {
    super.update(time, dt);
    if (this.bearBody) this.bearBody.scale.y = 1 + Math.sin(time * 1.0) * 0.015;
    if (this.bearHead) this.bearHead.rotation.y = Math.sin(time * 0.6) * 0.3;
  }

  build() {
    const root = this.group;

    // Legs — leather pants (similar to Berserker but with pelts and bronze)
    const buildBmLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.135, 0.115, 0.55, 14), M.bmLeather);
      thigh.position.y = 0.95; leg.add(thigh);
      const knee = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.bmLeatherHi);
      knee.position.y = 0.66; knee.scale.set(1.05, 0.6, 1.1); leg.add(knee);
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.bmLeatherHi);
      shin.position.y = 0.36; leg.add(shin);
      // Multiple leather wraps with bronze studs
      for (let i = 0; i < 4; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.122, 0.01, 6, 14), M.bmLeatherDark);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.5 - i * 0.1;
        leg.add(wrap);
      }
      // Bronze stud
      const stud = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.bmBronze);
      stud.position.set(sx * 0.115, 0.55, 0.05); leg.add(stud);
      // Boot
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.bmLeatherDark);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Bone-claw toe
      const toeClaw = mesh(new THREE.ConeGeometry(0.014, 0.05, 4), M.bmFurHi);
      toeClaw.position.set(0, 0.085, 0.24); toeClaw.rotation.x = Math.PI / 2;
      leg.add(toeClaw);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildBmLeg(-1));
    root.add(buildBmLeg(1));

    // Pelvis — leather belt with hanging trophy charms + leashes
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.16, 16), M.bmLeather));
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.12, 18), M.bmLeatherDark);
    belt.position.y = 0.04; pelvis.add(belt);
    // Bronze fang buckle
    const buckle = mesh(new THREE.ConeGeometry(0.028, 0.06, 5), M.bmBronze);
    buckle.position.set(0, 0.04, 0.32); buckle.rotation.x = Math.PI / 2;
    pelvis.add(buckle);
    // Hanging fang/claw trophies (5 across)
    for (let i = -2; i <= 2; i++) {
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.05, 4), M.bmLeatherDark);
      cord.position.set(i * 0.06, -0.04, 0.31);
      pelvis.add(cord);
      // Big fang
      const fang = mesh(new THREE.ConeGeometry(0.014 + (Math.abs(i) % 2) * 0.005, 0.06, 5), M.bmFurHi);
      fang.position.set(i * 0.06, -0.11, 0.31);
      fang.rotation.x = Math.PI;
      pelvis.add(fang);
    }
    // Hip pelt (a fur skin hanging from one side)
    const hipPelt = mesh(new THREE.BoxGeometry(0.2, 0.4, 0.018), M.bmFur);
    hipPelt.position.set(0.16, -0.28, 0.27); hipPelt.rotation.x = -0.04;
    pelvis.add(hipPelt);
    // Pelt fur tufts
    for (let i = -1; i <= 1; i++) {
      const tuft = mesh(new THREE.ConeGeometry(0.022, 0.06, 5), M.bmFurHi);
      tuft.position.set(0.1 + i * 0.06, -0.5, 0.28);
      tuft.rotation.x = Math.PI;
      pelvis.add(tuft);
    }
    root.add(pelvis);

    // TORSO — bare-chested with leather harness
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    // BARE TORSO (skin showing — distinct from Hunter who is fully clothed)
    const bareTorso = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.skin);
    bareTorso.scale.set(1.0, 1, 0.85);
    torso.add(bareTorso);
    // Pec mounds (skin)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.skin);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // ★ LEASH HARNESS — leather X-strap with multiple chains/leashes hanging from it
    const harnessL = mesh(new THREE.BoxGeometry(0.07, 0.7, 0.025), M.bmLeather);
    harnessL.position.set(-0.04, 0.0, 0.36); harnessL.rotation.z = 0.45;
    torso.add(harnessL);
    const harnessR = mesh(new THREE.BoxGeometry(0.07, 0.7, 0.025), M.bmLeather);
    harnessR.position.set(0.04, 0.0, 0.36); harnessR.rotation.z = -0.45;
    torso.add(harnessR);
    // Bronze X-junction at center
    const xRing = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.bmBronze);
    xRing.position.set(0, 0.0, 0.4); xRing.scale.set(1, 1, 0.5);
    torso.add(xRing);
    // Multiple LEASHES hanging from the harness (chain links + collars)
    const leashCount = 4;
    for (let i = 0; i < leashCount; i++) {
      const t = i / (leashCount - 1);
      const startX = -0.16 + t * 0.32;
      // Chain (3 bead-links per leash)
      for (let j = 0; j < 3; j++) {
        const link = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.bmBronze);
        link.position.set(startX, -0.05 - j * 0.04, 0.4);
        torso.add(link);
      }
      // Empty collar at the end (suggesting the leash is for a pet)
      const collar = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.bmBronze);
      collar.rotation.x = Math.PI / 2;
      collar.position.set(startX, -0.18, 0.4);
      torso.add(collar);
    }

    // FANG NECKLACE across the upper chest
    for (let i = -3; i <= 3; i++) {
      const a = (i / 6) * Math.PI * 0.7;
      const fang = mesh(new THREE.ConeGeometry(0.012, 0.05, 5), M.bmFurHi);
      const r = 0.34;
      fang.position.set(Math.sin(a) * r, 0.32 - Math.abs(i) * 0.01, Math.cos(a) * r * 0.85);
      fang.rotation.x = Math.PI;
      fang.rotation.z = -a;
      torso.add(fang);
    }

    // CHEST EMBLEM — paw print with claws (different from Hunter — more bestial, four claws raked)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.bmLeatherDark);
    emblemBack.position.set(0.05, -0.22, 0.41); torso.add(emblemBack);
    // 4 claw rakes (diagonal slashes — like a bear scratched here)
    for (let i = 0; i < 4; i++) {
      const slash = mesh(new THREE.BoxGeometry(0.012, 0.07, 0.005), M.bmRed);
      slash.position.set(0.05 + (i - 1.5) * 0.018, -0.22, 0.42); slash.rotation.z = 0.4;
      torso.add(slash);
    }

    // Tribal red paint stripes on the chest (war markings)
    for (let i = 0; i < 3; i++) {
      const paint = mesh(new THREE.BoxGeometry(0.32, 0.014, 0.005), M.bmRed);
      paint.position.set(0, 0.05 - i * 0.07, 0.28);
      torso.add(paint);
    }

    // Neck collar (rough leather)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.bmLeatherDark);
    collar.position.y = 0.4; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // Asymmetric pelt mantle (over only one shoulder — distinct from Hunter's symmetric mantle)
    const peltShape = new THREE.Group();
    peltShape.position.set(-0.42, 2.32, 0);
    // Pelt cap on shoulder
    const peltCap = mesh(new THREE.SphereGeometry(0.18, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.bmFur);
    peltCap.scale.set(1.1, 0.85, 1);
    peltShape.add(peltCap);
    // Tufts
    for (let i = 0; i < 16; i++) {
      const t = i / 15;
      const angle = -Math.PI * 0.5 + t * Math.PI;
      const r = 0.18;
      const tuft = mesh(new THREE.ConeGeometry(0.026, 0.08, 5), Math.random() > 0.5 ? M.bmFurHi : M.bmFur);
      tuft.position.set(Math.cos(angle) * r, -0.04 + Math.sin(angle) * 0.02, Math.sin(angle) * r * 0.8);
      tuft.rotation.x = Math.PI;
      tuft.rotation.z = angle;
      peltShape.add(tuft);
    }
    // Bronze clasp
    const peltClasp = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.bmBronze);
    peltClasp.position.set(0.08, -0.02, 0.16); peltClasp.scale.set(1.4, 0.7, 0.7);
    peltShape.add(peltClasp);
    root.add(peltShape);

    // Right shoulder is bare (no pelt), with simple leather strap
    const rStrap = mesh(new THREE.BoxGeometry(0.08, 0.55, 0.04), M.bmLeather);
    rStrap.position.set(0.32, 1.95, 0.18); rStrap.rotation.z = 0.35;
    root.add(rStrap);
    const rStrapBack = rStrap.clone(); rStrapBack.position.z = -0.18;
    root.add(rStrapBack);

    // BARE ARMS (similar to Berserker — skin visible with tribal paint)
    const buildBareArm = (sx, shoulderAngle) => {
      const arm = new THREE.Group();
      const upper = mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.4, 12), M.skin);
      upper.position.y = -0.2; arm.add(upper);
      // Leather armband (one) on upper arm
      const armband = mesh(new THREE.TorusGeometry(0.085, 0.012, 8, 14), M.bmLeather);
      armband.rotation.x = Math.PI / 2; armband.position.y = -0.32; arm.add(armband);
      // Bronze stud on the band
      const stud = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.bmBronze);
      stud.position.set(sx * 0.085, -0.32, 0); arm.add(stud);
      // Tribal paint stripes
      for (let i = 0; i < 2; i++) {
        const tat = mesh(new THREE.BoxGeometry(0.025, 0.05, 0.005), M.bmRed);
        tat.position.set(sx * 0.07, -0.1 - i * 0.1, 0.05);
        tat.rotation.z = (i % 2 === 0 ? sx : -sx) * 0.3;
        arm.add(tat);
      }
      const elbow = mesh(new THREE.SphereGeometry(0.09, 12, 10), M.skin);
      elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
      const forearm = mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.4, 12), M.skin);
      forearm.position.y = -0.62; arm.add(forearm);
      // Forearm wraps + bronze studs
      for (let i = 0; i < 4; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.078, 0.008, 6, 14), M.bmLeatherHi);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = -0.5 - i * 0.08;
        arm.add(wrap);
      }
      // Wrist bracer
      const wristBracer = mesh(new THREE.CylinderGeometry(0.088, 0.082, 0.1, 14), M.bmLeatherDark);
      wristBracer.position.y = -0.86; arm.add(wristBracer);
      // Bone studs on wrist
      for (let i = 0; i < 3; i++) {
        const a = -0.6 + i * 0.6;
        const stud = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.bmFurHi);
        stud.position.set(Math.cos(a) * 0.085, -0.86, Math.sin(a) * 0.085);
        stud.rotation.z = a + Math.PI / 2;
        arm.add(stud);
      }
      // Hand
      const handMesh = mesh(new THREE.BoxGeometry(0.13, 0.16, 0.1), M.skin);
      handMesh.position.y = -0.95; arm.add(handMesh);
      const hand = new THREE.Group();
      hand.position.y = -0.96;
      arm.add(hand);
      arm.userData.hand = hand;
      arm.position.set(sx * 0.42, 2.18, 0);
      arm.rotation.z = sx * shoulderAngle;
      return arm;
    };
    const leftArm = buildBareArm(-1, 0.22);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildBareArm(1, 0.22);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // WHIP held in right hand (long coiled leather whip)
    const whip = this._buildWhip();
    rightArm.userData.hand.add(whip);
    whip.position.set(0, 0.0, 0.06);
    whip.rotation.set(Math.PI * 0.4, 0, 0);
    this.parts.weapon = whip;

    // No flowing cape — pelt-mantle is the back garment
    this.cape = null;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — mohawk + tribal paint + fang earrings
    const head = this._buildBeastmasterHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== BEAR CUB COMPANION at the right side (the marquee feature) =====
    const bearCub = this._buildBearCub();
    bearCub.position.set(1.1, 0, -0.1);
    bearCub.rotation.set(0, -Math.PI / 4, 0);
    root.add(bearCub);

    M.bmEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.bmEye;
  }

  _buildWhip() {
    const whip = new THREE.Group();
    // Pommel
    const pommel = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.bmBronze);
    whip.add(pommel);
    // Handle wrap
    const handle = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.18, 10), M.bmLeather);
    handle.position.y = 0.1; whip.add(handle);
    // Leather grip wraps
    for (let i = 0; i < 4; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.024, 0.005, 5, 10), M.bmLeatherDark);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.04 + i * 0.04;
      whip.add(wrap);
    }
    // Bronze top-collar where the whip-cord starts
    const topCollar = mesh(new THREE.CylinderGeometry(0.026, 0.022, 0.025, 10), M.bmBronze);
    topCollar.position.y = 0.21; whip.add(topCollar);
    // WHIP CORD — coiled wrap of leather (multiple loops piling up)
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      // Each coil is a torus
      const coilWidth = 0.08 + t * 0.04;
      const coil = mesh(new THREE.TorusGeometry(coilWidth, 0.012, 6, 18), M.bmLeatherDark);
      coil.rotation.x = Math.PI / 2;
      coil.position.set(0.06 + t * 0.04, 0.22 + t * 0.06, -0.08 + t * 0.08);
      whip.add(coil);
    }
    // Whip tail (a few segments of decreasing-thickness rope hanging down/forward)
    const tailSegs = 5;
    let prevPos = new THREE.Vector3(0.18, 0.4, 0);
    for (let i = 0; i < tailSegs; i++) {
      const t = i / tailSegs;
      const nextPos = new THREE.Vector3(0.22 + t * 0.06, 0.42 - t * 0.18, t * 0.06);
      const dir = nextPos.clone().sub(prevPos);
      const len = dir.length();
      const mid = prevPos.clone().add(nextPos).multiplyScalar(0.5);
      const seg = mesh(new THREE.CylinderGeometry(0.014 - i * 0.002, 0.012 - (i + 1) * 0.002, len, 8), M.bmLeather);
      seg.position.copy(mid);
      seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      whip.add(seg);
      prevPos = nextPos;
    }
    // Whip tip (small leather knot)
    const tip = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.bmLeatherDark);
    tip.position.copy(prevPos);
    whip.add(tip);
    return whip;
  }

  _buildBearCub() {
    const cub = new THREE.Group();
    // BODY (chunky, round)
    const body = mesh(new THREE.SphereGeometry(0.24, 16, 12), M.bmBearFur);
    body.position.y = 0.6; body.scale.set(1.3, 1.0, 1.2);
    cub.add(body);
    this.bearBody = body;
    // Belly (lighter)
    const belly = mesh(new THREE.SphereGeometry(0.2, 14, 10), M.bmBearFurHi);
    belly.position.set(0, 0.5, 0.05); belly.scale.set(1.2, 0.8, 0.95);
    cub.add(belly);

    // HEAD (round)
    const headGroup = new THREE.Group();
    headGroup.position.set(0.32, 0.7, 0);
    const head = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.bmBearFur);
    head.scale.set(1.1, 1.0, 1.05);
    headGroup.add(head);
    this.bearHead = headGroup;
    // Snout
    const snout = mesh(new THREE.SphereGeometry(0.085, 12, 10), M.bmBearFurHi);
    snout.position.set(0.13, -0.02, 0); snout.scale.set(1.2, 0.85, 0.95);
    headGroup.add(snout);
    // Wet nose
    const nose = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.voidBlack || M.engKhakiDark);
    nose.position.set(0.21, -0.005, 0);
    headGroup.add(nose);
    // Round ears
    for (let side = -1; side <= 1; side += 2) {
      const ear = mesh(new THREE.SphereGeometry(0.05, 10, 8), M.bmBearFur);
      ear.position.set(0.0, 0.13, side * 0.085);
      headGroup.add(ear);
      // Inner ear
      const innerEar = mesh(new THREE.SphereGeometry(0.028, 8, 6), M.bmBearFurHi);
      innerEar.position.set(0.005, 0.13, side * 0.085);
      headGroup.add(innerEar);
    }
    // Wild-red eyes
    const bearEyeL = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.bmEye);
    bearEyeL.position.set(0.14, 0.04, 0.04); headGroup.add(bearEyeL);
    const bearEyeR = bearEyeL.clone(); bearEyeR.position.z = -0.04; headGroup.add(bearEyeR);
    cub.add(headGroup);

    // 4 LEGS (chunky, short)
    const legPositions = [
      [0.18, 0.0, 0.13],
      [0.18, 0.0, -0.13],
      [-0.18, 0.0, 0.13],
      [-0.18, 0.0, -0.13],
    ];
    legPositions.forEach(p => {
      const upperLeg = mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.18, 8), M.bmBearFur);
      upperLeg.position.set(p[0], p[1] + 0.3, p[2]);
      cub.add(upperLeg);
      const lowerLeg = mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.18, 8), M.bmBearFurHi);
      lowerLeg.position.set(p[0], p[1] + 0.12, p[2]);
      cub.add(lowerLeg);
      // Paw
      const paw = mesh(new THREE.BoxGeometry(0.1, 0.04, 0.1), M.bmBearFurHi);
      paw.position.set(p[0], p[1] + 0.02, p[2] + 0.01);
      cub.add(paw);
      // Claws
      for (let c = -1; c <= 1; c++) {
        const claw = mesh(new THREE.ConeGeometry(0.008, 0.02, 4), M.bmFurHi);
        claw.position.set(p[0] + c * 0.025, p[1] + 0.03, p[2] + 0.06); claw.rotation.x = Math.PI / 2;
        cub.add(claw);
      }
    });

    // Stubby tail
    const tail = mesh(new THREE.SphereGeometry(0.05, 10, 8), M.bmBearFurHi);
    tail.position.set(-0.3, 0.6, 0);
    cub.add(tail);

    // Bronze collar with bone-pendant
    const cubCollar = mesh(new THREE.TorusGeometry(0.18, 0.014, 8, 16), M.bmBronze);
    cubCollar.position.set(0.18, 0.7, 0); cubCollar.rotation.y = Math.PI / 2;
    cub.add(cubCollar);
    const cubPendant = mesh(new THREE.ConeGeometry(0.022, 0.05, 5), M.bmFurHi);
    cubPendant.position.set(0.34, 0.55, 0); cubPendant.rotation.x = Math.PI;
    cub.add(cubPendant);

    return cub;
  }

  _buildBeastmasterHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Shaved sides
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.skinDark);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // ===== MOHAWK on top (the marquee — wild crested hair) =====
    // Series of upright cones forming a mohawk crest
    for (let i = -2; i <= 2; i++) {
      const t = (i + 2) / 4;
      const z = -0.12 + t * 0.24;
      const h = 0.18 - Math.abs(i) * 0.04;
      const mohawk = mesh(new THREE.ConeGeometry(0.04, h, 5), i % 2 === 0 ? M.bmLeather : M.bmRed);
      mohawk.position.set(0, 0.18 + h / 2 - 0.02, z);
      head.add(mohawk);
    }

    // Eyes — wild-red glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.bmEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // War-paint diagonal stripe across the eyes
    const warPaint = mesh(new THREE.BoxGeometry(0.32, 0.025, 0.005), M.bmRed);
    warPaint.position.set(0, -0.02, 0.215); warPaint.rotation.z = -0.15;
    head.add(warPaint);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Snarl
    const mouth = mesh(new THREE.BoxGeometry(0.08, 0.012, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22);
    head.add(mouth);
    // Bared tooth
    const tooth = mesh(new THREE.BoxGeometry(0.008, 0.018, 0.005), M.bmFurHi);
    tooth.position.set(0.018, -0.135, 0.225);
    head.add(tooth);

    // Bone earrings on both ears
    for (let side = -1; side <= 1; side += 2) {
      const earring = mesh(new THREE.ConeGeometry(0.016, 0.05, 5), M.bmFurHi);
      earring.position.set(side * 0.21, -0.07, 0); earring.rotation.x = Math.PI;
      head.add(earring);
    }

    return head;
  }
}

  mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0xff5050, height: 1.8, radius: 0.25, duration: 0.4 }), time);
