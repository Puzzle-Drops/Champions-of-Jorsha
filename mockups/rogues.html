// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  TRICKSTER — Rogue IV/VI                                                 ║
// ║  Status Effects Galore · Mischief · Dark green tunic with harlequin    ║
// ║  diamonds, ★ half-jester mask ★ on right side of face, bandolier of    ║
// ║  poison-vial throwing knives, alchemy belt, poison-chartreuse glow     ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Trickster extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = tricksterAnimations;
  }

  // Override update — slowly pulse the vials' poison content (subtle bubbling)
  update(time, dt) {
    super.update(time, dt);
    if (this.vials) {
      for (let i = 0; i < this.vials.length; i++) {
        this.vials[i].scale.y = 1 + Math.sin(time * 2 + i * 0.7) * 0.04;
      }
    }
  }

  build() {
    const root = this.group;

    // Legs — dark green/purple harlequin-pattern leggings with curl-toed shoes
    const buildTrickLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — alternating diamond pattern (dark green base)
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.trickGreen);
      thigh.position.y = 0.95; leg.add(thigh);
      // Diamond patches (small purple diamonds offset on the thigh)
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 2; j++) {
          const diamond = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.005), M.trickPurple);
          const a = j * Math.PI + (i * 0.5);
          diamond.position.set(Math.cos(a) * 0.115, 1.1 - i * 0.13, Math.sin(a) * 0.115);
          diamond.rotation.y = -a;
          diamond.rotation.z = Math.PI / 4;
          leg.add(diamond);
        }
      }
      // Knee — black
      const knee = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.trickBlack);
      knee.position.y = 0.66; knee.scale.set(1.05, 0.6, 1.1); leg.add(knee);
      // Lower shin — alternating diamonds again
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.trickGreenHi);
      shin.position.y = 0.36; leg.add(shin);
      // More diamonds on shin
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 2; j++) {
          const diamond = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.005), M.trickBlack);
          const a = j * Math.PI + (i * 0.5);
          diamond.position.set(Math.cos(a) * 0.125, 0.5 - i * 0.13, Math.sin(a) * 0.125);
          diamond.rotation.y = -a;
          diamond.rotation.z = Math.PI / 4;
          leg.add(diamond);
        }
      }
      // CURL-TOED SHOE (jester signature — pointed up-curl at the toe)
      const shoeBase = mesh(new THREE.BoxGeometry(0.18, 0.1, 0.32), M.trickBlack);
      shoeBase.position.set(0, 0.08, 0.06); leg.add(shoeBase);
      // Curl-up toe (small cone pointing UP from the front of the shoe)
      const curlBase = mesh(new THREE.SphereGeometry(0.055, 10, 8), M.trickGreenHi);
      curlBase.position.set(0, 0.1, 0.21); leg.add(curlBase);
      const curl = mesh(new THREE.ConeGeometry(0.025, 0.12, 6), M.trickGreenHi);
      curl.position.set(0, 0.18, 0.23); curl.rotation.x = -0.3;
      leg.add(curl);
      // Tiny bell at the curl tip
      const bell = mesh(new THREE.SphereGeometry(0.015, 8, 6), M.trickGold);
      bell.position.set(0, 0.26, 0.215);
      leg.add(bell);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildTrickLeg(-1));
    root.add(buildTrickLeg(1));

    // Pelvis — alchemy belt with hanging poison vials
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.trickGreen));
    // Black leather alchemy belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.12, 18), M.trickBlack);
    belt.position.y = 0.04; pelvis.add(belt);
    // Skull buckle (small)
    const skullBuckle = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.trickWhite);
    skullBuckle.position.set(0, 0.04, 0.31); skullBuckle.scale.set(1.1, 1.2, 0.5);
    pelvis.add(skullBuckle);
    // Empty eye sockets in skull buckle
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.trickBlack);
      eyeSock.position.set(i * 0.012, 0.05, 0.34);
      pelvis.add(eyeSock);
    }
    // POISON VIALS hanging from belt (5 vials with chartreuse liquid)
    this.vials = [];
    for (let i = -2; i <= 2; i++) {
      const vialBody = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.07, 8), M.trickWhite);
      vialBody.position.set(i * 0.08, -0.1, 0.16); pelvis.add(vialBody);
      // Chartreuse poison inside (the bubbling liquid)
      const poison = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 8), M.poisonRune);
      poison.position.set(i * 0.08, -0.1, 0.16);
      pelvis.add(poison);
      this.vials.push(poison);
      // Cork stopper
      const cork = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.012, 8), M.trickGold);
      cork.position.set(i * 0.08, -0.06, 0.16); pelvis.add(cork);
      // Tag/strap holding vial to belt
      const tag = mesh(new THREE.BoxGeometry(0.022, 0.018, 0.005), M.trickBlack);
      tag.position.set(i * 0.08, -0.045, 0.165); pelvis.add(tag);
    }
    // Asymmetric harlequin coat-tail (long on left, shorter on right — chaotic look)
    const tailL = mesh(new THREE.BoxGeometry(0.22, 0.55, 0.018), M.trickGreen);
    tailL.position.set(-0.1, -0.3, 0.27); tailL.rotation.x = -0.04; tailL.rotation.z = 0.04;
    pelvis.add(tailL);
    // Diamond accents on the long tail
    for (let i = 0; i < 3; i++) {
      const tailDia = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.005), M.trickPurple);
      tailDia.position.set(-0.1, -0.18 - i * 0.13, 0.28);
      tailDia.rotation.z = Math.PI / 4;
      pelvis.add(tailDia);
    }
    const tailR = mesh(new THREE.BoxGeometry(0.16, 0.32, 0.018), M.trickPurple);
    tailR.position.set(0.13, -0.18, 0.27); tailR.rotation.x = -0.04; tailR.rotation.z = -0.06;
    pelvis.add(tailR);
    root.add(pelvis);

    // TORSO — dark green doublet with harlequin diamond pattern
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Dark green tunic
    const tunic = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.trickGreen);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.trickGreenHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // ASYMMETRIC HARLEQUIN HALF — left half of the torso has a different (purple) overlay
    const harlequinL = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 16, 1, false, -Math.PI / 1.5, Math.PI * 0.8), M.trickPurple);
    harlequinL.scale.set(1.05, 1, 0.85);
    torso.add(harlequinL);

    // Diamond patches across the torso (alternating black + chartreuse on green/purple)
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 6; col++) {
        const a = (col / 6) * Math.PI * 1.5 - Math.PI * 0.55;
        const yPos = 0.22 - row * 0.13;
        const r = 0.36;
        const dia = mesh(new THREE.BoxGeometry(0.06, 0.06, 0.005), (row + col) % 2 === 0 ? M.trickBlack : M.trickWhite);
        dia.position.set(Math.cos(a) * r, yPos, Math.sin(a) * r);
        dia.lookAt(Math.cos(a) * 2, yPos, Math.sin(a) * 2);
        dia.rotateZ(Math.PI / 4);
        torso.add(dia);
      }
    }

    // BANDOLIER OF VIAL-KNIVES — diagonal across chest
    const bandolier = mesh(new THREE.BoxGeometry(0.07, 0.65, 0.022), M.trickBlack);
    bandolier.position.set(-0.04, 0.0, 0.36); bandolier.rotation.z = 0.4;
    torso.add(bandolier);
    // 4 vial-knives on the bandolier (small vials with knife-tips)
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const px = -0.18 + t * 0.32;
      const py = 0.22 - t * 0.55;
      // Vial body
      const vBody = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 8), M.trickWhite);
      vBody.position.set(px, py, 0.39); vBody.rotation.x = Math.PI / 2 - 0.4;
      torso.add(vBody);
      // Chartreuse poison
      const vPoison = mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.04, 8), M.poisonRune);
      vPoison.position.set(px, py, 0.39); vPoison.rotation.x = Math.PI / 2 - 0.4;
      torso.add(vPoison);
      this.vials.push(vPoison);
      // Knife tip protruding from the vial bottom
      const tip = mesh(new THREE.ConeGeometry(0.008, 0.025, 4), M.duelSilverHi);
      tip.position.set(px - 0.02, py + 0.018, 0.39); tip.rotation.x = Math.PI / 2 - 0.4;
      tip.rotation.z = 0.6;
      torso.add(tip);
    }

    // CHEST EMBLEM — laughing skull with green vapor (the trickster's grim humor)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.trickBlack);
    emblemBack.position.set(0.05, -0.18, 0.41); torso.add(emblemBack);
    // Skull
    const skull = mesh(new THREE.SphereGeometry(0.05, 14, 12), M.trickWhite);
    skull.position.set(0.05, -0.16, 0.42); skull.scale.set(1.0, 1.2, 0.5);
    torso.add(skull);
    // Eye sockets
    for (let side = -1; side <= 1; side += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.trickBlack);
      eyeSock.position.set(0.05 + side * 0.018, -0.15, 0.43); eyeSock.scale.set(1, 1.2, 0.5);
      torso.add(eyeSock);
    }
    // Triangular nose hole
    const noseHole = mesh(new THREE.ConeGeometry(0.008, 0.012, 3), M.trickBlack);
    noseHole.position.set(0.05, -0.18, 0.43); noseHole.rotation.x = Math.PI;
    torso.add(noseHole);
    // Wide grin (jagged teeth)
    for (let i = 0; i < 5; i++) {
      const tooth = mesh(new THREE.BoxGeometry(0.006, 0.012, 0.005), M.trickWhite);
      tooth.position.set(0.05 + (i - 2) * 0.01, -0.21, 0.435);
      torso.add(tooth);
    }
    // Green vapor wisps rising from the skull
    for (let i = -1; i <= 1; i++) {
      const vapor = mesh(new THREE.SphereGeometry(0.008, 6, 6), M.poisonRune);
      vapor.position.set(0.05 + i * 0.02, -0.07 + i * 0.005, 0.44); vapor.scale.set(1, 1.5, 0.7);
      torso.add(vapor);
    }

    // High collar (popped — purple with chartreuse rune trim)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.trickPurple);
    collar.position.y = 0.42; torso.add(collar);
    const collarRune = mesh(new THREE.TorusGeometry(0.21, 0.008, 8, 18, Math.PI * 1.2), M.poisonRune);
    collarRune.rotation.x = Math.PI / 2;
    collarRune.rotation.y = -Math.PI / 2;
    collarRune.position.y = 0.49;
    torso.add(collarRune);

    root.add(torso);
    this.parts.body = torso;

    // ASYMMETRIC SHOULDERS — left has 3-pointed jester ruff, right has plain cap
    // Left shoulder — jester ruff (3 small triangular tips with bells)
    const leftCap = mesh(new THREE.SphereGeometry(0.12, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.trickGreenHi);
    leftCap.scale.set(1, 0.55, 1);
    leftCap.position.set(-0.42, 2.18, 0);
    root.add(leftCap);
    // 3 jester ruff points with bells at tips
    for (let i = 0; i < 3; i++) {
      const a = -0.4 + i * 0.4;
      const ruffPoint = mesh(new THREE.ConeGeometry(0.025, 0.1, 5), i % 2 === 0 ? M.trickPurple : M.trickGreen);
      ruffPoint.position.set(-0.42 + Math.cos(a + Math.PI) * 0.15, 2.22 + Math.sin(a + Math.PI) * 0.05, 0.05);
      ruffPoint.rotation.z = a + Math.PI / 2;
      root.add(ruffPoint);
      // Tiny bell at each tip
      const bell = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.trickGold);
      bell.position.set(-0.42 + Math.cos(a + Math.PI) * 0.22, 2.16 + Math.sin(a + Math.PI) * 0.06, 0.05);
      root.add(bell);
    }
    // Right shoulder — plain purple cap
    const rightCap = mesh(new THREE.SphereGeometry(0.13, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.trickPurple);
    rightCap.scale.set(1, 0.6, 1);
    rightCap.position.set(0.42, 2.18, 0);
    root.add(rightCap);
    // Diamond accent on right cap
    const rightDia = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.008), M.trickGreenHi);
    rightDia.position.set(0.42, 2.27, 0); rightDia.rotation.z = Math.PI / 4;
    root.add(rightDia);

    // ARMS — green and purple alternating sleeves (left green, right purple)
    const leftArmPalette = { cloth: M.trickGreen, mid: M.trickGreenHi, dark: M.trickGreen, hi: M.trickPurple, accent: M.poisonRune };
    const rightArmPalette = { cloth: M.trickPurple, mid: M.trickPurple, dark: M.trickPurple, hi: M.trickGreenHi, accent: M.poisonRune };
    const leftArm = buildArm(-1, 0.18, leftArmPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, rightArmPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Diamond patches on the upper arms
    [leftArm, rightArm].forEach((arm, idx) => {
      for (let i = 0; i < 3; i++) {
        const dia = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.005), idx === 0 ? M.trickPurple : M.trickGreenHi);
        dia.position.set(0, -0.05 - i * 0.1, 0.085);
        dia.rotation.z = Math.PI / 4;
        arm.add(dia);
      }
      // Bell-cuff at wrist
      const cuff = mesh(new THREE.CylinderGeometry(0.092, 0.088, 0.07, 14), M.trickBlack);
      cuff.position.y = -0.85; arm.add(cuff);
      // 3 bells around the cuff
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2;
        const bell = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.trickGold);
        bell.position.set(Math.cos(a) * 0.092, -0.91, Math.sin(a) * 0.092);
        arm.add(bell);
      }
    });

    // RIGHT HAND holds a vial-tipped throwing knife (the signature weapon)
    const vialKnife = this._buildVialKnife();
    rightArm.userData.hand.add(vialKnife);
    vialKnife.position.set(0, 0.04, 0.06);
    vialKnife.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = vialKnife;

    // LEFT HAND holds a smaller curved blade (off-hand backup)
    const offDagger = mesh(new THREE.Group(), null);
    const offBlade = mesh(new THREE.ConeGeometry(0.014, 0.18, 4), M.duelSilverHi);
    offBlade.position.y = 0.18;

    offDaggerGroup.position.set(0, 0.04, 0.06);
    offDaggerGroup.rotation.set(Math.PI * 0.42, 0, 0);

    // Short tattered cloak (asymmetric — green with purple lining)
    const cape = buildCape({ material: M.trickGreen, width: 1.25, height: 1.5 });

  _buildVialKnife() {
    const vk = new THREE.Group();
    // Pommel
    const pommel = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.trickGold);
    vk.add(pommel);
    // Black grip
    const grip = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.14, 10), M.trickBlack);
    grip.position.y = 0.08; vk.add(grip);
    // Cord wraps
    for (let i = 0; i < 4; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.02, 0.0035, 5, 10), M.trickGreen);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.04 + i * 0.03;
      vk.add(wrap);
    }
    // Crossguard
    const cross = mesh(new THREE.BoxGeometry(0.08, 0.014, 0.02), M.trickGold);
    cross.position.y = 0.16; vk.add(cross);
    // VIAL (the marquee feature — clear vial filled with glowing chartreuse poison)
    const vialOuter = mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.08, 10), M.trickWhite);
    vialOuter.position.y = 0.22; vk.add(vialOuter);
    // Glowing poison inside
    const vialPoison = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.07, 10), M.poisonRune);
    vialPoison.position.y = 0.22; vk.add(vialPoison);
    this.vials.push(vialPoison);
    // Vial cap (stopper)
    const vialCap = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.012, 10), M.trickGold);
    vialCap.position.y = 0.27; vk.add(vialCap);
    // Bubbles (small chartreuse spheres at the top of the vial — the active poison)
    const bubble1 = mesh(new THREE.SphereGeometry(0.006, 6, 4), M.poisonRune);
    bubble1.position.set(0.005, 0.25, 0); vk.add(bubble1);
    const bubble2 = mesh(new THREE.SphereGeometry(0.005, 6, 4), M.poisonRune);
    bubble2.position.set(-0.008, 0.245, 0); vk.add(bubble2);
    // BLADE — extending out from the vial top (the knife edge)
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.014, 0); bladeShape.lineTo(0.014, 0);
    bladeShape.lineTo(0.008, 0.3); bladeShape.lineTo(0, 0.34); bladeShape.lineTo(-0.008, 0.3);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.01, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 1 }), M.duelSilverHi);
    blade.position.set(0, 0.28, -0.005); vk.add(blade);
    // Drip of poison from the blade tip
    const drip = mesh(new THREE.SphereGeometry(0.008, 6, 6), M.poisonRune);
    drip.position.set(0, 0.6, 0); drip.scale.set(1, 1.5, 1);
    vk.add(drip);
    return vk;
  }

  _buildTricksterHead() {
    const head = new THREE.Group();

    // Hair — wild messy
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.trickGreenHi);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Wild hair tufts (purple highlights)
    for (let side = -1; side <= 1; side += 2) {
      const tuft = mesh(new THREE.SphereGeometry(0.06, 10, 8), M.trickPurple);
      tuft.position.set(side * 0.16, 0.16, 0); tuft.scale.set(0.8, 1.4, 0.7);
      tuft.rotation.z = side * 0.4;
      head.add(tuft);
    }

    // ===== HALF-JESTER MASK on RIGHT side of face (the marquee feature) =====
    // Mask shell (purple half-disc)
    const maskShape = new THREE.Shape();
    maskShape.moveTo(0, -0.08); maskShape.lineTo(0.16, -0.05);
    maskShape.bezierCurveTo(0.18, 0.02, 0.16, 0.1, 0.08, 0.13);
    maskShape.lineTo(0, 0.13);
    maskShape.lineTo(0, -0.08);
    maskShape.closePath();
    const mask = mesh(new THREE.ExtrudeGeometry(maskShape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2 }), M.trickPurple);
    mask.position.set(0, -0.02, 0.18);
    head.add(mask);
    // Diamond pattern on the mask (alternating chartreuse + black)
    for (let i = 0; i < 3; i++) {
      const dia = mesh(new THREE.BoxGeometry(0.025, 0.025, 0.005), i % 2 === 0 ? M.poisonRune : M.trickBlack);
      dia.position.set(0.05 + i * 0.04, 0.04 - i * 0.05, 0.21);
      dia.rotation.z = Math.PI / 4;
      head.add(dia);
    }
    // Right eye glow shows through the mask hole (chartreuse)
    const maskEye = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.trickEye);
    maskEye.position.set(0.075, -0.02, 0.215); head.add(maskEye);
    // Mask point (a single jester-tip extending up from the right side of the head)
    const maskTip = mesh(new THREE.ConeGeometry(0.025, 0.18, 5), M.trickPurple);
    maskTip.position.set(0.16, 0.22, 0.04); maskTip.rotation.z = -0.3;
    head.add(maskTip);
    // Bell at the tip
    const maskBell = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.trickGold);
    maskBell.position.set(0.21, 0.32, 0.04);
    head.add(maskBell);

    // Left side (uncovered) — visible eye + smug grin
    const eyeStripL = mesh(new THREE.BoxGeometry(0.1, 0.025, 0.02), M.stoneDark);
    eyeStripL.position.set(-0.075, -0.025, 0.18); head.add(eyeStripL);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.trickEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    // Curved eyebrow (smug arch)
    const browL = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.004), M.trickGreenHi);
    browL.position.set(-0.075, 0.02, 0.21); browL.rotation.z = -0.25;
    head.add(browL);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skin);
    nose.position.set(-0.02, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Wide smug grin (asymmetric, leaning to one side)
    const grin = mesh(new THREE.BoxGeometry(0.09, 0.012, 0.005), M.skinDark);
    grin.position.set(-0.025, -0.13, 0.22); grin.rotation.z = 0.18;
    head.add(grin);
    // Tongue-tip sticking out (the trickster's playful detail)
    const tongueTip = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.duelCrimson);
    tongueTip.position.set(0.015, -0.135, 0.225);
    head.add(tongueTip);

    return head;
  }
}

// ║  BLADESTORM — Rogue V/VI                                                 ║
// ║  Multi-Hit AoE · Steel Tornado · Crimson-black warrior outfit, ★ twin- ║
// ║  bladed glaive on back ★, twin curved crossblades in hands, spiked    ║

// ╚══════════════════════════════════════════════════════════════════════════╝
class Bladestorm extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = bladestormAnimations;
  }

  // Override update — slowly rotate the held crossblades around their grips (idle spin)
  update(time, dt) {
    super.update(time, dt);
    if (this.leftCrossblade) this.leftCrossblade.rotation.y = time * 0.6;
    if (this.rightCrossblade) this.rightCrossblade.rotation.y = -time * 0.55;
  }

  build() {
    const root = this.group;

    // Legs — black-red plated breeches with steel greaves
    const buildBsLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — bsBlack
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.bsBlack);
      thigh.position.y = 0.95; leg.add(thigh);
      // Crimson stripe down the side
      const stripe = mesh(new THREE.BoxGeometry(0.018, 0.55, 0.005), M.bsCrimsonHi);
      stripe.position.set(sx * 0.115, 0.95, 0.05); leg.add(stripe);
      // Knee — steel plate with spike
      const knee = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.bsSteel);
      knee.position.y = 0.66; knee.scale.set(1.05, 0.6, 1.1); leg.add(knee);
      // Knee spike
      const kneeSpike = mesh(new THREE.ConeGeometry(0.022, 0.06, 5), M.bsSteelHi);
      kneeSpike.position.set(0, 0.66, 0.13); kneeSpike.rotation.x = Math.PI / 2;
      leg.add(kneeSpike);
      // Lower shin — steel greave
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.bsSteel);
      shin.position.y = 0.36; leg.add(shin);
      // Crimson trim along greave edge
      const trim = mesh(new THREE.TorusGeometry(0.13, 0.012, 8, 16), M.bsCrimsonHi);
      trim.rotation.x = Math.PI / 2; trim.position.y = 0.6;
      leg.add(trim);
      // Boot — black with spiked toe
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.bsBlack);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Toe spike
      const toeSpike = mesh(new THREE.ConeGeometry(0.025, 0.08, 5), M.bsSteelHi);
      toeSpike.position.set(0, 0.105, 0.24); toeSpike.rotation.x = Math.PI / 2;
      leg.add(toeSpike);
      // Heel
      const heel = mesh(new THREE.BoxGeometry(0.12, 0.06, 0.06), M.bsBlackHi);
      heel.position.set(0, 0.04, -0.04); leg.add(heel);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildBsLeg(-1));
    root.add(buildBsLeg(1));

    // Pelvis — crimson sash + steel hip-plates
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.bsBlack));
    // Crimson sash belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.12, 18), M.bsCrimson);
    belt.position.y = 0.04; pelvis.add(belt);
    // Steel buckle — diamond shape
    const buckle = mesh(new THREE.BoxGeometry(0.06, 0.06, 0.018), M.bsSteelHi);
    buckle.position.set(0, 0.04, 0.31); buckle.rotation.z = Math.PI / 4;
    pelvis.add(buckle);
    // Magenta rune in buckle
    const buckleRune = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.bsRune);
    buckleRune.position.set(0, 0.04, 0.33); buckleRune.scale.set(1, 1, 0.5);
    pelvis.add(buckleRune);
    // Hip plates with spikes (4 around the lower pelvis)
    for (let i = 0; i < 4; i++) {
      const a = -Math.PI / 2 + (i / 3) * Math.PI;
      const plate = mesh(new THREE.BoxGeometry(0.12, 0.3, 0.025), M.bsSteel);
      plate.position.set(Math.cos(a) * 0.3, -0.18, Math.sin(a) * 0.3);
      plate.lookAt(Math.cos(a) * 2, -0.18, Math.sin(a) * 2);
      plate.rotateX(0.06);
      pelvis.add(plate);
      // Spike on each plate
      const plateSpike = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.bsSteelHi);
      plateSpike.position.set(Math.cos(a) * 0.34, -0.32, Math.sin(a) * 0.34);
      plateSpike.lookAt(Math.cos(a) * 2, -0.5, Math.sin(a) * 2);
      pelvis.add(plateSpike);
    }
    root.add(pelvis);

    // TORSO — black-crimson cuirass with steel ribbing
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Base bsBlack body
    const base = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.bsBlack);
    base.scale.set(1.0, 1, 0.85);
    torso.add(base);

    // Front crimson cuirass plate (highlight color)
    const cuirass = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.55, 16, 1, false, -Math.PI / 2.2, Math.PI * 1.3), M.bsCrimson);
    cuirass.scale.set(1.05, 1, 0.85);
    cuirass.position.y = 0.04;
    torso.add(cuirass);

    // Pec mounds (crimson)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.bsCrimsonHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Steel ribbing across the abs (3 horizontal bands)
    for (let i = 0; i < 3; i++) {
      const rib = mesh(new THREE.TorusGeometry(0.36, 0.012, 8, 24, Math.PI * 0.7), M.bsSteel);
      rib.position.set(0, -0.0 - i * 0.1, 0);
      rib.rotation.y = -Math.PI / 2;
      rib.rotation.x = Math.PI / 2;
      rib.scale.set(1.05, 1, 0.85);
      torso.add(rib);
    }

    // Chest emblem — spinning blade-vortex sigil (the marquee Bladestorm symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.085, 16), M.bsBlackHi);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // 6 curved blades arranged radially (suggesting a spinning rotor)
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const bladeMark = mesh(new THREE.BoxGeometry(0.012, 0.08, 0.005), M.bsSteelHi);
      bladeMark.position.set(Math.cos(a) * 0.045, 0.22 + Math.sin(a) * 0.045, 0.42);
      bladeMark.rotation.z = a + Math.PI / 8; // offset for curve illusion
      torso.add(bladeMark);
    }
    // Central magenta gem
    const emblemGem = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.bsRune);
    emblemGem.position.set(0, 0.22, 0.43); emblemGem.scale.set(1, 1, 0.5);
    torso.add(emblemGem);
    // Outer magenta ring
    const emblemRing = mesh(new THREE.TorusGeometry(0.075, 0.005, 8, 24), M.bsRune);
    emblemRing.position.set(0, 0.22, 0.42);
    torso.add(emblemRing);

    // High collar — black with magenta trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.bsBlackHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.bsRune);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // SPIKED PAULDRONS — heavy steel with multiple spikes radiating outward
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.22, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.6), M.bsSteel);
      pauld.scale.set(1.1, 0.9, 1);
      pauld.position.set(side * 0.42, 2.2, 0);
      root.add(pauld);
      // Crimson rim
      const pauldTrim = mesh(new THREE.TorusGeometry(0.22, 0.012, 8, 20), M.bsCrimsonHi);
      pauldTrim.rotation.x = Math.PI / 2; pauldTrim.position.set(side * 0.42, 2.16, 0);
      root.add(pauldTrim);
      // 4 spikes per pauldron radiating outward
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI / 2 + (i / 3) * Math.PI;
        const spike = mesh(new THREE.ConeGeometry(0.022, 0.1, 5), M.bsSteelHi);
        spike.position.set(side * 0.42 + Math.cos(a) * 0.18, 2.2 + Math.sin(a) * 0.05, Math.sin(a) * 0.18);
        spike.lookAt(side * 0.42 + Math.cos(a) * 1, 2.4, Math.sin(a) * 1);
        spike.rotateX(-Math.PI / 2);
        root.add(spike);
      }
      // Magenta rune disc on pauldron top
      const pauldRune = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.bsRune);
      pauldRune.position.set(side * 0.42, 2.34, 0); pauldRune.scale.set(1, 0.4, 1);
      root.add(pauldRune);
    }

    // ARMS — black with steel vambraces
    const armPalette = { cloth: M.bsBlack, mid: M.bsSteel, dark: M.bsBlackHi, hi: M.bsSteelHi, accent: M.bsCrimson };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Steel rings + magenta runes on the forearms
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.088, 0.012, 8, 16), M.bsSteelHi);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.5 - i * 0.13;
        arm.add(ring);
      }
      // Magenta rune on the wrist
      const wristRune = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.bsRune);
      wristRune.position.set(0, -0.85, 0.085); wristRune.scale.set(1, 0.5, 1);
      arm.add(wristRune);
    });

    // TWIN CROSSBLADES — held in each hand (curved boomerang blades)
    this.leftCrossblade = this._buildCrossblade();
    leftArm.userData.hand.add(this.leftCrossblade);
    this.leftCrossblade.position.set(0, 0.0, 0.06);
    this.leftCrossblade.rotation.set(Math.PI / 2, 0, 0);
    this.parts.leftWeapon = this.leftCrossblade;

    this.rightCrossblade = this._buildCrossblade();
    rightArm.userData.hand.add(this.rightCrossblade);
    this.rightCrossblade.position.set(0, 0.0, 0.06);
    this.rightCrossblade.rotation.set(Math.PI / 2, 0, 0);
    this.parts.rightWeapon = this.rightCrossblade;

    // ===== TWIN-BLADED GLAIVE — strapped diagonally across the back (the marquee feature) =====
    const glaive = this._buildTwinGlaive();
    glaive.position.set(0.0, 1.95, -0.32);
    glaive.rotation.set(0, 0, Math.PI / 6);
    root.add(glaive);
    this.parts.glaive = glaive;

    // No flowing cape (would clip with glaive on back)
    this.cape = null;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — open helm, fierce face
    const head = this._buildBladestormHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.bsEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.bsEye;
  }

  _buildCrossblade() {
    const cb = new THREE.Group();
    // Central hub (the grip wrapped around the center)
    const hub = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.05, 12), M.bsBlack);
    hub.rotation.x = Math.PI / 2;
    cb.add(hub);
    // Hub trim
    const hubRim = mesh(new THREE.TorusGeometry(0.04, 0.005, 6, 14), M.bsSteelHi);
    cb.add(hubRim);
    // Magenta rune in the hub center
    const hubRune = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.bsRune);
    hubRune.position.z = 0.025; hubRune.scale.set(1, 1, 0.5);
    cb.add(hubRune);
    // 4 curved blades extending outward (the crossblade — like a boomerang star)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      // Curved blade shape
      const bladeShape = new THREE.Shape();
      bladeShape.moveTo(-0.012, 0.04); bladeShape.lineTo(0.012, 0.04);
      bladeShape.bezierCurveTo(0.025, 0.08, 0.04, 0.16, 0.02, 0.24);
      bladeShape.lineTo(0, 0.26); bladeShape.lineTo(-0.02, 0.24);
      bladeShape.bezierCurveTo(-0.025, 0.16, -0.025, 0.08, -0.012, 0.04);
      bladeShape.closePath();
      const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 1 }), M.bsBladeEdge);
      blade.position.set(0, 0, -0.006);
      blade.rotation.z = a;
      cb.add(blade);
      // Magenta rune line down each blade
      const bladeLine = mesh(new THREE.BoxGeometry(0.005, 0.18, 0.004), M.bsRune);
      bladeLine.position.set(Math.sin(a) * -0.13, Math.cos(a) * 0.13, 0.008);
      bladeLine.rotation.z = a;
      cb.add(bladeLine);
    }
    return cb;
  }

  _buildTwinGlaive() {
    const glaive = new THREE.Group();
    // Long central haft (about 1.4 long)
    const haft = mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.2, 12), M.bsBlackHi);
    haft.position.y = 0; glaive.add(haft);
    // Crimson cord wraps along the haft
    for (let i = 0; i < 6; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.bsCrimsonHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = -0.5 + i * 0.2;
      glaive.add(wrap);
    }
    // Mid-haft steel collar with magenta rune
    const midCollar = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.04, 10), M.bsSteelHi);
    midCollar.position.y = 0; glaive.add(midCollar);
    const midRune = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.bsRune);
    midRune.position.set(0, 0, 0.028); midRune.scale.set(1, 1, 0.5);
    glaive.add(midRune);
    // BLADE 1 (top end) — curved scimitar-like blade
    for (let yDir = -1; yDir <= 1; yDir += 2) {
      // Steel collar where blade meets haft
      const bladeCollar = mesh(new THREE.CylinderGeometry(0.034, 0.025, 0.05, 10), M.bsSteelHi);
      bladeCollar.position.y = yDir * 0.62; glaive.add(bladeCollar);
      // Curved blade shape
      const bladeShape = new THREE.Shape();
      bladeShape.moveTo(-0.018, 0); bladeShape.lineTo(0.018, 0);
      bladeShape.bezierCurveTo(0.04, 0.08, 0.06, 0.22, 0.02, 0.42);
      bladeShape.lineTo(0, 0.44); bladeShape.lineTo(-0.02, 0.42);
      bladeShape.bezierCurveTo(-0.025, 0.22, -0.025, 0.08, -0.018, 0);
      bladeShape.closePath();
      const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.014, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.003, bevelSegments: 2 }), M.bsBladeEdge);
      blade.position.set(0, yDir * 0.66, -0.007);
      if (yDir < 0) blade.rotation.x = Math.PI;
      glaive.add(blade);
      // Magenta inscription down the blade
      const inscription = mesh(new THREE.BoxGeometry(0.005, 0.36, 0.004), M.bsRune);
      inscription.position.set(0, yDir * 0.86, 0.01);
      glaive.add(inscription);
      // Steel barb at the inner edge of each blade
      const barb = mesh(new THREE.ConeGeometry(0.014, 0.05, 4), M.bsSteelHi);
      barb.position.set(yDir * 0.025, yDir * 0.7, 0); barb.rotation.z = -yDir * Math.PI / 3;
      glaive.add(barb);
    }
    return glaive;
  }

  _buildBladestormHead() {
    const head = new THREE.Group();

    // Hair — short, dark crimson
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.bsBlackHi);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Crimson hair-streak (a vertical streak across the top of the head)
    const streak = mesh(new THREE.BoxGeometry(0.07, 0.08, 0.18), M.bsCrimsonHi);
    streak.position.set(0, 0.16, 0); streak.rotation.x = -0.1;
    head.add(streak);

    // STEEL CIRCLET with magenta gems (warrior crown)
    const circlet = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 24), M.bsSteelHi);
    circlet.rotation.x = Math.PI / 2;
    circlet.position.y = 0.04;
    head.add(circlet);
    // Forward-facing magenta gem (heart-shaped — a bladestorm rune)
    const browGem = mesh(new THREE.SphereGeometry(0.03, 12, 10), M.bsRune);
    browGem.position.set(0, 0.06, 0.21); browGem.scale.set(1.2, 0.7, 0.5);
    head.add(browGem);
    // Two upturned spike-prongs flanking the gem (warrior crown)
    for (let side = -1; side <= 1; side += 2) {
      const prong = mesh(new THREE.ConeGeometry(0.018, 0.1, 4), M.bsSteelHi);
      prong.position.set(side * 0.075, 0.12, 0.2);
      prong.rotation.z = side * 0.4;
      head.add(prong);
    }
    // 3 rear spikes on the back of the circlet
    for (let i = -1; i <= 1; i++) {
      const rearSpike = mesh(new THREE.ConeGeometry(0.018, 0.08, 4), M.bsSteelHi);
      rearSpike.position.set(i * 0.07, 0.1, -0.2);
      head.add(rearSpike);
    }

    // Eyes — whirling-magenta glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.bsEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Sharp eyebrows (battle-fury look)
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.06, 0.012, 0.005), M.bsBlackHi);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.3;
      head.add(brow);
    }

    // Crimson scar across the cheek (battle scar — the marquee face detail)
    const scar = mesh(new THREE.BoxGeometry(0.12, 0.005, 0.003), M.bsCrimsonHi);
    scar.position.set(-0.04, -0.06, 0.22); scar.rotation.z = -0.5;
    head.add(scar);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Snarl
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); mouth.rotation.z = -0.1;
    head.add(mouth);

    return head;
  }
}

        rightArm: { rx: -1.1, rz: 0.0 },
        body:     { ry: 0.18 },
        head:     { ry: 0.0 },
      }, ease: ease.out },
      { t: 0.75, values: {                                          // hold the post-throw pose
        rightArm: { rx: -0.85, rz: 0.0 },
        body:     { ry: 0.12 },
      }},
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.5, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        // Glaive flight — magenta light pillar streaking forward
        const flightPath = new THREE.Vector3(champPos.x, 0.12, champPos.z + 1.5);
        mgr.spawn(new LightPillar(champ.scene, flightPath, { color: 0xff60c0, height: 2.4, radius: 0.3, duration: 0.5 }), time);
        // Far impact (the glaive landing — with both blades dealing 2 hits)
        const targetPos = new THREE.Vector3(champPos.x, 1.5, champPos.z + 2.2);
        mgr.spawn(new ImpactFlash(champ.scene, targetPos, { color: 0xff60c0, maxScale: 0.7, duration: 0.32 }), time);
        // Two impact rings stacked (the dual blade hits)
        const groundPos = new THREE.Vector3(targetPos.x, 0.12, targetPos.z);
        mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xe040a0, maxRadius: 1.4, duration: 0.6 }), time);
        mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xff60c0, maxRadius: 1.0, duration: 0.5 }), time + 0.15);
        // Magenta sparks
        mgr.spawn(new ParticleBurst(champ.scene, targetPos, { color: 0xff60c0, count: 40, speed: 5, duration: 0.85, upwardBias: 0.8, gravity: -2.5 }), time);
      }},
      { time: 0.95, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        // Boomerang return impact (the glaive hits again on return)
        const returnPos = new THREE.Vector3(champPos.x, 1.3, champPos.z + 0.8);
        mgr.spawn(new ImpactFlash(champ.scene, returnPos, { color: 0xff60c0, maxScale: 0.55, duration: 0.3 }), time);
        const groundPos = new THREE.Vector3(returnPos.x, 0.12, returnPos.z);
        mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xe040a0, maxRadius: 1.0, duration: 0.55 }), time);
      }},
    ],
  },
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  REAPER — Rogue VI/VI                                                    ║
// ║  Death-Themed · Kill Bonuses · Tall lean silhouette, ★ long curved     ║
// ║  scythe ★, lower-face skull half-mask, tattered jagged black cloak    ║
// ║  with bone trim, faded gold accents, bone-pallor eye glow              ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Reaper extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = reaperAnimations;
  }

  // Override update — slow ominous pulse on the scythe runes
  update(time, dt) {
    super.update(time, dt);
    if (this.scytheRune) {
      this.scytheRune.scale.setScalar(1 + Math.sin(time * 1.2) * 0.08);
    }
  }

  build() {
    const root = this.group;

    // Legs — black cloth + bone-trim greaves
    const buildReaperLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — black cloth
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.reaperCloth);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee — bone plate
      const knee = mesh(new THREE.SphereGeometry(0.105, 12, 8), M.reaperBone);
      knee.position.y = 0.66; knee.scale.set(1.1, 0.6, 1.1); leg.add(knee);
      // Bone spike at knee
      const kneeSpike = mesh(new THREE.ConeGeometry(0.018, 0.06, 5), M.reaperBoneHi);
      kneeSpike.position.set(0, 0.66, 0.13); kneeSpike.rotation.x = Math.PI / 2;
      leg.add(kneeSpike);
      // Lower shin — black with bone-trim
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.reaperClothHi);
      shin.position.y = 0.36; leg.add(shin);
      // Bone-fragment strapping along the shin
      for (let i = 0; i < 4; i++) {
        const bone = mesh(new THREE.BoxGeometry(0.05, 0.025, 0.018), M.reaperBone);
        bone.position.set(sx * 0.115, 0.5 - i * 0.1, 0.05);
        bone.rotation.z = sx * 0.1;
        leg.add(bone);
      }
      // Bone-trim greave band at hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.13, 0.012, 8, 16), M.reaperBoneHi);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Boot — black, slightly tattered (jagged silhouette)
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.reaperCloth);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Faded gold buckle
      const bootBuckle = mesh(new THREE.BoxGeometry(0.04, 0.025, 0.018), M.reaperGoldHi);
      bootBuckle.position.set(0, 0.13, 0.22); leg.add(bootBuckle);
      // Bone-claw toe
      const toeClaw = mesh(new THREE.ConeGeometry(0.014, 0.05, 4), M.reaperBoneHi);
      toeClaw.position.set(0, 0.085, 0.24); toeClaw.rotation.x = Math.PI / 2;
      leg.add(toeClaw);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildReaperLeg(-1));
    root.add(buildReaperLeg(1));

    // Pelvis — bone-trimmed black with hanging skull-charms
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.reaperCloth));
    // Black leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.1, 18), M.reaperClothHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Faded gold buckle (skull shape)
    const buckleBack = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.reaperGoldHi);
    buckleBack.position.set(0, 0.04, 0.31); buckleBack.scale.set(1.1, 1.2, 0.5);
    pelvis.add(buckleBack);
    // Skull face on the buckle (eye sockets)
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.reaperCloth);
      eyeSock.position.set(i * 0.012, 0.05, 0.34);
      pelvis.add(eyeSock);
    }
    // Skull grin (small horizontal line)
    const skullGrin = mesh(new THREE.BoxGeometry(0.022, 0.005, 0.004), M.reaperCloth);
    skullGrin.position.set(0, 0.025, 0.34);
    pelvis.add(skullGrin);
    // Hanging bone trophies (5 across the front of the belt)
    for (let i = -2; i <= 2; i++) {
      // Cord
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.06, 4), M.reaperClothHi);
      cord.position.set(i * 0.06, -0.05, 0.31);
      pelvis.add(cord);
      // Bone trophy (small finger-bone or tooth)
      const trophy = mesh(new THREE.ConeGeometry(0.012 + (Math.abs(i) % 2) * 0.005, 0.05, 5), M.reaperBoneHi);
      trophy.position.set(i * 0.06, -0.11, 0.31);
      trophy.rotation.x = Math.PI;
      pelvis.add(trophy);
    }
    root.add(pelvis);

    // TORSO — black undertunic with bone-rib chestpiece
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Black undertunic
    const tunic = mesh(new THREE.CylinderGeometry(0.32, 0.3, 0.7, 16), M.reaperCloth);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Bone rib-cage chest piece (the marquee body feature — actual bone ribs across the torso)
    // 5 curved bone strips on each side
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 5; i++) {
        const yPos = 0.22 - i * 0.1;
        const ribBone = mesh(new THREE.BoxGeometry(0.18, 0.025, 0.022), M.reaperBoneHi);
        ribBone.position.set(side * 0.16, yPos, 0.28);
        ribBone.rotation.z = side * 0.18;
        torso.add(ribBone);
        // Tiny bone-rune mark on each rib
        const ribRune = mesh(new THREE.SphereGeometry(0.008, 6, 6), M.reaperRune);
        ribRune.position.set(side * 0.13, yPos, 0.31);
        torso.add(ribRune);
      }
    }
    // Central sternum bone (vertical)
    const sternum = mesh(new THREE.BoxGeometry(0.04, 0.55, 0.025), M.reaperBoneHi);
    sternum.position.set(0, -0.05, 0.3);
    torso.add(sternum);

    // Pec mounds (bone)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.reaperBoneDark);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — skull on the sternum (the death-mark)
    const skullPiece = mesh(new THREE.SphereGeometry(0.05, 14, 12), M.reaperBoneHi);
    skullPiece.position.set(0, 0.22, 0.34); skullPiece.scale.set(1.0, 1.2, 0.5);
    torso.add(skullPiece);
    // Eye sockets
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.reaperCloth);
      eyeSock.position.set(i * 0.014, 0.235, 0.355);
      torso.add(eyeSock);
    }
    // Skull jaw teeth
    for (let i = 0; i < 5; i++) {
      const tooth = mesh(new THREE.BoxGeometry(0.008, 0.015, 0.005), M.reaperBoneHi);
      tooth.position.set((i - 2) * 0.012, 0.18, 0.36);
      torso.add(tooth);
    }
    // Bone-pallor rune dot above the skull (the death-glow)
    const skullGlow = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.reaperRune);
    skullGlow.position.set(0, 0.27, 0.36); skullGlow.scale.set(1, 0.5, 0.6);
    torso.add(skullGlow);

    // High collar — black with bone-trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.16, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.reaperClothHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarBoneTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.reaperBoneHi);
    collarBoneTrim.rotation.x = Math.PI / 2;
    collarBoneTrim.rotation.y = -Math.PI / 2;
    collarBoneTrim.position.y = 0.5;
    torso.add(collarBoneTrim);

    root.add(torso);
    this.parts.body = torso;

    // Skull pauldrons (heavy bone shoulder caps with skull-shape on top)
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.18, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.reaperBoneDark);
      pauld.scale.set(1.1, 0.85, 1);
      pauld.position.set(side * 0.42, 2.18, 0);
      root.add(pauld);
      // Bone-hi rim
      const pauldTrim = mesh(new THREE.TorusGeometry(0.18, 0.012, 8, 20), M.reaperBoneHi);
      pauldTrim.rotation.x = Math.PI / 2; pauldTrim.position.set(side * 0.42, 2.14, 0);
      root.add(pauldTrim);
      // Skull on top of pauldron
      const pauldSkull = mesh(new THREE.SphereGeometry(0.06, 14, 12), M.reaperBoneHi);
      pauldSkull.position.set(side * 0.42, 2.32, 0); pauldSkull.scale.set(1.0, 1.2, 0.6);
      root.add(pauldSkull);
      // Skull eyes
      for (let i = -1; i <= 1; i += 2) {
        const eyeSock = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.reaperCloth);
        eyeSock.position.set(side * 0.42 + i * 0.018, 2.33, 0.04);
        root.add(eyeSock);
      }
      // Bone glow gem in the pauldron-skull's forehead
      const pauldGem = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.reaperRune);
      pauldGem.position.set(side * 0.42, 2.36, 0.04);
      root.add(pauldGem);
    }

    // ARMS — black cloth + bone-claw gauntlets
    const armPalette = { cloth: M.reaperCloth, mid: M.reaperBoneDark, dark: M.reaperCloth, hi: M.reaperBoneHi, accent: M.reaperGold };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Bone-claw fingertips on both gauntlets
    [leftArm, rightArm].forEach(arm => {
      // 4 bone claws extending from each gauntlet
      for (let i = 0; i < 4; i++) {
        const claw = mesh(new THREE.ConeGeometry(0.012, 0.05, 4), M.reaperBoneHi);
        claw.position.set((i - 1.5) * 0.025, -1.0, 0.04);
        claw.rotation.x = Math.PI;
        arm.add(claw);
      }
      // Faded gold knuckle ring with bone-rune
      const knuckle = mesh(new THREE.TorusGeometry(0.075, 0.012, 6, 14), M.reaperGold);
      knuckle.rotation.x = Math.PI / 2; knuckle.position.y = -0.92;
      arm.add(knuckle);
      const knuckleRune = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.reaperRune);
      knuckleRune.position.set(0, -0.92, 0.07);
      arm.add(knuckleRune);
    });

    // SCYTHE — held in right hand (the marquee weapon)
    const scythe = this._buildScythe();
    rightArm.userData.hand.add(scythe);
    scythe.position.set(0, 0.04, 0.06);
    scythe.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = scythe;

    // TATTERED CLOAK with jagged hem
    const cape = buildCape({ material: M.reaperCloth, width: 1.5, height: 2.1 });
    cape.position.set(0, 2.4, -0.05);
    root.add(cape);
    this.cape = cape;

    // Bone-trim along the cloak's bottom hem (small bone fragments hanging)
    for (let i = -3; i <= 3; i++) {
      const t = i / 3;
      // Bone-fragment shapes hanging from the cloak's edge
      const fragment = mesh(new THREE.ConeGeometry(0.02, 0.08 + Math.abs(t) * 0.04, 4), M.reaperBoneHi);
      fragment.position.set(t * 0.5, 0.5, -0.16);
      fragment.rotation.x = Math.PI;
      root.add(fragment);
    }
    // Cloak gold trim along the bottom (faded gold)
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.015, 8, 28, Math.PI), M.reaperGold);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.55, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck (skin — pale)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — skull half-mask (lower face) + glowing bone-pallor eyes
    const head = this._buildReaperHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.reaperEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.reaperEye;
  }

  _buildScythe() {
    const scythe = new THREE.Group();
    // Pommel — bone capped end
    const pommel = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.reaperBoneHi);
    scythe.add(pommel);
    // Faded gold cap
    const pommelCap = mesh(new THREE.CylinderGeometry(0.034, 0.03, 0.018, 10), M.reaperGoldHi);
    pommelCap.position.y = 0.025; scythe.add(pommelCap);
    // LONG BLACK HAFT (about 1.5 long for dramatic scythe profile)
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.reaperCloth);
    haft.position.y = 0.74; scythe.add(haft);
    // Faded gold cord wraps along the haft
    for (let i = 0; i < 7; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.reaperGold);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.2;
      scythe.add(wrap);
    }
    // Mid-haft bone collar
    const midCollar = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.04, 10), M.reaperBoneHi);
    midCollar.position.y = 0.74; scythe.add(midCollar);
    // Top collar (where head meets haft) — bone with gold rim
    const topCollar = mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.07, 10), M.reaperBoneHi);
    topCollar.position.y = 1.46; scythe.add(topCollar);
    // BIG CURVED SCYTHE BLADE — the iconic crescent shape
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.025, 0); bladeShape.lineTo(0.025, 0);
    bladeShape.bezierCurveTo(0.5, 0.04, 0.7, 0.42, 0.5, 0.88);
    bladeShape.bezierCurveTo(0.4, 0.62, 0.25, 0.32, 0.0, 0.05);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.022, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.004, bevelSegments: 2 }), M.bsBladeEdge);
    blade.position.set(0, 1.5, -0.011); blade.scale.set(0.85, 0.85, 1);
    scythe.add(blade);
    // Sharp inner cutting edge (lighter steel highlight)
    const edgeShape = new THREE.Shape();
    edgeShape.moveTo(0.05, 0.05); edgeShape.bezierCurveTo(0.42, 0.1, 0.62, 0.42, 0.45, 0.82);
    edgeShape.bezierCurveTo(0.4, 0.55, 0.32, 0.3, 0.06, 0.06);
    edgeShape.closePath();
    const edge = mesh(new THREE.ExtrudeGeometry(edgeShape, { depth: 0.026, bevelEnabled: false }), M.bsBladeEdge);
    edge.position.set(0, 1.5, -0.013); edge.scale.set(0.85, 0.85, 1);
    scythe.add(edge);
    // Bone-pallor rune embedded in the blade's heart (the soul-collector glow)
    const bladeRune = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.reaperRune);
    bladeRune.position.set(0.18, 1.7, 0); bladeRune.scale.set(1, 1, 0.5);
    scythe.add(bladeRune);
    this.scytheRune = bladeRune;
    // Faded gold inscription along the spine of the blade
    const inscription = mesh(new THREE.BoxGeometry(0.005, 0.55, 0.003), M.reaperRune);
    inscription.position.set(0, 1.78, 0.012); inscription.rotation.z = -0.5;
    scythe.add(inscription);
    return scythe;
  }

  _buildReaperHead() {
    const head = new THREE.Group();

    // Pale skin face (very pale, almost gaunt)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.92, 1.0, 0.95);
    head.add(face);

    // Hair — long, black, stringy
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.reaperCloth);
    scalp.scale.set(1, 1.1, 1.05);
    head.add(scalp);

    // Long stringy back hair
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.reaperCloth);
    backHair.scale.set(1.05, 1.6, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);

    // ===== SKULL HALF-MASK — covers lower face (jaw + chin) — the marquee feature =====
    // Mask shell (bone-colored)
    const maskShape = new THREE.Shape();
    maskShape.moveTo(-0.16, 0); maskShape.lineTo(0.16, 0);
    maskShape.bezierCurveTo(0.18, -0.1, 0.1, -0.2, 0, -0.22);
    maskShape.bezierCurveTo(-0.1, -0.2, -0.18, -0.1, -0.16, 0);
    maskShape.closePath();
    const mask = mesh(new THREE.ExtrudeGeometry(maskShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 2 }), M.reaperBoneHi);
    mask.position.set(0, -0.04, 0.13);
    head.add(mask);
    // Skull teeth across the mask front (visible jaw)
    for (let i = -3; i <= 3; i++) {
      const tooth = mesh(new THREE.BoxGeometry(0.012, 0.022, 0.005), M.reaperBoneDark);
      tooth.position.set(i * 0.022, -0.13, 0.215);
      head.add(tooth);
    }
    // Skull-cheek shadows (small dark sockets on the mask)
    for (let side = -1; side <= 1; side += 2) {
      const cheek = mesh(new THREE.SphereGeometry(0.025, 8, 6), M.reaperCloth);
      cheek.position.set(side * 0.13, -0.07, 0.21); cheek.scale.set(1, 0.8, 0.4);
      head.add(cheek);
    }
    // Faded gold inscription line across the mask's brow-edge
    const maskInscription = mesh(new THREE.BoxGeometry(0.32, 0.005, 0.005), M.reaperGoldHi);
    maskInscription.position.set(0, 0.005, 0.215);
    head.add(maskInscription);

    // Eyes — bone-pallor glow (UPPER face — visible above the skull mask)
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.reaperCloth);
    eyeStrip.position.set(0, 0.02, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.reaperEye);
    eyeL.position.set(-0.08, 0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.08; head.add(eyeR);

    // Sharp eyebrows (death glower)
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.05, 0.012, 0.005), M.reaperCloth);
      brow.position.set(side * 0.08, 0.06, 0.21); brow.rotation.z = side * 0.3;
      head.add(brow);
    }

    // Bone-fragment hood ornaments — small bones tied into the hair on the sides
    for (let side = -1; side <= 1; side += 2) {
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.05, 4), M.reaperClothHi);
      cord.position.set(side * 0.18, -0.05, 0.05);
      head.add(cord);
      const boneOrn = mesh(new THREE.ConeGeometry(0.012, 0.04, 5), M.reaperBoneHi);

    return head;
  }

  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8020) }, uOpacity: { value: 0.55 } },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xy);
      float a = atan(vPos.y, vPos.x);
      float pulse = 0.55 + 0.45 * sin(uTime * 1.2 + a * 4.0);
      float band = smoothstep(2.05, 2.18, r) * smoothstep(2.35, 2.18, r);
      gl_FragColor = vec4(uColor * pulse * 1.4, band * uOpacity * pulse);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});

  const a = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4.5;
  emberPositions[i*3 + 0] = Math.cos(a) * r;
  emberPositions[i*3 + 1] = Math.random() * 4.5;
  emberPositions[i*3 + 2] = Math.sin(a) * r;
  emberSeeds[i] = Math.random();
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('seed', new THREE.Float32BufferAttribute(emberSeeds, 1));
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);

// ─── Build all champions up front (single per class — viewer only shows one)
const champions = {};
for (const key in classRegistry) {
  const champ = classRegistry[key].factory();
  champ.group.visible = false;
  champions[key] = champ;
}
let activeChampion = champions.assassin;
activeChampion.group.visible = true;

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

// ─── UI wiring ────────────────────────────────────────────────────────────

  selectClass(e.target.value);
});

const abilityButtons = document.querySelectorAll('.ab-btn');
abilityButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeChampion || activeChampion.isPlaying()) return;
    const animName = btn.dataset.anim;
    activeChampion.playAnimation(animName, clock.getElapsedTime(), effectMgr);
    btn.classList.add('cooling');
    setTimeout(() => btn.classList.remove('cooling'), (activeChampion.animations[animName]?.duration || 1) * 1000 + 100);
  });
});

let demoMode = false;
let demoIdx = 0;
let demoNextTime = 0;
const demoOrder = ['attack', 'spell1', 'attack', 'spell2'];
document.getElementById('demoBtn').addEventListener('click', (e) => {
  demoMode = !demoMode;
  demoIdx = 0;
  e.target.textContent = demoMode ? '⏸ Stop Demo' : '▶ Cycle Animations';
  demoNextTime = clock.getElapsedTime() + 0.4;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('assassin');

setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);
