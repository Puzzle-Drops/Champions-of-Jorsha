const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  linear: t => t,
  inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class FilledShockwave extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;
    this.mesh.scale.setScalar(0.2);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(0.2, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.55;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.4;
    this.maxRadius = opts.maxRadius ?? 1.7;
    this.startRadius = opts.startRadius ?? 0.4;
    this.rotateSpeed = opts.rotateSpeed ?? 0.7;
    this.runeCount = opts.runeCount ?? 8;
    const geo = new THREE.RingGeometry(0.85, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {
  constructor(scene, position, opts = {}) {

    const geo = new THREE.RingGeometry(0.05, 1.0, 96, 1);

      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x);
          float outerRing = smoothstep(0.93, 0.97, r) * smoothstep(1.0, 0.97, r);
          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);
          float fill = smoothstep(0.97, 0.0, r) * 0.08;
          float runeAng = mod(a + uTime * -0.5, 6.28318 / 12.0) * 12.0;
          float runes = smoothstep(0.4, 0.5, sin(runeAng)) * smoothstep(0.78, 0.85, r) * smoothstep(0.92, 0.85, r);
          float pulse = 0.7 + 0.3 * sin(uTime * 3.0);
          float intensity = (outerRing + midRing * 0.7 + star * 0.9 + runes * 1.1) * pulse + fill;
          gl_FragColor = vec4(uColor * intensity * 1.7, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,

      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;

          float pattern = sin(vUv.y * 30.0 - uTime * 8.0) * 0.5 + 0.5;

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

// ─── Shared part builders ──────────────────────────────────────────────────
function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.iron;
  const mid = palette.mid || M.ironHi;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.iron;
  const dark = palette.dark || M.iron;
  const hi = palette.hi || M.ironHi;
  const accent = palette.accent || M.brass;
  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);
  const knuckle = mesh(new THREE.BoxGeometry(0.16, 0.05, 0.08), accent);
  knuckle.position.set(0, -0.85, 0.05); arm.add(knuckle);
  const hand = new THREE.Group();
  hand.position.y = -0.96;
  arm.add(hand);
  arm.userData.hand = hand;
  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;
  return arm;
}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ASSASSIN — Rogue I/VI                                                   ║
// ║  Single-Target Burst · Shadow Step · Lean black silhouette, deep cowl  ║
// ║  with face fully shadowed (only eye glow visible), X-strap silver       ║
// ║  harness, twin daggers in hand, throwing knives on belt, shadow-purple ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Assassin extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = assassinAnimations;
  }

  build() {
    const root = this.group;

    // Legs — black slim tunic + tabi-style split-toe boots
    const buildAssLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — black slim
      const thigh = mesh(new THREE.CylinderGeometry(0.115, 0.1, 0.55, 14), M.rogueBlack);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee — slight wrap
      const knee = mesh(new THREE.SphereGeometry(0.1, 12, 8), M.rogueBlackHi);
      knee.position.y = 0.66; knee.scale.set(1.0, 0.55, 1.05); leg.add(knee);
      // Lower shin — black with purple sash wrap
      const shin = mesh(new THREE.CylinderGeometry(0.1, 0.115, 0.5, 14), M.rogueBlack);
      shin.position.y = 0.36; leg.add(shin);
      // Purple sash wraps across the shin
      for (let i = 0; i < 3; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.105, 0.012, 6, 14), M.shadowPurple);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.5 - i * 0.1;
        leg.add(wrap);
      }
      // Hidden wrist-knife sheath strap
      const sheathStrap = mesh(new THREE.BoxGeometry(0.025, 0.16, 0.015), M.asnSilver);
      sheathStrap.position.set(sx * 0.105, 0.36, 0.0); leg.add(sheathStrap);
      // Tabi-style boot (low profile, split-toe — split visualized as a notch in the toe)
      const boot = mesh(new THREE.BoxGeometry(0.18, 0.13, 0.32), M.rogueBlack);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Toe split (small wedge)
      const toeMain = mesh(new THREE.BoxGeometry(0.07, 0.07, 0.1), M.rogueBlackHi);
      toeMain.position.set(-0.04, 0.07, 0.21); toeMain.rotation.x = -0.15;
      leg.add(toeMain);
      const toeSide = mesh(new THREE.BoxGeometry(0.07, 0.07, 0.1), M.rogueBlackHi);
      toeSide.position.set(0.04, 0.07, 0.21); toeSide.rotation.x = -0.15;
      leg.add(toeSide);
      // Silver buckle on side
      const bootBuckle = mesh(new THREE.BoxGeometry(0.025, 0.018, 0.01), M.asnSilverHi);
      bootBuckle.position.set(sx * 0.095, 0.13, 0.05);
      leg.add(bootBuckle);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildAssLeg(-1));
    root.add(buildAssLeg(1));

    // Pelvis — black with throwing-knife belt
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.25, 0.27, 0.16, 16), M.rogueBlack));
    // Dark purple sash belt
    const sash = mesh(new THREE.CylinderGeometry(0.275, 0.275, 0.12, 18), M.shadowPurple);
    sash.position.y = 0.04; pelvis.add(sash);
    // Silver buckle
    const buckle = mesh(new THREE.BoxGeometry(0.06, 0.05, 0.018), M.asnSilverHi);
    buckle.position.set(0, 0.04, 0.29); pelvis.add(buckle);
    // Shadow-purple rune in buckle center
    const buckleRune = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.asnRune);
    buckleRune.position.set(0, 0.04, 0.31); buckleRune.scale.set(1, 1, 0.5);
    pelvis.add(buckleRune);
    // Throwing knives on the front of belt (5 small knives, handles up)
    for (let i = -2; i <= 2; i++) {
      // Handle
      const knifeHandle = mesh(new THREE.BoxGeometry(0.012, 0.04, 0.012), M.rogueBlackHi);
      knifeHandle.position.set(i * 0.05, 0.0, 0.31);
      pelvis.add(knifeHandle);
      // Blade tip (small triangle pointing down)
      const knifeTip = mesh(new THREE.ConeGeometry(0.008, 0.05, 4), M.asnSilverHi);
      knifeTip.position.set(i * 0.05, -0.05, 0.31);
      knifeTip.rotation.x = Math.PI;
      pelvis.add(knifeTip);
    }
    // Hanging coat-tails (black, asymmetric — short on one side, longer on the other)
    const tailL = mesh(new THREE.BoxGeometry(0.15, 0.4, 0.018), M.rogueBlack);
    tailL.position.set(-0.08, -0.22, 0.27); tailL.rotation.x = -0.04; tailL.rotation.z = -0.06;
    pelvis.add(tailL);
    const tailR = mesh(new THREE.BoxGeometry(0.18, 0.55, 0.018), M.rogueBlackHi);
    tailR.position.set(0.1, -0.3, 0.27); tailR.rotation.x = -0.04;
    pelvis.add(tailR);
    root.add(pelvis);

    // TORSO — slim black tunic with X-strap silver harness
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Black tunic
    const tunic = mesh(new THREE.CylinderGeometry(0.32, 0.3, 0.7, 16), M.rogueBlack);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Dark purple side-panels (visible at hip)
    for (let side = -1; side <= 1; side += 2) {
      const panel = mesh(new THREE.BoxGeometry(0.07, 0.5, 0.04), M.shadowPurple);
      panel.position.set(side * 0.32, -0.05, 0.04);
      torso.add(panel);
    }

    // Pec mounds (subtle, slim build)
    const pecL = mesh(new THREE.SphereGeometry(0.14, 14, 12), M.rogueBlackHi);
    pecL.position.set(-0.13, 0.2, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.13;
    torso.add(pecR);

    // X-STRAP HARNESS — silver leather straps crossing the chest (the marquee silhouette feature)
    const strapL = mesh(new THREE.BoxGeometry(0.07, 0.7, 0.03), M.asnSilver);
    strapL.position.set(-0.04, 0.0, 0.35); strapL.rotation.z = 0.45;
    torso.add(strapL);
    const strapR = mesh(new THREE.BoxGeometry(0.07, 0.7, 0.03), M.asnSilver);
    strapR.position.set(0.04, 0.0, 0.35); strapR.rotation.z = -0.45;
    torso.add(strapR);
    // Silver buckle at center where they cross
    const xBuckle = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.asnSilverHi);
    xBuckle.position.set(0, 0.0, 0.4); xBuckle.scale.set(1, 1, 0.5);
    torso.add(xBuckle);
    // Shadow-purple rune in the X-buckle
    const xRune = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.asnRune);
    xRune.position.set(0, 0.0, 0.42); xRune.scale.set(1, 1, 0.4);
    torso.add(xRune);

    // CHEST EMBLEM — dagger-and-shadow sigil (small, subtle on the assassin's chest)
    // Inverted dagger silhouette above the X-buckle
    const daggerEmblem = mesh(new THREE.ConeGeometry(0.012, 0.06, 4), M.asnSilverHi);
    daggerEmblem.position.set(0, 0.18, 0.4); daggerEmblem.rotation.x = Math.PI;
    torso.add(daggerEmblem);
    const daggerHilt = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.008), M.shadowPurple);
    daggerHilt.position.set(0, 0.21, 0.4);
    torso.add(daggerHilt);

    // Vertical purple-rune sigils flanking the X (3 small marks down each side)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.014, 0.005), M.asnRune);
        sigil.position.set(side * 0.18, 0.1 - i * 0.1, 0.36);
        torso.add(sigil);
      }
    }

    // High collar (popped — black with purple inner lining)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.rogueBlackHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarLining = mesh(new THREE.CylinderGeometry(0.175, 0.215, 0.135, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.shadowPurple);
    collarLining.position.y = 0.42; torso.add(collarLining);

    root.add(torso);
    this.parts.body = torso;

    // Slim shoulder caps (no plate, just cloth + leather)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.12, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.rogueBlackHi);
      cap.scale.set(1, 0.55, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Silver shoulder strap
      const strap = mesh(new THREE.BoxGeometry(0.025, 0.16, 0.04), M.asnSilver);
      strap.position.set(side * 0.42, 2.1, 0.04); strap.rotation.x = -0.18;
      root.add(strap);
    }

    // ARMS — slim black sleeves with wrist-knife sheaths
    const armPalette = { cloth: M.rogueBlack, mid: M.rogueBlackHi, dark: M.rogueBlack, hi: M.shadowPurpleHi, accent: M.asnSilver };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Wrist-knife sheath on each forearm (small box on the outside)
    [leftArm, rightArm].forEach((arm, idx) => {
      const sheath = mesh(new THREE.BoxGeometry(0.04, 0.18, 0.025), M.rogueBlackHi);
      sheath.position.set(idx === 0 ? -0.094 : 0.094, -0.62, 0.03);
      arm.add(sheath);
      // Silver knife handle poking out
      const handle = mesh(new THREE.BoxGeometry(0.018, 0.05, 0.018), M.asnSilverHi);
      handle.position.set(idx === 0 ? -0.094 : 0.094, -0.51, 0.03);
      arm.add(handle);
      // Silver bracer band on the wrist
      const bracerBand = mesh(new THREE.TorusGeometry(0.092, 0.012, 6, 14), M.asnSilverHi);
      bracerBand.rotation.x = Math.PI / 2; bracerBand.position.y = -0.78;
      arm.add(bracerBand);
    });

    // TWIN DAGGERS — one in each hand
    const leftDagger = this._buildAssassinDagger(0);
    leftArm.userData.hand.add(leftDagger);
    leftDagger.position.set(0, 0.04, 0.06);
    leftDagger.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.leftWeapon = leftDagger;

    const rightDagger = this._buildAssassinDagger(1);
    rightArm.userData.hand.add(rightDagger);
    rightDagger.position.set(0, 0.04, 0.06);
    rightDagger.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.rightWeapon = rightDagger;

    // Tattered low CAPE — short, asymmetric, dark
    const cape = buildCape({ material: M.rogueBlack, width: 1.2, height: 1.5 });
    cape.position.set(0, 2.34, -0.05);
    root.add(cape);
    this.cape = cape;

    // Purple cape inner-trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.5, 0.012, 8, 28, Math.PI), M.shadowPurpleHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.85, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck (skin — but barely visible due to deep hood)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — DEEP COWL (face fully shadowed, only eye glow visible)
    const head = this._buildAssassinHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.asnEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.asnEye;
  }

  _buildAssassinDagger(variant) {
    const dagger = new THREE.Group();
    // Pommel
    const pommel = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.asnSilverHi);
    dagger.add(pommel);
    // Black-wrapped grip
    const grip = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.16, 10), M.rogueBlackHi);
    grip.position.y = 0.09; dagger.add(grip);
    // Purple cord wraps
    for (let i = 0; i < 5; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.02, 0.0035, 5, 10), M.shadowPurpleHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.04 + i * 0.03;
      dagger.add(wrap);
    }
    // Crossguard — small horizontal bar
    const cross = mesh(new THREE.BoxGeometry(0.1, 0.018, 0.025), M.asnSilver);
    cross.position.y = 0.18; dagger.add(cross);
    // Crossguard center gem
    const crossGem = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.asnRune);
    crossGem.position.set(0, 0.18, 0.018); crossGem.scale.set(1, 1, 0.5);
    dagger.add(crossGem);
    // BLADE — short, slim, leaf-shaped
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.018, 0); bladeShape.lineTo(0.018, 0);
    bladeShape.lineTo(0.012, 0.32); bladeShape.lineTo(0, 0.36); bladeShape.lineTo(-0.012, 0.32);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.014, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.003, bevelSegments: 1 }), M.asnSilverHi);
    blade.position.set(0, 0.2, -0.007); dagger.add(blade);
    // Variant: left dagger has a serration, right dagger has a runic inscription
    if (variant === 0) {
      // Serration — a small notch near the tip
      const notch = mesh(new THREE.ConeGeometry(0.006, 0.014, 4), M.rogueBlackHi);
      notch.position.set(0.018, 0.42, 0.0);
      dagger.add(notch);
    } else {
      // Runic inscription (small purple line down the blade)
      const inscription = mesh(new THREE.BoxGeometry(0.005, 0.22, 0.003), M.asnRune);
      inscription.position.set(0, 0.32, 0.008);
      dagger.add(inscription);
    }
    return dagger;
  }

  _buildAssassinHead() {
    const head = new THREE.Group();

    // Pale face (mostly hidden inside hood)
    const face = mesh(new THREE.SphereGeometry(0.18, 16, 12), M.skinPale);
    face.position.set(0, -0.04, 0.04); face.scale.set(0.9, 1, 0.95);
    head.add(face);

    // Lower face mask (covers nose/mouth — only forehead-eye area visible)
    const mask = mesh(new THREE.SphereGeometry(0.19, 16, 10, 0, Math.PI * 2, Math.PI / 2.5, Math.PI / 3), M.rogueBlackHi);
    mask.position.set(0, -0.04, 0.04); mask.scale.set(0.95, 1, 1);
    head.add(mask);

    // ===== DEEP COWL (the marquee feature — face fully shadowed by the hood) =====
    // Outer hood shell (very deep, nearly closes the face)
    const hood = mesh(new THREE.SphereGeometry(0.3, 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.rogueBlack);
    hood.scale.set(1.1, 1.25, 1.25);
    hood.position.set(0, 0.04, -0.03);
    head.add(hood);
    // Inner hood lining (dark purple)
    const hoodLining = mesh(new THREE.SphereGeometry(0.285, 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.shadowPurple);
    hoodLining.scale.set(1.08, 1.23, 1.23);
    hoodLining.position.set(0, 0.04, -0.03);
    head.add(hoodLining);
    // Pointed hood tip at the back
    const hoodTip = mesh(new THREE.ConeGeometry(0.05, 0.16, 8), M.rogueBlack);
    hoodTip.position.set(0, 0.34, -0.2); hoodTip.rotation.x = -0.5;
    head.add(hoodTip);
    // Hood front edge — silver trim around the opening
    const hoodTrim = mesh(new THREE.TorusGeometry(0.24, 0.008, 8, 28, Math.PI * 1.3), M.asnSilver);
    hoodTrim.rotation.x = Math.PI / 2.4;
    hoodTrim.rotation.y = -Math.PI / 2;
    hoodTrim.position.y = 0.06;
    head.add(hoodTrim);

    // Black recess panel where the face would be visible (the deep shadow)
    const recess = mesh(new THREE.CircleGeometry(0.18, 16), M.rogueBlack);
    recess.position.set(0, -0.02, 0.16);
    recess.rotation.y = Math.PI;
    head.add(recess);

    // Eyes — only the SHADOW-PURPLE glow shows from the cowl darkness
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.rogueBlack);
    eyeStrip.position.set(0, -0.025, 0.17); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.asnEye);
    eyeL.position.set(-0.075, -0.02, 0.2); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Subtle purple-rune mark on the forehead (visible inside the cowl shadow)
    const browMark = mesh(new THREE.BoxGeometry(0.025, 0.005, 0.005), M.asnRune);
    browMark.position.set(0, 0.05, 0.2); head.add(browMark);

    return head;
  }
}

        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const targetPos = new THREE.Vector3(champPos.x + 0.3, 1.7, champPos.z + 1.4);
        // Big purple impact (the execute)
        mgr.spawn(new ImpactFlash(champ.scene, targetPos, { color: 0x9050d0, maxScale: 0.85, duration: 0.4 }), time);
        const groundPos = new THREE.Vector3(targetPos.x, 0.12, targetPos.z);
        mgr.spawn(new FilledShockwave(champ.scene, groundPos, { color: 0x6030a0, maxRadius: 1.5, duration: 0.5 }), time);
        mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0x9050d0, maxRadius: 2.2, duration: 0.7 }), time);
        // Vertical purple slash light pillar (the execute mark)
        mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0x6030a0, height: 3.2, radius: 0.4, duration: 0.55 }), time);
        // Shadow-purple particles (the death stroke)
        mgr.spawn(new ParticleBurst(champ.scene, targetPos, { color: 0x9050d0, count: 50, speed: 5.5, duration: 0.95, upwardBias: 1.0, gravity: -2.5 }), time);
        // Execute rune at target
        mgr.spawn(new RuneRing(champ.scene, groundPos, { color: 0x9050d0, maxRadius: 1.1, duration: 0.9, runeCount: 6, rotateSpeed: 1.4 }), time);
      }},
    ],
  },
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  DUELIST — Rogue II/VI                                                   ║
// ║  Sustained 1v1 · Parry Stance · Athletic dark grey doublet, crimson    ║
// ║  puffed sleeves, crimson diagonal sash, lace musketeer cuffs, long     ║
// ║  rapier + small buckler, slicked hair + goatee, silver-steel eye glow  ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Duelist extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = duelistAnimations;
  }

  build() {
    const root = this.group;

    // Legs — dark grey breeches with thigh-high boots
    const buildDuelLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — dark grey
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.duelGrey);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee — slight wrap
      const knee = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.duelGreyHi);
      knee.position.y = 0.66; knee.scale.set(1.05, 0.6, 1.1); leg.add(knee);
      // Tall thigh-high boot — dark grey
      const boot = mesh(new THREE.CylinderGeometry(0.135, 0.14, 0.5, 14), M.duelGreyDark);
      boot.position.y = 0.36; leg.add(boot);
      // Boot fold-over at the top (turned-down cuff with crimson lining)
      const bootCuff = mesh(new THREE.CylinderGeometry(0.155, 0.135, 0.06, 14), M.duelGreyHi);
      bootCuff.position.y = 0.6; leg.add(bootCuff);
      const bootCuffLining = mesh(new THREE.CylinderGeometry(0.15, 0.135, 0.045, 14), M.duelCrimson);
      bootCuffLining.position.y = 0.595; leg.add(bootCuffLining);
      // Silver buckle on the cuff
      const cuffBuckle = mesh(new THREE.BoxGeometry(0.04, 0.025, 0.018), M.duelSilverHi);
      cuffBuckle.position.set(sx * 0.13, 0.6, 0.05); leg.add(cuffBuckle);
      // Boot toe
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.1, 0.14), M.duelGreyDark);
      toe.position.set(0, 0.06, 0.2); toe.rotation.x = -0.2;
      leg.add(toe);
      // Heel
      const heel = mesh(new THREE.BoxGeometry(0.12, 0.06, 0.06), M.duelGreyDark);
      heel.position.set(0, 0.04, -0.04); leg.add(heel);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildDuelLeg(-1));
    root.add(buildDuelLeg(1));

    // Pelvis — silver belt with crimson sash + small dueling pouch
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.duelGrey));
    // Silver belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.1, 18), M.duelSilver);
    belt.position.y = 0.04; pelvis.add(belt);
    // Silver oval buckle
    const buckle = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.duelSilverHi);
    buckle.position.set(0, 0.04, 0.31); buckle.scale.set(1.5, 0.7, 0.5);
    pelvis.add(buckle);
    // Crimson rune at buckle center
    const buckleGem = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.duelCrimsonHi);
    buckleGem.position.set(0, 0.04, 0.33); buckleGem.scale.set(1, 1, 0.5);
    pelvis.add(buckleGem);
    // Crimson sash hanging down from belt at front
    const sashFront = mesh(new THREE.BoxGeometry(0.18, 0.5, 0.018), M.duelCrimsonHi);
    sashFront.position.set(0, -0.27, 0.31); sashFront.rotation.x = -0.04;
    pelvis.add(sashFront);
    // Sash trim along the bottom
    const sashTrim = mesh(new THREE.BoxGeometry(0.18, 0.025, 0.022), M.duelSilverHi);
    sashTrim.position.set(0, -0.5, 0.32); pelvis.add(sashTrim);
    // Side coat-tails (dark grey, asymmetric)
    for (let i = -1; i <= 1; i += 2) {
      const tail = mesh(new THREE.BoxGeometry(0.16, 0.4, 0.018), M.duelGreyHi);
      tail.position.set(i * 0.13, -0.22, 0.27); tail.rotation.x = -0.04; tail.rotation.z = i * 0.06;
      pelvis.add(tail);
    }
    root.add(pelvis);

    // TORSO — dark grey doublet with crimson under-sleeves
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Doublet body
    const doublet = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.duelGrey);
    doublet.scale.set(1.0, 1, 0.85);
    torso.add(doublet);

    // Pec mounds (subtle athletic build)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.duelGreyHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CRIMSON SASH — diagonal across the torso (left shoulder to right hip)
    const sash = mesh(new THREE.BoxGeometry(0.09, 0.7, 0.022), M.duelCrimsonHi);
    sash.position.set(-0.04, 0.0, 0.36); sash.rotation.z = 0.4;
    torso.add(sash);
    // Sash trim
    const sashEdgeL = mesh(new THREE.BoxGeometry(0.005, 0.7, 0.024), M.duelSilverHi);
    sashEdgeL.position.set(-0.085, 0.0, 0.37); sashEdgeL.rotation.z = 0.4;
    torso.add(sashEdgeL);
    const sashEdgeR = mesh(new THREE.BoxGeometry(0.005, 0.7, 0.024), M.duelSilverHi);
    sashEdgeR.position.set(0.0, 0.0, 0.37); sashEdgeR.rotation.z = 0.4;
    torso.add(sashEdgeR);

    // Vertical row of silver buttons (4) down the doublet front
    for (let i = 0; i < 4; i++) {
      const button = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.duelSilverHi);
      button.position.set(0.06, 0.18 - i * 0.12, 0.38); button.scale.set(1, 1, 0.5);
      torso.add(button);
    }

    // CHEST EMBLEM — rapier and buckler crossed (the marquee Duelist symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.duelGreyDark);
    emblemBack.position.set(0.05, 0.22, 0.41); torso.add(emblemBack);
    // Rapier (long thin diagonal)
    const rapierBlade = mesh(new THREE.BoxGeometry(0.005, 0.13, 0.008), M.duelSilverHi);
    rapierBlade.position.set(0.05, 0.22, 0.42); rapierBlade.rotation.z = Math.PI / 4;
    torso.add(rapierBlade);
    // Rapier hilt (small crossguard)
    const rapierHilt = mesh(new THREE.BoxGeometry(0.025, 0.005, 0.008), M.duelSilverHi);
    rapierHilt.position.set(0.0, 0.17, 0.42); rapierHilt.rotation.z = Math.PI / 4 + Math.PI / 2;
    torso.add(rapierHilt);
    // Rapier swept hilt (the ornate cup)
    const rapierCup = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.duelSilverHi);
    rapierCup.position.set(0.0, 0.17, 0.42); rapierCup.scale.set(1, 1, 0.5);
    torso.add(rapierCup);
    // Buckler (small round shield, opposite diagonal)
    const buckler = mesh(new THREE.CircleGeometry(0.04, 16), M.duelSilverHi);
    buckler.position.set(0.05, 0.22, 0.42);
    buckler.scale.set(0.9, 0.9, 1);
    torso.add(buckler);
    const bucklerBoss = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.duelCrimsonHi);
    bucklerBoss.position.set(0.05, 0.22, 0.43); bucklerBoss.scale.set(1, 1, 0.4);
    torso.add(bucklerBoss);
    // Crimson rune sigils flanking the emblem
    for (let side = -1; side <= 1; side += 2) {
      const sigil = mesh(new THREE.BoxGeometry(0.014, 0.018, 0.005), M.duelCrimsonHi);
      sigil.position.set(0.05 + side * 0.11, 0.22, 0.42);
      torso.add(sigil);
    }

    // High popped collar — dark grey with crimson lining
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.16, 16, 1, false, -Math.PI / 2.2, Math.PI * 1.3), M.duelGreyHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarLining = mesh(new THREE.CylinderGeometry(0.175, 0.215, 0.155, 16, 1, false, -Math.PI / 2.2, Math.PI * 1.3), M.duelCrimson);
    collarLining.position.y = 0.42; torso.add(collarLining);

    root.add(torso);
    this.parts.body = torso;

    // PUFFED SLEEVES — crimson upper-arm sleeves (the duelist's distinct look)
    for (let side = -1; side <= 1; side += 2) {
      const puffSleeve = mesh(new THREE.SphereGeometry(0.18, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.6), M.duelCrimson);
      puffSleeve.scale.set(1.15, 0.95, 1.1);
      puffSleeve.position.set(side * 0.42, 2.18, 0);
      root.add(puffSleeve);
      // Silver shoulder cap on top
      const shoulderCap = mesh(new THREE.SphereGeometry(0.13, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2.2), M.duelSilver);
      shoulderCap.position.set(side * 0.42, 2.27, 0); shoulderCap.scale.set(1, 0.5, 1);
      root.add(shoulderCap);
      // Silver button on the cap
      const capBtn = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.duelSilverHi);
      capBtn.position.set(side * 0.42, 2.32, 0);
      root.add(capBtn);
    }

    // ARMS — crimson upper sleeves transitioning to grey forearms with lace cuffs
    const armPalette = { cloth: M.duelCrimson, mid: M.duelGrey, dark: M.duelGreyDark, hi: M.duelSilver, accent: M.duelSilverHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Lace cuffs at wrist (white-cream lace, distinctive musketeer look)
    [leftArm, rightArm].forEach(arm => {
      const lace = mesh(new THREE.CylinderGeometry(0.115, 0.092, 0.1, 14), M.duelSilverHi);
      lace.position.y = -0.83; arm.add(lace);
      // Lace ruffle (slightly larger, fluted)
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const ruffle = mesh(new THREE.BoxGeometry(0.04, 0.025, 0.01), M.duelSilverHi);
        ruffle.position.set(Math.cos(a) * 0.105, -0.86, Math.sin(a) * 0.105);
        ruffle.rotation.y = -a;
        arm.add(ruffle);
      }
      // Silver wrist band above the lace
      const wristBand = mesh(new THREE.TorusGeometry(0.092, 0.012, 6, 14), M.duelSilver);
      wristBand.rotation.x = Math.PI / 2; wristBand.position.y = -0.78;
      arm.add(wristBand);
    });

    // RAPIER — held in right hand
    const rapier = this._buildRapier();
    rightArm.userData.hand.add(rapier);
    rapier.position.set(0, 0.04, 0.06);
    rapier.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = rapier;

    // BUCKLER — held in left hand
    const buckler2 = this._buildBuckler();
    leftArm.userData.hand.add(buckler2);
    buckler2.position.set(0, 0.0, 0.06);
    buckler2.rotation.set(-Math.PI / 2.5, 0, 0);
    this.parts.shield = buckler2;

    // Long CAPE — dark grey outside with crimson inside
    const cape = buildCape({ material: M.duelGreyHi, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Crimson cape inner-trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.018, 8, 28, Math.PI), M.duelCrimsonHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — uncovered (slicked dark hair, neat goatee, confident look)
    const head = this._buildDuelistHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.duelEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.duelEye;
  }

  _buildRapier() {
    const rapier = new THREE.Group();
    // Pommel — small silver orb
    const pommel = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.duelSilverHi);
    rapier.add(pommel);
    // Grip — black-wrapped
    const grip = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.14, 10), M.duelGreyDark);
    grip.position.y = 0.08; rapier.add(grip);
    // Crimson cord wraps
    for (let i = 0; i < 4; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.02, 0.0035, 5, 10), M.duelCrimsonHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.04 + i * 0.03;
      rapier.add(wrap);
    }
    // SWEPT HILT — ornate silver cup-guard (the marquee rapier feature)
    const cupGuard = mesh(new THREE.SphereGeometry(0.06, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2.5), M.duelSilverHi);
    cupGuard.position.y = 0.16; cupGuard.rotation.x = Math.PI;
    rapier.add(cupGuard);
    // 3 swept guard rings curving from cup to pommel
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const guardRing = mesh(new THREE.TorusGeometry(0.04, 0.004, 6, 14, Math.PI), M.duelSilverHi);
      guardRing.position.set(Math.cos(a) * 0.025, 0.12, Math.sin(a) * 0.025);
      guardRing.rotation.y = -a;
      guardRing.rotation.x = Math.PI / 2;
      rapier.add(guardRing);
    }
    // Quillons (the simple horizontal crossguard inside the cup)
    const quillons = mesh(new THREE.BoxGeometry(0.08, 0.012, 0.012), M.duelSilver);
    quillons.position.y = 0.18; rapier.add(quillons);
    // BLADE — long thin tapered (much longer than dagger)
    const blade = mesh(new THREE.CylinderGeometry(0.005, 0.002, 0.95, 6), M.duelSilverHi);
    blade.position.y = 0.66; rapier.add(blade);
    // Diamond cross-section on the blade (small flat panels suggesting it's sharp)
    const bladeFlat = mesh(new THREE.BoxGeometry(0.008, 0.95, 0.002), M.duelSilverHi);
    bladeFlat.position.y = 0.66; rapier.add(bladeFlat);
    // Tip
    const tip = mesh(new THREE.ConeGeometry(0.005, 0.025, 6), M.duelSilverHi);
    tip.position.y = 1.16; rapier.add(tip);
    return rapier;
  }

  _buildBuckler() {
    const buckler = new THREE.Group();
    // Round disc body
    const body = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.04, 24), M.duelSilver);
    body.rotation.x = Math.PI / 2;
    buckler.add(body);
    // Beveled edge ring
    const edge = mesh(new THREE.TorusGeometry(0.13, 0.012, 10, 28), M.duelSilverHi);
    buckler.add(edge);
    // Central boss (raised hub)
    const boss = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.duelCrimsonHi);
    boss.position.z = 0.025; boss.scale.set(1, 1, 0.5);
    buckler.add(boss);
    // 8 silver studs around the inner ring
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const stud = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.duelSilverHi);
      stud.position.set(Math.cos(a) * 0.085, Math.sin(a) * 0.085, 0.025);
      buckler.add(stud);
    }
    // Engraved cross + diagonal sword-pattern (subtle)
    const engraveV = mesh(new THREE.BoxGeometry(0.006, 0.16, 0.002), M.duelGreyDark);
    engraveV.position.z = 0.026; buckler.add(engraveV);
    const engraveH = mesh(new THREE.BoxGeometry(0.16, 0.006, 0.002), M.duelGreyDark);
    engraveH.position.z = 0.026; buckler.add(engraveH);
    return buckler;
  }

  _buildDuelistHead() {
    const head = new THREE.Group();

    // Slicked-back dark hair
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.duelGreyDark);
    scalp.scale.set(1, 1.0, 1.05);
    scalp.position.y = 0.04;
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Slicked hair widow's peak (small triangle on forehead)
    const widowsPeak = mesh(new THREE.ConeGeometry(0.04, 0.06, 4), M.duelGreyDark);
    widowsPeak.position.set(0, 0.03, 0.21); widowsPeak.rotation.x = Math.PI;
    head.add(widowsPeak);

    // Side hair tufts (slicked back)
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.SphereGeometry(0.1, 12, 10), M.duelGreyDark);
      sideHair.position.set(side * 0.18, -0.02, -0.05); sideHair.scale.set(0.7, 1.1, 0.7);
      head.add(sideHair);
    }

    // Eyes — silver-steel glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.duelEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Eyebrows (sharp, dark)
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.004), M.duelGreyDark);
      brow.position.set(side * 0.075, 0.02, 0.21); brow.rotation.z = side * 0.15;
      head.add(brow);
    }

    // Nose (long, refined)
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.07, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Confident smirk
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); mouth.rotation.z = 0.12;
    head.add(mouth);

    // Pencil mustache
    const mustacheL = mesh(new THREE.BoxGeometry(0.03, 0.008, 0.005), M.duelGreyDark);
    mustacheL.position.set(-0.018, -0.1, 0.22); mustacheL.rotation.z = 0.2;
    head.add(mustacheL);
    const mustacheR = mesh(new THREE.BoxGeometry(0.03, 0.008, 0.005), M.duelGreyDark);
    mustacheR.position.set(0.018, -0.1, 0.22); mustacheR.rotation.z = -0.2;
    head.add(mustacheR);

    // Goatee (small chin tuft)
    const goatee = mesh(new THREE.ConeGeometry(0.022, 0.05, 6), M.duelGreyDark);
    goatee.position.set(0, -0.16, 0.21); goatee.rotation.x = Math.PI;
    head.add(goatee);

    // Small silver hoop earring on left ear
    const earring = mesh(new THREE.TorusGeometry(0.014, 0.0035, 6, 12), M.duelSilverHi);
    earring.position.set(-0.21, -0.08, 0); earring.rotation.y = Math.PI / 2;
    head.add(earring);

    return head;
  }
}

const duelistAnimations = {
  // RIPOSTE STAB — quick lunge-stab
  attack: {
    duration: 0.7,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.18, values: {                                          // wind right rapier back, raise buckler
        rightArm: { rx: 0.4, rz: -0.45 },
        leftArm:  { rx: -0.55, rz: 0.55 },
        body:     { ry: -0.1 },
      }, ease: ease.out },
      { t: 0.4,  values: {                                          // forward thrust — full extension
        rightArm: { rx: -1.15, rz: 0.0 },
        leftArm:  { rx: -0.4, rz: 0.45 },
        body:     { ry: 0.16, py: -0.04 },
      }, ease: ease.out },
      { t: 0.55, values: {                                          // hold the extended thrust
        rightArm: { rx: -1.0, rz: 0.0 },
        leftArm:  { rx: -0.4, rz: 0.45 },
        body:     { ry: 0.12 },
      }},
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.4, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);

        // Sharp silver-steel impact
        mgr.spawn(new ImpactFlash(champ.scene, targetPos, { color: 0xeaf0f8, maxScale: 0.5, duration: 0.25 }), time);

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SHADOWDANCER — Rogue III/VI                                             ║
// ║  Mobility · Dodge Stacks · Lean midnight silhouette, half-face cloth   ║
// ║  wrap, multi-layered teal ribbon cloak (5 dancing ribbons), twin       ║
// ║  curved scimitars, wrapped silk sandals, smoke-teal eye glow           ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Shadowdancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = shadowdancerAnimations;
  }

  // Override update — gently flutter the ribbon cloak's individual ribbons
  update(time, dt) {
    super.update(time, dt);
    if (this.ribbons) {
      for (let i = 0; i < this.ribbons.length; i++) {
        const r = this.ribbons[i];
        // Each ribbon sways with its own phase
        r.rotation.x = Math.sin(time * 0.9 + i * 1.2) * 0.18;
        r.rotation.z = Math.sin(time * 0.7 + i * 0.8) * 0.12;
      }
    }
  }

  build() {
    const root = this.group;

    // Legs — midnight-fitted leggings + wrapped silk sandals (light dancer's stance)
    const buildSdLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — midnight
      const thigh = mesh(new THREE.CylinderGeometry(0.115, 0.1, 0.55, 14), M.midnight);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee
      const knee = mesh(new THREE.SphereGeometry(0.1, 12, 8), M.midnightHi);
      knee.position.y = 0.66; knee.scale.set(1.0, 0.55, 1.05); leg.add(knee);
      // Lower shin
      const shin = mesh(new THREE.CylinderGeometry(0.1, 0.115, 0.5, 14), M.midnight);
      shin.position.y = 0.36; leg.add(shin);
      // Smoke-teal silk wraps spiraling up the shin
      for (let i = 0; i < 6; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.106, 0.008, 6, 14, Math.PI * 1.6), M.smokeTeal);
        wrap.rotation.x = Math.PI / 2 + 0.1;
        wrap.rotation.y = i * 0.4;
        wrap.position.y = 0.55 - i * 0.07;
        leg.add(wrap);
      }
      // Wrapped silk sandal (no heavy boot — exposed foot wrap)
      const sole = mesh(new THREE.BoxGeometry(0.18, 0.04, 0.32), M.midnight);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      // Foot (skin tone — barefoot-style sandal)
      const foot = mesh(new THREE.BoxGeometry(0.16, 0.04, 0.28), M.skin);
      foot.position.set(0, 0.1, 0.06); leg.add(foot);
      // Crisscross teal sandal straps over the foot
      for (let i = 0; i < 3; i++) {
        const strapL = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.12), M.smokeTealDark);
        strapL.position.set(-0.04, 0.13, -0.02 + i * 0.07); strapL.rotation.z = 0.4;
        leg.add(strapL);
        const strapR = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.12), M.smokeTealDark);
        strapR.position.set(0.04, 0.13, -0.02 + i * 0.07); strapR.rotation.z = -0.4;
        leg.add(strapR);
      }
      // Anklet — teal beaded ring
      const anklet = mesh(new THREE.TorusGeometry(0.115, 0.008, 6, 14), M.smokeTeal);
      anklet.rotation.x = Math.PI / 2; anklet.position.y = 0.16;
      leg.add(anklet);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildSdLeg(-1));
    root.add(buildSdLeg(1));

    // Pelvis — midnight + asymmetric teal sash hip-tail
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.25, 0.27, 0.16, 16), M.midnight));
    // Smoke-teal hip wrap
    const hipWrap = mesh(new THREE.CylinderGeometry(0.275, 0.275, 0.1, 18), M.smokeTeal);
    hipWrap.position.y = 0.04; pelvis.add(hipWrap);
    // Silver buckle (small)
    const buckle = mesh(new THREE.BoxGeometry(0.04, 0.04, 0.018), M.sdSilver);
    buckle.position.set(0, 0.04, 0.29); pelvis.add(buckle);
    // Smoke-teal rune in buckle
    const buckleRune = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.sdRune);
    buckleRune.position.set(0, 0.04, 0.31); buckleRune.scale.set(1, 1, 0.5);
    pelvis.add(buckleRune);
    // Asymmetric long teal hip-tail (long sash flowing down on one side, distinctive)
    const hipTail = mesh(new THREE.BoxGeometry(0.18, 0.7, 0.018), M.smokeTeal);
    hipTail.position.set(0.16, -0.36, 0.27); hipTail.rotation.x = -0.04; hipTail.rotation.z = 0.06;
    pelvis.add(hipTail);
    // Hip tail trim
    const hipTailTrim = mesh(new THREE.BoxGeometry(0.18, 0.025, 0.022), M.smokeTealDark);
    hipTailTrim.position.set(0.16, -0.7, 0.28); pelvis.add(hipTailTrim);
    root.add(pelvis);

    // TORSO — midnight tunic with smoke-teal cross-strap + chest wrap
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Midnight tunic
    const tunic = mesh(new THREE.CylinderGeometry(0.32, 0.3, 0.7, 16), M.midnight);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Smoke-teal chest-wrap (a wide horizontal band across the upper torso)
    const chestWrap = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.22, 16), M.smokeTeal);
    chestWrap.scale.set(1.05, 1, 0.85);
    chestWrap.position.y = 0.16;
    torso.add(chestWrap);

    // Pec mounds (lean dancer build)
    const pecL = mesh(new THREE.SphereGeometry(0.14, 14, 12), M.smokeTealDark);
    pecL.position.set(-0.13, 0.2, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.13;
    torso.add(pecR);

    // Single diagonal silver strap across chest (the dancer's signature)
    const diagStrap = mesh(new THREE.BoxGeometry(0.05, 0.6, 0.022), M.sdSilver);
    diagStrap.position.set(-0.04, 0.0, 0.36); diagStrap.rotation.z = 0.4;
    torso.add(diagStrap);

    // CHEST EMBLEM — twin-curve crescent / yin-yang swirl (the dancer's mark)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.midnightHi);
    emblemBack.position.set(0.05, 0.05, 0.41); torso.add(emblemBack);
    // Two interlocking crescents (one teal, one silver — like dancing currents)
    // Teal crescent (curving up-right)
    const crescent1Outer = mesh(new THREE.TorusGeometry(0.05, 0.012, 8, 14, Math.PI * 0.8), M.smokeTeal);
    crescent1Outer.position.set(0.05, 0.05, 0.42); crescent1Outer.rotation.z = -0.4;
    torso.add(crescent1Outer);
    // Silver crescent (curving down-left)
    const crescent2Outer = mesh(new THREE.TorusGeometry(0.05, 0.012, 8, 14, Math.PI * 0.8), M.sdSilver);
    crescent2Outer.position.set(0.05, 0.05, 0.42); crescent2Outer.rotation.z = Math.PI - 0.4;
    torso.add(crescent2Outer);
    // Center rune dot (the dance's heart)
    const emblemRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.sdRune);
    emblemRune.position.set(0.05, 0.05, 0.43);
    torso.add(emblemRune);

    // Vertical teal-rune sigils flanking the emblem
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.014, 0.005), M.sdRune);
        sigil.position.set(0.05 + side * 0.18, 0.12 - i * 0.1, 0.36);
        torso.add(sigil);
      }
    }

    // High collar — midnight with teal lining
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.midnightHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarLining = mesh(new THREE.CylinderGeometry(0.175, 0.215, 0.135, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.smokeTeal);
    collarLining.position.y = 0.42; torso.add(collarLining);

    root.add(torso);
    this.parts.body = torso;

    // Slim shoulder caps
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.12, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.midnightHi);
      cap.scale.set(1, 0.55, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Teal trim
      const trim = mesh(new THREE.TorusGeometry(0.12, 0.008, 6, 14), M.smokeTeal);
      trim.rotation.x = Math.PI / 2; trim.position.set(side * 0.42, 2.14, 0);
      root.add(trim);
    }

    // ARMS — midnight cloth + teal silk wraps
    const armPalette = { cloth: M.midnight, mid: M.midnightHi, dark: M.midnight, hi: M.smokeTeal, accent: M.sdSilver };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Teal silk wraps spiraling up the forearms
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 5; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.094, 0.008, 6, 14, Math.PI * 1.6), M.smokeTeal);
        wrap.rotation.x = Math.PI / 2 + 0.1;
        wrap.rotation.y = i * 0.5;
        wrap.position.y = -0.5 - i * 0.08;
        arm.add(wrap);
      }
      // Dancer's silver finger-bracelet
      const ring = mesh(new THREE.TorusGeometry(0.092, 0.012, 6, 14), M.sdSilver);
      ring.rotation.x = Math.PI / 2; ring.position.y = -0.85;
      arm.add(ring);
    });

    // TWIN CURVED SCIMITARS — one in each hand
    const leftScimitar = this._buildScimitar(0);
    leftArm.userData.hand.add(leftScimitar);
    leftScimitar.position.set(0, 0.04, 0.06);
    leftScimitar.rotation.set(Math.PI * 0.4, 0, 0);
    this.parts.leftWeapon = leftScimitar;

    const rightScimitar = this._buildScimitar(1);
    rightArm.userData.hand.add(rightScimitar);
    rightScimitar.position.set(0, 0.04, 0.06);
    rightScimitar.rotation.set(Math.PI * 0.4, 0, 0);
    this.parts.rightWeapon = rightScimitar;

    // Standard cape (smoke-teal — the base layer)
    const cape = buildCape({ material: M.smokeTeal, width: 1.2, height: 1.7 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // ===== RIBBON CLOAK — 5 individual long ribbons hanging from the shoulders/back =====
    // (the marquee feature — they sway independently in update())
    this.ribbons = [];
    const ribbonAnchors = [
      { x: -0.32, z: -0.08, color: M.smokeTeal,     length: 1.5, width: 0.08 },
      { x: -0.16, z: -0.12, color: M.smokeTealDark, length: 1.7, width: 0.07 },
      { x:  0.0,  z: -0.14, color: M.smokeTeal,     length: 1.9, width: 0.09 },
      { x:  0.16, z: -0.12, color: M.smokeTealDark, length: 1.6, width: 0.07 },
      { x:  0.32, z: -0.08, color: M.smokeTeal,     length: 1.5, width: 0.08 },
    ];
    ribbonAnchors.forEach(anch => {
      const ribbon = new THREE.Group();
      ribbon.position.set(anch.x, 2.32, anch.z);
      // Ribbon body — long thin box
      const body = mesh(new THREE.BoxGeometry(anch.width, anch.length, 0.012), anch.color);
      body.position.y = -anch.length / 2;
      ribbon.add(body);
      // Tip flare (the ribbon's curling end)
      const tipFlare = mesh(new THREE.ConeGeometry(anch.width / 2, 0.1, 4), anch.color);
      tipFlare.position.y = -anch.length - 0.02;
      tipFlare.rotation.x = Math.PI;
      ribbon.add(tipFlare);
      // Subtle teal-rune dot at the tip
      const tipDot = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.sdRune);
      tipDot.position.y = -anch.length - 0.06;
      ribbon.add(tipDot);
      root.add(ribbon);
      this.ribbons.push(ribbon);
    });

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — half-face wrap (lower face covered with teal cloth)
    const head = this._buildShadowdancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.sdEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.sdEye;
  }

  _buildScimitar(variant) {
    const scim = new THREE.Group();
    // Pommel — small disc
    const pommel = mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.018, 12), M.sdSilver);
    pommel.rotation.x = Math.PI / 2;
    scim.add(pommel);
    // Grip — black wrap with teal silk
    const grip = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.18, 10), M.midnight);
    grip.position.y = 0.1; scim.add(grip);
    // Teal silk wraps
    for (let i = 0; i < 4; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.02, 0.0035, 5, 10), M.smokeTeal);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.05 + i * 0.03;
      scim.add(wrap);
    }
    // Scimitar crossguard (curved horizontal bar with two D-rings)
    const cross = mesh(new THREE.BoxGeometry(0.1, 0.018, 0.022), M.sdSilver);
    cross.position.y = 0.21; scim.add(cross);
    // Decorative bend at one end of the crossguard (the scimitar curl)
    const crossCurl = mesh(new THREE.TorusGeometry(0.022, 0.0045, 6, 10, Math.PI), M.sdSilver);
    crossCurl.position.set(0.05, 0.21, 0); crossCurl.rotation.z = -Math.PI / 2;
    scim.add(crossCurl);
    // CURVED BLADE — built as an arc using a flat extrude of a curved shape
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.018, 0); bladeShape.lineTo(0.018, 0);
    // Curve outward (the scimitar's belly)
    bladeShape.bezierCurveTo(0.13, 0.1, 0.18, 0.5, 0.06, 0.78);
    bladeShape.bezierCurveTo(-0.0, 0.78, -0.018, 0.05, -0.018, 0);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.014, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.003, bevelSegments: 1 }), M.bsBladeEdge);
    blade.position.set(0, 0.22, -0.007); scim.add(blade);
    // Cutting edge (sharp inner)
    const edgeShape = new THREE.Shape();
    edgeShape.moveTo(0.04, 0.05); edgeShape.bezierCurveTo(0.13, 0.2, 0.16, 0.5, 0.05, 0.74);
    edgeShape.bezierCurveTo(0.05, 0.5, 0.05, 0.2, 0.04, 0.06);
    edgeShape.closePath();
    const edge = mesh(new THREE.ExtrudeGeometry(edgeShape, { depth: 0.018, bevelEnabled: false }), M.sdSilver);
    edge.position.set(0, 0.22, -0.009); scim.add(edge);
    // Variant: left scimitar has a small teal tassel at the pommel, right has a cord-loop
    if (variant === 0) {
      const tassel = mesh(new THREE.SphereGeometry(0.015, 8, 6), M.smokeTeal);
      tassel.position.y = -0.025; scim.add(tassel);
    } else {
      const cordLoop = mesh(new THREE.TorusGeometry(0.018, 0.003, 6, 12), M.smokeTealDark);
      cordLoop.position.y = -0.02; cordLoop.rotation.y = Math.PI / 2;
      scim.add(cordLoop);
    }
    return scim;
  }

  _buildShadowdancerHead() {
    const head = new THREE.Group();

    // Hair — long, dark
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.midnight);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin (upper portion only — lower covered by wrap)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Long flowing back hair
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.midnight);
    backHair.scale.set(1.05, 1.5, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);

    // ===== HALF-FACE WRAP (lower face covered with teal cloth — the marquee feature) =====
    const wrap = mesh(new THREE.SphereGeometry(0.21, 18, 12, 0, Math.PI * 2, Math.PI / 2.5, Math.PI / 3), M.smokeTeal);
    wrap.position.set(0, -0.04, 0.04); wrap.scale.set(0.97, 1, 1);
    head.add(wrap);
    // Wrap has small dangling tail (a piece flowing down behind the head)
    const wrapTail = mesh(new THREE.BoxGeometry(0.06, 0.18, 0.012), M.smokeTeal);
    wrapTail.position.set(0.18, -0.05, -0.05); wrapTail.rotation.z = -0.2;
    head.add(wrapTail);

    // Teal-rune mark on the forehead (visible above wrap)
    const browMark = mesh(new THREE.BoxGeometry(0.025, 0.005, 0.005), M.sdRune);
    browMark.position.set(0, 0.05, 0.21); head.add(browMark);
    // Two flanking dot-runes
    const dotL = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.sdRune);
    dotL.position.set(-0.05, 0.05, 0.21); head.add(dotL);
    const dotR = dotL.clone(); dotR.position.x = 0.05; head.add(dotR);

    // Eyes — smoke-teal glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.sdEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Smoky kohl eyeliner (sharp dark stripe extending past the eyes)
    for (let side = -1; side <= 1; side += 2) {
      const liner = mesh(new THREE.BoxGeometry(0.07, 0.006, 0.005), M.midnight);
      liner.position.set(side * 0.115, -0.025, 0.21); liner.rotation.z = side * -0.15;
      head.add(liner);
    }

    // Silver hair-pin / forehead jewel (silver feather-shape on the side of the head)
    const hairPin = mesh(new THREE.BoxGeometry(0.06, 0.015, 0.008), M.sdSilver);
    hairPin.position.set(-0.18, 0.06, 0.05); hairPin.rotation.z = 0.3;
    head.add(hairPin);
    const hairPinGem = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.sdRune);
    hairPinGem.position.set(-0.15, 0.07, 0.07);
    head.add(hairPinGem);

    return head;
  }
}
