// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  WARDEN — Tank IV/VI                                                     ║
// ║  Forest · Aegis · Verdigris bronze, wood, fur mantle, antlered helm,    ║
// ║  tree-of-life round shield, leaf-axe, warm forest-green glow            ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Warden extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = wardenAnimations;
  }
  build() {
    const root = this.group;
    const palette = { dark: M.bronzeDark, mid: M.bronze, accent: M.bronzeHi, trim: M.bronzeHi, leather: M.wood };
    root.add(buildLeg(-1, palette));
    root.add(buildLeg(1, palette));

    // Pelvis with leaf-buckle
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.leather));
    const buckleBack = mesh(new THREE.BoxGeometry(0.28, 0.18, 0.05), M.bronze);
    buckleBack.position.set(0, 0, 0.28); pelvis.add(buckleBack);
    // Leaf-shaped buckle face
    const leafBuckle = new THREE.Shape();
    leafBuckle.moveTo(0, -0.08);
    leafBuckle.bezierCurveTo(0.1, -0.04, 0.1, 0.04, 0, 0.08);
    leafBuckle.bezierCurveTo(-0.1, 0.04, -0.1, -0.04, 0, -0.08);
    const leafExt = mesh(new THREE.ExtrudeGeometry(leafBuckle, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2 }), M.bronzeHi);
    leafExt.position.set(0, 0, 0.31); pelvis.add(leafExt);
    // Leaf vein (vertical line down center)
    const leafVein = mesh(new THREE.BoxGeometry(0.005, 0.13, 0.005), M.forestRune);
    leafVein.position.set(0, 0, 0.34); pelvis.add(leafVein);
    // Buckle gem
    const buckleGem = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.forestEye);
    buckleGem.position.set(0, 0, 0.35); buckleGem.scale.set(1, 1, 0.5); pelvis.add(buckleGem);
    // Tassets — wider than other tanks, slight leaf curl
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      if (Math.abs(angle + Math.PI / 2) < 0.4) continue;
      const t = mesh(new THREE.BoxGeometry(0.2, 0.34, 0.045), M.bronze);
      t.position.set(Math.cos(angle) * 0.28, -0.21, Math.sin(angle) * 0.28);
      t.lookAt(Math.cos(angle) * 2, -0.21, Math.sin(angle) * 2);
      t.rotateX(0.18);
      pelvis.add(t);
      // Leaf-edge bottom of each tasset
      const leafTip = mesh(new THREE.ConeGeometry(0.04, 0.06, 4), M.bronzeHi);
      leafTip.position.set(Math.cos(angle) * 0.305, -0.4, Math.sin(angle) * 0.305);
      leafTip.lookAt(Math.cos(angle) * 2, -0.5, Math.sin(angle) * 2);
      leafTip.rotateX(Math.PI);
      pelvis.add(leafTip);
      const rivet = mesh(new THREE.SphereGeometry(0.022, 8, 6), M.bronzeHi);
      rivet.position.set(Math.cos(angle) * 0.305, -0.07, Math.sin(angle) * 0.305);
      pelvis.add(rivet);
    }
    root.add(pelvis);

    // Torso — verdigris bronze with tree-of-life emblem + vine rune lines
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const chest = mesh(new THREE.CylinderGeometry(0.36, 0.32, 0.7, 16), M.bronze);
    chest.scale.set(1.05, 1, 0.85); torso.add(chest);
    const ridge = mesh(new THREE.BoxGeometry(0.04, 0.6, 0.06), M.bronzeHi);
    ridge.position.set(0, 0.05, 0.32); torso.add(ridge);
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.bronze);
    pecL.position.set(-0.16, 0.18, 0.22); pecL.scale.set(1, 0.7, 0.6); torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16; torso.add(pecR);

    // Tree-of-life central emblem
    const emblemBase = mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.022, 24), M.bronzeDark);
    emblemBase.rotation.x = Math.PI / 2;
    emblemBase.position.set(0, 0.04, 0.36); torso.add(emblemBase);
    const emblemRing = mesh(new THREE.TorusGeometry(0.105, 0.008, 8, 32), M.bronzeHi);
    emblemRing.position.set(0, 0.04, 0.375); torso.add(emblemRing);
    // Trunk
    const trunk = mesh(new THREE.BoxGeometry(0.022, 0.16, 0.012), M.bronzeHi);
    trunk.position.set(0, 0.0, 0.385); torso.add(trunk);
    // Roots (thin lines spreading downward)
    for (let i = -1; i <= 1; i += 2) {
      const root1 = mesh(new THREE.BoxGeometry(0.03, 0.008, 0.008), M.bronzeHi);
      root1.position.set(i * 0.025, -0.075, 0.385);
      root1.rotation.z = i * 0.4;
      torso.add(root1);
    }
    // Branches (thin lines spreading upward and outward)
    for (let i = 0; i < 5; i++) {
      const a = (i - 2) / 4 * Math.PI * 0.5;
      const branch = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.008), M.bronzeHi);
      branch.position.set(Math.sin(a) * 0.04, 0.07 + Math.cos(a) * 0.025, 0.385);
      branch.rotation.z = a + Math.PI / 2;
      torso.add(branch);
      // Tiny leaf-glow at branch tip
      const leafTip = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.forestEye);
      leafTip.position.set(Math.sin(a) * 0.075, 0.08 + Math.cos(a) * 0.045, 0.39);
      leafTip.scale.set(1, 0.7, 0.5);
      torso.add(leafTip);
    }

    // Vine-like rune lines down each side (curvy, organic)
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const yOff = -0.2 + t * 0.4;
      const xWobble = Math.sin(t * Math.PI * 2) * 0.015;
      const runeL = mesh(new THREE.BoxGeometry(0.05, 0.012, 0.005), M.forestRune);
      runeL.position.set(-0.32 + xWobble, yOff, 0.18);
      runeL.rotation.z = (i % 2 === 0) ? 0.3 : -0.3;
      torso.add(runeL);
      const runeR = runeL.clone();
      runeR.position.x = 0.32 - xWobble;
      runeR.rotation.z = -runeL.rotation.z;
      torso.add(runeR);
    }

    // Gorget
    const gorget = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.13, 16), M.bronzeHi);
    gorget.position.y = 0.42; torso.add(gorget);
    const gorgetTrim = mesh(new THREE.TorusGeometry(0.19, 0.012, 8, 24), M.bronze);
    gorgetTrim.rotation.x = Math.PI / 2; gorgetTrim.position.y = 0.485; torso.add(gorgetTrim);
    // Small bronze leaf-shaped neck ornaments
    for (let side = -1; side <= 1; side += 2) {
      const neckLeaf = mesh(new THREE.SphereGeometry(0.025, 8, 6), M.bronzeHi);
      neckLeaf.position.set(side * 0.12, 0.46, 0.18);
      neckLeaf.scale.set(1, 1.5, 0.4);
      torso.add(neckLeaf);
    }

    root.add(torso);
    this.parts.body = torso;

    // Smaller bronze pauldrons (will be partially hidden by fur mantle)
    const buildLeafPauldron = (sx) => {
      const p = new THREE.Group();
      const cap = mesh(new THREE.SphereGeometry(0.21, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.7), M.bronze);
      cap.scale.set(1.1, 1, 1.1); p.add(cap);
      const trim = mesh(new THREE.TorusGeometry(0.21, 0.018, 8, 24), M.bronzeHi);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      // Three overlapping leaf-shaped plates draping down
      for (let i = 0; i < 3; i++) {
        const leafShape = new THREE.Shape();
        leafShape.moveTo(0, 0);
        leafShape.bezierCurveTo(0.07, -0.04, 0.07, -0.18, 0, -0.22);
        leafShape.bezierCurveTo(-0.07, -0.18, -0.07, -0.04, 0, 0);
        const leaf = mesh(new THREE.ExtrudeGeometry(leafShape, { depth: 0.018, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.003, bevelSegments: 2 }), M.bronzeHi);
        leaf.position.set((i - 1) * 0.08 * sx, -0.04, 0.05);
        leaf.rotation.z = (i - 1) * 0.2;
        p.add(leaf);
      }
      const inner = mesh(new THREE.SphereGeometry(0.16, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.bronzeDark);
      inner.scale.set(1, 0.85, 1); inner.position.y = -0.05; p.add(inner);
      p.position.set(sx * 0.42, 2.2, 0);
      return p;
    };
    root.add(buildLeafPauldron(-1));
    root.add(buildLeafPauldron(1));

    // Fur mantle — distinctive cloak-like shawl over both shoulders
    const mantle = this._buildFurMantle();
    mantle.position.set(0, 2.32, 0);
    root.add(mantle);

    // Arms
    const armPalette = { mid: M.bronze, dark: M.bronzeDark, hi: M.bronzeHi, accent: M.bronzeHi, cloth: M.wood };
    const leftArm = buildArm(-1, 0.25, armPalette);
    leftArm.rotation.x = -0.08;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.0, armPalette);
    rightArm.rotation.x = -0.42;
    rightArm.rotation.z = 0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Round wooden tree-shield (parented to left hand)
    const shield = this._buildTreeShield();
    leftArm.userData.hand.add(shield);
    shield.position.set(-0.05, -0.1, 0.05);
    shield.rotation.set(0.2, 0.4, -0.2);
    shield.scale.setScalar(0.95);
    this.parts.shield = shield;

    // Leaf-axe (parented to right hand)
    const axe = this._buildLeafAxe();
    rightArm.userData.hand.add(axe);
    axe.position.set(0, 0.05, 0.08);
    axe.rotation.set(Math.PI * 0.55, 0, 0.05);
    this.parts.weapon = axe;

    // Neck + helm
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.bronzeDark);
    neck.position.y = 2.32; root.add(neck);
    const helm = this._buildAntleredHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    // Cape — deep forest green (under the fur mantle, hangs below)
    const cape = buildCape({ material: M.forestCape });
    cape.position.set(0, 2.36, 0); root.add(cape);
    this.cape = cape;
    const capeTrim = buildCape({ material: M.forestTrim, width: 1.34, height: 1.88 });
    capeTrim.position.set(0, 2.36, -0.005); root.add(capeTrim);

    // Cape clasps (small bronze leaves)
    const claspL = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.bronzeHi);
    claspL.position.set(-0.28, 2.34, 0.22); claspL.scale.set(1, 1.4, 0.5); root.add(claspL);
    const claspR = claspL.clone(); claspR.position.x = 0.28; root.add(claspR);
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      const link = mesh(new THREE.TorusGeometry(0.022, 0.005, 6, 10), M.bronze);
      link.position.set(-0.24 + t * 0.48, 2.32 - Math.sin(t * Math.PI) * 0.04, 0.24);
      link.rotation.x = Math.PI / 2;
      root.add(link);
    }

    M.forestEye.userData.baseIntensity = 4.0;
    this.eyeMaterial = M.forestEye;
  }

  _buildFurMantle() {
    const mantle = new THREE.Group();
    // Base ring — partial torus draped across shoulders and back
    const base = mesh(new THREE.TorusGeometry(0.42, 0.13, 12, 32, Math.PI * 1.35), M.fur);
    base.rotation.x = Math.PI / 2;
    base.rotation.z = Math.PI / 2;
    mantle.add(base);
    // Front gap: only covers from one shoulder over the back to the other shoulder
    // (the partial torus already does this by spanning ~243°)

    // Layered fur tufts — small cones sticking outward radially
    const TUFT_COUNT = 60;
    for (let i = 0; i < TUFT_COUNT; i++) {
      // Spread along the back/shoulders
      const t = i / (TUFT_COUNT - 1);
      const angle = -Math.PI * 0.18 + t * Math.PI * 1.35;
      const r = 0.42 + (Math.random() - 0.3) * 0.04;
      const hMod = 0.04 + Math.random() * 0.05;
      const tuft = mesh(new THREE.ConeGeometry(0.04 + Math.random() * 0.02, 0.1 + hMod, 6), Math.random() > 0.65 ? M.furHi : M.fur);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      tuft.position.set(cosA * r, sinA * r * 0.4 + (Math.random() - 0.5) * 0.04, -Math.abs(sinA) * 0.18 + (Math.random() - 0.5) * 0.05);
      // Point outward
      tuft.lookAt(cosA * r * 3, sinA * r * 1.2, -Math.abs(sinA) * 0.5);
      tuft.rotation.x += Math.PI / 2 + (Math.random() - 0.5) * 0.5;
      mantle.add(tuft);
    }

    // Inner lining (slightly visible darker layer)
    const lining = mesh(new THREE.TorusGeometry(0.36, 0.08, 12, 32, Math.PI * 1.3), M.fur);
    lining.rotation.x = Math.PI / 2;
    lining.rotation.z = Math.PI / 2;
    lining.position.y = 0.02;
    mantle.add(lining);

    // Front-tie cords (two leather straps crossing the chest)
    const cord1 = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.32, 8), M.leather);
    cord1.position.set(0, -0.05, 0.36);
    cord1.rotation.z = 0.5; cord1.rotation.x = -0.2;
    mantle.add(cord1);
    const cord2 = cord1.clone();
    cord2.rotation.z = -0.5;
    mantle.add(cord2);
    const tieKnot = mesh(new THREE.SphereGeometry(0.03, 10, 8), M.leather);
    tieKnot.position.set(0, -0.05, 0.38);
    mantle.add(tieKnot);
    // Bone toggle on the knot
    const toggle = mesh(new THREE.CylinderGeometry(0.012, 0.015, 0.04, 8), M.bone);
    toggle.position.set(0, -0.08, 0.4);
    mantle.add(toggle);

    return mantle;
  }

  _buildTreeShield() {
    const shield = new THREE.Group();

    // Wooden disc base
    const disc = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.075, 32), M.wood);
    disc.rotation.x = Math.PI / 2; shield.add(disc);

    // Subtle radial plank lines (wooden boards visible)
    for (let i = 0; i < 5; i++) {
      const line = mesh(new THREE.BoxGeometry(0.005, 0.01, 0.95), M.bronzeDark);
      line.position.set((i - 2) * 0.18, 0.04, 0);
      shield.add(line);
    }

    // Bronze outer rim
    shield.add(mesh(new THREE.TorusGeometry(0.5, 0.04, 12, 48), M.bronze));
    // Inner ring detail
    const innerRim = mesh(new THREE.TorusGeometry(0.4, 0.018, 10, 48), M.bronzeHi);
    innerRim.position.z = 0.04; shield.add(innerRim);

    // Studs around the rim
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const stud = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.bronzeHi);
      stud.position.set(Math.cos(a) * 0.46, Math.sin(a) * 0.46, 0.05);
      shield.add(stud);
    }

    // Center boss (bronze dome)
    const boss = mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.03, 24), M.bronze);
    boss.rotation.x = Math.PI / 2; boss.position.z = 0.08; shield.add(boss);
    const bossDome = mesh(new THREE.SphereGeometry(0.12, 18, 14), M.bronzeHi);
    bossDome.scale.set(1, 1, 0.5); bossDome.position.z = 0.11; shield.add(bossDome);
    const bossGem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.forestEye);
    bossGem.position.z = 0.16; bossGem.scale.set(1, 1, 0.6); shield.add(bossGem);

    // Tree-of-life: trunk going up, three branches with leaf-glow tips
    const trunk = mesh(new THREE.BoxGeometry(0.04, 0.32, 0.022), M.bronzeHi);
    trunk.position.set(0, -0.18, 0.075); shield.add(trunk);

    // Roots spreading at base
    for (let i = -1; i <= 1; i += 2) {
      const r1 = mesh(new THREE.BoxGeometry(0.06, 0.01, 0.012), M.bronzeHi);
      r1.position.set(i * 0.04, -0.345, 0.075);
      r1.rotation.z = i * 0.5;
      shield.add(r1);
      const r2 = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.01), M.bronzeHi);
      r2.position.set(i * 0.085, -0.36, 0.075);
      r2.rotation.z = i * 0.7;
      shield.add(r2);
    }

    // Canopy crown — main horizontal branch
    const mainBranch = mesh(new THREE.BoxGeometry(0.32, 0.018, 0.018), M.bronzeHi);
    mainBranch.position.set(0, 0.0, 0.075); shield.add(mainBranch);

    // Side branches (forking up-out)
    const branchAngles = [-0.6, -0.3, 0.0, 0.3, 0.6];
    for (const a of branchAngles) {
      const len = 0.16 - Math.abs(a) * 0.08;
      const br = mesh(new THREE.BoxGeometry(len, 0.014, 0.012), M.bronzeHi);
      br.position.set(Math.sin(a) * 0.12, 0.08 + Math.cos(a) * 0.04, 0.075);
      br.rotation.z = a + Math.PI / 2;
      shield.add(br);
      // Leaf-glow tip
      const tipX = Math.sin(a) * (0.12 + len * 0.8 * Math.sin(a + Math.PI / 2));
      const tipY = 0.08 + Math.cos(a) * 0.04 + len * 0.8 * Math.cos(a + Math.PI / 2 - Math.PI / 2);
      // Simplified tip placement
      const tipPos = new THREE.Vector3(
        Math.sin(a) * 0.12 + Math.sin(a) * len * 0.5 * 0.8,
        0.08 + Math.cos(a) * 0.04 + Math.cos(a) * len * 0.5 * 0.8,
        0.085
      );
      const leafTip = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.forestEye);
      leafTip.position.copy(tipPos);
      leafTip.scale.set(1, 1.3, 0.5);
      shield.add(leafTip);
    }

    // A few small bronze leaves on branches (decorative)
    for (let i = 0; i < 6; i++) {
      const leaf = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.bronzeHi);
      const angle = (i / 6) * Math.PI - Math.PI / 2;
      leaf.position.set(Math.sin(angle) * 0.16, 0.13 + Math.cos(angle) * 0.06, 0.08);
      leaf.scale.set(0.7, 1.2, 0.4);
      shield.add(leaf);
    }

    return shield;
  }

  _buildLeafAxe() {
    const axe = new THREE.Group();

    // Pommel — wood with bronze cap
    const pommel = mesh(new THREE.SphereGeometry(0.05, 14, 12), M.wood);
    axe.add(pommel);
    const pommelCap = mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.025, 12), M.bronzeHi);
    pommelCap.position.y = 0.04; axe.add(pommelCap);
    const pommelGem = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.forestEye);
    pommelGem.position.set(0, 0.05, 0); axe.add(pommelGem);

    // Wooden haft (long)
    const haft = mesh(new THREE.CylinderGeometry(0.032, 0.035, 0.95, 12), M.woodHi);
    haft.position.y = 0.55; axe.add(haft);
    // Leather wrap rings along haft
    for (let i = 0; i < 6; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.037, 0.005, 6, 12), M.leather);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.18 + i * 0.13;
      axe.add(wrap);
    }
    // Vine wrap (forest rune glow line wound around the haft)
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      const angle = t * Math.PI * 4;
      const vineSeg = mesh(new THREE.SphereGeometry(0.006, 6, 4), M.forestRune);
      vineSeg.position.set(Math.cos(angle) * 0.04, 0.2 + t * 0.7, Math.sin(angle) * 0.04);
      axe.add(vineSeg);
    }

    // Head collar (where blade meets haft)
    const collar = mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.08, 12), M.bronze);
    collar.position.y = 1.05; axe.add(collar);
    const collarRing = mesh(new THREE.TorusGeometry(0.062, 0.008, 6, 16), M.bronzeHi);
    collarRing.rotation.x = Math.PI / 2; collarRing.position.y = 1.05; axe.add(collarRing);

    // LEAF-AXE HEAD — asymmetric leaf-shaped blade extending forward
    const headShape = new THREE.Shape();
    headShape.moveTo(0, -0.12);                                    // bottom of haft attachment
    headShape.lineTo(0, 0.18);                                     // up the haft side
    headShape.bezierCurveTo(0.1, 0.32, 0.32, 0.32, 0.42, 0.18);   // curve out and forward (top of leaf)
    headShape.lineTo(0.5, 0.05);                                   // sharp tip
    headShape.bezierCurveTo(0.42, -0.08, 0.18, -0.18, 0, -0.12);  // curve back to base (bottom of leaf)
    headShape.closePath();

    const head = mesh(new THREE.ExtrudeGeometry(headShape, { depth: 0.022, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.005, bevelSegments: 2 }), M.bronzeHi);
    head.position.set(0, 1.15, -0.011);
    axe.add(head);

    // Central leaf vein (rune glow line)
    const vein = mesh(new THREE.BoxGeometry(0.32, 0.012, 0.005), M.forestRune);
    vein.position.set(0.2, 1.2, 0.013);
    vein.rotation.z = -0.15;
    axe.add(vein);

    // Side veins (smaller, branching off main vein)
    for (let i = 0; i < 3; i++) {
      const t = (i + 1) / 4;
      const veinSide = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.004), M.forestRune);
      veinSide.position.set(0.05 + t * 0.3, 1.22 + t * 0.04, 0.014);
      veinSide.rotation.z = 0.6;
      axe.add(veinSide);
    }

    // Counterweight on the back side (small bronze spike + wood ball)
    const counterCollar = mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.05, 10), M.bronzeHi);
    counterCollar.position.set(-0.05, 1.15, 0); counterCollar.rotation.z = Math.PI / 2; axe.add(counterCollar);
    const counterBall = mesh(new THREE.SphereGeometry(0.05, 12, 10), M.bronzeDark);
    counterBall.position.set(-0.12, 1.15, 0); axe.add(counterBall);
    const counterSpike = mesh(new THREE.ConeGeometry(0.025, 0.07, 6), M.bronzeHi);
    counterSpike.position.set(-0.2, 1.15, 0); counterSpike.rotation.z = Math.PI / 2; axe.add(counterSpike);

    // Top spike of haft
    const topSpike = mesh(new THREE.ConeGeometry(0.025, 0.07, 6), M.bronzeHi);
    topSpike.position.y = 1.41; axe.add(topSpike);

    return axe;
  }

  _buildAntleredHelm() {
    const helm = new THREE.Group();
    // Skull
    const skull = mesh(new THREE.SphereGeometry(0.22, 20, 16), M.bronze);
    skull.scale.set(1, 1.05, 1.1); helm.add(skull);

    // Brow band
    const browBand = mesh(new THREE.TorusGeometry(0.22, 0.02, 10, 32), M.bronzeHi);
    browBand.rotation.x = Math.PI / 2; browBand.position.y = 0.04; helm.add(browBand);

    // Top crest (small ridge along the top, like a stag's head ridge)
    const topCrest = mesh(new THREE.BoxGeometry(0.04, 0.1, 0.4), M.bronzeHi);
    topCrest.position.set(0, 0.18, 0); helm.add(topCrest);

    // ANTLERS — main beam + tines
    // Build antlers as multi-segment branches
    const buildAntler = (sx) => {
      const ant = new THREE.Group();
      // Main beam — three segments going up-back-out
      // Segment 1: from base, swept up and slightly back/out
      const seg1 = mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.18, 8), M.bone);
      seg1.position.set(sx * 0.05, 0.09, -0.04);
      seg1.rotation.z = sx * -0.3; seg1.rotation.x = 0.3;
      ant.add(seg1);
      // Segment 2: continuing up and out
      const seg2 = mesh(new THREE.CylinderGeometry(0.022, 0.025, 0.16, 8), M.bone);
      seg2.position.set(sx * 0.13, 0.22, -0.1);
      seg2.rotation.z = sx * -0.5; seg2.rotation.x = 0.5;
      ant.add(seg2);
      // Segment 3: tine going up
      const seg3 = mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.14, 8), M.boneHi);
      seg3.position.set(sx * 0.21, 0.34, -0.15);
      seg3.rotation.z = sx * -0.3; seg3.rotation.x = 0.4;
      ant.add(seg3);
      // Tine 1 (forks forward and up from segment 2)
      const tine1 = mesh(new THREE.CylinderGeometry(0.014, 0.018, 0.13, 8), M.bone);
      tine1.position.set(sx * 0.18, 0.27, -0.04);
      tine1.rotation.z = sx * -0.7; tine1.rotation.x = 0.1;
      ant.add(tine1);
      // Tine 2 (forks forward from segment 3)
      const tine2 = mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.11, 8), M.bone);
      tine2.position.set(sx * 0.27, 0.38, -0.08);
      tine2.rotation.z = sx * -0.8; tine2.rotation.x = 0.0;
      ant.add(tine2);
      // Tine 3 (small back-tine from segment 3)
      const tine3 = mesh(new THREE.CylinderGeometry(0.01, 0.013, 0.09, 8), M.boneHi);
      tine3.position.set(sx * 0.23, 0.4, -0.22);
      tine3.rotation.z = sx * -0.2; tine3.rotation.x = 0.7;
      ant.add(tine3);
      // Tip caps (small spheres at the end of each tine)
      for (const seg of [seg3, tine1, tine2, tine3]) {
        const cap = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.boneHi);
        cap.position.copy(seg.position);
        // Move along seg direction by half its length
        const dir = new THREE.Vector3(0, 0.5, 0).applyEuler(seg.rotation);
        cap.position.add(dir.multiplyScalar(seg.geometry.parameters.height));
        ant.add(cap);
      }
      // Small bronze cuff at antler base (where it meets helm)
      const cuff = mesh(new THREE.TorusGeometry(0.04, 0.012, 8, 12), M.bronzeHi);
      cuff.rotation.set(0.3, 0, sx * -0.3);
      cuff.position.set(sx * 0.05, 0.04, -0.04);
      ant.add(cuff);
      return ant;
    };
    helm.add(buildAntler(-1));
    helm.add(buildAntler(1));

    // Eye visor — wide horizontal slit
    const visor = mesh(new THREE.BoxGeometry(0.32, 0.05, 0.04), M.stoneDark);
    visor.position.set(0, 0.0, 0.18); helm.add(visor);
    // Glowing forest-green eyes
    const eyeL = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.forestEye);
    eyeL.position.set(-0.075, 0.0, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; helm.add(eyeR);

    // Forehead leaf-glyph
    const foreheadGlyph = mesh(new THREE.SphereGeometry(0.022, 8, 6), M.forestRune);
    foreheadGlyph.position.set(0, 0.13, 0.21); foreheadGlyph.scale.set(0.6, 1.2, 0.5);
    helm.add(foreheadGlyph);

    // Nose guard (bronze)
    const noseGuard = mesh(new THREE.BoxGeometry(0.045, 0.16, 0.03), M.bronzeHi);
    noseGuard.position.set(0, -0.08, 0.21); helm.add(noseGuard);

    // Cheek guards
    const cheek = (sx) => {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0.1, 0);
      shape.lineTo(0.08, -0.16); shape.lineTo(-0.02, -0.18); shape.closePath();
      const g = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 }), M.bronze);
      g.position.set(sx * 0.18, -0.1, 0.08);
      g.rotation.y = sx > 0 ? -0.4 : Math.PI + 0.4;
      return g;
    };
    helm.add(cheek(-1)); helm.add(cheek(1));

    // Bottom rim
    const helmRim = mesh(new THREE.TorusGeometry(0.21, 0.018, 10, 24), M.bronzeHi);
    helmRim.rotation.x = Math.PI / 2; helmRim.position.y = -0.21; helm.add(helmRim);

    return helm;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  JUGGERNAUT — Tank V/VI                                                  ║
// ║  Iron · Brute · Blackened iron, rust, blood-red ember glow,             ║
// ║  bull-horned helm, chained chest, asymmetric spiked pauldrons,          ║
// ║  brutalist warmaul, spiked bulwark shield, tattered crimson cloak       ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Juggernaut extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = juggernautAnimations;
  }
  build() {
    const root = this.group;
    const palette = { dark: M.darkIron, mid: M.iron, accent: M.ironHi, trim: M.ironHi, leather: M.leather };
    root.add(buildLeg(-1, palette));
    root.add(buildLeg(1, palette));

    // Pelvis with broken-chain buckle motif
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.3, 0.32, 0.22, 16), M.leather));
    const buckleBack = mesh(new THREE.BoxGeometry(0.32, 0.2, 0.05), M.iron);
    buckleBack.position.set(0, 0, 0.3); pelvis.add(buckleBack);
    // Heavy iron buckle plate
    const buckleFace = mesh(new THREE.BoxGeometry(0.22, 0.15, 0.04), M.ironHi);
    buckleFace.position.set(0, 0, 0.33); pelvis.add(buckleFace);
    // Broken-chain symbol — two link halves with snapped center
    const linkL = mesh(new THREE.TorusGeometry(0.025, 0.008, 8, 16, Math.PI), M.ironHi);
    linkL.rotation.set(Math.PI / 2, 0, Math.PI / 2);
    linkL.position.set(-0.04, 0, 0.36); pelvis.add(linkL);
    const linkR = linkL.clone();
    linkR.rotation.set(Math.PI / 2, 0, -Math.PI / 2);
    linkR.position.set(0.04, 0, 0.36); pelvis.add(linkR);
    // Center red glow (the break itself)
    const breakGlow = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.emberDeep);
    breakGlow.position.set(0, 0, 0.37); breakGlow.scale.set(1.2, 0.7, 0.5); pelvis.add(breakGlow);
    // Side rivets (bigger and chunkier than other tanks)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 2; i++) {
        const rivet = mesh(new THREE.SphereGeometry(0.025, 8, 6), M.ironHi);
        rivet.position.set(side * (0.13 + i * 0.04), 0, 0.32);
        pelvis.add(rivet);
      }
    }
    // Tassets — heavier, chunkier, with rust streaks
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      if (Math.abs(angle + Math.PI / 2) < 0.4) continue;
      const t = mesh(new THREE.BoxGeometry(0.22, 0.36, 0.05), M.iron);
      t.position.set(Math.cos(angle) * 0.3, -0.22, Math.sin(angle) * 0.3);
      t.lookAt(Math.cos(angle) * 2, -0.22, Math.sin(angle) * 2);
      t.rotateX(0.18);
      pelvis.add(t);
      // Rust streak on bottom (uneven)
      if (Math.random() > 0.4) {
        const streak = mesh(new THREE.BoxGeometry(0.18, 0.15, 0.005), M.rust);
        streak.position.set(Math.cos(angle) * 0.32, -0.32, Math.sin(angle) * 0.32);
        streak.lookAt(Math.cos(angle) * 2, -0.32, Math.sin(angle) * 2);
        streak.rotateX(0.18);
        pelvis.add(streak);
      }
      // Big chunky rivets
      for (let r = -1; r <= 1; r += 2) {
        const rivet = mesh(new THREE.SphereGeometry(0.025, 8, 6), M.ironHi);
        rivet.position.set(Math.cos(angle) * 0.325 + r * Math.sin(angle) * 0.06, -0.08, Math.sin(angle) * 0.325 - r * Math.cos(angle) * 0.06);
        pelvis.add(rivet);
      }
    }
    root.add(pelvis);

    // Torso — heavier, wider, dark iron with rust + scars
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const chest = mesh(new THREE.CylinderGeometry(0.4, 0.36, 0.72, 16), M.darkIron);
    chest.scale.set(1.12, 1, 0.88); torso.add(chest);
    // Center vertical ridge — ironHi with rivets
    const ridge = mesh(new THREE.BoxGeometry(0.05, 0.62, 0.07), M.ironHi);
    ridge.position.set(0, 0.05, 0.34); torso.add(ridge);
    // Pectoral plates — heavier, bulkier
    const pecL = mesh(new THREE.SphereGeometry(0.2, 14, 12), M.iron);
    pecL.position.set(-0.18, 0.18, 0.22); pecL.scale.set(1, 0.7, 0.6); torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.18; torso.add(pecR);

    // Battle scars — diagonal slashes across the chest plate
    for (let i = 0; i < 3; i++) {
      const scar = mesh(new THREE.BoxGeometry(0.15 + Math.random() * 0.08, 0.012, 0.005), M.darkIron);
      scar.position.set(-0.12 + i * 0.12, -0.08 + i * 0.04, 0.34);
      scar.rotation.z = -0.4 + i * 0.15;
      torso.add(scar);
    }
    // Rust patches across the chest (random splotches)
    for (let i = 0; i < 5; i++) {
      const rustPatch = mesh(new THREE.SphereGeometry(0.04 + Math.random() * 0.03, 8, 6), M.rust);
      rustPatch.position.set(-0.3 + Math.random() * 0.6, -0.15 + Math.random() * 0.3, 0.345);
      rustPatch.scale.set(1.5, 1, 0.1);
      torso.add(rustPatch);
    }

    // Broken chain emblem — central chest motif
    const emblemBase = mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.022, 24), M.darkIron);
    emblemBase.rotation.x = Math.PI / 2;
    emblemBase.position.set(0, 0.05, 0.36); torso.add(emblemBase);
    const emblemRing = mesh(new THREE.TorusGeometry(0.095, 0.008, 8, 32), M.ironHi);
    emblemRing.position.set(0, 0.05, 0.375); torso.add(emblemRing);
    // Two chain link halves on either side of the emblem
    for (let side = -1; side <= 1; side += 2) {
      const linkHalf = mesh(new THREE.TorusGeometry(0.035, 0.012, 8, 16, Math.PI), M.ironHi);
      linkHalf.rotation.set(Math.PI / 2, 0, side * Math.PI / 2);
      linkHalf.position.set(side * 0.04, 0.05, 0.385);
      torso.add(linkHalf);
    }
    // Center ember (the break itself)
    const emblemEmber = mesh(new THREE.SphereGeometry(0.03, 12, 10), M.emberDeep);
    emblemEmber.position.set(0, 0.05, 0.4); emblemEmber.scale.set(1.5, 0.8, 0.5); torso.add(emblemEmber);

    // Jagged blood-rune lines down each side (sharp, angular, not curved)
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const yOff = -0.2 + t * 0.4;
      const runeL = mesh(new THREE.BoxGeometry(0.07, 0.012, 0.005), M.bloodRune);
      runeL.position.set(-0.34, yOff, 0.18);
      runeL.rotation.z = (i % 2 === 0) ? 0.45 : -0.45; // jagged zigzag
      torso.add(runeL);
      const runeR = runeL.clone();
      runeR.position.x = 0.34;
      runeR.rotation.z = -runeL.rotation.z;
      torso.add(runeR);
    }

    // Heavy gorget with spikes
    const gorget = mesh(new THREE.CylinderGeometry(0.19, 0.23, 0.14, 16), M.iron);
    gorget.position.y = 0.42; torso.add(gorget);
    const gorgetTrim = mesh(new THREE.TorusGeometry(0.2, 0.014, 8, 24), M.ironHi);
    gorgetTrim.rotation.x = Math.PI / 2; gorgetTrim.position.y = 0.49; torso.add(gorgetTrim);
    // Gorget spikes (small)
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i / 5) * Math.PI;
      const spike = mesh(new THREE.ConeGeometry(0.018, 0.06, 6), M.ironHi);
      spike.position.set(Math.cos(a + Math.PI / 2) * 0.2, 0.5, Math.sin(a + Math.PI / 2) * 0.2);
      spike.rotation.x = a;
      torso.add(spike);
    }

    root.add(torso);
    this.parts.body = torso;

    // ASYMMETRIC PAULDRONS — left (player's left, looking-at-character right) is bigger / more spikes
    const buildBigPauldron = (sx) => {
      const p = new THREE.Group();
      // Bigger main shoulder cap
      const cap = mesh(new THREE.SphereGeometry(0.28, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.6), M.iron);
      cap.scale.set(1.25, 1.15, 1.25); p.add(cap);
      // Heavy iron rim
      const trim = mesh(new THREE.TorusGeometry(0.28, 0.025, 8, 24), M.darkIron);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      // Top: cluster of upward spikes (5 spikes)
      for (let i = 0; i < 5; i++) {
        const a = -0.6 + (i / 4) * 1.2;
        const sLen = 0.14 - Math.abs(i - 2) * 0.025;
        const spike = mesh(new THREE.ConeGeometry(0.03, sLen, 6), M.ironHi);
        spike.position.set(Math.sin(a) * 0.1 * sx, 0.16, -Math.cos(a) * 0.04);
        spike.rotation.z = sx * a * 0.5;
        spike.rotation.x = -0.3;
        p.add(spike);
      }
      // Side spike (big one pointing outward)
      const sideSpike = mesh(new THREE.ConeGeometry(0.045, 0.18, 8), M.ironHi);
      sideSpike.position.set(sx * 0.22, 0.06, 0);
      sideSpike.rotation.z = -sx * Math.PI / 2;
      p.add(sideSpike);
      // Inner cap detail
      const inner = mesh(new THREE.SphereGeometry(0.22, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.6), M.darkIron);
      inner.scale.set(1, 0.85, 1); inner.position.y = -0.05; p.add(inner);
      // Rust streaks across
      const rustStreak = mesh(new THREE.SphereGeometry(0.06, 8, 6), M.rust);
      rustStreak.position.set(sx * 0.05, 0.04, 0.18); rustStreak.scale.set(1.5, 0.8, 0.2);
      p.add(rustStreak);
      // Bigger pauldron sits a tiny bit further out
      p.position.set(sx * 0.48, 2.22, 0);
      return p;
    };
    const buildSmallerPauldron = (sx) => {
      const p = new THREE.Group();
      // Smaller cap (slightly bigger than knight's but smaller than big side)
      const cap = mesh(new THREE.SphereGeometry(0.23, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.65), M.iron);
      cap.scale.set(1.15, 1, 1.15); p.add(cap);
      const trim = mesh(new THREE.TorusGeometry(0.23, 0.022, 8, 24), M.darkIron);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      // Just two top spikes
      for (let i = 0; i < 2; i++) {
        const spike = mesh(new THREE.ConeGeometry(0.025, 0.1, 6), M.ironHi);
        spike.position.set(sx * (-0.04 + i * 0.08), 0.13, -0.02);
        spike.rotation.x = -0.2;
        p.add(spike);
      }
      // Single side spike (smaller)
      const sideSpike = mesh(new THREE.ConeGeometry(0.035, 0.12, 8), M.ironHi);
      sideSpike.position.set(sx * 0.18, 0.04, 0);
      sideSpike.rotation.z = -sx * Math.PI / 2;
      p.add(sideSpike);
      const inner = mesh(new THREE.SphereGeometry(0.17, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.65), M.darkIron);
      inner.scale.set(1, 0.85, 1); inner.position.y = -0.05; p.add(inner);
      // Small rust patch
      const rustPatch = mesh(new THREE.SphereGeometry(0.04, 8, 6), M.rust);
      rustPatch.position.set(sx * -0.06, 0.0, 0.18); rustPatch.scale.set(1.2, 1, 0.2);
      p.add(rustPatch);
      p.position.set(sx * 0.43, 2.22, 0);
      return p;
    };
    // Right (sx=1) is the dominant pauldron (weapon side)
    root.add(buildBigPauldron(1));
    root.add(buildSmallerPauldron(-1));

    // CHAINS draped across the chest — heavy iron, sagging
    this._buildChestChains(root);

    // Arms
    const armPalette = { mid: M.iron, dark: M.darkIron, hi: M.ironHi, accent: M.ironHi, cloth: M.darkIron };
    const leftArm = buildArm(-1, 0.25, armPalette);
    leftArm.rotation.x = -0.08;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.0, armPalette);
    rightArm.rotation.x = -0.42;
    rightArm.rotation.z = 0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Spiked Bulwark shield
    const shield = this._buildSpikedBulwark();
    leftArm.userData.hand.add(shield);
    shield.position.set(-0.05, -0.1, 0.05);
    shield.rotation.set(0.2, 0.4, -0.2);
    shield.scale.setScalar(0.95);
    this.parts.shield = shield;

    // Brutal warmaul
    const maul = this._buildWarmaul();
    rightArm.userData.hand.add(maul);
    maul.position.set(0, 0.05, 0.08);
    maul.rotation.set(Math.PI * 0.55, 0, 0.05);
    this.parts.weapon = maul;

    // Neck + helm
    const neck = mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.12, 12), M.darkIron);
    neck.position.y = 2.32; root.add(neck);
    const helm = this._buildBruteHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    // Tattered short cape — deep blood-crimson
    const cape = buildCape({ material: M.ragCape, height: 1.55 });
    cape.position.set(0, 2.36, 0); root.add(cape);
    this.cape = cape;
    // Trim layer
    const capeTrim = buildCape({ material: M.ragCapeTrim, width: 1.34, height: 1.58 });
    capeTrim.position.set(0, 2.36, -0.005); root.add(capeTrim);
    // Add a few "rip" damage marks at the bottom of the cape
    for (let i = 0; i < 5; i++) {
      const u = -0.4 + (i / 4) * 0.8;
      const ripDepth = 0.08 + Math.random() * 0.1;
      const rip = mesh(new THREE.BoxGeometry(0.03, ripDepth, 0.005), M.darkIron);
      rip.position.set(u * 0.55, 2.36 - 1.55 + ripDepth / 2, -0.04);
      root.add(rip);
    }

    // Cape clasps — heavy iron rings
    const claspL = mesh(new THREE.TorusGeometry(0.04, 0.012, 8, 16), M.ironHi);
    claspL.rotation.set(Math.PI / 2, 0, 0);
    claspL.position.set(-0.28, 2.34, 0.22); root.add(claspL);
    const claspR = claspL.clone(); claspR.position.x = 0.28; root.add(claspR);

    M.emberDeep.userData.baseIntensity = 5.5;
    this.eyeMaterial = M.emberDeep;
  }

  _buildChestChains(root) {
    // Two chains: one upper (across upper chest) and one lower (across belly)
    // Each chain is a series of small torus links forming an arc with sag
    const chainArc = (yStart, yEnd, sag, offsetZ, links) => {
      const chainGroup = new THREE.Group();
      for (let i = 0; i < links; i++) {
        const t = i / (links - 1);
        const x = -0.42 + t * 0.84;
        // Parabolic sag in the middle
        const sagOffset = -Math.sin(t * Math.PI) * sag;
        const y = lerp(yStart, yEnd, t) + sagOffset;
        // Alternate link orientation (vertical / horizontal) for realistic chain look
        const link = mesh(new THREE.TorusGeometry(0.025, 0.008, 6, 12), M.ironHi);
        link.position.set(x, y, offsetZ + Math.abs(x) * 0.04);
        if (i % 2 === 0) {
          link.rotation.set(0, 0, 0); // vertical link
        } else {
          link.rotation.set(0, Math.PI / 2, Math.PI / 2); // horizontal link
        }
        chainGroup.add(link);
      }
      return chainGroup;
    };
    // Upper chain — pauldron to pauldron across chest, heavy sag
    root.add(chainArc(2.18, 2.18, 0.2, 0.32, 22));
    // Lower chain — looser, lower
    root.add(chainArc(2.0, 2.0, 0.3, 0.34, 20));
    // Padlock hanging at center of upper chain
    const lockBody = mesh(new THREE.BoxGeometry(0.06, 0.07, 0.025), M.iron);
    lockBody.position.set(0, 1.97, 0.36); root.add(lockBody);
    const lockShackle = mesh(new THREE.TorusGeometry(0.022, 0.006, 6, 12, Math.PI), M.ironHi);
    lockShackle.rotation.set(Math.PI / 2, 0, 0);
    lockShackle.position.set(0, 2.02, 0.36); root.add(lockShackle);
    // Tiny ember keyhole glow
    const keyhole = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.emberDeep);
    keyhole.position.set(0, 1.97, 0.375); root.add(keyhole);
  }

  _buildSpikedBulwark() {
    const shield = new THREE.Group();
    // Heavy round disc — slightly bigger than crusader's
    const disc = mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.085, 32), M.iron);
    disc.rotation.x = Math.PI / 2; shield.add(disc);
    // Asymmetric rim chip — break the rim on one edge for battle-worn look
    // (we use a darkIron sphere to suggest a chunk taken out)
    shield.add(mesh(new THREE.TorusGeometry(0.52, 0.04, 12, 48), M.darkIron));
    // "Chip" — protruding bump replacing a piece of the rim
    const chip = mesh(new THREE.SphereGeometry(0.06, 10, 8), M.darkIron);
    chip.position.set(-0.5, 0.3, 0); chip.scale.set(0.6, 0.4, 0.4); shield.add(chip);

    // Inner ring detail
    const innerRim = mesh(new THREE.TorusGeometry(0.4, 0.016, 10, 48), M.ironHi);
    innerRim.position.z = 0.045; shield.add(innerRim);

    // Rust patches across the surface
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.42;
      const patch = mesh(new THREE.SphereGeometry(0.05 + Math.random() * 0.04, 8, 6), M.rust);
      patch.position.set(Math.cos(a) * r, Math.sin(a) * r, 0.045);
      patch.scale.set(1.2 + Math.random(), 1.2 + Math.random(), 0.15);
      shield.add(patch);
    }

    // CENTER STAKE — massive iron spike protruding forward
    const stakeBase = mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.06, 16), M.iron);
    stakeBase.rotation.x = Math.PI / 2; stakeBase.position.z = 0.075; shield.add(stakeBase);
    const stake = mesh(new THREE.ConeGeometry(0.07, 0.32, 8), M.ironHi);
    stake.rotation.x = Math.PI / 2; stake.position.z = 0.24; shield.add(stake);
    // Glowing ember at the base of the stake (where it 'meets' the shield)
    const stakeGlow = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.emberDeep);
    stakeGlow.position.z = 0.105; shield.add(stakeGlow);

    // 4 LARGE radial spikes at cardinal points
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;  // rotated 45° so they don't conflict with rim chip
      const spike = mesh(new THREE.ConeGeometry(0.038, 0.18, 8), M.ironHi);
      spike.position.set(Math.cos(a) * 0.42, Math.sin(a) * 0.42, 0.06);
      spike.rotation.set(Math.PI / 2, 0, a + Math.PI / 2);
      shield.add(spike);
      // Base stud where it attaches
      const baseStud = mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.025, 12), M.iron);
      baseStud.rotation.x = Math.PI / 2;
      baseStud.position.set(Math.cos(a) * 0.42, Math.sin(a) * 0.42, 0.045);
      shield.add(baseStud);
    }

    // Smaller rim spikes (between the big ones)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
      const spike = mesh(new THREE.ConeGeometry(0.018, 0.07, 6), M.ironHi);
      spike.position.set(Math.cos(a) * 0.49, Math.sin(a) * 0.49, 0.04);
      spike.rotation.set(Math.PI / 2, 0, a + Math.PI / 2);
      shield.add(spike);
    }

    // Rivet studs around the inner ring
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const stud = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.ironHi);
      stud.position.set(Math.cos(a) * 0.28, Math.sin(a) * 0.28, 0.05);
      shield.add(stud);
    }

    return shield;
  }

  _buildWarmaul() {
    const maul = new THREE.Group();
    // Pommel — heavy spiked ball
    const pommel = mesh(new THREE.SphereGeometry(0.06, 14, 12), M.darkIron);
    maul.add(pommel);
    // Pommel spikes (4 small cardinal spikes)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const sp = mesh(new THREE.ConeGeometry(0.018, 0.04, 6), M.ironHi);
      sp.position.set(Math.cos(a) * 0.06, 0, Math.sin(a) * 0.06);
      sp.rotation.z = -a + Math.PI / 2;
      maul.add(sp);
    }
    // Pommel ember gem
    const pommelGem = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.emberDeep);
    pommelGem.position.set(0, 0, 0.062); pommelGem.scale.set(1, 1, 0.5); maul.add(pommelGem);

    // Wooden + iron-bound haft — shorter than crusader's hammer to feel chunkier
    const haft = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.7, 12), M.darkIron);
    haft.position.y = 0.4; maul.add(haft);
    // Iron binding rings along haft (frequent — chunky feel)
    for (let i = 0; i < 5; i++) {
      const ring = mesh(new THREE.TorusGeometry(0.044, 0.008, 6, 12), M.ironHi);
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.12 + i * 0.13; maul.add(ring);
    }
    // Leather grip wrap (lower portion)
    const grip = mesh(new THREE.CylinderGeometry(0.046, 0.046, 0.22, 12), M.leather);
    grip.position.y = 0.18; maul.add(grip);

    // Cross-guard / collar where head meets haft
    const collar = mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.08, 12), M.iron);
    collar.position.y = 0.78; maul.add(collar);
    const collarRing = mesh(new THREE.TorusGeometry(0.072, 0.012, 6, 16), M.ironHi);
    collarRing.rotation.x = Math.PI / 2; collarRing.position.y = 0.78; maul.add(collarRing);

    // BRUTAL HAMMER HEAD — large square block with spikes
    const headBody = mesh(new THREE.BoxGeometry(0.32, 0.38, 0.36), M.iron);
    headBody.position.y = 1.0; maul.add(headBody);
    // Striking face (front) — flatter, ironHi
    const strikeFace = mesh(new THREE.BoxGeometry(0.34, 0.36, 0.04), M.ironHi);
    strikeFace.position.set(0, 1.0, 0.18); maul.add(strikeFace);
    // Back face
    const backFace = mesh(new THREE.BoxGeometry(0.34, 0.36, 0.04), M.ironHi);
    backFace.position.set(0, 1.0, -0.18); maul.add(backFace);
    // Ember-rune on the striking face (deep red glow line)
    const strikeRune = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.005), M.bloodRune);
    strikeRune.position.set(0, 1.0, 0.205); maul.add(strikeRune);
    const strikeRuneCross = mesh(new THREE.BoxGeometry(0.025, 0.22, 0.005), M.bloodRune);
    strikeRuneCross.position.set(0, 1.0, 0.205); maul.add(strikeRuneCross);

    // Top spikes (4 large)
    for (let i = 0; i < 4; i++) {
      const x = (i % 2 === 0) ? -0.1 : 0.1;
      const z = (i < 2) ? -0.1 : 0.1;
      const spike = mesh(new THREE.ConeGeometry(0.04, 0.16, 6), M.ironHi);
      spike.position.set(x, 1.27, z);
      maul.add(spike);
    }
    // Side spikes (1 on each side, big and outward)
    for (let side = -1; side <= 1; side += 2) {
      const sideSpike = mesh(new THREE.ConeGeometry(0.05, 0.14, 8), M.ironHi);
      sideSpike.position.set(side * 0.22, 1.0, 0);
      sideSpike.rotation.z = -side * Math.PI / 2;
      maul.add(sideSpike);
    }
    // Bottom face — ironHi (where it joins the haft)
    const bottomFace = mesh(new THREE.BoxGeometry(0.34, 0.04, 0.38), M.ironHi);
    bottomFace.position.set(0, 0.82, 0); maul.add(bottomFace);

    // Rust streaks on the head sides
    for (let side = -1; side <= 1; side += 2) {
      const streak = mesh(new THREE.SphereGeometry(0.05, 8, 6), M.rust);
      streak.position.set(side * 0.165, 0.94, 0); streak.scale.set(0.2, 1.2, 1.5);
      maul.add(streak);
    }

    // Top spike (center) — biggest, like a war-pick point
    const topSpike = mesh(new THREE.ConeGeometry(0.05, 0.22, 8), M.ironHi);
    topSpike.position.y = 1.32; maul.add(topSpike);

    return maul;
  }

  _buildBruteHelm() {
    const helm = new THREE.Group();
    // Skull — slightly larger than other tanks
    const skull = mesh(new THREE.SphereGeometry(0.24, 20, 16), M.iron);
    skull.scale.set(1, 1.0, 1.1); helm.add(skull);

    // Top crown ridge
    const topRidge = mesh(new THREE.BoxGeometry(0.06, 0.1, 0.42), M.ironHi);
    topRidge.position.set(0, 0.18, 0); helm.add(topRidge);
    // Three ridge spikes
    for (let i = 0; i < 3; i++) {
      const sp = mesh(new THREE.ConeGeometry(0.025, 0.08, 6), M.ironHi);
      sp.position.set(0, 0.25, -0.16 + i * 0.16);
      helm.add(sp);
    }

    // BULL HORNS — curving forward and outward
    const buildHorn = (sx) => {
      const horn = new THREE.Group();
      // Base mount
      const baseMount = mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.06, 10), M.darkIron);
      baseMount.position.set(sx * 0.18, 0.08, 0);
      baseMount.rotation.z = sx * Math.PI / 2;
      horn.add(baseMount);
      // Horn segments — curve outward then forward
      const seg1 = mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.18, 10), M.bone);
      seg1.position.set(sx * 0.27, 0.06, 0.03);
      seg1.rotation.z = sx * (Math.PI / 2 + 0.3);
      seg1.rotation.x = -0.2;
      horn.add(seg1);
      const seg2 = mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.18, 10), M.bone);
      seg2.position.set(sx * 0.33, 0.0, 0.14);
      seg2.rotation.z = sx * (Math.PI / 2 + 0.6);
      seg2.rotation.x = -0.5;
      horn.add(seg2);
      const seg3 = mesh(new THREE.CylinderGeometry(0.018, 0.03, 0.16, 10), M.boneHi);
      seg3.position.set(sx * 0.32, -0.04, 0.27);
      seg3.rotation.z = sx * (Math.PI / 2 + 0.5);
      seg3.rotation.x = -0.85;
      horn.add(seg3);
      // Sharp tip
      const tip = mesh(new THREE.ConeGeometry(0.018, 0.07, 6), M.boneHi);
      tip.position.set(sx * 0.3, -0.07, 0.34);
      tip.rotation.x = -1.0;
      horn.add(tip);
      // Iron rings around the base of the horn
      for (let i = 0; i < 2; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.046 - i * 0.005, 0.005, 6, 12), M.ironHi);
        ring.position.set(sx * (0.23 + i * 0.04), 0.07 - i * 0.005, 0.005 + i * 0.015);
        ring.rotation.z = sx * Math.PI / 2;
        ring.rotation.x = -0.1 - i * 0.1;
        horn.add(ring);
      }
      return horn;
    };
    helm.add(buildHorn(-1));
    helm.add(buildHorn(1));

    // FACE PLATE — closed visor, no eye holes (just a thin slit)
    const facePlate = mesh(new THREE.BoxGeometry(0.4, 0.3, 0.04), M.iron);
    facePlate.position.set(0, -0.05, 0.18);
    helm.add(facePlate);
    // Vertical center bar (heavy nose-protector)
    const centerBar = mesh(new THREE.BoxGeometry(0.05, 0.32, 0.06), M.ironHi);
    centerBar.position.set(0, -0.04, 0.2); helm.add(centerBar);
    // Thin horizontal slit at eye level
    const slit = mesh(new THREE.BoxGeometry(0.36, 0.025, 0.04), M.stoneDark);
    slit.position.set(0, 0.04, 0.21); helm.add(slit);
    // Two glowing red ember dots inside the slit (the eyes)
    const eyeL = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.emberDeep);
    eyeL.position.set(-0.09, 0.04, 0.225); eyeL.scale.set(1, 0.7, 0.5); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.09; helm.add(eyeR);

    // Heavy brow ridge above the slit
    const brow = mesh(new THREE.BoxGeometry(0.42, 0.04, 0.05), M.darkIron);
    brow.position.set(0, 0.085, 0.21); helm.add(brow);

    // Forehead emblem — small ember
    const foreheadEmber = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.emberDeep);
    foreheadEmber.position.set(0, 0.14, 0.22); foreheadEmber.scale.set(1.4, 0.7, 0.5);
    helm.add(foreheadEmber);

    // Battle scars on the helm (a couple diagonal slashes)
    const scar1 = mesh(new THREE.BoxGeometry(0.012, 0.16, 0.006), M.darkIron);
    scar1.position.set(-0.13, 0.05, 0.22); scar1.rotation.z = -0.6;
    helm.add(scar1);
    const scar2 = mesh(new THREE.BoxGeometry(0.012, 0.1, 0.006), M.darkIron);
    scar2.position.set(0.16, -0.06, 0.21); scar2.rotation.z = 0.4;
    helm.add(scar2);

    // Studs along the rim of the face plate (rivets)
    for (const [x, y] of [[-0.18, 0.12], [0.18, 0.12], [-0.18, -0.18], [0.18, -0.18], [-0.13, -0.2], [0.13, -0.2]]) {
      const stud = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.ironHi);
      stud.position.set(x, y, 0.205); helm.add(stud);
    }

    // Bottom rim
    const helmRim = mesh(new THREE.TorusGeometry(0.23, 0.02, 10, 24), M.ironHi);
    helmRim.rotation.x = Math.PI / 2; helmRim.position.y = -0.22; helm.add(helmRim);
    // Tooth-like spikes on the bottom rim (small)
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * 0.35 + (i / 5) * Math.PI * 0.7;
      const tooth = mesh(new THREE.ConeGeometry(0.014, 0.04, 6), M.ironHi);
      tooth.position.set(Math.cos(a + Math.PI / 2) * 0.22, -0.24, Math.sin(a + Math.PI / 2) * 0.22);
      tooth.rotation.x = Math.PI;
      helm.add(tooth);
    }

    return helm;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SHIELDMAGE — Tank VI/VI                                                 ║
// ║  Arcane · Bulwark · Deep violet plate, silver engravings, purple crystal║
// ║  Floating runes orbit shield and chest, mitre helm with twin spires,    ║
// ║  crystal-headed spell-mace, robe skirt instead of tassets               ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Shieldmage extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.shieldRuneAnchor = null;   // set during build, rotated in update()
    this.bodyRuneAnchor = null;
    this.build();
    this.captureRestPose();
    this.animations = shieldmageAnimations;
  }

  // Override update to spin the orbital rune anchors
  update(time, dt) {
    super.update(time, dt);
    if (this.shieldRuneAnchor) this.shieldRuneAnchor.rotation.y = time * 0.5;
    if (this.bodyRuneAnchor)  this.bodyRuneAnchor.rotation.y  = -time * 0.35;
  }

  build() {
    const root = this.group;
    const palette = { dark: M.violetDark, mid: M.violet, accent: M.silverHi, trim: M.silver, leather: M.leather };
    root.add(buildLeg(-1, palette));
    root.add(buildLeg(1, palette));

    // Pelvis (will be largely covered by robe skirt — kept simple)
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.violetDark));
    // Silver buckle with crystal
    const buckleBack = mesh(new THREE.BoxGeometry(0.28, 0.18, 0.05), M.silver);
    buckleBack.position.set(0, 0, 0.28); pelvis.add(buckleBack);
    const buckleFace = mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 16), M.silverHi);
    buckleFace.rotation.x = Math.PI / 2; buckleFace.position.set(0, 0, 0.32); pelvis.add(buckleFace);
    // Six-pointed star within buckle
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const ray = mesh(new THREE.BoxGeometry(0.06, 0.014, 0.012), M.silverHi);
      ray.position.set(Math.cos(a) * 0.04, Math.sin(a) * 0.04, 0.34);
      ray.rotation.z = a;
      pelvis.add(ray);
    }
    const buckleGem = mesh(new THREE.SphereGeometry(0.03, 14, 12), M.crystalHi);
    buckleGem.position.set(0, 0, 0.36); buckleGem.scale.set(1, 1, 0.7); pelvis.add(buckleGem);
    root.add(pelvis);

    // ROBE SKIRT — six cloth panels hanging from the waist instead of tassets
    const robeRoot = new THREE.Group();
    robeRoot.position.y = 1.18;
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      // Skip the back gap region (no panel directly between the legs at the back) so legs can move
      // Actually keep them — robe should fully circle
      const w = 0.16, h = 0.55;
      // Slightly fan-shaped panel
      const shape = new THREE.Shape();
      shape.moveTo(-w * 0.7, 0);
      shape.lineTo(w * 0.7, 0);
      shape.lineTo(w * 1.1, -h);
      shape.lineTo(-w * 1.1, -h);
      shape.closePath();
      const panel = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.012, bevelEnabled: false }), M.violetCloth);
      const r = 0.27;
      panel.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
      panel.lookAt(Math.cos(angle) * 2, 0, Math.sin(angle) * 2);
      panel.rotateY(Math.PI / 2);
      panel.rotateX(0.18);
      robeRoot.add(panel);
      // Silver runic edge along bottom of each panel
      const edgeRune = mesh(new THREE.BoxGeometry(0.22, 0.014, 0.005), M.arcaneRune);
      edgeRune.position.set(Math.cos(angle) * 0.34, -0.5, Math.sin(angle) * 0.34);
      edgeRune.lookAt(Math.cos(angle) * 2, -0.5, Math.sin(angle) * 2);
      edgeRune.rotateY(Math.PI / 2);
      robeRoot.add(edgeRune);
    }
    root.add(robeRoot);

    // Torso — silver-trimmed violet breastplate with engraved sigil + orbital chest runes
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const chest = mesh(new THREE.CylinderGeometry(0.36, 0.32, 0.7, 16), M.violet);
    chest.scale.set(1.05, 1, 0.85); torso.add(chest);
    // Silver center ridge with engravings
    const ridge = mesh(new THREE.BoxGeometry(0.04, 0.6, 0.06), M.silverHi);
    ridge.position.set(0, 0.05, 0.32); torso.add(ridge);
    // Engraving lines along ridge (small horizontal silver bars)
    for (let i = 0; i < 5; i++) {
      const eng = mesh(new THREE.BoxGeometry(0.02, 0.005, 0.005), M.arcaneRune);
      eng.position.set(0, -0.2 + i * 0.1, 0.355);
      torso.add(eng);
    }
    // Pectoral plates with silver trim
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.violet);
    pecL.position.set(-0.16, 0.18, 0.22); pecL.scale.set(1, 0.7, 0.6); torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16; torso.add(pecR);
    // Silver shoulder ridge engravings
    const shoulderRidgeL = mesh(new THREE.BoxGeometry(0.04, 0.16, 0.04), M.silverHi);
    shoulderRidgeL.position.set(-0.22, 0.3, 0.27); shoulderRidgeL.rotation.z = -0.4; torso.add(shoulderRidgeL);
    const shoulderRidgeR = shoulderRidgeL.clone(); shoulderRidgeR.position.x = 0.22; shoulderRidgeR.rotation.z = 0.4; torso.add(shoulderRidgeR);

    // EIGHT-POINTED STAR-IN-CIRCLE SIGIL — chest emblem
    // Outer rune ring
    const sigilOuter = mesh(new THREE.TorusGeometry(0.105, 0.008, 8, 32), M.silverHi);
    sigilOuter.position.set(0, 0.04, 0.36); torso.add(sigilOuter);
    // Inner ring
    const sigilInner = mesh(new THREE.TorusGeometry(0.075, 0.005, 6, 24), M.arcaneRune);
    sigilInner.position.set(0, 0.04, 0.367); torso.add(sigilInner);
    // Sigil background (dark inset)
    const sigilBg = mesh(new THREE.CircleGeometry(0.1, 24), M.violetDark);
    sigilBg.position.set(0, 0.04, 0.358); torso.add(sigilBg);
    // Eight-pointed star — 4 long rays + 4 short rays
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const len = (i % 2 === 0) ? 0.085 : 0.06;
      const w = (i % 2 === 0) ? 0.018 : 0.012;
      const ray = mesh(new THREE.BoxGeometry(w, len, 0.01), M.silverHi);
      ray.position.set(Math.cos(a + Math.PI / 2) * len * 0.5, 0.04 + Math.sin(a + Math.PI / 2) * len * 0.5, 0.37);
      ray.rotation.z = a;
      torso.add(ray);
    }
    // Center crystal
    const sigilGem = mesh(new THREE.SphereGeometry(0.025, 14, 12), M.crystalHi);
    sigilGem.position.set(0, 0.04, 0.39); sigilGem.scale.set(1, 1, 0.7); torso.add(sigilGem);

    // ORBITAL CHEST RUNES — 4 small glowing rune marks orbit around the sigil
    this.bodyRuneAnchor = new THREE.Group();
    this.bodyRuneAnchor.position.set(0, 0.04, 0.36);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const r = 0.16;
      const rune = mesh(new THREE.BoxGeometry(0.04, 0.012, 0.006), M.arcaneRune);
      rune.position.set(Math.cos(a) * r, Math.sin(a) * r, 0.025);
      rune.rotation.z = a;
      this.bodyRuneAnchor.add(rune);
    }
    // Use Z-orbit instead of Y for the chest runes (orbit on the chest plane)
    this.bodyRuneAnchor.rotation.x = 0;
    torso.add(this.bodyRuneAnchor);

    // Geometric arcane-rune lines down each side (sharp/angular but ornate)
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const yOff = -0.2 + t * 0.4;
      const runeL = mesh(new THREE.BoxGeometry(0.06, 0.012, 0.005), M.arcaneRune);
      runeL.position.set(-0.32, yOff, 0.18);
      runeL.rotation.z = (i % 2 === 0) ? 0.2 : -0.2;
      torso.add(runeL);
      const runeR = runeL.clone();
      runeR.position.x = 0.32;
      runeR.rotation.z = -runeL.rotation.z;
      torso.add(runeR);
      // Tiny crystal accent at midpoint
      if (i === 1) {
        const crystL = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.crystalHi);
        crystL.position.set(-0.32, yOff, 0.19); crystL.scale.set(0.7, 1.4, 0.5); torso.add(crystL);
        const crystR = crystL.clone(); crystR.position.x = 0.32; torso.add(crystR);
      }
    }

    // Ornate gorget
    const gorget = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.13, 16), M.silverHi);
    gorget.position.y = 0.42; torso.add(gorget);
    const gorgetTrim = mesh(new THREE.TorusGeometry(0.19, 0.012, 8, 24), M.silver);
    gorgetTrim.rotation.x = Math.PI / 2; gorgetTrim.position.y = 0.485; torso.add(gorgetTrim);
    // Crystal at front of gorget
    const gorgetCrystal = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.crystalHi);
    gorgetCrystal.position.set(0, 0.45, 0.18); gorgetCrystal.scale.set(1, 1.3, 0.5); torso.add(gorgetCrystal);
    // Ornate engraved patterns on gorget
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i / 5) * Math.PI;
      const dot = mesh(new THREE.SphereGeometry(0.012, 6, 4), M.arcaneRune);
      dot.position.set(Math.cos(a + Math.PI / 2) * 0.2, 0.43, Math.sin(a + Math.PI / 2) * 0.2);
      torso.add(dot);
    }

    root.add(torso);
    this.parts.body = torso;

    // Ornate silver pauldrons with crystal accents
    const buildOrnatePauldron = (sx) => {
      const p = new THREE.Group();
      // Main shoulder cap — silver
      const cap = mesh(new THREE.SphereGeometry(0.23, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.7), M.silverHi);
      cap.scale.set(1.15, 1, 1.15); p.add(cap);
      // Decorative trim ring
      const trim = mesh(new THREE.TorusGeometry(0.23, 0.022, 8, 24), M.silver);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      // Inner violet detail
      const inner = mesh(new THREE.SphereGeometry(0.17, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.violet);
      inner.scale.set(1, 0.85, 1); inner.position.y = -0.05; p.add(inner);
      // Top crystal cluster (3 crystals of varying heights)
      for (let i = 0; i < 3; i++) {
        const offset = (i - 1) * 0.06;
        const ch = 0.1 - Math.abs(i - 1) * 0.04;
        const crystShape = new THREE.ConeGeometry(0.028 - Math.abs(i - 1) * 0.005, ch, 6);
        const cryst = mesh(crystShape, M.crystalHi);
        cryst.position.set(sx * 0.04 + offset * 0.5, 0.16, -0.04);
        cryst.rotation.y = sx > 0 ? -0.1 : 0.1;
        p.add(cryst);
      }
      // Side rune disc
      const discBase = mesh(new THREE.CircleGeometry(0.06, 16), M.silver);
      discBase.position.set(sx * 0.2, 0.04, 0.1);
      discBase.rotation.y = sx > 0 ? -0.6 : 0.6;
      p.add(discBase);
      // Inscribed star on disc
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI / 2;
        const ray = mesh(new THREE.BoxGeometry(0.05, 0.005, 0.003), M.arcaneRune);
        ray.position.set(sx * 0.205, 0.04, 0.105);
        ray.rotation.y = sx > 0 ? -0.6 : 0.6;
        ray.rotation.z = a;
        p.add(ray);
      }
      // Engraved silver edge details (rune-marks along the cap edge)
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI * 0.4 + (i / 3) * Math.PI * 0.8;
        const eng = mesh(new THREE.BoxGeometry(0.018, 0.005, 0.005), M.arcaneRune);
        eng.position.set(Math.cos(a + Math.PI / 2) * 0.21 * sx, 0.0, Math.sin(a + Math.PI / 2) * 0.21);
        eng.rotation.y = a + Math.PI / 2;
        p.add(eng);
      }
      p.position.set(sx * 0.44, 2.22, 0);
      return p;
    };
    root.add(buildOrnatePauldron(-1));
    root.add(buildOrnatePauldron(1));

    // Arms (silver-themed)
    const armPalette = { mid: M.violet, dark: M.violetDark, hi: M.silverHi, accent: M.silverHi, cloth: M.violetCloth };
    const leftArm = buildArm(-1, 0.22, armPalette);
    leftArm.rotation.x = -0.08;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.0, armPalette);
    rightArm.rotation.x = -0.42;
    rightArm.rotation.z = 0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Runed shield with floating orbital runes
    const shield = this._buildRunedShield();
    leftArm.userData.hand.add(shield);
    shield.position.set(-0.05, -0.1, 0.05);
    shield.rotation.set(0.2, 0.4, -0.2);
    shield.scale.setScalar(0.95);
    this.parts.shield = shield;

    // Crystal-headed spell-mace
    const mace = this._buildSpellMace();
    rightArm.userData.hand.add(mace);
    mace.position.set(0, 0.05, 0.08);
    mace.rotation.set(Math.PI * 0.55, 0, 0.05);
    this.parts.weapon = mace;

    // Neck + helm
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.violetDark);
    neck.position.y = 2.32; root.add(neck);
    const helm = this._buildMitreHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    // Cape — deep violet with brighter trim, slightly longer
    const cape = buildCape({ material: M.violetCape, height: 1.95 });
    cape.position.set(0, 2.36, 0); root.add(cape);
    this.cape = cape;
    const capeTrim = buildCape({ material: M.violetCapeTrim, width: 1.34, height: 1.98 });
    capeTrim.position.set(0, 2.36, -0.005); root.add(capeTrim);

    // Silver rune embroidery (static rune-stripes near top of cape — area animates least)
    for (let i = 0; i < 3; i++) {
      const a = (i - 1) * 0.18;
      const stripe = mesh(new THREE.BoxGeometry(0.04, 0.08, 0.005), M.arcaneRune);
      stripe.position.set(a, 2.18, 0.0);
      stripe.rotation.x = -0.15;
      root.add(stripe);
    }

    // Cape clasps — crystal in silver settings
    const claspL = mesh(new THREE.SphereGeometry(0.045, 12, 10), M.silverHi);
    claspL.position.set(-0.28, 2.34, 0.22); claspL.scale.set(1, 1, 0.6); root.add(claspL);
    const claspGemL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.crystalHi);
    claspGemL.position.set(-0.28, 2.34, 0.27); claspGemL.scale.set(1, 1, 0.5); root.add(claspGemL);
    const claspR = claspL.clone(); claspR.position.x = 0.28; root.add(claspR);
    const claspGemR = claspGemL.clone(); claspGemR.position.x = 0.28; root.add(claspGemR);
    // Chain of small silver beads
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      const link = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.silverHi);
      link.position.set(-0.24 + t * 0.48, 2.32 - Math.sin(t * Math.PI) * 0.04, 0.245);
      root.add(link);
    }

    M.arcaneEye.userData.baseIntensity = 4.5;
    this.eyeMaterial = M.arcaneEye;
  }

  _buildRunedShield() {
    const shield = new THREE.Group();
    // Base disc — silver with violet underlayer
    const disc = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.07, 32), M.silverHi);
    disc.rotation.x = Math.PI / 2; shield.add(disc);
    // Inner violet inset
    const inset = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 32), M.violet);
    inset.rotation.x = Math.PI / 2; inset.position.z = 0.04; shield.add(inset);

    // Outer rim
    shield.add(mesh(new THREE.TorusGeometry(0.5, 0.04, 12, 48), M.silver));
    // Inner rune ring (engraved)
    const innerRing = mesh(new THREE.TorusGeometry(0.36, 0.02, 10, 48), M.arcaneRune);
    innerRing.position.z = 0.06; shield.add(innerRing);
    // Mid silver ring
    const midRing = mesh(new THREE.TorusGeometry(0.28, 0.012, 8, 48), M.silverHi);
    midRing.position.z = 0.06; shield.add(midRing);

    // Center boss — crystal
    const bossPlate = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.025, 24), M.silver);
    bossPlate.rotation.x = Math.PI / 2; bossPlate.position.z = 0.075; shield.add(bossPlate);
    // Faceted crystal centerpiece (octahedron-like via two cones)
    const crystalTop = mesh(new THREE.ConeGeometry(0.09, 0.13, 8), M.crystalHi);
    crystalTop.position.z = 0.16; crystalTop.rotation.x = Math.PI / 2; shield.add(crystalTop);
    const crystalBottom = mesh(new THREE.ConeGeometry(0.09, 0.05, 8), M.crystal);
    crystalBottom.position.z = 0.075; crystalBottom.rotation.x = -Math.PI / 2; shield.add(crystalBottom);

    // Eight-pointed star pattern across the shield (radial silver lines)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const len = (i % 2 === 0) ? 0.34 : 0.24;
      const w = (i % 2 === 0) ? 0.018 : 0.012;
      const ray = mesh(new THREE.BoxGeometry(w, len, 0.008), M.silverHi);
      // Position halfway along the ray's length from center
      ray.position.set(Math.cos(a + Math.PI / 2) * len * 0.5 + Math.sin(a) * 0, 0 + Math.sin(a + Math.PI / 2) * len * 0.5, 0.07);
      ray.rotation.z = a;
      shield.add(ray);
    }

    // Cardinal-point crystals (4 small crystals at compass points along inner rune ring)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const cryst = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.crystalHi);
      cryst.position.set(Math.cos(a) * 0.36, Math.sin(a) * 0.36, 0.085);
      cryst.rotation.x = -Math.PI / 2;
      shield.add(cryst);
    }

    // Rune glyphs at ordinal points (between the cardinal crystals)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const glyph = mesh(new THREE.BoxGeometry(0.045, 0.014, 0.006), M.arcaneRune);
      glyph.position.set(Math.cos(a) * 0.36, Math.sin(a) * 0.36, 0.075);
      glyph.rotation.z = a;
      shield.add(glyph);
      // Cross-bar making it a rune-mark (T-shape)
      const cross = mesh(new THREE.BoxGeometry(0.014, 0.025, 0.006), M.arcaneRune);
      cross.position.set(Math.cos(a) * 0.36, Math.sin(a) * 0.36, 0.075);
      cross.rotation.z = a;
      shield.add(cross);
    }

    // Studs around the rim
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const stud = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.silverHi);
      stud.position.set(Math.cos(a) * 0.46, Math.sin(a) * 0.46, 0.05);
      shield.add(stud);
    }

    // FLOATING ORBITAL RUNES — 6 glowing glyphs orbit the shield in a horizontal ring
    this.shieldRuneAnchor = new THREE.Group();
    this.shieldRuneAnchor.position.z = 0.1; // sits in front of the shield's face
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const r = 0.7;
      // Two-bar rune (rectangular floating glyph)
      const runeGroup = new THREE.Group();
      const bar1 = mesh(new THREE.BoxGeometry(0.07, 0.022, 0.012), M.arcaneRune);
      runeGroup.add(bar1);
      const bar2 = mesh(new THREE.BoxGeometry(0.022, 0.05, 0.012), M.arcaneRune);
      bar2.position.set(0.02, 0, 0); runeGroup.add(bar2);
      // Tiny crystal core
      const core = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.crystalHi);
      runeGroup.add(core);
      runeGroup.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      runeGroup.rotation.y = a + Math.PI / 2;
      this.shieldRuneAnchor.add(runeGroup);
    }
    shield.add(this.shieldRuneAnchor);

    return shield;
  }

  _buildSpellMace() {
    const mace = new THREE.Group();
    // Pommel — silver with crystal core
    const pommel = mesh(new THREE.SphereGeometry(0.055, 14, 12), M.silverHi);
    mace.add(pommel);
    const pommelGem = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.crystalHi);
    pommelGem.position.set(0, 0, 0.054); mace.add(pommelGem);

    // Grip — leather with silver wire wrap
    const grip = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 12), M.leather);
    grip.position.y = 0.115; mace.add(grip);
    for (let i = 0; i < 8; i++) {
      const wire = mesh(new THREE.TorusGeometry(0.032, 0.003, 6, 12), M.silverHi);
      wire.rotation.x = Math.PI / 2;
      wire.position.y = 0.03 + i * 0.025;
      mace.add(wire);
    }

    // Cross-guard — ornate silver with crystal accents
    const guardBase = mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.06, 12), M.silverHi);
    guardBase.position.y = 0.24; mace.add(guardBase);
    const guardArms = mesh(new THREE.BoxGeometry(0.36, 0.04, 0.06), M.silverHi);
    guardArms.position.y = 0.245; mace.add(guardArms);
    // Crystal endcaps on guard arms
    for (let side = -1; side <= 1; side += 2) {
      const endCap = mesh(new THREE.SphereGeometry(0.03, 10, 8), M.silverHi);
      endCap.position.set(side * 0.18, 0.245, 0); mace.add(endCap);
      const endGem = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.crystalHi);
      endGem.position.set(side * 0.22, 0.245, 0);
      endGem.rotation.z = -side * Math.PI / 2;
      mace.add(endGem);
    }

    // Mid-haft (between guard and head)
    const midHaft = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.18, 12), M.violetDark);
    midHaft.position.y = 0.36; mace.add(midHaft);
    // Rune ring midway
    const midRune = mesh(new THREE.TorusGeometry(0.034, 0.006, 6, 16), M.arcaneRune);
    midRune.rotation.x = Math.PI / 2; midRune.position.y = 0.36; mace.add(midRune);

    // HEAD — central crystal wrapped in silver cage
    // Lower silver collar
    const headBase = mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.04, 12), M.silverHi);
    headBase.position.y = 0.47; mace.add(headBase);
    // Silver "cage" frame around the crystal — 4 bars going from base up to point
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const bar = mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.32, 6), M.silverHi);
      bar.position.set(Math.cos(a) * 0.04, 0.62, Math.sin(a) * 0.04);
      bar.rotation.z = -Math.cos(a) * 0.1;
      bar.rotation.x = -Math.sin(a) * 0.1;
      mace.add(bar);
    }
    // Faceted crystal head (top-pointed, mostly enclosed by cage)
    const crystalHead = mesh(new THREE.ConeGeometry(0.07, 0.28, 6), M.crystalHi);
    crystalHead.position.y = 0.62; mace.add(crystalHead);
    // Crystal inner glow (smaller, brighter)
    const crystalCore = mesh(new THREE.ConeGeometry(0.04, 0.2, 6), M.crystalHi);
    crystalCore.position.y = 0.62; crystalCore.rotation.y = Math.PI / 6; mace.add(crystalCore);
    // Top crystal point cap
    const topPoint = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.crystalHi);
    topPoint.position.y = 0.78; mace.add(topPoint);
    // Side crystal embellishments (4 small points around the head)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const sideCrystal = mesh(new THREE.ConeGeometry(0.016, 0.06, 6), M.crystal);
      sideCrystal.position.set(Math.cos(a) * 0.075, 0.55, Math.sin(a) * 0.075);
      sideCrystal.rotation.x = Math.PI / 2 + Math.sin(a) * 0.4;
      sideCrystal.rotation.z = -Math.cos(a) * 0.4;
      mace.add(sideCrystal);
    }
    // Decorative silver collar at top (where cage closes)
    const topCollar = mesh(new THREE.TorusGeometry(0.03, 0.007, 6, 12), M.silverHi);
    topCollar.rotation.x = Math.PI / 2; topCollar.position.y = 0.74; mace.add(topCollar);

    return mace;
  }

  _buildMitreHelm() {
    const helm = new THREE.Group();
    // Skull (slightly elongated upward)
    const skull = mesh(new THREE.SphereGeometry(0.22, 20, 16), M.violet);
    skull.scale.set(1, 1.1, 1.1); helm.add(skull);

    // MITRE PEAK — tall pointed top, silver
    // Two halves split by a vertical seam (mitre style)
    const mitreShape = new THREE.Shape();
    mitreShape.moveTo(-0.12, 0);
    mitreShape.lineTo(0.12, 0);
    mitreShape.lineTo(0.06, 0.36);
    mitreShape.lineTo(0, 0.42);
    mitreShape.lineTo(-0.06, 0.36);
    mitreShape.closePath();
    const mitre = mesh(new THREE.ExtrudeGeometry(mitreShape, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 3 }), M.silverHi);
    mitre.position.set(0, 0.24, -0.1); mitre.rotation.y = 0;
    helm.add(mitre);
    // Vertical seam down center of mitre (silver line, slightly raised)
    const seam = mesh(new THREE.BoxGeometry(0.025, 0.4, 0.21), M.silver);
    seam.position.set(0, 0.42, 0); helm.add(seam);
    // Crystal at peak tip
    const peakCrystal = mesh(new THREE.ConeGeometry(0.025, 0.08, 6), M.crystalHi);
    peakCrystal.position.set(0, 0.66, 0); helm.add(peakCrystal);

    // TWIN SPIRES curving back from the sides of the mitre
    const buildSpire = (sx) => {
      const spire = new THREE.Group();
      // Three segments curving back/up
      const seg1 = mesh(new THREE.CylinderGeometry(0.022, 0.028, 0.16, 8), M.silverHi);
      seg1.position.set(sx * 0.13, 0.1, -0.05);
      seg1.rotation.z = sx * 0.2;
      spire.add(seg1);
      const seg2 = mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.16, 8), M.silverHi);
      seg2.position.set(sx * 0.18, 0.22, -0.13);
      seg2.rotation.z = sx * 0.4;
      seg2.rotation.x = 0.3;
      spire.add(seg2);
      const seg3 = mesh(new THREE.CylinderGeometry(0.012, 0.018, 0.18, 8), M.silver);
      seg3.position.set(sx * 0.22, 0.32, -0.24);
      seg3.rotation.z = sx * 0.5;
      seg3.rotation.x = 0.6;
      spire.add(seg3);
      // Spire tip — small crystal
      const tipCrystal = mesh(new THREE.ConeGeometry(0.018, 0.05, 6), M.crystalHi);
      tipCrystal.position.set(sx * 0.25, 0.4, -0.36);
      tipCrystal.rotation.z = sx * 0.5;
      tipCrystal.rotation.x = 0.6;
      spire.add(tipCrystal);
      return spire;
    };
    helm.add(buildSpire(-1));
    helm.add(buildSpire(1));

    // Eye visor — single horizontal slit with engraved silver runes above and below
    const visor = mesh(new THREE.BoxGeometry(0.34, 0.06, 0.04), M.stoneDark);
    visor.position.set(0, 0.0, 0.18); helm.add(visor);
    // Glowing arcane purple eyes
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.arcaneEye);
    eyeL.position.set(-0.085, 0.0, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.085; helm.add(eyeR);

    // Silver brow ridge with inscribed runes
    const brow = mesh(new THREE.BoxGeometry(0.42, 0.03, 0.04), M.silverHi);
    brow.position.set(0, 0.07, 0.2); helm.add(brow);
    // Three rune-marks along the brow
    for (let i = -1; i <= 1; i++) {
      const r = mesh(new THREE.BoxGeometry(0.016, 0.012, 0.005), M.arcaneRune);
      r.position.set(i * 0.12, 0.07, 0.225);
      helm.add(r);
    }

    // BIG FOREHEAD CRYSTAL — central focus piece
    const foreheadBase = mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.025, 12), M.silver);
    foreheadBase.rotation.x = Math.PI / 2; foreheadBase.position.set(0, 0.16, 0.205); helm.add(foreheadBase);
    const foreheadCrystal = mesh(new THREE.ConeGeometry(0.04, 0.08, 6), M.crystalHi);
    foreheadCrystal.position.set(0, 0.18, 0.23); foreheadCrystal.rotation.x = Math.PI / 2;
    helm.add(foreheadCrystal);
    // Decorative silver flutes flanking the crystal
    for (let side = -1; side <= 1; side += 2) {
      const flute = mesh(new THREE.BoxGeometry(0.012, 0.07, 0.025), M.silverHi);
      flute.position.set(side * 0.06, 0.16, 0.215);
      helm.add(flute);
    }

    // Cheek/jaw guards with engravings
    const cheek = (sx) => {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0.1, 0);
      shape.lineTo(0.08, -0.16); shape.lineTo(-0.02, -0.18); shape.closePath();
      const g = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 }), M.violet);
      g.position.set(sx * 0.18, -0.1, 0.08);
      g.rotation.y = sx > 0 ? -0.4 : Math.PI + 0.4;
      return g;
    };
    helm.add(cheek(-1)); helm.add(cheek(1));

    // Bottom rim with rune engravings
    const helmRim = mesh(new THREE.TorusGeometry(0.21, 0.018, 10, 24), M.silverHi);
    helmRim.rotation.x = Math.PI / 2; helmRim.position.y = -0.21; helm.add(helmRim);
    // Subtle rune-marks along the rim
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      if (Math.abs(a - Math.PI) < 0.5) continue; // skip rear
      const eng = mesh(new THREE.BoxGeometry(0.014, 0.005, 0.005), M.arcaneRune);
      eng.position.set(Math.cos(a) * 0.21, -0.21, Math.sin(a) * 0.21);
      eng.rotation.y = -a + Math.PI / 2;
      helm.add(eng);
    }

    return helm;
  }
}
