        mgr.spawn(new RuneRing(champ.scene, pos, { color: 0xe0a0ff, maxRadius: 3.6, duration: 1.0, startRadius: 1.5, runeCount: 16, rotateSpeed: -0.7 }), time);
      }},
    ],
  },
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  VIEWER — preview-only setup                                             ║
// ║  Scene, lights, dais, post-processing, class swapping, UI wiring.       ║
// ║  Game runtime: ignore everything below this line.                        ║
// ╚══════════════════════════════════════════════════════════════════════════╝

// ─── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
scene.fog = new THREE.FogExp2(0x05060c, 0.05);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 2.4, 5.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.55;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// ─── Lighting ──────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x202840, 0.35));
scene.add(new THREE.HemisphereLight(0x405070, 0x14101c, 0.35));

const keyLight = new THREE.DirectionalLight(0xffd9a5, 2.5);
keyLight.position.set(4.5, 7, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -1;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.radius = 4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x6090c0, 0.55);
fillLight.position.set(-5, 2, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xe3b878, 1.8);
rimLight.position.set(-2.5, 4.5, -5);
scene.add(rimLight);

const counterRim = new THREE.DirectionalLight(0x4a8fc0, 0.6);
counterRim.position.set(3, 3, -4);
scene.add(counterRim);

// ─── Stage dais ────────────────────────────────────────────────────────────
function buildDais() {
  const dais = new THREE.Group();
  const outer = mesh(new THREE.CylinderGeometry(2.0, 2.1, 0.25, 32), M.stoneDark, { receive: true });
  outer.position.y = -0.125; dais.add(outer);
  const inner = mesh(new THREE.CylinderGeometry(1.8, 1.9, 0.1, 32), M.stone, { receive: true });
  inner.position.y = 0.05; dais.add(inner);
  const ring = mesh(new THREE.TorusGeometry(1.85, 0.03, 12, 64), M.brass);
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.10; dais.add(ring);
  const innerRing = mesh(new THREE.TorusGeometry(1.4, 0.018, 10, 64), M.brassDark);
  innerRing.rotation.x = Math.PI / 2; innerRing.position.y = 0.105; dais.add(innerRing);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const r = mesh(new THREE.BoxGeometry(0.06, 0.005, 0.18), M.stoneRune);
    r.position.set(Math.cos(a) * 1.4, 0.105, Math.sin(a) * 1.4);
    r.rotation.y = -a;
    dais.add(r);
  }
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2;
    const len = 0.4 + Math.random() * 0.6;
    const crack = mesh(new THREE.BoxGeometry(0.012, 0.002, len), M.stoneDark);
    crack.position.set(Math.cos(a) * (0.6 + Math.random() * 0.6), 0.106, Math.sin(a) * (0.6 + Math.random() * 0.6));
    crack.rotation.y = Math.random() * Math.PI;
    dais.add(crack);
  }
  const step = mesh(new THREE.CylinderGeometry(2.3, 2.4, 0.12, 32), M.stoneDark, { receive: true });
  step.position.y = -0.31; dais.add(step);
  return dais;
}
scene.add(buildDais());

// Distant ground
const ground = mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x080812, roughness: 1.0, metalness: 0 }), { receive: true, cast: false });
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.4;
scene.add(ground);

// ─── Atmospheric embers ────────────────────────────────────────────────────
function buildEmbers() {
  const count = 220;
  const positions = new Float32Array(count * 3);
  const velocities = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = 1 + Math.random() * 4;
    const a = Math.random() * Math.PI * 2;
    positions[i * 3 + 0] = Math.cos(a) * r;
    positions[i * 3 + 1] = Math.random() * 5;
    positions[i * 3 + 2] = Math.sin(a) * r;
    velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.05;
    velocities[i * 3 + 1] = 0.05 + Math.random() * 0.15;
    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.05;
    sizes[i] = 0.5 + Math.random() * 1.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(1.0, 0.65, 0.3) } },
    vertexShader: `attribute float size; varying float vSize; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = size * (250.0 / -mv.z); vSize = size; }`,
    fragmentShader: `uniform vec3 uColor; varying float vSize; void main() { vec2 c = gl_PointCoord - 0.5; float d = length(c); if (d > 0.5) discard; float a = (1.0 - d * 2.0); a = pow(a, 2.0) * 0.65; gl_FragColor = vec4(uColor * (1.0 + vSize * 0.3), a); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geo, mat);
  points.userData.velocities = velocities;
  points.userData.count = count;
  return points;
}
const embers = buildEmbers();
scene.add(embers);

// ─── Ground aura ───────────────────────────────────────────────────────────
function buildAura() {
  const geo = new THREE.RingGeometry(0.6, 1.6, 64);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8844) } },
    vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uTime; uniform vec3 uColor; varying vec3 vPos; void main() { float r = length(vPos.xy); float ring = smoothstep(1.5, 1.0, r) * smoothstep(0.6, 0.9, r); float pulse = 0.5 + 0.5 * sin(uTime * 1.2); float alpha = ring * (0.13 + pulse * 0.08); gl_FragColor = vec4(uColor, alpha); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const aura = new THREE.Mesh(geo, mat);
  aura.rotation.x = -Math.PI / 2;
  aura.position.y = 0.11;
  return aura;
}
const aura = buildAura();
scene.add(aura);

// ─── Post-processing (bloom on emissives) ──────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ────────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Class registry (metadata + factory) ───────────────────────────────────
const classRegistry = {
  knight: {
    name: 'Knight', family: 'Tank · I/VI', role: 'Plate · Vanguard',
    accent: '#e3b878', accentGlow: 'rgba(227, 184, 120, 0.45)',
    auraColor: new THREE.Color(0xff8844), emberColor: new THREE.Color(1.0, 0.65, 0.3),
    abilities: { attack: 'Shield Bash', spell1: 'Provoke', spell2: 'Shield Wall' },
    factory: () => new Knight(scene, new THREE.Vector3(0, 0, 0)),
  },
  crusader: {
    name: 'Crusader', family: 'Tank · II/VI', role: 'Holy · Bulwark',
    accent: '#f4e4b0', accentGlow: 'rgba(244, 228, 176, 0.55)',
    auraColor: new THREE.Color(0xfddc80), emberColor: new THREE.Color(1.0, 0.85, 0.45),
    abilities: { attack: 'Hammer of Faith', spell1: 'Divine Decree', spell2: 'Consecration' },
    factory: () => new Crusader(scene, new THREE.Vector3(0, 0, 0)),
  },
  sentinel: {
    name: 'Sentinel', family: 'Tank · III/VI', role: 'Watch · Aegis',
    accent: '#80e0ff', accentGlow: 'rgba(128, 224, 255, 0.55)',
    auraColor: new THREE.Color(0x60d0ff), emberColor: new THREE.Color(0.5, 0.8, 1.0),
    abilities: { attack: 'Spear Thrust', spell1: 'Aegis', spell2: "Watcher's Gaze" },
    factory: () => new Sentinel(scene, new THREE.Vector3(0, 0, 0)),
  },
  warden: {
    name: 'Warden', family: 'Tank · IV/VI', role: 'Forest · Aegis',
    accent: '#a8d060', accentGlow: 'rgba(168, 208, 96, 0.55)',
    auraColor: new THREE.Color(0x80c040), emberColor: new THREE.Color(0.7, 0.9, 0.4),
    abilities: { attack: 'Root Strike', spell1: "Grove's Ward", spell2: 'Worldspine' },
    factory: () => new Warden(scene, new THREE.Vector3(0, 0, 0)),
  },
  juggernaut: {
    name: 'Juggernaut', family: 'Tank · V/VI', role: 'Iron · Brute',
    accent: '#ff5030', accentGlow: 'rgba(255, 80, 48, 0.55)',
    auraColor: new THREE.Color(0xff4020), emberColor: new THREE.Color(1.0, 0.45, 0.25),
    abilities: { attack: 'Crushing Blow', spell1: 'Bloodrage', spell2: 'Earthshatter' },
    factory: () => new Juggernaut(scene, new THREE.Vector3(0, 0, 0)),
  },
  shieldmage: {
    name: 'Shieldmage', family: 'Tank · VI/VI', role: 'Arcane · Bulwark',
    accent: '#c080ff', accentGlow: 'rgba(192, 128, 255, 0.55)',
    auraColor: new THREE.Color(0xb060ff), emberColor: new THREE.Color(0.75, 0.5, 1.0),
    abilities: { attack: 'Arcane Strike', spell1: 'Runeward', spell2: 'Starfall Seal' },
    factory: () => new Shieldmage(scene, new THREE.Vector3(0, 0, 0)),
  },
};

// Build all champions upfront, hide all but the active one for fast swapping
const champions = {};
for (const key of Object.keys(classRegistry)) {
  champions[key] = classRegistry[key].factory();
  champions[key].group.visible = false;
  champions[key].group.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

let activeKey = 'knight';
let activeChampion = champions[activeKey];
activeChampion.group.visible = true;

// ─── Class swapping ────────────────────────────────────────────────────────
function selectClass(key) {
  if (!classRegistry[key] || activeKey === key) return;
  // Stop any active animation, clear effects, hide previous champion
  activeChampion.stopAnimation();
  effectMgr.clear();
  activeChampion.group.visible = false;

  activeKey = key;
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  const meta = classRegistry[key];
  // Update labels
  document.getElementById('familyLabel').textContent = meta.family;
  document.getElementById('nameLabel').textContent = meta.name;
  document.getElementById('roleLabel').textContent = meta.role;
  document.getElementById('ab-attack-name').textContent = meta.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = meta.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = meta.abilities.spell2;

  // Update CSS accent color
  document.documentElement.style.setProperty('--accent', meta.accent);
  document.documentElement.style.setProperty('--accent-glow', meta.accentGlow);

  // Update aura + embers tint
  aura.material.uniforms.uColor.value.copy(meta.auraColor);
  embers.material.uniforms.uColor.value.copy(meta.emberColor);
}

// ─── UI wiring ─────────────────────────────────────────────────────────────
document.getElementById('classSelect').addEventListener('change', e => selectClass(e.target.value));

function triggerAnim(animName) {
  if (activeChampion.isPlaying()) return;
  const time = clock.getElapsedTime();
  activeChampion.playAnimation(animName, time, effectMgr);

  const btn = document.querySelector(`.ab-btn[data-anim="${animName}"]`);
  if (btn) {
    btn.classList.add('cooling');
    const dur = activeChampion.animations[animName].duration * 1000;
    setTimeout(() => btn.classList.remove('cooling'), dur);
  }
}
document.querySelectorAll('.ab-btn').forEach(btn => {
  btn.addEventListener('click', () => triggerAnim(btn.dataset.anim));
});

// Demo cycle — runs through attack → spell1 → spell2 with spacing
let demoTimeout = null;
function runDemo() {
  const sequence = ['attack', 'spell1', 'spell2'];
  let i = 0;
  const next = () => {
    if (i >= sequence.length) { demoTimeout = null; return; }
    triggerAnim(sequence[i]);
    const dur = activeChampion.animations[sequence[i]].duration * 1000;
    i++;
    demoTimeout = setTimeout(next, dur + 350);
  };
  next();
}
document.getElementById('demoBtn').addEventListener('click', () => {
  if (demoTimeout) { clearTimeout(demoTimeout); demoTimeout = null; }
  runDemo();
});

// ─── Main loop ─────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let lastT = 0;

function animate() {
  const t = clock.getElapsedTime();
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  activeChampion.update(t, dt);
  effectMgr.update(t, dt);

  // Embers
  const positions = embers.geometry.attributes.position;
  const velocities = embers.userData.velocities;
  for (let i = 0; i < embers.userData.count; i++) {
    positions.array[i * 3 + 0] += velocities[i * 3 + 0] * dt;
    positions.array[i * 3 + 1] += velocities[i * 3 + 1] * dt;
    positions.array[i * 3 + 2] += velocities[i * 3 + 2] * dt;
    if (positions.array[i * 3 + 1] > 6) {
      const r = 1 + Math.random() * 4;
      const a = Math.random() * Math.PI * 2;
      positions.array[i * 3 + 0] = Math.cos(a) * r;
      positions.array[i * 3 + 1] = -0.3;
      positions.array[i * 3 + 2] = Math.sin(a) * r;
    }
  }
  positions.needsUpdate = true;
  embers.material.uniforms.uTime.value = t;
  aura.material.uniforms.uTime.value = t;

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
requestAnimationFrame(() => setTimeout(() => document.getElementById('loading').classList.add('hidden'), 200));

</script>
