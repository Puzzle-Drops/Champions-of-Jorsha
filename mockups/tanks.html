// ─── Math ──────────────────────────────────────────────────────────────────
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  linear: t => t,
  inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class FilledShockwave extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;
    this.mesh.scale.setScalar(0.2);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(0.2, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.55;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

    this.rotateSpeed = opts.rotateSpeed ?? 0.7;

      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 3.2;
    this.radius = opts.radius ?? 1.8;
    const geo = new THREE.RingGeometry(0.05, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x);
          float outerRing = smoothstep(0.93, 0.97, r) * smoothstep(1.0, 0.97, r);
          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);
          float fill = smoothstep(0.97, 0.0, r) * 0.08;
          float runeAng = mod(a + uTime * -0.5, 6.28318 / 12.0) * 12.0;
          float runes = smoothstep(0.4, 0.5, sin(runeAng)) * smoothstep(0.78, 0.85, r) * smoothstep(0.92, 0.85, r);
          float pulse = 0.7 + 0.3 * sin(uTime * 3.0);
          float intensity = (outerRing + midRing * 0.7 + star * 0.9 + runes * 1.1) * pulse + fill;
          gl_FragColor = vec4(uColor * intensity * 1.7, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(0.1);
    this.targetScale = this.radius;
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.25 ? lerp(0.1, this.targetScale, ease.out(t01 / 0.25)) : this.targetScale;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = t01 < 0.85 ? 1.0 : 1.0 - (t01 - 0.85) / 0.15;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class LightPillar extends Effect {
  constructor(scene, position, opts = {}) {

    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec2 vUv;
        void main() {
          float vertical = smoothstep(1.0, 0.0, vUv.y) * smoothstep(0.0, 0.15, vUv.y);
          float horizontal = 1.0 - abs(vUv.x - 0.5) * 2.0;
          float pattern = sin(vUv.y * 30.0 - uTime * 8.0) * 0.5 + 0.5;
          pattern = pow(pattern, 2.0) * 0.4;
          float intensity = vertical * (0.7 + pattern * 0.5) * horizontal;
          gl_FragColor = vec4(uColor * intensity * 2.0, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

// ─── Shared part builders ──────────────────────────────────────────────────
function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.steelDark;
  const mid = palette.mid || M.steel;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material || M.cape;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.steel;
  const dark = palette.dark || M.steelDark;
  const hi = palette.hi || M.steelHi;
  const accent = palette.accent || M.brass;
  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);
  const knuckle = mesh(new THREE.BoxGeometry(0.16, 0.05, 0.08), accent);
  knuckle.position.set(0, -0.85, 0.05); arm.add(knuckle);
  const hand = new THREE.Group();
  hand.position.y = -0.96;
  arm.add(hand);
  arm.userData.hand = hand;
  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;
  return arm;
}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  KNIGHT — Tank I/VI                                                      ║
// ║  Plate · Vanguard · Steel and brass, crimson cape, kite shield + sword  ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Knight extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = knightAnimations;
  }
  build() {
    const root = this.group;
    root.add(buildLeg(-1));
    root.add(buildLeg(1));

    // Pelvis
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.leather));
    const buckleBack = mesh(new THREE.BoxGeometry(0.26, 0.16, 0.05), M.brass);
    buckleBack.position.set(0, 0, 0.28); pelvis.add(buckleBack);
    const buckleFace = mesh(new THREE.BoxGeometry(0.18, 0.12, 0.04), M.brassHi);
    buckleFace.position.set(0, 0, 0.31); pelvis.add(buckleFace);
    const buckleGem = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.emberEye);
    buckleGem.position.set(0, 0, 0.34); buckleGem.scale.set(1, 1, 0.5); pelvis.add(buckleGem);
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      if (Math.abs(angle + Math.PI / 2) < 0.4) continue;
      const t = mesh(new THREE.BoxGeometry(0.18, 0.32, 0.04), M.steel);
      t.position.set(Math.cos(angle) * 0.28, -0.2, Math.sin(angle) * 0.28);
      t.lookAt(Math.cos(angle) * 2, -0.2, Math.sin(angle) * 2);
      t.rotateX(0.15);
      pelvis.add(t);
      const rivet = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.brassHi);
      rivet.position.set(Math.cos(angle) * 0.305, -0.06, Math.sin(angle) * 0.305);
      pelvis.add(rivet);
    }
    root.add(pelvis);

    // Torso
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const chest = mesh(new THREE.CylinderGeometry(0.36, 0.32, 0.7, 16), M.steel);
    chest.scale.set(1.05, 1, 0.85); torso.add(chest);
    const ridge = mesh(new THREE.BoxGeometry(0.04, 0.6, 0.06), M.brass);
    ridge.position.set(0, 0.05, 0.32); torso.add(ridge);
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.steel);
    pecL.position.set(-0.16, 0.18, 0.22); pecL.scale.set(1, 0.7, 0.6); torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16; torso.add(pecR);
    const plaque = mesh(new THREE.BoxGeometry(0.22, 0.3, 0.03), M.steelDark);
    plaque.position.set(0, 0.05, 0.36); torso.add(plaque);
    const crossV = mesh(new THREE.BoxGeometry(0.04, 0.22, 0.025), M.brassHi);
    crossV.position.set(0, 0.05, 0.38); torso.add(crossV);
    const crossH = mesh(new THREE.BoxGeometry(0.16, 0.04, 0.025), M.brassHi);
    crossH.position.set(0, 0.1, 0.38); torso.add(crossH);
    const gorget = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.brass);
    gorget.position.y = 0.42; torso.add(gorget);
    for (let i = 0; i < 5; i++) {
      const y = -0.25 + (i / 4) * 0.5;
      const rL = mesh(new THREE.SphereGeometry(0.02, 8, 6), M.brassHi);
      rL.position.set(-0.36, y, 0.05); torso.add(rL);
      const rR = rL.clone(); rR.position.x = 0.36; torso.add(rR);
    }
    root.add(torso);
    this.parts.body = torso;

    // Pauldrons
    const buildPauldron = (sx) => {
      const p = new THREE.Group();
      const cap = mesh(new THREE.SphereGeometry(0.22, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.7), M.steel);
      cap.scale.set(1.15, 1, 1.15); p.add(cap);
      const trim = mesh(new THREE.TorusGeometry(0.22, 0.02, 8, 24), M.brass);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      const spike = mesh(new THREE.ConeGeometry(0.045, 0.16, 8), M.brassHi);
      spike.position.set(sx * 0.12, 0.12, 0); spike.rotation.z = -sx * 0.4; p.add(spike);
      const inner = mesh(new THREE.SphereGeometry(0.16, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.steelHi);
      inner.scale.set(1, 0.8, 1); inner.position.y = -0.05; p.add(inner);
      p.position.set(sx * 0.42, 2.2, 0);
      return p;
    };
    root.add(buildPauldron(-1));
    root.add(buildPauldron(1));

    // Arms
    const leftArm = buildArm(-1, 0.25);
    leftArm.rotation.x = -0.08;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.0);
    rightArm.rotation.x = -0.42;
    rightArm.rotation.z = 0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Shield
    const shield = this._buildShield();
    leftArm.userData.hand.add(shield);
    shield.position.set(-0.05, -0.1, 0.05);
    shield.rotation.set(0.2, 0.4, -0.2);
    shield.scale.setScalar(0.95);
    this.parts.shield = shield;

    // Sword
    const sword = this._buildSword();
    rightArm.userData.hand.add(sword);
    sword.position.set(0, 0, 0.1);
    sword.rotation.set(Math.PI * 0.55, 0, 0.05);
    this.parts.sword = sword;

    // Neck + helm
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.steelDark);
    neck.position.y = 2.32; root.add(neck);
    const helm = this._buildHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    // Cape + clasps + chain + back strap
    const cape = buildCape({ material: M.cape });
    cape.position.set(0, 2.36, 0);
    root.add(cape);
    this.cape = cape;
    const claspL = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.brassHi);
    claspL.position.set(-0.28, 2.34, 0.22); claspL.scale.set(1, 1, 0.6); root.add(claspL);
    const claspR = claspL.clone(); claspR.position.x = 0.28; root.add(claspR);
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      const link = mesh(new THREE.TorusGeometry(0.02, 0.005, 6, 10), M.brass);
      link.position.set(-0.24 + t * 0.48, 2.32 - Math.sin(t * Math.PI) * 0.04, 0.24);
      link.rotation.x = Math.PI / 2;
      root.add(link);
    }
    const strap = mesh(new THREE.BoxGeometry(0.06, 0.7, 0.01), M.leather);
    strap.position.set(-0.05, 1.95, 0.36); strap.rotation.z = 0.35; root.add(strap);

    M.emberEye.userData.baseIntensity = 5.5;
    this.eyeMaterial = M.emberEye;
  }
  _buildShield() {
    const shield = new THREE.Group();
    const w = 0.38, h = 0.55;
    const shape = new THREE.Shape();
    shape.moveTo(-w, h * 0.4);
    shape.bezierCurveTo(-w, h, -w * 0.3, h * 1.05, 0, h * 1.05);
    shape.bezierCurveTo(w * 0.3, h * 1.05, w, h, w, h * 0.4);
    shape.bezierCurveTo(w, -h * 0.2, w * 0.5, -h, 0, -h);
    shape.bezierCurveTo(-w * 0.5, -h, -w, -h * 0.2, -w, h * 0.4);
    shield.add(mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.02, bevelSegments: 3 }), M.steel));
    const rimShape = new THREE.Shape();
    const rw = w + 0.02, rh = h + 0.02;
    rimShape.moveTo(-rw, rh * 0.4);
    rimShape.bezierCurveTo(-rw, rh, -rw * 0.3, rh * 1.05, 0, rh * 1.05);
    rimShape.bezierCurveTo(rw * 0.3, rh * 1.05, rw, rh, rw, rh * 0.4);
    rimShape.bezierCurveTo(rw, -rh * 0.2, rw * 0.5, -rh, 0, -rh);
    rimShape.bezierCurveTo(-rw * 0.5, -rh, -rw, -rh * 0.2, -rw, rh * 0.4);
    const innerHole = new THREE.Path();
    innerHole.moveTo(-w, h * 0.4);
    innerHole.bezierCurveTo(-w, h, -w * 0.3, h * 1.05, 0, h * 1.05);
    innerHole.bezierCurveTo(w * 0.3, h * 1.05, w, h, w, h * 0.4);
    innerHole.bezierCurveTo(w, -h * 0.2, w * 0.5, -h, 0, -h);
    innerHole.bezierCurveTo(-w * 0.5, -h, -w, -h * 0.2, -w, h * 0.4);
    rimShape.holes.push(innerHole);
    const rim = mesh(new THREE.ExtrudeGeometry(rimShape, { depth: 0.08, bevelEnabled: false }), M.brass);
    rim.position.z = -0.01; shield.add(rim);
    const bossPlate = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.03, 24), M.brass);
    bossPlate.rotation.x = Math.PI / 2; bossPlate.position.set(0, 0.05, 0.08); shield.add(bossPlate);
    const bossDome = mesh(new THREE.SphereGeometry(0.1, 16, 12), M.brassHi);
    bossDome.position.set(0, 0.05, 0.12); bossDome.scale.set(1, 1, 0.6); shield.add(bossDome);
    const bossStud = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.emberEye);
    bossStud.position.set(0, 0.05, 0.18); shield.add(bossStud);
    const emblemV = mesh(new THREE.BoxGeometry(0.05, 0.4, 0.02), M.brassHi);
    emblemV.position.set(0, 0.1, 0.075); shield.add(emblemV);
    const emblemH = mesh(new THREE.BoxGeometry(0.28, 0.05, 0.02), M.brassHi);
    emblemH.position.set(0, 0.18, 0.075); shield.add(emblemH);
    for (const [sx, sy] of [[-0.28, 0.45], [0.28, 0.45], [-0.32, -0.15], [0.32, -0.15], [0, -0.78]]) {
      const stud = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.brassHi);
      stud.position.set(sx, sy, 0.08); shield.add(stud);
    }
    return shield;
  }
  _buildSword() {
    const sword = new THREE.Group();
    sword.add(mesh(new THREE.SphereGeometry(0.055, 14, 12), M.brassHi));
    const pommelGem = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.emberEye);
    pommelGem.position.set(0, 0, 0.052); sword.add(pommelGem);
    const grip = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.18, 12), M.leather);
    grip.position.y = 0.1; sword.add(grip);
    for (let i = 0; i < 4; i++) {
      const ring = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.leatherHi);
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.04 + i * 0.04; sword.add(ring);
    }
    const cg = mesh(new THREE.BoxGeometry(0.42, 0.045, 0.08), M.brass);
    cg.position.y = 0.21; sword.add(cg);
    const cgEndL = mesh(new THREE.SphereGeometry(0.035, 10, 8), M.brassHi);
    cgEndL.position.set(-0.21, 0.21, 0); sword.add(cgEndL);
    const cgEndR = cgEndL.clone(); cgEndR.position.x = 0.21; sword.add(cgEndR);
    const cgOrn = mesh(new THREE.BoxGeometry(0.06, 0.07, 0.1), M.brassHi);
    cgOrn.position.y = 0.215; sword.add(cgOrn);
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.045, 0); bladeShape.lineTo(0.045, 0);
    bladeShape.lineTo(0.025, 1.0); bladeShape.lineTo(0, 1.05);
    bladeShape.lineTo(-0.025, 1.0); bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.018, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 2 }), M.blade);
    blade.position.set(0, 0.235, -0.009); sword.add(blade);
    const fuller = mesh(new THREE.BoxGeometry(0.014, 0.78, 0.005), M.steelDark);
    fuller.position.set(0, 0.62, 0.012); sword.add(fuller);
    return sword;
  }
  _buildHelm() {
    const helm = new THREE.Group();
    const skull = mesh(new THREE.SphereGeometry(0.22, 20, 16), M.steel);
    skull.scale.set(1, 1.05, 1.1); helm.add(skull);
    const brow = mesh(new THREE.TorusGeometry(0.22, 0.022, 10, 24, Math.PI * 1.1), M.brass);
    brow.rotation.set(Math.PI / 2, 0, Math.PI * 0.95); brow.position.set(0, 0.04, 0); helm.add(brow);
    const crestShape = new THREE.Shape();
    crestShape.moveTo(-0.22, 0); crestShape.lineTo(0.22, 0);
    crestShape.lineTo(0.18, 0.12); crestShape.lineTo(0, 0.16);
    crestShape.lineTo(-0.18, 0.12); crestShape.closePath();
    const crest = mesh(new THREE.ExtrudeGeometry(crestShape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 }), M.brassHi);
    crest.position.set(-0.0125, 0.18, 0); crest.rotation.y = Math.PI / 2; helm.add(crest);
    const slit = mesh(new THREE.BoxGeometry(0.32, 0.04, 0.04), M.stoneDark);
    slit.position.set(0, 0.02, 0.18); helm.add(slit);
    const eyeL = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.emberEye);
    eyeL.position.set(-0.07, 0.02, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.07; helm.add(eyeR);
    const noseGuard = mesh(new THREE.BoxGeometry(0.045, 0.18, 0.03), M.brass);
    noseGuard.position.set(0, -0.06, 0.21); helm.add(noseGuard);
    const jawGuard = (sx) => {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0.12, 0);
      shape.lineTo(0.1, -0.18); shape.lineTo(-0.02, -0.2); shape.closePath();
      const g = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 }), M.steel);
      g.position.set(sx * 0.18, -0.1, 0.08);
      g.rotation.y = sx > 0 ? -0.4 : Math.PI + 0.4;
      return g;
    };
    helm.add(jawGuard(-1)); helm.add(jawGuard(1));
    const helmRim = mesh(new THREE.TorusGeometry(0.21, 0.014, 10, 24), M.brass);
    helmRim.rotation.x = Math.PI / 2; helmRim.position.y = -0.21; helm.add(helmRim);
    const topStud = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.brassHi);
    topStud.position.y = 0.27; helm.add(topStud);
    return helm;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  CRUSADER — Tank II/VI                                                   ║
// ║  Holy · Bulwark · Ivory and gold, sun shield, hammer, halo crown helm   ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Crusader extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = crusaderAnimations;
  }
  build() {
    const root = this.group;
    const palette = { dark: M.ivoryDark, mid: M.ivory, accent: M.gold, trim: M.gold, leather: M.leather };
    root.add(buildLeg(-1, palette));
    root.add(buildLeg(1, palette));

    // Pelvis with sun-disc buckle
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.leather));
    const buckleBack = mesh(new THREE.BoxGeometry(0.3, 0.18, 0.05), M.gold);
    buckleBack.position.set(0, 0, 0.28); pelvis.add(buckleBack);
    const sunDisc = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.04, 16), M.goldHi);
    sunDisc.rotation.x = Math.PI / 2; sunDisc.position.set(0, 0, 0.32); pelvis.add(sunDisc);
    const sunGem = mesh(new THREE.SphereGeometry(0.035, 12, 10), M.divineEye);
    sunGem.position.set(0, 0, 0.345); sunGem.scale.set(1, 1, 0.5); pelvis.add(sunGem);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const ray = mesh(new THREE.BoxGeometry(0.08, 0.018, 0.015), M.goldHi);
      ray.position.set(Math.cos(a) * 0.115, Math.sin(a) * 0.115, 0.34);
      ray.rotation.z = a;
      pelvis.add(ray);
    }
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      if (Math.abs(angle + Math.PI / 2) < 0.4) continue;
      const t = mesh(new THREE.BoxGeometry(0.18, 0.32, 0.04), M.ivory);
      t.position.set(Math.cos(angle) * 0.28, -0.2, Math.sin(angle) * 0.28);
      t.lookAt(Math.cos(angle) * 2, -0.2, Math.sin(angle) * 2);
      t.rotateX(0.15);
      pelvis.add(t);
      const rivet = mesh(new THREE.SphereGeometry(0.022, 8, 6), M.goldHi);
      rivet.position.set(Math.cos(angle) * 0.305, -0.06, Math.sin(angle) * 0.305);
      pelvis.add(rivet);
    }
    root.add(pelvis);

    // Torso — ivory with cross emblem and rune lines
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const chest = mesh(new THREE.CylinderGeometry(0.36, 0.32, 0.7, 16), M.ivory);
    chest.scale.set(1.05, 1, 0.85); torso.add(chest);
    const ridge = mesh(new THREE.BoxGeometry(0.05, 0.6, 0.06), M.gold);
    ridge.position.set(0, 0.05, 0.32); torso.add(ridge);
    const shoulderRidgeL = mesh(new THREE.BoxGeometry(0.04, 0.14, 0.04), M.gold);
    shoulderRidgeL.position.set(-0.22, 0.32, 0.27); shoulderRidgeL.rotation.z = -0.4; torso.add(shoulderRidgeL);
    const shoulderRidgeR = shoulderRidgeL.clone(); shoulderRidgeR.position.x = 0.22; shoulderRidgeR.rotation.z = 0.4; torso.add(shoulderRidgeR);
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.ivory);
    pecL.position.set(-0.16, 0.18, 0.22); pecL.scale.set(1, 0.7, 0.6); torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16; torso.add(pecR);
    const crossPlaqueShape = new THREE.Shape();
    crossPlaqueShape.moveTo(-0.05, 0.18); crossPlaqueShape.lineTo(0.05, 0.18);
    crossPlaqueShape.lineTo(0.05, 0.04); crossPlaqueShape.lineTo(0.15, 0.04);
    crossPlaqueShape.lineTo(0.15, -0.06); crossPlaqueShape.lineTo(0.05, -0.06);
    crossPlaqueShape.lineTo(0.05, -0.22); crossPlaqueShape.lineTo(-0.05, -0.22);
    crossPlaqueShape.lineTo(-0.05, -0.06); crossPlaqueShape.lineTo(-0.15, -0.06);
    crossPlaqueShape.lineTo(-0.15, 0.04); crossPlaqueShape.lineTo(-0.05, 0.04);
    crossPlaqueShape.closePath();
    const cross = mesh(new THREE.ExtrudeGeometry(crossPlaqueShape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 2 }), M.goldHi);
    cross.position.set(0, 0.04, 0.36); torso.add(cross);
    const crossGem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.divineEye);
    crossGem.position.set(0, 0.04, 0.4); crossGem.scale.set(1, 1, 0.5); torso.add(crossGem);
    for (let i = 0; i < 3; i++) {
      const yOff = -0.2 - i * 0.06;
      const runeL = mesh(new THREE.BoxGeometry(0.08, 0.012, 0.005), M.divineRune);
      runeL.position.set(-0.27 + i * 0.02, yOff, 0.3); runeL.rotation.z = -0.3; torso.add(runeL);
      const runeR = runeL.clone(); runeR.position.x = 0.27 - i * 0.02; runeR.rotation.z = 0.3; torso.add(runeR);
    }
    const gorget = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.13, 16), M.gold);
    gorget.position.y = 0.42; torso.add(gorget);
    const gorgetTrim = mesh(new THREE.TorusGeometry(0.19, 0.012, 8, 24), M.goldHi);
    gorgetTrim.rotation.x = Math.PI / 2; gorgetTrim.position.y = 0.485; torso.add(gorgetTrim);
    for (let i = 0; i < 4; i++) {
      const y = -0.2 + (i / 3) * 0.4;
      const ornL = mesh(new THREE.SphereGeometry(0.028, 10, 8), M.goldHi);
      ornL.position.set(-0.36, y, 0.05); torso.add(ornL);
      const ornR = ornL.clone(); ornR.position.x = 0.36; torso.add(ornR);
    }
    root.add(torso);
    this.parts.body = torso;

    // Sunburst pauldrons
    const buildPauldron = (sx) => {
      const p = new THREE.Group();
      const cap = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.7), M.ivory);
      cap.scale.set(1.2, 1, 1.2); p.add(cap);
      const trim = mesh(new THREE.TorusGeometry(0.24, 0.025, 8, 24), M.gold);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i / 4) * Math.PI;
        const spike = mesh(new THREE.ConeGeometry(0.03, 0.14, 8), M.goldHi);
        spike.position.set(Math.cos(a) * 0.22, Math.sin(a) * 0.05 + 0.06, 0);
        spike.rotation.z = a - Math.PI / 2 + sx * 0.1;
        p.add(spike);
      }
      const sun = mesh(new THREE.CircleGeometry(0.06, 12), M.divineRune);
      sun.position.set(sx * 0.05, 0.06, 0.06);
      sun.rotation.y = sx > 0 ? -0.3 : 0.3;
      p.add(sun);
      const inner = mesh(new THREE.SphereGeometry(0.16, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.ivoryHi);
      inner.scale.set(1, 0.8, 1); inner.position.y = -0.05; p.add(inner);
      p.position.set(sx * 0.44, 2.22, 0);
      return p;
    };
    root.add(buildPauldron(-1));
    root.add(buildPauldron(1));

    const armPalette = { mid: M.ivory, dark: M.ivoryDark, hi: M.ivoryHi, accent: M.gold };

    const rightArm = buildArm(1, 0.0, armPalette);
    rightArm.rotation.x = -0.42;

    const shield = this._buildSunShield();
    leftArm.userData.hand.add(shield);
    shield.position.set(-0.05, -0.1, 0.05);
    shield.rotation.set(0.2, 0.4, -0.2);
    shield.scale.setScalar(0.95);
    this.parts.shield = shield;

    const hammer = this._buildHammer();
    rightArm.userData.hand.add(hammer);
    hammer.position.set(0, 0.05, 0.08);
    hammer.rotation.set(Math.PI * 0.55, 0, 0.05);
    this.parts.weapon = hammer;

    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.ivoryDark);

    root.add(helm);
    this.parts.head = helm;

    const cape = buildCape({ material: M.cream });
    cape.position.set(0, 2.36, 0); root.add(cape);

      link.rotation.x = Math.PI / 2;
      root.add(link);
    }

    M.divineEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.divineEye;
  }
  _buildSunShield() {
    const shield = new THREE.Group();
    const disc = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.07, 32), M.ivory);
    disc.rotation.x = Math.PI / 2; shield.add(disc);
    shield.add(mesh(new THREE.TorusGeometry(0.5, 0.04, 12, 48), M.gold));
    const innerRim = mesh(new THREE.TorusGeometry(0.36, 0.018, 10, 48), M.goldHi);
    innerRim.position.z = 0.04; shield.add(innerRim);
    const bossDome = mesh(new THREE.SphereGeometry(0.13, 18, 14), M.goldHi);
    bossDome.scale.set(1, 1, 0.6); bossDome.position.z = 0.1; shield.add(bossDome);
    const gem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.divineEye);
    gem.position.z = 0.16; gem.scale.set(1, 1, 0.6); shield.add(gem);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const len = i % 2 === 0 ? 0.3 : 0.18;
      const rayShape = new THREE.Shape();
      rayShape.moveTo(-0.025, 0); rayShape.lineTo(0.025, 0);
      rayShape.lineTo(0.012, len); rayShape.lineTo(-0.012, len); rayShape.closePath();
      const ray = mesh(new THREE.ExtrudeGeometry(rayShape, { depth: 0.015, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.003, bevelSegments: 2 }), M.gold);
      ray.position.set(Math.cos(a) * 0.16, Math.sin(a) * 0.16, 0.08);
      ray.rotation.z = a - Math.PI / 2;
      shield.add(ray);
    }
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const stud = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.goldHi);
      stud.position.set(Math.cos(a) * 0.45, Math.sin(a) * 0.45, 0.05);
      shield.add(stud);
    }
    return shield;
  }
  _buildHammer() {
    const hammer = new THREE.Group();
    hammer.add(mesh(new THREE.SphereGeometry(0.06, 14, 12), M.goldHi));
    const pommelGem = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.divineEye);
    pommelGem.position.set(0, 0, 0.06); hammer.add(pommelGem);
    const haft = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.85, 12), M.leather);
    haft.position.y = 0.45; hammer.add(haft);
    for (let i = 0; i < 6; i++) {
      const ring = mesh(new THREE.TorusGeometry(0.038, 0.005, 6, 12), M.gold);
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.12 + i * 0.13; hammer.add(ring);
    }
    const xguard = mesh(new THREE.BoxGeometry(0.18, 0.04, 0.18), M.gold);
    xguard.position.y = 0.92; hammer.add(xguard);
    const head = mesh(new THREE.BoxGeometry(0.4, 0.3, 0.3), M.gold);
    head.position.y = 1.1; hammer.add(head);
    const headEnd = (sx) => {
      const end = new THREE.Group();
      const cap = mesh(new THREE.BoxGeometry(0.07, 0.34, 0.34), M.goldHi);
      cap.position.x = sx * 0.235; end.add(cap);
      const rim = mesh(new THREE.TorusGeometry(0.13, 0.012, 8, 24), M.gold);
      rim.position.set(sx * 0.275, 0, 0); rim.rotation.y = Math.PI / 2; end.add(rim);
      const star = mesh(new THREE.CircleGeometry(0.09, 8), M.divineRune);
      star.position.set(sx * 0.28, 0, 0); star.rotation.y = sx > 0 ? -Math.PI/2 : Math.PI/2;
      end.add(star);
      const gem = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.divineEye);
      gem.position.set(sx * 0.3, 0, 0); gem.scale.set(0.5, 1, 1);
      end.add(gem);
      return end;
    };
    head.add(headEnd(-1)); head.add(headEnd(1));
    const spike = mesh(new THREE.ConeGeometry(0.06, 0.2, 8), M.goldHi);
    spike.position.y = 1.35; hammer.add(spike);
    const bottom = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.06, 12), M.gold);
    bottom.position.y = 0.92; hammer.add(bottom);
    return hammer;
  }
  _buildCrownHelm() {
    const helm = new THREE.Group();
    const skull = mesh(new THREE.SphereGeometry(0.22, 20, 16), M.ivory);
    skull.scale.set(1, 1.05, 1.1); helm.add(skull);
    const browBand = mesh(new THREE.TorusGeometry(0.22, 0.025, 10, 32), M.gold);
    browBand.rotation.x = Math.PI / 2; browBand.position.y = 0.04; helm.add(browBand);
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * 0.4 + (i / 4) * Math.PI * 0.8;
      const sp = mesh(new THREE.ConeGeometry(0.03, 0.14, 8), M.goldHi);
      sp.position.set(Math.cos(a + Math.PI / 2) * 0.21, 0.14, Math.sin(a + Math.PI / 2) * 0.21);
      sp.lookAt(Math.cos(a + Math.PI / 2) * 1, 1, Math.sin(a + Math.PI / 2) * 1);
      helm.add(sp);
    }
    const jewelStem = mesh(new THREE.BoxGeometry(0.06, 0.1, 0.04), M.gold);
    jewelStem.position.set(0, 0.1, 0.2); helm.add(jewelStem);
    const jewel = mesh(new THREE.SphereGeometry(0.045, 14, 12), M.divineEye);
    jewel.position.set(0, 0.15, 0.22); jewel.scale.set(1, 1, 0.5); helm.add(jewel);
    const slit = mesh(new THREE.BoxGeometry(0.32, 0.05, 0.04), M.stoneDark);
    slit.position.set(0, -0.02, 0.18); helm.add(slit);
    const eyeL = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.divineEye);
    eyeL.position.set(-0.07, -0.02, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.07; helm.add(eyeR);
    const noseGuard = mesh(new THREE.BoxGeometry(0.045, 0.16, 0.03), M.gold);
    noseGuard.position.set(0, -0.1, 0.21); helm.add(noseGuard);
    const cheek = (sx) => {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0.1, 0);
      shape.lineTo(0.08, -0.14); shape.lineTo(-0.02, -0.16); shape.closePath();
      const g = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 }), M.ivory);
      g.position.set(sx * 0.18, -0.12, 0.08);
      g.rotation.y = sx > 0 ? -0.4 : Math.PI + 0.4;
      return g;
    };
    helm.add(cheek(-1)); helm.add(cheek(1));
    const helmRim = mesh(new THREE.TorusGeometry(0.21, 0.018, 10, 24), M.gold);
    helmRim.rotation.x = Math.PI / 2; helmRim.position.y = -0.21; helm.add(helmRim);
    const halo = mesh(new THREE.TorusGeometry(0.16, 0.01, 8, 32, Math.PI), M.goldHi);
    halo.rotation.x = -Math.PI / 2; halo.rotation.y = Math.PI;
    halo.position.set(0, 0.22, -0.05); helm.add(halo);
    const haloGlow = mesh(new THREE.TorusGeometry(0.16, 0.025, 8, 32, Math.PI), M.divineRune);
    haloGlow.rotation.copy(halo.rotation); haloGlow.position.copy(halo.position); helm.add(haloGlow);
    return helm;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SENTINEL — Tank III/VI                                                  ║
// ║  Watch · Aegis · Slate plate, silver trim, cyan rune-glow, tower shield,║
// ║  glaive polearm, conical spire helm with eye-visor                      ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Sentinel extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = sentinelAnimations;
  }
  build() {
    const root = this.group;
    const palette = { dark: M.slateDark, mid: M.slate, accent: M.silver, trim: M.silver, leather: M.leatherDark };
    root.add(buildLeg(-1, palette));
    root.add(buildLeg(1, palette));

    // Pelvis with cyan rune-eye buckle
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.leatherDark));
    const buckleBack = mesh(new THREE.BoxGeometry(0.28, 0.18, 0.05), M.silver);
    buckleBack.position.set(0, 0, 0.28); pelvis.add(buckleBack);
    const buckleFace = mesh(new THREE.BoxGeometry(0.18, 0.13, 0.04), M.silverHi);
    buckleFace.position.set(0, 0, 0.31); pelvis.add(buckleFace);
    const buckleGem = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.cyanEye);
    buckleGem.position.set(0, 0, 0.34); buckleGem.scale.set(1, 1.3, 0.5); pelvis.add(buckleGem);
    for (let i = 0; i < 4; i++) {
      const offset = i < 2 ? -0.12 - (i * 0.03) : 0.12 + ((i - 2) * 0.03);
      const tick = mesh(new THREE.BoxGeometry(0.014, 0.04, 0.005), M.cyanRune);
      tick.position.set(offset, 0, 0.32);
      pelvis.add(tick);
    }
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      if (Math.abs(angle + Math.PI / 2) < 0.4) continue;
      const t = mesh(new THREE.BoxGeometry(0.18, 0.34, 0.045), M.slate);
      t.position.set(Math.cos(angle) * 0.28, -0.21, Math.sin(angle) * 0.28);
      t.lookAt(Math.cos(angle) * 2, -0.21, Math.sin(angle) * 2);
      t.rotateX(0.15);
      pelvis.add(t);
      // Cyan rune line at the bottom of each tasset
      const edge = mesh(new THREE.BoxGeometry(0.14, 0.008, 0.003), M.cyanRune);
      edge.position.set(Math.cos(angle) * 0.305, -0.34, Math.sin(angle) * 0.305);
      edge.lookAt(Math.cos(angle) * 2, -0.34, Math.sin(angle) * 2);
      pelvis.add(edge);
      const rivet = mesh(new THREE.SphereGeometry(0.022, 8, 6), M.silverHi);
      rivet.position.set(Math.cos(angle) * 0.305, -0.07, Math.sin(angle) * 0.305);
      pelvis.add(rivet);
    }
    root.add(pelvis);

    // Torso — slate with overlapping scale plates + cyan eye emblem
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const chest = mesh(new THREE.CylinderGeometry(0.38, 0.34, 0.7, 16), M.slate);
    chest.scale.set(1.08, 1, 0.85); torso.add(chest);
    const ridge = mesh(new THREE.BoxGeometry(0.04, 0.6, 0.06), M.silver);
    ridge.position.set(0, 0.05, 0.34); torso.add(ridge);
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.slate);
    pecL.position.set(-0.16, 0.18, 0.22); pecL.scale.set(1, 0.7, 0.6); torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16; torso.add(pecR);

    // Layered scale plates (lamellar look — 2 rows of 2 plates around the chest)
    for (let row = 0; row < 2; row++) {
      const yBase = -0.05 - row * 0.13;
      for (let col = -1; col <= 1; col++) {
        if (col === 0) continue;
        const plate = mesh(new THREE.BoxGeometry(0.13, 0.1, 0.022), M.slateHi);
        plate.position.set(col * 0.18, yBase, 0.34);
        plate.rotation.z = col * 0.25;
        torso.add(plate);
        const r = mesh(new THREE.SphereGeometry(0.012, 6, 4), M.silverHi);
        r.position.set(col * 0.18, yBase + 0.04, 0.355);
        torso.add(r);
      }
    }

    // Eye emblem on chest — vertical glowing eye, cyan iris, dark pupil
    const emblemBase = mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.025, 24), M.slateDark);
    emblemBase.rotation.x = Math.PI / 2;
    emblemBase.position.set(0, 0.05, 0.36); torso.add(emblemBase);
    const emblemRing = mesh(new THREE.TorusGeometry(0.082, 0.008, 8, 32), M.silverHi);
    emblemRing.position.set(0, 0.05, 0.375); torso.add(emblemRing);
    const iris = mesh(new THREE.SphereGeometry(0.045, 14, 12), M.cyanEye);
    iris.position.set(0, 0.05, 0.39); iris.scale.set(0.9, 1.5, 0.5); torso.add(iris);
    const pupil = mesh(new THREE.SphereGeometry(0.018, 12, 10), M.stoneDark);
    pupil.position.set(0, 0.05, 0.42); pupil.scale.set(0.8, 1.4, 0.5); torso.add(pupil);
    const pupilGlow = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.cyanEye);
    pupilGlow.position.set(0, 0.05, 0.435); torso.add(pupilGlow);

    // Glowing rune lines down each side
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const yOff = -0.22 + t * 0.45;
      const len = 0.08 - Math.abs(t - 0.5) * 0.06;
      const runeL = mesh(new THREE.BoxGeometry(len, 0.012, 0.005), M.cyanRune);
      runeL.position.set(-0.32, yOff, 0.18);
      torso.add(runeL);
      const runeR = runeL.clone(); runeR.position.x = 0.32; torso.add(runeR);
    }

    // Tall gorget with glowing rune ring
    const gorget = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.16, 16), M.silver);
    gorget.position.y = 0.43; torso.add(gorget);
    const gorgetTrim = mesh(new THREE.TorusGeometry(0.19, 0.012, 8, 24), M.silverHi);
    gorgetTrim.rotation.x = Math.PI / 2; gorgetTrim.position.y = 0.5; torso.add(gorgetTrim);
    const gorgetRune = mesh(new THREE.TorusGeometry(0.195, 0.005, 6, 24), M.cyanRune);
    gorgetRune.rotation.x = Math.PI / 2; gorgetRune.position.y = 0.42; torso.add(gorgetRune);

    root.add(torso);
    this.parts.body = torso;

    // Towering pauldrons with vertical fins
    const buildSpirePauldron = (sx) => {
      const p = new THREE.Group();
      const cap = mesh(new THREE.SphereGeometry(0.25, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.65), M.slate);
      cap.scale.set(1.18, 1.25, 1.18); p.add(cap);
      const trim = mesh(new THREE.TorusGeometry(0.25, 0.022, 8, 24), M.silver);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.02; p.add(trim);
      // Three vertical fins jutting upward (decreasing height toward sides)
      for (let i = 0; i < 3; i++) {
        const offset = (i - 1) * 0.07;
        const fh = 0.2 - Math.abs(i - 1) * 0.05;
        const finShape = new THREE.Shape();
        finShape.moveTo(-0.025, 0); finShape.lineTo(0.025, 0);
        finShape.lineTo(0.018, fh); finShape.lineTo(0, fh + 0.03); finShape.lineTo(-0.018, fh);
        finShape.closePath();
        const fin = mesh(new THREE.ExtrudeGeometry(finShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2 }), M.silver);
        fin.position.set(sx * 0.04 + offset * 0.5, 0.18, -0.05);
        fin.rotation.y = sx > 0 ? -0.1 : 0.1;
        p.add(fin);
      }
      // Cyan rune disc on outer edge
      const disc = mesh(new THREE.CircleGeometry(0.05, 14), M.slateDark);
      disc.position.set(sx * 0.18, 0.04, 0.12);
      disc.rotation.y = sx > 0 ? -0.5 : 0.5;
      p.add(disc);
      const runeGlow = mesh(new THREE.CircleGeometry(0.038, 14), M.cyanRune);
      runeGlow.position.set(sx * 0.182, 0.04, 0.122);
      runeGlow.rotation.y = sx > 0 ? -0.5 : 0.5;
      p.add(runeGlow);
      const inner = mesh(new THREE.SphereGeometry(0.18, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.65), M.slateHi);
      inner.scale.set(1, 0.9, 1); inner.position.y = -0.05; p.add(inner);
      p.position.set(sx * 0.46, 2.22, 0);
      return p;
    };
    root.add(buildSpirePauldron(-1));
    root.add(buildSpirePauldron(1));

    // Arms
    const armPalette = { mid: M.slate, dark: M.slateDark, hi: M.slateHi, accent: M.silver };
    const leftArm = buildArm(-1, 0.25, armPalette);
    leftArm.rotation.x = -0.08;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.0, armPalette);
    rightArm.rotation.x = -0.42;
    rightArm.rotation.z = 0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Tower shield (parented to left hand)
    const shield = this._buildTowerShield();
    leftArm.userData.hand.add(shield);
    shield.position.set(-0.05, -0.12, 0.05);
    shield.rotation.set(0.15, 0.4, -0.2);
    shield.scale.setScalar(0.9);
    this.parts.shield = shield;

    // Glaive (parented to right hand)
    const glaive = this._buildGlaive();
    rightArm.userData.hand.add(glaive);
    glaive.position.set(0, 0.0, 0.1);
    glaive.rotation.set(Math.PI * 0.55, 0, 0.05);
    this.parts.weapon = glaive;

    // Neck + helm
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.slateDark);
    neck.position.y = 2.32; root.add(neck);
    const helm = this._buildSpireHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    // Cape — midnight blue with subtle blue trim
    const cape = buildCape({ material: M.midnight });
    cape.position.set(0, 2.36, 0); root.add(cape);
    this.cape = cape;
    const capeTrim = buildCape({ material: M.midnightTrim, width: 1.34, height: 1.88 });
    capeTrim.position.set(0, 2.36, -0.005); root.add(capeTrim);

    // Clasps with cyan rune-eye gems
    const claspL = mesh(new THREE.SphereGeometry(0.045, 12, 10), M.silverHi);
    claspL.position.set(-0.28, 2.34, 0.22); claspL.scale.set(1, 1, 0.6); root.add(claspL);
    const claspGemL = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.cyanEye);
    claspGemL.position.set(-0.28, 2.34, 0.27); claspGemL.scale.set(1, 1, 0.5); root.add(claspGemL);
    const claspR = claspL.clone(); claspR.position.x = 0.28; root.add(claspR);
    const claspGemR = claspGemL.clone(); claspGemR.position.x = 0.28; root.add(claspGemR);
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      const link = mesh(new THREE.TorusGeometry(0.022, 0.005, 6, 10), M.silver);
      link.position.set(-0.24 + t * 0.48, 2.32 - Math.sin(t * Math.PI) * 0.04, 0.24);
      link.rotation.x = Math.PI / 2;
      root.add(link);
    }

    M.cyanEye.userData.baseIntensity = 4.5;
    this.eyeMaterial = M.cyanEye;
  }

  _buildTowerShield() {
    const shield = new THREE.Group();
    const w = 0.42, h = 0.7;
    const shape = new THREE.Shape();
    shape.moveTo(-w, -h);
    shape.lineTo(w, -h);
    shape.lineTo(w, h * 0.55);
    shape.bezierCurveTo(w, h * 0.95, w * 0.45, h * 1.08, 0, h * 1.08);
    shape.bezierCurveTo(-w * 0.45, h * 1.08, -w, h * 0.95, -w, h * 0.55);
    shape.closePath();
    shield.add(mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.02, bevelSegments: 3 }), M.slate));

    // Silver outer rim
    const rimShape = new THREE.Shape();
    const rw = w + 0.025, rh = h + 0.025;
    rimShape.moveTo(-rw, -rh);
    rimShape.lineTo(rw, -rh);
    rimShape.lineTo(rw, rh * 0.55);
    rimShape.bezierCurveTo(rw, rh * 0.95, rw * 0.45, rh * 1.08, 0, rh * 1.08);
    rimShape.bezierCurveTo(-rw * 0.45, rh * 1.08, -rw, rh * 0.95, -rw, rh * 0.55);
    rimShape.closePath();
    const innerHole = new THREE.Path();
    innerHole.moveTo(-w, -h);
    innerHole.lineTo(w, -h);
    innerHole.lineTo(w, h * 0.55);
    innerHole.bezierCurveTo(w, h * 0.95, w * 0.45, h * 1.08, 0, h * 1.08);
    innerHole.bezierCurveTo(-w * 0.45, h * 1.08, -w, h * 0.95, -w, h * 0.55);
    rimShape.holes.push(innerHole);
    const rim = mesh(new THREE.ExtrudeGeometry(rimShape, { depth: 0.09, bevelEnabled: false }), M.silver);
    rim.position.z = -0.01; shield.add(rim);

    // Two horizontal silver reinforcement bars
    for (let i = 0; i < 2; i++) {
      const y = -h * 0.5 + i * (h * 0.55);
      const bar = mesh(new THREE.BoxGeometry(w * 1.95, 0.04, 0.02), M.silverHi);
      bar.position.set(0, y, 0.075);
      shield.add(bar);
    }

    // Vertical center reinforcement
    const vBar = mesh(new THREE.BoxGeometry(0.04, h * 1.7, 0.02), M.silverHi);
    vBar.position.set(0, 0, 0.075);
    shield.add(vBar);

    // Center eye emblem — vertical eye, glowing cyan iris
    const eyeShape = new THREE.Shape();
    eyeShape.moveTo(-0.22, 0);
    eyeShape.bezierCurveTo(-0.18, 0.13, 0.18, 0.13, 0.22, 0);
    eyeShape.bezierCurveTo(0.18, -0.13, -0.18, -0.13, -0.22, 0);
    eyeShape.closePath();
    const eyeOutline = mesh(new THREE.ExtrudeGeometry(eyeShape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2 }), M.silverHi);
    eyeOutline.position.set(0, h * 0.18, 0.085);
    shield.add(eyeOutline);

    // Eye background (dark)
    const eyeBg = mesh(new THREE.CircleGeometry(0.18, 32), M.slateDark);
    eyeBg.position.set(0, h * 0.18, 0.105); shield.add(eyeBg);
    eyeBg.scale.set(1, 0.7, 1);

    // Iris (cyan glow)
    const iris = mesh(new THREE.CircleGeometry(0.12, 24), M.cyanEye);
    iris.position.set(0, h * 0.18, 0.108);
    iris.scale.set(1, 0.7, 1);
    shield.add(iris);

    // Pupil
    const pupil = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.stoneDark);
    pupil.position.set(0, h * 0.18, 0.115); pupil.scale.set(1, 0.85, 0.5); shield.add(pupil);
    const pupilGlow = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.cyanEye);
    pupilGlow.position.set(0, h * 0.18, 0.13); shield.add(pupilGlow);

    // Corner studs
    for (const [x, y] of [[-w * 0.85, -h * 0.85], [w * 0.85, -h * 0.85], [-w * 0.85, -h * 0.1], [w * 0.85, -h * 0.1], [0, -h * 0.95]]) {
      const stud = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.silverHi);
      stud.position.set(x, y, 0.085);
      shield.add(stud);
    }

    // Tiny cyan rune ticks along the rim (top half)
    for (let i = 0; i < 6; i++) {
      const t = i / 5;
      const angle = -Math.PI / 2 + t * Math.PI; // arc across the top
      const tickX = Math.cos(angle) * w * 0.95;
      const tickY = Math.sin(angle) * h * 0.95 * (angle > -Math.PI / 4 && angle < Math.PI / 4 ? 1.05 : 1.0);
      if (tickY < 0) continue;
      const tick = mesh(new THREE.BoxGeometry(0.012, 0.025, 0.005), M.cyanRune);
      tick.position.set(tickX, tickY, 0.085);
      tick.rotation.z = angle - Math.PI / 2;
      shield.add(tick);
    }

    return shield;
  }

  _buildGlaive() {
    const glaive = new THREE.Group();
    // Butt spike (decorative bottom)
    const buttSpike = mesh(new THREE.ConeGeometry(0.04, 0.1, 8), M.silver);
    buttSpike.position.y = -0.05; buttSpike.rotation.x = Math.PI;
    glaive.add(buttSpike);
    // Long shaft (dark leather wrap)
    const shaft = mesh(new THREE.CylinderGeometry(0.028, 0.028, 1.45, 12), M.leatherDark);
    shaft.position.y = 0.7; glaive.add(shaft);
    // Silver wrap rings along shaft
    for (let i = 0; i < 5; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.032, 0.005, 6, 12), M.silver);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.2 + i * 0.27;
      glaive.add(wrap);
    }
    // Cyan rune ring midway along the shaft
    const runeRing = mesh(new THREE.TorusGeometry(0.038, 0.008, 6, 16), M.cyanRune);
    runeRing.rotation.x = Math.PI / 2;
    runeRing.position.y = 0.85;
    glaive.add(runeRing);
    // Decorative collar where blade meets shaft
    const collar = mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.08, 12), M.silverHi);
    collar.position.y = 1.42; glaive.add(collar);
    const collarGem = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.cyanEye);
    collarGem.position.set(0, 1.42, 0.045); glaive.add(collarGem);

    // Glaive blade — single curved blade extending forward
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.025, 0);
    bladeShape.lineTo(0.025, 0);
    bladeShape.bezierCurveTo(0.18, 0.2, 0.22, 0.5, 0.05, 0.85);
    bladeShape.lineTo(0, 0.92);
    bladeShape.lineTo(-0.025, 0.85);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.018, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.004, bevelSegments: 2 }), M.blade);
    blade.position.set(0, 1.48, -0.009);
    glaive.add(blade);

    // Cyan rune line etched along the blade
    const bladeRune = mesh(new THREE.BoxGeometry(0.008, 0.5, 0.004), M.cyanRune);
    bladeRune.position.set(0.05, 1.85, 0.012);
    bladeRune.rotation.z = -0.18;
    glaive.add(bladeRune);

    // Back hook spike on the inner curve
    const backHook = mesh(new THREE.ConeGeometry(0.025, 0.1, 6), M.silver);
    backHook.position.set(-0.05, 1.65, 0);
    backHook.rotation.z = -0.5;
    glaive.add(backHook);

    return glaive;
  }

  _buildSpireHelm() {
    const helm = new THREE.Group();
    // Skull (slightly more elongated than knight)
    const skull = mesh(new THREE.SphereGeometry(0.22, 20, 16), M.slate);
    skull.scale.set(1, 1.1, 1.1); helm.add(skull);

    // Tall conical spire on top
    const spireBase = mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.15, 12), M.slate);
    spireBase.position.y = 0.28; helm.add(spireBase);
    const spire = mesh(new THREE.ConeGeometry(0.1, 0.4, 12), M.silverHi);
    spire.position.y = 0.55; helm.add(spire);
    const spireTip = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.cyanEye);
    spireTip.position.y = 0.78; helm.add(spireTip);

    // Eye visor — single wide horizontal slit, deep recess
    const visor = mesh(new THREE.BoxGeometry(0.36, 0.06, 0.05), M.stoneDark);
    visor.position.set(0, 0.02, 0.18); helm.add(visor);
    // Two glowing cyan eyes inside the visor
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.cyanEye);
    eyeL.position.set(-0.085, 0.02, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.085; helm.add(eyeR);

    // Silver brow ridge above the visor
    const brow = mesh(new THREE.BoxGeometry(0.42, 0.025, 0.04), M.silver);
    brow.position.set(0, 0.07, 0.2); helm.add(brow);

    // Cyan rune circle on forehead (above visor)
    const foreheadRing = mesh(new THREE.TorusGeometry(0.028, 0.004, 6, 16), M.silverHi);
    foreheadRing.position.set(0, 0.14, 0.21); helm.add(foreheadRing);
    const forehead = mesh(new THREE.CircleGeometry(0.022, 16), M.cyanRune);
    forehead.position.set(0, 0.14, 0.215); helm.add(forehead);

    // Side fins — vertical flat slabs on each side
    const sideFin = (sx) => {
      const finShape = new THREE.Shape();
      finShape.moveTo(-0.07, -0.1); finShape.lineTo(0.07, -0.1);
      finShape.lineTo(0.05, 0.16); finShape.lineTo(-0.05, 0.16); finShape.closePath();
      const f = mesh(new THREE.ExtrudeGeometry(finShape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2 }), M.silver);
      f.position.set(sx * 0.22, 0.05, -0.02);
      f.rotation.y = sx > 0 ? -Math.PI / 2 : Math.PI / 2;
      return f;
    };
    helm.add(sideFin(-1)); helm.add(sideFin(1));

    // Cheek/jaw guards
    const jawGuard = (sx) => {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0.1, 0);
      shape.lineTo(0.08, -0.16); shape.lineTo(-0.02, -0.18); shape.closePath();
      const g = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 }), M.slate);
      g.position.set(sx * 0.18, -0.1, 0.08);
      g.rotation.y = sx > 0 ? -0.4 : Math.PI + 0.4;
      return g;
    };
    helm.add(jawGuard(-1)); helm.add(jawGuard(1));

    // Bottom rim
    const rim = mesh(new THREE.TorusGeometry(0.21, 0.018, 10, 24), M.silver);
    rim.rotation.x = Math.PI / 2; rim.position.y = -0.21; helm.add(rim);

    return helm;
  }
}

        const shieldPos = new THREE.Vector3(); champ.parts.shield.getWorldPosition(shieldPos);
        shieldPos.y = 0;
        mgr.spawn(new LightPillar(champ.scene, shieldPos, { color: 0x80e0ff, height: 3.0, radius: 0.35, duration: 0.9 }), time);
      }},
      { time: 0.4, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        mgr.spawn(new RuneRing(champ.scene, pos, { color: 0x80e0ff, maxRadius: 2.4, duration: 1.0, startRadius: 0.8, runeCount: 12, rotateSpeed: -0.8 }), time);
      }},
    ],
  },
  // WATCHER'S GAZE — both arms raise glaive vertically, eye-glow pulses, multi-ring rune cascade + perimeter pillars
  spell2: {
    duration: 2.6,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.22, values: {
        rightArm: { rx: -1.65, rz: -0.2 },     // glaive aloft
        leftArm:  { rx: -1.2, rz: 0.45 },       // off-hand reaches up to support
        body:     { rx: -0.06 },
      }, ease: ease.out },
      { t: 0.7, values: {
        rightArm: { rx: -1.7, rz: -0.22 },
        leftArm:  { rx: -1.25, rz: 0.5 },
        body:     { rx: -0.08 },
      }},
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.25, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        mgr.spawn(new RuneRing(champ.scene, pos, { color: 0x60d0ff, maxRadius: 1.6, duration: 1.2, startRadius: 0.3, runeCount: 8, rotateSpeed: 1.4 }), time);
      }},
      { time: 0.42, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        mgr.spawn(new RuneRing(champ.scene, pos, { color: 0x80e0ff, maxRadius: 2.6, duration: 1.4, startRadius: 0.5, runeCount: 12, rotateSpeed: -1.0 }), time);
        mgr.spawn(new ShockwaveRing(champ.scene, pos, { color: 0x40c0ff, maxRadius: 2.4, duration: 0.8 }), time);
        // Pulse from chest emblem
        const chestPos = pos.clone(); chestPos.y = 1.9;
        mgr.spawn(new ImpactFlash(champ.scene, chestPos, { color: 0xb0eeff, maxScale: 0.7, duration: 0.45 }), time);
      }},
      { time: 0.55, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        mgr.spawn(new RuneRing(champ.scene, pos, { color: 0xc0eeff, maxRadius: 3.8, duration: 1.3, startRadius: 1.0, runeCount: 16, rotateSpeed: 0.7 }), time);
        // Perimeter pillars (3 around the sentinel — watch towers)
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
          const ppos = pos.clone();
          ppos.x += Math.cos(a) * 1.9; ppos.z += Math.sin(a) * 1.9;
          mgr.spawn(new LightPillar(champ.scene, ppos, { color: 0x80e0ff, height: 2.8, radius: 0.18, duration: 1.1 }), time + i * 0.06);
        }
        // Ascending cyan particles
        const burstPos = pos.clone(); burstPos.y = 0.5;
        mgr.spawn(new ParticleBurst(champ.scene, burstPos, { color: 0x80e0ff, count: 60, speed: 2.5, duration: 1.6, upwardBias: 3.0, gravity: -1.0 }), time);
      }},
