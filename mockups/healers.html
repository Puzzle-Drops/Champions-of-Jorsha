// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ORACLE — Healer IV/VI                                                   ║
// ║  Cleanse · Foresight · Indigo flowing robes with silver trim, blindfold ║
// ║  with glowing third-eye gem, crystal-orb staff, three lavender eye-orbs ║
// ║  orbiting head, star-trim cape, lavender mystic eye glow                ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Oracle extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = oracleAnimations;
  }

  // Override update — slowly orbit the floating eye-orbs around the head
  update(time, dt) {
    super.update(time, dt);
    if (this.eyeOrbAnchor) this.eyeOrbAnchor.rotation.y = time * 0.5;
  }

  build() {
    const root = this.group;

    // Legs — long indigo robes (full cloth, no greaves)
    const buildOracleLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.indigo);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin (slightly wider for drape)
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.5, 14), M.indigoHi);
      shin.position.y = 0.36; leg.add(shin);
      // Silver trim band at hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.22, 0.01, 8, 18), M.silverTrimHi);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Star pattern decorations along the lower robe
      for (let i = 0; i < 3; i++) {
        const star = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.silverTrimHi);
        star.position.set(0, 0.2 - i * 0.1, 0.2);
        leg.add(star);
      }
      // Soft slipper sole (dark)
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.indigoDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildOracleLeg(-1));
    root.add(buildOracleLeg(1));

    // Pelvis — indigo with silver star-clasp belt
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.indigoDark));
    // Silver belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.08, 18), M.silverTrim);
    belt.position.y = 0.04; pelvis.add(belt);
    // Star clasp at front
    const claspBack = mesh(new THREE.CircleGeometry(0.045, 16), M.silverTrimHi);
    claspBack.position.set(0, 0.04, 0.32); pelvis.add(claspBack);
    // 5-pointed silver star on the clasp
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const ray = mesh(new THREE.ConeGeometry(0.008, 0.04, 4), M.lavender);
      ray.position.set(Math.cos(a) * 0.025, 0.04 + Math.sin(a) * 0.025, 0.34);
      ray.rotation.z = a - Math.PI / 2;
      pelvis.add(ray);
    }
    // Central lavender gem
    const claspGem = mesh(new THREE.SphereGeometry(0.015, 10, 8), M.lavender);
    claspGem.position.set(0, 0.04, 0.345); claspGem.scale.set(1, 1, 0.5);
    pelvis.add(claspGem);
    // Indigo apron (long robe drop below belt)
    const apron = mesh(new THREE.BoxGeometry(0.4, 0.45, 0.018), M.indigo);
    apron.position.set(0, -0.24, 0.31); apron.rotation.x = -0.04;
    pelvis.add(apron);
    // Silver star pattern on apron (3 small stars)
    for (let i = 0; i < 3; i++) {
      const star = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.silverTrimHi);
      star.position.set(0, -0.12 - i * 0.1, 0.32);
      pelvis.add(star);
    }
    root.add(pelvis);

    // TORSO — indigo flowing robe with silver star-pattern trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Indigo robe body
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.indigo);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);

    // Silver shoulder shawl drape (V-shape across the chest)
    const shawlL = mesh(new THREE.BoxGeometry(0.06, 0.55, 0.018), M.silverTrim);
    shawlL.position.set(-0.13, 0.05, 0.36); shawlL.rotation.z = 0.25;
    torso.add(shawlL);
    const shawlR = mesh(new THREE.BoxGeometry(0.06, 0.55, 0.018), M.silverTrim);
    shawlR.position.set(0.13, 0.05, 0.36); shawlR.rotation.z = -0.25;
    torso.add(shawlR);

    // Pec mounds (indigoHi)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.indigoHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — open eye with rays (the marquee Oracle symbol)
    const eyeBack = mesh(new THREE.CircleGeometry(0.085, 18), M.indigoDark);
    eyeBack.position.set(0, 0.05, 0.36); torso.add(eyeBack);
    // Eye-shape oval (silver)
    const eyeOval = mesh(new THREE.SphereGeometry(0.06, 16, 10), M.silverTrimHi);
    eyeOval.position.set(0, 0.05, 0.38); eyeOval.scale.set(1.4, 0.7, 0.3);
    torso.add(eyeOval);
    // Iris (lavender)
    const iris = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.lavender);
    iris.position.set(0, 0.05, 0.4); iris.scale.set(1, 1, 0.3);
    torso.add(iris);
    // Pupil (dark)
    const pupil = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.indigoDark);
    pupil.position.set(0, 0.05, 0.41); pupil.scale.set(1, 1, 0.3);
    torso.add(pupil);
    // 6 silver rays radiating outward from the eye
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const ray = mesh(new THREE.BoxGeometry(0.012, 0.05, 0.005), M.silverTrimHi);
      ray.position.set(Math.cos(a) * 0.105, 0.05 + Math.sin(a) * 0.085, 0.4);
      ray.rotation.z = a - Math.PI / 2;
      torso.add(ray);
    }
    // 4 small star sigils flanking the emblem
    for (let xs = -1; xs <= 1; xs += 2) {
      for (let ys = -1; ys <= 1; ys += 2) {
        const star = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.lavender);
        star.position.set(xs * 0.18, 0.05 + ys * 0.12, 0.36);
        torso.add(star);
      }
    }

    // Star-pattern trim along the bottom of the torso
    for (let i = 0; i < 5; i++) {
      const star = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.silverTrimHi);
      star.position.set(-0.2 + i * 0.1, -0.32, 0.34);
      torso.add(star);
    }

    // High collar with silver trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.indigoHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.silverTrimHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft indigo shoulder caps with silver trim
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.indigoHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Silver trim along cap rim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.01, 8, 16), M.silverTrimHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Tiny lavender star atop each shoulder
      const shoulderStar = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.lavender);
      shoulderStar.position.set(side * 0.42, 2.26, 0);
      root.add(shoulderStar);
    }

    // ARMS — indigo cloth with silver-banded cuffs
    const armPalette = { cloth: M.indigo, mid: M.indigoHi, dark: M.indigoDark, hi: M.silverTrim, accent: M.silverTrimHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Silver cuffs at the wrists with star pattern
    [leftArm, rightArm].forEach(arm => {
      const cuff = mesh(new THREE.CylinderGeometry(0.092, 0.088, 0.08, 14), M.silverTrim);
      cuff.position.y = -0.85; arm.add(cuff);
      const cuffTrim = mesh(new THREE.TorusGeometry(0.094, 0.008, 6, 16), M.silverTrimHi);
      cuffTrim.rotation.x = Math.PI / 2; cuffTrim.position.y = -0.81;
      arm.add(cuffTrim);
      // Lavender star inset
      const star = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.lavender);
      star.position.set(0, -0.85, 0.085);
      arm.add(star);
    });

    // CRYSTAL-ORB STAFF — held in right hand
    const staff = this._buildCrystalStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.staff = staff;

    // CAPE — long indigo flowing cape with silver star-trim
    const cape = buildCape({ material: M.oracleCape, width: 1.45, height: 2.0 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape silver bottom trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.015, 8, 28, Math.PI), M.silverTrimHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.55, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Stars scattered on the cape (decorative dots)
    for (let i = 0; i < 8; i++) {
      const star = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.silverTrimHi);
      star.position.set((Math.random() - 0.5) * 0.7, 1.2 + Math.random() * 0.7, -0.18 - Math.random() * 0.05);
      root.add(star);
    }

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — blindfold with third-eye gem, no helm
    const head = this._buildOracleHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== FLOATING EYE-ORBS — 3 lavender eyes orbiting the head (the marquee feature) =====
    this.eyeOrbAnchor = new THREE.Group();
    this.eyeOrbAnchor.position.set(0, 2.85, 0);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      // Eye-orb (small sphere with embedded "iris")
      const orb = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.silverTrimHi);
      orb.position.set(Math.cos(a) * 0.36, 0.05 * Math.sin(a * 2), Math.sin(a) * 0.36);
      this.eyeOrbAnchor.add(orb);
      // Iris (lavender)
      const orbIris = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.lavender);
      orbIris.position.copy(orb.position);
      orbIris.position.x += Math.cos(a + Math.PI) * 0.018;
      orbIris.position.z += Math.sin(a + Math.PI) * 0.018;
      this.eyeOrbAnchor.add(orbIris);
      // Tiny pupil
      const orbPupil = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.indigoDark);
      orbPupil.position.copy(orbIris.position);
      orbPupil.position.x += Math.cos(a + Math.PI) * 0.012;
      orbPupil.position.z += Math.sin(a + Math.PI) * 0.012;
      this.eyeOrbAnchor.add(orbPupil);
    }
    root.add(this.eyeOrbAnchor);

    M.oracleEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.oracleEye;
  }

  _buildCrystalStaff() {
    const staff = new THREE.Group();
    // Pommel — silver capped
    const pommel = mesh(new THREE.SphereGeometry(0.038, 12, 10), M.silverTrimHi);
    staff.add(pommel);
    // Long silver-banded haft
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.026, 1.15, 12), M.indigoDark);
    haft.position.y = 0.62; staff.add(haft);
    // Silver bands evenly spaced
    for (let i = 0; i < 8; i++) {
      const band = mesh(new THREE.CylinderGeometry(0.027, 0.027, 0.014, 12), M.silverTrim);
      band.position.y = 0.1 + i * 0.13; staff.add(band);
    }
    // Mid-haft lavender gem
    const midGem = mesh(new THREE.SphereGeometry(0.03, 12, 10), M.lavender);
    midGem.position.y = 0.55; midGem.scale.set(1, 0.5, 1);
    staff.add(midGem);
    // Top section — silver claw cradle
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.08, 12), M.silverTrimHi);
    cradle.position.y = 1.22; staff.add(cradle);
    // 4 silver claws curving up to hold the orb
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const claw = mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.14, 6), M.silverTrimHi);
      claw.position.set(Math.cos(a) * 0.06, 1.32, Math.sin(a) * 0.06);
      claw.rotation.z = -Math.cos(a) * 0.4;
      claw.rotation.x = -Math.sin(a) * 0.4;
      staff.add(claw);
    }
    // CRYSTAL ORB — large lavender sphere at the top
    const orb = mesh(new THREE.SphereGeometry(0.075, 18, 14), M.lavender);
    orb.position.y = 1.4; staff.add(orb);
    // Inner glow shell (smaller, brighter)
    const orbCore = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.silverTrimHi);
    orbCore.position.y = 1.4; staff.add(orbCore);
    // Orbiting tiny stars around the orb
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const ministar = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.lavender);
      ministar.position.set(Math.cos(a) * 0.11, 1.4 + Math.sin(a * 2) * 0.04, Math.sin(a) * 0.11);
      staff.add(ministar);
    }
    return staff;
  }

  _buildOracleHead() {
    const head = new THREE.Group();

    // Pale face skin (mystic appearance)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.indigoDark);  // dark hair
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== BLINDFOLD across the eyes (indigo cloth strip with third-eye) =====
    const blindfold = mesh(new THREE.BoxGeometry(0.42, 0.07, 0.1), M.indigoHi);
    blindfold.position.set(0, -0.02, 0.18);
    head.add(blindfold);
    // Silver-trim border on the blindfold
    const blindfoldTopTrim = mesh(new THREE.BoxGeometry(0.42, 0.008, 0.005), M.silverTrimHi);
    blindfoldTopTrim.position.set(0, 0.014, 0.225);
    head.add(blindfoldTopTrim);
    const blindfoldBottomTrim = mesh(new THREE.BoxGeometry(0.42, 0.008, 0.005), M.silverTrimHi);
    blindfoldBottomTrim.position.set(0, -0.054, 0.225);
    head.add(blindfoldBottomTrim);

    // ===== THIRD-EYE GEM — large lavender gem on the forehead (above the blindfold) =====
    const thirdEyeBack = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.silverTrimHi);
    thirdEyeBack.position.set(0, 0.08, 0.21); thirdEyeBack.scale.set(1.3, 0.7, 0.5);
    head.add(thirdEyeBack);
    // Eye-shaped lavender gem
    const thirdEye = mesh(new THREE.SphereGeometry(0.03, 12, 10), M.oracleEye);
    thirdEye.position.set(0, 0.08, 0.225); thirdEye.scale.set(1.3, 0.6, 0.4);
    head.add(thirdEye);
    // Silver outline rays (4 small flares around the third eye)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const ray = mesh(new THREE.BoxGeometry(0.005, 0.022, 0.005), M.silverTrimHi);
      ray.position.set(Math.cos(a) * 0.045, 0.08 + Math.sin(a) * 0.025, 0.225);
      ray.rotation.z = a - Math.PI / 2;
      head.add(ray);
    }

    // No visible normal eyes (covered by blindfold) — but the eyeMaterial drives the third-eye intensity
    // Set an invisible eye reference for the base class pulse to hit
    const hiddenEye = mesh(new THREE.SphereGeometry(0.005, 6, 4), M.oracleEye);
    hiddenEye.position.set(0, 0.08, 0.24);
    head.add(hiddenEye);

    // Small dignified nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.05, 6), M.skinPale);
    nose.position.set(0, -0.08, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (calm subtle line)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Long flowing hair (back) — dark indigo
    const hairBack = mesh(new THREE.SphereGeometry(0.24, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.6), M.indigoDark);
    hairBack.scale.set(1.05, 1.4, 1.1);
    hairBack.position.set(0, 0.0, -0.05);
    head.add(hairBack);

    return head;
  }
}

// ║  BLOODPRIEST — Healer V/VI                                               ║
// ║  Heals via Damage · Sanguine Bond · Deep crimson hooded robes with      ║
// ║  black trim, pale skull-like face within hood, heart-pendant, scythe-  ║
// ║  dagger weapon, bone-fingered gauntlets, wine-red blood eye glow        ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Bloodpriest extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = bloodpriestAnimations;
  }

  // Override update — pulse the heart pendant slightly (heartbeat)
  update(time, dt) {
    super.update(time, dt);
    if (this.heartPendant) {
      const beat = 1 + Math.sin(time * 2.5) * 0.06;
      this.heartPendant.scale.set(beat, beat, beat);
    }
  }

  build() {
    const root = this.group;

    // Legs — dark crimson robes ending in black boots
    const buildBpLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — crimson cloth
      const thigh = mesh(new THREE.CylinderGeometry(0.17, 0.15, 0.55, 14), M.bpCrimson);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin — darker crimson
      const shin = mesh(new THREE.CylinderGeometry(0.155, 0.2, 0.5, 14), M.bpCrimsonDark);
      shin.position.y = 0.36; leg.add(shin);
      // Black trim band
      const trim = mesh(new THREE.TorusGeometry(0.2, 0.012, 8, 18), M.bpBlack);
      trim.rotation.x = Math.PI / 2; trim.position.y = 0.12;
      leg.add(trim);
      // Black boot
      const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), M.bpBlack);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Dark gold bone-claw on boot toe
      const toeClawL = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.bpDarkGold);
      toeClawL.position.set(-0.06, 0.06, 0.21); toeClawL.rotation.x = -Math.PI / 2;
      leg.add(toeClawL);
      const toeClawR = toeClawL.clone(); toeClawR.position.x = 0.06;
      leg.add(toeClawR);
      // Drip-trim on the inside hem (small dripping blood gems)
      for (let i = 0; i < 2; i++) {
        const drip = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.bpBlood);
        drip.position.set(-0.03 + i * 0.06, 0.15, 0.18); drip.scale.set(0.7, 1.4, 0.7);
        leg.add(drip);
      }
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildBpLeg(-1));
    root.add(buildBpLeg(1));

    // Pelvis — black-crimson with ritual chain belt
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.bpCrimsonDark));
    // Black ritual belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.bpBlack);
    belt.position.y = 0.04; pelvis.add(belt);
    // Dark gold heart-buckle (small)
    const buckleHeartL = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.bpDarkGold);
    buckleHeartL.position.set(-0.013, 0.04, 0.32); buckleHeartL.scale.set(1, 1.2, 0.5);
    pelvis.add(buckleHeartL);
    const buckleHeartR = buckleHeartL.clone(); buckleHeartR.position.x = 0.013;
    pelvis.add(buckleHeartR);
    // Hanging vials/phials (3 small bottles of blood on the belt)
    for (let i = -1; i <= 1; i++) {
      const vial = mesh(new THREE.CylinderGeometry(0.018, 0.014, 0.06, 8), M.bpBlack);
      vial.position.set(i * 0.18, -0.06, 0.2);
      pelvis.add(vial);
      // Blood inside (glowing wine-red)
      const blood = mesh(new THREE.SphereGeometry(0.013, 10, 8), M.bpBlood);
      blood.position.set(i * 0.18, -0.075, 0.205); blood.scale.set(1, 0.6, 1);

      cap.position.set(i * 0.18, -0.026, 0.2);
      pelvis.add(cap);
    }
    // Long crimson apron drop below belt
    const apron = mesh(new THREE.BoxGeometry(0.4, 0.42, 0.018), M.bpCrimson);
    apron.position.set(0, -0.22, 0.31); apron.rotation.x = -0.04;
    pelvis.add(apron);
    // Black trim on apron
    const apronTrim = mesh(new THREE.BoxGeometry(0.4, 0.025, 0.022), M.bpBlack);
    apronTrim.position.set(0, -0.41, 0.32); pelvis.add(apronTrim);
    root.add(pelvis);

    // TORSO — crimson hooded robes

    torso.add(yokeTrim);

    // Pec mounds (crimson)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.bpCrimsonHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — heart pendant with dripping blood (the marquee Bloodpriest symbol)
    // Dark gold backing circle
    const emblemBack = mesh(new THREE.CircleGeometry(0.085, 16), M.bpDarkGold);
    emblemBack.position.set(0, 0.0, 0.36); torso.add(emblemBack);
    // Heart shape (formed from two spheres + cone)
    const heartGroup = new THREE.Group();
    // Two upper lobes
    const heartLobeL = mesh(new THREE.SphereGeometry(0.035, 12, 10), M.bpBlood);
    heartLobeL.position.set(-0.018, 0.022, 0); heartLobeL.scale.set(1, 1, 0.5);

    const heartLobeR = heartLobeL.clone(); heartLobeR.position.x = 0.018;

      torso.add(drip);

    // Sigil-marks down the front of the robe (3 vertical blood-rune sigils)
    for (let i = 0; i < 3; i++) {
      const sigil = mesh(new THREE.BoxGeometry(0.025, 0.018, 0.005), M.bpBlood);
      sigil.position.set(0, -0.18 - i * 0.08, 0.36);
      torso.add(sigil);
    }

    // High collar (black with gold trim, leading into the hood)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.bpBlack);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.bpDarkGold);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft crimson shoulder caps with black trim
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.bpCrimsonHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Black trim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.bpBlack);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);

    // ARMS — crimson cloth + black gauntlets with bone-claw motif
    const armPalette = { cloth: M.bpCrimson, mid: M.bpBlack, dark: M.bpBlack, hi: M.bpCrimsonHi, accent: M.bpDarkGold };

    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Bone-claw fingertips on both gauntlets (skeletal motif)
    [leftArm, rightArm].forEach((arm, idx) => {
      // 4 small bone claws extending from each gauntlet
      for (let i = 0; i < 4; i++) {
        const claw = mesh(new THREE.ConeGeometry(0.01, 0.04, 4), M.bone);
        claw.position.set((i - 1.5) * 0.025, -1.0, 0.04);

      arm.add(knuckle);
      // Wine-red blood gem on the knuckle (the heart-link visual)
      const knuckleGem = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.bpBlood);
      knuckleGem.position.set(0, -0.92, 0.07);
      arm.add(knuckleGem);

  _buildScytheDagger() {
    const scythe = new THREE.Group();
    // Pommel — dark gold orb with blood gem
    const pommel = mesh(new THREE.SphereGeometry(0.038, 12, 10), M.bpDarkGold);
    scythe.add(pommel);
    const pommelGem = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.bpBlood);
    pommelGem.position.y = 0.0; pommelGem.scale.set(1, 1, 0.5);
    scythe.add(pommelGem);
    // Black-wrapped grip
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.28, 12), M.bpBlack);
    grip.position.y = 0.16; scythe.add(grip);
    // Dark gold cord wraps
    for (let i = 0; i < 5; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.bpDarkGold);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.06 + i * 0.05;
      scythe.add(wrap);
    }
    // Crossguard — small horizontal bar with dripping blood gems on each end
    const cross = mesh(new THREE.BoxGeometry(0.18, 0.025, 0.04), M.bpBlack);
    cross.position.y = 0.32; scythe.add(cross);
    // Blood gems at each end of the crossguard
    for (let side = -1; side <= 1; side += 2) {
      const gem = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.bpBlood);
      gem.position.set(side * 0.085, 0.32, 0); gem.scale.set(0.8, 1.4, 0.8);
      scythe.add(gem);
    }
    // Central crossguard heart accent
    const crossHeart = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.bpBlood);
    crossHeart.position.set(0, 0.32, 0.025); crossHeart.scale.set(1, 1, 0.5);
    scythe.add(crossHeart);
    // Curved scythe blade — using a thin extruded arc
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(0, 0); bladeShape.lineTo(0.04, 0);
    bladeShape.bezierCurveTo(0.4, 0.02, 0.5, 0.4, 0.3, 0.7);
    bladeShape.bezierCurveTo(0.25, 0.55, 0.18, 0.3, 0.0, 0.05);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.018, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.003, bevelSegments: 1 }), M.bladeDark);
    blade.position.set(0, 0.34, -0.009); blade.scale.set(0.9, 0.9, 1);
    scythe.add(blade);
    // Cutting edge (lighter steel highlight along curve)
    const edgeShape = new THREE.Shape();
    edgeShape.moveTo(0.04, 0.02); edgeShape.bezierCurveTo(0.34, 0.05, 0.46, 0.4, 0.27, 0.65);
    edgeShape.bezierCurveTo(0.32, 0.4, 0.28, 0.18, 0.06, 0.04);
    edgeShape.closePath();
    const edge = mesh(new THREE.ExtrudeGeometry(edgeShape, { depth: 0.022, bevelEnabled: false }), M.blade);
    edge.position.set(0, 0.34, -0.011); edge.scale.set(0.9, 0.9, 1);
    scythe.add(edge);
    // Blood-drop dripping from the scythe tip
    const bloodDrip = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.bpBlood);
    bloodDrip.position.set(0.27, 0.95, 0); bloodDrip.scale.set(0.7, 1.4, 0.7);
    scythe.add(bloodDrip);
    return scythe;
  }

  _buildBpHead() {
    const head = new THREE.Group();

    // Pale gaunt face inside
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.92, 1.05, 0.95);
    head.add(face);

    // Sunken cheek shadows
    for (let side = -1; side <= 1; side += 2) {
      const cheek = mesh(new THREE.SphereGeometry(0.05, 10, 8), M.bpCrimsonDark);
      cheek.position.set(side * 0.13, -0.08, 0.12); cheek.scale.set(1, 1.2, 0.4);
      head.add(cheek);
    }

    // ===== HOODED COWL — pulled UP, covering most of the head =====
    // Outer hood shell (deep crimson)
    const hood = mesh(new THREE.SphereGeometry(0.28, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.72), M.bpCrimson);
    hood.scale.set(1.05, 1.1, 1.15);
    hood.position.set(0, 0.04, -0.02);
    head.add(hood);
    // Inner hood lining (black, visible at the front opening)
    const hoodLining = mesh(new THREE.SphereGeometry(0.265, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.bpBlack);
    hoodLining.scale.set(1.05, 1.1, 1.15);
    hoodLining.position.set(0, 0.04, -0.02);
    head.add(hoodLining);
    // Hood front opening (creates the dark recess where the face peeks out)
    const hoodOpening = mesh(new THREE.RingGeometry(0.12, 0.22, 24, 1, 0, Math.PI), M.bpBlack);
    hoodOpening.position.set(0, -0.02, 0.18);
    hoodOpening.rotation.x = -0.3;
    head.add(hoodOpening);

    // Dark gold trim around the hood opening
    const hoodTrim = mesh(new THREE.TorusGeometry(0.22, 0.01, 8, 28, Math.PI * 1.2), M.bpDarkGold);
    hoodTrim.rotation.x = Math.PI / 2.3;
    hoodTrim.rotation.y = -Math.PI / 2;
    hoodTrim.position.y = 0.06;
    head.add(hoodTrim);

    // Glowing wine-red eyes (deep within the hood shadow)
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.02, 0.02), M.bpBlack);
    eyeStrip.position.set(0, -0.025, 0.16); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.bpEye);
    eyeL.position.set(-0.075, -0.02, 0.19); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Subtle skull-like cheekbones (small gaunt highlights)
    for (let side = -1; side <= 1; side += 2) {
      const bone = mesh(new THREE.BoxGeometry(0.04, 0.012, 0.02), M.skinPale);
      bone.position.set(side * 0.12, -0.05, 0.18);
      head.add(bone);
    }

    // Mouth (subtle pale line)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.bpCrimsonDark);
    mouth.position.set(0, -0.13, 0.2); head.add(mouth);

    // Blood-drop tear marks below each eye (small dark gems)
    for (let side = -1; side <= 1; side += 2) {
      const tear = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.bpBlood);
      tear.position.set(side * 0.075, -0.06, 0.2); tear.scale.set(0.7, 1.4, 0.7);
      head.add(tear);
    }

    return head;
  }
}

class Lifebinder extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = lifebinderAnimations;
  }

  // Override update — gently rotate the heart-chain halo and bob it
  update(time, dt) {
    super.update(time, dt);
    if (this.heartHalo) {
      this.heartHalo.rotation.y = time * 0.45;
      this.heartHalo.position.y = this.heartHaloBaseY + Math.sin(time * 1.4) * 0.012;
    }
  }

  build() {
    const root = this.group;

    // Legs — long rose robes layered with cream underskirt
    const buildLbLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — rose
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.rose);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin — rose lighter (drape outward at base)
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.5, 14), M.roseHi);
      shin.position.y = 0.36; leg.add(shin);
      // Cream underskirt peeking out at hem (slightly longer cylinder beneath)
      const underskirt = mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.12, 14), M.lbCream);
      underskirt.position.y = 0.16; leg.add(underskirt);
      // Soft gold hem trim
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.012, 8, 18), M.lbGold);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.1;
      leg.add(hemTrim);
      // Soft slipper sole (cream)
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.lbCream);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      // Rose toe trim
      const toeTrim = mesh(new THREE.BoxGeometry(0.2, 0.025, 0.05), M.roseHi);
      toeTrim.position.set(0, 0.085, 0.18); leg.add(toeTrim);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildLbLeg(-1));
    root.add(buildLbLeg(1));

    // Pelvis — rose with cream sash + linked-heart belt-charms

    const buckleHeartR = buckleHeartL.clone(); buckleHeartR.position.x = 0.013;
    pelvis.add(buckleHeartR);
    const buckleHeartTip = mesh(new THREE.ConeGeometry(0.03, 0.04, 4), M.lbThread);
    buckleHeartTip.position.set(0, 0.022, 0.34); buckleHeartTip.scale.set(1, 1, 0.5);

    // Connecting threads between the hearts (forming the trinity binding)
    const link1 = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.045, 4), M.lbGold);
    link1.position.set(-0.02, 0.025, 0.39); link1.rotation.z = -Math.PI / 4;
    torso.add(link1);
    const link2 = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.045, 4), M.lbGold);
    link2.position.set(0.02, 0.025, 0.39); link2.rotation.z = Math.PI / 4;
    torso.add(link2);
    const link3 = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.045, 4), M.lbGold);
    link3.position.set(0, -0.005, 0.39); link3.rotation.z = Math.PI / 2;
    torso.add(link3);

    // Gold-thread sigils flanking the emblem
    for (let side = -1; side <= 1; side += 2) {
      const sigil = mesh(new THREE.BoxGeometry(0.005, 0.32, 0.005), M.lbThread);
      sigil.position.set(side * 0.18, 0.0, 0.36);
      sigil.rotation.z = side * 0.3;
      torso.add(sigil);
      // Tiny heart sigils
      for (let i = 0; i < 2; i++) {
        const ts = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.lbThread);
        ts.position.set(side * (0.16 + i * 0.04), 0.05 - i * 0.06, 0.37); ts.scale.set(1, 1.3, 0.4);
        torso.add(ts);
      }
    }

    // High collar — cream with gold trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.lbCream);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.lbGold);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft rose shoulder caps with gold trim
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.rose);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Gold trim along cap rim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.01, 8, 16), M.lbGold);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Tiny heart on each shoulder
      const shoulderHeart = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.lbThread);
      shoulderHeart.position.set(side * 0.42, 2.27, 0); shoulderHeart.scale.set(1, 1.3, 0.5);
      root.add(shoulderHeart);
    }

    // ARMS — rose cloth + cream cuff with gold ring
    const armPalette = { cloth: M.rose, mid: M.roseHi, dark: M.roseDark, hi: M.lbCream, accent: M.lbGold };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Cream-and-gold cuffs at the wrists with heart inset
    [leftArm, rightArm].forEach(arm => {
      const cuff = mesh(new THREE.CylinderGeometry(0.092, 0.088, 0.08, 14), M.lbCream);
      cuff.position.y = -0.85; arm.add(cuff);
      const cuffTrim = mesh(new THREE.TorusGeometry(0.094, 0.008, 6, 16), M.lbGold);
      cuffTrim.rotation.x = Math.PI / 2; cuffTrim.position.y = -0.81;
      arm.add(cuffTrim);
      // Pink heart inset
      const heartInset = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.lbThread);
      heartInset.position.set(0, -0.85, 0.085); heartInset.scale.set(1, 1.3, 0.5);
      arm.add(heartInset);
    });

    // SOUL-TETHER WAND — held in right hand
    const wand = this._buildSoulWand();
    rightArm.userData.hand.add(wand);
    wand.position.set(0, 0.04, 0.06);
    wand.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = wand;

    // Long flowing CAPE — rose-cream layered split
    const cape = buildCape({ material: M.lbCape, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape gold-trim along bottom
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.015, 8, 28, Math.PI), M.lbGold);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.55, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — face + light circlet
    const head = this._buildLbHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== HEART-CHAIN HALO — chain of small linked hearts forming a halo above the head =====
    this.heartHaloBaseY = 2.94;
    const haloGroup = new THREE.Group();
    haloGroup.position.set(0, this.heartHaloBaseY, 0);
    const HALO_HEARTS = 8;
    for (let i = 0; i < HALO_HEARTS; i++) {
      const a = (i / HALO_HEARTS) * Math.PI * 2;
      // Each "heart" = 2 lobes + a tiny tip, all glowing
      const heartGroup = new THREE.Group();
      const lobeL = mesh(new THREE.SphereGeometry(0.015, 10, 8), M.lbThread);
      lobeL.position.set(-0.011, 0.011, 0); lobeL.scale.set(1, 1, 0.5);
      heartGroup.add(lobeL);
      const lobeR = lobeL.clone(); lobeR.position.x = 0.011;
      heartGroup.add(lobeR);
      const tip = mesh(new THREE.ConeGeometry(0.02, 0.026, 4), M.lbThread);
      tip.position.set(0, -0.012, 0); tip.scale.set(1, 1, 0.5);
      tip.rotation.z = Math.PI;
      heartGroup.add(tip);
      // Position around the halo
      heartGroup.position.set(Math.cos(a) * 0.2, 0, Math.sin(a) * 0.2);
      heartGroup.rotation.y = -a;
      haloGroup.add(heartGroup);
      // Connecting thread to next heart (small gold link)
      const linkAngle = a + (Math.PI / HALO_HEARTS);
      const link = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.06, 4), M.lbGold);
      link.position.set(Math.cos(linkAngle) * 0.2, 0, Math.sin(linkAngle) * 0.2);
      link.rotation.x = Math.PI / 2;
      link.rotation.z = -linkAngle + Math.PI / 2;
      haloGroup.add(link);
    }
    root.add(haloGroup);
    this.heartHalo = haloGroup;

    M.lbEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.lbEye;
  }

  _buildSoulWand() {
    const wand = new THREE.Group();
    // Pommel — small gold orb
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.lbGold);
    wand.add(pommel);
    // Cream + gold-banded haft
    const haft = mesh(new THREE.CylinderGeometry(0.022, 0.024, 0.65, 12), M.lbCream);
    haft.position.y = 0.36; wand.add(haft);
    // Gold bands spaced along the haft
    for (let i = 0; i < 5; i++) {
      const band = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.014, 12), M.lbGold);
      band.position.y = 0.1 + i * 0.13; wand.add(band);
    }
    // Mid-haft pink gem
    const midGem = mesh(new THREE.SphereGeometry(0.024, 12, 10), M.lbThread);
    midGem.position.y = 0.36; midGem.scale.set(1, 0.5, 1);
    wand.add(midGem);
    // Top section — gold cradle holding a heart-orb
    const cradle = mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.06, 12), M.lbGold);
    cradle.position.y = 0.72; wand.add(cradle);
    // 4 gold filigrees curving up
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const filagree = mesh(new THREE.CylinderGeometry(0.006, 0.004, 0.1, 6), M.lbGold);
      filagree.position.set(Math.cos(a) * 0.05, 0.78, Math.sin(a) * 0.05);
      filagree.rotation.z = -Math.cos(a) * 0.5;
      filagree.rotation.x = -Math.sin(a) * 0.5;
      wand.add(filagree);
    }
    // HEART-ORB at the top — large pink heart
    const orbLobeL = mesh(new THREE.SphereGeometry(0.045, 14, 12), M.lbThread);
    orbLobeL.position.set(-0.025, 0.84, 0); orbLobeL.scale.set(1, 1, 0.6);
    wand.add(orbLobeL);
    const orbLobeR = orbLobeL.clone(); orbLobeR.position.x = 0.025;
    wand.add(orbLobeR);
    const orbTip = mesh(new THREE.ConeGeometry(0.06, 0.07, 4), M.lbThread);
    orbTip.position.set(0, 0.79, 0); orbTip.scale.set(1, 1, 0.6);
    orbTip.rotation.z = Math.PI;
    wand.add(orbTip);
    // Inner glow heart (smaller, brighter)
    const innerHeartL = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.roseHi);
    innerHeartL.position.set(-0.014, 0.84, 0.02);
    wand.add(innerHeartL);
    const innerHeartR = innerHeartL.clone(); innerHeartR.position.x = 0.014;
    wand.add(innerHeartR);
    // Trailing pink threads from the heart-orb (3 dangling threads)
    for (let i = -1; i <= 1; i++) {
      const thread = mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.18, 6), M.lbThread);
      thread.position.set(i * 0.018, 0.7, 0.04);
      thread.rotation.z = i * 0.1;
      wand.add(thread);
      // Tiny heart at the end of each thread
      const threadHeart = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.lbThread);
      threadHeart.position.set(i * 0.018, 0.6, 0.04); threadHeart.scale.set(1, 1.3, 0.5);
      wand.add(threadHeart);
    }
    return wand;
  }

  _buildLbHead() {
    const head = new THREE.Group();

    // Hair scalp — cream-blonde
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.lbCream);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Long flowing hair (rose-cream side bangs)
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.SphereGeometry(0.12, 14, 10), M.lbCream);
      sideHair.position.set(side * 0.16, -0.05, 0.0); sideHair.scale.set(0.7, 1.5, 0.9);
      head.add(sideHair);
    }
    // Back hair (long flowing)
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.lbCream);
    backHair.scale.set(1.05, 1.6, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);

    // Soft gold circlet — three linked hearts around the head
    const circlet = mesh(new THREE.TorusGeometry(0.21, 0.008, 8, 24), M.lbGold);
    circlet.rotation.x = Math.PI / 2;
    circlet.position.y = 0.04;
    head.add(circlet);
    // Front-center pink heart on the circlet
    const browHeartL = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.lbThread);
    browHeartL.position.set(-0.012, 0.06, 0.21); browHeartL.scale.set(1, 1.2, 0.5);
    head.add(browHeartL);
    const browHeartR = browHeartL.clone(); browHeartR.position.x = 0.012;
    head.add(browHeartR);
    const browHeartTip = mesh(new THREE.ConeGeometry(0.024, 0.028, 4), M.lbThread);
    browHeartTip.position.set(0, 0.046, 0.21); browHeartTip.scale.set(1, 1, 0.5);
    browHeartTip.rotation.z = Math.PI;
    head.add(browHeartTip);

    // Eyes — rose-pink life glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.lbEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (gentle smile)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.roseDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Tiny pink dot on each cheek (cosmetic blush)
    for (let side = -1; side <= 1; side += 2) {
      const blush = mesh(new THREE.SphereGeometry(0.02, 8, 6), M.roseHi);
      blush.position.set(side * 0.115, -0.085, 0.21); blush.scale.set(1.2, 0.7, 0.3);
      head.add(blush);
    }

    return head;
  }
}

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.45, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

// ─── Lighting (3-point + counter-rim) ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x4a4a5a, 0.32));
const key = new THREE.DirectionalLight(0xfff0d8, 1.6);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8090c8, 0.55);
fill.position.set(-4, 4, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffaa50, 0.85);
rim.position.set(-2, 3, -5);
scene.add(rim);
const rimAmber = new THREE.PointLight(0xff8030, 1.2, 8, 1.5);
rimAmber.position.set(0, 1.7, -2.2);
scene.add(rimAmber);

// ─── Dais ─────────────────────────────────────────────────────────────────
const daisGroup = new THREE.Group();
const daisBase = mesh(new THREE.CylinderGeometry(2.2, 2.5, 0.18, 64), M.stone, { receive: true });
daisBase.position.y = 0.04; daisGroup.add(daisBase);
const daisTop = mesh(new THREE.CylinderGeometry(2.0, 2.05, 0.06, 64), M.stoneDark, { receive: true });
daisTop.position.y = 0.16; daisGroup.add(daisTop);
const daisRing = mesh(new THREE.TorusGeometry(2.0, 0.04, 12, 64), M.brass);
daisRing.rotation.x = Math.PI / 2; daisRing.position.y = 0.19; daisGroup.add(daisRing);
// 8 small runic engravings around the dais
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const rune = mesh(new THREE.BoxGeometry(0.18, 0.005, 0.04), M.stoneRune);
  rune.position.set(Math.cos(a) * 1.85, 0.195, Math.sin(a) * 1.85);
  rune.rotation.y = -a + Math.PI / 2;
  daisGroup.add(rune);
}
// Subtle cracks
for (let i = 0; i < 6; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.5 + Math.random() * 1.3;
  const crack = mesh(new THREE.BoxGeometry(0.4 + Math.random() * 0.4, 0.001, 0.012), M.stoneDark);
  crack.position.set(Math.cos(a) * r, 0.193, Math.sin(a) * r);
  crack.rotation.y = Math.random() * Math.PI;
  daisGroup.add(crack);
}
scene.add(daisGroup);

// ─── Aura ring (color-tinted per class) ───────────────────────────────────
const auraGeo = new THREE.RingGeometry(2.05, 2.35, 96, 1);
const auraMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8020) }, uOpacity: { value: 0.55 } },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xy);
      float a = atan(vPos.y, vPos.x);
      float pulse = 0.55 + 0.45 * sin(uTime * 1.2 + a * 4.0);
      float band = smoothstep(2.05, 2.18, r) * smoothstep(2.35, 2.18, r);
      gl_FragColor = vec4(uColor * pulse * 1.4, band * uOpacity * pulse);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});
const aura = new THREE.Mesh(auraGeo, auraMat);
aura.rotation.x = -Math.PI / 2;
aura.position.y = 0.205;
scene.add(aura);

// ─── Floating embers ──────────────────────────────────────────────────────
const EMBER_COUNT = 220;
const emberPositions = new Float32Array(EMBER_COUNT * 3);
const emberSeeds = new Float32Array(EMBER_COUNT);
for (let i = 0; i < EMBER_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4.5;
  emberPositions[i*3 + 0] = Math.cos(a) * r;
  emberPositions[i*3 + 1] = Math.random() * 4.5;
  emberPositions[i*3 + 2] = Math.sin(a) * r;
  emberSeeds[i] = Math.random();
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('seed', new THREE.Float32BufferAttribute(emberSeeds, 1));
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

// ─── Post-processing ──────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.78, 0.4, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ───────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Class registry ───────────────────────────────────────────────────────
const classRegistry = {
  cleric: {
    name: 'Cleric',
    family: 'Healer · I/VI',
    role: 'Standard Holy Healer',
    accent: '#eaeaff',
    accentGlow: 'rgba(234, 234, 255, 0.5)',
    auraColor: 0xc8d0ff,
    emberColor: new THREE.Color(0.95, 0.95, 1.0),
    abilities: { attack: 'Holy Bolt', spell1: 'Greater Heal', spell2: 'Group Mend' },
    factory: () => new Cleric(scene, new THREE.Vector3(0, 0, 0)),
  },
  druid: {
    name: 'Druid',
    family: 'Healer · II/VI',
    role: 'HoT Specialist · Living Seed',
    accent: '#80e0c0',
    accentGlow: 'rgba(128, 224, 192, 0.5)',
    auraColor: 0x40c090,
    emberColor: new THREE.Color(0.4, 0.85, 0.7),
    abilities: { attack: 'Wrath', spell1: 'Rejuvenation', spell2: 'Wild Growth' },
    factory: () => new Druid(scene, new THREE.Vector3(0, 0, 0)),
  },
  templar: {
    name: 'Templar',
    family: 'Healer · III/VI',
    role: 'Low Heals · Big Buffs',
    accent: '#ffd8a8',
    accentGlow: 'rgba(255, 216, 168, 0.5)',
    auraColor: 0xffc890,
    emberColor: new THREE.Color(1.0, 0.82, 0.6),
    abilities: { attack: 'Smite Lite', spell1: 'Blessed Ward', spell2: 'Sanctuary' },
    factory: () => new Templar(scene, new THREE.Vector3(0, 0, 0)),
  },
  oracle: {
    name: 'Oracle',
    family: 'Healer · IV/VI',
    role: 'Cleanse · Foresight',
    accent: '#d0a8ff',
    accentGlow: 'rgba(208, 168, 255, 0.5)',
    auraColor: 0xc090ff,
    emberColor: new THREE.Color(0.8, 0.65, 1.0),
    abilities: { attack: 'Mind Pierce', spell1: 'Cleansing Light', spell2: 'Foresight' },
    factory: () => new Oracle(scene, new THREE.Vector3(0, 0, 0)),
  },
  bloodpriest: {
    name: 'Bloodpriest',
    family: 'Healer · V/VI',
    role: 'Heals via Damage · Sanguine Bond',
    accent: '#ff5878',
    accentGlow: 'rgba(255, 88, 120, 0.5)',
    auraColor: 0xd02040,
    emberColor: new THREE.Color(1.0, 0.4, 0.5),
    abilities: { attack: 'Crimson Lash', spell1: 'Sanguine Bond', spell2: 'Hemorrhage' },
    factory: () => new Bloodpriest(scene, new THREE.Vector3(0, 0, 0)),
  },
  lifebinder: {
    name: 'Lifebinder',
    family: 'Healer · VI/VI',
    role: 'Chain Heals · Damage-Splitting',
    accent: '#ffa8d0',
    accentGlow: 'rgba(255, 168, 208, 0.5)',
    auraColor: 0xff80b8,
    emberColor: new THREE.Color(1.0, 0.7, 0.85),
    abilities: { attack: 'Soul Tether', spell1: 'Chain Mend', spell2: 'Communion' },
    factory: () => new Lifebinder(scene, new THREE.Vector3(0, 0, 0)),
  },
};

// ─── Build all champions up front (single per class — viewer only shows one)
const champions = {};
for (const key in classRegistry) {
  const champ = classRegistry[key].factory();
  champ.group.visible = false;
  champions[key] = champ;
}
let activeChampion = champions.cleric;
activeChampion.group.visible = true;

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

// ─── UI wiring ────────────────────────────────────────────────────────────
document.getElementById('classSelect').addEventListener('change', (e) => {
  selectClass(e.target.value);
});

const abilityButtons = document.querySelectorAll('.ab-btn');
abilityButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeChampion || activeChampion.isPlaying()) return;
    const animName = btn.dataset.anim;
    activeChampion.playAnimation(animName, clock.getElapsedTime(), effectMgr);
    btn.classList.add('cooling');
    setTimeout(() => btn.classList.remove('cooling'), (activeChampion.animations[animName]?.duration || 1) * 1000 + 100);
  });
});

let demoMode = false;
let demoIdx = 0;
let demoNextTime = 0;
const demoOrder = ['attack', 'spell1', 'attack', 'spell2'];
document.getElementById('demoBtn').addEventListener('click', (e) => {
  demoMode = !demoMode;
  demoIdx = 0;
  e.target.textContent = demoMode ? '⏸ Stop Demo' : '▶ Cycle Animations';
  demoNextTime = clock.getElapsedTime() + 0.4;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('cleric');

// Hide loading splash
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);

animate();

</script>
</body>
</html>
