  linear: t => t,
  inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class FilledShockwave extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;
    this.mesh.scale.setScalar(0.2);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(0.2, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.55;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

    this.startRadius = opts.startRadius ?? 0.4;
    this.rotateSpeed = opts.rotateSpeed ?? 0.7;
    this.runeCount = opts.runeCount ?? 8;
    const geo = new THREE.RingGeometry(0.85, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {
  constructor(scene, position, opts = {}) {

    this.duration = opts.duration ?? 3.2;
    this.radius = opts.radius ?? 1.8;
    const geo = new THREE.RingGeometry(0.05, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x);
          float outerRing = smoothstep(0.93, 0.97, r) * smoothstep(1.0, 0.97, r);
          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);
          float fill = smoothstep(0.97, 0.0, r) * 0.08;
          float runeAng = mod(a + uTime * -0.5, 6.28318 / 12.0) * 12.0;
          float runes = smoothstep(0.4, 0.5, sin(runeAng)) * smoothstep(0.78, 0.85, r) * smoothstep(0.92, 0.85, r);
          float pulse = 0.7 + 0.3 * sin(uTime * 3.0);
          float intensity = (outerRing + midRing * 0.7 + star * 0.9 + runes * 1.1) * pulse + fill;
          gl_FragColor = vec4(uColor * intensity * 1.7, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);

      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec2 vUv;
        void main() {
          float vertical = smoothstep(1.0, 0.0, vUv.y) * smoothstep(0.0, 0.15, vUv.y);

          float pattern = sin(vUv.y * 30.0 - uTime * 8.0) * 0.5 + 0.5;

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

// ─── Shared part builders ──────────────────────────────────────────────────
function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.iron;
  const mid = palette.mid || M.ironHi;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.iron;
  const dark = palette.dark || M.iron;
  const hi = palette.hi || M.ironHi;
  const accent = palette.accent || M.brass;
  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);
  const knuckle = mesh(new THREE.BoxGeometry(0.16, 0.05, 0.08), accent);
  knuckle.position.set(0, -0.85, 0.05); arm.add(knuckle);
  const hand = new THREE.Group();
  hand.position.y = -0.96;
  arm.add(hand);
  arm.userData.hand = hand;
  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;
  return arm;
}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  CLERIC — Healer I/VI                                                    ║
// ║  Standard Holy Healer · Ivory robes with gold trim, cream cape, hooded  ║
// ║  cowl pulled back, golden chalice chest emblem, holy book + holy mace,  ║
// ║  small floating halo above head, cool moonlight-white eye glow          ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Cleric extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = clericAnimations;
  }

  // Override update — slowly rotate the halo and gently bob it
  update(time, dt) {
    super.update(time, dt);
    if (this.halo) {
      this.halo.rotation.y = time * 0.4;
      this.halo.position.y = this.haloBaseY + Math.sin(time * 1.5) * 0.012;
    }
  }

  build() {
    const root = this.group;

    // Legs — long ivory robe (replaces plate greaves with full cloth drape)
    const buildRobeLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — ivory robe (wider than plate to suggest a long robe)
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.ivory);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin — ivory continues, slightly wider at base for drape
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.5, 14), M.ivoryHi);
      shin.position.y = 0.36; leg.add(shin);
      // Gold trim band at the hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.22, 0.01, 8, 18), M.clerGold);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Sandal/slipper — leather sole
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.leatherDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildRobeLeg(-1));
    root.add(buildRobeLeg(1));

    // Pelvis — gold sash/cincture wrapped tight at waist
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.ivory));
    // Gold cincture (rope belt)
    const cincture = mesh(new THREE.TorusGeometry(0.3, 0.025, 10, 24), M.clerGold);
    cincture.rotation.x = Math.PI / 2; cincture.position.y = 0.05;
    pelvis.add(cincture);
    // Hanging knot at front (rope tassel)
    const knotBall = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.clerGoldHi);
    knotBall.position.set(0, 0.0, 0.32); pelvis.add(knotBall);
    // Two gold tassel cords hanging from knot
    for (let i = -1; i <= 1; i += 2) {
      const cord = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.32, 8), M.clerGold);
      cord.position.set(i * 0.04, -0.16, 0.32); cord.rotation.z = i * 0.05;
      pelvis.add(cord);
      const tip = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.clerGoldHi);
      tip.position.set(i * 0.04, -0.32, 0.32); pelvis.add(tip);
    }
    root.add(pelvis);

    // TORSO — ivory robe with gold trim, chalice chest emblem
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Robe body
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.ivory);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);

    // Vertical gold stoles down the front (priest's stole — two parallel gold strips)
    for (let i = -1; i <= 1; i += 2) {
      const stole = mesh(new THREE.BoxGeometry(0.05, 0.65, 0.012), M.clerGoldHi);
      stole.position.set(i * 0.07, 0.0, 0.36);
      torso.add(stole);
    }

    // CHEST EMBLEM — golden chalice (the marquee Cleric symbol)
    const chaliceBack = mesh(new THREE.CircleGeometry(0.07, 16), M.ivoryDark);
    chaliceBack.position.set(0, 0.05, 0.36); torso.add(chaliceBack);
    // Cup of the chalice
    const cup = mesh(new THREE.CylinderGeometry(0.04, 0.025, 0.04, 14, 1, true), M.clerGoldHi);
    cup.position.set(0, 0.09, 0.38); torso.add(cup);
    // Chalice bowl rim
    const cupRim = mesh(new THREE.TorusGeometry(0.04, 0.005, 6, 14), M.clerGoldHi);
    cupRim.rotation.x = Math.PI / 2; cupRim.position.set(0, 0.11, 0.38);
    torso.add(cupRim);
    // Stem
    const stem = mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.04, 8), M.clerGoldHi);
    stem.position.set(0, 0.05, 0.38); torso.add(stem);
    // Foot/base
    const chBase = mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.012, 12), M.clerGoldHi);
    chBase.position.set(0, 0.025, 0.38); torso.add(chBase);
    // Light glow inside the chalice (hint of moonlight inside)
    const cupGlow = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.clerHalo);
    cupGlow.position.set(0, 0.1, 0.38); cupGlow.scale.set(1, 0.3, 0.5);
    torso.add(cupGlow);

    // Pec mounds (ivory shaping)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.ivoryHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Gold collar/yoke around the neck
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.ivoryHi);
    collar.position.y = 0.4; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.clerGoldHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.46;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft cloth shoulder caps — ivory, no plate
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.ivory);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Gold trim along the cap rim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.01, 8, 16), M.clerGold);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
    }

    // ARMS — long ivory sleeves with gold cuff
    const armPalette = { cloth: M.ivory, mid: M.ivoryHi, dark: M.ivoryDark, hi: M.ivoryHi, accent: M.clerGold };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Gold sleeve cuffs at the wrist
    [leftArm, rightArm].forEach(arm => {
      const cuff = mesh(new THREE.CylinderGeometry(0.092, 0.088, 0.08, 14), M.clerGold);
      cuff.position.y = -0.85; arm.add(cuff);
      const cuffTrim = mesh(new THREE.TorusGeometry(0.094, 0.008, 6, 16), M.clerGoldHi);
      cuffTrim.rotation.x = Math.PI / 2; cuffTrim.position.y = -0.81;
      arm.add(cuffTrim);
    });

    // HOLY BOOK — held in left hand (closed leather-bound book with gold cross)
    const book = this._buildHolyBook();
    leftArm.userData.hand.add(book);
    book.position.set(0, 0.0, 0.06);
    book.rotation.set(0, 0, 0);
    this.parts.book = book;

    // HOLY MACE — held in right hand (gold-headed)
    const mace = this._buildHolyMace();
    rightArm.userData.hand.add(mace);
    mace.position.set(0, 0.04, 0.06);
    mace.rotation.set(Math.PI * 0.4, 0, 0);
    this.parts.weapon = mace;

    // CAPE — cream priestly cape
    const cape = buildCape({ material: M.clerCape, width: 1.35, height: 1.85 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — uncovered face (no helm, just face + small cowl collar at neck)
    const head = this._buildClericHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // FLOATING HALO — small ring above head (the marquee Cleric feature)
    this.haloBaseY = 2.92;
    const haloGroup = new THREE.Group();
    haloGroup.position.set(0, this.haloBaseY, 0);
    // Main ring
    const haloRing = mesh(new THREE.TorusGeometry(0.18, 0.012, 10, 32), M.clerHalo);
    haloRing.rotation.x = Math.PI / 2.4;
    haloGroup.add(haloRing);
    // Inner glow ring (slightly thicker, behind)
    const haloGlow = mesh(new THREE.TorusGeometry(0.18, 0.025, 10, 32), M.clerHalo);
    haloGlow.rotation.x = Math.PI / 2.4;
    haloGlow.material = M.clerHalo;
    haloGroup.add(haloGlow);
    // 6 tiny prayer-light dots around the halo
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const dot = mesh(new THREE.SphereGeometry(0.015, 10, 8), M.clerHalo);
      dot.position.set(Math.cos(a) * 0.18, Math.sin(Math.PI / 2.4) * 0.0, Math.sin(a) * 0.18 * Math.cos(Math.PI / 2.4));
      // Position dots along the tilted ring
      dot.position.set(Math.cos(a) * 0.18, -Math.sin(Math.PI / 2.4) * Math.sin(a) * 0.18, Math.sin(a) * 0.18 * Math.cos(Math.PI / 2.4));
      haloGroup.add(dot);
    }
    root.add(haloGroup);
    this.halo = haloGroup;

    M.clerEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.clerEye;
  }

  _buildHolyBook() {
    const book = new THREE.Group();
    // Leather cover (front)
    const front = mesh(new THREE.BoxGeometry(0.16, 0.22, 0.012), M.leatherDark);
    front.position.set(0, 0, 0.025); book.add(front);
    // Back cover
    const back = mesh(new THREE.BoxGeometry(0.16, 0.22, 0.012), M.leatherDark);
    back.position.set(0, 0, -0.025); book.add(back);
    // Pages (cream)
    const pages = mesh(new THREE.BoxGeometry(0.155, 0.215, 0.04), M.ivoryHi);
    pages.position.set(0, 0, 0); book.add(pages);
    // Gold spine
    const spine = mesh(new THREE.BoxGeometry(0.018, 0.22, 0.06), M.clerGold);
    spine.position.set(-0.082, 0, 0); book.add(spine);
    // Gold cross on the front cover (vertical + horizontal)
    const crossV = mesh(new THREE.BoxGeometry(0.018, 0.1, 0.008), M.clerGoldHi);
    crossV.position.set(0, 0.03, 0.034); book.add(crossV);
    const crossH = mesh(new THREE.BoxGeometry(0.06, 0.018, 0.008), M.clerGoldHi);
    crossH.position.set(0, 0.05, 0.034); book.add(crossH);
    // Gold corner reinforcements (small studs)
    for (let xs = -1; xs <= 1; xs += 2) {
      for (let ys = -1; ys <= 1; ys += 2) {
        const stud = mesh(new THREE.BoxGeometry(0.018, 0.018, 0.005), M.clerGoldHi);
        stud.position.set(xs * 0.06, ys * 0.09, 0.034); book.add(stud);
      }
    }
    // Ribbon bookmark dangling from bottom
    const ribbon = mesh(new THREE.BoxGeometry(0.012, 0.08, 0.002), M.clerGoldHi);
    ribbon.position.set(0.04, -0.14, 0); book.add(ribbon);
    return book;
  }

  _buildHolyMace() {
    const mace = new THREE.Group();
    // Pommel — gold sphere
    const pommel = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.clerGoldHi);
    mace.add(pommel);
    // Wood haft wrapped in cream cord
    const haft = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.5, 12), M.bark);
    haft.position.y = 0.27; mace.add(haft);
    // Cream cord wrap
    for (let i = 0; i < 7; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.ivoryHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.05 + i * 0.06;
      mace.add(wrap);
    }
    // Mid-haft gold collar
    const midCollar = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.04, 10), M.clerGoldHi);
    midCollar.position.y = 0.27; mace.add(midCollar);
    // Top collar where head meets haft
    const topCollar = mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.06, 10), M.clerGoldHi);
    topCollar.position.y = 0.52; mace.add(topCollar);
    // MACE HEAD — fluted gold sphere with cross on top
    const head = mesh(new THREE.SphereGeometry(0.075, 16, 12), M.clerGold);
    head.position.y = 0.62; mace.add(head);
    // Vertical fluted ridges (6 around the sphere)
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const flute = mesh(new THREE.BoxGeometry(0.012, 0.14, 0.012), M.clerGoldHi);
      flute.position.set(Math.cos(a) * 0.072, 0.62, Math.sin(a) * 0.072);
      flute.rotation.y = -a;
      mace.add(flute);
    }
    // Top cross (vertical + horizontal arms)
    const topCrossV = mesh(new THREE.BoxGeometry(0.014, 0.07, 0.014), M.clerGoldHi);
    topCrossV.position.y = 0.74; mace.add(topCrossV);
    const topCrossH = mesh(new THREE.BoxGeometry(0.04, 0.014, 0.014), M.clerGoldHi);
    topCrossH.position.y = 0.755; mace.add(topCrossH);
    // Tiny halo glow at the top (gem at intersection)
    const topGem = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.clerHalo);
    topGem.position.y = 0.755; mace.add(topGem);
    return mace;
  }

  _buildClericHead() {
    const head = new THREE.Group();

    // Bare head — short hair (close-cropped, soft tonsure)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.bark);
    scalp.scale.set(1, 1.05, 1.05);
    scalp.position.y = 0.04;
    head.add(scalp);

    // Face skin (forward)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Tonsure ring (ring of bare scalp on top — clerical haircut)
    const tonsureCap = mesh(new THREE.SphereGeometry(0.13, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2.5), M.skin);
    tonsureCap.position.y = 0.16;
    head.add(tonsureCap);

    // Gold circlet across the brow (modest, distinct from Crusader's full halo-rays)
    const circlet = mesh(new THREE.TorusGeometry(0.21, 0.01, 8, 24), M.clerGold);
    circlet.rotation.x = Math.PI / 2;
    circlet.position.y = 0.02;
    head.add(circlet);
    // Small gold cross at front of circlet
    const browCrossV = mesh(new THREE.BoxGeometry(0.012, 0.04, 0.008), M.clerGoldHi);
    browCrossV.position.set(0, 0.04, 0.21); head.add(browCrossV);
    const browCrossH = mesh(new THREE.BoxGeometry(0.025, 0.012, 0.008), M.clerGoldHi);
    browCrossH.position.set(0, 0.05, 0.21); head.add(browCrossH);

    // Eyes — gentle moonlight glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.03, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.clerEye);
    eyeL.position.set(-0.075, -0.025, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (calm closed line)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Cowl/hood collar at the back of the neck (folded down — hood is back, not up)
    const cowlBack = mesh(new THREE.SphereGeometry(0.24, 16, 10, 0, Math.PI, Math.PI / 2.4, Math.PI / 2.4), M.ivory);
    cowlBack.position.set(0, -0.06, -0.1); cowlBack.scale.set(1.1, 0.6, 1.2);
    cowlBack.rotation.y = Math.PI;
    head.add(cowlBack);

    return head;
  }
}

        head:     { rx: -0.1 },
      }},
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.25, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        // Big white-blue holy circle (party heal AoE)
        mgr.spawn(new HolyCircle(champ.scene, pos, { color: 0xeaeaff, radius: 2.4, duration: 1.5 }), time);
        // Outer rune ring
        mgr.spawn(new RuneRing(champ.scene, pos, { color: 0xc8d0ff, maxRadius: 2.8, duration: 1.4, runeCount: 12, rotateSpeed: 0.7 }), time);
        // Outward shockwave (the benediction wave)
        mgr.spawn(new ShockwaveRing(champ.scene, pos, { color: 0xeaeaff, maxRadius: 3.0, duration: 0.85 }), time);
        // Light pillar from cleric (the proclamation)
        mgr.spawn(new LightPillar(champ.scene, pos, { color: 0xeaeaff, height: 4.5, radius: 0.6, duration: 0.9 }), time);
        // Particle bloom from chest
        const chestPos = pos.clone(); chestPos.y = 1.9;
        mgr.spawn(new ParticleBurst(champ.scene, chestPos, { color: 0xc8d0ff, count: 70, speed: 3.5, duration: 1.4, upwardBias: 1.6, gravity: -0.8 }), time);
      }},
      { time: 0.55, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        // Secondary cascading shockwave (the heal pulse propagating)
        mgr.spawn(new ShockwaveRing(champ.scene, pos, { color: 0xffffff, maxRadius: 2.0, duration: 0.7 }), time);
      }},
    ],
  },
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  DRUID — Healer II/VI                                                    ║
// ║  HoT Specialist · Living Seed · Sage robes with bark-leather vest, leaf  ║
// ║  crown circlet, gnarled vine-wrapped staff with crystal cluster, oak    ║
// ║  emblem, floating seed-orb orbiting off-hand, sea-green eye glow        ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Druid extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = druidAnimations;
  }

  // Override update — orbit the seed-orbs around the off-hand wrist
  update(time, dt) {
    super.update(time, dt);
    if (this.seedAnchor) this.seedAnchor.rotation.y = time * 0.7;
  }

  build() {
    const root = this.group;

    // Legs — sage robe wraps with bark-leather wraps at the shins
    const buildDruidLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — sage cloth
      const thigh = mesh(new THREE.CylinderGeometry(0.17, 0.15, 0.55, 14), M.sage);
      thigh.position.y = 0.95; leg.add(thigh);
      // Mid-shin — bark-leather wrap
      const shin = mesh(new THREE.CylinderGeometry(0.135, 0.16, 0.5, 14), M.bark);
      shin.position.y = 0.36; leg.add(shin);
      // Sage trim above the bark wrap
      const trim = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, 14), M.sageHi);
      trim.position.y = 0.62; leg.add(trim);
      // Bark cord wraps along shin
      for (let i = 0; i < 4; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.135, 0.008, 6, 14), M.barkHi);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.5 - i * 0.08;
        leg.add(wrap);
      }
      // Leather sandal sole
      const sole = mesh(new THREE.BoxGeometry(0.22, 0.05, 0.32), M.leatherDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      // Bare foot toes peeking
      const foot = mesh(new THREE.BoxGeometry(0.18, 0.04, 0.26), M.skin);
      foot.position.set(0, 0.1, 0.06); leg.add(foot);
      // Decorative leaf on the boot
      const bootLeaf = mesh(new THREE.SphereGeometry(0.022, 8, 6), M.leafHi);
      bootLeaf.position.set(0, 0.13, 0.18); bootLeaf.scale.set(1, 0.4, 1.4);
      leg.add(bootLeaf);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildDruidLeg(-1));
    root.add(buildDruidLeg(1));

    // Pelvis — bark leather belt with hanging pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.bark));
    // Wide leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.12, 18), M.barkHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Bronze buckle (amber)
    const buckle = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.amber);
    buckle.position.set(0, 0.04, 0.32); buckle.scale.set(1.4, 0.8, 0.5);
    pelvis.add(buckle);
    // Side pouches (leather sacks hanging from belt)
    for (let i = -1; i <= 1; i += 2) {
      const pouch = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.bark);
      pouch.position.set(i * 0.28, -0.08, 0.16); pouch.scale.set(1, 1.4, 0.7);
      pelvis.add(pouch);
      // Pouch tie cord
      const tie = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.06, 4), M.barkHi);
      tie.position.set(i * 0.28, 0.04, 0.18);
      pelvis.add(tie);
    }
    // Hanging acorn trinket at front
    const acornTop = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.bark);
    acornTop.position.set(0.05, -0.08, 0.34); pelvis.add(acornTop);
    const acornCap = mesh(new THREE.SphereGeometry(0.022, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.barkHi);
    acornCap.position.set(0.05, -0.06, 0.34); pelvis.add(acornCap);
    // Sage robe folds at the front (long apron-like drop below the belt)
    const apron = mesh(new THREE.BoxGeometry(0.35, 0.4, 0.018), M.sage);
    apron.position.set(0, -0.22, 0.31); apron.rotation.x = -0.04;
    pelvis.add(apron);
    // Apron leaf trim along the bottom
    const apronTrim = mesh(new THREE.BoxGeometry(0.36, 0.03, 0.022), M.leaf);
    apronTrim.position.set(0, -0.41, 0.32); pelvis.add(apronTrim);
    root.add(pelvis);

    // TORSO — sage cloth robe under bark-leather vest
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Sage robe underlayer
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 16), M.sage);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);

    // Bark-leather vest (front-only, partial coverage)
    const vest = mesh(new THREE.CylinderGeometry(0.37, 0.35, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.bark);
    vest.scale.set(1.05, 1, 0.85);
    vest.position.y = 0.04;
    torso.add(vest);

    // Vest buttons / lacing (3 amber stones down the front)
    for (let i = 0; i < 3; i++) {
      const btn = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.amber);
      btn.position.set(0, 0.18 - i * 0.16, 0.4); btn.scale.set(1, 1, 0.5);
      torso.add(btn);
    }

    // Pec mounds (vest-shaped)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.barkHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — oak leaf + acorn medallion (the marquee Druid symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.barkHi);
    emblemBack.position.set(0, 0.05, 0.41); torso.add(emblemBack);
    // Oak leaf (extruded shape, central)
    const oakShape = new THREE.Shape();
    oakShape.moveTo(0, 0.06); oakShape.bezierCurveTo(0.04, 0.05, 0.06, 0.0, 0.04, -0.04);
    oakShape.bezierCurveTo(0.025, 0.0, 0.03, -0.06, 0, -0.07);
    oakShape.bezierCurveTo(-0.03, -0.06, -0.025, 0.0, -0.04, -0.04);
    oakShape.bezierCurveTo(-0.06, 0.0, -0.04, 0.05, 0, 0.06);
    oakShape.closePath();
    const oakLeaf = mesh(new THREE.ExtrudeGeometry(oakShape, { depth: 0.008, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 1 }), M.leafHi);
    oakLeaf.position.set(0, 0.05, 0.42); torso.add(oakLeaf);
    // Tiny acorn next to leaf
    const acornBody = mesh(new THREE.SphereGeometry(0.015, 10, 8), M.barkHi);
    acornBody.position.set(0.04, 0.0, 0.42); torso.add(acornBody);
    const acornCap2 = mesh(new THREE.SphereGeometry(0.018, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.bark);
    acornCap2.position.set(0.04, 0.02, 0.42); torso.add(acornCap2);

    // Vine sigils trailing down from emblem (glowing rune lines)
    for (let side = -1; side <= 1; side += 2) {
      const vine = mesh(new THREE.BoxGeometry(0.005, 0.22, 0.005), M.druidRune);
      vine.position.set(side * 0.14, -0.05, 0.4);
      vine.rotation.z = side * 0.3;
      torso.add(vine);
      // Tiny rune sigils along
      for (let i = 0; i < 2; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.018, 0.012, 0.005), M.druidRune);
        sigil.position.set(side * (0.13 + i * 0.04), -0.05 - i * 0.06, 0.4);
        sigil.rotation.z = side * 0.3;
        torso.add(sigil);
      }
    }

    // Neck collar — bark with leaf trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.bark);
    collar.position.y = 0.4; torso.add(collar);
    const collarLeaves = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 18), M.leaf);
    collarLeaves.rotation.x = Math.PI / 2; collarLeaves.position.y = 0.45;
    torso.add(collarLeaves);

    root.add(torso);
    this.parts.body = torso;

    // Soft sage shoulder caps (no plate)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.sage);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Bark trim along the cap
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.bark);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Decorative leaf at the top of the shoulder
      const shoulderLeaf = mesh(new THREE.SphereGeometry(0.025, 10, 6), M.leafHi);
      shoulderLeaf.position.set(side * 0.42, 2.27, 0.05); shoulderLeaf.scale.set(1, 0.4, 1.4);
      root.add(shoulderLeaf);
    }

    // ARMS — sage cloth + bark cuff
    const armPalette = { cloth: M.sage, mid: M.barkHi, dark: M.bark, hi: M.sageHi, accent: M.amber };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Bark wraps around the forearms (vine-style)
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 14), M.barkHi);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = -0.5 - i * 0.12;
        arm.add(wrap);
      }
    });

    // ===== FLOATING SEED-ORBS — 3 small glowing motes orbiting the LEFT (off-hand) wrist =====
    this.seedAnchor = new THREE.Group();
    this.seedAnchor.position.set(-0.42 + Math.sin(0.18) * 0.0, 1.32, 0);  // approx left-wrist resting position
    // Place anchor near where left wrist rests
    leftArm.userData.hand.add(this.seedAnchor);
    this.seedAnchor.position.set(0, -0.04, 0.04);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const seedShell = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.druidRune);
      seedShell.position.set(Math.cos(a) * 0.14, Math.sin(a) * 0.04, Math.sin(a) * 0.14);
      this.seedAnchor.add(seedShell);
      // Tiny inner core (brighter)
      const seedCore = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.leafHi);
      seedCore.position.copy(seedShell.position);
      this.seedAnchor.add(seedCore);
    }

    // GNARLED VINE STAFF — held in right hand
    const staff = this._buildVineStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.staff = staff;

    // CAPE — sage half-cloak with leaf-trim
    const cape = buildCape({ material: M.sage, width: 1.3, height: 1.6 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — leaf-crown circlet + face with vine markings, no helm
    const head = this._buildDruidHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.druidEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.druidEye;
  }

  _buildVineStaff() {
    const staff = new THREE.Group();
    // Pommel — bark knot (gnarled)
    const pommel = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.barkHi);
    pommel.scale.set(1, 0.8, 1.2);
    staff.add(pommel);
    // Long gnarled wood haft (slightly tapered)
    const haft = mesh(new THREE.CylinderGeometry(0.025, 0.03, 1.1, 12), M.bark);
    haft.position.y = 0.6; staff.add(haft);
    // Bark knots / gnarls along the haft (3 small swells)
    for (let i = 0; i < 3; i++) {
      const knot = mesh(new THREE.SphereGeometry(0.038, 10, 8), M.barkHi);
      knot.position.y = 0.25 + i * 0.28; knot.scale.set(1.1, 0.7, 1.1);
      staff.add(knot);
    }
    // Vine wrap spiraling around the haft (sage thread)
    for (let i = 0; i < 14; i++) {
      const t = i / 13;
      const wrap = mesh(new THREE.TorusGeometry(0.029, 0.005, 5, 12, Math.PI * 1.4), M.leafHi);
      wrap.rotation.y = t * Math.PI * 2.5;
      wrap.rotation.x = Math.PI / 2 + 0.2;
      wrap.position.y = 0.1 + t * 0.95;
      staff.add(wrap);
    }
    // Top headpiece — crystal cluster with leaves
    // Three small leaves around the crystal base
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const leaf = mesh(new THREE.SphereGeometry(0.04, 10, 6), M.leafHi);
      leaf.position.set(Math.cos(a) * 0.05, 1.18, Math.sin(a) * 0.05);
      leaf.scale.set(1.5, 0.4, 0.9);
      leaf.rotation.y = -a;
      leaf.rotation.x = -0.3;
      staff.add(leaf);
    }
    // Central glowing crystal (sea-green rune)
    const crystal = mesh(new THREE.OctahedronGeometry(0.06, 1), M.druidRune);
    crystal.position.y = 1.26; staff.add(crystal);
    // Crystal shine — small sphere inside
    const crystalCore = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.leafHi);
    crystalCore.position.y = 1.26; staff.add(crystalCore);
    // Smaller crystal flanking the main one
    for (let i = -1; i <= 1; i += 2) {
      const minor = mesh(new THREE.OctahedronGeometry(0.022, 1), M.druidRune);
      minor.position.set(i * 0.06, 1.22, 0);
      staff.add(minor);
    }
    return staff;
  }

  _buildDruidHead() {
    const head = new THREE.Group();

    // Brown hair scalp
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.bark);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== LEAF CROWN CIRCLET (the marquee feature) =====
    // Bark base ring
    const crownBase = mesh(new THREE.TorusGeometry(0.21, 0.01, 8, 24), M.barkHi);
    crownBase.rotation.x = Math.PI / 2;
    crownBase.position.y = 0.05;
    head.add(crownBase);
    // 6 leaves arranged around the crown (alternating sizes)
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const big = i % 2 === 0;
      const leaf = mesh(new THREE.SphereGeometry(big ? 0.045 : 0.03, 10, 6), big ? M.leafHi : M.leaf);
      leaf.position.set(Math.cos(a) * 0.21, 0.06 + (big ? 0.02 : 0), Math.sin(a) * 0.21);
      leaf.scale.set(1, 0.3, big ? 1.6 : 1.3);
      // Tilt outward
      leaf.lookAt(Math.cos(a) * 1, 0.5, Math.sin(a) * 1);
      head.add(leaf);
    }
    // Front-center small acorn between two leaves
    const frontAcorn = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.barkHi);
    frontAcorn.position.set(0, 0.07, 0.215); head.add(frontAcorn);
    const frontAcornCap = mesh(new THREE.SphereGeometry(0.022, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.bark);
    frontAcornCap.position.set(0, 0.085, 0.215); head.add(frontAcornCap);

    // Vine markings on the cheeks (curling sea-green rune lines)
    for (let side = -1; side <= 1; side += 2) {
      // Curl 1
      const vine = mesh(new THREE.TorusGeometry(0.04, 0.005, 6, 14, Math.PI * 0.7), M.druidRune);
      vine.position.set(side * 0.13, -0.05, 0.18);
      vine.rotation.z = side * Math.PI / 2;
      head.add(vine);
      // Tiny dot
      const dot = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.druidRune);
      dot.position.set(side * 0.16, -0.1, 0.2);
      head.add(dot);
    }

    // Eyes — sea-green glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.druidEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (calm closed line)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Soft beard wisps (chin) — short forest beard
    const beard = mesh(new THREE.SphereGeometry(0.09, 12, 10), M.bark);
    beard.position.set(0, -0.16, 0.16); beard.scale.set(0.9, 0.6, 0.8);
    head.add(beard);

    return head;
  }
}

  // REJUVENATION — staff touch + gentle HoT pulse on a single ally

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  TEMPLAR — Healer III/VI                                                 ║
// ║  Low Heals · Big Buffs · Pearl-white ceremonial plate, warm copper trim ║
// ║  sun-flare crown helm with radiating copper rays, tower shield with     ║
// ║  copper sunburst, ceremonial mace, cream + gold cape, peach-gold glow   ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Templar extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = templarAnimations;
  }

  build() {
    const root = this.group;

    // Legs — pearl plate greaves with copper trim
    const legPalette = { dark: M.pearlDark, mid: M.pearl, accent: M.copper, trim: M.copperHi, leather: M.leatherDark };
    root.add(buildLeg(-1, legPalette));
    root.add(buildLeg(1, legPalette));

    // Pelvis — pearl plate with copper-trimmed tassets
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.pearlDark));
    // Copper belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.copper);
    belt.position.y = 0.04; pelvis.add(belt);
    // Copper buckle (sunburst)
    const buckleBack = mesh(new THREE.CircleGeometry(0.05, 16), M.copperHi);
    buckleBack.position.set(0, 0.04, 0.32); pelvis.add(buckleBack);
    const buckleSun = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.templarRune);
    buckleSun.position.set(0, 0.04, 0.34); buckleSun.scale.set(1, 1, 0.5);
    pelvis.add(buckleSun);
    // Tassets — 6 pearl plates with copper sun-rune trim
    for (let i = 0; i < 6; i++) {
      const angle = -Math.PI * 0.5 + (i / 5) * Math.PI * 1.0;
      const tasset = mesh(new THREE.BoxGeometry(0.13, 0.34, 0.03), M.pearl);
      tasset.position.set(Math.cos(angle) * 0.3, -0.21, Math.sin(angle) * 0.3);
      tasset.lookAt(Math.cos(angle) * 2, -0.21, Math.sin(angle) * 2);
      tasset.rotateX(0.06);
      pelvis.add(tasset);
      // Copper sun-rune dot on each tasset
      const dot = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.templarRune);
      dot.position.set(Math.cos(angle) * 0.32, -0.18, Math.sin(angle) * 0.32);
      dot.scale.set(1, 1, 0.4);
      pelvis.add(dot);
    }
    root.add(pelvis);

    // TORSO — pearl ceremonial cuirass with copper trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Pearl chest cuirass
    const cuirass = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.pearl);
    cuirass.scale.set(1.05, 1, 0.85);
    torso.add(cuirass);

    // Pec mounds (pearl)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.pearlHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Vertical copper-rune channels down the front
    for (let side = -1; side <= 1; side += 2) {
      const chan = mesh(new THREE.BoxGeometry(0.012, 0.5, 0.005), M.copperHi);
      chan.position.set(side * 0.13, -0.05, 0.36);
      torso.add(chan);
      // Tiny rune sigils along the channel
      for (let i = 0; i < 3; i++) {
        const sig = mesh(new THREE.BoxGeometry(0.022, 0.012, 0.005), M.templarRune);
        sig.position.set(side * 0.13, 0.12 - i * 0.13, 0.37);
        torso.add(sig);
      }
    }

    // CHEST EMBLEM — copper sunburst with crossed sword-and-key (Templar marquee)
    const emblemBack = mesh(new THREE.CircleGeometry(0.1, 20), M.copperHi);
    emblemBack.position.set(0, 0.05, 0.36); torso.add(emblemBack);
    // 8 sun rays radiating outward (alternating long/short)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const long = i % 2 === 0;
      const len = long ? 0.06 : 0.04;
      const ray = mesh(new THREE.ConeGeometry(0.012, len, 4), M.templarRune);
      ray.position.set(Math.cos(a) * (0.1 + len / 2), 0.05 + Math.sin(a) * (0.1 + len / 2), 0.37);
      ray.rotation.z = a - Math.PI / 2;
      torso.add(ray);
    }
    // Inner sun disc
    const innerSun = mesh(new THREE.CircleGeometry(0.06, 18), M.pearlHi);
    innerSun.position.set(0, 0.05, 0.38); torso.add(innerSun);
    // Crossed sword + key inside the sun
    // Sword (vertical, copper)
    const sword = mesh(new THREE.BoxGeometry(0.012, 0.1, 0.008), M.copperHi);
    sword.position.set(0, 0.05, 0.39); sword.rotation.z = Math.PI / 6;
    torso.add(sword);
    // Sword pommel
    const swordPom = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.copperHi);
    swordPom.position.set(-0.025, 0.005, 0.39); torso.add(swordPom);
    // Key (other diagonal)
    const keyShaft = mesh(new THREE.BoxGeometry(0.012, 0.09, 0.008), M.copperHi);
    keyShaft.position.set(0, 0.05, 0.39); keyShaft.rotation.z = -Math.PI / 6;
    torso.add(keyShaft);
    // Key bow (circle at top of key)
    const keyBow = mesh(new THREE.TorusGeometry(0.018, 0.005, 8, 14), M.copperHi);
    keyBow.position.set(0.025, 0.09, 0.395); keyBow.rotation.x = Math.PI / 2;
    torso.add(keyBow);
    // Key teeth (small bar at bottom)
    const keyTeeth = mesh(new THREE.BoxGeometry(0.015, 0.005, 0.008), M.copperHi);
    keyTeeth.position.set(-0.024, 0.012, 0.39); keyTeeth.rotation.z = -Math.PI / 6 + Math.PI / 2;
    torso.add(keyTeeth);

    // Side ribbing (pearl curved plates)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const rib = mesh(new THREE.BoxGeometry(0.08, 0.06, 0.05), M.pearlHi);
        rib.position.set(side * 0.34, 0.18 - i * 0.16, 0.06);
        rib.rotation.z = side * 0.12;
        torso.add(rib);
      }
    }

    // High collar with copper trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.pearl);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 18), M.copperHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // PAULDRONS — pearl with copper sun-rays (mini sun-flares)
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.2, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.6), M.pearl);
      pauld.scale.set(1.1, 0.9, 1);
      pauld.position.set(side * 0.42, 2.2, 0);
      root.add(pauld);
      // Copper trim along pauldron rim
      const pauldTrim = mesh(new THREE.TorusGeometry(0.2, 0.012, 8, 20), M.copperHi);
      pauldTrim.rotation.x = Math.PI / 2; pauldTrim.position.set(side * 0.42, 2.16, 0);
      root.add(pauldTrim);
      // 3 copper sun-spikes radiating from each pauldron
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI * 0.3 + (i / 2) * Math.PI * 0.6;
        const spike = mesh(new THREE.ConeGeometry(0.02, 0.07, 5), M.copperHi);
        spike.position.set(side * 0.42 + Math.cos(a) * 0.16, 2.2 + Math.sin(a) * 0.04, Math.sin(a) * 0.16);
        spike.rotation.z = a + Math.PI / 2;
        root.add(spike);
      }
      // Pauldron sun-rune dot
      const sunDot = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.templarRune);
      sunDot.position.set(side * 0.42, 2.32, 0); sunDot.scale.set(1, 0.4, 1);
      root.add(sunDot);
    }

    // ARMS — pearl plate + copper trim
    const armPalette = { cloth: M.templarCape, mid: M.pearl, dark: M.pearlDark, hi: M.pearlHi, accent: M.copper };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Copper rings on forearm vambraces
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.088, 0.012, 8, 16), M.copperHi);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.5 - i * 0.13;
        arm.add(ring);
      }
    });

    // TOWER SHIELD — held in left hand (copper sunburst emblem)
    const shield = this._buildTowerShield();
    leftArm.userData.hand.add(shield);
    shield.position.set(0, 0.0, 0.06);
    shield.rotation.set(-Math.PI / 2.5, 0, 0);
    this.parts.shield = shield;

    // CEREMONIAL MACE — held in right hand
    const mace = this._buildTemplarMace();
    rightArm.userData.hand.add(mace);
    mace.position.set(0, 0.04, 0.06);
    mace.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = mace;

    // CAPE — cream with copper trim
    const cape = buildCape({ material: M.templarCape, width: 1.4, height: 1.9 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape copper bottom-trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.018, 8, 28, Math.PI), M.copperHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.pearlDark);
    neck.position.y = 2.32; root.add(neck);

    // SUN-FLARE CROWN HELM (the marquee feature)
    const helm = this._buildSunCrownHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    M.templarEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.templarEye;
  }

  _buildTowerShield() {
    const shield = new THREE.Group();
    // Tall rectangular tower body — pearl with rounded top
    const bodyShape = new THREE.Shape();
    bodyShape.moveTo(-0.18, -0.36); bodyShape.lineTo(0.18, -0.36);
    bodyShape.lineTo(0.18, 0.18);
    bodyShape.bezierCurveTo(0.18, 0.36, -0.18, 0.36, -0.18, 0.18);
    bodyShape.closePath();
    const body = mesh(new THREE.ExtrudeGeometry(bodyShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 }), M.pearl);
    shield.add(body);
    // Copper rim around the entire shield
    const rim = mesh(new THREE.ExtrudeGeometry(bodyShape, { depth: 0.02, bevelEnabled: false }), M.copperHi);
    rim.position.z = 0.04; rim.scale.set(1.05, 1.04, 1);
    shield.add(rim);
    // Inner copper border (offset rectangle inside)
    const innerRect = mesh(new THREE.BoxGeometry(0.32, 0.62, 0.005), M.copperHi);
    innerRect.position.z = 0.045; shield.add(innerRect);
    // Central pearl inset (where the sun goes)
    const pearlInset = mesh(new THREE.BoxGeometry(0.28, 0.58, 0.008), M.pearlHi);
    pearlInset.position.z = 0.05; shield.add(pearlInset);
    // CENTRAL SUNBURST — large copper sun with 12 rays
    const sunDisc = mesh(new THREE.CircleGeometry(0.09, 24), M.copperHi);
    sunDisc.position.z = 0.058; shield.add(sunDisc);
    // 12 rays radiating outward
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const long = i % 2 === 0;
      const len = long ? 0.05 : 0.03;
      const ray = mesh(new THREE.ConeGeometry(0.01, len, 4), M.templarRune);
      ray.position.set(Math.cos(a) * (0.09 + len / 2), Math.sin(a) * (0.09 + len / 2), 0.06);
      ray.rotation.z = a - Math.PI / 2;
      shield.add(ray);
    }
    // Central sun-rune gem
    const sunGem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.templarRune);
    sunGem.position.z = 0.07; sunGem.scale.set(1, 1, 0.5);
    shield.add(sunGem);
    // Decorative copper studs at the four corners
    for (let xs = -1; xs <= 1; xs += 2) {
      for (let ys of [-0.32, 0.12]) {
        const stud = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.copperHi);
        stud.position.set(xs * 0.14, ys, 0.06);
        shield.add(stud);
      }
    }
    return shield;
  }

  _buildTemplarMace() {
    const mace = new THREE.Group();
    // Pommel — copper sphere
    const pommel = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.copperHi);
    mace.add(pommel);
    // Wood haft wrapped in cream cord
    const haft = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.5, 12), M.bark);
    haft.position.y = 0.27; mace.add(haft);
    // Cream cord wrap
    for (let i = 0; i < 6; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.pearlHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.07 + i * 0.06;
      mace.add(wrap);
    }
    // Mid-haft copper collar
    const midCollar = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.04, 10), M.copperHi);
    midCollar.position.y = 0.27; mace.add(midCollar);
    // Top collar
    const topCollar = mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.06, 10), M.copperHi);
    topCollar.position.y = 0.52; mace.add(topCollar);
    // MACE HEAD — copper sphere with sun-flare spikes
    const head = mesh(new THREE.SphereGeometry(0.07, 16, 12), M.copper);
    head.position.y = 0.62; mace.add(head);
    // 6 sun-flare spikes around the head
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const spike = mesh(new THREE.ConeGeometry(0.018, 0.08, 5), M.copperHi);
      spike.position.set(Math.cos(a) * 0.09, 0.62, Math.sin(a) * 0.09);
      spike.rotation.z = -Math.PI / 2 + Math.cos(a) * Math.PI / 2;
      // Use lookAt-like trick — point outward
      spike.lookAt(Math.cos(a) * 1, 0.62, Math.sin(a) * 1);
      mace.add(spike);
    }
    // Top sun-rune cap
    const topRune = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.templarRune);
    topRune.position.y = 0.71; mace.add(topRune);
    return mace;
  }

  _buildSunCrownHelm() {
    const helm = new THREE.Group();

    // Pearl skullcap (open-faced helm — chin/face exposed)
    const cap = mesh(new THREE.SphereGeometry(0.22, 20, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.pearlHi);
    cap.position.y = 0.04;
    helm.add(cap);

    // Brow band (copper)
    const browBand = mesh(new THREE.TorusGeometry(0.222, 0.018, 10, 24), M.copperHi);
    browBand.rotation.x = Math.PI / 2;
    browBand.position.y = 0.04;
    helm.add(browBand);

    // Open face — skin showing
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    helm.add(face);

    // ===== SUN-FLARE CROWN — radiating copper rays around the helm (the marquee feature) =====
    const RAY_COUNT = 12;
    for (let i = 0; i < RAY_COUNT; i++) {
      const a = (i / RAY_COUNT) * Math.PI * 2;
      const long = i % 2 === 0;
      const len = long ? 0.18 : 0.12;
      const ray = mesh(new THREE.ConeGeometry(long ? 0.024 : 0.018, len, 5), M.copperHi);
      ray.position.set(Math.cos(a) * 0.22, 0.18, Math.sin(a) * 0.22);
      // Tilt outward and upward
      const outward = new THREE.Vector3(Math.cos(a) * 2, 0.6, Math.sin(a) * 2);
      ray.lookAt(outward);
      ray.rotateX(-Math.PI / 2);
      helm.add(ray);
      // Rune gem at the tip (small)
      if (long) {
        const tip = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.templarRune);
        tip.position.set(Math.cos(a) * (0.22 + 0.18), 0.32, Math.sin(a) * (0.22 + 0.18));
        helm.add(tip);
      }
    }

    // Central forehead sun-rune gem
    const browGem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.templarRune);
    browGem.position.set(0, 0.06, 0.21); browGem.scale.set(1, 1, 0.5);
    helm.add(browGem);
    const browGemRing = mesh(new THREE.TorusGeometry(0.045, 0.007, 8, 16), M.copperHi);
    browGemRing.position.set(0, 0.06, 0.215); helm.add(browGemRing);

    // Eyes — peach-gold glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); helm.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.templarEye);
    eyeL.position.set(-0.08, -0.02, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.08; helm.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    helm.add(nose);

    // Mouth
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); helm.add(mouth);

    // Cheek/jaw guards (small copper plates)
    for (let side = -1; side <= 1; side += 2) {
      const cheekShape = new THREE.Shape();
      cheekShape.moveTo(0, 0); cheekShape.lineTo(0.08, 0);
      cheekShape.lineTo(0.07, -0.14); cheekShape.lineTo(-0.02, -0.16); cheekShape.closePath();
      const cheek = mesh(new THREE.ExtrudeGeometry(cheekShape, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 2 }), M.copper);
      cheek.position.set(side * 0.18, -0.04, 0.06);
      cheek.rotation.y = side > 0 ? -0.35 : Math.PI + 0.35;
      helm.add(cheek);
    }

    return helm;
  }
}
