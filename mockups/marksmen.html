// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  HUNTER — Marksman IV/VI                                                 ║
// ║  Beast Companion · Tan leather hunting gear, fur mantle, bone-tooth     ║
// ║  necklace, longbow, side quiver, ★ live wolf companion at his side ★,   ║
// ║  paw-print chest emblem, wolf-amber eye glow                            ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Hunter extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = hunterAnimations;
  }

  // Override update — slowly wag the wolf companion's tail, breathe its body, blink eyes
  update(time, dt) {
    super.update(time, dt);
    if (this.wolfTail) {
      this.wolfTail.rotation.y = Math.sin(time * 1.6) * 0.4;
    }
    if (this.wolfBody) {
      this.wolfBody.scale.x = 1 + Math.sin(time * 1.2) * 0.012;
    }
  }

  build() {
    const root = this.group;

    // Legs — tan leather pants
    const buildHunterLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — tan leather
      const thigh = mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.55, 14), M.hunterTan);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee leather pad
      const kneePad = mesh(new THREE.SphereGeometry(0.105, 12, 8), M.hunterTanHi);
      kneePad.position.y = 0.66; kneePad.scale.set(1.1, 0.6, 1.2); leg.add(kneePad);
      // Lower shin
      const shin = mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.5, 14), M.hunterTan);
      shin.position.y = 0.36; leg.add(shin);
      // Calf wraps (rough leather strapping)
      for (let i = 0; i < 4; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.122, 0.008, 6, 14), M.hunterTanDark);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.5 - i * 0.08;
        leg.add(wrap);
      }
      // Boot — soft brown leather
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.hunterTanDark);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Boot toe tip
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.08, 0.1), M.hunterTan);
      toe.position.set(0, 0.06, 0.21); toe.rotation.x = -0.18;
      leg.add(toe);
      // Bronze buckle on the side of the boot
      const bootBuckle = mesh(new THREE.BoxGeometry(0.025, 0.025, 0.018), M.hunterBronze);
      bootBuckle.position.set(sx * 0.1, 0.13, 0.1); leg.add(bootBuckle);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildHunterLeg(-1));
    root.add(buildHunterLeg(1));

    // Pelvis — leather belt with side hip-quiver + small pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.hunterTan));
    // Wide leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.12, 18), M.hunterTanDark);
    belt.position.y = 0.0; pelvis.add(belt);
    // Bronze belt buckle (paw-print emboss)
    const buckle = mesh(new THREE.SphereGeometry(0.035, 12, 10), M.hunterBronzeHi);
    buckle.position.set(0, 0, 0.32); buckle.scale.set(1.4, 1, 0.5);
    pelvis.add(buckle);
    // Hip quiver on right side (fewer arrows than archer, larger hunting arrows)
    const hipQuiver = new THREE.Group();
    const qBody = mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.34, 12), M.hunterTanDark);
    hipQuiver.add(qBody);
    // Bronze rim
    const qRim = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.018, 12), M.hunterBronze);
    qRim.position.y = 0.17; hipQuiver.add(qRim);
    // 4 large arrow shafts/heads sticking up from quiver
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const shaft = mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.32, 6), M.hunterTan);
      shaft.position.set(Math.cos(a) * 0.04, 0.34, Math.sin(a) * 0.04);
      hipQuiver.add(shaft);
      // Bronze arrowhead
      const head = mesh(new THREE.ConeGeometry(0.014, 0.04, 4), M.hunterBronzeHi);
      head.position.set(Math.cos(a) * 0.04, 0.52, Math.sin(a) * 0.04);
      hipQuiver.add(head);
      // Feather fletching (3 fins)
      for (let f = 0; f < 3; f++) {
        const fa = (f / 3) * Math.PI * 2;
        const fletch = mesh(new THREE.BoxGeometry(0.004, 0.04, 0.018), M.hunterFurHi);
        fletch.position.set(Math.cos(a) * 0.04 + Math.cos(fa) * 0.014, 0.22, Math.sin(a) * 0.04 + Math.sin(fa) * 0.014);
        fletch.rotation.y = -fa;
        hipQuiver.add(fletch);
      }
    }
    hipQuiver.position.set(0.34, -0.05, -0.04);
    hipQuiver.rotation.set(0, 0, -0.18);
    pelvis.add(hipQuiver);
    // Small pouches on left hip
    for (let i = 0; i < 2; i++) {
      const pouch = mesh(new THREE.SphereGeometry(0.05, 10, 8), M.hunterTanHi);
      pouch.position.set(-0.32, -0.08, 0.05 + i * 0.08); pouch.scale.set(1, 1.2, 0.7);
      pelvis.add(pouch);
    }
    root.add(pelvis);

    // TORSO — tan leather tunic with fur shoulder-mantle
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Tan tunic
    const tunic = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.hunterTan);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Front leather chestplate (slightly darker, cut V)
    const chestplate = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.hunterTanDark);
    chestplate.scale.set(1.05, 1, 0.85);
    chestplate.position.y = 0.04;
    torso.add(chestplate);

    // Pec mounds (tan)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.hunterTanHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — paw print (the marquee Hunter symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.hunterTanHi);
    emblemBack.position.set(0, 0.05, 0.41); torso.add(emblemBack);
    // Main pad of the paw (large center)
    const mainPad = mesh(new THREE.SphereGeometry(0.035, 12, 10), M.hunterBronzeHi);
    mainPad.position.set(0, 0.0, 0.42); mainPad.scale.set(1, 1.1, 0.4);
    torso.add(mainPad);
    // 4 toe pads (around the top of the print)
    for (let i = 0; i < 4; i++) {
      const a = -Math.PI * 0.4 + (i / 3) * Math.PI * 0.8;
      const toe = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.hunterBronzeHi);
      toe.position.set(Math.cos(a) * 0.04, 0.05 + Math.sin(a) * 0.04, 0.43); toe.scale.set(1, 1.2, 0.4);
      torso.add(toe);
      // Small claw mark above each toe
      const claw = mesh(new THREE.ConeGeometry(0.005, 0.015, 4), M.hunterBronzeHi);
      claw.position.set(Math.cos(a) * 0.06, 0.07 + Math.sin(a) * 0.06, 0.43);
      claw.rotation.z = a + Math.PI / 2;
      torso.add(claw);
    }

    // Bone tooth-necklace (across the upper chest)
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI * 0.4 + (i / 8) * Math.PI * 0.8;
      // Bone tooth
      const tooth = mesh(new THREE.ConeGeometry(0.012, 0.05, 5), M.bone);
      const r = 0.34;
      tooth.position.set(Math.cos(a + Math.PI / 2) * r, 0.32, Math.sin(a + Math.PI / 2) * r);
      tooth.rotation.x = Math.PI;
      tooth.rotation.z = -(a + Math.PI / 2) - Math.PI / 2;
      torso.add(tooth);
      // Tiny leather thread between teeth
      if (i < 8) {
        const thread = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.04, 4), M.hunterTanDark);
        const aMid = a + Math.PI / 16;
        thread.position.set(Math.cos(aMid + Math.PI / 2) * r, 0.36, Math.sin(aMid + Math.PI / 2) * r);
        torso.add(thread);
      }
    }

    // Leather collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.hunterTanDark);
    collar.position.y = 0.4; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // FUR MANTLE — over the shoulders, lighter and more "wolf-pelt" than Berserker's
    const mantle = new THREE.Group();
    mantle.position.set(0, 2.32, 0);
    // Base ring (warm tan fur)
    const mantleBase = mesh(new THREE.TorusGeometry(0.36, 0.1, 12, 28, Math.PI * 0.95), M.hunterFur);
    mantleBase.rotation.x = Math.PI / 2;
    mantleBase.rotation.z = Math.PI / 2;
    mantle.add(mantleBase);
    // Fur tufts (gray-tan, lighter texture than Berserker's dark fur)
    const TUFT_COUNT = 30;
    for (let i = 0; i < TUFT_COUNT; i++) {
      const t = i / (TUFT_COUNT - 1);
      const angle = -Math.PI * 0.05 + t * Math.PI * 0.95;
      const r = 0.36 + (Math.random() - 0.3) * 0.04;
      const tuft = mesh(new THREE.ConeGeometry(0.038 + Math.random() * 0.02, 0.08 + Math.random() * 0.04, 6), Math.random() > 0.5 ? M.hunterFurHi : M.hunterFur);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      tuft.position.set(cosA * r, sinA * r * 0.4 + (Math.random() - 0.5) * 0.04, -Math.abs(sinA) * 0.16 + (Math.random() - 0.5) * 0.05);
      tuft.lookAt(cosA * r * 3, sinA * r * 1.2, -Math.abs(sinA) * 0.5);
      tuft.rotation.x += Math.PI / 2 + (Math.random() - 0.5) * 0.5;
      mantle.add(tuft);
    }
    // Bronze clasp at the front of the mantle
    const clasp = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.hunterBronzeHi);
    clasp.position.set(0, -0.06, 0.36); clasp.scale.set(1.4, 0.7, 0.7);
    mantle.add(clasp);
    root.add(mantle);

    // ARMS — tan leather + bronze trim
    const armPalette = { cloth: M.hunterTan, mid: M.hunterTanHi, dark: M.hunterTanDark, hi: M.hunterTanHi, accent: M.hunterBronze };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Heavy leather bracer on left forearm
    const bracer = mesh(new THREE.CylinderGeometry(0.092, 0.09, 0.32, 14), M.hunterTanDark);
    bracer.position.y = -0.62; leftArm.add(bracer);
    // Bronze studs on the bracer
    for (let i = 0; i < 4; i++) {
      const stud = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.hunterBronzeHi);
      stud.position.set(0, -0.5 - i * 0.08, 0.092);
      leftArm.add(stud);
    }

    // LONGBOW — held in left hand
    const bow = this._buildHunterBow();
    leftArm.userData.hand.add(bow);
    bow.position.set(0, 0, 0.05);
    bow.rotation.set(0, 0, 0);
    this.parts.weapon = bow;

    // No flowing cape — fur mantle is the back garment
    this.cape = null;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — leather cap (no helm), bone-toothed circlet
    const head = this._buildHunterHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== WOLF COMPANION — sitting at the hunter's right side (the marquee feature) =====
    const wolf = this._buildWolfCompanion();
    wolf.position.set(1.2, 0, -0.2);
    wolf.rotation.set(0, -Math.PI / 6, 0);
    root.add(wolf);

    M.hunterEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.hunterEye;
  }

  _buildHunterBow() {
    const bow = new THREE.Group();
    // Bow body — classic longbow profile (slight bend, wood)
    const segments = 14;
    const bowHeight = 1.35;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const y = (t - 0.5) * bowHeight;
      const xCurve = Math.sin(t * Math.PI) * 0.1;
      const seg = mesh(new THREE.CylinderGeometry(0.014 + Math.sin(t * Math.PI) * 0.006, 0.014 + Math.sin(t * Math.PI) * 0.006, bowHeight / segments + 0.01, 8), M.hunterTanHi);
      seg.position.set(-xCurve, y, 0);
      bow.add(seg);
    }
    // Bowstring
    const bowstring = mesh(new THREE.CylinderGeometry(0.003, 0.003, bowHeight - 0.05, 4), M.bone);
    bowstring.position.set(0.05, 0, 0);
    bow.add(bowstring);
    // Leather grip
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.2, 12), M.hunterTanDark);
    grip.position.set(-0.1, 0, 0);
    bow.add(grip);
    // Feather tassel hanging from grip (decorative — hunter's trophy)
    const tassel = mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.06, 4), M.hunterTanDark);
    tassel.position.set(-0.1, -0.13, 0.018);
    bow.add(tassel);
    const featherBead = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.hunterBronzeHi);
    featherBead.position.set(-0.1, -0.16, 0.018);
    bow.add(featherBead);
    const tasselFeather = mesh(new THREE.BoxGeometry(0.012, 0.04, 0.005), M.hunterFurHi);
    tasselFeather.position.set(-0.1, -0.2, 0.018); tasselFeather.rotation.z = 0.4;
    bow.add(tasselFeather);
    // Bone tips
    const tipTop = mesh(new THREE.ConeGeometry(0.01, 0.04, 6), M.bone);
    tipTop.position.set(0, bowHeight / 2 + 0.02, 0);
    bow.add(tipTop);
    const tipBot = mesh(new THREE.ConeGeometry(0.01, 0.04, 6), M.bone);
    tipBot.position.set(0, -bowHeight / 2 - 0.02, 0); tipBot.rotation.x = Math.PI;
    bow.add(tipBot);
    return bow;
  }

  _buildWolfCompanion() {
    const wolf = new THREE.Group();
    // BODY — torso (oblong sphere)
    const body = mesh(new THREE.SphereGeometry(0.18, 16, 12), M.wolfFur);
    body.position.y = 0.55; body.scale.set(1.5, 1, 1.1);
    wolf.add(body);
    this.wolfBody = body;
    // Belly (lighter fur)
    const belly = mesh(new THREE.SphereGeometry(0.14, 14, 10), M.wolfFurHi);
    belly.position.set(0, 0.48, 0); belly.scale.set(1.4, 0.7, 0.9);
    wolf.add(belly);

    // HEAD — pointed snout
    const head = mesh(new THREE.SphereGeometry(0.13, 14, 12), M.wolfFur);
    head.position.set(0.28, 0.6, 0); head.scale.set(1.2, 0.95, 0.95);
    wolf.add(head);
    // Snout
    const snout = mesh(new THREE.ConeGeometry(0.07, 0.16, 8), M.wolfFurHi);
    snout.position.set(0.42, 0.58, 0); snout.rotation.z = -Math.PI / 2;
    wolf.add(snout);
    // Wet nose (dark sphere at snout tip)
    const nose = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.sniperBlack);
    nose.position.set(0.5, 0.58, 0);
    wolf.add(nose);
    // Pointed wolf ears (2 triangular ears on top of head)
    for (let side = -1; side <= 1; side += 2) {
      const ear = mesh(new THREE.ConeGeometry(0.04, 0.08, 4), M.wolfFur);
      ear.position.set(0.24, 0.72, side * 0.07);
      ear.rotation.x = side * 0.4;
      wolf.add(ear);
      // Inner ear (lighter)
      const innerEar = mesh(new THREE.ConeGeometry(0.022, 0.06, 4), M.skin);
      innerEar.position.set(0.245, 0.71, side * 0.07);
      innerEar.rotation.x = side * 0.4;
      wolf.add(innerEar);
    }
    // Glowing wolf-amber eyes
    const wolfEyeL = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.hunterEye);
    wolfEyeL.position.set(0.35, 0.62, 0.05); wolf.add(wolfEyeL);
    const wolfEyeR = wolfEyeL.clone(); wolfEyeR.position.z = -0.05; wolf.add(wolfEyeR);

    // 4 LEGS (front-left, front-right, back-left, back-right)
    const legPositions = [
      [0.18, 0.0, 0.1],   // front-right
      [0.18, 0.0, -0.1],  // front-left
      [-0.18, 0.0, 0.1],  // back-right
      [-0.18, 0.0, -0.1], // back-left
    ];
    legPositions.forEach(p => {
      // Upper leg (thicker)
      const upperLeg = mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.22, 8), M.wolfFur);
      upperLeg.position.set(p[0], p[1] + 0.32, p[2]);
      wolf.add(upperLeg);
      // Lower leg (thinner)
      const lowerLeg = mesh(new THREE.CylinderGeometry(0.03, 0.038, 0.2, 8), M.wolfFurHi);
      lowerLeg.position.set(p[0], p[1] + 0.1, p[2]);
      wolf.add(lowerLeg);
      // Paw
      const paw = mesh(new THREE.BoxGeometry(0.07, 0.04, 0.08), M.wolfFurHi);
      paw.position.set(p[0], p[1] + 0.02, p[2] + 0.01);
      wolf.add(paw);
    });

    // TAIL (curved upward, wagging)
    const tailGroup = new THREE.Group();
    tailGroup.position.set(-0.3, 0.55, 0);
    const tailSegs = 5;
    for (let i = 0; i < tailSegs; i++) {
      const t = i / (tailSegs - 1);
      const tailSeg = mesh(new THREE.CylinderGeometry(0.04 - t * 0.025, 0.045 - t * 0.025, 0.08, 8), i % 2 === 0 ? M.wolfFur : M.wolfFurHi);
      tailSeg.position.set(-t * 0.18, t * 0.1, 0);
      tailSeg.rotation.z = Math.PI / 2 - t * 0.5;
      tailGroup.add(tailSeg);
    }
    // Bushy tail tip
    const tailTip = mesh(new THREE.SphereGeometry(0.045, 10, 8), M.wolfFurHi);
    tailTip.position.set(-0.18, 0.1, 0);
    tailGroup.add(tailTip);
    wolf.add(tailGroup);
    this.wolfTail = tailGroup;

    // Bone collar around the wolf's neck
    const wolfCollar = mesh(new THREE.TorusGeometry(0.13, 0.012, 8, 16), M.hunterTanDark);
    wolfCollar.position.set(0.18, 0.6, 0);
    wolfCollar.rotation.y = Math.PI / 2;
    wolf.add(wolfCollar);
    // Bronze tag on the collar
    const collarTag = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.hunterBronzeHi);
    collarTag.position.set(0.24, 0.5, 0); collarTag.scale.set(1, 1.2, 0.4);
    wolf.add(collarTag);

    return wolf;
  }

  _buildHunterHead() {
    const head = new THREE.Group();

    // Brown hair (longer than archer)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.hunterTanDark);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Leather forehead band with bone teeth (small) — distinct from Druid's leaf circlet
    const forehead = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 24), M.hunterTanDark);
    forehead.rotation.x = Math.PI / 2;
    forehead.position.y = 0.04;
    head.add(forehead);
    // 5 small bone teeth across the front of the band
    for (let i = -2; i <= 2; i++) {
      const tooth = mesh(new THREE.ConeGeometry(0.008, 0.025, 4), M.bone);
      tooth.position.set(i * 0.04, 0.08, 0.21);
      head.add(tooth);
    }
    // Bronze ornament at center
    const browOrn = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.hunterBronzeHi);
    browOrn.position.set(0, 0.04, 0.215); browOrn.scale.set(1, 1.4, 0.5);
    head.add(browOrn);

    // Side hair tassels (long brown locks)
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.CylinderGeometry(0.022, 0.018, 0.18, 8), M.hunterTanDark);
      sideHair.position.set(side * 0.18, -0.08, 0.05); sideHair.rotation.z = side * 0.1;
      head.add(sideHair);
      // Bone bead in the hair
      const bead = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.bone);
      bead.position.set(side * 0.19, -0.16, 0.05);
      head.add(bead);
    }

    // Eyes — wolf-amber glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.hunterEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (slight smirk — confident hunter)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Short beard (hunter's stubble)
    const beard = mesh(new THREE.SphereGeometry(0.085, 12, 10), M.hunterTanDark);
    beard.position.set(0, -0.16, 0.16); beard.scale.set(0.9, 0.5, 0.7);
    head.add(beard);

    // 3 dark face-paint stripes on the cheek (warpaint)
    for (let i = 0; i < 3; i++) {
      const paint = mesh(new THREE.BoxGeometry(0.018, 0.06, 0.005), M.hunterTanDark);
      paint.position.set(-0.13 + i * 0.005, -0.08, 0.21); paint.rotation.z = -0.2;
      head.add(paint);
    }

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  GUNNER — Marksman V/VI                                                  ║
// ║  Fast Multishot · AoE · Oily black coat with brass buttons, tricorn    ║
// ║  hat, TWIN flintlock pistols (one per hand), powder bandolier across   ║
// ║  chest, powder horn at hip, tarnished copper eye glow                   ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Gunner extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = gunnerAnimations;
  }

  build() {
    const root = this.group;

    // Legs — black breeches with thigh-high boots
    const buildGunnerLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — oily black breeches
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.oilBlack);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee — slightly highlighted
      const knee = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.oilBlackHi);
      knee.position.y = 0.66; knee.scale.set(1.05, 0.6, 1.1); leg.add(knee);
      // Lower shin / tall boot
      const boot = mesh(new THREE.CylinderGeometry(0.135, 0.14, 0.5, 14), M.gunnerLeather);
      boot.position.y = 0.36; leg.add(boot);
      // Boot fold-over at the top (highlighted band)
      const boftFold = mesh(new THREE.CylinderGeometry(0.15, 0.135, 0.06, 14), M.oilBlackHi);
      boftFold.position.y = 0.6; leg.add(boftFold);
      // Brass boot buckle on the side
      const bootBuckle = mesh(new THREE.BoxGeometry(0.04, 0.04, 0.018), M.gunnerBrass);
      bootBuckle.position.set(sx * 0.115, 0.55, 0.05); leg.add(bootBuckle);
      // Boot toe (slight wedge)
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.1, 0.14), M.gunnerLeather);
      toe.position.set(0, 0.07, 0.2); toe.rotation.x = -0.18;
      leg.add(toe);
      // Boot heel (square)
      const heel = mesh(new THREE.BoxGeometry(0.12, 0.06, 0.06), M.oilBlack);
      heel.position.set(0, 0.04, -0.04); leg.add(heel);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildGunnerLeg(-1));
    root.add(buildGunnerLeg(1));

    // Pelvis — wide leather belt with powder horn + extra cartridges
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.oilBlack));
    // Wide leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.14, 18), M.gunnerLeather);
    belt.position.y = 0.04; pelvis.add(belt);
    // Big brass buckle (square)
    const buckle = mesh(new THREE.BoxGeometry(0.1, 0.08, 0.018), M.gunnerBrassHi);
    buckle.position.set(0, 0.04, 0.31); pelvis.add(buckle);
    // Inner brass square
    const buckleInner = mesh(new THREE.BoxGeometry(0.07, 0.05, 0.022), M.gunnerBrass);
    buckleInner.position.set(0, 0.04, 0.32); pelvis.add(buckleInner);
    // POWDER HORN on the right hip
    const hornBody = mesh(new THREE.SphereGeometry(0.06, 14, 10), M.bone);
    hornBody.position.set(0.32, -0.05, 0.05); hornBody.scale.set(1, 1.4, 0.7);
    pelvis.add(hornBody);
    // Horn neck
    const hornNeck = mesh(new THREE.CylinderGeometry(0.022, 0.012, 0.06, 8), M.gunnerBrass);
    hornNeck.position.set(0.32, 0.02, 0.05); hornNeck.rotation.x = -0.4;
    pelvis.add(hornNeck);
    // Horn cap
    const hornCap = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.012, 8), M.gunnerBrassHi);
    hornCap.position.set(0.32, 0.06, 0.06);
    pelvis.add(hornCap);
    // Cartridge pouches on the left hip (3 small pouches with bullet tips)
    for (let i = 0; i < 3; i++) {
      const pouch = mesh(new THREE.BoxGeometry(0.035, 0.07, 0.04), M.gunnerLeather);
      pouch.position.set(-0.32, -0.03, -0.06 + i * 0.045);
      pelvis.add(pouch);
      // Brass cartridge tip
      const cart = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.02, 8), M.gunnerBrassHi);
      cart.position.set(-0.32, 0.0, -0.06 + i * 0.045); cart.rotation.x = Math.PI / 2;
      pelvis.add(cart);
    }
    // Hanging coat-tails (front of the pelvis — long coat lower flaps)
    for (let i = -1; i <= 1; i += 2) {
      const tail = mesh(new THREE.BoxGeometry(0.18, 0.4, 0.018), M.oilBlack);
      tail.position.set(i * 0.13, -0.22, 0.31); tail.rotation.x = -0.04;
      pelvis.add(tail);
      // Brass button at the top
      const tailBtn = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.gunnerBrassHi);
      tailBtn.position.set(i * 0.13, -0.05, 0.32); pelvis.add(tailBtn);
    }
    root.add(pelvis);

    // TORSO — long oily black coat with brass buttons + powder bandolier
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Coat body
    const coat = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.oilBlack);
    coat.scale.set(1.0, 1, 0.85);
    torso.add(coat);

    // Pec mounds (oily black with subtle brass-rim)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.oilBlackHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Vertical row of brass buttons down the front (5 buttons)
    for (let i = 0; i < 5; i++) {
      const button = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.gunnerBrassHi);
      button.position.set(0, 0.22 - i * 0.1, 0.39); button.scale.set(1, 1, 0.5);
      torso.add(button);
    }

    // POWDER BANDOLIER — diagonal strap across chest (left shoulder to right hip)
    const bandolier = mesh(new THREE.BoxGeometry(0.07, 0.6, 0.02), M.gunnerLeather);
    bandolier.position.set(-0.04, 0.0, 0.36); bandolier.rotation.z = 0.4;
    torso.add(bandolier);
    // Brass-and-powder cartridges on the bandolier (5 across the visible front)
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const px = -0.18 + t * 0.28;
      const py = 0.22 - t * 0.5;
      // Cartridge body (small brass cylinder)
      const cart = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 8), M.gunnerBrassHi);
      cart.position.set(px, py, 0.39); cart.rotation.x = Math.PI / 2 - 0.4;
      torso.add(cart);
      // Powder cap
      const cartTop = mesh(new THREE.CylinderGeometry(0.012, 0.014, 0.012, 8), M.powderGray);
      cartTop.position.set(px - 0.012, py + 0.018, 0.39); cartTop.rotation.x = Math.PI / 2 - 0.4;
      torso.add(cartTop);
    }

    // CHEST EMBLEM — powder-keg with crossed pistols (the marquee Gunner symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.gunnerLeather);
    emblemBack.position.set(0.05, -0.18, 0.41); torso.add(emblemBack);
    // Powder keg (small brown cylinder)
    const keg = mesh(new THREE.CylinderGeometry(0.025, 0.028, 0.04, 12), M.gunnerLeather);
    keg.position.set(0.05, -0.18, 0.42); keg.rotation.x = Math.PI / 2;
    torso.add(keg);
    // Brass keg bands (3 hoops)
    for (let i = -1; i <= 1; i++) {
      const hoop = mesh(new THREE.TorusGeometry(0.026, 0.003, 6, 12), M.gunnerBrassHi);
      hoop.position.set(0.05 + i * 0.012, -0.18, 0.422); hoop.rotation.y = Math.PI / 2;
      torso.add(hoop);
    }
    // Crossed pistol shapes (small)
    const pistol1 = mesh(new THREE.BoxGeometry(0.012, 0.07, 0.006), M.gunnerBrass);
    pistol1.position.set(0.05, -0.18, 0.43); pistol1.rotation.z = Math.PI / 4;
    torso.add(pistol1);
    const pistol2 = mesh(new THREE.BoxGeometry(0.012, 0.07, 0.006), M.gunnerBrass);
    pistol2.position.set(0.05, -0.18, 0.43); pistol2.rotation.z = -Math.PI / 4;
    torso.add(pistol2);
    // Tarnished copper rune dot at center
    const emblemRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.gunnerEmber);
    emblemRune.position.set(0.05, -0.18, 0.435);
    torso.add(emblemRune);

    // High collar (popped-up coat collar)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.oilBlackHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.gunnerBrassHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // PAULDRONS — cloth shoulder caps with brass buttons (less armored than Crossbowman)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.oilBlackHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Brass shoulder button
      const shoulderBtn = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.gunnerBrassHi);
      shoulderBtn.position.set(side * 0.42, 2.27, 0);
      root.add(shoulderBtn);
      // Brass epaulet trim
      const epaulet = mesh(new THREE.BoxGeometry(0.16, 0.04, 0.04), M.gunnerBrass);
      epaulet.position.set(side * 0.42, 2.16, 0); epaulet.rotation.z = side * 0.1;
      root.add(epaulet);
    }

    // ARMS — black coat sleeves with brass-cuffed wrists
    const armPalette = { cloth: M.oilBlack, mid: M.oilBlackHi, dark: M.oilBlack, hi: M.gunnerBrass, accent: M.gunnerBrassHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Lace cuffs at the wrists (flared white-cream lace, distinctive musketeer look)
    [leftArm, rightArm].forEach(arm => {
      const lace = mesh(new THREE.CylinderGeometry(0.11, 0.092, 0.08, 14), M.powderGray);
      lace.position.y = -0.86; arm.add(lace);
      // Brass cuff above the lace
      const cuff = mesh(new THREE.CylinderGeometry(0.092, 0.092, 0.04, 14), M.gunnerBrass);
      cuff.position.y = -0.78; arm.add(cuff);
      // Tiny brass buttons on the cuff
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2;
        const btn = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.gunnerBrassHi);
        btn.position.set(Math.cos(a) * 0.092, -0.78, Math.sin(a) * 0.092);
        arm.add(btn);
      }
    });

    // TWIN FLINTLOCK PISTOLS — one in each hand
    const leftPistol = this._buildFlintlockPistol(0);
    leftArm.userData.hand.add(leftPistol);
    leftPistol.position.set(0, 0.04, 0.06);
    leftPistol.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.leftWeapon = leftPistol;

    const rightPistol = this._buildFlintlockPistol(1);
    rightArm.userData.hand.add(rightPistol);
    rightPistol.position.set(0, 0.04, 0.06);
    rightPistol.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.rightWeapon = rightPistol;

    // Long coat-cape behind (the back of the coat extends as a half-cape)
    const cape = buildCape({ material: M.gunnerCape, width: 1.4, height: 1.7 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Brass coat-tail trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.012, 8, 28, Math.PI), M.gunnerBrassHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.7, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — face with TRICORN HAT (the marquee feature)
    const head = this._buildGunnerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.gunnerEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.gunnerEye;
  }

  _buildFlintlockPistol(side) {
    const pistol = new THREE.Group();
    // Wood grip (bottom — held in hand)
    const grip = mesh(new THREE.BoxGeometry(0.04, 0.16, 0.06), M.gunnerLeather);
    grip.position.y = 0.0; grip.rotation.x = -0.2;
    pistol.add(grip);
    // Brass cap on the grip butt
    const gripButt = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.gunnerBrassHi);
    gripButt.position.y = -0.08;
    pistol.add(gripButt);
    // Pistol body / lock plate (between grip and barrel)
    const body = mesh(new THREE.BoxGeometry(0.05, 0.08, 0.07), M.gunnerBrass);
    body.position.y = 0.13;
    pistol.add(body);
    // Trigger guard (thin brass loop under the body)
    const triggerGuard = mesh(new THREE.TorusGeometry(0.02, 0.004, 6, 12, Math.PI), M.gunnerBrassHi);
    triggerGuard.rotation.x = Math.PI / 2;
    triggerGuard.position.set(0, 0.1, -0.04);
    pistol.add(triggerGuard);
    // Trigger
    const trigger = mesh(new THREE.BoxGeometry(0.005, 0.025, 0.005), M.oilBlack);
    trigger.position.set(0, 0.105, -0.04); trigger.rotation.x = -0.3;
    pistol.add(trigger);
    // FLINTLOCK HAMMER (the cocked striker — distinctive curved piece on top of body)
    const hammerArm = mesh(new THREE.BoxGeometry(0.018, 0.05, 0.012), M.oilBlack);
    hammerArm.position.set(0, 0.18, -0.025); hammerArm.rotation.x = 0.3;
    pistol.add(hammerArm);
    // Hammer stone (flint)
    const flint = mesh(new THREE.BoxGeometry(0.022, 0.018, 0.012), M.bone);
    flint.position.set(0, 0.21, -0.04);
    pistol.add(flint);
    // Frizzen (the steel face the flint strikes)
    const frizzen = mesh(new THREE.BoxGeometry(0.014, 0.04, 0.008), M.gunnerBrassHi);
    frizzen.position.set(0, 0.2, 0.022); frizzen.rotation.x = -0.3;
    pistol.add(frizzen);
    // Pan (small brass cup beside the frizzen)
    const pan = mesh(new THREE.BoxGeometry(0.024, 0.012, 0.014), M.gunnerBrassHi);
    pan.position.set(0, 0.18, 0.012);
    pistol.add(pan);
    // BARREL (long octagonal barrel extending forward and up)
    const barrel = mesh(new THREE.CylinderGeometry(0.022, 0.024, 0.36, 8), M.gunnerBrassHi);
    barrel.position.set(0, 0.32, 0.0);
    pistol.add(barrel);
    // Front sight bead at the muzzle
    const frontSight = mesh(new THREE.ConeGeometry(0.005, 0.012, 4), M.bone);
    frontSight.position.set(0, 0.5, 0.018);
    pistol.add(frontSight);
    // Muzzle ring
    const muzzle = mesh(new THREE.TorusGeometry(0.024, 0.004, 6, 12), M.gunnerBrass);
    muzzle.position.y = 0.5; muzzle.rotation.x = Math.PI / 2;
    pistol.add(muzzle);
    // Tarnished copper rune on the lock plate (the magic-flintlock effect)
    const lockRune = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.gunnerEmber);
    lockRune.position.set(0, 0.13, 0.038); lockRune.scale.set(1, 1, 0.5);
    pistol.add(lockRune);
    // Wood ramrod beneath the barrel (small horizontal cylinder)
    const ramrod = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.32, 6), M.gunnerLeather);
    ramrod.position.set(0, 0.32, -0.028);
    pistol.add(ramrod);
    return pistol;
  }

  _buildGunnerHead() {
    const head = new THREE.Group();

    // Hair — short dark
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.oilBlackHi);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== TRICORN HAT (the marquee feature — three-cornered hat) =====
    // Hat dome (the crown of the hat)
    const hatDome = mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.18, 18), M.oilBlack);
    hatDome.position.y = 0.18;
    head.add(hatDome);
    // Hat dome top cap
    const hatTop = mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.04, 18), M.oilBlackHi);
    hatTop.position.y = 0.27;
    head.add(hatTop);
    // The three-cornered BRIM — a flat disk with three "points" turned up
    // Use a hexagonal disk approximated, then add three upturned point flaps
    const brim = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.018, 18), M.oilBlack);
    brim.position.y = 0.09;
    head.add(brim);
    // Three turned-up points (front, back-left, back-right)
    const pointAngles = [0, Math.PI * 2 / 3, Math.PI * 4 / 3];
    pointAngles.forEach(a => {
      const point = mesh(new THREE.BoxGeometry(0.18, 0.12, 0.022), M.oilBlackHi);
      const r = 0.25;
      point.position.set(Math.cos(a) * r, 0.13, Math.sin(a) * r);
      // Tilt the point upward and outward
      point.lookAt(Math.cos(a) * 2, 0.4, Math.sin(a) * 2);
      point.rotateX(-0.6);
      head.add(point);
      // Brass button at the upturn
      const btn = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.gunnerBrassHi);
      btn.position.set(Math.cos(a) * 0.22, 0.16, Math.sin(a) * 0.22);
      head.add(btn);
    });
    // Brass band around the base of the dome
    const hatBand = mesh(new THREE.TorusGeometry(0.19, 0.012, 8, 24), M.gunnerBrass);
    hatBand.rotation.x = Math.PI / 2;
    hatBand.position.y = 0.1;
    head.add(hatBand);
    // Front cockade (a brass-and-feather decoration on the front upturned point)
    const cockade = mesh(new THREE.SphereGeometry(0.03, 12, 10), M.gunnerBrassHi);
    cockade.position.set(0.2, 0.2, 0); cockade.scale.set(1, 1, 0.4);
    head.add(cockade);
    // Feather plume
    const plume = mesh(new THREE.ConeGeometry(0.018, 0.14, 6), M.feather || M.powderGray);
    plume.position.set(0.21, 0.28, 0); plume.rotation.z = -0.3;
    head.add(plume);

    // Eyes — tarnished copper glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.gunnerEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Roguish smirk
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); mouth.rotation.z = 0.1;
    head.add(mouth);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Pencil mustache (musketeer style)
    const mustacheL = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.oilBlack);
    mustacheL.position.set(-0.025, -0.1, 0.22); mustacheL.rotation.z = 0.2;
    head.add(mustacheL);
    const mustacheR = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.oilBlack);
    mustacheR.position.set(0.025, -0.1, 0.22); mustacheR.rotation.z = -0.2;
    head.add(mustacheR);

    return head;
  }
}

Gunner._sprayShot = function(champ, mgr, time, side, idx) {
  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  // Muzzle flash at the firing pistol
  const muzzlePos = new THREE.Vector3(champPos.x + side * 0.55, 2.3, champPos.z + 0.4);
  mgr.spawn(new ImpactFlash(champ.scene, muzzlePos, { color: 0xffe080, maxScale: 0.32, duration: 0.15 }), time);
  // Powder smoke puff
  mgr.spawn(new ParticleBurst(champ.scene, muzzlePos, { color: 0x584c40, count: 8, speed: 1.2, duration: 0.4, upwardBias: 0.5, gravity: -0.4 }), time);
  // Random target spread
  const xOffset = (Math.sin(idx * 7.31) * 1.4);
  const targetPos = new THREE.Vector3(champPos.x + xOffset, 1.5, champPos.z + 1.5);
  mgr.spawn(new ImpactFlash(champ.scene, targetPos, { color: 0xff9858, maxScale: 0.4, duration: 0.2 }), time + 0.04);
  const groundPos = new THREE.Vector3(targetPos.x, 0.12, targetPos.z);
  mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xc8783c, maxRadius: 0.7, duration: 0.4 }), time + 0.04);
  mgr.spawn(new ParticleBurst(champ.scene, targetPos, { color: 0xff9858, count: 10, speed: 4, duration: 0.5, upwardBias: 0.4, gravity: -2.5 }), time + 0.04);
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  FALCONER — Marksman VI/VI                                               ║
// ║  Bird Scout · Dive Bombs · White-blue feathered scout coat, silver +    ║
// ║  cream accents, ★ perched falcon on left gauntlet ★, plumed shoulder    ║
// ║  feather-mantle, asymmetric wing-cape, sky-teal eye glow                ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Falconer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = falconerAnimations;
  }

  // Override update — slowly bob the perched falcon, tilt its head
  update(time, dt) {
    super.update(time, dt);
    if (this.falcon) {
      this.falcon.position.y = this.falconBaseY + Math.sin(time * 1.4) * 0.012;
      // Subtle head swivel
      if (this.falconHead) this.falconHead.rotation.y = Math.sin(time * 0.7) * 0.4;
    }
  }

  build() {
    const root = this.group;

    // Legs — fitted white-blue trousers with silver knee-plates
    const buildFalconerLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — feather-blue cloth
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.falcBlue);
      thigh.position.y = 0.95; leg.add(thigh);
      // Silver knee plate
      const kneePlate = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.falcSilverHi);
      kneePlate.position.y = 0.66; kneePlate.scale.set(1.05, 0.6, 1.1); leg.add(kneePlate);
      // Cream cuff above the knee
      const kneeCuff = mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.04, 14), M.falcCream);
      kneeCuff.position.y = 0.82; leg.add(kneeCuff);
      // Lower shin — feather-blue continues
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.falcBlue);
      shin.position.y = 0.36; leg.add(shin);
      // Silver greave (front of shin only)
      const greave = mesh(new THREE.CylinderGeometry(0.135, 0.13, 0.4, 14, 1, false, -Math.PI / 3, Math.PI * 2 / 3), M.falcSilver);
      greave.position.y = 0.36; leg.add(greave);
      // Cream trim band at the boot top
      const trim = mesh(new THREE.TorusGeometry(0.13, 0.008, 6, 16), M.falcCream);
      trim.rotation.x = Math.PI / 2; trim.position.y = 0.16;
      leg.add(trim);
      // Boot — soft cream leather
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.falcCream);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Boot toe (slight curve)
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.08, 0.1), M.featherDark);
      toe.position.set(0, 0.06, 0.21); toe.rotation.x = -0.18;
      leg.add(toe);
      // Silver buckle on side of boot
      const bootBuckle = mesh(new THREE.BoxGeometry(0.04, 0.025, 0.018), M.falcSilverHi);
      bootBuckle.position.set(0, 0.13, 0.22); leg.add(bootBuckle);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildFalconerLeg(-1));
    root.add(buildFalconerLeg(1));

    // Pelvis — silver belt + cream sash + feather decoration
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.falcBlue));
    // Cream sash
    const sash = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.13, 18), M.falcCream);
    sash.position.y = 0.04; pelvis.add(sash);
    // Silver buckle (oval)
    const buckle = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.falcSilverHi);
    buckle.position.set(0, 0.04, 0.31); buckle.scale.set(1.5, 0.7, 0.5);
    pelvis.add(buckle);
    // Sky-teal rune in the buckle center
    const buckleRune = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.falcRune);
    buckleRune.position.set(0, 0.04, 0.33); buckleRune.scale.set(1, 1, 0.5);
    pelvis.add(buckleRune);
    // Hanging feather-tassels at front (decorative — falconer's signature)
    for (let i = -1; i <= 1; i += 2) {
      // Silver thread
      const thread = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.18, 4), M.falcSilver);
      thread.position.set(i * 0.05, -0.12, 0.32);
      pelvis.add(thread);
      // Long feather (small extruded flat shape)
      const featherShape = new THREE.Shape();
      featherShape.moveTo(0, 0.08); featherShape.bezierCurveTo(0.022, 0.04, 0.025, -0.04, 0, -0.1);
      featherShape.bezierCurveTo(-0.025, -0.04, -0.022, 0.04, 0, 0.08);
      featherShape.closePath();
      const feat = mesh(new THREE.ExtrudeGeometry(featherShape, { depth: 0.005, bevelEnabled: false }), M.feather);
      feat.position.set(i * 0.05, -0.26, 0.32);
      pelvis.add(feat);
      // Feather rachis (central spine)
      const rachis = mesh(new THREE.BoxGeometry(0.003, 0.18, 0.005), M.falcSilverHi);
      rachis.position.set(i * 0.05, -0.26, 0.325);
      pelvis.add(rachis);
    }
    root.add(pelvis);

    // TORSO — feather-blue scout coat with silver chest-plate
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Feather-blue coat body
    const coat = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.falcBlue);
    coat.scale.set(1.0, 1, 0.85);
    torso.add(coat);

    // Silver chest plate (front partial)
    const chestPlate = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.5, 16, 1, false, -Math.PI / 2.5, Math.PI * 1.15), M.falcSilver);
    chestPlate.scale.set(1.05, 1, 0.85);
    chestPlate.position.y = 0.07;
    torso.add(chestPlate);

    // Pec mounds (silver)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.falcSilverHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Cream sash diagonal across the chest
    const diagSash = mesh(new THREE.BoxGeometry(0.07, 0.55, 0.018), M.falcCream);
    diagSash.position.set(0, 0.0, 0.4); diagSash.rotation.z = 0.3;
    torso.add(diagSash);

    // CHEST EMBLEM — falcon silhouette with spread wings (the marquee Falconer symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.085, 16), M.featherDark);
    emblemBack.position.set(0, 0.05, 0.41); torso.add(emblemBack);
    // Falcon body
    const falconBody = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.falcSilverHi);
    falconBody.position.set(0, 0.04, 0.42); falconBody.scale.set(1, 1.4, 0.4);
    torso.add(falconBody);
    // Falcon head (small)
    const falconHeadEmblem = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.falcSilverHi);
    falconHeadEmblem.position.set(0, 0.075, 0.42); falconHeadEmblem.scale.set(1, 1, 0.5);
    torso.add(falconHeadEmblem);
    // Spread wings (left and right)
    for (let side = -1; side <= 1; side += 2) {
      // Wing main feather (large)
      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0); wingShape.lineTo(side * 0.07, 0.012);
      wingShape.lineTo(side * 0.04, -0.045); wingShape.lineTo(0, -0.025);
      wingShape.closePath();
      const wing = mesh(new THREE.ExtrudeGeometry(wingShape, { depth: 0.005, bevelEnabled: false }), M.falcSilverHi);
      wing.position.set(side * 0.014, 0.03, 0.42);
      torso.add(wing);
      // 3 wing feathers (lines extending outward)
      for (let i = 0; i < 3; i++) {
        const wingFeather = mesh(new THREE.BoxGeometry(0.025, 0.005, 0.005), M.falcSilverHi);
        wingFeather.position.set(side * (0.025 + i * 0.013), 0.03 - i * 0.01, 0.422);
        wingFeather.rotation.z = side * (0.4 + i * 0.1);
        torso.add(wingFeather);
      }
    }
    // Sky-teal rune dot at the falcon's heart
    const emblemRune = mesh(new THREE.SphereGeometry(0.01, 10, 8), M.falcRune);
    emblemRune.position.set(0, 0.04, 0.43);
    torso.add(emblemRune);

    // High collar — silver with cream lining
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.falcSilver);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.01, 8, 18), M.falcCream);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // PLUMED SHOULDER FEATHER-MANTLE — feather-tufts hanging from each shoulder
    for (let side = -1; side <= 1; side += 2) {
      // Cap base (silver)
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.falcSilver);
      cap.scale.set(1.1, 0.85, 1);
      cap.position.set(side * 0.42, 2.2, 0);
      root.add(cap);
      // Cream trim at the cap rim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.falcCream);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.16, 0);
      root.add(capTrim);
      // 5 white-blue feathers radiating from the shoulder cap
      for (let i = 0; i < 5; i++) {
        const t = i / 4;
        const angle = -Math.PI * 0.4 + t * Math.PI * 0.8;
        const featLength = 0.16 + Math.sin(t * Math.PI) * 0.04;
        const feat = mesh(new THREE.ConeGeometry(0.018, featLength, 5), i % 2 === 0 ? M.feather : M.featherHi);
        feat.position.set(side * 0.42 + Math.cos(angle) * 0.14, 2.22, Math.sin(angle) * 0.14);
        // Tilt outward
        feat.lookAt(side * 0.42 + Math.cos(angle) * 1, 2.5, Math.sin(angle) * 1);
        feat.rotateX(-Math.PI / 2);
        root.add(feat);
      }
      // Sky-teal rune gem at the shoulder center
      const shoulderRune = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.falcRune);
      shoulderRune.position.set(side * 0.42, 2.32, 0); shoulderRune.scale.set(1, 0.5, 1);
      root.add(shoulderRune);
    }

    // ARMS — feather-blue cloth with silver vambrace
    const armPalette = { cloth: M.falcBlue, mid: M.falcSilver, dark: M.featherDark, hi: M.falcSilverHi, accent: M.falcCream };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // LEFT ARM = falconry gauntlet (heavy reinforced leather glove with metal accents)
    // Wrap the left forearm with a thick gauntlet
    const gauntletWrap = mesh(new THREE.CylinderGeometry(0.115, 0.105, 0.32, 14), M.featherDark);
    gauntletWrap.position.y = -0.6; leftArm.add(gauntletWrap);
    // Silver studs on gauntlet (3 rows)
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 4; j++) {
        const a = (j / 4) * Math.PI * 2;
        const stud = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.falcSilverHi);
        stud.position.set(Math.cos(a) * 0.115, -0.5 - i * 0.08, Math.sin(a) * 0.115);
        leftArm.add(stud);
      }
    }
    // Heavier gauntlet hand (the bird-perch surface)
    const gauntletHand = mesh(new THREE.BoxGeometry(0.18, 0.18, 0.16), M.featherDark);
    gauntletHand.position.y = -0.92; leftArm.add(gauntletHand);
    // Silver knuckle band
    const knuckleBand = mesh(new THREE.BoxGeometry(0.18, 0.05, 0.18), M.falcSilver);
    knuckleBand.position.y = -0.84; leftArm.add(knuckleBand);
    // Cream-leather perch top (small flat raised platform on the gauntlet for the falcon)
    const perch = mesh(new THREE.BoxGeometry(0.14, 0.04, 0.14), M.falcCream);
    perch.position.y = -0.83; leftArm.add(perch);

    // RIGHT ARM holds a small recurve bow OR a falconer's lure
    // Make it a sleek recurve (smaller, more elegant than Hunter's)
    const bow = this._buildFalconerBow();
    rightArm.userData.hand.add(bow);
    bow.position.set(0, 0, 0.05);
    bow.rotation.set(0, 0, 0);
    this.parts.weapon = bow;

    // ===== PERCHED FALCON on the left gauntlet (the marquee feature) =====
    const falcon = this._buildFalcon();
    this.falconBaseY = -0.78;
    falcon.position.set(0, this.falconBaseY, 0);
    leftArm.userData.hand.add(falcon);
    this.falcon = falcon;

    // ASYMMETRIC WING CAPE — half-cape that extends to one side like a wing
    const cape = buildCape({ material: M.feather, width: 1.5, height: 1.85 });
    cape.position.set(0, 2.4, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape silver bottom trim
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.013, 8, 28, Math.PI), M.falcSilverHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Extra feather-flares along the cape edges (sky scout aesthetic)
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const fx = (t - 0.5) * 1.0;
      const flair = mesh(new THREE.ConeGeometry(0.022, 0.12, 5), i % 2 === 0 ? M.feather : M.featherHi);
      flair.position.set(fx, 0.8, -0.18);
      flair.rotation.x = Math.PI;
      flair.rotation.z = (Math.random() - 0.5) * 0.2;
      root.add(flair);
    }

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — face with silver crown-circlet + feather plume
    const head = this._buildFalconerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.falcEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.falcEye;
  }

  _buildFalcon() {
    const falcon = new THREE.Group();
    // BODY — small oblong (about 0.18 tall total)
    const body = mesh(new THREE.SphereGeometry(0.075, 14, 10), M.feather);
    body.position.y = 0.0; body.scale.set(0.9, 1.1, 1.4);
    falcon.add(body);
    // Belly (lighter)
    const belly = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.featherHi);
    belly.position.set(0, -0.012, 0.02); belly.scale.set(0.9, 0.9, 1.3);
    falcon.add(belly);
    // HEAD — small sphere on top
    const head = mesh(new THREE.SphereGeometry(0.045, 12, 10), M.featherDark);
    head.position.set(0, 0.085, 0.08);
    falcon.add(head);
    this.falconHead = head;
    // Beak — small curved cone
    const beak = mesh(new THREE.ConeGeometry(0.012, 0.03, 6), M.falcBeak);
    beak.position.set(0, 0.07, 0.115); beak.rotation.x = Math.PI / 2;
    head.add(beak);
    // Tiny glowing teal eyes (the falcon's mystic gaze)
    const fEyeL = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.falcEye);
    fEyeL.position.set(-0.018, 0.01, 0.04);
    head.add(fEyeL);
    const fEyeR = fEyeL.clone(); fEyeR.position.x = 0.018;
    head.add(fEyeR);
    // Hood-like marking around the eyes (dark band — signature peregrine look)
    const hoodBand = mesh(new THREE.SphereGeometry(0.046, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), M.falcBlue);
    hoodBand.position.set(0, 0.005, 0.0); hoodBand.scale.set(1, 0.5, 1);
    hoodBand.rotation.x = -Math.PI / 6;
    head.add(hoodBand);

    // Folded wings on the sides of the body
    for (let side = -1; side <= 1; side += 2) {
      // Wing primary feather (folded back along the body)
      const wing = mesh(new THREE.SphereGeometry(0.05, 12, 8), M.feather);
      wing.position.set(side * 0.06, 0.0, -0.02); wing.scale.set(0.7, 1, 1.5);
      falcon.add(wing);
      // Wing tip (darker primary feather)
      const wingTip = mesh(new THREE.ConeGeometry(0.015, 0.06, 5), M.featherDark);
      wingTip.position.set(side * 0.06, -0.04, -0.07);
      wingTip.rotation.x = Math.PI;
      falcon.add(wingTip);
    }

    // TAIL — fan of feathers behind
    for (let i = -1; i <= 1; i++) {
      const tailFeather = mesh(new THREE.BoxGeometry(0.012, 0.005, 0.07), i === 0 ? M.featherDark : M.feather);
      tailFeather.position.set(i * 0.014, -0.02, -0.1);
      tailFeather.rotation.y = i * 0.2;
      falcon.add(tailFeather);
    }

    // TALONS — gripping the perch (visible at the bottom)
    for (let side = -1; side <= 1; side += 2) {
      const talon = mesh(new THREE.CylinderGeometry(0.012, 0.008, 0.04, 6), M.falcBeak);
      talon.position.set(side * 0.025, -0.06, 0.0);
      falcon.add(talon);
      // Tiny claws
      for (let i = -1; i <= 1; i++) {
        const claw = mesh(new THREE.ConeGeometry(0.004, 0.012, 4), M.falcBeak);
        claw.position.set(side * 0.025 + i * 0.008, -0.08, 0.018);
        claw.rotation.x = Math.PI;
        falcon.add(claw);
      }
    }

    return falcon;
  }

  _buildFalconerBow() {
    const bow = new THREE.Group();
    // Sleek elegant recurve (silver-banded, smaller than other bows)
    const segments = 12;
    const bowHeight = 1.25;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const y = (t - 0.5) * bowHeight;
      const xCurve = Math.sin(t * Math.PI) * 0.09;
      const seg = mesh(new THREE.CylinderGeometry(0.012 + Math.sin(t * Math.PI) * 0.005, 0.012 + Math.sin(t * Math.PI) * 0.005, bowHeight / segments + 0.01, 8), M.falcSilverHi);
      seg.position.set(-xCurve, y, 0);
      bow.add(seg);
    }
    // Cream bowstring
    const bowstring = mesh(new THREE.CylinderGeometry(0.0025, 0.0025, bowHeight - 0.05, 4), M.falcCream);
    bowstring.position.set(0.05, 0, 0);
    bow.add(bowstring);
    // Cream-leather grip
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.18, 12), M.falcCream);
    grip.position.set(-0.09, 0, 0);
    bow.add(grip);
    // Silver bands on grip
    for (let i = 0; i < 3; i++) {
      const band = mesh(new THREE.TorusGeometry(0.024, 0.004, 6, 12), M.falcSilverHi);
      band.rotation.x = Math.PI / 2;
      band.position.set(-0.09, -0.06 + i * 0.06, 0);
      bow.add(band);
    }
    // Sky-teal accent gem on grip
    const gripGem = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.falcRune);
    gripGem.position.set(-0.11, 0, 0); gripGem.scale.set(0.6, 0.6, 1.2);
    bow.add(gripGem);
    // Tips with feather decorations
    for (let yDir = -1; yDir <= 1; yDir += 2) {
      const tip = mesh(new THREE.ConeGeometry(0.01, 0.04, 6), M.falcSilverHi);
      tip.position.set(0, yDir * (bowHeight / 2 + 0.02), 0);
      if (yDir < 0) tip.rotation.x = Math.PI;
      bow.add(tip);
      // Small white feather tied to each tip
      const tipFeather = mesh(new THREE.BoxGeometry(0.008, 0.04, 0.005), M.feather);
      tipFeather.position.set(0.012, yDir * (bowHeight / 2 + 0.04), 0); tipFeather.rotation.z = 0.3;
      bow.add(tipFeather);
    }
    return bow;
  }

  _buildFalconerHead() {
    const head = new THREE.Group();

    // Light blonde hair
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.falcCream);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // SILVER CIRCLET with central sky-teal gem
    const circlet = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 24), M.falcSilverHi);
    circlet.rotation.x = Math.PI / 2;
    circlet.position.y = 0.04;
    head.add(circlet);
    // Forward-facing teal gem
    const browGem = mesh(new THREE.SphereGeometry(0.026, 12, 10), M.falcRune);
    browGem.position.set(0, 0.04, 0.21); browGem.scale.set(1, 1, 0.5);
    head.add(browGem);
    const browGemRing = mesh(new THREE.TorusGeometry(0.03, 0.005, 8, 14), M.falcSilverHi);
    browGemRing.position.set(0, 0.04, 0.215); head.add(browGemRing);
    // Two upturned silver "wing" prongs flanking the gem (the falconer's heraldic crown)
    for (let side = -1; side <= 1; side += 2) {

    // Side hair tassels (light blonde)
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.SphereGeometry(0.1, 12, 10), M.falcCream);
      sideHair.position.set(side * 0.18, -0.05, 0.0); sideHair.scale.set(0.7, 1.4, 0.9);
      head.add(sideHair);
    }

    // Eyes — sky-teal glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.falcEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Confident slight smile
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    return head;
  }
}

  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8020) }, uOpacity: { value: 0.55 } },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xy);
      float a = atan(vPos.y, vPos.x);
      float pulse = 0.55 + 0.45 * sin(uTime * 1.2 + a * 4.0);
      float band = smoothstep(2.05, 2.18, r) * smoothstep(2.35, 2.18, r);
      gl_FragColor = vec4(uColor * pulse * 1.4, band * uOpacity * pulse);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});

for (let i = 0; i < EMBER_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4.5;
  emberPositions[i*3 + 0] = Math.cos(a) * r;
  emberPositions[i*3 + 1] = Math.random() * 4.5;
  emberPositions[i*3 + 2] = Math.sin(a) * r;
  emberSeeds[i] = Math.random();
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('seed', new THREE.Float32BufferAttribute(emberSeeds, 1));
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('archer');

// Hide loading splash
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);

animate();

</script>
</body>
