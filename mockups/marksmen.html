  linear: t => t,
  inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class FilledShockwave extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;
    this.mesh.scale.setScalar(0.2);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(0.2, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.55;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

    this.rotateSpeed = opts.rotateSpeed ?? 0.7;
    this.runeCount = opts.runeCount ?? 8;
    const geo = new THREE.RingGeometry(0.85, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {
  constructor(scene, position, opts = {}) {

    const geo = new THREE.RingGeometry(0.05, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x);
          float outerRing = smoothstep(0.93, 0.97, r) * smoothstep(1.0, 0.97, r);
          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);
          float fill = smoothstep(0.97, 0.0, r) * 0.08;
          float runeAng = mod(a + uTime * -0.5, 6.28318 / 12.0) * 12.0;
          float runes = smoothstep(0.4, 0.5, sin(runeAng)) * smoothstep(0.78, 0.85, r) * smoothstep(0.92, 0.85, r);
          float pulse = 0.7 + 0.3 * sin(uTime * 3.0);
          float intensity = (outerRing + midRing * 0.7 + star * 0.9 + runes * 1.1) * pulse + fill;
          gl_FragColor = vec4(uColor * intensity * 1.7, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });

      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;

          float pattern = sin(vUv.y * 30.0 - uTime * 8.0) * 0.5 + 0.5;

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

// ─── Shared part builders ──────────────────────────────────────────────────
function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.iron;
  const mid = palette.mid || M.ironHi;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.iron;
  const dark = palette.dark || M.iron;
  const hi = palette.hi || M.ironHi;
  const accent = palette.accent || M.brass;
  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);
  const knuckle = mesh(new THREE.BoxGeometry(0.16, 0.05, 0.08), accent);
  knuckle.position.set(0, -0.85, 0.05); arm.add(knuckle);
  const hand = new THREE.Group();
  hand.position.y = -0.96;
  arm.add(hand);
  arm.userData.hand = hand;
  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;
  return arm;
}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ARCHER — Marksman I/VI                                                  ║
// ║  Versatile Bow · Eagle Eye · Hooded ranger silhouette, forest-green     ║
// ║  tunic with leather over-vest, brown cloak with hood UP, longbow in    ║
// ║  left hand, quiver of leaf-fletched arrows on back, deep emerald glow  ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Archer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = archerAnimations;
  }

  build() {
    const root = this.group;

    // Legs — ranger brown leather pants and boots
    const buildArcherLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — forest-green leggings
      const thigh = mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.55, 14), M.forestGreenDark);

      // Lower shin — same
      const shin = mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.5, 14), M.forestGreenDark);
      shin.position.y = 0.36; leg.add(shin);
      // Leather thigh-strap (small accent across the upper thigh)
      const thighStrap = mesh(new THREE.TorusGeometry(0.135, 0.012, 6, 14), M.rangerBrown);
      thighStrap.rotation.x = Math.PI / 2; thighStrap.position.y = 0.85;
      leg.add(thighStrap);
      // Knee leather pad
      const kneePad = mesh(new THREE.SphereGeometry(0.1, 12, 8), M.rangerBrown);
      kneePad.position.y = 0.66; kneePad.scale.set(1.1, 0.6, 1.2); leg.add(kneePad);
      // Calf wraps (leather strapping)
      for (let i = 0; i < 5; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.122, 0.008, 6, 14), M.rangerBrownHi);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.52 - i * 0.07;
        leg.add(wrap);
      }
      // Boot — soft tall leather boot
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.15, 0.32), M.rangerBrown);
      boot.position.set(0, 0.11, 0.06); leg.add(boot);
      // Boot toe (slight curve via small box)
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.08, 0.1), M.rangerBrownHi);
      toe.position.set(0, 0.06, 0.21); toe.rotation.x = -0.18;
      leg.add(toe);
      // Boot lacing (subtle vertical line)
      const laces = mesh(new THREE.BoxGeometry(0.012, 0.14, 0.005), M.rangerBrownHi);
      laces.position.set(0, 0.13, 0.22); leg.add(laces);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildArcherLeg(-1));
    root.add(buildArcherLeg(1));

    // Pelvis — leather belt with arrow-pouch and pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.26, 0.28, 0.16, 16), M.forestGreenDark));
    // Leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.285, 0.285, 0.1, 18), M.rangerBrown);
    belt.position.y = 0.0; pelvis.add(belt);
    // Bronze buckle (small)
    const buckle = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.018), M.amber);
    buckle.position.set(0, 0, 0.3); pelvis.add(buckle);
    // Side arrow-pouches (small bag with arrow tips poking out)
    for (let i = -1; i <= 1; i += 2) {
      const pouch = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.rangerBrownHi);
      pouch.position.set(i * 0.26, -0.06, 0.16); pouch.scale.set(0.9, 1.2, 0.7);
      pelvis.add(pouch);
      // 2 arrowhead tips poking out of pouch
      for (let j = 0; j < 2; j++) {
        const arrowTip = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.bladeDark);
        arrowTip.position.set(i * (0.26 + j * 0.012), 0.06, 0.18);
        arrowTip.rotation.z = i * 0.2;
        pelvis.add(arrowTip);
      }
    }
    root.add(pelvis);

    // TORSO — forest-green tunic with leather over-vest
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Forest-green tunic underlayer
    const tunic = mesh(new THREE.CylinderGeometry(0.32, 0.3, 0.7, 16), M.forestGreen);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Leather over-vest (front-only, shorter)
    const vest = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.rangerBrown);
    vest.scale.set(1.05, 1, 0.85);
    vest.position.y = 0.04;
    torso.add(vest);

    // Vest lacing (cross-pattern down the front)
    for (let i = 0; i < 4; i++) {
      const left = mesh(new THREE.BoxGeometry(0.005, 0.06, 0.005), M.rangerBrownHi);
      left.position.set(-0.04, 0.18 - i * 0.13, 0.4); left.rotation.z = 0.5;
      torso.add(left);
      const right = mesh(new THREE.BoxGeometry(0.005, 0.06, 0.005), M.rangerBrownHi);
      right.position.set(0.04, 0.18 - i * 0.13, 0.4); right.rotation.z = -0.5;
      torso.add(right);
    }

    // Pec mounds (leather)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.rangerBrownHi);
    pecL.position.set(-0.14, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.14;
    torso.add(pecR);

    // CHEST EMBLEM — crossed arrow + leaf (the marquee Archer symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.06, 16), M.forestGreenDark);
    emblemBack.position.set(0, 0.05, 0.41); torso.add(emblemBack);
    // Diagonal arrow shaft
    const arrowShaft = mesh(new THREE.BoxGeometry(0.012, 0.1, 0.008), M.rangerBrownHi);
    arrowShaft.position.set(0, 0.05, 0.42); arrowShaft.rotation.z = Math.PI / 4;
    torso.add(arrowShaft);
    // Arrow head (cone tip on the diagonal)
    const arrowHead = mesh(new THREE.ConeGeometry(0.012, 0.025, 4), M.bladeDark);
    arrowHead.position.set(0.04, 0.09, 0.42); arrowHead.rotation.z = -Math.PI / 4;
    torso.add(arrowHead);
    // Arrow fletching
    const fletch = mesh(new THREE.BoxGeometry(0.018, 0.025, 0.005), M.archerLeaf);
    fletch.position.set(-0.035, 0.015, 0.42); fletch.rotation.z = Math.PI / 4;
    torso.add(fletch);
    // Crossed leaf (other diagonal)
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0, 0.04); leafShape.bezierCurveTo(0.025, 0.03, 0.025, -0.03, 0, -0.04);
    leafShape.bezierCurveTo(-0.025, -0.03, -0.025, 0.03, 0, 0.04);
    leafShape.closePath();
    const leaf = mesh(new THREE.ExtrudeGeometry(leafShape, { depth: 0.005, bevelEnabled: false }), M.archerLeaf);
    leaf.position.set(0, 0.05, 0.43); leaf.rotation.z = -Math.PI / 4;
    torso.add(leaf);
    // Leaf veins
    const leafVein = mesh(new THREE.BoxGeometry(0.005, 0.07, 0.003), M.archerRune);
    leafVein.position.set(0, 0.05, 0.44); leafVein.rotation.z = -Math.PI / 4;
    torso.add(leafVein);

    // Leather collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.rangerBrown);
    collar.position.y = 0.4; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // Soft cloth shoulders (no plate, leather pauldrons)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.13, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.rangerBrown);
      cap.scale.set(1, 0.6, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Leather strap accents
      const strap = mesh(new THREE.BoxGeometry(0.03, 0.18, 0.04), M.rangerBrownHi);
      strap.position.set(side * 0.42, 2.1, 0.04); strap.rotation.x = -0.18;
      root.add(strap);
    }

    // ARMS — slim, with leather bracer on the bow-arm (left)
    const armPalette = { cloth: M.forestGreen, mid: M.rangerBrownHi, dark: M.rangerBrown, hi: M.rangerBrownHi, accent: M.amber };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Heavy leather bracer on left forearm (bow-arm guard, distinctive)
    const bracer = mesh(new THREE.CylinderGeometry(0.092, 0.09, 0.32, 14), M.rangerBrown);
    bracer.position.y = -0.62; leftArm.add(bracer);
    // Bracer lacing
    for (let i = 0; i < 4; i++) {
      const lacing = mesh(new THREE.BoxGeometry(0.005, 0.04, 0.005), M.rangerBrownHi);
      lacing.position.set(-0.005, -0.5 - i * 0.08, 0.092); lacing.rotation.z = 0.5;
      leftArm.add(lacing);
      const lacing2 = mesh(new THREE.BoxGeometry(0.005, 0.04, 0.005), M.rangerBrownHi);
      lacing2.position.set(0.005, -0.5 - i * 0.08, 0.092); lacing2.rotation.z = -0.5;
      leftArm.add(lacing2);
    }
    // Right hand finger-tabs (small leather thumb guard for drawing)
    const fingerTab = mesh(new THREE.BoxGeometry(0.04, 0.05, 0.04), M.rangerBrownHi);
    fingerTab.position.y = -0.96; rightArm.add(fingerTab);

    // LONGBOW — held vertically in left hand (resting position)
    const bow = this._buildLongbow();
    leftArm.userData.hand.add(bow);
    bow.position.set(0, 0, 0.05);
    bow.rotation.set(0, 0, 0);
    this.parts.weapon = bow;

    // QUIVER on back — leaf-fletched arrows poking up
    const quiver = this._buildQuiver();
    quiver.position.set(0.18, 1.85, -0.28);
    quiver.rotation.set(0, 0, -Math.PI / 6);
    root.add(quiver);
    this.parts.quiver = quiver;

    // CLOAK — long brown cloak with hood up (separate from the cape mesh — covers shoulders + back)
    const cape = buildCape({ material: M.rangerBrown, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.4, -0.05);
    root.add(cape);
    this.cape = cape;

    // Forest-green inner cloak trim
    const cloakTrim = mesh(new THREE.TorusGeometry(0.55, 0.012, 8, 28, Math.PI), M.forestGreenHi);
    cloakTrim.rotation.x = Math.PI / 2;
    cloakTrim.position.set(0, 0.6, -0.1);
    cloakTrim.scale.set(1.3, 1, 0.5);
    root.add(cloakTrim);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — hood UP, face partially shadowed
    const head = this._buildArcherHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.archerEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.archerEye;
  }

  _buildLongbow() {
    const bow = new THREE.Group();
    // Bow body — a tall arc shape (curved wood)
    const segments = 14;
    const bowHeight = 1.4;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const y = (t - 0.5) * bowHeight;
      // Curve: bows outward at the middle, tapers at ends
      const xCurve = Math.sin(t * Math.PI) * 0.12;
      const seg = mesh(new THREE.CylinderGeometry(0.014 + Math.sin(t * Math.PI) * 0.008, 0.014 + Math.sin(t * Math.PI) * 0.008, bowHeight / segments + 0.01, 8), M.rangerBrownHi);
      seg.position.set(-xCurve, y, 0);
      // Tilt segments slightly to follow curve
      if (i > 0) {
        const prevT = (i - 1) / (segments - 1);
        const prevX = Math.sin(prevT * Math.PI) * 0.12;
        const dx = -xCurve - (-prevX);
        seg.rotation.z = Math.atan2(dx, bowHeight / segments);
      }
      bow.add(seg);
    }
    // Bowstring (thin straight line from top to bottom tip)
    const bowstring = mesh(new THREE.CylinderGeometry(0.003, 0.003, bowHeight - 0.05, 4), M.ivoryHi || M.cbBolt);
    bowstring.position.set(0.05, 0, 0); bowstring.rotation.z = 0;
    bow.add(bowstring);
    // Leather grip wrap at center
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.22, 12), M.rangerBrown);
    grip.position.set(-0.12, 0, 0);
    bow.add(grip);
    // Wrap bands on grip
    for (let i = 0; i < 4; i++) {
      const band = mesh(new THREE.TorusGeometry(0.024, 0.004, 6, 12), M.forestGreenDark);
      band.rotation.x = Math.PI / 2;
      band.position.set(-0.12, -0.08 + i * 0.05, 0);
      bow.add(band);
    }
    // Bow tips (notches at top and bottom)
    const tipTop = mesh(new THREE.ConeGeometry(0.012, 0.04, 6), M.amber);
    tipTop.position.set(0, bowHeight / 2 + 0.02, 0);
    bow.add(tipTop);
    const tipBot = mesh(new THREE.ConeGeometry(0.012, 0.04, 6), M.amber);
    tipBot.position.set(0, -bowHeight / 2 - 0.02, 0); tipBot.rotation.x = Math.PI;
    bow.add(tipBot);
    return bow;
  }

  _buildQuiver() {
    const quiver = new THREE.Group();
    // Cylinder body (leather)
    const body = mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.5, 14), M.rangerBrown);
    quiver.add(body);
    // Cap
    const cap = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.025, 14), M.rangerBrownHi);
    cap.position.y = 0.26; quiver.add(cap);
    // Leaf insignia on quiver side
    const leafInsig = mesh(new THREE.SphereGeometry(0.025, 10, 6), M.archerLeaf);
    leafInsig.position.set(0, -0.05, 0.07); leafInsig.scale.set(1, 0.4, 1.4);
    quiver.add(leafInsig);
    // Leather strap across the front of body
    const strap = mesh(new THREE.BoxGeometry(0.03, 0.5, 0.03), M.rangerBrownHi);
    strap.position.set(0, 0, 0.07); strap.rotation.z = -0.1;
    quiver.add(strap);
    // Several arrows poking out the top with leaf fletching
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      // Arrow shaft
      const shaft = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.4, 6), M.rangerBrownHi);
      shaft.position.set(Math.cos(a) * 0.04, 0.4, Math.sin(a) * 0.04);
      quiver.add(shaft);
      // Leaf fletching at top
      for (let f = 0; f < 3; f++) {
        const fa = (f / 3) * Math.PI * 2;
        const fletching = mesh(new THREE.BoxGeometry(0.004, 0.05, 0.018), M.archerLeaf);
        fletching.position.set(Math.cos(a) * 0.04 + Math.cos(fa) * 0.012, 0.55, Math.sin(a) * 0.04 + Math.sin(fa) * 0.012);
        fletching.rotation.y = -fa;
        quiver.add(fletching);
      }
    }
    return quiver;
  }

  _buildArcherHead() {
    const head = new THREE.Group();

    // Brown hair scalp
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.rangerBrown);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin (visible inside hood)
    const face = mesh(new THREE.SphereGeometry(0.19, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== HOOD UP — large brown ranger hood covering most of head =====
    // Hood shell (large, slightly pointed top)
    const hood = mesh(new THREE.SphereGeometry(0.28, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.65), M.rangerBrown);
    hood.scale.set(1.1, 1.2, 1.2);
    hood.position.set(0, 0.04, -0.02);
    head.add(hood);
    // Inner hood lining (forest-green)
    const hoodLining = mesh(new THREE.SphereGeometry(0.265, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.65), M.forestGreenDark);
    hoodLining.scale.set(1.08, 1.18, 1.18);
    hoodLining.position.set(0, 0.04, -0.02);
    head.add(hoodLining);
    // Hood pointed tip at the back
    const hoodTip = mesh(new THREE.ConeGeometry(0.06, 0.14, 8), M.rangerBrown);
    hoodTip.position.set(0, 0.32, -0.18); hoodTip.rotation.x = -0.4;
    head.add(hoodTip);
    // Hood front edge (leather trim around the opening)
    const hoodTrim = mesh(new THREE.TorusGeometry(0.24, 0.012, 8, 28, Math.PI * 1.3), M.rangerBrownHi);
    hoodTrim.rotation.x = Math.PI / 2.4;
    hoodTrim.rotation.y = -Math.PI / 2;
    hoodTrim.position.y = 0.06;
    head.add(hoodTrim);

    // Eyes — emerald glow inside the hood shadow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.02, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.16); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.archerEye);
    eyeL.position.set(-0.075, -0.02, 0.19); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Subtle nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.21); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (focused, slight scowl)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.21); head.add(mouth);

    // Small face-paint mark across the nose-bridge (subtle dark stripe — woodland marker)
    const facePaint = mesh(new THREE.BoxGeometry(0.18, 0.015, 0.005), M.forestGreenDark);
    facePaint.position.set(0, -0.06, 0.215);
    head.add(facePaint);

    return head;
  }
}

          mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0x80e090, count: 12, speed: 3, duration: 0.55, upwardBias: 0.5, gravity: -2.0 }), time);
        }
      }},
    ],
  },
  // PIERCING ARROW — slow careful draw, single line-AoE shot
  spell2: {
    duration: 1.6,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.35, values: {                                          // slow steady draw — long aim
        leftArm:  { rx: -0.95, rz: 0.05 },
        rightArm: { rx: -0.4, rz: -0.95 },
        body:     { ry: 0.04, rz: -0.04 },
        head:     { rx: 0.04 },

        rightArm: { rx: -0.4, rz: -0.95 },
        body:     { ry: 0.04, rz: -0.04 },
        head:     { rx: 0.04 },
      }},
      { t: 0.82, values: {                                          // release
        leftArm:  { rx: -0.85, rz: 0.05 },
        rightArm: { rx: 0.05, rz: -0.2 },
        body:     { ry: 0.04 },
      }, ease: ease.out },
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.35, fn: (champ, mgr, time) => {
        // Building emerald glow at the bow's nock-point
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const nockPos = new THREE.Vector3(champPos.x - 0.4, 1.95, champPos.z + 0.3);
        mgr.spawn(new ImpactFlash(champ.scene, nockPos, { color: 0x80e090, maxScale: 0.4, duration: 0.6 }), time);
        mgr.spawn(new ParticleBurst(champ.scene, nockPos, { color: 0x30a050, count: 18, speed: 1.0, duration: 0.5, upwardBias: 0, gravity: 0 }), time);
      }},
      { time: 0.82, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        // Long line-AoE — emerald light pillar laid down the center of the line
        // Multiple impact points stretching forward (the piercing line)
        for (let i = 0; i < 4; i++) {
          const dist = 0.8 + i * 0.6;
          const target = new THREE.Vector3(champPos.x, 1.5, champPos.z + dist);
          mgr.spawn(new ImpactFlash(champ.scene, target, { color: 0x80e090, maxScale: 0.55 - i * 0.05, duration: 0.3 + i * 0.05 }), time + i * 0.05);
          const groundPos = new THREE.Vector3(target.x, 0.12, target.z);
          mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0x30a050, maxRadius: 1.1 - i * 0.1, duration: 0.55 }), time + i * 0.05);

        // Big leaf-burst at far end (the arrow's final landing)

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  CROSSBOWMAN — Marksman II/VI                                            ║
// ║  Slow · Heavy · Armor Pierce · Plate-and-chain hauberk, gunmetal helm   ║
// ║  with full closed visor (horizontal slit), heavy two-handed crossbow,   ║
// ║  hip bolt-quiver, riveted pauldrons, cold iron-blue eye glow            ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Crossbowman extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = crossbowmanAnimations;
  }

  build() {
    const root = this.group;

    // Legs — gunmetal greaves
    const legPalette = { dark: M.gunmetalDark, mid: M.gunmetal, accent: M.gunmetalHi, trim: M.cbSteel, leather: M.cbBrown };
    root.add(buildLeg(-1, legPalette));
    root.add(buildLeg(1, legPalette));

    // Pelvis — gunmetal plate with riveted tassets + hip bolt quiver
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.gunmetalDark));
    // Steel belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.gunmetalHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Buckle (square iron)
    const buckle = mesh(new THREE.BoxGeometry(0.08, 0.07, 0.02), M.cbSteel);
    buckle.position.set(0, 0.04, 0.32); pelvis.add(buckle);
    // Iron-blue rune dot on buckle
    const buckleRune = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.cbRune);
    buckleRune.position.set(0, 0.04, 0.34); buckleRune.scale.set(1, 1, 0.5);
    pelvis.add(buckleRune);
    // Heavy plate tassets — 6 with rivets
    for (let i = 0; i < 6; i++) {
      const angle = -Math.PI * 0.5 + (i / 5) * Math.PI * 1.0;
      const tasset = mesh(new THREE.BoxGeometry(0.13, 0.34, 0.04), M.gunmetal);
      tasset.position.set(Math.cos(angle) * 0.3, -0.21, Math.sin(angle) * 0.3);
      tasset.lookAt(Math.cos(angle) * 2, -0.21, Math.sin(angle) * 2);
      tasset.rotateX(0.06);
      pelvis.add(tasset);
      // 4 rivets per tasset
      for (let j = 0; j < 4; j++) {
        const ry = -0.05 - j * 0.07;
        const rivet = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.cbSteel);
        rivet.position.set(Math.cos(angle) * 0.32, -0.17 + ry * 0.7, Math.sin(angle) * 0.32);
        pelvis.add(rivet);
      }
    }
    // HIP BOLT QUIVER — on the right hip (cylindrical, holds short bolts)
    const boltQuiver = new THREE.Group();
    const qBody = mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.28, 12), M.cbBrown);
    boltQuiver.add(qBody);
    // Steel rim
    const qRim = mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.018, 12), M.cbSteel);
    qRim.position.y = 0.14; boltQuiver.add(qRim);
    // 5 bolt tips poking up
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const boltShaft = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.15, 6), M.cbBrown);
      boltShaft.position.set(Math.cos(a) * 0.03, 0.21, Math.sin(a) * 0.03);
      boltQuiver.add(boltShaft);
      // Steel bolt-head (small pyramidal tip)
      const boltHead = mesh(new THREE.ConeGeometry(0.01, 0.025, 4), M.cbBolt);
      boltHead.position.set(Math.cos(a) * 0.03, 0.3, Math.sin(a) * 0.03);
      boltQuiver.add(boltHead);
      // Stub fletching at the bolt's nock (small flat fin, dark)
      for (let f = 0; f < 3; f++) {
        const fa = (f / 3) * Math.PI * 2;
        const fletch = mesh(new THREE.BoxGeometry(0.003, 0.015, 0.008), M.gunmetalDark);
        fletch.position.set(Math.cos(a) * 0.03 + Math.cos(fa) * 0.008, 0.12, Math.sin(a) * 0.03 + Math.sin(fa) * 0.008);
        fletch.rotation.y = -fa;
        boltQuiver.add(fletch);
      }
    }
    boltQuiver.position.set(0.32, -0.05, 0.04);
    boltQuiver.rotation.set(0, 0, -0.18);
    pelvis.add(boltQuiver);
    root.add(pelvis);

    // TORSO — chain-plate hauberk (chain mail underlayer + plate front)
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Chain mail underlayer (slightly textured cylinder)
    const chain = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 18), M.gunmetalDark);
    chain.scale.set(1.0, 1, 0.85);
    torso.add(chain);

    // Front plate cuirass (gunmetal, partial coverage)
    const cuirass = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.6, 16, 1, false, -Math.PI / 2.2, Math.PI * 1.3), M.gunmetal);
    cuirass.scale.set(1.05, 1, 0.85);
    cuirass.position.y = 0.04;
    torso.add(cuirass);

    // Pec mounds (steel-shaded)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.gunmetalHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Chain mail texture rings (decorative — visible at sides where plate doesn't cover)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        const link = mesh(new THREE.TorusGeometry(0.012, 0.003, 4, 8), M.cbSteel);
        link.rotation.x = Math.PI / 2;
        link.position.set(side * 0.36, 0.18 - i * 0.12, 0.0);
        torso.add(link);
      }
    }

    // Plate rivets along the cuirass front-edges (heavy industrial look)
    for (let i = 0; i < 5; i++) {
      const ry = 0.22 - i * 0.12;
      const rivetL = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.cbSteel);
      rivetL.position.set(-0.32, ry, 0.16); torso.add(rivetL);
      const rivetR = rivetL.clone(); rivetR.position.x = 0.32; torso.add(rivetR);
    }

    // CHEST EMBLEM — crossed bolts forming X with central gear (the marquee Crossbowman symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.08, 16), M.gunmetalDark);
    emblemBack.position.set(0, 0.05, 0.41); torso.add(emblemBack);
    // Bolt 1 (diagonal)
    const bolt1 = mesh(new THREE.BoxGeometry(0.012, 0.13, 0.008), M.cbSteel);
    bolt1.position.set(0, 0.05, 0.42); bolt1.rotation.z = Math.PI / 4;
    torso.add(bolt1);
    // Bolt 1 head
    const bolt1Head = mesh(new THREE.ConeGeometry(0.012, 0.022, 4), M.cbBolt);
    bolt1Head.position.set(0.05, 0.1, 0.42); bolt1Head.rotation.z = -Math.PI / 4;
    torso.add(bolt1Head);
    // Bolt 1 fletching
    const bolt1Fletch = mesh(new THREE.BoxGeometry(0.018, 0.022, 0.005), M.gunmetal);
    bolt1Fletch.position.set(-0.05, 0.0, 0.42); bolt1Fletch.rotation.z = Math.PI / 4;
    torso.add(bolt1Fletch);
    // Bolt 2 (other diagonal)
    const bolt2 = mesh(new THREE.BoxGeometry(0.012, 0.13, 0.008), M.cbSteel);
    bolt2.position.set(0, 0.05, 0.42); bolt2.rotation.z = -Math.PI / 4;
    torso.add(bolt2);
    const bolt2Head = mesh(new THREE.ConeGeometry(0.012, 0.022, 4), M.cbBolt);
    bolt2Head.position.set(-0.05, 0.1, 0.42); bolt2Head.rotation.z = Math.PI / 4;
    torso.add(bolt2Head);
    const bolt2Fletch = mesh(new THREE.BoxGeometry(0.018, 0.022, 0.005), M.gunmetal);
    bolt2Fletch.position.set(0.05, 0.0, 0.42); bolt2Fletch.rotation.z = -Math.PI / 4;
    torso.add(bolt2Fletch);
    // Central gear (steel) at the X intersection
    const gear = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.012, 12), M.cbSteel);
    gear.rotation.x = Math.PI / 2; gear.position.set(0, 0.05, 0.43);
    torso.add(gear);
    // Gear teeth (8 small spikes around the gear)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const tooth = mesh(new THREE.BoxGeometry(0.008, 0.012, 0.012), M.cbSteel);
      tooth.position.set(Math.cos(a) * 0.025, 0.05 + Math.sin(a) * 0.025, 0.435);
      tooth.rotation.z = a;
      torso.add(tooth);
    }
    // Iron-blue rune gem at gear center
    const gearGem = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.cbRune);
    gearGem.position.set(0, 0.05, 0.45); gearGem.scale.set(1, 1, 0.5);
    torso.add(gearGem);

    // High collar — gunmetal with steel trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.gunmetal);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.cbSteel);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // PAULDRONS — heavy iron plates with central rivet
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.2, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.6), M.gunmetal);
      pauld.scale.set(1.1, 0.9, 1);
      pauld.position.set(side * 0.42, 2.2, 0);
      root.add(pauld);
      // Steel trim on pauldron rim
      const pauldTrim = mesh(new THREE.TorusGeometry(0.2, 0.012, 8, 20), M.cbSteel);
      pauldTrim.rotation.x = Math.PI / 2; pauldTrim.position.set(side * 0.42, 2.16, 0);
      root.add(pauldTrim);
      // Central rivet
      const pauldRivet = mesh(new THREE.SphereGeometry(0.025, 12, 8), M.cbSteel);
      pauldRivet.position.set(side * 0.42, 2.32, 0);
      root.add(pauldRivet);
      // Iron-blue rune on the rivet
      const pauldRune = mesh(new THREE.SphereGeometry(0.015, 10, 8), M.cbRune);
      pauldRune.position.set(side * 0.42, 2.34, 0); pauldRune.scale.set(1, 0.5, 1);
      root.add(pauldRune);
    }

    // ARMS — gunmetal vambrace + chain underlayer
    const armPalette = { cloth: M.gunmetalDark, mid: M.gunmetal, dark: M.gunmetalDark, hi: M.gunmetalHi, accent: M.cbSteel };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Steel rivets on forearms
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.088, 0.014, 8, 16), M.cbSteel);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.5 - i * 0.13;
        arm.add(ring);
      }
    });

    // HEAVY CROSSBOW — held in right hand (the dominant grip), supported across body
    const crossbow = this._buildHeavyCrossbow();
    rightArm.userData.hand.add(crossbow);
    crossbow.position.set(0, 0.04, 0.06);
    crossbow.rotation.set(Math.PI * 0.5, 0, 0);
    this.parts.weapon = crossbow;

    // No flowing cape (crossbowmen don't typically wear capes — keep silhouette industrial)
    this.cape = null;

    // Neck (gunmetal)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.gunmetalDark);
    neck.position.y = 2.32; root.add(neck);

    // CLOSED VISOR HELM (the marquee feature)
    const helm = this._buildClosedVisorHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    M.cbEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.cbEye;
  }

  _buildHeavyCrossbow() {
    const cbow = new THREE.Group();
    // STOCK — long wooden body running along the bow's central axis
    const stock = mesh(new THREE.BoxGeometry(0.08, 0.7, 0.05), M.cbBrown);
    stock.position.y = 0.3;
    cbow.add(stock);
    // Steel cap on top of stock (the bolt sits in this groove)
    const stockTop = mesh(new THREE.BoxGeometry(0.06, 0.7, 0.02), M.cbSteel);
    stockTop.position.set(0, 0.3, 0.025);
    cbow.add(stockTop);
    // Stock end butt (thicker, padded shoulder rest)
    const butt = mesh(new THREE.BoxGeometry(0.12, 0.12, 0.07), M.cbBrown);
    butt.position.y = -0.05;
    cbow.add(butt);
    const buttPad = mesh(new THREE.BoxGeometry(0.13, 0.04, 0.075), M.gunmetalDark);
    buttPad.position.y = -0.12;
    cbow.add(buttPad);

    // BOW ARMS (perpendicular to stock — the actual bow part)
    // Front of stock has horizontal limbs extending left and right
    for (let side = -1; side <= 1; side += 2) {
      // Bow limb (curved horizontal, widening toward tips)
      const segments = 8;
      let prevPos = new THREE.Vector3(0, 0.6, 0);
      for (let i = 0; i < segments; i++) {
        const t = (i + 1) / segments;
        const nextX = side * t * 0.42;
        const nextZ = -t * t * 0.05;  // slight forward curve
        const nextPos = new THREE.Vector3(nextX, 0.6, nextZ);
        const dir = nextPos.clone().sub(prevPos);
        const len = dir.length();
        const mid = prevPos.clone().add(nextPos).multiplyScalar(0.5);
        const seg = mesh(new THREE.CylinderGeometry(0.018 - i * 0.0015, 0.018 - (i + 1) * 0.0015, len + 0.005, 8), M.cbSteel);
        seg.position.copy(mid);
        seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        cbow.add(seg);
        prevPos = nextPos;
      }
      // Tip cap
      const tip = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.gunmetalHi);
      tip.position.set(side * 0.42, 0.6, -0.05);
      cbow.add(tip);
    }

    // BOWSTRING (taut horizontal between the two limb tips, passing along the stock-top)
    const bowstring = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.84, 4), M.cbBolt);
    bowstring.position.set(0, 0.6, -0.05);
    bowstring.rotation.z = Math.PI / 2;
    cbow.add(bowstring);

    // LOADED BOLT — sitting in the groove
    const loadedBolt = mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.4, 6), M.cbBrown);
    loadedBolt.position.set(0, 0.5, 0.04);
    cbow.add(loadedBolt);
    // Bolt head
    const loadedBoltHead = mesh(new THREE.ConeGeometry(0.014, 0.04, 4), M.cbBolt);
    loadedBoltHead.position.set(0, 0.72, 0.04);
    cbow.add(loadedBoltHead);
    // Bolt fletching (3 small fins)
    for (let f = 0; f < 3; f++) {
      const fa = (f / 3) * Math.PI * 2;
      const fletch = mesh(new THREE.BoxGeometry(0.005, 0.04, 0.012), M.gunmetal);
      fletch.position.set(Math.cos(fa) * 0.012, 0.32, 0.04 + Math.sin(fa) * 0.012);
      fletch.rotation.y = -fa;
      cbow.add(fletch);
    }

    // TRIGGER MECHANISM (under the stock, near the butt)
    const triggerHousing = mesh(new THREE.BoxGeometry(0.06, 0.08, 0.07), M.gunmetalHi);
    triggerHousing.position.set(0, 0.16, -0.04);
    cbow.add(triggerHousing);
    // Trigger lever
    const trigger = mesh(new THREE.BoxGeometry(0.012, 0.06, 0.012), M.cbSteel);
    trigger.position.set(0, 0.13, -0.07); trigger.rotation.x = -0.4;
    cbow.add(trigger);
    // Iron-blue rune on the trigger (the firing mechanism's magic)
    const triggerRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.cbRune);
    triggerRune.position.set(0, 0.16, -0.075); triggerRune.scale.set(1.4, 0.5, 0.5);
    cbow.add(triggerRune);

    // FRONT SIGHT (small post at the very front of the stock)
    const sight = mesh(new THREE.ConeGeometry(0.006, 0.04, 4), M.cbBolt);
    sight.position.set(0, 0.62, 0.04);
    cbow.add(sight);

    return cbow;
  }

  _buildClosedVisorHelm() {
    const helm = new THREE.Group();

    // Main barrel-helm dome (gunmetal — fully closed)
    const dome = mesh(new THREE.CylinderGeometry(0.22, 0.21, 0.42, 18), M.gunmetal);
    dome.position.y = 0.0;
    helm.add(dome);
    // Top dome cap
    const domeTop = mesh(new THREE.SphereGeometry(0.22, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.gunmetalHi);
    domeTop.position.y = 0.2;
    helm.add(domeTop);

    // VISOR — narrow horizontal slit across the front (the iconic crossbowman look)
    // Black recess panel
    const visorPanel = mesh(new THREE.BoxGeometry(0.34, 0.06, 0.04), M.gunmetalDark);
    visorPanel.position.set(0, 0.0, 0.21); helm.add(visorPanel);
    // Visor slit (steel-glow strip showing through)
    const slit = mesh(new THREE.BoxGeometry(0.32, 0.024, 0.05), M.cbEye);
    slit.position.set(0, 0.0, 0.225); helm.add(slit);
    // Steel reinforcement frame around the slit
    const slitFrameTop = mesh(new THREE.BoxGeometry(0.36, 0.014, 0.02), M.cbSteel);
    slitFrameTop.position.set(0, 0.04, 0.235); helm.add(slitFrameTop);
    const slitFrameBot = mesh(new THREE.BoxGeometry(0.36, 0.014, 0.02), M.cbSteel);
    slitFrameBot.position.set(0, -0.04, 0.235); helm.add(slitFrameBot);
    // Vertical reinforcement bar in the middle of the slit (medieval visor style)
    const slitMidBar = mesh(new THREE.BoxGeometry(0.018, 0.06, 0.025), M.gunmetalHi);
    slitMidBar.position.set(0, 0.0, 0.235); helm.add(slitMidBar);

    // Eye glow center (where the iron-blue light shows)
    const eyeCenter = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.cbEye);
    eyeCenter.position.set(0, 0.0, 0.245); eyeCenter.scale.set(1, 1, 0.4);
    helm.add(eyeCenter);

    // Breathing holes (small dots on the lower face — typical great-helm style)
    for (let i = -1; i <= 1; i++) {
      for (let j = 0; j < 2; j++) {
        const hole = mesh(new THREE.SphereGeometry(0.008, 6, 6), M.gunmetalDark);
        hole.position.set(i * 0.04, -0.1 - j * 0.03, 0.21);
        helm.add(hole);
      }
    }

    // Side rivets (4 per side along the helm)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        const rivet = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.cbSteel);
        rivet.position.set(side * 0.215, -0.16 + i * 0.1, 0.04);
        helm.add(rivet);
      }
    }

    // Top crown ridge — steel crest running front-to-back
    const ridge = mesh(new THREE.BoxGeometry(0.04, 0.04, 0.46), M.cbSteel);
    ridge.position.set(0, 0.38, 0); helm.add(ridge);

    // Bottom rim
    const helmRim = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 24), M.cbSteel);
    helmRim.rotation.x = Math.PI / 2;
    helmRim.position.y = -0.21;
    helm.add(helmRim);

    return helm;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SNIPER — Marksman III/VI                                                ║
// ║  Patient · Mark · Headshot · Ash gray + black tactical gear, ghillie    ║
// ║  reed-cloak with hanging sage tufts, scope-monocle on right eye, sleek ║

class Sniper extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = sniperAnimations;
  }

  build() {
    const root = this.group;

    // Legs — dark fitted pants with reinforced shin
    const buildSniperLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — sniper black
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.sniperBlack);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee plate (small reinforced ash-gray plate)
      const kneePlate = mesh(new THREE.SphereGeometry(0.12, 12, 8), M.ashGray);
      kneePlate.position.y = 0.66; kneePlate.scale.set(1.05, 0.55, 1.1); leg.add(kneePlate);
      // Lower shin — ash-gray armor
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.ashGrayDark);
      shin.position.y = 0.36; leg.add(shin);
      // Tarnished gold trim band on the shin
      const trim = mesh(new THREE.TorusGeometry(0.12, 0.008, 6, 16), M.sniperGold);
      trim.rotation.x = Math.PI / 2; trim.position.y = 0.55;
      leg.add(trim);
      // Boot — dark, low-profile
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.sniperBlack);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Subtle gold buckle on boot
      const bootBuckle = mesh(new THREE.BoxGeometry(0.05, 0.025, 0.018), M.sniperGold);
      bootBuckle.position.set(0, 0.13, 0.22); leg.add(bootBuckle);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildSniperLeg(-1));
    root.add(buildSniperLeg(1));

    // Pelvis — utility belt with side ammo pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.18, 16), M.sniperBlack));
    // Tactical belt
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.1, 18), M.ashGrayDark);
    belt.position.y = 0.04; pelvis.add(belt);
    // Tarnished gold buckle
    const buckle = mesh(new THREE.BoxGeometry(0.06, 0.05, 0.018), M.sniperGold);
    buckle.position.set(0, 0.04, 0.31); pelvis.add(buckle);
    // Side utility pouches (black with gold rivets)
    for (let i = -1; i <= 1; i += 2) {
      const pouch = mesh(new THREE.BoxGeometry(0.12, 0.13, 0.07), M.sniperBlack);
      pouch.position.set(i * 0.24, -0.04, 0.18);
      pelvis.add(pouch);
      // Gold rivet
      const pouchStud = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.sniperGold);
      pouchStud.position.set(i * 0.24, -0.04, 0.22);
      pelvis.add(pouchStud);
      // Small predator-yellow rune on the pouch
      const pouchRune = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.sniperRune);
      pouchRune.position.set(i * 0.24, -0.06, 0.22); pouchRune.scale.set(1, 0.5, 1);
      pelvis.add(pouchRune);
    }
    root.add(pelvis);

    // TORSO — black undershirt + ash-gray tactical vest
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Black undershirt
    const undershirt = mesh(new THREE.CylinderGeometry(0.32, 0.3, 0.7, 16), M.sniperBlack);
    undershirt.scale.set(1.0, 1, 0.85);
    torso.add(undershirt);

    // Ash-gray tactical vest (front-only, partial coverage)
    const vest = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.ashGray);
    vest.scale.set(1.05, 1, 0.85);
    vest.position.y = 0.04;
    torso.add(vest);

    // Pec mounds (ash-gray)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.ashGrayHi);
    pecL.position.set(-0.14, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.14;
    torso.add(pecR);

    // Vest pouches (3 small horizontal pouches across the front)
    for (let i = 0; i < 3; i++) {
      const vestPouch = mesh(new THREE.BoxGeometry(0.18, 0.07, 0.04), M.ashGrayDark);
      vestPouch.position.set(0, 0.05 - i * 0.12, 0.4);
      torso.add(vestPouch);
      // Tarnished gold strap
      const strap = mesh(new THREE.BoxGeometry(0.2, 0.012, 0.008), M.sniperGold);
      strap.position.set(0, 0.085 - i * 0.12, 0.42);
      torso.add(strap);
    }

    // CHEST EMBLEM — crosshair / target reticle (the marquee Sniper symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.06, 18), M.sniperBlack);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // Outer ring
    const reticleOuter = mesh(new THREE.TorusGeometry(0.058, 0.005, 8, 24), M.sniperRune);
    reticleOuter.position.set(0, 0.22, 0.42); torso.add(reticleOuter);
    // Inner ring
    const reticleInner = mesh(new THREE.TorusGeometry(0.025, 0.004, 6, 16), M.sniperRune);
    reticleInner.position.set(0, 0.22, 0.42); torso.add(reticleInner);
    // Crosshair lines (4 short lines extending from the inner ring)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const line = mesh(new THREE.BoxGeometry(0.005, 0.025, 0.004), M.sniperRune);
      line.position.set(Math.cos(a) * 0.04, 0.22 + Math.sin(a) * 0.04, 0.422);
      line.rotation.z = a + Math.PI / 2;
      torso.add(line);
    }
    // Center dot
    const reticleDot = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.sniperEye);
    reticleDot.position.set(0, 0.22, 0.425);
    torso.add(reticleDot);

    // Sniper-yellow rune sigils flanking the reticle
    for (let side = -1; side <= 1; side += 2) {
      const sigil = mesh(new THREE.BoxGeometry(0.022, 0.014, 0.004), M.sniperRune);
      sigil.position.set(side * 0.18, 0.22, 0.42);
      torso.add(sigil);
    }

    // High collar — ash-gray with tarnished gold trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.ashGrayDark);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.01, 8, 18), M.sniperGold);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Slim shoulder caps (no plate, just cloth+strap)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.13, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.ashGrayDark);
      cap.scale.set(1, 0.6, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Tarnished gold strap accent
      const strap = mesh(new THREE.BoxGeometry(0.025, 0.18, 0.04), M.sniperGold);
      strap.position.set(side * 0.42, 2.1, 0.04); strap.rotation.x = -0.18;
      root.add(strap);
    }

    // ARMS — black undershirt + ash-gray bracers
    const armPalette = { cloth: M.sniperBlack, mid: M.ashGray, dark: M.ashGrayDark, hi: M.ashGrayHi, accent: M.sniperGold };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Subtle gold bracer trim
    [leftArm, rightArm].forEach(arm => {
      const trim = mesh(new THREE.TorusGeometry(0.092, 0.008, 6, 16), M.sniperGold);
      trim.rotation.x = Math.PI / 2; trim.position.y = -0.85;
      arm.add(trim);
    });

    // SLEEK RECURVE BOW — held in left hand
    const bow = this._buildSniperBow();
    leftArm.userData.hand.add(bow);
    bow.position.set(0, 0, 0.05);
    bow.rotation.set(0, 0, 0);
    this.parts.weapon = bow;

    // Right hand finger-tab (release aid)
    const fingerTab = mesh(new THREE.BoxGeometry(0.04, 0.05, 0.04), M.sniperBlack);
    fingerTab.position.y = -0.96; rightArm.add(fingerTab);

    // GHILLIE CLOAK — ash gray base with sage reed-tufts hanging down (the marquee feature)
    // Base cloak (long, ash gray)
    const cape = buildCape({ material: M.ashGrayDark, width: 1.5, height: 2.05 });
    cape.position.set(0, 2.4, -0.05);
    root.add(cape);
    this.cape = cape;

    // Reed/grass tufts hanging from the shoulders (the ghillie effect)
    const ghillieGroup = new THREE.Group();
    ghillieGroup.position.set(0, 2.32, 0);
    const TUFT_COUNT = 28;
    for (let i = 0; i < TUFT_COUNT; i++) {
      const t = i / (TUFT_COUNT - 1);
      const angle = -Math.PI * 0.5 + t * Math.PI * 1.0;
      const r = 0.42;
      const len = 0.18 + Math.random() * 0.12;
      // Reed strand (long thin cone)
      const reed = mesh(new THREE.ConeGeometry(0.012 + Math.random() * 0.008, len, 5), Math.random() > 0.5 ? M.sniperGreen : M.ashGray);
      reed.position.set(Math.cos(angle) * r + (Math.random() - 0.5) * 0.04, -len / 2 + (Math.random() - 0.5) * 0.04, Math.sin(angle) * r + (Math.random() - 0.5) * 0.04);
      reed.rotation.x = Math.PI + (Math.random() - 0.5) * 0.4;
      reed.rotation.z = (Math.random() - 0.5) * 0.4;
      ghillieGroup.add(reed);
    }
    root.add(ghillieGroup);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinDark);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — uncovered with scope-monocle
    const head = this._buildSniperHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.sniperEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.sniperEye;
  }

  _buildSniperBow() {
    const bow = new THREE.Group();
    // Recurve bow body — sleeker than longbow, more curve at the tips
    const segments = 16;
    const bowHeight = 1.5;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const y = (t - 0.5) * bowHeight;
      // S-curve at the tips (recurve characteristic)
      const baseX = Math.sin(t * Math.PI) * 0.08;
      const tipFactor = (Math.abs(t - 0.5) > 0.4) ? -0.06 : 0;
      const xCurve = baseX + tipFactor * Math.sign(0.5 - t);
      const seg = mesh(new THREE.CylinderGeometry(0.012 + Math.sin(t * Math.PI) * 0.005, 0.012 + Math.sin(t * Math.PI) * 0.005, bowHeight / segments + 0.01, 8), M.ashGrayHi);
      seg.position.set(-xCurve, y, 0);
      bow.add(seg);
    }
    // Bowstring
    const bowstring = mesh(new THREE.CylinderGeometry(0.0025, 0.0025, bowHeight - 0.05, 4), M.ashGrayHi);
    bowstring.position.set(0.06, 0, 0);
    bow.add(bowstring);
    // Sleek leather grip wrap
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.18, 12), M.sniperBlack);
    grip.position.set(-0.08, 0, 0);
    bow.add(grip);
    // Tarnished gold accents on the grip
    for (let i = 0; i < 3; i++) {
      const band = mesh(new THREE.TorusGeometry(0.024, 0.004, 6, 12), M.sniperGold);
      band.rotation.x = Math.PI / 2;
      band.position.set(-0.08, -0.06 + i * 0.06, 0);
      bow.add(band);
    }
    // Front sight (small post on the bow, near the grip)
    const sight = mesh(new THREE.ConeGeometry(0.005, 0.025, 4), M.sniperGold);
    sight.position.set(-0.12, 0, 0); sight.rotation.x = Math.PI / 2;
    bow.add(sight);
    // Rear sight (peep ring)
    const peepSight = mesh(new THREE.TorusGeometry(0.012, 0.003, 6, 12), M.sniperGold);
    peepSight.rotation.y = Math.PI / 2;
    peepSight.position.set(-0.08, 0.18, 0);
    bow.add(peepSight);
    // Bow tips (carbon-black with gold caps)
    const tipTop = mesh(new THREE.ConeGeometry(0.01, 0.05, 6), M.sniperGold);
    tipTop.position.set(0, bowHeight / 2 + 0.025, 0);
    bow.add(tipTop);
    const tipBot = mesh(new THREE.ConeGeometry(0.01, 0.05, 6), M.sniperGold);
    tipBot.position.set(0, -bowHeight / 2 - 0.025, 0); tipBot.rotation.x = Math.PI;
    bow.add(tipBot);
    // Yellow rune stabilizer (extending forward from the grip)
    const stabilizer = mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.1, 6), M.sniperBlack);
    stabilizer.position.set(-0.16, 0, 0); stabilizer.rotation.z = Math.PI / 2;
    bow.add(stabilizer);
    const stabilizerTip = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.sniperRune);
    stabilizerTip.position.set(-0.21, 0, 0);
    bow.add(stabilizerTip);
    return bow;
  }

  _buildSniperHead() {
    const head = new THREE.Group();

    // Hair — short cropped dark
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.sniperBlack);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // Face skin (slightly pale, focused)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== SCOPE-MONOCLE on the right eye (the marquee feature) =====
    // Outer scope ring (gunmetal cylinder over the right eye)
    const scopeBody = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.1, 12), M.sniperBlack);
    scopeBody.rotation.x = Math.PI / 2;
    scopeBody.position.set(0.08, -0.02, 0.21);
    head.add(scopeBody);
    // Outer brass rim
    const scopeRimFront = mesh(new THREE.TorusGeometry(0.06, 0.008, 8, 16), M.sniperGold);
    scopeRimFront.rotation.x = Math.PI / 2;
    scopeRimFront.position.set(0.08, -0.02, 0.265);
    head.add(scopeRimFront);
    const scopeRimBack = mesh(new THREE.TorusGeometry(0.06, 0.008, 8, 16), M.sniperGold);
    scopeRimBack.rotation.x = Math.PI / 2;
    scopeRimBack.position.set(0.08, -0.02, 0.165);
    head.add(scopeRimBack);
    // Inner glass lens (predator-yellow glow inside)
    const lens = mesh(new THREE.CircleGeometry(0.05, 16), M.sniperEye);
    lens.position.set(0.08, -0.02, 0.27); lens.rotation.y = Math.PI;
    head.add(lens);
    // Crosshair etching on the lens (small + shape)
    const crossV = mesh(new THREE.BoxGeometry(0.004, 0.06, 0.002), M.sniperBlack);
    crossV.position.set(0.08, -0.02, 0.275); head.add(crossV);
    const crossH = mesh(new THREE.BoxGeometry(0.06, 0.004, 0.002), M.sniperBlack);
    crossH.position.set(0.08, -0.02, 0.275); head.add(crossH);
    // Adjustment knob on top of scope
    const scopeKnob = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.025, 8), M.sniperGold);
    scopeKnob.position.set(0.08, 0.04, 0.21);
    head.add(scopeKnob);
    // Strap holding the scope to the head
    const scopeStrap = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 24), M.sniperBlack);
    scopeStrap.rotation.x = Math.PI / 2;
    scopeStrap.position.y = -0.02;
    head.add(scopeStrap);
    // Strap buckle
    const strapBuckle = mesh(new THREE.BoxGeometry(0.022, 0.02, 0.012), M.sniperGold);
    strapBuckle.position.set(-0.21, -0.02, 0); head.add(strapBuckle);

    // Left eye (uncovered) — standard predator-yellow glow
    const eyeStripL = mesh(new THREE.BoxGeometry(0.1, 0.025, 0.02), M.stoneDark);
    eyeStripL.position.set(-0.075, -0.025, 0.18); head.add(eyeStripL);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.sniperEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth — focused, neutral
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Black war-paint stripe across the cheekbones (sniper face-paint)
    for (let side = -1; side <= 1; side += 2) {
      const paint = mesh(new THREE.BoxGeometry(0.06, 0.018, 0.005), M.sniperBlack);
      paint.position.set(side * 0.13, -0.085, 0.21);
      head.add(paint);
    }

    return head;
  }
}
