const ease = {
  linear: t => t,
  inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class FilledShockwave extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;
    this.mesh.scale.setScalar(0.2);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(0.2, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.55;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 3.2;
    this.radius = opts.radius ?? 1.8;
    const geo = new THREE.RingGeometry(0.05, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x);
          float outerRing = smoothstep(0.93, 0.97, r) * smoothstep(1.0, 0.97, r);
          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);
          float fill = smoothstep(0.97, 0.0, r) * 0.08;
          float runeAng = mod(a + uTime * -0.5, 6.28318 / 12.0) * 12.0;
          float runes = smoothstep(0.4, 0.5, sin(runeAng)) * smoothstep(0.78, 0.85, r) * smoothstep(0.92, 0.85, r);
          float pulse = 0.7 + 0.3 * sin(uTime * 3.0);
          float intensity = (outerRing + midRing * 0.7 + star * 0.9 + runes * 1.1) * pulse + fill;
          gl_FragColor = vec4(uColor * intensity * 1.7, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });

    this.mesh.material.uniforms.uTime.value = t01 * this.duration;

class LightPillar extends Effect {

      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;

        void main() {
          float vertical = smoothstep(1.0, 0.0, vUv.y) * smoothstep(0.0, 0.15, vUv.y);

          float pattern = sin(vUv.y * 30.0 - uTime * 8.0) * 0.5 + 0.5;

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

// ─── Shared part builders ──────────────────────────────────────────────────
function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.iron;
  const mid = palette.mid || M.ironHi;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.iron;
  const dark = palette.dark || M.iron;
  const hi = palette.hi || M.ironHi;
  const accent = palette.accent || M.brass;
  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);
  const knuckle = mesh(new THREE.BoxGeometry(0.16, 0.05, 0.08), accent);

  hand.position.y = -0.96;
  arm.add(hand);

  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;
  return arm;
}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  PYROMANCER — Magician I/VI                                              ║
// ║  Fire DoTs · Heat Wave · Long deep-red robe with flame-trim hem,        ║
// ║  tall pointed wizard hat, ★ flaming-orb staff ★, white wizard beard,   ║
// ║  floating ember-mote orbiting head, molten orange-red eye glow         ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Pyromancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = pyromancerAnimations;
  }

  // Override update — orbit the floating ember + pulse the staff fire-orb
  update(time, dt) {
    super.update(time, dt);
    if (this.emberOrbit) {
      this.emberOrbit.rotation.y = time * 0.7;
    }
    if (this.fireOrb) {
      this.fireOrb.scale.setScalar(1 + Math.sin(time * 2.2) * 0.08);
    }
  }

  build() {
    const root = this.group;

    // Legs — long red robes (no plate, full cloth)
    const buildPyroLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — pyroRed
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.pyroRed);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin (wider for robe drape)
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.pyroRedHi);
      shin.position.y = 0.36; leg.add(shin);
      // Black trim band at the hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.pyroBlack);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Flame-shaped trim tongues along the bottom of the robe (3 small flame cones per leg)
      for (let i = -1; i <= 1; i++) {
        const flameTrim = mesh(new THREE.ConeGeometry(0.025, 0.08, 5), M.pyroEmber);
        flameTrim.position.set(i * 0.07, 0.16, 0.18);
        flameTrim.rotation.x = Math.PI;
        leg.add(flameTrim);
      }
      // Closed slipper sole (dark)
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.pyroBlack);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildPyroLeg(-1));
    root.add(buildPyroLeg(1));

    // Pelvis — black leather belt with hanging fire-rune tome + ember pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.pyroRedDark));
    // Black belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.pyroBlack);
    belt.position.y = 0.04; pelvis.add(belt);
    // Brass buckle with flame-rune
    const buckle = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.pyroGoldHi);
    buckle.position.set(0, 0.04, 0.31); buckle.scale.set(1.4, 0.7, 0.5);
    pelvis.add(buckle);
    // Flame rune in buckle
    const buckleFlame = mesh(new THREE.ConeGeometry(0.02, 0.04, 5), M.pyroEmber);
    buckleFlame.position.set(0, 0.04, 0.34); pelvis.add(buckleFlame);
    // Tome hanging on the right side of belt (small leather book with chains)
    const tome = mesh(new THREE.BoxGeometry(0.08, 0.1, 0.025), M.pyroBlack);
    tome.position.set(0.28, -0.08, 0.18); tome.rotation.z = -0.15;
    pelvis.add(tome);
    // Tome's gold edge
    const tomeEdge = mesh(new THREE.BoxGeometry(0.082, 0.1, 0.005), M.pyroGold);
    tomeEdge.position.set(0.28, -0.08, 0.195); tomeEdge.rotation.z = -0.15;
    pelvis.add(tomeEdge);
    // Tome chain
    const tomeChain = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.08, 4), M.pyroGold);
    tomeChain.position.set(0.28, 0.0, 0.18);
    pelvis.add(tomeChain);
    // Pouches on the left side
    const pouch = mesh(new THREE.SphereGeometry(0.05, 12, 10), M.pyroRedDark);
    pouch.position.set(-0.28, -0.06, 0.18); pouch.scale.set(0.9, 1.2, 0.7);
    pelvis.add(pouch);
    // Robe drape continues below the belt
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.pyroRed);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    // Hem trim
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.pyroBlack);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Flame trim tongues around the robe hem (8 around)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const flame = mesh(new THREE.ConeGeometry(0.028, 0.09, 5), i % 2 === 0 ? M.pyroEmber : M.pyroGoldHi);
      flame.position.set(Math.cos(a) * 0.4, -0.4, Math.sin(a) * 0.4);
      flame.rotation.x = Math.PI;
      flame.rotation.z = (i % 2) * 0.1;
      pelvis.add(flame);
    }
    root.add(pelvis);

    // TORSO — deep red robe with black & gold trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Robe body
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.pyroRed);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);

    // Vertical black robe-stripe down the front (the priestly opening)
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.pyroBlack);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    // Gold trim down each side of the black stripe
    for (let side = -1; side <= 1; side += 2) {
      const sideStripe = mesh(new THREE.BoxGeometry(0.012, 0.65, 0.022), M.pyroGoldHi);
      sideStripe.position.set(side * 0.067, 0.0, 0.37);
      torso.add(sideStripe);
    }

    // Pec mounds (red)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.pyroRedHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — flame in a circle (the marquee Pyromancer symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.pyroBlack);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // Outer ring
    const emblemRing = mesh(new THREE.TorusGeometry(0.07, 0.008, 8, 18), M.pyroGoldHi);
    emblemRing.position.set(0, 0.22, 0.42); torso.add(emblemRing);
    // Central flame (cone shape with ember glow)
    const emblemFlame = mesh(new THREE.ConeGeometry(0.04, 0.08, 5), M.pyroEmber);
    emblemFlame.position.set(0, 0.22, 0.43);
    torso.add(emblemFlame);
    // Inner glow flame (smaller, brighter)
    const emblemFlameInner = mesh(new THREE.ConeGeometry(0.022, 0.05, 5), M.pyroGoldHi);
    emblemFlameInner.position.set(0, 0.22, 0.435);
    torso.add(emblemFlameInner);

    // Vertical flame-rune sigils flanking the emblem
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.018, 0.005), M.pyroEmber);
        sigil.position.set(side * 0.18, 0.12 - i * 0.1, 0.36);
        torso.add(sigil);
      }
    }

    // High collar — black with gold trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.pyroBlack);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.pyroGoldHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft red shoulder caps with flame-trim
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.pyroRedHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Black trim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.pyroBlack);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Gold flame-rune dot atop shoulder
      const shoulderDot = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.pyroEmber);
      shoulderDot.position.set(side * 0.42, 2.27, 0); shoulderDot.scale.set(1, 0.5, 1);
      root.add(shoulderDot);
    }

    // ARMS — red robes with WIDE flowing sleeves at wrist
    const armPalette = { cloth: M.pyroRed, mid: M.pyroRedHi, dark: M.pyroRedDark, hi: M.pyroBlack, accent: M.pyroGold };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Wide flared sleeves at the wrists
    [leftArm, rightArm].forEach(arm => {
      // Sleeve flare (cone-shaped — tight at top, wide at bottom)
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.pyroRed);
      sleeve.position.y = -0.82; arm.add(sleeve);
      // Black hem trim
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.pyroBlack);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Gold rune-line down the sleeve outside
      const runeLine = mesh(new THREE.BoxGeometry(0.005, 0.18, 0.005), M.pyroGoldHi);
      runeLine.position.set(0, -0.82, 0.12);
      arm.add(runeLine);
      // Flame trim tongues at the sleeve end (3 around)
      for (let i = -1; i <= 1; i++) {
        const flame = mesh(new THREE.ConeGeometry(0.018, 0.06, 5), M.pyroEmber);
        flame.position.set(i * 0.06, -0.95, 0.13);
        flame.rotation.x = Math.PI;
        arm.add(flame);
      }
    });

    // FLAMING-ORB STAFF — held in right hand
    const staff = this._buildFlameStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // Long red CAPE with black inner lining
    const cape = buildCape({ material: M.pyroRedDark, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape gold flame-trim along bottom hem
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.pyroGoldHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // 5 flame tongues along the cape hem
    for (let i = -2; i <= 2; i++) {
      const flame = mesh(new THREE.ConeGeometry(0.025, 0.1, 5), M.pyroEmber);
      flame.position.set(i * 0.18, 0.5, -0.13);
      flame.rotation.x = Math.PI;
      root.add(flame);
    }

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — pointed wizard hat + white wizard beard
    const head = this._buildPyromancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== FLOATING EMBER ORBIT — ember mote orbiting around the head =====
    this.emberOrbit = new THREE.Group();
    this.emberOrbit.position.set(0, 2.7, 0);
    // 3 small ember motes
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const ember = mesh(new THREE.SphereGeometry(0.03, 10, 8), M.pyroEmber);
      ember.position.set(Math.cos(a) * 0.42, Math.sin(a * 2) * 0.05, Math.sin(a) * 0.42);
      this.emberOrbit.add(ember);
      // Flame tail behind each ember
      const tail = mesh(new THREE.ConeGeometry(0.018, 0.06, 5), M.pyroGoldHi);
      tail.position.copy(ember.position);
      tail.position.x -= Math.sin(a) * 0.04;
      tail.position.z += Math.cos(a) * 0.04;
      tail.rotation.y = -a;
      this.emberOrbit.add(tail);
    }
    root.add(this.emberOrbit);

    M.pyroEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.pyroEye;
  }

  _buildFlameStaff() {
    const staff = new THREE.Group();
    // Pommel — gold cap
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.pyroGoldHi);
    staff.add(pommel);
    // Long black wooden haft
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.pyroBlack);
    haft.position.y = 0.74; staff.add(haft);
    // Gold cord wraps + ember-runes
    for (let i = 0; i < 7; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.pyroGold);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.2;
      staff.add(wrap);
    }
    // Mid-haft ember rune
    const midRune = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.pyroEmber);
    midRune.position.y = 0.74; midRune.scale.set(1, 0.5, 1);
    staff.add(midRune);
    // Top section — gold cradle
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.06, 12), M.pyroGoldHi);
    cradle.position.y = 1.46; staff.add(cradle);
    // 4 gold prongs curving up to hold the orb
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const prong = mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.12, 6), M.pyroGoldHi);
      prong.position.set(Math.cos(a) * 0.05, 1.55, Math.sin(a) * 0.05);
      prong.rotation.z = -Math.cos(a) * 0.4;
      prong.rotation.x = -Math.sin(a) * 0.4;
      staff.add(prong);
    }
    // FLAMING ORB at the top — bright pulsing fire-orb (the marquee feature)
    const orb = mesh(new THREE.SphereGeometry(0.075, 16, 14), M.pyroEmber);
    orb.position.y = 1.6; staff.add(orb);
    this.fireOrb = orb;
    // Inner brighter core
    const core = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.pyroGoldHi);
    core.position.y = 1.6; staff.add(core);
    // Flame tongues licking up from the orb (4 small cones radiating upward)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const flameLick = mesh(new THREE.ConeGeometry(0.022, 0.1, 5), M.pyroEmber);
      flameLick.position.set(Math.cos(a) * 0.05, 1.72 + Math.sin(a * 2) * 0.012, Math.sin(a) * 0.05);
      flameLick.rotation.x = (Math.random() - 0.5) * 0.2;
      flameLick.rotation.z = Math.cos(a) * 0.2;
      staff.add(flameLick);
    }
    return staff;
  }

  _buildPyromancerHead() {
    const head = new THREE.Group();

    // Face skin (visible above the beard)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // White wizard beard (LONG, voluminous — covers most of lower face)
    const beard = mesh(new THREE.SphereGeometry(0.16, 16, 12), M.cryoFrost || M.pyroGoldHi);
    beard.position.set(0, -0.18, 0.1); beard.scale.set(1.05, 1.4, 0.9);
    head.add(beard);
    // Beard tip (pointier at the bottom)
    const beardTip = mesh(new THREE.ConeGeometry(0.06, 0.16, 6), M.cryoFrost || M.pyroGoldHi);
    beardTip.position.set(0, -0.36, 0.05); beardTip.rotation.x = Math.PI;
    head.add(beardTip);
    // White mustache (over the upper lip)
    for (let side = -1; side <= 1; side += 2) {
      const mustache = mesh(new THREE.BoxGeometry(0.06, 0.018, 0.012), M.cryoFrost || M.pyroGoldHi);
      mustache.position.set(side * 0.05, -0.08, 0.21); mustache.rotation.z = side * 0.18;
      head.add(mustache);
    }

    // Eyes — molten orange-red glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.pyroEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Bushy eyebrows (wizard signature)
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.06, 0.015, 0.012), M.cryoFrost || M.pyroGoldHi);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.18;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // ===== TALL POINTED WIZARD HAT (the marquee feature) =====
    // Hat brim (wide, slightly drooping)
    const brim = mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.025, 18), M.pyroBlack);
    brim.position.y = 0.13; head.add(brim);
    // Gold trim under the brim
    const brimTrim = mesh(new THREE.TorusGeometry(0.32, 0.012, 8, 24), M.pyroGoldHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.116;
    head.add(brimTrim);
    // Hat body (tall cone — tapering to a point)
    const hatCone = mesh(new THREE.ConeGeometry(0.22, 0.6, 14), M.pyroRed);
    hatCone.position.y = 0.45; head.add(hatCone);
    // Hat trim band at the base
    const hatBand = mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.05, 16), M.pyroBlack);
    hatBand.position.y = 0.18; head.add(hatBand);
    // Gold buckle on the band
    const hatBuckle = mesh(new THREE.BoxGeometry(0.07, 0.04, 0.018), M.pyroGoldHi);
    hatBuckle.position.set(0, 0.18, 0.225); head.add(hatBuckle);
    // Flame-rune dot on the buckle
    const hatRune = mesh(new THREE.SphereGeometry(0.015, 10, 8), M.pyroEmber);
    hatRune.position.set(0, 0.18, 0.235);
    head.add(hatRune);
    // Hat tip slightly bent forward (classic wizard hat curve)
    const hatTip = mesh(new THREE.ConeGeometry(0.04, 0.14, 8), M.pyroRedHi);
    hatTip.position.set(0.04, 0.78, 0); hatTip.rotation.z = -0.4;
    head.add(hatTip);
    // Gold flame-trim around the bottom of the hat-band (5 small flame cones)
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * 0.5 + (i / 4) * Math.PI;
      const flame = mesh(new THREE.ConeGeometry(0.022, 0.08, 5), M.pyroEmber);
      flame.position.set(Math.cos(a) * 0.225, 0.27, Math.sin(a) * 0.225);
      head.add(flame);
    }

    return head;
  }
}

        // Lingering rune (the ignite DoT)
        mgr.spawn(new RuneRing(champ.scene, groundPos, { color: 0xff5800, maxRadius: 0.9, duration: 1.4, runeCount: 6, rotateSpeed: 1.0 }), time);
      }},
    ],

  // FIREBALL — both arms gather flame, hurl forward AoE
  spell1: {
    duration: 1.4,

    effects: [

        // Fire gathers between hands at chest
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const handsPos = new THREE.Vector3(champPos.x, 2.0, champPos.z + 0.3);
        mgr.spawn(new ImpactFlash(champ.scene, handsPos, { color: 0xff8830, maxScale: 0.55, duration: 0.6 }), time);
        mgr.spawn(new ParticleBurst(champ.scene, handsPos, { color: 0xff5800, count: 32, speed: 1.0, duration: 0.5, upwardBias: 0, gravity: 0 }), time);
      }},
      { time: 0.55, fn: (champ, mgr, time) => {

        mgr.spawn(new ImpactFlash(champ.scene, blastPos, { color: 0xff8830, maxScale: 1.0, duration: 0.4 }), time);

        mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xff8830, maxRadius: 2.6, duration: 0.75 }), time);
        // Fire pillar at center
        mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0xff5800, height: 4.0, radius: 0.6, duration: 0.7 }), time);
        // Big fire particle burst
        mgr.spawn(new ParticleBurst(champ.scene, blastPos, { color: 0xff5800, count: 80, speed: 6, duration: 1.2, upwardBias: 2.0, gravity: -1.5 }), time);
        mgr.spawn(new ParticleBurst(champ.scene, blastPos, { color: 0xff8830, count: 50, speed: 4, duration: 1.4, upwardBias: 2.4, gravity: -1.0 }), time);
        // Burn rune (lingering DoT)
        mgr.spawn(new RuneRing(champ.scene, groundPos, { color: 0xff5800, maxRadius: 1.6, duration: 1.4, runeCount: 8, rotateSpeed: 0.8 }), time);
      }},
    ],
  },
  // COMBUSTION — staff held high, big delayed detonation
  spell2: {
    duration: 1.8,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.22, values: {                                          // raise staff to the heavens
        rightArm: { rx: 1.15, rz: -0.05 },
        leftArm:  { rx: 0.55, rz: -0.55 },
        body:     { rx: -0.12 },
        head:     { rx: -0.16 },
      }, ease: ease.outBack },
      { t: 0.78, values: {                                          // hold the gather pose
        rightArm: { rx: 1.15, rz: -0.05 },
        leftArm:  { rx: 0.55, rz: -0.55 },
        body:     { rx: -0.12 },
        head:     { rx: -0.16 },
      }},
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.22, fn: (champ, mgr, time) => {
        // Build-up — orb glows brighter, flame mass forms above
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const skyPos = new THREE.Vector3(champPos.x, 4.5, champPos.z);
        mgr.spawn(new ImpactFlash(champ.scene, skyPos, { color: 0xff8830, maxScale: 0.7, duration: 1.4 }), time);
        // Gathering particles spiral inward
        mgr.spawn(new ParticleBurst(champ.scene, skyPos, { color: 0xff5800, count: 60, speed: 1.2, duration: 1.4, upwardBias: -0.5, gravity: 0.2 }), time);

        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const skyPos = new THREE.Vector3(champPos.x, 4.5, champPos.z);
        mgr.spawn(new ImpactFlash(champ.scene, skyPos, { color: 0xffe080, maxScale: 0.85, duration: 0.7 }), time);

        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);

        for (let i = 0; i < 4; i++) {
          const a = -Math.PI * 0.4 + (i / 3) * Math.PI * 0.8;
          const dist = 1.5 + Math.random() * 0.5;
          const pos = new THREE.Vector3(champPos.x + Math.cos(a) * dist, 0.5, champPos.z + Math.abs(Math.sin(a)) * dist + 0.6);

          mgr.spawn(new FilledShockwave(champ.scene, groundPos, { color: 0xff5800, maxRadius: 1.4, duration: 0.5 }), time + i * 0.08);

          mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0xff5800, height: 3.5, radius: 0.5, duration: 0.6 }), time + i * 0.08);
          mgr.spawn(new ParticleBurst(champ.scene, pos, { color: 0xff5800, count: 50, speed: 5, duration: 1.0, upwardBias: 1.8, gravity: -1.5 }), time + i * 0.08);
        }

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  CRYOMANCER — Magician II/VI                                             ║
// ║  Ice Control · Glacial Force · Pale-blue + ice-white robes, ★ icicle-  ║
// ║  spike crown ★, prism-topped staff, orbital ice-shards above head,    ║
// ║  frost-trim robe, ice-cyan eye glow                                    ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Cryomancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = cryomancerAnimations;
  }

  // Override update — orbit ice shards, shimmer the staff prism
  update(time, dt) {
    super.update(time, dt);
    if (this.iceShards) {
      this.iceShards.rotation.y = time * 0.5;
    }
    if (this.staffPrism) {
      this.staffPrism.rotation.y = time * 0.8;
    }
  }

  build() {
    const root = this.group;

    // Legs — pale blue robes with ice-white shin trim
    const buildCryoLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — cryoIce
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.cryoIce);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin — ice-light wider drape
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.cryoIceLight);
      shin.position.y = 0.36; leg.add(shin);
      // Cyan-trim band at hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.cryoIceDark);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Ice-shard spikes around the hem (3 small shards)
      for (let i = -1; i <= 1; i++) {
        const shard = mesh(new THREE.OctahedronGeometry(0.025, 0), M.cryoCrystal);
        shard.position.set(i * 0.07, 0.18, 0.18);
        leg.add(shard);
      }
      // Boot — pale blue
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.cryoIceDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildCryoLeg(-1));
    root.add(buildCryoLeg(1));

    // Pelvis — silver belt with ice-shard ornaments
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.cryoIceDark));
    // Silver belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.cryoSilver);
    belt.position.y = 0.04; pelvis.add(belt);
    // Crystal buckle (octahedron)
    const buckle = mesh(new THREE.OctahedronGeometry(0.04, 0), M.cryoCrystal);
    buckle.position.set(0, 0.04, 0.32); buckle.scale.set(1.2, 0.7, 0.5);
    pelvis.add(buckle);
    // Hanging ice shards from belt (5 across)
    for (let i = -2; i <= 2; i++) {
      const shard = mesh(new THREE.OctahedronGeometry(0.02 + (Math.abs(i) % 2) * 0.005, 0), M.cryoCrystal);
      shard.position.set(i * 0.06, -0.09, 0.31);
      pelvis.add(shard);
      // Cord
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.06, 4), M.cryoSilver);
      cord.position.set(i * 0.06, -0.04, 0.31);
      pelvis.add(cord);
    }
    // Robe drape continues
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.cryoIce);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    // Cyan trim
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.cryoIceDark);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Ice-shard spikes around the hem (8)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const shard = mesh(new THREE.OctahedronGeometry(0.025, 0), M.cryoCrystal);
      shard.position.set(Math.cos(a) * 0.4, -0.4, Math.sin(a) * 0.4);
      shard.scale.y = 1.5;
      pelvis.add(shard);
    }
    root.add(pelvis);

    // TORSO — pale blue robe with frost-white trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Robe body
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.cryoIce);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);

    // Vertical white frost-stripe down the front
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.cryoFrost);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    // Cyan trim down each side
    for (let side = -1; side <= 1; side += 2) {
      const sideStripe = mesh(new THREE.BoxGeometry(0.012, 0.65, 0.022), M.cryoCrystal);
      sideStripe.position.set(side * 0.067, 0.0, 0.37);
      torso.add(sideStripe);
    }

    // Pec mounds (pale blue)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.cryoIceLight);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — six-point snowflake (the marquee Cryomancer symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.cryoIceDark);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // 6 snowflake arms radiating from center
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      // Main arm
      const arm = mesh(new THREE.BoxGeometry(0.005, 0.07, 0.005), M.cryoCrystal);
      arm.position.set(Math.cos(a) * 0.038, 0.22 + Math.sin(a) * 0.038, 0.42);
      arm.rotation.z = a + Math.PI / 2;
      torso.add(arm);
      // Small side branches at the tip
      for (let j = -1; j <= 1; j += 2) {
        const branch = mesh(new THREE.BoxGeometry(0.003, 0.025, 0.005), M.cryoCrystal);
        const bx = Math.cos(a) * 0.06 + Math.cos(a + j * Math.PI / 4) * 0.012;
        const by = 0.22 + Math.sin(a) * 0.06 + Math.sin(a + j * Math.PI / 4) * 0.012;
        branch.position.set(bx, by, 0.42);
        branch.rotation.z = a + Math.PI / 2 + j * Math.PI / 6;
        torso.add(branch);
      }
    }
    // Center crystal gem
    const emblemGem = mesh(new THREE.OctahedronGeometry(0.018, 0), M.cryoCrystal);
    emblemGem.position.set(0, 0.22, 0.43);
    torso.add(emblemGem);

    // Ice-rune sigils flanking
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.012, 0.005), M.cryoCrystal);
        sigil.position.set(side * 0.18, 0.12 - i * 0.1, 0.36);
        sigil.rotation.z = Math.PI / 4;
        torso.add(sigil);
      }
    }

    // High collar — frost white with cyan trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.cryoFrost);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.cryoCrystal);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Soft pale-blue shoulder caps
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.cryoIceLight);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Cyan trim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.cryoCrystal);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Ice-shard atop each shoulder
      const shoulderShard = mesh(new THREE.OctahedronGeometry(0.03, 0), M.cryoCrystal);
      shoulderShard.position.set(side * 0.42, 2.3, 0); shoulderShard.scale.y = 1.6;
      root.add(shoulderShard);
    }

    // ARMS — pale blue robe with white wide sleeves
    const armPalette = { cloth: M.cryoIce, mid: M.cryoIceLight, dark: M.cryoIceDark, hi: M.cryoFrost, accent: M.cryoCrystal };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Wide white-flared sleeves
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.cryoFrost);
      sleeve.position.y = -0.82; arm.add(sleeve);
      // Cyan hem trim
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.cryoCrystal);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Crystal-shards at the sleeve end (3 around)
      for (let i = -1; i <= 1; i++) {
        const shard = mesh(new THREE.OctahedronGeometry(0.018, 0), M.cryoCrystal);
        shard.position.set(i * 0.06, -0.95, 0.13);
        arm.add(shard);
      }
    });

    // ICE-PRISM STAFF — held in right hand
    const staff = this._buildIceStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // CAPE — pale blue with cyan-frost lining
    const cape = buildCape({ material: M.cryoIce, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape silver trim along bottom
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.cryoSilverHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // Ice-shard fringes along cape hem
    for (let i = -2; i <= 2; i++) {
      const shard = mesh(new THREE.OctahedronGeometry(0.024, 0), M.cryoCrystal);
      shard.position.set(i * 0.18, 0.5, -0.13);
      shard.scale.y = 1.6;
      root.add(shard);
    }

    // Neck (pale skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — icicle crown + frost mage face
    const head = this._buildCryomancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== ORBITAL ICE-SHARDS — 4 shards rotating slowly above the head =====
    this.iceShards = new THREE.Group();
    this.iceShards.position.set(0, 2.95, 0);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const shard = mesh(new THREE.OctahedronGeometry(0.045, 0), M.cryoCrystal);
      shard.position.set(Math.cos(a) * 0.4, Math.sin(a * 2) * 0.04, Math.sin(a) * 0.4);
      shard.scale.y = 1.8;
      this.iceShards.add(shard);
    }
    root.add(this.iceShards);

    M.cryoEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.cryoEye;
  }

  _buildIceStaff() {
    const staff = new THREE.Group();
    // Pommel — silver cap
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.cryoSilverHi);
    staff.add(pommel);
    // Long staff haft (pale ice-blue)
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.cryoIceDark);
    haft.position.y = 0.74; staff.add(haft);
    // Silver bands + crystal runes
    for (let i = 0; i < 7; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.cryoSilver);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.2;
      staff.add(wrap);
    }
    // Mid-haft crystal gem
    const midGem = mesh(new THREE.OctahedronGeometry(0.022, 0), M.cryoCrystal);
    midGem.position.y = 0.74;
    staff.add(midGem);
    // Top section — silver claw cradle
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.06, 12), M.cryoSilverHi);
    cradle.position.y = 1.46; staff.add(cradle);
    // 5 silver claws curving up
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const claw = mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.16, 6), M.cryoSilverHi);
      claw.position.set(Math.cos(a) * 0.05, 1.55, Math.sin(a) * 0.05);
      claw.rotation.z = -Math.cos(a) * 0.5;
      claw.rotation.x = -Math.sin(a) * 0.5;
      staff.add(claw);
    }
    // BIG ICE PRISM at the top (the marquee — large rotating octahedron)
    const prism = mesh(new THREE.OctahedronGeometry(0.1, 0), M.cryoCrystal);
    prism.position.y = 1.65; prism.scale.y = 1.3;
    staff.add(prism);
    this.staffPrism = prism;
    // Inner brighter prism
    const prismInner = mesh(new THREE.OctahedronGeometry(0.06, 0), M.cryoFrost);
    prismInner.position.y = 1.65; prismInner.scale.y = 1.3;
    staff.add(prismInner);
    // 4 small ice-shards floating around the prism
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const miniShard = mesh(new THREE.OctahedronGeometry(0.022, 0), M.cryoCrystal);
      miniShard.position.set(Math.cos(a) * 0.16, 1.65 + Math.sin(a * 2) * 0.04, Math.sin(a) * 0.16);
      miniShard.scale.y = 1.5;
      staff.add(miniShard);
    }
    return staff;
  }

  _buildCryomancerHead() {
    const head = new THREE.Group();

    // Pale skin face
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Pale silver-white hair
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.cryoFrost);
    scalp.scale.set(1, 1.05, 1.05);
    scalp.position.y = 0.04;
    head.add(scalp);

    // Long flowing pale hair behind
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.cryoFrost);
    backHair.scale.set(1.05, 1.5, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);

    // ===== ICICLE CROWN (the marquee feature) — radiating ice spikes around the head =====
    // Silver base ring
    const crownBase = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 24), M.cryoSilverHi);
    crownBase.rotation.x = Math.PI / 2;
    crownBase.position.y = 0.04;
    head.add(crownBase);
    // 8 icicle spikes radiating upward + outward (alternating sizes)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const big = i % 2 === 0;
      const len = big ? 0.22 : 0.14;
      const spike = mesh(new THREE.OctahedronGeometry(0.026, 0), M.cryoCrystal);
      spike.position.set(Math.cos(a) * 0.21, 0.13 + Math.sin(a) * 0.01, Math.sin(a) * 0.21);
      spike.scale.set(0.6, len / 0.026 * 0.5, 0.6);
      // Tilt outward slightly
      spike.lookAt(Math.cos(a) * 2, 0.5, Math.sin(a) * 2);
      head.add(spike);
    }
    // Front-center large crystal (forehead jewel)
    const browGem = mesh(new THREE.OctahedronGeometry(0.04, 0), M.cryoCrystal);
    browGem.position.set(0, 0.06, 0.21); browGem.scale.set(1.0, 1.5, 0.7);
    head.add(browGem);

    // Eyes — ice-cyan glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.cryoEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Cold eyebrows (white)
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.cryoFrost);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.15;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skinPale);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (slight cool smirk)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    return head;
  }
}

// ║  Lightning Chains · Static Field · Storm-blue robes, ★ wide-brimmed    ║

class Stormcaller extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = stormcallerAnimations;
  }

  // Override update — pulse the lightning runes + flicker the staff arcs
  update(time, dt) {
    super.update(time, dt);
    if (this.staffArcs) {
      // Random flicker on intensity
      const flicker = (Math.sin(time * 12) + Math.sin(time * 23) * 0.5) * 0.5 + 1.5;
      this.staffArcs.forEach(arc => arc.scale.setScalar(0.8 + flicker * 0.3));
    }
  }

  build() {
    const root = this.group;

    // Legs — storm-blue robes
    const buildStormLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.stormBlue);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.stormBlueHi);
      shin.position.y = 0.36; leg.add(shin);
      // Copper trim band at hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.stormCopper);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Electric-rune sigils on the trim
      for (let i = -1; i <= 1; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.025, 0.03, 0.005), M.stormBolt);
        sigil.position.set(i * 0.07, 0.12, 0.22);
        leg.add(sigil);
      }
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.stormSlate);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildStormLeg(-1));
    root.add(buildStormLeg(1));

    // Pelvis — copper belt + lightning-rune dangling charms
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.stormBlue));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.stormCopper);
    belt.position.y = 0.04; pelvis.add(belt);
    // Copper lightning-bolt buckle
    const buckle = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.stormCopperHi);
    buckle.position.set(0, 0.04, 0.31); buckle.scale.set(1.5, 0.7, 0.5);
    pelvis.add(buckle);
    // Lightning-bolt rune in buckle (zigzag — represented as 3 small angled boxes)

      const segment = mesh(new THREE.BoxGeometry(0.02, 0.012, 0.005), M.stormBolt);
      segment.position.set(-0.018 + i * 0.018, 0.05 - i * 0.012, 0.34);

    // Hanging copper-coil charms

      const coil = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.stormCopperHi);
      coil.rotation.x = Math.PI / 2; coil.position.set(i * 0.18, -0.06, 0.18);
      pelvis.add(coil);
      const coilGem = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.stormBolt);
      coilGem.position.set(i * 0.18, -0.06, 0.2);
      pelvis.add(coilGem);
    }
    // Robe drape continues
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.stormBlue);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.stormCopper);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Lightning-rune trim around the hem (8 small zigzags)
    for (let i = 0; i < 8; i++) {

    // TORSO — storm-blue robe with copper trim

    torso.position.y = 1.85;

        torso.add(sigil);

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.stormBlueHi);

    collarTrim.rotation.x = Math.PI / 2;

    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);

    // Shoulders with lightning rune accents
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.stormBlueHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.stormCopperHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Lightning-bolt sigil atop
      const shoulderBolt = mesh(new THREE.BoxGeometry(0.025, 0.025, 0.005), M.stormBolt);
      shoulderBolt.position.set(side * 0.42, 2.27, 0); shoulderBolt.rotation.z = Math.PI / 6;
      root.add(shoulderBolt);
    }

    // Arms
    const armPalette = { cloth: M.stormBlue, mid: M.stormBlueHi, dark: M.stormSlate, hi: M.stormCopper, accent: M.stormCopperHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide flared sleeves
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.stormBlueHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.stormCopperHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Lightning-rune sigils on sleeve hem
      for (let i = -1; i <= 1; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.018, 0.022, 0.005), M.stormBolt);
        sigil.position.set(i * 0.06, -0.95, 0.13);
        arm.add(sigil);
      }
    });

    // LIGHTNING-COIL STAFF
    const staff = this._buildLightningStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // CAPE — stormcloud
    const cape = buildCape({ material: M.stormCape, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.stormCopperHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — wide-brimmed conjurer's hat
    const head = this._buildStormcallerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.stormEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.stormEye;
  }

  _buildLightningStaff() {
    const staff = new THREE.Group();
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.stormCopperHi);
    staff.add(pommel);
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.stormBlueHi);
    haft.position.y = 0.74; staff.add(haft);
    // Copper coil wrap (the lightning-rod look — many tight coils along the haft)
    for (let i = 0; i < 28; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.027, 0.005, 4, 10), M.stormCopperHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.05;
      staff.add(wrap);
    }
    // Top section — copper claw cradle (4 prongs holding a lightning-orb)
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.06, 12), M.stormCopperHi);
    cradle.position.y = 1.46; staff.add(cradle);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const prong = mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.16, 6), M.stormCopperHi);
      prong.position.set(Math.cos(a) * 0.06, 1.55, Math.sin(a) * 0.06);
      prong.rotation.z = -Math.cos(a) * 0.5;
      prong.rotation.x = -Math.sin(a) * 0.5;
      staff.add(prong);
    }
    // CENTER BOLT-ORB — pulsing lightning gem
    const orb = mesh(new THREE.SphereGeometry(0.075, 16, 14), M.stormBolt);
    orb.position.y = 1.65; staff.add(orb);
    // 5 lightning arcs jutting outward (the marquee effect)
    this.staffArcs = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      // Arc segments (zigzag)
      const arc = new THREE.Group();
      arc.position.set(Math.cos(a) * 0.1, 1.65, Math.sin(a) * 0.1);
      for (let j = 0; j < 4; j++) {
        const segment = mesh(new THREE.BoxGeometry(0.012, 0.024, 0.005), M.stormBolt);
        segment.position.set(Math.cos(a) * 0.05 * j, j * 0.04, Math.sin(a) * 0.05 * j);
        segment.rotation.z = (j % 2 === 0 ? 1 : -1) * 0.6;
        arc.add(segment);
      }
      staff.add(arc);
      this.staffArcs.push(arc);
    }
    // Top spike
    const topSpike = mesh(new THREE.ConeGeometry(0.018, 0.1, 6), M.stormCopperHi);
    topSpike.position.y = 1.82; staff.add(topSpike);
    return staff;
  }

  _buildStormcallerHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Slate-grey beard (storm wizard look — shorter than Pyromancer's)
    const beard = mesh(new THREE.SphereGeometry(0.12, 14, 10), M.stormSlate);
    beard.position.set(0, -0.18, 0.08); beard.scale.set(1.0, 1.1, 0.8);
    head.add(beard);
    // Mustache
    for (let side = -1; side <= 1; side += 2) {
      const mustache = mesh(new THREE.BoxGeometry(0.05, 0.014, 0.012), M.stormSlate);
      mustache.position.set(side * 0.04, -0.09, 0.21); mustache.rotation.z = side * 0.2;
      head.add(mustache);
    }

    // Eyes — electric pale-violet
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.stormEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // ===== WIDE-BRIMMED CONJURER'S HAT (the marquee feature) =====
    // Wide flat brim (much wider than typical wizard hat — like a witch hat brim)
    const brim = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.025, 22), M.stormBlueHi);
    brim.position.y = 0.14; head.add(brim);
    // Copper trim under the brim
    const brimTrim = mesh(new THREE.TorusGeometry(0.42, 0.012, 8, 28), M.stormCopperHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.126;
    head.add(brimTrim);
    // Hat cone (slightly tilted, classic conjurer profile)
    const hatCone = mesh(new THREE.ConeGeometry(0.22, 0.55, 14), M.stormBlue);
    hatCone.position.set(0.02, 0.42, -0.02); hatCone.rotation.z = -0.05;
    head.add(hatCone);
    // Hat band
    const hatBand = mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.05, 16), M.stormCopper);
    hatBand.position.y = 0.18; head.add(hatBand);
    // Lightning-bolt buckle on the band (front)
    for (let i = 0; i < 4; i++) {
      const segment = mesh(new THREE.BoxGeometry(0.018, 0.014, 0.005), M.stormBolt);
      segment.position.set(-0.014 + i * 0.014, 0.19 - i * 0.008, 0.225);
      segment.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.7;
      head.add(segment);
    }
    // Top tip slightly bent
    const hatTip = mesh(new THREE.ConeGeometry(0.04, 0.12, 8), M.stormBlueHi);
    hatTip.position.set(0.06, 0.72, -0.04); hatTip.rotation.z = -0.4;
    head.add(hatTip);
    // Lightning-arc ornaments on the hat brim (4 small zigzags)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const arcOrn = mesh(new THREE.BoxGeometry(0.025, 0.025, 0.005), M.stormBolt);
      arcOrn.position.set(Math.cos(a) * 0.42, 0.16, Math.sin(a) * 0.42);
      arcOrn.rotation.z = Math.PI / 6;
      head.add(arcOrn);
    }

    return head;
  }
}
