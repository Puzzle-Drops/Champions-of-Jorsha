Stormcaller._chainHop = function(champ, mgr, time, xOff, yBase, zOff) {
  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  const target = new THREE.Vector3(champPos.x + xOff, 1.5, champPos.z + zOff);
  mgr.spawn(new ImpactFlash(champ.scene, target, { color: 0xeae0ff, maxScale: 0.5, duration: 0.25 }), time);
  const groundPos = new THREE.Vector3(target.x, 0.12, target.z);
  mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xa898ff, maxRadius: 0.9, duration: 0.5 }), time);
  mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0xeae0ff, height: 2.0, radius: 0.2, duration: 0.4 }), time);
  mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0xeae0ff, count: 16, speed: 4, duration: 0.55, upwardBias: 0.6, gravity: -2.5 }), time);
};

Stormcaller._stormStrike = function(champ, mgr, time) {
  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  const a = Math.random() * Math.PI * 2;
  const r = 0.5 + Math.random() * 1.8;
  const target = new THREE.Vector3(champPos.x + Math.cos(a) * r, 1.5, champPos.z + Math.sin(a) * r + 0.6);
  const groundPos = new THREE.Vector3(target.x, 0.12, target.z);
  mgr.spawn(new ImpactFlash(champ.scene, target, { color: 0xffffff, maxScale: 0.6, duration: 0.25 }), time);
  mgr.spawn(new LightPillar(champ.scene, groundPos, { color: 0xeae0ff, height: 4.5, radius: 0.4, duration: 0.5 }), time);
  mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0xa898ff, maxRadius: 1.4, duration: 0.55 }), time);
  mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0xeae0ff, count: 24, speed: 5, duration: 0.7, upwardBias: 0.4, gravity: -2.5 }), time);
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ARCANIST — Magician IV/VI                                               ║
// ║  Pure Burst · Arcane Mind · Deep blue-violet robes with circuit-pattern║
// ║  trim, ★ floating arcane orb next to right hand ★ (no staff), tall    ║
// ║  rune-script wizard hat, pure violet eye glow                          ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Arcanist extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = arcanistAnimations;
  }

  // Override update — pulse the orb, orbit the rune-shards around it
  update(time, dt) {
    super.update(time, dt);
    if (this.arcOrbAnchor) {
      this.arcOrbAnchor.rotation.y = time * 0.7;
    }
    if (this.arcOrb) {
      this.arcOrb.scale.setScalar(1 + Math.sin(time * 1.8) * 0.06);
    }
  }

  build() {
    const root = this.group;

    // Legs — deep blue-violet robes
    const buildArcLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.arcRobe);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.arcRobeHi);
      shin.position.y = 0.36; leg.add(shin);
      // Silver-circuit trim band at hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.arcSilver);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Circuit-rune sigils on the trim
      for (let i = -2; i <= 2; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.018, 0.005), M.arcCircuit);
        sigil.position.set(i * 0.05, 0.13, 0.22);
        leg.add(sigil);
      }
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.arcRobeDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildArcLeg(-1));
    root.add(buildArcLeg(1));

    // Pelvis — silver belt with arcane-rune sigils
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.arcRobeDark));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.arcSilver);
    belt.position.y = 0.04; pelvis.add(belt);
    // Diamond arcane buckle
    const buckle = mesh(new THREE.OctahedronGeometry(0.04, 0), M.arcCircuit);
    buckle.position.set(0, 0.04, 0.32); buckle.scale.set(1.4, 0.7, 0.5);
    pelvis.add(buckle);
    // Arcane circuit-runes around the belt (8 small sigils)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const sigil = mesh(new THREE.BoxGeometry(0.014, 0.018, 0.005), M.arcCircuit);
      sigil.position.set(Math.cos(a) * 0.31, 0.04, Math.sin(a) * 0.31);
      sigil.lookAt(Math.cos(a) * 2, 0.04, Math.sin(a) * 2);
      pelvis.add(sigil);
    }
    // Robe drape continues
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.arcRobe);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.arcSilver);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Arcane circuit pattern on the hem (8 lines + 8 dots)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const line = mesh(new THREE.BoxGeometry(0.008, 0.05, 0.005), M.arcCircuit);
      line.position.set(Math.cos(a) * 0.4, -0.4, Math.sin(a) * 0.4);
      line.lookAt(Math.cos(a) * 2, -0.4, Math.sin(a) * 2);
      pelvis.add(line);
      const dot = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.arcCircuit);
      dot.position.set(Math.cos(a) * 0.4, -0.36, Math.sin(a) * 0.4);
      pelvis.add(dot);
    }
    root.add(pelvis);

    // TORSO — deep arcane robe with circuit-pattern silver trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.arcRobe);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Vertical silver-circuit stripe down front
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.arcRobeDark);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    // Side circuit lines
    for (let side = -1; side <= 1; side += 2) {
      const sideStripe = mesh(new THREE.BoxGeometry(0.012, 0.65, 0.022), M.arcCircuit);
      sideStripe.position.set(side * 0.067, 0.0, 0.37);
      torso.add(sideStripe);
    }
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.arcRobeHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — 4-pointed arcane diamond
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.arcRobeDark);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // Outer 4-point diamond
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const ray = mesh(new THREE.ConeGeometry(0.014, 0.07, 4), M.arcCircuit);
      ray.position.set(Math.cos(a) * 0.04, 0.22 + Math.sin(a) * 0.04, 0.42);
      ray.rotation.z = a - Math.PI / 2;
      torso.add(ray);
    }
    // Center violet orb gem
    const emblemOrb = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.arcOrb);
    emblemOrb.position.set(0, 0.22, 0.43);
    torso.add(emblemOrb);
    // 4 small dots between the rays (8-pointed enrichment)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const dot = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.arcCircuit);
      dot.position.set(Math.cos(a) * 0.06, 0.22 + Math.sin(a) * 0.06, 0.42);
      torso.add(dot);
    }

    // Vertical circuit-rune sigils flanking
    for (let side = -1; side <= 1; side += 2) {
      // Vertical line
      const line = mesh(new THREE.BoxGeometry(0.005, 0.32, 0.005), M.arcCircuit);
      line.position.set(side * 0.18, 0.05, 0.36);
      torso.add(line);
      // Circuit-junction dots along the line
      for (let i = 0; i < 4; i++) {
        const dot = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.arcCircuit);
        dot.position.set(side * 0.18, 0.16 - i * 0.08, 0.37);
        torso.add(dot);
      }
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.arcRobeHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.arcSilverHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Shoulder caps with diamond rune accents
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.arcRobeHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.arcSilver);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Diamond rune atop shoulder
      const shoulderDia = mesh(new THREE.OctahedronGeometry(0.025, 0), M.arcCircuit);
      shoulderDia.position.set(side * 0.42, 2.27, 0); shoulderDia.scale.y = 1.5;
      root.add(shoulderDia);
    }

    // Arms
    const armPalette = { cloth: M.arcRobe, mid: M.arcRobeHi, dark: M.arcRobeDark, hi: M.arcSilver, accent: M.arcCircuit };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide flared sleeves with circuit rune trim
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.arcRobeHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.arcSilverHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Rune dots on the sleeve hem
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const dot = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.arcCircuit);
        dot.position.set(Math.cos(a) * 0.16, -0.96, Math.sin(a) * 0.16);
        arm.add(dot);
      }
    });

    // ===== FLOATING ARCANE ORB — hovers near the right hand, NO STAFF (the marquee feature) =====
    this.arcOrbAnchor = new THREE.Group();
    rightArm.userData.hand.add(this.arcOrbAnchor);
    this.arcOrbAnchor.position.set(0, 0.04, 0.18);
    // Main orb
    const arcOrb = mesh(new THREE.SphereGeometry(0.085, 18, 14), M.arcOrb);
    arcOrb.position.set(0, 0, 0);
    this.arcOrbAnchor.add(arcOrb);
    this.arcOrb = arcOrb;
    // Inner brighter core
    const arcOrbCore = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.arcSilverHi);
    this.arcOrbAnchor.add(arcOrbCore);
    // 5 orbital rune-shards floating around the orb
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const shardShape = new THREE.Shape();
      shardShape.moveTo(0, -0.025); shardShape.lineTo(0.018, 0);
      shardShape.lineTo(0, 0.04); shardShape.lineTo(-0.018, 0); shardShape.closePath();
      const shard = mesh(new THREE.ExtrudeGeometry(shardShape, { depth: 0.008, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 1 }), M.arcCircuit);
      shard.position.set(Math.cos(a) * 0.18, Math.sin(a) * 0.04, Math.sin(a) * 0.18);
      shard.rotation.set(0, -a + Math.PI / 2, 0);
      this.arcOrbAnchor.add(shard);
    }
    // Light pillar from hand into orb (the magical conduit)
    const conduit = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 8), M.arcCircuit);
    conduit.position.set(0, -0.08, 0);
    this.arcOrbAnchor.add(conduit);

    // CAPE — deep arcane with silver-circuit trim
    const cape = buildCape({ material: M.arcRobeDark, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.arcSilverHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // Rune-symbol fringes
    for (let i = -2; i <= 2; i++) {
      const sigil = mesh(new THREE.OctahedronGeometry(0.022, 0), M.arcCircuit);
      sigil.position.set(i * 0.18, 0.5, -0.12);
      root.add(sigil);
    }

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — rune-script tall hat
    const head = this._buildArcanistHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.arcEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.arcEye;
  }

  _buildArcanistHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Long dark hair sides (no beard — clean-shaven scholar)
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.CylinderGeometry(0.022, 0.018, 0.18, 8), M.arcRobeDark);
      sideHair.position.set(side * 0.18, -0.08, 0.05); sideHair.rotation.z = side * 0.1;
      head.add(sideHair);
    }

    // Eyes — pure violet glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.arcEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Sharp scholarly eyebrows
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.arcRobeDark);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.15;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth — calm focused line
    const mouth = mesh(new THREE.BoxGeometry(0.05, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // ===== TALL RUNE-SCRIPT HAT (the marquee feature) =====
    // Hat brim (thin, modest)
    const brim = mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.022, 18), M.arcRobeDark);
    brim.position.y = 0.13; head.add(brim);
    // Silver under-trim
    const brimTrim = mesh(new THREE.TorusGeometry(0.28, 0.01, 8, 24), M.arcSilverHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.118;
    head.add(brimTrim);
    // Hat body (very tall cone — distinct from Pyromancer's shorter hat)
    const hatCone = mesh(new THREE.ConeGeometry(0.22, 0.85, 14), M.arcRobeHi);
    hatCone.position.y = 0.55; head.add(hatCone);
    // RUNE-SCRIPT carved into the hat (vertical rune line down the front)
    for (let i = 0; i < 6; i++) {
      // Each rune is a small box-and-dot symbol stacked vertically
      const runeY = 0.25 + i * 0.1;
      const runeRadius = 0.21 - (runeY - 0.25) / 0.85 * 0.18;
      const rune = mesh(new THREE.BoxGeometry(0.022, 0.025, 0.005), M.arcCircuit);
      rune.position.set(0, runeY, runeRadius);
      head.add(rune);
      // Side-circuit dots flanking the rune (wraps around the cone)
      for (let side = -1; side <= 1; side += 2) {
        const a = side * 0.5;
        const dot = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.arcCircuit);
        dot.position.set(Math.sin(a) * runeRadius, runeY, Math.cos(a) * runeRadius);
        head.add(dot);
      }
    }
    // Floating rune at very top of hat (the focus)
    const topRune = mesh(new THREE.OctahedronGeometry(0.04, 0), M.arcOrb);
    topRune.position.y = 1.05;
    head.add(topRune);
    // Hat band (thin ring at base of cone)
    const hatBand = mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.04, 18), M.arcSilver);
    hatBand.position.y = 0.18; head.add(hatBand);
    // Circuit-band detail
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const bandRune = mesh(new THREE.BoxGeometry(0.018, 0.014, 0.005), M.arcCircuit);
      bandRune.position.set(Math.cos(a) * 0.225, 0.18, Math.sin(a) * 0.225);
      bandRune.lookAt(Math.cos(a) * 2, 0.18, Math.sin(a) * 2);
      head.add(bandRune);
    }

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  NECROMANCER — Magician V/VI                                             ║
// ║  Summons · Drain · Master of the Dead · Grave-black robes, raised cowl ║
// ║  ★ skull-topped bone staff ★, ★ orbiting floating skull-mote ★, bone-  ║
// ║  rune sigils, pale skin + sunken eyes, necrotic-cyan eye glow          ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Necromancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = necromancerAnimations;
  }

  // Override update — orbit the skull mote and pulse the staff skull
  update(time, dt) {
    super.update(time, dt);
    if (this.skullMoteOrbit) {
      this.skullMoteOrbit.rotation.y = time * 0.5;
    }
    if (this.staffSkullEyes) {
      const intensity = 1 + Math.sin(time * 1.4) * 0.15;
      this.staffSkullEyes.forEach(eye => eye.scale.setScalar(intensity));
    }
  }

  build() {
    const root = this.group;

    // Legs — grave-black ragged robes
    const buildNecroLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.necroBlack);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.necroBlackHi);
      shin.position.y = 0.36; leg.add(shin);
      // Bone-rune trim
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.necroBoneDark);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Ragged hem (small bone fragments)
      for (let i = -1; i <= 1; i++) {
        const fragment = mesh(new THREE.ConeGeometry(0.018, 0.06, 4), M.necroBoneHi);
        fragment.position.set(i * 0.07, 0.16, 0.22);
        fragment.rotation.x = Math.PI;
        leg.add(fragment);
      }
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.necroBlack);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildNecroLeg(-1));
    root.add(buildNecroLeg(1));

    // Pelvis — black with bone-trim belt + hanging skull charms
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.necroBlackHi));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.necroBoneDark);
    belt.position.y = 0.04; pelvis.add(belt);
    // Bone buckle (skull-shaped)
    const buckleSkull = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.necroBoneHi);
    buckleSkull.position.set(0, 0.04, 0.32); buckleSkull.scale.set(1.0, 1.2, 0.5);
    pelvis.add(buckleSkull);
    // Skull eye sockets in buckle
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.necroBlack);
      eyeSock.position.set(i * 0.012, 0.05, 0.34);
      pelvis.add(eyeSock);
    }
    // Hanging mini-skull charms (5 across)
    for (let i = -2; i <= 2; i++) {
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.05, 4), M.necroBoneDark);
      cord.position.set(i * 0.06, -0.04, 0.31);
      pelvis.add(cord);
      const miniSkull = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.necroBoneHi);
      miniSkull.position.set(i * 0.06, -0.1, 0.31); miniSkull.scale.set(0.9, 1.2, 0.6);
      pelvis.add(miniSkull);
      // Mini eye sockets
      for (let j = -1; j <= 1; j += 2) {
        const sock = mesh(new THREE.SphereGeometry(0.005, 6, 4), M.necroBlack);
        sock.position.set(i * 0.06 + j * 0.005, -0.09, 0.323);
        pelvis.add(sock);
      }
    }
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.necroBlack);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    // Ragged hem (jagged bone fragments hanging)
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const fragment = mesh(new THREE.ConeGeometry(0.022, 0.08 + Math.random() * 0.04, 4), M.necroBoneHi);
      fragment.position.set(Math.cos(a) * 0.4, -0.45, Math.sin(a) * 0.4);
      fragment.rotation.x = Math.PI;
      fragment.rotation.z = (Math.random() - 0.5) * 0.3;
      pelvis.add(fragment);
    }
    root.add(pelvis);

    // TORSO — grave-black robe with bone-rune chestpiece
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.necroBlack);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Bone-rune front piece
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.necroBoneDark);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    // Bone-rune script down the front
    for (let i = 0; i < 5; i++) {
      const rune = mesh(new THREE.BoxGeometry(0.06, 0.025, 0.005), M.necroRune);
      rune.position.set(0, 0.22 - i * 0.11, 0.37);
      torso.add(rune);
    }
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.necroBlackHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — skull-and-crossed-bones
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.necroBlackHi);
    emblemBack.position.set(0.05, 0.22, 0.41); torso.add(emblemBack);
    // Skull (bone-colored, slight glow)
    const skullEmblem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.necroBoneHi);
    skullEmblem.position.set(0.05, 0.24, 0.42); skullEmblem.scale.set(1.0, 1.2, 0.5);
    torso.add(skullEmblem);
    // Eye sockets
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.necroRune);
      eyeSock.position.set(0.05 + i * 0.014, 0.245, 0.435);
      torso.add(eyeSock);
    }
    // Crossed bones beneath the skull
    for (let side = -1; side <= 1; side += 2) {
      const bone = mesh(new THREE.BoxGeometry(0.07, 0.012, 0.008), M.necroBoneHi);
      bone.position.set(0.05, 0.18, 0.42); bone.rotation.z = side * Math.PI / 4;
      torso.add(bone);
    }
    // Bone "knobs" at the ends of each crossed bone
    for (let s1 = -1; s1 <= 1; s1 += 2) {
      for (let s2 = -1; s2 <= 1; s2 += 2) {
        const knob = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.necroBoneHi);
        knob.position.set(0.05 + s1 * 0.025, 0.18 + s2 * 0.025, 0.43);
        torso.add(knob);
      }
    }

    // Necro-rune sigils flanking
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.018, 0.005), M.necroRune);
        sigil.position.set(side * 0.18, 0.12 - i * 0.1, 0.36);
        torso.add(sigil);
      }
    }

    // Collar (raised, with cowl)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.16, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.necroBlackHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarBone = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.necroBoneHi);
    collarBone.rotation.x = Math.PI / 2;
    collarBone.rotation.y = -Math.PI / 2;
    collarBone.position.y = 0.5;
    torso.add(collarBone);

    root.add(torso);
    this.parts.body = torso;

    // Bone shoulders (small skull caps atop)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.necroBlackHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.necroBoneDark);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Tiny skull atop each shoulder
      const shoulderSkull = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.necroBoneHi);
      shoulderSkull.position.set(side * 0.42, 2.32, 0); shoulderSkull.scale.set(1.0, 1.2, 0.6);
      root.add(shoulderSkull);
      // Tiny eyes
      for (let i = -1; i <= 1; i += 2) {
        const sock = mesh(new THREE.SphereGeometry(0.006, 6, 4), M.necroRune);
        sock.position.set(side * 0.42 + i * 0.01, 2.33, 0.04);
        root.add(sock);
      }
    }

    // Arms
    const armPalette = { cloth: M.necroBlack, mid: M.necroBlackHi, dark: M.necroBlack, hi: M.necroBoneDark, accent: M.necroBoneHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide ragged sleeves
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.necroBlack);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.necroBoneDark);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Bone-fragment trim
      for (let i = -1; i <= 1; i++) {
        const frag = mesh(new THREE.ConeGeometry(0.014, 0.05, 4), M.necroBoneHi);
        frag.position.set(i * 0.06, -0.95, 0.13); frag.rotation.x = Math.PI;
        arm.add(frag);
      }
      // Bone-claw fingertips
      for (let i = 0; i < 4; i++) {
        const claw = mesh(new THREE.ConeGeometry(0.01, 0.04, 4), M.necroBoneHi);
        claw.position.set((i - 1.5) * 0.025, -1.0, 0.04);
        claw.rotation.x = Math.PI;
        arm.add(claw);
      }
    });

    // BONE STAFF
    const staff = this._buildBoneStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // Tattered cape
    const cape = buildCape({ material: M.necroBlack, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.necroBoneHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // Ragged bone-fragment fringes
    for (let i = -3; i <= 3; i++) {
      const fragment = mesh(new THREE.ConeGeometry(0.018, 0.08, 4), M.necroBoneHi);
      fragment.position.set(i * 0.16, 0.5, -0.13);
      fragment.rotation.x = Math.PI;
      root.add(fragment);
    }

    // Neck (pale skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — raised cowl + sunken-eyed pale face
    const head = this._buildNecromancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== FLOATING SKULL MOTE — orbits the necromancer's head =====
    this.skullMoteOrbit = new THREE.Group();
    this.skullMoteOrbit.position.set(0, 2.7, 0);
    // Create the orbiting skull
    const moteGroup = new THREE.Group();
    moteGroup.position.set(0.45, 0.0, 0);
    // Skull body
    const moteSkull = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.necroBoneHi);
    moteSkull.scale.set(1.0, 1.2, 0.7);
    moteGroup.add(moteSkull);
    // Snout
    const moteSnout = mesh(new THREE.ConeGeometry(0.025, 0.055, 8), M.necroBoneHi);
    moteSnout.position.set(0, 0.0, 0.05); moteSnout.rotation.x = Math.PI / 2;
    moteGroup.add(moteSnout);
    // Glowing eye sockets
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.necroRune);
      eyeSock.position.set(i * 0.018, 0.02, 0.04);
      moteGroup.add(eyeSock);
    }
    // Tiny necrotic-cyan glow trailing behind the skull
    const trail = mesh(new THREE.SphereGeometry(0.025, 8, 6), M.necroRune);
    trail.position.set(-0.04, 0, -0.04); trail.scale.set(0.7, 0.5, 1.4);
    moteGroup.add(trail);
    this.skullMoteOrbit.add(moteGroup);
    root.add(this.skullMoteOrbit);

    M.necroEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.necroEye;
  }

  _buildBoneStaff() {
    const staff = new THREE.Group();
    // Pommel — small bone cap
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.necroBoneHi);
    staff.add(pommel);
    // Long bone-twisted haft (ridged dark wood with bone segments)
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.necroBlack);
    haft.position.y = 0.74; staff.add(haft);
    // Bone-rib segments along the haft (knurly bone-rings)
    for (let i = 0; i < 8; i++) {
      const ribRing = mesh(new THREE.TorusGeometry(0.03, 0.008, 6, 12), M.necroBoneHi);
      ribRing.rotation.x = Math.PI / 2;
      ribRing.position.y = 0.15 + i * 0.16;
      staff.add(ribRing);
    }
    // Mid-haft bone-rune
    const midRune = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.necroRune);
    midRune.position.y = 0.74;
    staff.add(midRune);
    // ===== STAFF SKULL TOP (the marquee — large skull at the top) =====
    const skullTop = mesh(new THREE.SphereGeometry(0.13, 18, 14), M.necroBoneHi);
    skullTop.position.y = 1.6; skullTop.scale.set(1.0, 1.2, 0.8);
    staff.add(skullTop);
    // Snout
    const skullSnout = mesh(new THREE.ConeGeometry(0.06, 0.12, 8), M.necroBoneHi);
    skullSnout.position.set(0, 1.55, 0.1); skullSnout.rotation.x = Math.PI / 2;
    staff.add(skullSnout);
    // Glowing necrotic-cyan eye sockets (the pulsing markers)
    this.staffSkullEyes = [];
    for (let i = -1; i <= 1; i += 2) {
      const eyeSock = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.necroRune);
      eyeSock.position.set(i * 0.04, 1.62, 0.08);
      staff.add(eyeSock);
      this.staffSkullEyes.push(eyeSock);
    }
    // Skull jaw teeth
    for (let i = 0; i < 6; i++) {
      const tooth = mesh(new THREE.BoxGeometry(0.012, 0.022, 0.005), M.necroBoneHi);
      tooth.position.set((i - 2.5) * 0.018, 1.5, 0.16);
      staff.add(tooth);
    }
    // Top horn-like spikes (the necrotic crown atop the skull)
    for (let i = -1; i <= 1; i += 2) {
      const horn = mesh(new THREE.ConeGeometry(0.018, 0.12, 5), M.necroBoneHi);
      horn.position.set(i * 0.06, 1.78, 0); horn.rotation.z = i * 0.3;
      staff.add(horn);
    }
    // Tiny floating bone-shards orbiting the skull
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const shard = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.necroBoneDark);
      shard.position.set(Math.cos(a) * 0.18, 1.6, Math.sin(a) * 0.18);
      staff.add(shard);
    }
    return staff;
  }

  _buildNecromancerHead() {
    const head = new THREE.Group();

    // Pale gaunt face
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.9, 1.0, 0.95);
    head.add(face);

    // Sunken cheeks
    for (let side = -1; side <= 1; side += 2) {
      const cheek = mesh(new THREE.SphereGeometry(0.05, 10, 8), M.necroBlackHi);
      cheek.position.set(side * 0.13, -0.08, 0.13); cheek.scale.set(1, 1.2, 0.4);
      head.add(cheek);
    }

    // ===== RAISED COWL HOOD =====
    const hood = mesh(new THREE.SphereGeometry(0.28, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.necroBlack);
    hood.scale.set(1.1, 1.2, 1.2);
    hood.position.set(0, 0.04, -0.02);
    head.add(hood);
    // Inner lining
    const hoodLining = mesh(new THREE.SphereGeometry(0.265, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.7), M.necroBlackHi);
    hoodLining.scale.set(1.08, 1.18, 1.18);
    hoodLining.position.set(0, 0.04, -0.02);
    head.add(hoodLining);
    // Pointed hood tip behind
    const hoodTip = mesh(new THREE.ConeGeometry(0.05, 0.18, 8), M.necroBlack);
    hoodTip.position.set(0, 0.32, -0.18); hoodTip.rotation.x = -0.4;
    head.add(hoodTip);
    // Bone trim around the hood opening
    const hoodTrim = mesh(new THREE.TorusGeometry(0.24, 0.01, 8, 28, Math.PI * 1.2), M.necroBoneHi);
    hoodTrim.rotation.x = Math.PI / 2.4;
    hoodTrim.rotation.y = -Math.PI / 2;
    hoodTrim.position.y = 0.06;
    head.add(hoodTrim);

    // Necrotic-cyan eyes (sunken, glowing)
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.necroBlack);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.necroEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Bone-marks under the eyes
    for (let side = -1; side <= 1; side += 2) {
      const mark = mesh(new THREE.BoxGeometry(0.04, 0.005, 0.003), M.necroBoneHi);
      mark.position.set(side * 0.075, -0.06, 0.21); mark.rotation.z = side * -0.1;
      head.add(mark);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skinPale);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Thin grim mouth
    const mouth = mesh(new THREE.BoxGeometry(0.05, 0.005, 0.005), M.necroBlack);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    return head;
  }
}

  const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
  const target = new THREE.Vector3(champPos.x, 1.5, champPos.z + 1.6);
  const midPoint = new THREE.Vector3(champPos.x, 1.7, champPos.z + 0.8);
  // Particles flowing from target toward necromancer
  mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0x40ffd0, count: 30, speed: 2.0, duration: 0.9, upwardBias: 0.8, gravity: -0.4 }), time);
  mgr.spawn(new ImpactFlash(champ.scene, midPoint, { color: 0x60ffe0, maxScale: 0.45, duration: 0.4 }), time);

};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  CHRONOMANCER — Magician VI/VI                                           ║
// ║  Time · Cooldown Manipulation · Slate-blue robes with brass clockwork  ║
// ║  trim, ★ orbital gears around the body ★, ★ gear-topped staff ★,      ║
// ║  hourglass-themed hat, clock-face chest emblem, silvery-violet glow    ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Chronomancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = chronomancerAnimations;
  }

  // Override update — orbit the gears, rotate the staff gear, animate clock hands
  update(time, dt) {
    super.update(time, dt);
    if (this.orbitGears) {
      this.orbitGears.rotation.y = time * 0.25;
      // Each gear rotates on its own axis
      this.orbitGears.children.forEach((g, i) => {
        if (g.userData.isGear) g.rotation.z = time * (0.7 + i * 0.15) * (i % 2 === 0 ? 1 : -1);
      });
    }
    if (this.staffGear) this.staffGear.rotation.z = time * 0.6;
    if (this.clockHands) {
      this.clockHands.children[0].rotation.z = -time * 0.5;
      this.clockHands.children[1].rotation.z = -time * 0.05;
    }
  }

  build() {
    const root = this.group;

    // Legs — slate-blue robes
    const buildChronoLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.chronoSlate);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.chronoSlateHi);
      shin.position.y = 0.36; leg.add(shin);
      // Brass trim band at hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.chronoBrass);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Gear-tooth pattern on the trim (small brass nubs)
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.018, 0.014, 0.014), M.chronoBrassHi);
        tooth.position.set(Math.cos(a) * 0.245, 0.12, Math.sin(a) * 0.245);
        leg.add(tooth);
      }
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.chronoSlateDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildChronoLeg(-1));
    root.add(buildChronoLeg(1));

    // Pelvis — brass clockwork belt
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.chronoSlateDark));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.chronoBrass);
    belt.position.y = 0.04; pelvis.add(belt);
    // Gear buckle (small clockwork gear)
    const buckle = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.018, 12), M.chronoBrassHi);
    buckle.rotation.x = Math.PI / 2; buckle.position.set(0, 0.04, 0.32);
    pelvis.add(buckle);
    // Gear teeth around buckle
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const tooth = mesh(new THREE.BoxGeometry(0.012, 0.014, 0.018), M.chronoBrassHi);
      tooth.position.set(Math.cos(a) * 0.045, 0.04 + Math.sin(a) * 0.045, 0.32);
      tooth.rotation.z = a;
      pelvis.add(tooth);
    }
    // Center crystal in buckle
    const buckleGem = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.chronoCrystal);
    buckleGem.position.set(0, 0.04, 0.34); buckleGem.scale.set(1, 1, 0.5);
    pelvis.add(buckleGem);
    // Hanging clockwork charms (small gears)
    for (let i = -1; i <= 1; i += 2) {
      const cog = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.012, 10), M.chronoBrassHi);
      cog.rotation.x = Math.PI / 2; cog.position.set(i * 0.18, -0.06, 0.25);
      pelvis.add(cog);
      // Cog teeth
      for (let j = 0; j < 6; j++) {
        const a = (j / 6) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.006, 0.006, 0.014), M.chronoBrassHi);
        tooth.position.set(i * 0.18 + Math.cos(a) * 0.024, -0.06 + Math.sin(a) * 0.024, 0.25);
        tooth.rotation.z = a;
        pelvis.add(tooth);
      }
    }
    // Robe drape
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.chronoSlate);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.chronoBrass);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Roman-numeral marks around the hem (12 — like a clock face)
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const mark = mesh(new THREE.BoxGeometry(0.014, 0.022, 0.005), M.chronoCrystal);
      mark.position.set(Math.cos(a) * 0.405, -0.4, Math.sin(a) * 0.405);
      mark.lookAt(Math.cos(a) * 2, -0.4, Math.sin(a) * 2);
      pelvis.add(mark);
    }
    root.add(pelvis);

    // TORSO — slate-blue robe with brass clockwork chest
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.chronoSlate);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Brass front-piece
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.chronoSlateDark);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    for (let side = -1; side <= 1; side += 2) {
      const sideStripe = mesh(new THREE.BoxGeometry(0.012, 0.65, 0.022), M.chronoBrassHi);
      sideStripe.position.set(side * 0.067, 0.0, 0.37);
      torso.add(sideStripe);
    }
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.chronoSlateHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — clock face with moving hands (the marquee Chronomancer symbol)
    const clockBack = mesh(new THREE.CircleGeometry(0.085, 16), M.chronoSlateDark);
    clockBack.position.set(0, 0.18, 0.41); torso.add(clockBack);
    // Outer brass ring (clock rim)
    const clockRing = mesh(new THREE.TorusGeometry(0.08, 0.008, 8, 18), M.chronoBrassHi);
    clockRing.position.set(0, 0.18, 0.42); torso.add(clockRing);
    // Inner clock face
    const clockFace = mesh(new THREE.CircleGeometry(0.07, 16), M.chronoCrystal);
    clockFace.position.set(0, 0.18, 0.425); torso.add(clockFace);
    // 12 hour markers
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const big = i % 3 === 0;
      const marker = mesh(new THREE.BoxGeometry(big ? 0.008 : 0.005, big ? 0.018 : 0.012, 0.005), M.chronoSlateDark);
      marker.position.set(Math.cos(a) * 0.06, 0.18 + Math.sin(a) * 0.06, 0.43);
      marker.rotation.z = a + Math.PI / 2;
      torso.add(marker);
    }
    // Clock hands group (animated in update)
    this.clockHands = new THREE.Group();
    this.clockHands.position.set(0, 0.18, 0.435);
    // Minute hand (longer)
    const minHand = mesh(new THREE.BoxGeometry(0.005, 0.052, 0.005), M.chronoSlateDark);
    minHand.position.y = 0.026; // pivot at center, extending up
    const minHandGroup = new THREE.Group();
    minHandGroup.add(minHand);
    this.clockHands.add(minHandGroup);
    // Hour hand (shorter, thicker)
    const hourHand = mesh(new THREE.BoxGeometry(0.007, 0.035, 0.005), M.chronoSlateDark);
    hourHand.position.y = 0.018;
    const hourHandGroup = new THREE.Group();
    hourHandGroup.add(hourHand);
    this.clockHands.add(hourHandGroup);
    // Center pin
    const clockPin = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.chronoBrassHi);
    clockPin.position.z = 0.005;
    this.clockHands.add(clockPin);
    torso.add(this.clockHands);

    // Vertical clockwork sigils flanking
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.chronoCrystal);
        sigil.position.set(side * 0.18, 0.05 - i * 0.1, 0.36);
        torso.add(sigil);
      }
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.chronoSlateHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.chronoBrassHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Shoulders with gear-discs
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.chronoSlateHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.chronoBrass);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Brass gear-disc atop each shoulder
      const shoulderGear = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.02, 12), M.chronoBrassHi);
      shoulderGear.rotation.x = Math.PI / 2; shoulderGear.position.set(side * 0.42, 2.27, 0);
      root.add(shoulderGear);
      // Tiny gear teeth around it
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.008, 0.012, 0.018), M.chronoBrassHi);
        tooth.position.set(side * 0.42 + Math.cos(a) * 0.045, 2.27, Math.sin(a) * 0.045);
        tooth.rotation.y = -a;
        root.add(tooth);
      }
    }

    // Arms
    const armPalette = { cloth: M.chronoSlate, mid: M.chronoSlateHi, dark: M.chronoSlateDark, hi: M.chronoBrass, accent: M.chronoBrassHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide flared sleeves with brass-trim
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.chronoSlateHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.chronoBrassHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Gear-tooth pattern on the sleeve hem
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.014, 0.014, 0.014), M.chronoBrassHi);
        tooth.position.set(Math.cos(a) * 0.165, -0.95, Math.sin(a) * 0.165);
        arm.add(tooth);
      }
    });

    // CLOCKWORK STAFF
    const staff = this._buildClockworkStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // CAPE — slate with brass trim
    const cape = buildCape({ material: M.chronoCape, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.chronoBrassHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — hourglass-themed hat
    const head = this._buildChronomancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== ORBITAL GEARS — 4 brass gears slowly rotating around the chronomancer (the marquee feature) =====
    this.orbitGears = new THREE.Group();
    this.orbitGears.position.set(0, 1.85, 0);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const gearGroup = new THREE.Group();
      gearGroup.userData.isGear = true;
      gearGroup.position.set(Math.cos(a) * 0.6, Math.sin(a * 2) * 0.1, Math.sin(a) * 0.6);
      // Gear disc
      const gearSize = 0.06 + (i % 2) * 0.02;
      const gearDisc = mesh(new THREE.CylinderGeometry(gearSize, gearSize, 0.018, 12), M.chronoBrass);
      gearDisc.rotation.x = Math.PI / 2;
      gearGroup.add(gearDisc);
      // Gear teeth (8-12 per gear)
      const toothCount = 8 + (i % 2) * 4;
      for (let j = 0; j < toothCount; j++) {
        const ja = (j / toothCount) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.012, 0.014, 0.018), M.chronoBrassHi);
        tooth.position.set(Math.cos(ja) * (gearSize + 0.012), Math.sin(ja) * (gearSize + 0.012), 0);
        tooth.rotation.z = ja;
        gearGroup.add(tooth);
      }
      // Crystal center
      const gearCrystal = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.chronoCrystal);
      gearCrystal.position.z = 0.012;
      gearGroup.add(gearCrystal);
      this.orbitGears.add(gearGroup);
    }
    root.add(this.orbitGears);

    M.chronoEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.chronoEye;
  }

  _buildClockworkStaff() {
    const staff = new THREE.Group();
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.chronoBrassHi);
    staff.add(pommel);
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.chronoSlateDark);
    haft.position.y = 0.74; staff.add(haft);
    // Brass coil wraps
    for (let i = 0; i < 8; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.028, 0.005, 6, 12), M.chronoBrass);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.18;
      staff.add(wrap);
    }
    // Mid-haft small gear
    const midGear = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.018, 10), M.chronoBrassHi);
    midGear.rotation.x = Math.PI / 2; midGear.position.y = 0.74;
    staff.add(midGear);
    // ===== TOP MECHANISM — large rotating gear with crystal center =====
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.06, 12), M.chronoBrassHi);
    cradle.position.y = 1.46; staff.add(cradle);
    // Main rotating gear
    this.staffGear = new THREE.Group();
    this.staffGear.position.y = 1.6;
    const gearMain = mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.025, 14), M.chronoBrassHi);
    gearMain.rotation.x = Math.PI / 2;
    this.staffGear.add(gearMain);
    // 12 gear teeth around it
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const tooth = mesh(new THREE.BoxGeometry(0.018, 0.022, 0.025), M.chronoBrassHi);
      tooth.position.set(Math.cos(a) * 0.1, Math.sin(a) * 0.1, 0);
      tooth.rotation.z = a;
      this.staffGear.add(tooth);
    }
    // Crystal in center of the gear
    const gearCenter = mesh(new THREE.SphereGeometry(0.045, 12, 10), M.chronoCrystal);
    gearCenter.position.z = 0.0; gearCenter.scale.set(1, 1, 0.5);
    this.staffGear.add(gearCenter);
    // Inner brighter shine
    const gearShine = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.chronoBrassHi);
    gearShine.position.z = 0.014;
    this.staffGear.add(gearShine);
    staff.add(this.staffGear);
    // Two small gears flanking the main one
    for (let side = -1; side <= 1; side += 2) {
      const sideGear = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.012, 10), M.chronoBrass);
      sideGear.rotation.x = Math.PI / 2;
      sideGear.position.set(side * 0.13, 1.5, 0);
      staff.add(sideGear);
      // Side gear teeth
      for (let j = 0; j < 8; j++) {
        const ja = (j / 8) * Math.PI * 2;
        const tooth = mesh(new THREE.BoxGeometry(0.006, 0.008, 0.012), M.chronoBrassHi);
        tooth.position.set(side * 0.13 + Math.cos(ja) * 0.029, 1.5 + Math.sin(ja) * 0.029, 0);
        tooth.rotation.z = ja;
        staff.add(tooth);
      }
    }
    // Top spike (the time-needle)
    const topSpike = mesh(new THREE.ConeGeometry(0.015, 0.12, 6), M.chronoCrystal);
    topSpike.position.y = 1.78; staff.add(topSpike);
    return staff;
  }

  _buildChronomancerHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Short beard (cool/wise)
    const beard = mesh(new THREE.SphereGeometry(0.1, 14, 10), M.chronoSlateHi);
    beard.position.set(0, -0.18, 0.08); beard.scale.set(0.95, 1.0, 0.7);
    head.add(beard);
    // Mustache
    for (let side = -1; side <= 1; side += 2) {
      const mustache = mesh(new THREE.BoxGeometry(0.045, 0.012, 0.012), M.chronoSlateHi);
      mustache.position.set(side * 0.04, -0.09, 0.21); mustache.rotation.z = side * 0.18;
      head.add(mustache);
    }

    // Eyes — silvery-violet glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.chronoEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Brows
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.05, 0.012, 0.005), M.chronoSlateHi);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.18;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // ===== HOURGLASS HAT (the marquee feature) =====
    // Hat base (squat brim)
    const brim = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.025, 18), M.chronoSlateDark);
    brim.position.y = 0.13; head.add(brim);
    // Brass under-trim
    const brimTrim = mesh(new THREE.TorusGeometry(0.3, 0.012, 8, 24), M.chronoBrassHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.116;
    head.add(brimTrim);
    // Hat dome (cylinder body)
    const hatBody = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.2, 14), M.chronoSlate);
    hatBody.position.y = 0.25; head.add(hatBody);
    // Hat band (brass)
    const hatBand = mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.04, 14), M.chronoBrass);
    hatBand.position.y = 0.16; head.add(hatBand);
    // HOURGLASS shape on the front of the hat band (two cones meeting at a point)
    const hourTopCone = mesh(new THREE.ConeGeometry(0.025, 0.04, 6), M.chronoCrystal);
    hourTopCone.position.set(0, 0.18, 0.225); hourTopCone.rotation.x = Math.PI;
    head.add(hourTopCone);
    const hourBotCone = mesh(new THREE.ConeGeometry(0.025, 0.04, 6), M.chronoCrystal);
    hourBotCone.position.set(0, 0.14, 0.225);
    head.add(hourBotCone);
    // Hourglass middle pinch (where the sand passes through)
    const hourPinch = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.chronoBrassHi);
    hourPinch.position.set(0, 0.16, 0.225);
    head.add(hourPinch);
    // Brass frame around the hourglass
    for (let i = -1; i <= 1; i += 2) {
      const frame = mesh(new THREE.BoxGeometry(0.005, 0.06, 0.005), M.chronoBrassHi);
      frame.position.set(i * 0.025, 0.16, 0.225);
      head.add(frame);
    }
    // Top section — short cone with floating gear orbiting (active idle could be here)
    const hatTop = mesh(new THREE.ConeGeometry(0.18, 0.2, 14), M.chronoSlateHi);
    hatTop.position.y = 0.45; head.add(hatTop);
    // Top gear ornament
    const topGear = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.018, 10), M.chronoBrassHi);
    topGear.rotation.x = Math.PI / 2; topGear.position.y = 0.58;
    head.add(topGear);
    for (let j = 0; j < 8; j++) {
      const ja = (j / 8) * Math.PI * 2;
      const tooth = mesh(new THREE.BoxGeometry(0.01, 0.012, 0.018), M.chronoBrassHi);
      tooth.position.set(Math.cos(ja) * 0.045, 0.58, Math.sin(ja) * 0.045);
      tooth.rotation.y = -ja;
      head.add(tooth);
    }
    // Top tip with crystal needle
    const topNeedle = mesh(new THREE.ConeGeometry(0.01, 0.08, 5), M.chronoCrystal);
    topNeedle.position.y = 0.62;
    head.add(topNeedle);
    // Roman-numeral marks around the hat band (12 — the hat IS a clock)
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const big = i % 3 === 0;
      const marker = mesh(new THREE.BoxGeometry(big ? 0.008 : 0.005, big ? 0.014 : 0.01, 0.005), M.chronoCrystal);
      marker.position.set(Math.cos(a) * 0.225, 0.16, Math.sin(a) * 0.225);
      marker.lookAt(Math.cos(a) * 2, 0.16, Math.sin(a) * 2);
      head.add(marker);
    }

    return head;
  }
}

          const r = 1.5 + Math.random() * 0.5;
          const stopPos = new THREE.Vector3(champPos.x + Math.cos(a) * r, 1.5, champPos.z + Math.sin(a) * r);
          mgr.spawn(new ImpactFlash(champ.scene, stopPos, { color: 0xc0b0e8, maxScale: 0.55, duration: 0.8 }), time);
          mgr.spawn(new ParticleBurst(champ.scene, stopPos, { color: 0xc0b0e8, count: 18, speed: 0.8, duration: 1.4, upwardBias: 0.0, gravity: -0.05 }), time);
        }
      }},
    ],
  },
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  VIEWER — preview-only setup                                             ║
// ║  CC: ignore everything below this line — game runtime doesn't need it.  ║
// ╚══════════════════════════════════════════════════════════════════════════╝

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
scene.fog = new THREE.Fog(0x05060c, 9, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 2.4, 5.8);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.45, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

// ─── Lighting (3-point + counter-rim) ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x4a4a5a, 0.32));
const key = new THREE.DirectionalLight(0xfff0d8, 1.6);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8090c8, 0.55);
fill.position.set(-4, 4, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffaa50, 0.85);
rim.position.set(-2, 3, -5);
scene.add(rim);
const rimAmber = new THREE.PointLight(0xff8030, 1.2, 8, 1.5);
rimAmber.position.set(0, 1.7, -2.2);
scene.add(rimAmber);

// ─── Dais ─────────────────────────────────────────────────────────────────
const daisGroup = new THREE.Group();
const daisBase = mesh(new THREE.CylinderGeometry(2.2, 2.5, 0.18, 64), M.stone, { receive: true });
daisBase.position.y = 0.04; daisGroup.add(daisBase);
const daisTop = mesh(new THREE.CylinderGeometry(2.0, 2.05, 0.06, 64), M.stoneDark, { receive: true });
daisTop.position.y = 0.16; daisGroup.add(daisTop);
const daisRing = mesh(new THREE.TorusGeometry(2.0, 0.04, 12, 64), M.brass);
daisRing.rotation.x = Math.PI / 2; daisRing.position.y = 0.19; daisGroup.add(daisRing);
// 8 small runic engravings around the dais
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const rune = mesh(new THREE.BoxGeometry(0.18, 0.005, 0.04), M.stoneRune);
  rune.position.set(Math.cos(a) * 1.85, 0.195, Math.sin(a) * 1.85);
  rune.rotation.y = -a + Math.PI / 2;
  daisGroup.add(rune);
}
// Subtle cracks
for (let i = 0; i < 6; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.5 + Math.random() * 1.3;
  const crack = mesh(new THREE.BoxGeometry(0.4 + Math.random() * 0.4, 0.001, 0.012), M.stoneDark);
  crack.position.set(Math.cos(a) * r, 0.193, Math.sin(a) * r);
  crack.rotation.y = Math.random() * Math.PI;
  daisGroup.add(crack);
}
scene.add(daisGroup);

// ─── Aura ring (color-tinted per class) ───────────────────────────────────
const auraGeo = new THREE.RingGeometry(2.05, 2.35, 96, 1);
const auraMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8020) }, uOpacity: { value: 0.55 } },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xy);
      float a = atan(vPos.y, vPos.x);
      float pulse = 0.55 + 0.45 * sin(uTime * 1.2 + a * 4.0);
      float band = smoothstep(2.05, 2.18, r) * smoothstep(2.35, 2.18, r);
      gl_FragColor = vec4(uColor * pulse * 1.4, band * uOpacity * pulse);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});
const aura = new THREE.Mesh(auraGeo, auraMat);
aura.rotation.x = -Math.PI / 2;
aura.position.y = 0.205;
scene.add(aura);

// ─── Floating embers ──────────────────────────────────────────────────────
const EMBER_COUNT = 220;
const emberPositions = new Float32Array(EMBER_COUNT * 3);
const emberSeeds = new Float32Array(EMBER_COUNT);
for (let i = 0; i < EMBER_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4.5;
  emberPositions[i*3 + 0] = Math.cos(a) * r;
  emberPositions[i*3 + 1] = Math.random() * 4.5;
  emberPositions[i*3 + 2] = Math.sin(a) * r;
  emberSeeds[i] = Math.random();
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('seed', new THREE.Float32BufferAttribute(emberSeeds, 1));
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

// ─── Post-processing ──────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.78, 0.4, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ───────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Class registry ───────────────────────────────────────────────────────
const classRegistry = {
  pyromancer: {
    name: 'Pyromancer',
    family: 'Magician · I/VI',
    role: 'Fire DoTs · Heat Wave',
    accent: '#ff8830',
    accentGlow: 'rgba(255, 136, 48, 0.5)',
    auraColor: 0xff5800,
    emberColor: new THREE.Color(1.0, 0.45, 0.15),
    abilities: { attack: 'Firebolt', spell1: 'Fireball', spell2: 'Combustion' },
    factory: () => new Pyromancer(scene, new THREE.Vector3(0, 0, 0)),
  },
  cryomancer: {
    name: 'Cryomancer',
    family: 'Magician · II/VI',
    role: 'Ice Control · Glacial Force',
    accent: '#90eaff',
    accentGlow: 'rgba(144, 234, 255, 0.5)',
    auraColor: 0x60c8e8,
    emberColor: new THREE.Color(0.6, 0.85, 0.95),
    abilities: { attack: 'Frostbolt', spell1: 'Blizzard', spell2: 'Frozen Tomb' },
    factory: () => new Cryomancer(scene, new THREE.Vector3(0, 0, 0)),
  },
  stormcaller: {
    name: 'Stormcaller',
    family: 'Magician · III/VI',
    role: 'Lightning Chains · Static Field',
    accent: '#eae0ff',
    accentGlow: 'rgba(234, 224, 255, 0.5)',
    auraColor: 0xa898ff,
    emberColor: new THREE.Color(0.85, 0.82, 1.0),
    abilities: { attack: 'Spark', spell1: 'Chain Lightning', spell2: 'Thunderstorm' },
    factory: () => new Stormcaller(scene, new THREE.Vector3(0, 0, 0)),
  },
  arcanist: {
    name: 'Arcanist',
    family: 'Magician · IV/VI',
    role: 'Pure Burst Caster · Arcane Mind',
    accent: '#a860ff',
    accentGlow: 'rgba(168, 96, 255, 0.5)',
    auraColor: 0x9030ff,
    emberColor: new THREE.Color(0.7, 0.4, 1.0),
    abilities: { attack: 'Arcane Missile', spell1: 'Arcane Blast', spell2: 'Mana Surge' },
    factory: () => new Arcanist(scene, new THREE.Vector3(0, 0, 0)),
  },
  necromancer: {
    name: 'Necromancer',
    family: 'Magician · V/VI',
    role: 'Summons · Drain · Master of the Dead',
    accent: '#60ffe0',
    accentGlow: 'rgba(96, 255, 224, 0.5)',
    auraColor: 0x40ffd0,
    emberColor: new THREE.Color(0.4, 1.0, 0.85),
    abilities: { attack: 'Death Bolt', spell1: 'Raise Skeleton', spell2: 'Life Drain' },
    factory: () => new Necromancer(scene, new THREE.Vector3(0, 0, 0)),
  },
  chronomancer: {
    name: 'Chronomancer',
    family: 'Magician · VI/VI',
    role: 'Time · Cooldown Manipulation',
    accent: '#c0b0e8',
    accentGlow: 'rgba(192, 176, 232, 0.5)',
    auraColor: 0xa090d0,
    emberColor: new THREE.Color(0.78, 0.7, 0.9),
    abilities: { attack: 'Time Bolt', spell1: 'Rewind', spell2: 'Time Stop' },
    factory: () => new Chronomancer(scene, new THREE.Vector3(0, 0, 0)),
  },
};

// ─── Build all champions up front (single per class — viewer only shows one)
const champions = {};
for (const key in classRegistry) {
  const champ = classRegistry[key].factory();
  champ.group.visible = false;
  champions[key] = champ;
}
let activeChampion = champions.pyromancer;
activeChampion.group.visible = true;

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

// ─── UI wiring ────────────────────────────────────────────────────────────
document.getElementById('classSelect').addEventListener('change', (e) => {
  selectClass(e.target.value);
});

const abilityButtons = document.querySelectorAll('.ab-btn');
abilityButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeChampion || activeChampion.isPlaying()) return;
    const animName = btn.dataset.anim;
    activeChampion.playAnimation(animName, clock.getElapsedTime(), effectMgr);
    btn.classList.add('cooling');
    setTimeout(() => btn.classList.remove('cooling'), (activeChampion.animations[animName]?.duration || 1) * 1000 + 100);
  });
});

let demoMode = false;
let demoIdx = 0;
let demoNextTime = 0;
const demoOrder = ['attack', 'spell1', 'attack', 'spell2'];
document.getElementById('demoBtn').addEventListener('click', (e) => {
  demoMode = !demoMode;
  demoIdx = 0;
  e.target.textContent = demoMode ? '⏸ Stop Demo' : '▶ Cycle Animations';
  demoNextTime = clock.getElapsedTime() + 0.4;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('pyromancer');

// Hide loading splash
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);

animate();

</script>

</html>
