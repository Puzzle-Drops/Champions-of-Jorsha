class Inquisitor extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = inquisitorAnimations;
  }

  // Override update — gentle bell sway
  update(time, dt) {
    super.update(time, dt);
    if (this.bell) {
      this.bell.rotation.z = Math.sin(time * 1.5) * 0.12;
    }
  }

  build() {
    const root = this.group;

    // Legs — pure white robes
    const buildInqLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.inqWhite);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.inqWhiteHi);
      shin.position.y = 0.36; leg.add(shin);
      // Gold trim band
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.inqGoldHi);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Cross-emblem on the trim
      for (let i = -1; i <= 1; i++) {
        const crossV = mesh(new THREE.BoxGeometry(0.008, 0.025, 0.005), M.inqGoldHi);
        crossV.position.set(i * 0.07, 0.13, 0.22);
        leg.add(crossV);
        const crossH = mesh(new THREE.BoxGeometry(0.018, 0.008, 0.005), M.inqGoldHi);
        crossH.position.set(i * 0.07, 0.135, 0.22);
        leg.add(crossH);
      }
      // Boot
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.inqGoldHi);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildInqLeg(-1));
    root.add(buildInqLeg(1));

    // Pelvis — gold belt with hanging rosary chain + bell
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.inqWhite));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.inqGoldHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Cross buckle
    const buckleV = mesh(new THREE.BoxGeometry(0.014, 0.05, 0.018), M.inqWhiteHi);
    buckleV.position.set(0, 0.04, 0.32); pelvis.add(buckleV);
    const buckleH = mesh(new THREE.BoxGeometry(0.04, 0.014, 0.018), M.inqWhiteHi);
    buckleH.position.set(0, 0.04, 0.32); pelvis.add(buckleH);
    // Holy rune in the cross center
    const buckleRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.inqHoly);
    buckleRune.position.set(0, 0.04, 0.335);
    pelvis.add(buckleRune);
    // BELL hanging from belt (the marquee accessory) — sways in update
    this.bell = new THREE.Group();
    this.bell.position.set(0.26, -0.04, 0.18);
    // Bell body (truncated cone-shape)
    const bellBody = mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.07, 12), M.inqGoldHi);
    bellBody.position.y = -0.05; this.bell.add(bellBody);
    // Bell rim
    const bellRim = mesh(new THREE.TorusGeometry(0.06, 0.005, 6, 18), M.inqGold);
    bellRim.rotation.x = Math.PI / 2; bellRim.position.y = -0.085;
    this.bell.add(bellRim);
    // Bell tip cap
    const bellCap = mesh(new THREE.SphereGeometry(0.02, 10, 8), M.inqGoldHi);
    bellCap.position.y = -0.014;
    this.bell.add(bellCap);
    // Bell clapper
    const clapper = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.inqSilver);
    clapper.position.y = -0.08;
    this.bell.add(clapper);
    // Bell hanging cord
    const bellCord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.06, 4), M.inqGold);
    bellCord.position.y = 0.02;
    this.bell.add(bellCord);
    pelvis.add(this.bell);
    // Rosary chain (left hip) — series of small beads on a chain
    for (let i = 0; i < 5; i++) {
      const bead = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.inqSilverHi);
      bead.position.set(-0.28 + Math.sin(i * 0.6) * 0.02, -0.04 - i * 0.03, 0.18);
      pelvis.add(bead);
      // Connecting chain link
      if (i < 4) {

        link.position.set(-0.28 + Math.sin((i + 0.5) * 0.6) * 0.02, -0.06 - i * 0.03, 0.18);
        pelvis.add(link);

    // Cross at end of rosary
    const rosCrossV = mesh(new THREE.BoxGeometry(0.005, 0.04, 0.005), M.inqGoldHi);

      pelvis.add(crossV);
      const crossH = mesh(new THREE.BoxGeometry(0.024, 0.008, 0.005), M.inqGoldHi);
      crossH.position.set(Math.cos(a) * 0.4, -0.385, Math.sin(a) * 0.4);
      crossH.lookAt(Math.cos(a) * 2, -0.385, Math.sin(a) * 2);
      pelvis.add(crossH);
    }
    root.add(pelvis);

    // TORSO — pure white robe
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    for (let dir = -1; dir <= 1; dir += 2) {
      // Build a chain as a series of small linked beads
      const chainCount = 8;
      for (let i = 0; i < chainCount; i++) {
        const t = i / (chainCount - 1) - 0.5;

    // X-junction lock (silver cross at center where chains cross)
    const xLock = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.inqGoldHi);
    xLock.position.set(0, 0, 0.39); xLock.scale.set(1, 1, 0.5);
    torso.add(xLock);

    // CHEST EMBLEM — large gold cross within a circle (above the X-chains)
    const emblemBack = mesh(new THREE.CircleGeometry(0.08, 16), M.inqWhiteHi);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    const emblemRing = mesh(new THREE.TorusGeometry(0.075, 0.008, 8, 18), M.inqGoldHi);
    emblemRing.position.set(0, 0.22, 0.42); torso.add(emblemRing);
    // Cross (gold)
    const crossEmblemV = mesh(new THREE.BoxGeometry(0.02, 0.1, 0.008), M.inqGoldHi);
    crossEmblemV.position.set(0, 0.22, 0.43); torso.add(crossEmblemV);
    const crossEmblemH = mesh(new THREE.BoxGeometry(0.07, 0.02, 0.008), M.inqGoldHi);
    crossEmblemH.position.set(0, 0.225, 0.43); torso.add(crossEmblemH);
    // Holy glow at cross center
    const crossGem = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.inqHoly);
    crossGem.position.set(0, 0.225, 0.435);
    torso.add(crossGem);

    // High collar — white with gold trim
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.inqWhiteHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.inqGoldHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Shoulder caps
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.inqWhiteHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Gold trim
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.inqGoldHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Shoulder cross
      const shCrossV = mesh(new THREE.BoxGeometry(0.012, 0.05, 0.008), M.inqGoldHi);
      shCrossV.position.set(side * 0.42, 2.27, 0); root.add(shCrossV);
      const shCrossH = mesh(new THREE.BoxGeometry(0.03, 0.012, 0.008), M.inqGoldHi);
      shCrossH.position.set(side * 0.42, 2.275, 0); root.add(shCrossH);
    }

    // Arms
    const armPalette = { cloth: M.inqWhite, mid: M.inqWhiteHi, dark: M.inqWhite, hi: M.inqGold, accent: M.inqGoldHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide flared sleeves with cross trim
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.inqWhiteHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.inqGoldHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Cross sigils around the cuff
      for (let i = 0; i < 4; i++) {

        cV.position.set(Math.cos(a) * 0.16, -0.95, Math.sin(a) * 0.16);
        arm.add(cV);
        const cH = mesh(new THREE.BoxGeometry(0.014, 0.005, 0.005), M.inqGoldHi);
        cH.position.set(Math.cos(a) * 0.16, -0.95, Math.sin(a) * 0.16);
        arm.add(cH);
      }

    const mace = this._buildInquisitorMace();

  _buildHolyBook() {
    const book = new THREE.Group();
    const front = mesh(new THREE.BoxGeometry(0.16, 0.22, 0.012), M.inqGoldHi);
    front.position.set(0, 0, 0.025); book.add(front);
    const back = mesh(new THREE.BoxGeometry(0.16, 0.22, 0.012), M.inqGoldHi);
    back.position.set(0, 0, -0.025); book.add(back);
    const pages = mesh(new THREE.BoxGeometry(0.155, 0.215, 0.04), M.inqWhiteHi);
    pages.position.set(0, 0, 0); book.add(pages);
    const spine = mesh(new THREE.BoxGeometry(0.018, 0.22, 0.06), M.inqGold);
    spine.position.set(-0.082, 0, 0); book.add(spine);
    // Gold cross on cover
    const crossV = mesh(new THREE.BoxGeometry(0.018, 0.1, 0.008), M.inqWhiteHi);
    crossV.position.set(0, 0.03, 0.034); book.add(crossV);
    const crossH = mesh(new THREE.BoxGeometry(0.06, 0.018, 0.008), M.inqWhiteHi);
    crossH.position.set(0, 0.05, 0.034); book.add(crossH);
    // Holy gem at cross center
    const gem = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.inqHoly);
    gem.position.set(0, 0.05, 0.04); book.add(gem);
    // Corner studs
    for (let xs = -1; xs <= 1; xs += 2) {
      for (let ys = -1; ys <= 1; ys += 2) {
        const stud = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.inqWhiteHi);
        stud.position.set(xs * 0.06, ys * 0.09, 0.034); book.add(stud);
      }
    }
    return book;
  }

  _buildInquisitorMace() {
    const mace = new THREE.Group();
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.inqGoldHi);
    mace.add(pommel);
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.7, 12), M.inqWhiteHi);
    haft.position.y = 0.36; mace.add(haft);
    // Gold rings along haft
    for (let i = 0; i < 5; i++) {
      const ring = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.inqGold);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.1 + i * 0.12;
      mace.add(ring);
    }
    // Top section — large gold mace head with cross atop
    const head = mesh(new THREE.SphereGeometry(0.07, 14, 12), M.inqGoldHi);
    head.position.y = 0.78; mace.add(head);
    // 6 fluted ridges
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const flute = mesh(new THREE.BoxGeometry(0.012, 0.13, 0.012), M.inqGold);
      flute.position.set(Math.cos(a) * 0.075, 0.78, Math.sin(a) * 0.075);
      flute.rotation.y = -a;
      mace.add(flute);
    }
    // Top cross
    const topCrossV = mesh(new THREE.BoxGeometry(0.014, 0.07, 0.014), M.inqGoldHi);
    topCrossV.position.y = 0.9; mace.add(topCrossV);
    const topCrossH = mesh(new THREE.BoxGeometry(0.04, 0.014, 0.014), M.inqGoldHi);
    topCrossH.position.y = 0.92; mace.add(topCrossH);
    // Holy gem at top
    const topGem = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.inqHoly);
    topGem.position.y = 0.92; mace.add(topGem);
    return mace;
  }

  _buildInquisitorHead() {
    const head = new THREE.Group();
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Tonsured hair (priest haircut)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16, 0, Math.PI * 2, Math.PI * 0.2, Math.PI * 0.3), M.shamFur || M.bardWood);
    scalp.position.y = 0.04;
    head.add(scalp);

    // Eyes — pure holy white
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.inqEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Stern mouth (judgment)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // ===== TALL CROSS-MITRE HELM (the marquee feature — bishop's mitre with cross top) =====
    // Mitre body — split-pointed shape (two cones meeting at the front)
    // Front pointed cone
    const mitreFront = mesh(new THREE.ConeGeometry(0.18, 0.4, 12), M.inqWhiteHi);
    mitreFront.position.set(0, 0.36, 0.04); mitreFront.rotation.x = -0.2;
    head.add(mitreFront);
    // Back pointed cone
    const mitreBack = mesh(new THREE.ConeGeometry(0.18, 0.4, 12), M.inqWhiteHi);
    mitreBack.position.set(0, 0.36, -0.04); mitreBack.rotation.x = 0.2;
    head.add(mitreBack);
    // Mitre band (gold) at the base
    const mitreBand = mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.04, 14), M.inqGoldHi);
    mitreBand.position.y = 0.18; head.add(mitreBand);
    // Vertical gold strip down the front of the mitre
    const mitreStripFront = mesh(new THREE.BoxGeometry(0.04, 0.4, 0.025), M.inqGoldHi);
    mitreStripFront.position.set(0, 0.36, 0.18); mitreStripFront.rotation.x = -0.2;
    head.add(mitreStripFront);
    // Cross atop the mitre (the marquee detail)
    const topCrossV = mesh(new THREE.BoxGeometry(0.014, 0.18, 0.014), M.inqGoldHi);
    topCrossV.position.y = 0.65; head.add(topCrossV);
    const topCrossH = mesh(new THREE.BoxGeometry(0.08, 0.014, 0.014), M.inqGoldHi);
    topCrossH.position.y = 0.66; head.add(topCrossH);
    // Holy gem at cross center (the apex)
    const apex = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.inqHoly);
    apex.position.y = 0.66; head.add(apex);
    // Side-decoration crosses on the mitre (small embedded crosses on each side)
    for (let side = -1; side <= 1; side += 2) {
      const sideCrossV = mesh(new THREE.BoxGeometry(0.008, 0.04, 0.005), M.inqGoldHi);
      sideCrossV.position.set(side * 0.14, 0.3, 0.0);
      head.add(sideCrossV);
      const sideCrossH = mesh(new THREE.BoxGeometry(0.022, 0.008, 0.005), M.inqGoldHi);
      sideCrossH.position.set(side * 0.14, 0.305, 0.0);
      head.add(sideCrossH);
    }
    // Gold lappets (long ribbons hanging from the back of the mitre)
    for (let side = -1; side <= 1; side += 2) {
      const lappet = mesh(new THREE.BoxGeometry(0.04, 0.22, 0.012), M.inqWhite);
      lappet.position.set(side * 0.05, 0.04, -0.18);
      head.add(lappet);
      // Gold trim on lappet
      const lappetTrim = mesh(new THREE.BoxGeometry(0.002, 0.22, 0.014), M.inqGoldHi);
      lappetTrim.position.set(side * 0.05 - 0.018, 0.04, -0.185);
      head.add(lappetTrim);
      const lappetTrim2 = mesh(new THREE.BoxGeometry(0.002, 0.22, 0.014), M.inqGoldHi);
      lappetTrim2.position.set(side * 0.05 + 0.018, 0.04, -0.185);
      head.add(lappetTrim2);
      // Cross at the bottom of lappet
      const lappetCrossV = mesh(new THREE.BoxGeometry(0.005, 0.018, 0.005), M.inqGoldHi);
      lappetCrossV.position.set(side * 0.05, -0.06, -0.19);
      head.add(lappetCrossV);
      const lappetCrossH = mesh(new THREE.BoxGeometry(0.012, 0.005, 0.005), M.inqGoldHi);
      lappetCrossH.position.set(side * 0.05, -0.057, -0.19);
      head.add(lappetCrossH);
    }

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SPIRITUALIST — Mystic V/VI                                              ║
// ║  Channel Ancestral Spirits · Pale-grey ethereal robes, ★ 4 spirit-     ║
// ║  orbs (small ghost-faces) orbiting the body ★, spirit-orb staff,       ║
// ║  ghost-blue-white eye glow                                             ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Spiritualist extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = spiritualistAnimations;
  }

  // Override update — orbit the spirit-orbs at different rates
  update(time, dt) {
    super.update(time, dt);
    if (this.spiritOrbs) {
      this.spiritOrbs.rotation.y = time * 0.3;
      // Each spirit bobs with its own phase
      this.spiritOrbs.children.forEach((s, i) => {
        s.position.y = s.userData.baseY + Math.sin(time * 1.0 + i * 1.3) * 0.04;
      });
    }
    if (this.staffOrb) this.staffOrb.scale.setScalar(1 + Math.sin(time * 1.6) * 0.08);
  }

  build() {
    const root = this.group;

    // Legs — pale grey ethereal robes
    const buildSpiritLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.spiritGrey);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.spiritGreyHi);
      shin.position.y = 0.36; leg.add(shin);
      // Silver trim band
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.spiritSilver);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Ghost-wisp trim ornaments
      for (let i = -1; i <= 1; i++) {
        const wisp = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.spiritEthereal);
        wisp.position.set(i * 0.07, 0.12, 0.22); wisp.scale.set(0.7, 1.4, 0.7);
        leg.add(wisp);
      }
      // Sole (faint dark gray)
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.spiritGreyDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildSpiritLeg(-1));
    root.add(buildSpiritLeg(1));

    // Pelvis — silver belt with hanging spirit charms
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.spiritGreyDark));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.spiritSilver);
    belt.position.y = 0.04; pelvis.add(belt);
    // Spirit-orb buckle
    const buckleGem = mesh(new THREE.SphereGeometry(0.035, 14, 10), M.spiritEthereal);
    buckleGem.position.set(0, 0.04, 0.32); buckleGem.scale.set(1.2, 0.8, 0.5);
    pelvis.add(buckleGem);
    // Hanging spirit-wisp charms
    for (let i = -2; i <= 2; i++) {
      const wisp = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.spiritEthereal);
      wisp.position.set(i * 0.06, -0.06 - Math.abs(i) * 0.015, 0.31); wisp.scale.set(0.7, 1.4, 0.7);
      pelvis.add(wisp);
      const cord = mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.04, 4), M.spiritSilver);
      cord.position.set(i * 0.06, -0.025 - Math.abs(i) * 0.01, 0.31);
      pelvis.add(cord);
    }
    // Robe drape (with ghostly transparency)
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.spiritGrey);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    const hemTrim2 = mesh(new THREE.TorusGeometry(0.4, 0.012, 8, 24), M.spiritSilverHi);
    hemTrim2.rotation.x = Math.PI / 2; hemTrim2.position.y = -0.42;
    pelvis.add(hemTrim2);
    // Ghost-wisp trail along the hem
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const wisp = mesh(new THREE.ConeGeometry(0.022, 0.08, 5), M.spiritEthereal);
      wisp.position.set(Math.cos(a) * 0.4, -0.45, Math.sin(a) * 0.4);
      wisp.rotation.x = Math.PI;
      pelvis.add(wisp);
    }
    root.add(pelvis);

    // TORSO — pale grey robe with silver trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.spiritGrey);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Silver vertical stripe
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.spiritSilver);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.spiritGreyHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — spiral of 3 spirits (the marquee Spiritualist symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.085, 16), M.spiritGreyDark);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // Outer ring
    const emblemRing = mesh(new THREE.TorusGeometry(0.078, 0.005, 8, 18), M.spiritSilverHi);
    emblemRing.position.set(0, 0.22, 0.42); torso.add(emblemRing);
    // 3 spirit-faces in a triangle
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + Math.PI / 2;
      const spirit = mesh(new THREE.SphereGeometry(0.018, 12, 10), M.spiritEthereal);
      spirit.position.set(Math.cos(a) * 0.038, 0.22 + Math.sin(a) * 0.038, 0.43); spirit.scale.set(1, 1.2, 0.4);
      torso.add(spirit);
      // Connecting wisp
      if (i < 2 || i === 2) {
        const a2 = ((i + 1) / 3) * Math.PI * 2 + Math.PI / 2;
        const trail = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.04, 4), M.spiritSilver);
        trail.position.set(Math.cos((a + a2) / 2) * 0.038, 0.22 + Math.sin((a + a2) / 2) * 0.038, 0.42);
        trail.rotation.z = (a + a2) / 2;
        torso.add(trail);
      }
    }
    // Center heart-orb
    const emblemCore = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.spiritWisp);
    emblemCore.position.set(0, 0.22, 0.44);
    torso.add(emblemCore);

    // Wisp sigils flanking
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.spiritEthereal);
        sigil.position.set(side * 0.18, 0.12 - i * 0.1, 0.36); sigil.scale.set(0.7, 1.4, 0.7);
        torso.add(sigil);
      }
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.spiritGreyHi);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.spiritSilverHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // Ethereal shoulder caps
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.spiritGreyHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.spiritSilverHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
      // Spirit-wisp atop each shoulder
      const shoulderWisp = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.spiritEthereal);
      shoulderWisp.position.set(side * 0.42, 2.3, 0); shoulderWisp.scale.set(0.7, 1.4, 0.7);
      root.add(shoulderWisp);
    }

    // Arms
    const armPalette = { cloth: M.spiritGrey, mid: M.spiritGreyHi, dark: M.spiritGreyDark, hi: M.spiritSilver, accent: M.spiritEthereal };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide flared sleeves
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.spiritGreyHi);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.spiritSilverHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Wisp ornaments around the sleeve hem
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const wisp = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.spiritEthereal);
        wisp.position.set(Math.cos(a) * 0.16, -0.95, Math.sin(a) * 0.16); wisp.scale.set(0.7, 1.4, 0.7);
        arm.add(wisp);
      }
    });

    // SPIRIT-ORB STAFF
    const staff = this._buildSpiritStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // Cape (faint pale grey)
    const cape = buildCape({ material: M.spiritGreyDark, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    const capeTrim = mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 28, Math.PI), M.spiritSilverHi);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 0.6, -0.1);
    capeTrim.scale.set(1.3, 1, 0.5);
    root.add(capeTrim);
    // Wisp fringes on cape hem
    for (let i = -3; i <= 3; i++) {

      wisp.rotation.x = Math.PI;
      root.add(wisp);
    }

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — pale ghostly face
    const head = this._buildSpiritualistHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== ORBITING SPIRIT-ORBS — 4 small ghost-faces around the body (the marquee feature) =====
    this.spiritOrbs = new THREE.Group();
    this.spiritOrbs.position.set(0, 1.85, 0);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const spiritGroup = new THREE.Group();
      spiritGroup.position.set(Math.cos(a) * 0.7, Math.sin(a * 2) * 0.15, Math.sin(a) * 0.7);
      spiritGroup.userData.baseY = Math.sin(a * 2) * 0.15;
      // Spirit body (small ghostly sphere)
      const body = mesh(new THREE.SphereGeometry(0.05, 12, 10), M.spiritEthereal);
      body.scale.set(1.0, 1.4, 0.7);
      spiritGroup.add(body);
      // Spirit eyes (tiny dark sockets)
      for (let s = -1; s <= 1; s += 2) {
        const eye = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.spiritGreyDark);
        eye.position.set(s * 0.014, 0.012, 0.02); spiritGroup.add(eye);
      }
      // Spirit trail wisp behind
      const trail = mesh(new THREE.SphereGeometry(0.04, 10, 8), M.spiritEthereal);
      trail.position.set(0, -0.04, -0.04); trail.scale.set(0.6, 0.5, 1.4);
      spiritGroup.add(trail);
      this.spiritOrbs.add(spiritGroup);
    }
    root.add(this.spiritOrbs);

    M.spiritEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.spiritEye;
  }

  _buildSpiritStaff() {
    const staff = new THREE.Group();
    const pommel = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.spiritSilverHi);
    staff.add(pommel);
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.024, 1.4, 12), M.spiritGreyDark);
    haft.position.y = 0.74; staff.add(haft);
    // Silver bands + wisp ornaments
    for (let i = 0; i < 7; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.027, 0.005, 6, 12), M.spiritSilver);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.1 + i * 0.2;
      staff.add(wrap);
    }
    const midGem = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.spiritEthereal);
    midGem.position.y = 0.74; midGem.scale.set(1, 0.5, 1);
    staff.add(midGem);
    // Top section — silver claw cradle
    const cradle = mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.06, 12), M.spiritSilverHi);
    cradle.position.y = 1.46; staff.add(cradle);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const claw = mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.16, 6), M.spiritSilverHi);
      claw.position.set(Math.cos(a) * 0.05, 1.55, Math.sin(a) * 0.05);
      claw.rotation.z = -Math.cos(a) * 0.5;
      claw.rotation.x = -Math.sin(a) * 0.5;
      staff.add(claw);
    }
    // BIG SPIRIT ORB at the top (the marquee — large pulsing ghost-orb)
    const orb = mesh(new THREE.SphereGeometry(0.085, 16, 14), M.spiritEthereal);
    orb.position.y = 1.65;
    staff.add(orb);
    this.staffOrb = orb;
    // Inner brighter shine
    const orbShine = mesh(new THREE.SphereGeometry(0.045, 12, 10), M.spiritSilverHi);
    orbShine.position.y = 1.65; staff.add(orbShine);
    // Tiny ghost-faces orbiting inside the orb (3 small)
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const miniGhost = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.spiritWisp);
      miniGhost.position.set(Math.cos(a) * 0.06, 1.65 + Math.sin(a * 2) * 0.02, Math.sin(a) * 0.06);
      miniGhost.scale.set(0.7, 1.4, 0.7);
      staff.add(miniGhost);
    }
    return staff;
  }

  _buildSpiritualistHead() {
    const head = new THREE.Group();
    // Pale ghostly skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Pale silver hair
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.spiritSilver);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);
    // Long flowing hair
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.spiritSilverHi);
    backHair.scale.set(1.05, 1.5, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);

    // Eyes — ghost-blue-white glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.spiritEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Pale brows
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.spiritSilver);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.15;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skinPale);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Calm ethereal mouth
    const mouth = mesh(new THREE.BoxGeometry(0.05, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Silver circlet with a third-eye ghost-orb
    const circlet = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 24), M.spiritSilverHi);
    circlet.rotation.x = Math.PI / 2;
    circlet.position.y = 0.04;
    head.add(circlet);
    // Forehead ghost-gem
    const browGem = mesh(new THREE.SphereGeometry(0.028, 12, 10), M.spiritEthereal);
    browGem.position.set(0, 0.06, 0.21); browGem.scale.set(1.1, 1.0, 0.5);
    head.add(browGem);
    // 2 silver wing-prongs flanking the gem
    for (let side = -1; side <= 1; side += 2) {
      const prong = mesh(new THREE.ConeGeometry(0.012, 0.06, 4), M.spiritSilverHi);
      prong.position.set(side * 0.075, 0.1, 0.2); prong.rotation.z = side * 0.4;
      head.add(prong);
    }

    // Floating ghost-wisp atop head
    const topWisp = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.spiritEthereal);
    topWisp.position.set(0, 0.22, 0); topWisp.scale.set(0.7, 1.4, 0.7);
    head.add(topWisp);

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  GEOMANCER — Mystic VI/VI                                                ║
// ║  Earth · Terrain · Mountain Heart · ★ Heavy stone-plate armor ★ (the   ║
// ║  ONLY armored mystic), ★ orbital stone shards ★, ★ craggy mountain    ║
// ║  staff ★, mountain-peak crest helm, earth-bronze eye glow              ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Geomancer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = geomancerAnimations;
  }

  // Override update — orbit the stone shards slowly (very mountain-like, ponderous)
  update(time, dt) {
    super.update(time, dt);
    if (this.stoneShards) {
      this.stoneShards.rotation.y = time * 0.18;
      this.stoneShards.children.forEach((s, i) => {
        s.rotation.x = time * 0.3 + i * 1.2;
        s.rotation.z = time * 0.2 + i * 0.8;
      });
    }
  }

  build() {
    const root = this.group;

    // Legs — heavy stone-plate (using the standard buildLeg with earth palette)
    const legPalette = { dark: M.geoStoneDark, mid: M.geoStone, accent: M.geoBronze, trim: M.geoBronzeHi, leather: M.geoEarth };
    root.add(buildLeg(-1, legPalette));
    root.add(buildLeg(1, legPalette));

    // Pelvis — earth-stone with bronze studs + hanging stone-fragment charms
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.geoStoneDark));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.geoBronzeHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Mountain-peak buckle
    const buckleBack = mesh(new THREE.CircleGeometry(0.045, 16), M.geoStone);
    buckleBack.position.set(0, 0.04, 0.32); pelvis.add(buckleBack);
    // 3 mountain-peaks rising from the buckle
    for (let i = -1; i <= 1; i++) {
      const peak = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.geoBronzeHi);
      peak.position.set(i * 0.018, 0.06, 0.34);
      pelvis.add(peak);
    }
    // Earth-rune in buckle
    const buckleRune = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.geoRune);
    buckleRune.position.set(0, 0.04, 0.34); buckleRune.scale.set(1, 1, 0.5);
    pelvis.add(buckleRune);
    // Stone-fragment hip charms
    for (let i = -2; i <= 2; i++) {
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.04, 4), M.geoEarth);
      cord.position.set(i * 0.06, -0.04, 0.31);
      pelvis.add(cord);
      const stone = mesh(new THREE.OctahedronGeometry(0.018, 0), M.geoStoneHi);
      stone.position.set(i * 0.06, -0.1, 0.31); stone.scale.set(0.9, 1.2, 0.9);
      pelvis.add(stone);
    }
    // Rocky tassets — 6 jagged stone plates around the lower pelvis
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * 0.5 + (i / 5) * Math.PI * 1.0;
      const tasset = mesh(new THREE.BoxGeometry(0.13, 0.36, 0.04), M.geoStone);
      tasset.position.set(Math.cos(a) * 0.3, -0.22, Math.sin(a) * 0.3);
      tasset.lookAt(Math.cos(a) * 2, -0.22, Math.sin(a) * 2);
      tasset.rotateX(0.06);
      pelvis.add(tasset);
      // Bronze stud at top
      const stud = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.geoBronzeHi);
      stud.position.set(Math.cos(a) * 0.32, -0.06, Math.sin(a) * 0.32);
      pelvis.add(stud);
      // Mossy crack along each tasset
      const moss = mesh(new THREE.BoxGeometry(0.05, 0.012, 0.005), M.geoMoss);
      moss.position.set(Math.cos(a) * 0.32, -0.18, Math.sin(a) * 0.32);
      moss.lookAt(Math.cos(a) * 2, -0.18, Math.sin(a) * 2);
      pelvis.add(moss);
    }
    root.add(pelvis);

    // TORSO — heavy stone-plate cuirass
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    // Base body
    const base = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.geoStoneDark);
    base.scale.set(1.05, 1, 0.85);
    torso.add(base);
    // Stone cuirass (front prominent)
    const cuirass = mesh(new THREE.CylinderGeometry(0.38, 0.36, 0.6, 16, 1, false, -Math.PI / 2.2, Math.PI * 1.3), M.geoStone);
    cuirass.scale.set(1.05, 1, 0.85);
    cuirass.position.y = 0.04;
    torso.add(cuirass);
    // Pec mounds (heavy stone)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.geoStoneHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);
    // Bronze rivets along the cuirass edges
    for (let i = 0; i < 5; i++) {
      const ry = 0.22 - i * 0.12;
      const rivetL = mesh(new THREE.SphereGeometry(0.014, 8, 6), M.geoBronzeHi);
      rivetL.position.set(-0.34, ry, 0.18); torso.add(rivetL);
      const rivetR = rivetL.clone(); rivetR.position.x = 0.34; torso.add(rivetR);
    }
    // Cracked moss accents on the cuirass
    for (let i = 0; i < 4; i++) {
      const moss = mesh(new THREE.BoxGeometry(0.08, 0.012, 0.005), M.geoMoss);
      moss.position.set((i - 1.5) * 0.15, -0.05, 0.39); moss.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.2;
      torso.add(moss);
    }

    // CHEST EMBLEM — mountain peak in a circle (the marquee Geomancer symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.08, 16), M.geoStoneDark);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    const emblemRing = mesh(new THREE.TorusGeometry(0.075, 0.008, 8, 18), M.geoBronzeHi);
    emblemRing.position.set(0, 0.22, 0.42); torso.add(emblemRing);
    // 3 mountain peaks (different heights)
    const peakHeights = [0.05, 0.08, 0.06];
    for (let i = -1; i <= 1; i++) {
      const h = peakHeights[i + 1];
      const peak = mesh(new THREE.ConeGeometry(0.022, h, 3), M.geoBronzeHi);
      peak.position.set(i * 0.025, 0.22 - 0.02 + h / 2, 0.43);
      torso.add(peak);
    }
    // Earth-rune at center base
    const emblemRune = mesh(new THREE.SphereGeometry(0.012, 10, 8), M.geoRune);
    emblemRune.position.set(0, 0.18, 0.435);
    torso.add(emblemRune);

    // High collar (stone)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.geoStoneDark);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.geoBronzeHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // BIG STONE PAULDRONS (geomancer is heavy — bigger pauldrons than other mystics)
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.22, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.6), M.geoStone);
      pauld.scale.set(1.15, 0.95, 1.05);
      pauld.position.set(side * 0.42, 2.2, 0);
      root.add(pauld);
      // Bronze rim
      const pauldTrim = mesh(new THREE.TorusGeometry(0.22, 0.012, 8, 20), M.geoBronzeHi);
      pauldTrim.rotation.x = Math.PI / 2; pauldTrim.position.set(side * 0.42, 2.16, 0);
      root.add(pauldTrim);
      // Mountain-peak spike on top of each pauldron
      const peak = mesh(new THREE.ConeGeometry(0.04, 0.14, 4), M.geoStoneHi);
      peak.position.set(side * 0.42, 2.34, 0);
      root.add(peak);
      // Earth-rune at the peak's base
      const peakRune = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.geoRune);
      peakRune.position.set(side * 0.42, 2.27, 0); peakRune.scale.set(1, 0.5, 1);
      root.add(peakRune);
    }

    // Arms
    const armPalette = { cloth: M.geoEarth, mid: M.geoStone, dark: M.geoStoneDark, hi: M.geoBronze, accent: M.geoBronzeHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Stone-knuckle bracers
    [leftArm, rightArm].forEach(arm => {
      for (let i = 0; i < 3; i++) {
        const ring = mesh(new THREE.TorusGeometry(0.088, 0.012, 8, 16), M.geoBronzeHi);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.5 - i * 0.13;
        arm.add(ring);
      }
      // Stone-knuckle on the gauntlet
      const knuckle = mesh(new THREE.OctahedronGeometry(0.025, 0), M.geoStoneHi);
      knuckle.position.set(0, -0.92, 0.07); knuckle.scale.set(1, 0.8, 1);
      arm.add(knuckle);
    });

    // CRAGGY MOUNTAIN STAFF
    const staff = this._buildMountainStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // No flowing cape (heavy stone armor doesn't flow)
    this.cape = null;

    // Neck (stone-protected)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.geoStoneDark);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — mountain-peak crested helm
    const head = this._buildGeomancerHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== ORBITAL STONE SHARDS — 5 jagged stones rotating around the body =====
    this.stoneShards = new THREE.Group();
    this.stoneShards.position.set(0, 1.85, 0);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const r = 0.65 + (i % 2) * 0.1;
      const shardSize = 0.05 + (i % 3) * 0.012;
      // Jagged irregular shape (use random-ish polyhedron)
      const shard = mesh(new THREE.OctahedronGeometry(shardSize, 0), i % 2 === 0 ? M.geoStoneHi : M.geoStone);
      shard.position.set(Math.cos(a) * r, Math.sin(a * 2) * 0.12, Math.sin(a) * r);
      shard.scale.set(1 + (i % 2) * 0.3, 0.7, 1.2 + (i % 3) * 0.2);
      this.stoneShards.add(shard);
      // Earth-rune dot on each shard
      const shardRune = mesh(new THREE.SphereGeometry(0.012, 6, 4), M.geoRune);
      shardRune.position.copy(shard.position);
      this.stoneShards.add(shardRune);
    }
    root.add(this.stoneShards);

    M.geoEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.geoEye;
  }

  _buildMountainStaff() {
    const staff = new THREE.Group();
    // Pommel — stone knot
    const pommel = mesh(new THREE.OctahedronGeometry(0.04, 0), M.geoStoneHi);
    pommel.scale.y = 0.7;
    staff.add(pommel);
    // Long gnarled stone haft (with bumps)
    const haft = mesh(new THREE.CylinderGeometry(0.03, 0.034, 1.4, 10), M.geoStone);
    haft.position.y = 0.74; staff.add(haft);
    // Stone bumps along haft (gnarly mountain-staff look)
    for (let i = 0; i < 5; i++) {
      const knot = mesh(new THREE.OctahedronGeometry(0.04 + (i % 2) * 0.012, 0), M.geoStoneHi);
      knot.position.y = 0.2 + i * 0.22; knot.scale.set(1.2, 0.6, 1.2);
      staff.add(knot);
    }
    // Bronze rune bands at intervals
    for (let i = 0; i < 4; i++) {
      const band = mesh(new THREE.TorusGeometry(0.034, 0.005, 6, 12), M.geoBronzeHi);
      band.rotation.x = Math.PI / 2;
      band.position.y = 0.3 + i * 0.28;
      staff.add(band);
    }
    // Mid-haft earth-rune
    const midRune = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.geoRune);
    midRune.position.y = 0.74;
    staff.add(midRune);
    // ===== TOP MOUNTAIN-PEAK CRYSTAL CLUSTER =====
    // Several jagged stone-shards forming a peak
    const peak1 = mesh(new THREE.ConeGeometry(0.06, 0.18, 4), M.geoStoneHi);
    peak1.position.y = 1.55; staff.add(peak1);
    const peak2 = mesh(new THREE.ConeGeometry(0.04, 0.14, 4), M.geoStone);
    peak2.position.set(0.05, 1.5, 0); peak2.rotation.z = 0.3;
    staff.add(peak2);
    const peak3 = mesh(new THREE.ConeGeometry(0.04, 0.14, 4), M.geoStoneDark);
    peak3.position.set(-0.05, 1.5, 0); peak3.rotation.z = -0.3;
    staff.add(peak3);
    // Glowing earth-rune at the peak's heart
    const peakRune = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.geoRune);
    peakRune.position.y = 1.5; peakRune.scale.set(1, 0.8, 0.6);
    staff.add(peakRune);
    // Tiny floating fragments orbiting the peak
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const fragment = mesh(new THREE.OctahedronGeometry(0.018, 0), M.geoStoneHi);
      fragment.position.set(Math.cos(a) * 0.14, 1.55 + Math.sin(a * 2) * 0.04, Math.sin(a) * 0.14);
      staff.add(fragment);
    }
    return staff;
  }

  _buildGeomancerHead() {
    const head = new THREE.Group();

    // Tan/weathered face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Brown hair scalp (visible behind helm)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.geoEarth);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // Wild grey-brown beard (mountain-hermit style — long and shaggy)
    const beard = mesh(new THREE.SphereGeometry(0.16, 16, 12), M.geoStoneHi);
    beard.position.set(0, -0.18, 0.1); beard.scale.set(1.05, 1.4, 0.9);
    head.add(beard);
    // Beard tip
    const beardTip = mesh(new THREE.ConeGeometry(0.06, 0.16, 6), M.geoStoneHi);
    beardTip.position.set(0, -0.36, 0.05); beardTip.rotation.x = Math.PI;
    head.add(beardTip);
    // Mustache
    for (let side = -1; side <= 1; side += 2) {
      const mustache = mesh(new THREE.BoxGeometry(0.06, 0.018, 0.012), M.geoStoneHi);
      mustache.position.set(side * 0.05, -0.08, 0.21); mustache.rotation.z = side * 0.18;
      head.add(mustache);
    }

    // Eyes — earth-bronze glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.geoEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Bushy eyebrows
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.06, 0.014, 0.012), M.geoStoneHi);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.18;
      head.add(brow);
    }

    // Strong nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.07, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // ===== MOUNTAIN-PEAK CREST HELM =====
    // Stone helm dome (open-faced, like an old crown)
    const helmBand = mesh(new THREE.TorusGeometry(0.21, 0.024, 10, 24), M.geoStone);
    helmBand.rotation.x = Math.PI / 2;
    helmBand.position.y = 0.04;
    head.add(helmBand);
    // Bronze trim around the helm
    const helmTrim = mesh(new THREE.TorusGeometry(0.215, 0.012, 8, 26), M.geoBronzeHi);
    helmTrim.rotation.x = Math.PI / 2;
    helmTrim.position.y = 0.06;
    head.add(helmTrim);
    // 3 MOUNTAIN PEAKS rising from the helm (the marquee feature)
    const peakHeights = [0.18, 0.26, 0.18];
    for (let i = -1; i <= 1; i++) {
      const h = peakHeights[i + 1];
      const peak = mesh(new THREE.ConeGeometry(0.045 + Math.abs(i) * 0.005, h, 4), i === 0 ? M.geoStoneHi : M.geoStone);
      peak.position.set(i * 0.085, 0.05 + h / 2, 0);
      head.add(peak);
      // Bronze peak-tip cap
      const peakCap = mesh(new THREE.SphereGeometry(0.012, 6, 4), M.geoBronzeHi);
      peakCap.position.set(i * 0.085, 0.05 + h, 0);
      head.add(peakCap);
    }
    // Glowing earth-rune at the central peak's base
    const helmRune = mesh(new THREE.SphereGeometry(0.024, 10, 8), M.geoRune);
    helmRune.position.set(0, 0.06, 0.21); helmRune.scale.set(1, 1, 0.5);
    head.add(helmRune);
    // Mossy patches on the helm (mountain-aged look)
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const moss = mesh(new THREE.SphereGeometry(0.025, 8, 6), M.geoMoss);
      moss.position.set(Math.cos(a) * 0.21, 0.04 + Math.sin(a) * 0.01, Math.sin(a) * 0.21); moss.scale.set(1, 0.4, 1);
      head.add(moss);
    }
    // Cheek/jaw guards (stone)
    for (let side = -1; side <= 1; side += 2) {
      const cheekShape = new THREE.Shape();
      cheekShape.moveTo(0, 0); cheekShape.lineTo(0.08, 0);
      cheekShape.lineTo(0.06, -0.16); cheekShape.lineTo(-0.02, -0.18); cheekShape.closePath();
      const cheek = mesh(new THREE.ExtrudeGeometry(cheekShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 }), M.geoStone);
      cheek.position.set(side * 0.18, -0.05, 0.06);
      cheek.rotation.y = side > 0 ? -0.4 : Math.PI + 0.4;
      head.add(cheek);
    }

    return head;
  }
}

        mgr.spawn(new LightPillar(champ.scene, targetGround, { color: 0xc8783c, height: 3.2, radius: 0.45, duration: 0.9 }), time);
      }},
    ],
  },
};

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  VIEWER — preview-only setup                                             ║
// ║  CC: ignore everything below this line — game runtime doesn't need it.  ║
// ╚══════════════════════════════════════════════════════════════════════════╝

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
scene.fog = new THREE.Fog(0x05060c, 9, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 2.4, 5.8);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.45, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

// ─── Lighting (3-point + counter-rim) ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x4a4a5a, 0.32));
const key = new THREE.DirectionalLight(0xfff0d8, 1.6);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8090c8, 0.55);
fill.position.set(-4, 4, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffaa50, 0.85);
rim.position.set(-2, 3, -5);
scene.add(rim);
const rimAmber = new THREE.PointLight(0xff8030, 1.2, 8, 1.5);
rimAmber.position.set(0, 1.7, -2.2);
scene.add(rimAmber);

// ─── Dais ─────────────────────────────────────────────────────────────────
const daisGroup = new THREE.Group();
const daisBase = mesh(new THREE.CylinderGeometry(2.2, 2.5, 0.18, 64), M.stone, { receive: true });
daisBase.position.y = 0.04; daisGroup.add(daisBase);
const daisTop = mesh(new THREE.CylinderGeometry(2.0, 2.05, 0.06, 64), M.stoneDark, { receive: true });
daisTop.position.y = 0.16; daisGroup.add(daisTop);
const daisRing = mesh(new THREE.TorusGeometry(2.0, 0.04, 12, 64), M.brass);
daisRing.rotation.x = Math.PI / 2; daisRing.position.y = 0.19; daisGroup.add(daisRing);
// 8 small runic engravings around the dais
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const rune = mesh(new THREE.BoxGeometry(0.18, 0.005, 0.04), M.stoneRune);
  rune.position.set(Math.cos(a) * 1.85, 0.195, Math.sin(a) * 1.85);
  rune.rotation.y = -a + Math.PI / 2;
  daisGroup.add(rune);
}
// Subtle cracks
for (let i = 0; i < 6; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.5 + Math.random() * 1.3;
  const crack = mesh(new THREE.BoxGeometry(0.4 + Math.random() * 0.4, 0.001, 0.012), M.stoneDark);
  crack.position.set(Math.cos(a) * r, 0.193, Math.sin(a) * r);
  crack.rotation.y = Math.random() * Math.PI;
  daisGroup.add(crack);
}
scene.add(daisGroup);

// ─── Aura ring (color-tinted per class) ───────────────────────────────────
const auraGeo = new THREE.RingGeometry(2.05, 2.35, 96, 1);
const auraMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xff8020) }, uOpacity: { value: 0.55 } },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xy);
      float a = atan(vPos.y, vPos.x);
      float pulse = 0.55 + 0.45 * sin(uTime * 1.2 + a * 4.0);
      float band = smoothstep(2.05, 2.18, r) * smoothstep(2.35, 2.18, r);
      gl_FragColor = vec4(uColor * pulse * 1.4, band * uOpacity * pulse);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});
const aura = new THREE.Mesh(auraGeo, auraMat);
aura.rotation.x = -Math.PI / 2;
aura.position.y = 0.205;
scene.add(aura);

// ─── Floating embers ──────────────────────────────────────────────────────
const EMBER_COUNT = 220;
const emberPositions = new Float32Array(EMBER_COUNT * 3);
const emberSeeds = new Float32Array(EMBER_COUNT);
for (let i = 0; i < EMBER_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4.5;
  emberPositions[i*3 + 0] = Math.cos(a) * r;
  emberPositions[i*3 + 1] = Math.random() * 4.5;
  emberPositions[i*3 + 2] = Math.sin(a) * r;
  emberSeeds[i] = Math.random();
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('seed', new THREE.Float32BufferAttribute(emberSeeds, 1));
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

// ─── Post-processing ──────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.78, 0.4, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ───────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Class registry ───────────────────────────────────────────────────────
const classRegistry = {
  bard: {
    name: 'Bard',
    family: 'Mystic · I/VI',
    role: 'Buff Songs · Inspiring Presence',
    accent: '#ffb088',
    accentGlow: 'rgba(255, 176, 136, 0.5)',
    auraColor: 0xff9870,
    emberColor: new THREE.Color(1.0, 0.65, 0.5),
    abilities: { attack: 'Sound Wave', spell1: 'Song of Valor', spell2: 'Crescendo' },
    factory: () => new Bard(scene, new THREE.Vector3(0, 0, 0)),
  },
  witch: {
    name: 'Witch',
    family: 'Mystic · II/VI',
    role: 'Curses · Hexes · Cackling',
    accent: '#80a050',
    accentGlow: 'rgba(128, 160, 80, 0.5)',
    auraColor: 0x4a6a30,
    emberColor: new THREE.Color(0.5, 0.65, 0.3),
    abilities: { attack: 'Hex Bolt', spell1: 'Curse of Frailty', spell2: 'Hex Toad' },
    factory: () => new Witch(scene, new THREE.Vector3(0, 0, 0)),
  },
  shaman: {
    name: 'Shaman',
    family: 'Mystic · III/VI',
    role: 'Totems · Spirit Link',
    accent: '#ffc060',
    accentGlow: 'rgba(255, 192, 96, 0.5)',
    auraColor: 0xe8a040,
    emberColor: new THREE.Color(1.0, 0.75, 0.4),
    abilities: { attack: 'Totemic Strike', spell1: 'Earth Totem', spell2: 'Healing Totem' },
    factory: () => new Shaman(scene, new THREE.Vector3(0, 0, 0)),
  },
  inquisitor: {
    name: 'Inquisitor',
    family: 'Mystic · IV/VI',
    role: 'Anti-Magic · Sanctified',
    accent: '#ffffff',
    accentGlow: 'rgba(255, 255, 255, 0.5)',
    auraColor: 0xfaf8ff,
    emberColor: new THREE.Color(1.0, 0.98, 1.0),
    abilities: { attack: 'Holy Bolt', spell1: 'Mantra of Silence', spell2: 'Anti-Magic Field' },
    factory: () => new Inquisitor(scene, new THREE.Vector3(0, 0, 0)),
  },
  spiritualist: {
    name: 'Spiritualist',
    family: 'Mystic · V/VI',
    role: 'Channel Ancestral Spirits',
    accent: '#e0e8ff',
    accentGlow: 'rgba(224, 232, 255, 0.5)',
    auraColor: 0xb0c8ff,
    emberColor: new THREE.Color(0.85, 0.9, 1.0),
    abilities: { attack: 'Ghost Bolt', spell1: 'Spirit of the Bear', spell2: 'Spirit of the Wolf' },
    factory: () => new Spiritualist(scene, new THREE.Vector3(0, 0, 0)),
  },
  geomancer: {
    name: 'Geomancer',
    family: 'Mystic · VI/VI',
    role: 'Earth · Terrain · Mountain Heart',
    accent: '#c8783c',
    accentGlow: 'rgba(200, 120, 60, 0.5)',
    auraColor: 0x8a6028,
    emberColor: new THREE.Color(0.78, 0.47, 0.24),
    abilities: { attack: 'Stone Throw', spell1: 'Earthquake', spell2: 'Stone Skin' },
    factory: () => new Geomancer(scene, new THREE.Vector3(0, 0, 0)),
  },
};

// ─── Build all champions up front (single per class — viewer only shows one)
const champions = {};
for (const key in classRegistry) {
  const champ = classRegistry[key].factory();
  champ.group.visible = false;
  champions[key] = champ;
}
let activeChampion = champions.bard;
activeChampion.group.visible = true;

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

// ─── UI wiring ────────────────────────────────────────────────────────────
document.getElementById('classSelect').addEventListener('change', (e) => {
  selectClass(e.target.value);
});

const abilityButtons = document.querySelectorAll('.ab-btn');
abilityButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeChampion || activeChampion.isPlaying()) return;
    const animName = btn.dataset.anim;
    activeChampion.playAnimation(animName, clock.getElapsedTime(), effectMgr);
    btn.classList.add('cooling');
    setTimeout(() => btn.classList.remove('cooling'), (activeChampion.animations[animName]?.duration || 1) * 1000 + 100);
  });
});

let demoMode = false;
let demoIdx = 0;
let demoNextTime = 0;
const demoOrder = ['attack', 'spell1', 'attack', 'spell2'];
document.getElementById('demoBtn').addEventListener('click', (e) => {
  demoMode = !demoMode;
  demoIdx = 0;
  e.target.textContent = demoMode ? '⏸ Stop Demo' : '▶ Cycle Animations';
  demoNextTime = clock.getElapsedTime() + 0.4;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('bard');

// Hide loading splash
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);

animate();

</script>
