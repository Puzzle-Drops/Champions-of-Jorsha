  linear: t => t,

  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};

// ─── Geometry helper ───────────────────────────────────────────────────────
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.cast !== false) m.castShadow = true;
  if (opts.receive) m.receiveShadow = true;
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  return m;
}

// ─── Effect base class + concrete VFX ──────────────────────────────────────
class Effect {
  constructor(scene) { this.scene = scene; this.alive = true; this.duration = 1; this.startTime = 0; }
  init(t) { this.startTime = t; }
  update(time, dt) {
    const t01 = (time - this.startTime) / this.duration;
    if (t01 >= 1) { this.alive = false; return; }
    this.tick(Math.max(0, t01), dt);
  }
  tick(t01, dt) {}
  dispose() {}
}

class ShockwaveRing extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.8;
    this.maxRadius = opts.maxRadius ?? 1.8;
    this.startRadius = opts.startRadius ?? 0.15;
    const geo = new THREE.RingGeometry(0.94, 1.0, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xc89860, transparent: true, opacity: 1,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.95;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class FilledShockwave extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 0.55;
    this.maxRadius = opts.maxRadius ?? 1.4;
    const geo = new THREE.CircleGeometry(1.0, 48);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color ?? 0xffe080, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.015;
    this.mesh.scale.setScalar(0.2);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(0.2, this.maxRadius, ease.out(t01)));
    this.mesh.material.opacity = (1 - t01) * 0.55;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) },
        uOpacity: { value: 1.0 }, uRunes: { value: this.runeCount }, uRotate: { value: 0 },
      },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        uniform float uRunes; uniform float uRotate;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x) + uRotate;
          float seg = mod(a / (2.0 * 3.14159265) * uRunes, 1.0);
          float rune = smoothstep(0.30, 0.50, seg) * smoothstep(0.70, 0.50, seg);
          float pulse = 0.6 + 0.4 * sin(uTime * 4.0);
          float band = smoothstep(0.85, 0.92, r) * smoothstep(1.0, 0.95, r);
          float outer = smoothstep(0.97, 0.99, r) * smoothstep(1.0, 0.98, r);
          float glow = band * (rune * 0.85 + 0.15) * pulse + outer * 1.4;
          gl_FragColor = vec4(uColor * glow * 1.5, uOpacity * glow);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.02;
    this.mesh.scale.setScalar(this.startRadius);
    scene.add(this.mesh);
  }
  tick(t01) {
    this.mesh.scale.setScalar(lerp(this.startRadius, this.maxRadius, ease.out(t01)));
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (1 - t01) * 0.95;
    this.mesh.material.uniforms.uRotate.value = t01 * this.rotateSpeed * Math.PI;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class EnergyDome extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 2.4;
    this.radius = opts.radius ?? 1.5;
    const geo = new THREE.SphereGeometry(this.radius, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xc89860) }, uOpacity: { value: 1.0 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal); vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vNormal; varying vec3 vPos;
        void main() {
          vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(vPos, 1.0)).xyz);
          float fres = 1.0 - max(dot(normalize((modelMatrix * vec4(vNormal, 0.0)).xyz), viewDir), 0.0);
          fres = pow(fres, 2.0);
          float hex = sin(vPos.y * 6.0 + uTime * 1.5) * 0.5 + 0.5;
          float lines = pow(hex, 6.0);
          float sweep = abs(sin(vPos.y * 3.0 - uTime * 2.0));
          sweep = smoothstep(0.7, 1.0, sweep) * 0.4;
          float intensity = fres * 0.7 + lines * 0.3 + sweep;
          gl_FragColor = vec4(uColor * intensity * 1.6, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(position);
    this.mesh.position.y += 0.05;
    this.mesh.scale.setScalar(0.1);
    scene.add(this.mesh);
  }
  tick(t01) {
    const s = t01 < 0.15 ? lerp(0.1, 1.0, ease.outBack(t01 / 0.15)) : 1.0;
    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = (t01 < 0.7 ? 1.0 : 1.0 - (t01 - 0.7) / 0.3) * 0.85;
  }
  dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.scene.remove(this.mesh); }
}

class HolyCircle extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 3.2;
    this.radius = opts.radius ?? 1.8;
    const geo = new THREE.RingGeometry(0.05, 1.0, 96, 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(opts.color ?? 0xfddc80) }, uOpacity: { value: 1.0 } },
      vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec3 vPos;
        void main() {
          float r = length(vPos.xy);
          float a = atan(vPos.y, vPos.x);
          float outerRing = smoothstep(0.93, 0.97, r) * smoothstep(1.0, 0.97, r);
          float midRing = smoothstep(0.65, 0.69, r) * smoothstep(0.72, 0.69, r);
          float starAng = mod(a + uTime * 0.3, 6.28318 / 6.0) * 6.0;
          float star = smoothstep(0.0, 0.6, sin(starAng * 1.0)) * smoothstep(0.3, 0.55, r) * smoothstep(0.65, 0.55, r);
          float fill = smoothstep(0.97, 0.0, r) * 0.08;
          float runeAng = mod(a + uTime * -0.5, 6.28318 / 12.0) * 12.0;
          float runes = smoothstep(0.4, 0.5, sin(runeAng)) * smoothstep(0.78, 0.85, r) * smoothstep(0.92, 0.85, r);
          float pulse = 0.7 + 0.3 * sin(uTime * 3.0);
          float intensity = (outerRing + midRing * 0.7 + star * 0.9 + runes * 1.1) * pulse + fill;
          gl_FragColor = vec4(uColor * intensity * 1.7, uOpacity * intensity);
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.rotation.x = -Math.PI / 2;

    scene.add(this.mesh);

    this.mesh.scale.setScalar(s);
    this.mesh.material.uniforms.uTime.value = t01 * this.duration;
    this.mesh.material.uniforms.uOpacity.value = t01 < 0.85 ? 1.0 : 1.0 - (t01 - 0.85) / 0.15;

class LightPillar extends Effect {

      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; uniform float uOpacity;
        varying vec2 vUv;
        void main() {
          float vertical = smoothstep(1.0, 0.0, vUv.y) * smoothstep(0.0, 0.15, vUv.y);
          float horizontal = 1.0 - abs(vUv.x - 0.5) * 2.0;
          float pattern = sin(vUv.y * 30.0 - uTime * 8.0) * 0.5 + 0.5;

class ParticleBurst extends Effect {
  constructor(scene, position, opts = {}) {
    super(scene);
    this.duration = opts.duration ?? 1.2;
    const count = opts.count ?? 50;
    const speed = opts.speed ?? 3;
    this.gravity = opts.gravity ?? -2.5;
    this.upwardBias = opts.upwardBias ?? 1.5;
    this.size = opts.size ?? 1.6;
    this.count = count;
    this.positions = new Float32Array(count * 3);
    this.velocities = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.positions[i*3 + 0] = position.x;
      this.positions[i*3 + 1] = position.y;
      this.positions[i*3 + 2] = position.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const v = (0.4 + Math.random() * 0.6) * speed;
      this.velocities[i*3 + 0] = Math.sin(phi) * Math.cos(theta) * v;
      this.velocities[i*3 + 1] = Math.abs(Math.cos(phi)) * v + this.upwardBias;
      this.velocities[i*3 + 2] = Math.sin(phi) * Math.sin(theta) * v;
      this.life[i] = 0.5 + Math.random() * 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('life', new THREE.Float32BufferAttribute(this.life, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uDuration: { value: this.duration },
        uColor: { value: new THREE.Color(opts.color ?? 0xe3b878) }, uSize: { value: this.size },
      },
      vertexShader: `
        attribute float life;
        uniform float uTime; uniform float uDuration; uniform float uSize;
        varying float vLife;
        void main() {
          vLife = clamp(1.0 - uTime / (uDuration * life), 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * vLife * (300.0 / -mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vLife;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 1.5) * vLife;
          gl_FragColor = vec4(uColor * (1.0 + vLife), a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    scene.add(this.points);
  }
  tick(t01, dt) {
    for (let i = 0; i < this.count; i++) {
      this.positions[i*3 + 0] += this.velocities[i*3 + 0] * dt;
      this.positions[i*3 + 1] += this.velocities[i*3 + 1] * dt;
      this.positions[i*3 + 2] += this.velocities[i*3 + 2] * dt;
      this.velocities[i*3 + 1] += this.gravity * dt;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.material.uniforms.uTime.value = t01 * this.duration;
  }
  dispose() { this.points.geometry.dispose(); this.points.material.dispose(); this.scene.remove(this.points); }
}

class EffectManager {
  constructor(scene) { this.scene = scene; this.effects = []; }
  spawn(effect, time) { effect.init(time); this.effects.push(effect); }
  update(time, dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(time, dt);
      if (!this.effects[i].alive) {
        this.effects[i].dispose();
        this.effects.splice(i, 1);
      }
    }
  }
  clear() {
    for (const e of this.effects) e.dispose();
    this.effects = [];
  }
}

// ─── Shared part builders ──────────────────────────────────────────────────
function buildLeg(side, palette = {}) {
  const dark = palette.dark || M.iron;
  const mid = palette.mid || M.ironHi;
  const accent = palette.accent || M.brass;
  const trim = palette.trim || M.brass;
  const leather = palette.leather || M.leather;
  const leg = new THREE.Group();
  const sx = side;
  const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), dark);
  thigh.position.y = 0.95; leg.add(thigh);
  const kneeBase = mesh(new THREE.SphereGeometry(0.135, 14, 10), mid);
  kneeBase.position.y = 0.66; kneeBase.scale.set(1, 0.7, 1.2); leg.add(kneeBase);
  const kneeStud = mesh(new THREE.SphereGeometry(0.05, 10, 8), accent);
  kneeStud.position.set(0, 0.66, 0.13); leg.add(kneeStud);
  const greave = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.45, 14), mid);
  greave.position.y = 0.39; leg.add(greave);
  const greaveTrim = mesh(new THREE.TorusGeometry(0.118, 0.012, 8, 16), trim);
  greaveTrim.position.y = 0.6; greaveTrim.rotation.x = Math.PI / 2; leg.add(greaveTrim);
  const boot = mesh(new THREE.BoxGeometry(0.22, 0.13, 0.32), dark);
  boot.position.set(0, 0.105, 0.06); leg.add(boot);
  const toeShape = new THREE.Shape();
  toeShape.moveTo(-0.11, 0); toeShape.lineTo(0.11, 0);
  toeShape.lineTo(0.08, 0.12); toeShape.lineTo(-0.08, 0.12); toeShape.closePath();
  const toe = mesh(new THREE.ExtrudeGeometry(toeShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }), accent);
  toe.position.set(0, 0.06, 0.18); leg.add(toe);
  const heel = mesh(new THREE.BoxGeometry(0.22, 0.06, 0.08), leather);
  heel.position.set(0, 0.04, -0.07); leg.add(heel);
  leg.position.x = sx * 0.18;
  return leg;
}

function buildCape(opts = {}) {
  const widthSegs = 14, heightSegs = 22;
  const width = opts.width || 1.3;
  const height = opts.height || 1.85;
  const mat = opts.material;
  const verts = [], indices = [], uvs = [], original = [];
  for (let y = 0; y <= heightSegs; y++) {
    const v = y / heightSegs;
    const w = width * (0.45 + v * 0.55);
    for (let x = 0; x <= widthSegs; x++) {
      const u = x / widthSegs;
      const angle = (u - 0.5) * Math.PI * 0.55;
      const px = Math.sin(angle) * w / 2;
      const py = -v * height;
      const sideFwd = (1 - Math.cos(angle)) * 0.14;
      const bulge = Math.sin(v * Math.PI) * 0.07;
      const pz = -0.04 + sideFwd - bulge;
      verts.push(px, py, pz);
      uvs.push(u, 1 - v);
      original.push(px, py, pz);
    }
  }
  for (let y = 0; y < heightSegs; y++) {
    for (let x = 0; x < widthSegs; x++) {
      const a = y * (widthSegs + 1) + x, b = a + 1, c = a + widthSegs + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const cape = mesh(geo, mat);
  cape.userData.original = original;
  cape.userData.cols = widthSegs + 1;
  cape.userData.rows = heightSegs + 1;
  return cape;
}

function buildArm(sx, shoulderAngle, palette = {}) {
  const cloth = palette.cloth || M.cloth;
  const mid = palette.mid || M.iron;
  const dark = palette.dark || M.iron;
  const hi = palette.hi || M.ironHi;
  const accent = palette.accent || M.brass;
  const arm = new THREE.Group();
  const upper = mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.4, 12), cloth);
  upper.position.y = -0.2; arm.add(upper);
  const vambrace = mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.42, 12), mid);
  vambrace.position.y = -0.62; arm.add(vambrace);
  const vTrim = mesh(new THREE.TorusGeometry(0.088, 0.01, 6, 16), accent);
  vTrim.rotation.x = Math.PI / 2; vTrim.position.y = -0.42; arm.add(vTrim);
  const elbow = mesh(new THREE.SphereGeometry(0.1, 12, 10), hi);
  elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
  const gauntlet = mesh(new THREE.BoxGeometry(0.15, 0.18, 0.12), dark);
  gauntlet.position.y = -0.92; arm.add(gauntlet);
  const knuckle = mesh(new THREE.BoxGeometry(0.16, 0.05, 0.08), accent);

  hand.position.y = -0.96;
  arm.add(hand);
  arm.userData.hand = hand;
  arm.position.set(sx * 0.42, 2.18, 0);
  arm.rotation.z = sx * shoulderAngle;
  return arm;
}

// ─── Champion base class ───────────────────────────────────────────────────
class Champion {
  constructor(scene, position) {
    this.scene = scene;
    this.group = new THREE.Group();
    this.group.position.copy(position);
    this.parts = {};
    this.restPose = null;
    this.animations = {};
    this.activeAnim = null;
    this.animStart = 0;
    this.firedEffects = new Set();
    this.cape = null;
    this.eyeMaterial = null;
    scene.add(this.group);
  }
  captureRestPose() {
    this.restPose = {};
    for (const name in this.parts) {
      const p = this.parts[name];
      this.restPose[name] = {
        px: p.position.x, py: p.position.y, pz: p.position.z,
        rx: p.rotation.x, ry: p.rotation.y, rz: p.rotation.z,
      };
    }
  }
  playAnimation(name, time, manager) {
    if (!this.animations[name]) return;
    this.activeAnim = name;
    this.animStart = time;
    this.animManager = manager;
    this.firedEffects.clear();
  }
  isPlaying() { return !!this.activeAnim; }
  stopAnimation() { this.activeAnim = null; this.resetPose(); }
  resetPose() {
    for (const name in this.parts) {
      const rest = this.restPose[name];
      const p = this.parts[name];
      p.position.set(rest.px, rest.py, rest.pz);
      p.rotation.set(rest.rx, rest.ry, rest.rz);
    }
  }
  applyKeyframes(keyframes, t01) {
    let prev = keyframes[0];
    let next = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (keyframes[i].t <= t01 && keyframes[i + 1].t >= t01) {
        prev = keyframes[i]; next = keyframes[i + 1]; break;
      }
    }
    const range = next.t - prev.t;
    const local = range > 0 ? (t01 - prev.t) / range : 0;
    const easedFn = next.ease || ease.inOut;
    const eased = easedFn(local);
    const partNames = new Set([...Object.keys(prev.values || {}), ...Object.keys(next.values || {})]);
    for (const name of partNames) {
      const part = this.parts[name];
      if (!part) continue;
      const rest = this.restPose[name];
      const a = (prev.values || {})[name] || {};
      const b = (next.values || {})[name] || {};
      ['x','y','z'].forEach(axis => {
        const pkey = 'p' + axis, rkey = 'r' + axis;
        if (pkey in a || pkey in b) part.position[axis] = rest[pkey] + lerp(a[pkey] ?? 0, b[pkey] ?? 0, eased);
        if (rkey in a || rkey in b) part.rotation[axis] = rest[rkey] + lerp(a[rkey] ?? 0, b[rkey] ?? 0, eased);
      });
    }
  }
  update(time, dt) {
    const breathe = Math.sin(time * 1.2 + this.group.position.x) * 0.006;
    this.group.scale.y = 1 + breathe;
    if (this.cape) {
      const pos = this.cape.geometry.attributes.position;
      const orig = this.cape.userData.original;
      const cols = this.cape.userData.cols;
      const rows = this.cape.userData.rows;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const u = col / (cols - 1);
        const v = row / (rows - 1);
        const wave = Math.sin(time * 0.9 + u * 3 + v * 5) * 0.025 * v;
        const sway = Math.sin(time * 0.6 + v * 2) * 0.02 * v;
        pos.array[ix + 0] = orig[ix + 0] + sway;
        pos.array[ix + 2] = orig[ix + 2] + wave;
      }
      pos.needsUpdate = true;
      this.cape.geometry.computeVertexNormals();
    }
    if (this.eyeMaterial) {
      const base = this.eyeMaterial.userData.baseIntensity || 5;
      this.eyeMaterial.emissiveIntensity = base + Math.sin(time * 2.5) * 1.0;
    }
    if (this.activeAnim) {
      const anim = this.animations[this.activeAnim];
      const elapsed = time - this.animStart;
      const t01 = Math.min(1, elapsed / anim.duration);
      this.resetPose();
      this.applyKeyframes(anim.keyframes, t01);
      if (anim.effects) {
        for (let i = 0; i < anim.effects.length; i++) {
          const fx = anim.effects[i];
          if (t01 >= fx.time && !this.firedEffects.has(i)) {
            this.firedEffects.add(i);
            fx.fn(this, this.animManager, time);
          }
        }
      }
      if (t01 >= 1) { this.activeAnim = null; this.resetPose(); }
    }
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  BARD — Mystic I/VI                                                      ║
// ║  Buff Songs · Inspiring Presence · Burgundy doublet with cream sleeves, ║
// ║  ★ long lute held across body ★, plumed troubadour hat, flowing rose-  ║
// ║  scarf cape, ★ floating music-notes orbiting head ★, rose-gold glow    ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Bard extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = bardAnimations;
  }

  // Override update — orbit the music notes around the head
  update(time, dt) {
    super.update(time, dt);
    if (this.musicNotes) {
      this.musicNotes.rotation.y = time * 0.4;
      // Each note bobs vertically
      this.musicNotes.children.forEach((n, i) => {
        n.position.y = n.userData.baseY + Math.sin(time * 1.3 + i * 0.8) * 0.025;
      });
    }
  }

  build() {
    const root = this.group;

    // Legs — burgundy breeches with cream stocking-lines
    const buildBardLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.55, 14), M.bardBurgundy);
      thigh.position.y = 0.95; leg.add(thigh);
      const knee = mesh(new THREE.SphereGeometry(0.115, 12, 8), M.bardBurgundyHi);
      knee.position.y = 0.66; knee.scale.set(1.05, 0.6, 1.1); leg.add(knee);
      // Cream stocking-shin
      const shin = mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.5, 14), M.bardCream);
      shin.position.y = 0.36; leg.add(shin);
      // Brass buckle on the side
      const trim = mesh(new THREE.TorusGeometry(0.13, 0.012, 8, 16), M.bardBrass);
      trim.rotation.x = Math.PI / 2; trim.position.y = 0.6;
      leg.add(trim);
      // Boot — burgundy with brass cuff
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.bardBurgundy);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      const bootCuff = mesh(new THREE.CylinderGeometry(0.14, 0.135, 0.04, 14), M.bardBrass);
      bootCuff.position.y = 0.18; leg.add(bootCuff);
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.08, 0.1), M.bardBurgundyHi);
      toe.position.set(0, 0.06, 0.21); toe.rotation.x = -0.18;
      leg.add(toe);
      const bootBuckle = mesh(new THREE.BoxGeometry(0.04, 0.025, 0.018), M.bardBrassHi);
      bootBuckle.position.set(0, 0.13, 0.22); leg.add(bootBuckle);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildBardLeg(-1));
    root.add(buildBardLeg(1));

    // Pelvis — brass belt with hanging pouch + lute strap loop
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.16, 16), M.bardBurgundy));
    const belt = mesh(new THREE.CylinderGeometry(0.295, 0.295, 0.1, 18), M.bardBrass);
    belt.position.y = 0.04; pelvis.add(belt);
    // Brass treble-clef-ish buckle
    const buckle = mesh(new THREE.SphereGeometry(0.04, 14, 10), M.bardBrassHi);
    buckle.position.set(0, 0.04, 0.31); buckle.scale.set(1.0, 1.4, 0.5);
    pelvis.add(buckle);
    // Coin pouch on right hip
    const pouch = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.bardBurgundyHi);
    pouch.position.set(0.28, -0.06, 0.16); pouch.scale.set(0.9, 1.2, 0.7);
    pelvis.add(pouch);
    // Hanging coins
    for (let i = -1; i <= 1; i++) {
      const coin = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.005, 8), M.bardBrassHi);
      coin.position.set(0.28 + i * 0.018, -0.13, 0.18); coin.rotation.x = Math.PI / 2;
      pelvis.add(coin);
    }
    // Lute strap loop on left hip
    const strapLoop = mesh(new THREE.TorusGeometry(0.04, 0.008, 6, 14), M.bardCream);
    strapLoop.position.set(-0.28, 0.0, 0.18); strapLoop.rotation.x = Math.PI / 2;
    pelvis.add(strapLoop);
    root.add(pelvis);

    // TORSO — burgundy doublet with cream chest panel
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const doublet = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.bardBurgundy);
    doublet.scale.set(1.0, 1, 0.85);
    torso.add(doublet);
    // Cream front panel
    const frontPanel = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.55, 16, 1, false, -Math.PI / 2.3, Math.PI * 1.25), M.bardCream);
    frontPanel.scale.set(1.05, 1, 0.85);
    frontPanel.position.y = 0.04;
    torso.add(frontPanel);
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.bardBurgundyHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);
    // Brass-button row down the cream front
    for (let i = 0; i < 5; i++) {
      const button = mesh(new THREE.SphereGeometry(0.016, 10, 8), M.bardBrassHi);
      button.position.set(0, 0.2 - i * 0.1, 0.39); button.scale.set(1, 1, 0.5);
      torso.add(button);
    }

    // ROSE-SCARF CAPE — wrapped diagonally across chest (the bard's signature)
    const scarf = mesh(new THREE.BoxGeometry(0.12, 0.55, 0.022), M.bardScarf);
    scarf.position.set(-0.04, 0.0, 0.36); scarf.rotation.z = 0.4;
    torso.add(scarf);
    // Scarf gold trim
    for (let side = -1; side <= 1; side += 2) {
      const scarfTrim = mesh(new THREE.BoxGeometry(0.005, 0.55, 0.024), M.bardBrassHi);
      scarfTrim.position.set(-0.04 + side * 0.06, 0.0, 0.37); scarfTrim.rotation.z = 0.4;
      torso.add(scarfTrim);
    }
    // Scarf knot at right hip
    const scarfKnot = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.bardScarf);
    scarfKnot.position.set(0.18, -0.22, 0.38); scarfKnot.scale.set(1.3, 0.8, 0.7);
    torso.add(scarfKnot);
    // Long scarf tails hanging from knot
    for (let i = -1; i <= 1; i += 2) {
      const tail = mesh(new THREE.BoxGeometry(0.07, 0.32, 0.018), M.bardScarf);
      tail.position.set(0.18 + i * 0.04, -0.4, 0.38); tail.rotation.z = i * 0.18;
      torso.add(tail);
    }

    // CHEST EMBLEM — musical note (the marquee Bard symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.bardBurgundyHi);
    emblemBack.position.set(0.05, 0.22, 0.41); torso.add(emblemBack);
    // Note head (filled circle)
    const noteHead = mesh(new THREE.SphereGeometry(0.024, 14, 12), M.bardNote);
    noteHead.position.set(0.04, 0.2, 0.42); noteHead.scale.set(1.0, 0.7, 0.5);
    torso.add(noteHead);
    // Note stem
    const noteStem = mesh(new THREE.BoxGeometry(0.005, 0.07, 0.005), M.bardNote);
    noteStem.position.set(0.06, 0.24, 0.42);
    torso.add(noteStem);
    // Note flag
    const noteFlag = mesh(new THREE.BoxGeometry(0.025, 0.018, 0.005), M.bardNote);
    noteFlag.position.set(0.075, 0.27, 0.42); noteFlag.rotation.z = 0.5;
    torso.add(noteFlag);
    // Curved gold flourish around the note (treble-clef-ish swirl)
    const flourish = mesh(new THREE.TorusGeometry(0.05, 0.005, 6, 14, Math.PI * 1.2), M.bardBrassHi);
    flourish.position.set(0.05, 0.22, 0.42); flourish.rotation.z = -0.4;
    torso.add(flourish);

    // High collar — cream with gold trim (popped-up musketeer style)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.bardCream);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18, Math.PI * 1.2), M.bardBrassHi);
    collarTrim.rotation.x = Math.PI / 2;
    collarTrim.rotation.y = -Math.PI / 2;
    collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // PUFFED CREAM SLEEVES at shoulders (musketeer/bard signature)
    for (let side = -1; side <= 1; side += 2) {
      const puffSleeve = mesh(new THREE.SphereGeometry(0.18, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.6), M.bardCream);
      puffSleeve.scale.set(1.15, 0.95, 1.1);
      puffSleeve.position.set(side * 0.42, 2.18, 0);
      root.add(puffSleeve);
      // Brass shoulder cap
      const shoulderCap = mesh(new THREE.SphereGeometry(0.13, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2.2), M.bardBrass);
      shoulderCap.position.set(side * 0.42, 2.27, 0); shoulderCap.scale.set(1, 0.5, 1);
      root.add(shoulderCap);
      const capBtn = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.bardBrassHi);
      capBtn.position.set(side * 0.42, 2.32, 0);
      root.add(capBtn);
    }

    // ARMS — burgundy + cream
    const armPalette = { cloth: M.bardBurgundy, mid: M.bardCream, dark: M.bardBurgundyHi, hi: M.bardBrass, accent: M.bardBrassHi };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Lace cuffs at wrists (cream)
    [leftArm, rightArm].forEach(arm => {
      const lace = mesh(new THREE.CylinderGeometry(0.115, 0.092, 0.08, 14), M.bardCream);
      lace.position.y = -0.84; arm.add(lace);
      const cuff = mesh(new THREE.CylinderGeometry(0.092, 0.092, 0.04, 14), M.bardBrass);
      cuff.position.y = -0.78; arm.add(cuff);
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2;
        const btn = mesh(new THREE.SphereGeometry(0.01, 8, 6), M.bardBrassHi);
        btn.position.set(Math.cos(a) * 0.092, -0.78, Math.sin(a) * 0.092);
        arm.add(btn);
      }
    });

    // LUTE — held across body, both hands suggested holding it
    const lute = this._buildLute();
    rightArm.userData.hand.add(lute);
    lute.position.set(0, 0.04, 0.06);
    lute.rotation.set(Math.PI * 0.3, 0, 0);
    this.parts.weapon = lute;

    // Half-cape (rose-pink) flowing from one shoulder
    const cape = buildCape({ material: M.bardScarf, width: 1.2, height: 1.6 });
    cape.position.set(0.2, 2.36, -0.04);
    root.add(cape);
    this.cape = cape;

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — plumed troubadour hat + clean-shaven minstrel face
    const head = this._buildBardHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    // ===== FLOATING MUSIC NOTES — orbiting the bard's head =====
    this.musicNotes = new THREE.Group();
    this.musicNotes.position.set(0, 2.85, 0);
    const noteCount = 4;
    for (let i = 0; i < noteCount; i++) {
      const a = (i / noteCount) * Math.PI * 2;
      const noteGroup = new THREE.Group();
      noteGroup.position.set(Math.cos(a) * 0.42, 0, Math.sin(a) * 0.42);
      noteGroup.userData.baseY = 0;
      // Note head
      const nh = mesh(new THREE.SphereGeometry(0.022, 12, 10), M.bardNote);
      nh.scale.set(1.0, 0.7, 0.5);
      noteGroup.add(nh);
      // Note stem
      const ns = mesh(new THREE.BoxGeometry(0.005, 0.06, 0.005), M.bardNote);
      ns.position.set(0.018, 0.04, 0);
      noteGroup.add(ns);
      // Note flag (every other note)
      if (i % 2 === 0) {
        const nf = mesh(new THREE.BoxGeometry(0.022, 0.014, 0.005), M.bardNote);
        nf.position.set(0.03, 0.07, 0); nf.rotation.z = 0.5;
        noteGroup.add(nf);
      }
      this.musicNotes.add(noteGroup);
    }
    root.add(this.musicNotes);

    M.bardEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.bardEye;
  }

  _buildLute() {
    const lute = new THREE.Group();
    // Pear-shaped body (large rounded sphere flattened)
    const body = mesh(new THREE.SphereGeometry(0.16, 16, 12), M.bardWood);
    body.scale.set(1.0, 1.4, 0.5);
    lute.add(body);
    // Body's lighter rim
    const bodyRim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 24), M.bardBrass);
    bodyRim.scale.set(1, 1.4, 0.6);
    lute.add(bodyRim);
    // Sound hole (decorated circle on the front of the body)
    const soundHole = mesh(new THREE.CircleGeometry(0.04, 16), M.bardBurgundyHi);
    soundHole.position.set(0, 0.0, 0.085);
    lute.add(soundHole);
    // Decorative gold ring around the sound hole
    const soundRing = mesh(new THREE.TorusGeometry(0.045, 0.005, 8, 18), M.bardBrassHi);
    soundRing.position.set(0, 0.0, 0.09);
    lute.add(soundRing);
    // 4 strings across the front of the body
    for (let i = -1; i <= 2; i++) {
      const string = mesh(new THREE.CylinderGeometry(0.001, 0.001, 0.5, 4), M.bardBrassHi);
      string.position.set(i * 0.012, 0.05, 0.092);
      lute.add(string);
    }
    // NECK — long thin extension
    const neck = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.55, 10), M.bardWood);
    neck.position.y = 0.45; lute.add(neck);
    // Frets on the neck (small metal bands)
    for (let i = 0; i < 6; i++) {
      const fret = mesh(new THREE.TorusGeometry(0.024, 0.002, 4, 10), M.bardBrassHi);
      fret.rotation.x = Math.PI / 2;
      fret.position.y = 0.25 + i * 0.08;
      lute.add(fret);
    }
    // 4 strings continuing along the neck
    for (let i = -1; i <= 2; i++) {
      const string = mesh(new THREE.CylinderGeometry(0.0008, 0.0008, 0.55, 4), M.bardBrassHi);
      string.position.set(i * 0.008, 0.45, 0.024);
      lute.add(string);
    }
    // PEG HEAD at the top (with tuning pegs)
    const pegHead = mesh(new THREE.BoxGeometry(0.06, 0.08, 0.04), M.bardWood);
    pegHead.position.y = 0.78; pegHead.rotation.x = -0.4;
    lute.add(pegHead);
    // Brass pegs (4)
    for (let i = 0; i < 4; i++) {
      const peg = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.025, 6), M.bardBrassHi);
      peg.position.set(-0.018 + i * 0.012, 0.78, 0.025); peg.rotation.x = Math.PI / 2;
      lute.add(peg);
    }
    // Decorative tassel hanging from the body
    const tasselString = mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.06, 4), M.bardCream);
    tasselString.position.set(0.12, -0.18, 0.01);
    lute.add(tasselString);
    const tassel = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.bardScarf);
    tassel.position.set(0.12, -0.23, 0.01);
    lute.add(tassel);
    return lute;
  }

  _buildBardHead() {
    const head = new THREE.Group();

    // Hair — wavy brown
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.bardBurgundyHi);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // Face skin
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Wavy side hair
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.SphereGeometry(0.1, 12, 10), M.bardBurgundyHi);
      sideHair.position.set(side * 0.18, -0.05, 0.0); sideHair.scale.set(0.7, 1.2, 0.8);
      head.add(sideHair);
    }

    // Eyes — rose-gold glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.bardEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Brows
    for (let side = -1; side <= 1; side += 2) {
      const brow = mesh(new THREE.BoxGeometry(0.04, 0.008, 0.005), M.bardBurgundyHi);
      brow.position.set(side * 0.075, 0.025, 0.21); brow.rotation.z = side * 0.15;
      head.add(brow);
    }

    // Nose
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Confident smile
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); mouth.rotation.z = 0.12;
    head.add(mouth);

    // ===== PLUMED TROUBADOUR HAT =====
    // Brim
    const brim = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.024, 18), M.bardBurgundy);
    brim.position.y = 0.13; head.add(brim);
    // Brass trim
    const brimTrim = mesh(new THREE.TorusGeometry(0.3, 0.012, 8, 24), M.bardBrassHi);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.118;
    head.add(brimTrim);
    // Hat dome (round, like a beret-style cap)
    const hatDome = mesh(new THREE.SphereGeometry(0.21, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.7), M.bardBurgundy);
    hatDome.position.y = 0.18; hatDome.scale.set(1, 0.85, 1);
    head.add(hatDome);
    // Hat band (cream)
    const hatBand = mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.045, 16), M.bardCream);
    hatBand.position.y = 0.18; head.add(hatBand);
    // Brass buckle on the band (front)
    const hatBuckle = mesh(new THREE.BoxGeometry(0.07, 0.04, 0.018), M.bardBrassHi);
    hatBuckle.position.set(0, 0.18, 0.215); head.add(hatBuckle);
    // FEATHER PLUME extending out the side (the marquee feature)
    const plumeBase = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.bardBrass);
    plumeBase.position.set(-0.15, 0.22, 0.05); head.add(plumeBase);
    // Long feather (rose-colored)
    const plumeShape = new THREE.Shape();
    plumeShape.moveTo(-0.022, 0); plumeShape.lineTo(0.022, 0);
    plumeShape.bezierCurveTo(0.04, 0.1, 0.025, 0.32, 0, 0.45);
    plumeShape.bezierCurveTo(-0.025, 0.32, -0.04, 0.1, -0.022, 0);
    plumeShape.closePath();
    const plume = mesh(new THREE.ExtrudeGeometry(plumeShape, { depth: 0.005, bevelEnabled: false }), M.bardScarf);
    plume.position.set(-0.15, 0.22, 0.05); plume.rotation.z = 0.6;
    head.add(plume);
    // Plume rachis (gold central spine)
    const plumeRachis = mesh(new THREE.BoxGeometry(0.005, 0.45, 0.005), M.bardBrassHi);
    plumeRachis.position.set(-0.32, 0.4, 0.06); plumeRachis.rotation.z = 0.6;
    head.add(plumeRachis);

    return head;
  }
}

  spell2: {

      { t: 0.78, values: { rightArm: { rx: 1.0, rz: -0.45 }, leftArm: { rx: 1.0, rz: 0.45 }, body: { rx: -0.12 } }},
      { t: 1.0,  values: {}, ease: ease.inOut },

    effects: [

        // Big rose-gold heal aura

        mgr.spawn(new ShockwaveRing(champ.scene, pos, { color: 0xffb088, maxRadius: 3.0, duration: 0.85 }), time);

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  WITCH — Mystic II/VI                                                    ║
// ║  Curses · Hexes · Cackling · Mossy purple robes, ★ crooked black       ║
// ║  pointed hat with bent tip ★, ★ gnarled hex-staff with murky-green orb║
// ║  ★, cauldron pouch + bubbling vials, perched raven, murky-green glow   ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Witch extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = witchAnimations;
  }

  // Override update — bubble the cauldron pouches + sway the perched raven
  update(time, dt) {
    super.update(time, dt);
    if (this.cauldronBubbles) {
      this.cauldronBubbles.forEach((b, i) => {
        b.scale.y = 1 + Math.sin(time * 2.4 + i * 0.7) * 0.08;
      });
    }
    if (this.raven) {
      this.raven.rotation.y = Math.sin(time * 0.8) * 0.4;
    }
  }

  build() {
    const root = this.group;

    // Legs — purple robes
    const buildWitchLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.witchPurple);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.witchPurpleHi);
      shin.position.y = 0.36; leg.add(shin);
      // Black trim band
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.witchBlack);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // Ragged hem (hex-rune sigils + jagged points)
      for (let i = -1; i <= 1; i++) {
        const point = mesh(new THREE.ConeGeometry(0.025, 0.08, 4), M.witchPurple);
        point.position.set(i * 0.07, 0.16, 0.22);
        point.rotation.x = Math.PI;
        leg.add(point);
      }
      // Black slipper
      const sole = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.32), M.witchBlack);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      // Curl-toed witch shoe (small upturned toe — distinct from Trickster's bell-toe)
      const toeCurl = mesh(new THREE.ConeGeometry(0.028, 0.08, 6), M.witchBlackHi);
      toeCurl.position.set(0, 0.13, 0.21); toeCurl.rotation.x = -0.4;
      leg.add(toeCurl);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildWitchLeg(-1));
    root.add(buildWitchLeg(1));

    // Pelvis — black belt with hanging cauldron pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.witchBlack));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.witchBlackHi);
    belt.position.y = 0.04; pelvis.add(belt);
    // Silver hex-buckle (5-pointed pentacle)
    const buckleBack = mesh(new THREE.CircleGeometry(0.04, 16), M.witchSilver);
    buckleBack.position.set(0, 0.04, 0.32); pelvis.add(buckleBack);
    // 5 pentacle points
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const point = mesh(new THREE.ConeGeometry(0.008, 0.025, 4), M.witchHex);
      point.position.set(Math.cos(a) * 0.025, 0.04 + Math.sin(a) * 0.025, 0.34);
      point.rotation.z = a - Math.PI / 2;
      pelvis.add(point);
    }
    // CAULDRON POUCHES (3 across — the marquee accessory)
    this.cauldronBubbles = [];
    for (let i = -1; i <= 1; i++) {
      // Cauldron body (black)
      const cauldron = mesh(new THREE.CylinderGeometry(0.025, 0.022, 0.05, 10), M.witchBlack);
      cauldron.position.set(i * 0.15, -0.08, 0.18);
      pelvis.add(cauldron);
      // Cauldron rim
      const cauldronRim = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.witchBlackHi);
      cauldronRim.rotation.x = Math.PI / 2; cauldronRim.position.set(i * 0.15, -0.06, 0.18);
      pelvis.add(cauldronRim);
      // Bubbling green liquid
      const bubble = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.witchHex);
      bubble.position.set(i * 0.15, -0.05, 0.18); bubble.scale.set(1, 0.6, 1);
      pelvis.add(bubble);
      this.cauldronBubbles.push(bubble);
    }
    // Robe drape continues
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.witchPurple);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    // Ragged jagged hem (witch tatter)
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const tatter = mesh(new THREE.ConeGeometry(0.025, 0.08 + Math.random() * 0.05, 4), M.witchPurple);
      tatter.position.set(Math.cos(a) * 0.4, -0.45, Math.sin(a) * 0.4);
      tatter.rotation.x = Math.PI;
      tatter.rotation.z = (Math.random() - 0.5) * 0.3;
      pelvis.add(tatter);
    }
    root.add(pelvis);

    // TORSO — purple robes with black trim
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.witchPurple);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);
    // Vertical black stripe
    const robeStripe = mesh(new THREE.BoxGeometry(0.13, 0.65, 0.018), M.witchBlackHi);
    robeStripe.position.set(0, 0.0, 0.36); torso.add(robeStripe);
    for (let side = -1; side <= 1; side += 2) {
      const sideStripe = mesh(new THREE.BoxGeometry(0.012, 0.65, 0.022), M.witchHex);
      sideStripe.position.set(side * 0.067, 0.0, 0.37);
      torso.add(sideStripe);
    }
    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.witchPurpleHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — pentacle (5-pointed star within a circle)
    const emblemBack = mesh(new THREE.CircleGeometry(0.075, 16), M.witchBlackHi);
    emblemBack.position.set(0, 0.22, 0.41); torso.add(emblemBack);
    // Outer ring
    const pentaRing = mesh(new THREE.TorusGeometry(0.07, 0.008, 8, 18), M.witchHex);
    pentaRing.position.set(0, 0.22, 0.42); torso.add(pentaRing);
    // Pentacle (5-pointed star — drawn as 5 triangular points connected)
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const point = mesh(new THREE.ConeGeometry(0.012, 0.05, 4), M.witchHex);
      point.position.set(Math.cos(a) * 0.04, 0.22 + Math.sin(a) * 0.04, 0.42);
      point.rotation.z = a - Math.PI / 2;
      torso.add(point);
    }
    // Center hex-rune dot
    const emblemRune = mesh(new THREE.SphereGeometry(0.014, 10, 8), M.witchHex);
    emblemRune.position.set(0, 0.22, 0.43);
    torso.add(emblemRune);

    // Hex-rune sigils flanking
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.012, 0.018, 0.005), M.witchHex);
        sigil.position.set(side * 0.18, 0.12 - i * 0.1, 0.36);
        sigil.rotation.z = i * 0.3;
        torso.add(sigil);
      }
    }

    // Collar (raised)
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.16, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.witchBlackHi);
    collar.position.y = 0.42; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // Shoulder caps
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.16, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.witchPurpleHi);
      cap.scale.set(1.05, 0.7, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      const capTrim = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.witchBlackHi);
      capTrim.rotation.x = Math.PI / 2; capTrim.position.set(side * 0.42, 2.13, 0);
      root.add(capTrim);
    }

    // PERCHED RAVEN on left shoulder (the marquee living-detail feature)
    this.raven = this._buildRaven();
    this.raven.position.set(-0.42, 2.32, 0);
    root.add(this.raven);

    // Arms
    const armPalette = { cloth: M.witchPurple, mid: M.witchPurpleHi, dark: M.witchBlack, hi: M.witchSilver, accent: M.witchHex };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Wide black-trim sleeves with bone-claw fingers
    [leftArm, rightArm].forEach(arm => {
      const sleeve = mesh(new THREE.CylinderGeometry(0.092, 0.16, 0.18, 14), M.witchPurple);
      sleeve.position.y = -0.82; arm.add(sleeve);
      const hemTrim3 = mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 16), M.witchBlackHi);
      hemTrim3.rotation.x = Math.PI / 2; hemTrim3.position.y = -0.91;
      arm.add(hemTrim3);
      // Hex-rune sigils on sleeve hem
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const sigil = mesh(new THREE.BoxGeometry(0.014, 0.018, 0.005), M.witchHex);
        sigil.position.set(Math.cos(a) * 0.16, -0.96, Math.sin(a) * 0.16);
        sigil.lookAt(Math.cos(a) * 2, -0.96, Math.sin(a) * 2);
        arm.add(sigil);
      }
      // Bone-claw fingertips
      for (let i = 0; i < 4; i++) {
        const claw = mesh(new THREE.ConeGeometry(0.01, 0.04, 4), M.witchSilver);
        claw.position.set((i - 1.5) * 0.025, -1.0, 0.04);
        claw.rotation.x = Math.PI;
        arm.add(claw);
      }
    });

    // GNARLED HEX-STAFF
    const staff = this._buildHexStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // Tattered black cape
    const cape = buildCape({ material: M.witchBlackHi, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;
    // Hex-rune fringes on cape hem
    for (let i = -2; i <= 2; i++) {
      const sigil = mesh(new THREE.ConeGeometry(0.022, 0.08, 4), M.witchHex);
      sigil.position.set(i * 0.18, 0.5, -0.13);
      sigil.rotation.x = Math.PI;
      root.add(sigil);
    }

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skinPale);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — crooked witch hat
    const head = this._buildWitchHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.witchEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.witchEye;
  }

  _buildRaven() {
    const raven = new THREE.Group();
    // Body
    const body = mesh(new THREE.SphereGeometry(0.07, 14, 10), M.witchBlack);
    body.position.y = 0.0; body.scale.set(0.9, 1.1, 1.4);
    raven.add(body);
    // Head
    const head = mesh(new THREE.SphereGeometry(0.045, 12, 10), M.witchBlackHi);
    head.position.set(0, 0.085, 0.07);
    raven.add(head);
    // Beak (long pointed)
    const beak = mesh(new THREE.ConeGeometry(0.012, 0.05, 6), M.witchSilver);
    beak.position.set(0, 0.075, 0.115); beak.rotation.x = Math.PI / 2;
    head.add(beak);
    // Glowing green eyes
    const eyeL = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.witchHex);
    eyeL.position.set(-0.018, 0.012, 0.04); raven.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.018; raven.add(eyeR);
    // Folded wings
    for (let side = -1; side <= 1; side += 2) {
      const wing = mesh(new THREE.SphereGeometry(0.05, 12, 8), M.witchBlack);
      wing.position.set(side * 0.05, 0.0, -0.02); wing.scale.set(0.7, 0.95, 1.5);
      raven.add(wing);
      const wingTip = mesh(new THREE.ConeGeometry(0.014, 0.06, 5), M.witchBlackHi);
      wingTip.position.set(side * 0.06, -0.04, -0.07);
      wingTip.rotation.x = Math.PI;
      raven.add(wingTip);
    }
    // Tail feathers (fan)
    for (let i = -1; i <= 1; i++) {
      const tail = mesh(new THREE.BoxGeometry(0.012, 0.005, 0.07), M.witchBlackHi);
      tail.position.set(i * 0.014, -0.02, -0.09); tail.rotation.y = i * 0.2;
      raven.add(tail);
    }
    // Talons
    for (let side = -1; side <= 1; side += 2) {
      const talon = mesh(new THREE.CylinderGeometry(0.012, 0.008, 0.04, 6), M.witchSilver);
      talon.position.set(side * 0.025, -0.06, 0.0);
      raven.add(talon);
    }
    return raven;
  }

  _buildHexStaff() {
    const staff = new THREE.Group();
    // Pommel — gnarled bone
    const pommel = mesh(new THREE.SphereGeometry(0.03, 10, 8), M.witchSilver);
    pommel.scale.set(1, 0.8, 1.2);
    staff.add(pommel);
    // GNARLED HAFT — rough/bumpy wood (suggested with knotted spheres along the way)
    const haft = mesh(new THREE.CylinderGeometry(0.024, 0.028, 1.3, 12), M.witchBlackHi);
    haft.position.y = 0.7; staff.add(haft);
    // Knot bumps along the haft (gnarled witch-staff look)
    for (let i = 0; i < 4; i++) {
      const knot = mesh(new THREE.SphereGeometry(0.038, 10, 8), M.witchBlackHi);
      knot.position.y = 0.25 + i * 0.28;
      knot.scale.set(1.2, 0.7, 1.2);
      staff.add(knot);
    }
    // Tied bone-charm hanging from mid-haft
    const charmCord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.08, 4), M.witchSilver);
    charmCord.position.set(0.04, 0.74, 0); charmCord.rotation.z = 0.3;
    staff.add(charmCord);
    const charmBone = mesh(new THREE.ConeGeometry(0.014, 0.05, 5), M.witchSilver);
    charmBone.position.set(0.07, 0.66, 0); charmBone.rotation.x = Math.PI;
    staff.add(charmBone);
    // Top section — twisted claws cradling the orb
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      // Claw: 2 segments to suggest twist
      const claw1 = mesh(new THREE.CylinderGeometry(0.012, 0.008, 0.1, 6), M.witchBlackHi);
      claw1.position.set(Math.cos(a) * 0.04, 1.4, Math.sin(a) * 0.04);
      claw1.rotation.z = -Math.cos(a) * 0.4;
      claw1.rotation.x = -Math.sin(a) * 0.4;
      staff.add(claw1);
      const claw2 = mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.1, 6), M.witchBlackHi);
      claw2.position.set(Math.cos(a) * 0.06, 1.5, Math.sin(a) * 0.06);
      claw2.rotation.z = -Math.cos(a) * 0.7;
      claw2.rotation.x = -Math.sin(a) * 0.7;
      staff.add(claw2);
    }
    // ===== HEX ORB at the top =====
    const orb = mesh(new THREE.SphereGeometry(0.075, 16, 14), M.witchHex);
    orb.position.y = 1.55; staff.add(orb);
    // Inner core
    const orbCore = mesh(new THREE.SphereGeometry(0.035, 12, 10), M.witchSilver);
    orbCore.position.y = 1.55; staff.add(orbCore);
    // Pentacle markings on the orb (5 small cones radiating outward)
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const ray = mesh(new THREE.ConeGeometry(0.014, 0.05, 4), M.witchHex);
      ray.position.set(Math.cos(a) * 0.085, 1.55 + Math.sin(a) * 0.085, 0);
      ray.rotation.z = a - Math.PI / 2;
      staff.add(ray);
    }
    return staff;
  }

  _buildWitchHead() {
    const head = new THREE.Group();
    // Pale gaunt face
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinPale);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.92, 1.0, 0.95);
    head.add(face);

    // Long stringy black hair
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.witchBlackHi);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);
    const backHair = mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.witchBlackHi);
    backHair.scale.set(1.05, 1.5, 1.1);
    backHair.position.set(0, -0.05, -0.05);
    head.add(backHair);
    // Side hair tassels
    for (let side = -1; side <= 1; side += 2) {
      const sideHair = mesh(new THREE.CylinderGeometry(0.024, 0.018, 0.22, 8), M.witchBlackHi);
      sideHair.position.set(side * 0.18, -0.1, 0.03); sideHair.rotation.z = side * 0.1;
      head.add(sideHair);
    }

    // Eyes — murky-green hex glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.022, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.witchEye);
    eyeL.position.set(-0.075, -0.02, 0.21); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Crooked nose (witch's hooked nose)
    const nose = mesh(new THREE.ConeGeometry(0.022, 0.08, 6), M.skinPale);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2 + 0.2;
    head.add(nose);
    // Wart on nose (witchy detail)
    const wart = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.witchPurpleHi);
    wart.position.set(0.014, -0.085, 0.232);
    head.add(wart);

    // Cackle grin
    const mouth = mesh(new THREE.BoxGeometry(0.07, 0.01, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); mouth.rotation.z = 0.15;
    head.add(mouth);
    // Visible single tooth
    const tooth = mesh(new THREE.BoxGeometry(0.006, 0.015, 0.005), M.witchSilver);
    tooth.position.set(0.015, -0.135, 0.225);
    head.add(tooth);

    // ===== CROOKED POINTED WITCH HAT (the marquee feature) =====
    // Wide brim
    const brim = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.025, 22), M.witchBlack);
    brim.position.y = 0.13; head.add(brim);
    // Brim trim (silver)
    const brimTrim = mesh(new THREE.TorusGeometry(0.36, 0.012, 8, 28), M.witchSilver);
    brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.118;
    head.add(brimTrim);
    // Hat body — first segment (straight cone)
    const hatBase = mesh(new THREE.ConeGeometry(0.22, 0.4, 14), M.witchBlack);
    hatBase.position.y = 0.34; head.add(hatBase);
    // Second segment (BENT — angled to one side, the witch hat's signature crook)
    const hatBent = mesh(new THREE.ConeGeometry(0.13, 0.4, 14), M.witchBlackHi);
    hatBent.position.set(0.12, 0.6, -0.04); hatBent.rotation.z = -0.5;
    head.add(hatBent);
    // Third segment (curl at the very tip)
    const hatTip = mesh(new THREE.ConeGeometry(0.05, 0.18, 10), M.witchBlack);
    hatTip.position.set(0.28, 0.74, -0.06); hatTip.rotation.z = -0.9;
    head.add(hatTip);
    // Tip pompom (hex orb at the very end)
    const tipPompom = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.witchHex);
    tipPompom.position.set(0.36, 0.78, -0.06);
    head.add(tipPompom);
    // Hat band (silver)
    const hatBand = mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.045, 16), M.witchSilver);
    hatBand.position.y = 0.18; head.add(hatBand);
    // Pentacle decoration on the hat band (front)
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
      const point = mesh(new THREE.ConeGeometry(0.005, 0.018, 4), M.witchHex);
      point.position.set(Math.cos(a) * 0.018, 0.18 + Math.sin(a) * 0.018, 0.225);
      point.rotation.z = a - Math.PI / 2;
      head.add(point);
    }
    // Loose strands escaping from under the brim (spider web vibe)
    for (let side = -1; side <= 1; side += 2) {
      const strand = mesh(new THREE.CylinderGeometry(0.005, 0.003, 0.18, 4), M.witchBlackHi);
      strand.position.set(side * 0.16, 0.05, 0.05); strand.rotation.z = side * 0.5;
      head.add(strand);
    }

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SHAMAN — Mystic III/VI                                                  ║
// ║  Totems · Spirit Link · Ochre robes with bone-fragment trim, ★ animal- ║
// ║  skull mask ★, ★ tall bone-feather headdress ★, ★ totem-pole staff ★,  ║
// ║  spirit-feather shoulder mantle, earth-ochre eye glow                  ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Shaman extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = shamanAnimations;
  }

  build() {
    const root = this.group;

    // Legs — ochre robes with bone-rib leg trim
    const buildShamLeg = (sx) => {
      const leg = new THREE.Group();
      const thigh = mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.55, 14), M.shamOchre);
      thigh.position.y = 0.95; leg.add(thigh);
      const shin = mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.5, 14), M.shamOchreHi);
      shin.position.y = 0.36; leg.add(shin);
      // Bone-fragment trim on the hem
      const hemTrim = mesh(new THREE.TorusGeometry(0.24, 0.014, 8, 18), M.shamOchreDark);
      hemTrim.rotation.x = Math.PI / 2; hemTrim.position.y = 0.12;
      leg.add(hemTrim);
      // 3 bone-fragment ornaments around the hem
      for (let i = -1; i <= 1; i++) {
        const bone = mesh(new THREE.ConeGeometry(0.018, 0.05, 5), M.shamBoneHi);
        bone.position.set(i * 0.07, 0.16, 0.22);
        bone.rotation.x = Math.PI;
        leg.add(bone);
      }
      // Tribal-red paint stripes across the shin
      for (let i = 0; i < 3; i++) {
        const paint = mesh(new THREE.BoxGeometry(0.12, 0.014, 0.005), M.shamRed);
        paint.position.set(0, 0.55 - i * 0.13, 0.2);
        leg.add(paint);
      }
      // Soft hide boot
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.13, 0.32), M.shamFur);
      boot.position.set(0, 0.105, 0.06); leg.add(boot);
      // Boot-thong wrap
      for (let i = 0; i < 2; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.105, 0.008, 6, 14), M.shamOchreDark);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.13 - i * 0.05;
        leg.add(wrap);
      }
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildShamLeg(-1));
    root.add(buildShamLeg(1));

    // Pelvis — bone belt with hanging bone-charm trinkets
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.shamOchreDark));
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.12, 18), M.shamFur);
    belt.position.y = 0.04; pelvis.add(belt);
    // Bone buckle (with red paint)
    const buckle = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.shamBoneHi);
    buckle.position.set(0, 0.04, 0.32); buckle.scale.set(1.2, 0.7, 0.5);
    pelvis.add(buckle);
    // Red mark on buckle
    const buckleMark = mesh(new THREE.BoxGeometry(0.04, 0.014, 0.005), M.shamRed);
    buckleMark.position.set(0, 0.04, 0.345); pelvis.add(buckleMark);
    // Hanging bone-tooth charms (5 across)
    for (let i = -2; i <= 2; i++) {
      const cord = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.05, 4), M.shamOchreDark);
      cord.position.set(i * 0.06, -0.04, 0.31);
      pelvis.add(cord);
      const tooth = mesh(new THREE.ConeGeometry(0.014, 0.05, 5), i % 2 === 0 ? M.shamBone : M.shamBoneHi);
      tooth.position.set(i * 0.06, -0.1, 0.31);
      tooth.rotation.x = Math.PI;
      pelvis.add(tooth);
    }
    // Robe drape
    const robeDrape = mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.4, 16), M.shamOchre);
    robeDrape.position.y = -0.24; pelvis.add(robeDrape);
    // Tribal red paint stripes around the robe drape
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const paint = mesh(new THREE.BoxGeometry(0.08, 0.018, 0.005), M.shamRed);
      paint.position.set(Math.cos(a) * 0.4, -0.32, Math.sin(a) * 0.4);
      paint.lookAt(Math.cos(a) * 2, -0.32, Math.sin(a) * 2);
      pelvis.add(paint);
    }
    // Bone-fragment trim along the hem
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const bone = mesh(new THREE.ConeGeometry(0.022, 0.07, 5), M.shamBoneHi);
      bone.position.set(Math.cos(a) * 0.4, -0.43, Math.sin(a) * 0.4);
      bone.rotation.x = Math.PI;
      pelvis.add(bone);
    }
    root.add(pelvis);

    // TORSO — ochre robe with bone-rib chestpiece
    const torso = new THREE.Group();
    torso.position.y = 1.85;
    const robe = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.7, 18), M.shamOchre);
    robe.scale.set(1.0, 1, 0.85);
    torso.add(robe);

    // Bone-rib chestpiece (rib bones laid across the torso)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        const yPos = 0.18 - i * 0.12;
        const ribBone = mesh(new THREE.BoxGeometry(0.16, 0.02, 0.022), M.shamBoneHi);
        ribBone.position.set(side * 0.16, yPos, 0.32);
        ribBone.rotation.z = side * 0.18;
        torso.add(ribBone);
      }
    }
    // Central sternum bone
    const sternum = mesh(new THREE.BoxGeometry(0.04, 0.5, 0.022), M.shamBoneHi);
    sternum.position.set(0, -0.05, 0.34);
    torso.add(sternum);

    // Pec mounds
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.shamOchreHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Tribal red paint stripes across the upper chest
    for (let i = 0; i < 3; i++) {
      const paint = mesh(new THREE.BoxGeometry(0.32, 0.014, 0.005), M.shamRed);
      paint.position.set(0, 0.3 - i * 0.05, 0.28);
      torso.add(paint);
    }

    // CHEST EMBLEM — animal totem (small skull at the top, three small animal-face carvings stacked below)
    const emblemBack = mesh(new THREE.CircleGeometry(0.07, 16), M.shamOchreDark);
    emblemBack.position.set(0, -0.05, 0.41); torso.add(emblemBack);
    // Top: bear face (round head)
    const bearFace = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.shamBoneHi);
    bearFace.position.set(0, 0.0, 0.42); bearFace.scale.set(1, 1, 0.5);
    torso.add(bearFace);
    // Bear ears
    for (let s = -1; s <= 1; s += 2) {
      const ear = mesh(new THREE.SphereGeometry(0.01, 6, 4), M.shamBoneHi);
      ear.position.set(s * 0.018, 0.018, 0.42);
      torso.add(ear);
    }
    // Middle: wolf face (pointed snout)
    const wolfFace = mesh(new THREE.ConeGeometry(0.02, 0.04, 5), M.shamBoneHi);
    wolfFace.position.set(0, -0.05, 0.42); wolfFace.rotation.x = Math.PI / 2;
    torso.add(wolfFace);
    // Bottom: bird face (beak)
    const birdFace = mesh(new THREE.ConeGeometry(0.014, 0.04, 4), M.shamBoneHi);
    birdFace.position.set(0, -0.1, 0.42);
    torso.add(birdFace);
    // Tiny ochre eye-glows on each face
    for (let i = 0; i < 3; i++) {
      const eyeGlow = mesh(new THREE.SphereGeometry(0.005, 6, 4), M.shamSpirit);
      eyeGlow.position.set(0, 0.0 - i * 0.05, 0.43);
      torso.add(eyeGlow);
    }

    // Collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.shamOchreDark);
    collar.position.y = 0.42; torso.add(collar);
    const collarBone = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 18), M.shamBoneHi);
    collarBone.rotation.x = Math.PI / 2; collarBone.position.y = 0.49;
    torso.add(collarBone);

    root.add(torso);
    this.parts.body = torso;

    // FUR-FEATHER MANTLE around the shoulders (similar pattern to Hunter but with more red feathers)
    const mantle = new THREE.Group();
    mantle.position.set(0, 2.32, 0);
    const mantleBase = mesh(new THREE.TorusGeometry(0.36, 0.1, 12, 28, Math.PI * 0.95), M.shamFur);
    mantleBase.rotation.x = Math.PI / 2;
    mantleBase.rotation.z = Math.PI / 2;
    mantle.add(mantleBase);
    // Red-feather tufts (alternating bone + red feathers)
    const TUFT_COUNT = 26;
    for (let i = 0; i < TUFT_COUNT; i++) {
      const t = i / (TUFT_COUNT - 1);
      const angle = -Math.PI * 0.05 + t * Math.PI * 0.95;
      const r = 0.36;
      const feather = mesh(new THREE.ConeGeometry(0.022, 0.1 + Math.random() * 0.04, 5), Math.random() > 0.5 ? M.shamRed : M.shamBoneHi);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      feather.position.set(cosA * r, sinA * r * 0.4 + (Math.random() - 0.5) * 0.04, -Math.abs(sinA) * 0.16 + (Math.random() - 0.5) * 0.05);
      feather.lookAt(cosA * r * 3, sinA * r * 1.2, -Math.abs(sinA) * 0.5);
      feather.rotation.x += Math.PI / 2 + (Math.random() - 0.5) * 0.5;
      mantle.add(feather);
    }
    // Bone clasp at the front
    const clasp = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.shamBoneHi);
    clasp.position.set(0, -0.06, 0.36); clasp.scale.set(1.4, 0.7, 0.7);
    mantle.add(clasp);
    root.add(mantle);

    // Arms
    const armPalette = { cloth: M.shamOchre, mid: M.shamOchreHi, dark: M.shamOchreDark, hi: M.shamBoneHi, accent: M.shamRed };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    // Bone-charm wraps + red paint
    [leftArm, rightArm].forEach(arm => {
      // Multiple cord wraps
      for (let i = 0; i < 4; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.094, 0.008, 6, 14), M.shamOchreDark);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = -0.5 - i * 0.1;
        arm.add(wrap);
      }
      // Red paint stripes on upper arm
      for (let i = 0; i < 2; i++) {
        const paint = mesh(new THREE.BoxGeometry(0.08, 0.014, 0.005), M.shamRed);
        paint.position.set(0, -0.15 - i * 0.1, 0.085);
        arm.add(paint);
      }
      // Bone-tooth necklace at the wrist
      const wristCharm = mesh(new THREE.ConeGeometry(0.014, 0.05, 5), M.shamBoneHi);
      wristCharm.position.set(0, -0.94, 0.085); wristCharm.rotation.x = Math.PI;
      arm.add(wristCharm);
    });

    // TOTEM-POLE STAFF
    const staff = this._buildTotemStaff();
    rightArm.userData.hand.add(staff);
    staff.position.set(0, 0.04, 0.06);
    staff.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = staff;

    // No flowing cape — fur mantle is the back garment
    this.cape = null;

    // Neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — animal-skull mask + tall bone-feather headdress
    const head = this._buildShamanHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.shamEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.shamEye;
  }

  _buildTotemStaff() {
    const staff = new THREE.Group();
    // Pommel — bone tip
    const pommel = mesh(new THREE.ConeGeometry(0.025, 0.05, 5), M.shamBoneHi);
    pommel.rotation.x = Math.PI;
    staff.add(pommel);
    // Wood haft
    const haft = mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.3, 12), M.shamOchreDark);
    haft.position.y = 0.7; staff.add(haft);
    // Cord wraps
    for (let i = 0; i < 5; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.028, 0.005, 6, 12), M.shamRed);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.2 + i * 0.18;
      staff.add(wrap);
    }
    // Hanging feather charm at mid-haft
    const featherCharm = mesh(new THREE.BoxGeometry(0.012, 0.06, 0.005), M.shamRed);
    featherCharm.position.set(0.04, 0.6, 0); featherCharm.rotation.z = 0.3;
    staff.add(featherCharm);
    // Hanging bone tooth
    const toothCharm = mesh(new THREE.ConeGeometry(0.014, 0.05, 5), M.shamBoneHi);
    toothCharm.position.set(0.04, 0.5, 0); toothCharm.rotation.x = Math.PI;
    staff.add(toothCharm);
    // ===== TOTEM-POLE TOP — 3 stacked animal-face carvings =====
    // Bottom face (bear — round head with ears)
    const bearHead = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.08, 10), M.shamOchreHi);
    bearHead.position.y = 1.42; staff.add(bearHead);
    for (let s = -1; s <= 1; s += 2) {
      const ear = mesh(new THREE.SphereGeometry(0.018, 6, 4), M.shamOchreHi);
      ear.position.set(s * 0.04, 1.48, 0); staff.add(ear);
    }
    // Bear eyes (glowing)
    for (let s = -1; s <= 1; s += 2) {
      const eye = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.shamSpirit);
      eye.position.set(s * 0.022, 1.43, 0.06); staff.add(eye);
    }
    // Bear snout
    const bearSnout = mesh(new THREE.ConeGeometry(0.025, 0.05, 6), M.shamOchre);
    bearSnout.position.set(0, 1.4, 0.07); bearSnout.rotation.x = Math.PI / 2;
    staff.add(bearSnout);
    // Middle face (wolf — pointed snout)
    const wolfHead = mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.08, 10), M.shamOchre);
    wolfHead.position.y = 1.54; staff.add(wolfHead);
    // Wolf snout (long pointed)
    const wolfSnout = mesh(new THREE.ConeGeometry(0.025, 0.08, 6), M.shamOchre);
    wolfSnout.position.set(0, 1.54, 0.085); wolfSnout.rotation.x = Math.PI / 2;
    staff.add(wolfSnout);
    // Wolf ears (pointed)
    for (let s = -1; s <= 1; s += 2) {
      const ear = mesh(new THREE.ConeGeometry(0.014, 0.04, 4), M.shamOchre);
      ear.position.set(s * 0.025, 1.6, 0); ear.rotation.x = -0.4;
      staff.add(ear);
    }
    for (let s = -1; s <= 1; s += 2) {
      const eye = mesh(new THREE.SphereGeometry(0.008, 6, 4), M.shamSpirit);
      eye.position.set(s * 0.022, 1.55, 0.06); staff.add(eye);
    }
    // Top face (bird/eagle — beak)
    const birdHead = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.07, 10), M.shamOchreHi);
    birdHead.position.y = 1.65; staff.add(birdHead);
    // Beak
    const beak = mesh(new THREE.ConeGeometry(0.018, 0.06, 4), M.shamRed);
    beak.position.set(0, 1.65, 0.08); beak.rotation.x = Math.PI / 2;

      longFeather.position.set(i * 0.04, 1.32, -0.05); longFeather.rotation.x = 0.4;
      staff.add(longFeather);

    return staff;

  _buildShamanHead() {
    const head = new THREE.Group();

    // Skin face (visible at the chin/lower portion only)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skinDark);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // Dark scalp
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.shamFur);
    scalp.scale.set(1, 1.0, 1.05);
    head.add(scalp);

    // ===== ANIMAL-SKULL MASK — covering upper face (bull/wolf-skull style) =====
    // Main skull mass (covering forehead + upper cheeks)
    const maskShape = new THREE.Shape();
    maskShape.moveTo(-0.18, 0.06); maskShape.lineTo(0.18, 0.06);
    maskShape.bezierCurveTo(0.2, -0.04, 0.16, -0.12, 0, -0.13);
    maskShape.bezierCurveTo(-0.16, -0.12, -0.2, -0.04, -0.18, 0.06);
    maskShape.closePath();
    const mask = mesh(new THREE.ExtrudeGeometry(maskShape, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 2 }), M.shamBoneHi);
    mask.position.set(0, 0.02, 0.16);
    head.add(mask);
    // Eye holes (dark recesses with glowing eyes inside)
    for (let side = -1; side <= 1; side += 2) {
      const eyeHole = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.shamOchreDark);
      eyeHole.position.set(side * 0.075, 0.0, 0.21); eyeHole.scale.set(1, 0.9, 0.5);
      head.add(eyeHole);
      // Glowing ochre eye inside
      const eye = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.shamEye);
      eye.position.set(side * 0.075, 0.0, 0.225);
      head.add(eye);
    }
    // Tribal red paint stripes on the mask (war paint)
    for (let i = -1; i <= 1; i += 2) {
      const paint = mesh(new THREE.BoxGeometry(0.025, 0.06, 0.005), M.shamRed);
      paint.position.set(i * 0.04, 0.06, 0.225); paint.rotation.z = i * 0.2;
      head.add(paint);
    }
    // BULL/RAM HORNS curving outward from the mask
    for (let side = -1; side <= 1; side += 2) {
      // Horn segments (curving outward and forward)
      const hornBase = mesh(new THREE.CylinderGeometry(0.022, 0.018, 0.08, 6), M.shamBoneHi);
      hornBase.position.set(side * 0.16, 0.1, 0.18); hornBase.rotation.z = side * 0.5;
      head.add(hornBase);
      const hornTip = mesh(new THREE.ConeGeometry(0.018, 0.12, 6), M.shamBoneHi);
      hornTip.position.set(side * 0.22, 0.16, 0.22); hornTip.rotation.z = side * 0.8;
      head.add(hornTip);
    }

    // Lower face skin (jaw exposed below the mask)
    const jaw = mesh(new THREE.SphereGeometry(0.16, 14, 10), M.skinDark);
    jaw.position.set(0, -0.12, 0.12); jaw.scale.set(0.9, 0.7, 0.9);
    head.add(jaw);

    // Mouth visible below the mask (small line)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.18, 0.22); head.add(mouth);

    // ===== TALL BONE-FEATHER HEADDRESS atop the head =====
    // Base band (red leather)
    const bandHead = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 24), M.shamRed);
    bandHead.rotation.x = Math.PI / 2;
    bandHead.position.y = 0.18;
    head.add(bandHead);
    // 7 tall feathers radiating up + back from the band
    for (let i = -3; i <= 3; i++) {
      const t = (i + 3) / 6;
      const angle = t * Math.PI * 0.7 - Math.PI * 0.35;
      const featherLen = 0.32 - Math.abs(i) * 0.04;
      const featherShape = new THREE.Shape();
      featherShape.moveTo(-0.018, 0); featherShape.lineTo(0.018, 0);
      featherShape.bezierCurveTo(0.025, featherLen * 0.4, 0.018, featherLen * 0.85, 0, featherLen);
      featherShape.bezierCurveTo(-0.018, featherLen * 0.85, -0.025, featherLen * 0.4, -0.018, 0);
      featherShape.closePath();
      const feather = mesh(new THREE.ExtrudeGeometry(featherShape, { depth: 0.005, bevelEnabled: false }), i % 2 === 0 ? M.shamRed : M.shamBoneHi);
      feather.position.set(0, 0.21, -0.05);
      // Rotate based on position
      feather.rotation.y = angle;
      feather.rotation.x = -0.3;
      head.add(feather);
      // Rachis (gold central spine)
      const rachis = mesh(new THREE.BoxGeometry(0.005, featherLen, 0.005), M.shamSpirit);
      rachis.position.set(Math.sin(angle) * 0, 0.21 + featherLen * 0.5, -0.05 - Math.cos(angle) * featherLen * 0.5);
      rachis.rotation.y = angle;
      head.add(rachis);
    }

    return head;
  }
}
