// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  MONK — Fighter IV/VI                                                    ║
// ║  Speed · Combo · Ki · Topknot, bare arms, saffron robe with one bare    ║
// ║  shoulder, cream sash, jade prayer-bead bracelets, bo staff strapped    ║
// ║  to back, jade pendant, jade-green ki eye glow                          ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Monk extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = monkAnimations;
  }

  // Override update to slowly rotate the prayer-bead bracelet on each wrist
  // (a tiny living-detail flourish, like Shieldmage's orbital runes but smaller)
  update(time, dt) {
    super.update(time, dt);
    if (this.beadAnchorL) this.beadAnchorL.rotation.y = time * 0.6;
    if (this.beadAnchorR) this.beadAnchorR.rotation.y = -time * 0.55;
  }

  build() {
    const root = this.group;

    // Legs — saffron wrapped trousers (no plate)
    // Inline build (skip buildLeg since we want robe-wrap, not greaves)
    const buildRobeLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — saffron robe wrap
      const thigh = mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.55, 14), M.saffron);
      thigh.position.y = 0.95; leg.add(thigh);
      // Knee — slightly highlighted
      const knee = mesh(new THREE.SphereGeometry(0.135, 14, 10), M.saffronHi);
      knee.position.y = 0.66; knee.scale.set(1, 0.7, 1.1); leg.add(knee);
      // Lower shin — wrapped saffron + cream cord
      const shin = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.45, 14), M.saffronHi);
      shin.position.y = 0.39; leg.add(shin);
      // Cream cord wraps along shin
      for (let i = 0; i < 4; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.13, 0.008, 6, 14), M.monkCream);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.5 - i * 0.07;
        leg.add(wrap);
      }
      // Sandal — simple flat sole + thong
      const sole = mesh(new THREE.BoxGeometry(0.22, 0.04, 0.34), M.leatherDark);
      sole.position.set(0, 0.06, 0.05); leg.add(sole);
      // Sandal thong (Y-strap)
      const thong = mesh(new THREE.BoxGeometry(0.02, 0.05, 0.16), M.leather);
      thong.position.set(0, 0.1, 0.1); leg.add(thong);
      // Bare foot showing through
      const foot = mesh(new THREE.BoxGeometry(0.18, 0.04, 0.28), M.skin);
      foot.position.set(0, 0.1, 0.06); leg.add(foot);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildRobeLeg(-1));
    root.add(buildRobeLeg(1));

    // Pelvis — cream sash with jade ornament
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.18, 16), M.saffron));
    // Cream sash (thick belt)
    const sash = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.16, 18), M.monkCream);
    sash.position.y = 0.0; pelvis.add(sash);
    // Sash knot at front (large bow-knot)
    const sashKnot = mesh(new THREE.SphereGeometry(0.07, 12, 10), M.monkCream);
    sashKnot.position.set(0, 0.0, 0.34); sashKnot.scale.set(1.4, 0.7, 0.7);
    pelvis.add(sashKnot);
    // Sash tails hanging from knot
    for (let i = -1; i <= 1; i += 2) {
      const tail = mesh(new THREE.BoxGeometry(0.06, 0.32, 0.018), M.monkCream);
      tail.position.set(i * 0.07, -0.16, 0.34);
      tail.rotation.z = i * 0.18;
      pelvis.add(tail);
    }
    // Jade pendant hanging from sash knot
    const jadePendant = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.jade);
    jadePendant.position.set(0, -0.08, 0.38); jadePendant.scale.set(1, 1.2, 0.5);
    pelvis.add(jadePendant);
    const pendantString = mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.06, 4), M.leather);
    pendantString.position.set(0, -0.04, 0.37); pelvis.add(pendantString);
    root.add(pelvis);

    // TORSO — saffron robe wrap with bare right shoulder/chest visible
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Bare skin underlayer (whole torso visible — robe wraps over it)
    const bareTorso = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.skin);
    bareTorso.scale.set(1.0, 1, 0.85);
    torso.add(bareTorso);

    // Pec mounds (bare skin)
    const pecL = mesh(new THREE.SphereGeometry(0.17, 14, 12), M.skin);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // Saffron robe wrap — diagonal, covers left shoulder/torso, leaves right shoulder bare
    // The wrap is built as a curved sheet from left shoulder down to right hip
    const robePoints = [];
    const robeRows = 16, robeCols = 12;
    const robeVerts = [], robeIndices = [], robeUvs = [];
    for (let y = 0; y <= robeRows; y++) {
      const v = y / robeRows;
      for (let x = 0; x <= robeCols; x++) {
        const u = x / robeCols;
        // The robe wraps diagonally — left shoulder (top) to right hip (bottom)
        const angle = (u - 0.5) * Math.PI * 1.0 + Math.PI / 6;  // shifted so it covers left-front-back
        const r = 0.36 + Math.sin(v * Math.PI) * 0.02;
        const px = Math.cos(angle) * r;
        const pz = Math.sin(angle) * r;
        const py = 0.4 - v * 0.7;
        robeVerts.push(px, py, pz);
        robeUvs.push(u, 1 - v);
      }
    }
    for (let y = 0; y < robeRows; y++) {
      for (let x = 0; x < robeCols; x++) {
        const a = y * (robeCols + 1) + x, b = a + 1, c = a + robeCols + 1, d = c + 1;
        robeIndices.push(a, c, b, b, c, d);
      }
    }
    const robeGeo = new THREE.BufferGeometry();
    robeGeo.setAttribute('position', new THREE.Float32BufferAttribute(robeVerts, 3));
    robeGeo.setAttribute('uv', new THREE.Float32BufferAttribute(robeUvs, 2));
    robeGeo.setIndex(robeIndices);
    robeGeo.computeVertexNormals();
    const robe = mesh(robeGeo, M.saffron);
    torso.add(robe);

    // Robe trim — saffron-dark border along the wrap edge
    const trimLeft = mesh(new THREE.BoxGeometry(0.04, 0.7, 0.012), M.saffronDark);
    trimLeft.position.set(-0.32, 0.05, 0.18); trimLeft.rotation.y = -0.4;
    torso.add(trimLeft);
    const trimRight = mesh(new THREE.BoxGeometry(0.04, 0.7, 0.012), M.saffronDark);
    trimRight.position.set(0.32, 0.05, -0.18); trimRight.rotation.y = -0.4;
    torso.add(trimRight);

    // Diagonal robe-front strip (visible across the chest)
    const diagonalStrip = mesh(new THREE.BoxGeometry(0.5, 0.18, 0.04), M.saffronHi);
    diagonalStrip.position.set(0, 0.08, 0.32); diagonalStrip.rotation.z = -0.4;
    torso.add(diagonalStrip);

    // Jade chest emblem — large round jade gem on the diagonal strip (chest-emblem requirement)
    const jadeBack = mesh(new THREE.CircleGeometry(0.06, 16), M.saffronDark);
    jadeBack.position.set(0.05, 0.12, 0.35); jadeBack.rotation.z = -0.4;
    torso.add(jadeBack);
    const jadeGem = mesh(new THREE.SphereGeometry(0.05, 16, 12), M.jade);
    jadeGem.position.set(0.05, 0.12, 0.37); jadeGem.scale.set(1, 1, 0.5);
    torso.add(jadeGem);
    // Inscribed kanji-like marks on jade
    for (let i = 0; i < 3; i++) {
      const mark = mesh(new THREE.BoxGeometry(0.025, 0.005, 0.005), M.jadeHi);
      mark.position.set(0.05, 0.135 - i * 0.012, 0.4);
      mark.rotation.z = -0.4;
      torso.add(mark);
    }

    // Right pec — bare and exposed (the marquee monk silhouette feature)
    // No robe coverage on right side — chest skin shows through

    // Neck collar (bare skin, no metal)
    root.add(torso);
    this.parts.body = torso;

    // Bare upper arms (inlined — like Berserker but cleaner, no tattoos, with prayer beads)
    const buildMonkArm = (sx, shoulderAngle) => {
      const arm = new THREE.Group();
      // Bare upper arm
      const upper = mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.4, 12), M.skin);
      upper.position.y = -0.2; arm.add(upper);
      // Saffron-cloth shoulder cap (only on left arm — right is fully bare)
      if (sx === -1) {
        const shoulderCap = mesh(new THREE.SphereGeometry(0.12, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.saffron);
        shoulderCap.position.y = 0; shoulderCap.scale.set(1, 0.7, 1);
        arm.add(shoulderCap);
        // Saffron-dark trim
        const capTrim = mesh(new THREE.TorusGeometry(0.115, 0.01, 8, 16), M.saffronDark);
        capTrim.rotation.x = Math.PI / 2; capTrim.position.y = -0.04;
        arm.add(capTrim);
      }
      // Bare elbow
      const elbow = mesh(new THREE.SphereGeometry(0.09, 12, 10), M.skin);
      elbow.position.y = -0.42; elbow.scale.set(1, 0.8, 1); arm.add(elbow);
      // Bare forearm
      const forearm = mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.4, 12), M.skin);
      forearm.position.y = -0.62; arm.add(forearm);

      // Prayer-bead bracelet at the wrist (rotating anchor — set parent on champion)
      const beadAnchor = new THREE.Group();
      beadAnchor.position.y = -0.8;
      const BEAD_COUNT = 12;
      for (let i = 0; i < BEAD_COUNT; i++) {
        const a = (i / BEAD_COUNT) * Math.PI * 2;
        const bead = mesh(new THREE.SphereGeometry(0.014, 8, 6), i % 4 === 0 ? M.jadeHi : M.jade);
        bead.position.set(Math.cos(a) * 0.1, 0, Math.sin(a) * 0.1);
        beadAnchor.add(bead);
      }
      // Center bead string (cord)
      const cord = mesh(new THREE.TorusGeometry(0.1, 0.003, 6, 24), M.leather);
      cord.rotation.x = Math.PI / 2;
      beadAnchor.add(cord);
      arm.add(beadAnchor);
      arm.userData.beadAnchor = beadAnchor;

      // Hand (bare skin, slim)
      const handMesh = mesh(new THREE.BoxGeometry(0.12, 0.16, 0.1), M.skin);
      handMesh.position.y = -0.95; arm.add(handMesh);
      const hand = new THREE.Group();
      hand.position.y = -0.96;
      arm.add(hand);
      arm.userData.hand = hand;
      arm.position.set(sx * 0.42, 2.18, 0);
      arm.rotation.z = sx * shoulderAngle;
      return arm;
    };

    const leftArm = buildMonkArm(-1, 0.18);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;
    this.beadAnchorL = leftArm.userData.beadAnchor;

    const rightArm = buildMonkArm(1, 0.18);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;
    this.beadAnchorR = rightArm.userData.beadAnchor;

    // BO STAFF — strapped diagonally across the back (idle pose, ready to draw)
    const boStaff = this._buildBoStaff();
    boStaff.position.set(-0.05, 1.95, -0.32);
    boStaff.rotation.set(0, 0, Math.PI / 6);
    root.add(boStaff);
    this.parts.staff = boStaff;

    // Bare neck
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — no helm; bald with topknot, jade earrings, dot of vermilion on forehead
    const head = this._buildMonkHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    this.cape = null;

    M.monkEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.monkEye;
  }

  _buildBoStaff() {
    const staff = new THREE.Group();
    // Long wood haft
    const haft = mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.4, 12), M.wood);
    staff.add(haft);
    // Hand-grip wraps (cream cord at center)
    for (let i = 0; i < 6; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12), M.monkCream);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = -0.15 + i * 0.06;
      staff.add(wrap);
    }
    // Jade caps at both ends
    const capTop = mesh(new THREE.CylinderGeometry(0.028, 0.024, 0.05, 10), M.jade);
    capTop.position.y = 0.7; staff.add(capTop);
    const capBot = mesh(new THREE.CylinderGeometry(0.024, 0.028, 0.05, 10), M.jade);
    capBot.position.y = -0.7; staff.add(capBot);
    // Brass bands flanking each jade cap
    [0.66, -0.66].forEach(y => {
      const band = mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.012, 10), M.brass);
      band.position.y = y; staff.add(band);
    });
    return staff;
  }

  _buildMonkHead() {
    const head = new THREE.Group();

    // Bald scalp (skin)
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.skinDark);
    scalp.scale.set(1, 1.1, 1.05);
    head.add(scalp);

    // Face shape (slightly forward shifted)
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== TOPKNOT (the marquee feature) =====
    // Tied bun on top of head
    const bunBase = mesh(new THREE.SphereGeometry(0.07, 14, 12), M.stoneDark);
    bunBase.position.set(0, 0.22, -0.02); head.add(bunBase);
    // Cord wrap around the bun
    const bunCord = mesh(new THREE.TorusGeometry(0.07, 0.012, 8, 16), M.crimson);
    bunCord.rotation.x = Math.PI / 4;
    bunCord.position.set(0, 0.2, -0.02); head.add(bunCord);
    // Topknot tail (a small upward bristle of hair from the bun)
    const tail = mesh(new THREE.ConeGeometry(0.04, 0.12, 8), M.stoneDark);
    tail.position.set(0, 0.32, -0.04); tail.rotation.x = -0.2;
    head.add(tail);
    // Forehead tonsure line (visible head shave)
    const tonsure = mesh(new THREE.TorusGeometry(0.18, 0.005, 6, 24), M.skinDark);
    tonsure.rotation.x = Math.PI / 2.5;
    tonsure.position.y = 0.08;
    head.add(tonsure);

    // Vermilion dot on forehead (third-eye mark, small)
    const dot = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.crimsonHi);
    dot.position.set(0, 0.06, 0.21); head.add(dot);

    // Eyes — narrow horizontal strip with jade-green ki glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.02, 0.18); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.monkEye);
    eyeL.position.set(-0.075, -0.02, 0.2); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Subtle nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (calm closed line)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.22); head.add(mouth);

    // Jade earrings
    for (let side = -1; side <= 1; side += 2) {
      const earring = mesh(new THREE.SphereGeometry(0.018, 8, 6), M.jade);
      earring.position.set(side * 0.21, -0.05, 0); head.add(earring);
    }

    return head;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  SPELLBLADE — Fighter V/VI                                               ║
// ║  Hybrid Melee · Brief Taunt · Silver runic half-plate, indigo cloth,    ║
// ║  arcane-blue rune trim on hood-cape, two floating runic shards          ║
// ║  orbiting off-hand shoulder, glowing runed greatsword, hex-blue glow    ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Spellblade extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = spellbladeAnimations;
  }

  // Override update to spin the floating shoulder shards around their anchor
  update(time, dt) {
    super.update(time, dt);
    if (this.shardAnchor) this.shardAnchor.rotation.y = time * 0.8;
  }

  build() {
    const root = this.group;

    // Legs — silver greaves with indigo trim + arcane rune accent
    const legPalette = { dark: M.silverPlateDark, mid: M.silverPlate, accent: M.arcaneRune, trim: M.silverPlateHi, leather: M.indigoTrim };
    root.add(buildLeg(-1, legPalette));
    root.add(buildLeg(1, legPalette));

    // Pelvis — silver plate skirt with arcane-blue rune-engraved tassets
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.silverPlateDark));
    // Indigo cloth underbelt
    const underbelt = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.08, 16), M.indigoTrim);
    underbelt.position.y = 0.05; pelvis.add(underbelt);
    // Front buckle — arcane rune gem
    const buckleBack = mesh(new THREE.CircleGeometry(0.04, 16), M.silverPlateHi);
    buckleBack.position.set(0, 0.05, 0.32); pelvis.add(buckleBack);
    const buckleGem = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.arcaneRune);
    buckleGem.position.set(0, 0.05, 0.34); buckleGem.scale.set(1, 1, 0.5);
    pelvis.add(buckleGem);
    // Tassets — 6 silver plate panels with engraved rune lines
    for (let i = 0; i < 6; i++) {
      const angle = -Math.PI * 0.5 + (i / 5) * Math.PI * 1.0;
      const tasset = mesh(new THREE.BoxGeometry(0.12, 0.32, 0.03), M.silverPlate);
      tasset.position.set(Math.cos(angle) * 0.3, -0.2, Math.sin(angle) * 0.3);
      tasset.lookAt(Math.cos(angle) * 2, -0.2, Math.sin(angle) * 2);
      tasset.rotateX(0.06);
      pelvis.add(tasset);
      // Rune line along each tasset
      const runeLine = mesh(new THREE.BoxGeometry(0.06, 0.22, 0.005), M.arcaneRune);
      runeLine.position.set(Math.cos(angle) * 0.32, -0.18, Math.sin(angle) * 0.32);
      runeLine.lookAt(Math.cos(angle) * 2, -0.18, Math.sin(angle) * 2);
      runeLine.rotateX(0.06);
      pelvis.add(runeLine);
    }
    root.add(pelvis);

    // TORSO — silver half-plate over indigo cloth
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Indigo tunic underlayer
    const tunic = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.indigoTrim);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Silver chest cuirass (front plate only — partial coverage shows tunic at sides)
    const cuirass = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.55, 16, 1, false, -Math.PI / 2.2, Math.PI * 1.3), M.silverPlate);
    cuirass.scale.set(1.05, 1, 0.85);
    cuirass.position.y = 0.04;
    torso.add(cuirass);

    // Pec mounds (silver swells)
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.silverPlateHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.6);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // CHEST EMBLEM — eight-pointed arcane star with central rune gem
    const emblemBack = mesh(new THREE.CircleGeometry(0.085, 16), M.silverPlateDark);
    emblemBack.position.set(0, 0.05, 0.36); torso.add(emblemBack);
    // Eight-pointed star (two overlapping diamonds)
    for (let rotIdx = 0; rotIdx < 2; rotIdx++) {
      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2 + rotIdx * Math.PI / 4;
        const ray = mesh(new THREE.ConeGeometry(0.012, 0.07, 4), M.silverPlateHi);
        ray.position.set(Math.cos(angle) * 0.05, 0.05 + Math.sin(angle) * 0.05, 0.38);
        ray.rotation.z = angle - Math.PI / 2;
        torso.add(ray);
      }
    }
    // Central arcane rune gem
    const emblemGem = mesh(new THREE.SphereGeometry(0.035, 14, 12), M.arcaneRune);
    emblemGem.position.set(0, 0.05, 0.4); emblemGem.scale.set(1, 1, 0.5);
    torso.add(emblemGem);
    const emblemRing = mesh(new THREE.TorusGeometry(0.04, 0.005, 8, 16), M.silverPlateHi);
    emblemRing.position.set(0, 0.05, 0.41); torso.add(emblemRing);

    // Engraved rune lines flowing across the chest plate (two diagonal arcane channels)
    for (let side = -1; side <= 1; side += 2) {
      const rune1 = mesh(new THREE.BoxGeometry(0.005, 0.32, 0.005), M.arcaneRune);
      rune1.position.set(side * 0.18, 0.1, 0.36);
      rune1.rotation.z = side * 0.4;
      torso.add(rune1);
      // Small rune sigils along the line
      for (let i = 0; i < 3; i++) {
        const sigil = mesh(new THREE.BoxGeometry(0.018, 0.012, 0.005), M.arcaneRune);
        sigil.position.set(side * (0.13 + i * 0.05), 0.18 - i * 0.07, 0.37);
        sigil.rotation.z = side * 0.4;
        torso.add(sigil);
      }
    }

    // Belt at base of cuirass — silver band with indigo cloth showing
    const belt = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 18), M.silverPlateHi);
    belt.position.y = -0.3; torso.add(belt);
    const beltRune = mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.014, 18), M.arcaneRune);
    beltRune.position.y = -0.3; torso.add(beltRune);

    // Neck collar — silver high collar with arcane line
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 16), M.silverPlate);
    collar.position.y = 0.4; torso.add(collar);
    const collarRune = mesh(new THREE.TorusGeometry(0.21, 0.006, 6, 18), M.arcaneRune);
    collarRune.rotation.x = Math.PI / 2; collarRune.position.y = 0.4;
    torso.add(collarRune);

    root.add(torso);
    this.parts.body = torso;

    // Pauldrons — silver, asymmetric (left has the floating shards above)
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.18, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.silverPlate);
      pauld.scale.set(1.1, 0.85, 1);
      pauld.position.set(side * 0.42, 2.2, 0);
      root.add(pauld);
      // Silver-hi trim along the pauldron rim
      const pauldTrim = mesh(new THREE.TorusGeometry(0.18, 0.012, 8, 20), M.silverPlateHi);
      pauldTrim.rotation.x = Math.PI / 2; pauldTrim.position.set(side * 0.42, 2.16, 0);
      root.add(pauldTrim);
      // Arcane rune symbol on pauldron top
      const pauldRune = mesh(new THREE.SphereGeometry(0.025, 10, 8), M.arcaneRune);
      pauldRune.position.set(side * 0.42, 2.32, 0); pauldRune.scale.set(1, 0.5, 1);
      root.add(pauldRune);
    }

    // ===== FLOATING RUNIC SHARDS — orbiting the LEFT (off-hand) shoulder =====
    this.shardAnchor = new THREE.Group();
    this.shardAnchor.position.set(-0.42, 2.5, 0);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const shardShape = new THREE.Shape();
      shardShape.moveTo(0, -0.04); shardShape.lineTo(0.025, 0);
      shardShape.lineTo(0, 0.06); shardShape.lineTo(-0.025, 0); shardShape.closePath();
      const shard = mesh(new THREE.ExtrudeGeometry(shardShape, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.003, bevelSegments: 1 }), M.arcaneRune);
      shard.position.set(Math.cos(a) * 0.18, Math.sin(a) * 0.04, Math.sin(a) * 0.18);
      shard.rotation.set(0, -a + Math.PI / 2, 0);
      this.shardAnchor.add(shard);
    }
    root.add(this.shardAnchor);

    // ARMS — silver vambrace + indigo cloth upper
    const armPalette = { cloth: M.indigoTrim, mid: M.silverPlate, dark: M.silverPlateDark, hi: M.silverPlateHi, accent: M.arcaneRune };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Rune-line on each forearm vambrace
    [leftArm, rightArm].forEach(arm => {
      const runeLine = mesh(new THREE.BoxGeometry(0.005, 0.36, 0.005), M.arcaneRune);
      runeLine.position.set(0, -0.62, 0.09);
      arm.add(runeLine);
    });

    // RUNIC GREATSWORD — held in right hand (one-handed even though large — fantasy convention)
    const sword = this._buildRunicGreatsword();
    rightArm.userData.hand.add(sword);
    sword.position.set(0, 0.04, 0.06);
    sword.rotation.set(Math.PI * 0.42, 0, 0);
    this.parts.weapon = sword;

    // Short hooded CAPE — drapes from collar, indigo with silver-rune trim
    const cape = buildCape({ material: M.sbCape, width: 1.2, height: 1.2 });
    cape.position.set(0, 2.36, -0.05);
    root.add(cape);
    this.cape = cape;

    // Cape trim along the bottom (visible edge)
    const capeTrim = mesh(new THREE.TorusGeometry(0.5, 0.015, 8, 24, Math.PI), M.arcaneRune);
    capeTrim.rotation.x = Math.PI / 2;
    capeTrim.position.set(0, 1.18, -0.15);
    capeTrim.scale.set(1.1, 1, 0.5);
    root.add(capeTrim);

    // Neck (visible at the top of the collar — indigo cloth)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.indigoTrim);
    neck.position.y = 2.32; root.add(neck);

    // HELM — circlet + low hood + arcane forehead gem (open face)
    const helm = this._buildSpellbladeHelm();
    helm.position.y = 2.56;
    root.add(helm);
    this.parts.head = helm;

    M.sbEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.sbEye;
  }

  _buildRunicGreatsword() {
    const sword = new THREE.Group();
    // Pommel — large silver orb with arcane rune
    const pommel = mesh(new THREE.SphereGeometry(0.045, 14, 12), M.silverPlateHi);
    sword.add(pommel);
    const pommelGem = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.arcaneRune);
    pommelGem.position.y = 0.0; pommelGem.scale.set(1, 1, 0.5);
    sword.add(pommelGem);
    // Grip — long two-handed leather wrap with rune wraps
    const grip = mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.32, 12), M.indigoTrim);
    grip.position.y = 0.18; sword.add(grip);
    for (let i = 0; i < 5; i++) {
      const wrap = mesh(new THREE.TorusGeometry(0.028, 0.005, 6, 12), M.silverPlateHi);
      wrap.rotation.x = Math.PI / 2;
      wrap.position.y = 0.06 + i * 0.06;
      sword.add(wrap);
    }
    // Crossguard — wide silver bar with arcane runes at each end
    const cross = mesh(new THREE.BoxGeometry(0.32, 0.045, 0.045), M.silverPlate);
    cross.position.y = 0.36; sword.add(cross);
    // Crossguard runes (left and right gems)
    for (let side = -1; side <= 1; side += 2) {
      const runeGem = mesh(new THREE.SphereGeometry(0.028, 10, 8), M.arcaneRune);
      runeGem.position.set(side * 0.16, 0.36, 0);
      sword.add(runeGem);
    }
    // Central crossguard rune
    const centralRune = mesh(new THREE.BoxGeometry(0.06, 0.04, 0.05), M.arcaneRune);
    centralRune.position.set(0, 0.36, 0); sword.add(centralRune);
    // BLADE — long with engraved rune line glowing down the center
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.04, 0); bladeShape.lineTo(0.04, 0);
    bladeShape.lineTo(0.024, 1.05); bladeShape.lineTo(0.0, 1.12); bladeShape.lineTo(-0.024, 1.05);
    bladeShape.closePath();
    const blade = mesh(new THREE.ExtrudeGeometry(bladeShape, { depth: 0.022, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.004, bevelSegments: 2 }), M.silverPlateHi);
    blade.position.set(0, 0.4, -0.011); sword.add(blade);
    // Glowing rune fuller (the central engraving)
    const fuller = mesh(new THREE.BoxGeometry(0.012, 0.95, 0.005), M.arcaneRune);
    fuller.position.set(0, 0.86, 0.012); sword.add(fuller);
    // Three rune sigils along the fuller
    for (let i = 0; i < 4; i++) {
      const sigil = mesh(new THREE.BoxGeometry(0.024, 0.02, 0.006), M.arcaneRune);
      sigil.position.set(0, 0.5 + i * 0.22, 0.013);
      sword.add(sigil);
    }
    return sword;
  }

  _buildSpellbladeHelm() {
    const helm = new THREE.Group();

    // Open hood — drapes back over scalp (low-coverage hood)
    const hood = mesh(new THREE.SphereGeometry(0.22, 20, 14, 0, Math.PI * 2, Math.PI * 0.15, Math.PI * 0.7), M.indigoTrim);
    hood.scale.set(1.05, 1.0, 1.15);
    hood.position.set(0, 0.04, -0.04);
    helm.add(hood);

    // Hood front edge (silver trim)
    const hoodTrim = mesh(new THREE.TorusGeometry(0.22, 0.01, 8, 28, Math.PI * 1.2), M.silverPlateHi);
    hoodTrim.rotation.x = Math.PI / 2;
    hoodTrim.rotation.y = -Math.PI / 2;
    hoodTrim.position.y = 0.06;
    helm.add(hoodTrim);

    // Face area — skin showing
    const face = mesh(new THREE.SphereGeometry(0.2, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    helm.add(face);

    // CIRCLET — silver band across the brow with central arcane gem
    const circlet = mesh(new THREE.TorusGeometry(0.21, 0.012, 8, 24), M.silverPlateHi);
    circlet.rotation.x = Math.PI / 2;
    circlet.position.y = 0.04; helm.add(circlet);
    // Forward-facing diamond gem (the marquee mage feature on the head)
    const browGem = mesh(new THREE.SphereGeometry(0.034, 12, 10), M.arcaneRune);
    browGem.position.set(0, 0.04, 0.21); browGem.scale.set(1, 1, 0.5);
    helm.add(browGem);
    const browGemRing = mesh(new THREE.TorusGeometry(0.04, 0.006, 8, 16), M.silverPlateHi);
    browGemRing.position.set(0, 0.04, 0.215); helm.add(browGemRing);
    // Two prongs flanking the central gem (regal/mage circlet)
    for (let side = -1; side <= 1; side += 2) {
      const prong = mesh(new THREE.ConeGeometry(0.014, 0.08, 4), M.silverPlateHi);
      prong.position.set(side * 0.075, 0.1, 0.2);
      prong.rotation.z = side * 0.15;
      helm.add(prong);
    }

    // Eyes — bright hex-blue glow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.025, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.18); helm.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.sbEye);
    eyeL.position.set(-0.08, -0.02, 0.21); helm.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.08; helm.add(eyeR);

    // Subtle nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.22); nose.rotation.x = Math.PI / 2;
    helm.add(nose);

    // Mouth/jaw line
    const jawLine = mesh(new THREE.BoxGeometry(0.18, 0.005, 0.005), M.skinDark);
    jawLine.position.set(0, -0.14, 0.21); helm.add(jawLine);

    return helm;
  }
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  PALADIN — Fighter VI/VI                                                 ║
// ║  Holy Fighter · Brief Group Taunt · Gilded sun-gold plate over steel,   ║
// ║  long sky-blue tabard with 12-rayed sun emblem, cross-aperture          ║
// ║  greathelm, cross-headed warhammer, sky-blue cape, warm sun-yellow eye  ║
// ╚══════════════════════════════════════════════════════════════════════════╝
class Paladin extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = paladinAnimations;
  }

  build() {
    const root = this.group;

    // Legs — polished steel greaves with sun-gold trim
    const legPalette = { dark: M.palSteelDark, mid: M.palSteel, accent: M.sunGold, trim: M.sunGoldHi, leather: M.leather };
    root.add(buildLeg(-1, legPalette));
    root.add(buildLeg(1, legPalette));

    // Pelvis — steel plate with gilded tassets
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.2, 16), M.palSteelDark));
    // Gold belt
    const belt = mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.1, 18), M.sunGold);
    belt.position.y = 0.04; pelvis.add(belt);
    // Belt buckle — sun emblem
    const buckleBack = mesh(new THREE.CircleGeometry(0.06, 16), M.sunGoldHi);
    buckleBack.position.set(0, 0.04, 0.32); pelvis.add(buckleBack);
    const buckleSun = mesh(new THREE.SphereGeometry(0.025, 12, 10), M.sunRune);
    buckleSun.position.set(0, 0.04, 0.34); buckleSun.scale.set(1, 1, 0.5);
    pelvis.add(buckleSun);
    // 8 rays around the buckle sun
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const ray = mesh(new THREE.ConeGeometry(0.006, 0.025, 4), M.sunGoldHi);
      ray.position.set(Math.cos(a) * 0.04, 0.04 + Math.sin(a) * 0.04, 0.35);
      ray.rotation.z = a - Math.PI / 2;
      pelvis.add(ray);
    }
    // Tassets — 6 gilded plates around the front/sides
    for (let i = 0; i < 6; i++) {
      const angle = -Math.PI * 0.5 + (i / 5) * Math.PI * 1.0;
      const tasset = mesh(new THREE.BoxGeometry(0.13, 0.36, 0.03), M.sunGold);
      tasset.position.set(Math.cos(angle) * 0.3, -0.22, Math.sin(angle) * 0.3);
      tasset.lookAt(Math.cos(angle) * 2, -0.22, Math.sin(angle) * 2);
      tasset.rotateX(0.06);
      pelvis.add(tasset);
      // Small cross emboss on each tasset
      const crossV = mesh(new THREE.BoxGeometry(0.012, 0.06, 0.005), M.sunGoldHi);
      crossV.position.set(Math.cos(angle) * 0.32, -0.22, Math.sin(angle) * 0.32);
      crossV.lookAt(Math.cos(angle) * 2, -0.22, Math.sin(angle) * 2);
      crossV.rotateX(0.06);
      pelvis.add(crossV);
      const crossH = mesh(new THREE.BoxGeometry(0.04, 0.012, 0.005), M.sunGoldHi);
      crossH.position.set(Math.cos(angle) * 0.32, -0.22, Math.sin(angle) * 0.32);
      crossH.lookAt(Math.cos(angle) * 2, -0.22, Math.sin(angle) * 2);
      crossH.rotateX(0.06);
      pelvis.add(crossH);
    }
    root.add(pelvis);

    // TORSO — gilded plate over polished steel underlayer
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Steel underchest
    const chestSteel = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.7, 16), M.palSteel);
    chestSteel.scale.set(1.0, 1, 0.85);
    torso.add(chestSteel);

    // Sun-gold front cuirass (highlighted)
    const chestGold = mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.6, 16, 1, false, -Math.PI / 2.3, Math.PI * 1.25), M.sunGold);
    chestGold.scale.set(1.05, 1, 0.85);
    chestGold.position.y = 0.04;
    torso.add(chestGold);

    // Pec mounds — sun-gold
    const pecL = mesh(new THREE.SphereGeometry(0.18, 14, 12), M.sunGoldHi);
    pecL.position.set(-0.16, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.6);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.16;
    torso.add(pecR);

    // SKY-BLUE TABARD — long, drapes from collarbone to mid-thigh, with sun emblem
    const tabardFront = mesh(new THREE.BoxGeometry(0.42, 0.95, 0.012), M.skyCape);
    tabardFront.position.set(0, -0.05, 0.36);
    torso.add(tabardFront);
    // Tabard back
    const tabardBack = mesh(new THREE.BoxGeometry(0.42, 0.95, 0.012), M.skyCape);
    tabardBack.position.set(0, -0.05, -0.36);
    torso.add(tabardBack);
    // Gold trim along tabard edges
    const trimL = mesh(new THREE.BoxGeometry(0.018, 0.95, 0.014), M.sunGoldHi);
    trimL.position.set(-0.21, -0.05, 0.37); torso.add(trimL);
    const trimR = mesh(new THREE.BoxGeometry(0.018, 0.95, 0.014), M.sunGoldHi);
    trimR.position.set(0.21, -0.05, 0.37); torso.add(trimR);

    // CHEST EMBLEM — 12-rayed sun on the tabard front (the marquee Paladin emblem)
    const sunBack = mesh(new THREE.CircleGeometry(0.13, 24), M.sunRune);
    sunBack.position.set(0, 0.1, 0.37); torso.add(sunBack);
    // Inner sun disc
    const sunDisc = mesh(new THREE.CircleGeometry(0.08, 24), M.sunGoldHi);
    sunDisc.position.set(0, 0.1, 0.375); torso.add(sunDisc);
    // 12 rays radiating outward
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const long = i % 2 === 0;
      const len = long ? 0.08 : 0.05;
      const wid = long ? 0.018 : 0.012;
      const ray = mesh(new THREE.BoxGeometry(wid, len, 0.005), M.sunGoldHi);
      ray.position.set(Math.cos(a) * (0.13 + len / 2), 0.1 + Math.sin(a) * (0.13 + len / 2), 0.38);
      ray.rotation.z = a - Math.PI / 2;
      torso.add(ray);
    }
    // Central cross within the sun (the core symbol)
    const crossV = mesh(new THREE.BoxGeometry(0.02, 0.1, 0.008), M.sunRune);
    crossV.position.set(0, 0.1, 0.385); torso.add(crossV);
    const crossH = mesh(new THREE.BoxGeometry(0.07, 0.02, 0.008), M.sunRune);
    crossH.position.set(0, 0.1, 0.385); torso.add(crossH);

    // Side ribbing (gold curved plates on sides)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const rib = mesh(new THREE.BoxGeometry(0.08, 0.06, 0.05), M.sunGoldHi);
        rib.position.set(side * 0.34, 0.18 - i * 0.16, 0.06);
        rib.rotation.z = side * 0.12;
        torso.add(rib);
      }
    }

    // High collar with cross emblem at the throat
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.14, 16), M.sunGold);
    collar.position.y = 0.42; torso.add(collar);
    const collarTrim = mesh(new THREE.TorusGeometry(0.21, 0.014, 8, 18), M.sunGoldHi);
    collarTrim.rotation.x = Math.PI / 2; collarTrim.position.y = 0.49;
    torso.add(collarTrim);

    root.add(torso);
    this.parts.body = torso;

    // PAULDRONS — large sun-gold with radial sun-ray spikes
    for (let side = -1; side <= 1; side += 2) {
      const pauld = mesh(new THREE.SphereGeometry(0.2, 16, 12, 0, Math.PI * 2, 0, Math.PI / 1.6), M.sunGold);
      pauld.scale.set(1.1, 0.9, 1);
      pauld.position.set(side * 0.42, 2.2, 0);
      root.add(pauld);
      // Sun-ray spikes around the pauldron rim (5 short cones)
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI * 0.45 + (i / 4) * Math.PI * 0.9;
        const spike = mesh(new THREE.ConeGeometry(0.022, 0.08, 5), M.sunGoldHi);
        spike.position.set(side * 0.42 + Math.cos(a) * 0.15, 2.2 + Math.sin(a) * 0.05, Math.sin(a) * 0.18);
        spike.rotation.z = a + Math.PI / 2;
        root.add(spike);
      }
      // Pauldron center sun-rune disc
      const pauldDisc = mesh(new THREE.SphereGeometry(0.04, 12, 10), M.sunRune);
      pauldDisc.position.set(side * 0.42, 2.32, 0); pauldDisc.scale.set(1, 0.4, 1);
      root.add(pauldDisc);
    }

    // ARMS — steel + gold trim
    const armPalette = { cloth: M.skyCape, mid: M.palSteel, dark: M.palSteelDark, hi: M.palSteelHi, accent: M.sunGold };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);

  _buildCrossHammer() {
    const hammer = new THREE.Group();
    // Pommel — gold sphere with cross
    const pommel = mesh(new THREE.SphereGeometry(0.045, 14, 12), M.sunGoldHi);
    hammer.add(pommel);
    // Tiny cross on pommel
    const pomCrossV = mesh(new THREE.BoxGeometry(0.008, 0.04, 0.008), M.sunGold);
    pomCrossV.position.y = 0.0; hammer.add(pomCrossV);
    const pomCrossH = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.008), M.sunGold);
    pomCrossH.position.y = 0.0; hammer.add(pomCrossH);
    // Long haft with gold-trim wraps
    const haft = mesh(new THREE.CylinderGeometry(0.028, 0.026, 0.95, 12), M.palSteelDark);
    haft.position.y = 0.5; hammer.add(haft);
    // Sky-blue cloth grip wrap
    const grip = mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.32, 12), M.skyCape);
    grip.position.y = 0.18; hammer.add(grip);
    // Gold rings spaced along the haft
    for (let i = 0; i < 5; i++) {
      const ring = mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.012, 12), M.sunGoldHi);
      ring.position.y = 0.06 + i * 0.064;
      hammer.add(ring);
    }
    // Mid-haft gold collar
    const midCollar = mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.04, 10), M.sunGoldHi);
    midCollar.position.y = 0.5; hammer.add(midCollar);
    // Top collar where head meets haft
    const topCollar = mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.08, 12), M.sunGoldHi);
    topCollar.position.y = 0.95; hammer.add(topCollar);

    // CROSS-SHAPED HAMMER HEAD — vertical bar + horizontal bar, gold-trim steel
    // Vertical bar (the long axis of the cross)
    const headV = mesh(new THREE.BoxGeometry(0.13, 0.28, 0.16), M.palSteelHi);
    headV.position.y = 1.12; hammer.add(headV);
    // Horizontal bar (the cross arms)
    const headH = mesh(new THREE.BoxGeometry(0.32, 0.13, 0.16), M.palSteelHi);
    headH.position.y = 1.12; hammer.add(headH);
    // Gold trim caps on the four cross-arm ends
    const arms = [
      [0, 0.18 + 1.12, 0],     // top
      [0, -0.18 + 1.12, 0],    // bottom
      [0.21, 1.12, 0],         // right
      [-0.21, 1.12, 0],        // left
    ];
    arms.forEach((p, idx) => {
      const cap = mesh(new THREE.BoxGeometry(idx < 2 ? 0.13 : 0.06, idx < 2 ? 0.06 : 0.13, 0.18), M.sunGoldHi);
      cap.position.set(p[0], p[1], p[2]); hammer.add(cap);
      // Decorative sun-rune dot on each cap
      const dot = mesh(new THREE.SphereGeometry(0.018, 10, 8), M.sunRune);
      dot.position.set(p[0], p[1], p[2] + 0.1);
      hammer.add(dot);
    });
    // Central sun-rune gem at the cross intersection
    const centralGem = mesh(new THREE.SphereGeometry(0.04, 14, 12), M.sunRune);
    centralGem.position.set(0, 1.12, 0.09); centralGem.scale.set(1, 1, 0.5);
    hammer.add(centralGem);
    // Spike at the top of the hammer head
    const topSpike = mesh(new THREE.ConeGeometry(0.04, 0.1, 8), M.sunGoldHi);
    topSpike.position.y = 1.36; hammer.add(topSpike);
    return hammer;
  }

  _buildPaladinHelm() {
    const helm = new THREE.Group();

    // Gilded greathelm dome — barrel-style closed helm
    const dome = mesh(new THREE.CylinderGeometry(0.22, 0.21, 0.38, 18), M.sunGold);
    dome.position.y = 0.0;
    helm.add(dome);
    // Top dome cap (rounded)
    const domeTop = mesh(new THREE.SphereGeometry(0.22, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.sunGold);
    domeTop.position.y = 0.18;
    helm.add(domeTop);

    // CROSS-APERTURE VISOR — slot in the front shaped like a cross (vertical + horizontal)
    // We achieve this by drawing a black recess + the cross shape revealing eye glow
    // Black recess panel covering the front
    const visorPanel = mesh(new THREE.BoxGeometry(0.24, 0.22, 0.04), M.stoneDark);
    visorPanel.position.set(0, 0.0, 0.21); helm.add(visorPanel);
    // Vertical slot of the cross
    const vSlot = mesh(new THREE.BoxGeometry(0.04, 0.2, 0.05), M.palEye);
    vSlot.position.set(0, 0.0, 0.225); helm.add(vSlot);
    // Horizontal slot of the cross
    const hSlot = mesh(new THREE.BoxGeometry(0.22, 0.04, 0.05), M.palEye);
    hSlot.position.set(0, 0.0, 0.225); helm.add(hSlot);
    // Gold cross-frame (raised gilded edge around the cross slot)
    const crossFrameV = mesh(new THREE.BoxGeometry(0.06, 0.24, 0.02), M.sunGoldHi);
    crossFrameV.position.set(0, 0.0, 0.235); helm.add(crossFrameV);
    const crossFrameH = mesh(new THREE.BoxGeometry(0.26, 0.06, 0.02), M.sunGoldHi);
    crossFrameH.position.set(0, 0.0, 0.235); helm.add(crossFrameH);
    // Eye-glow center (where vertical and horizontal cross meet)
    const eyeCenter = mesh(new THREE.SphereGeometry(0.026, 12, 10), M.palEye);
    eyeCenter.position.set(0, 0.0, 0.245); eyeCenter.scale.set(1, 1, 0.4);
    helm.add(eyeCenter);

    // Decorative gold rivets along the helm sides
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        const rivet = mesh(new THREE.SphereGeometry(0.012, 8, 6), M.sunGoldHi);
        rivet.position.set(side * 0.215, -0.14 + i * 0.1, 0.04);
        helm.add(rivet);
      }
    }

    // Top crown ridge — gold ridge running front-to-back
    const ridge = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.46), M.sunGoldHi);
    ridge.position.set(0, 0.36, 0); helm.add(ridge);

    // Top finial — small spike with cross
    const finial = mesh(new THREE.ConeGeometry(0.025, 0.08, 6), M.sunGoldHi);
    finial.position.set(0, 0.46, 0); helm.add(finial);
    // Tiny cross on finial
    const finCrossV = mesh(new THREE.BoxGeometry(0.008, 0.04, 0.008), M.sunGold);
    finCrossV.position.set(0, 0.52, 0); helm.add(finCrossV);
    const finCrossH = mesh(new THREE.BoxGeometry(0.025, 0.008, 0.008), M.sunGold);
    finCrossH.position.set(0, 0.52, 0); helm.add(finCrossH);

    // Forehead crown band — gold with sun-rune disc
    const browBand = mesh(new THREE.TorusGeometry(0.225, 0.018, 10, 24), M.sunGoldHi);
    browBand.rotation.x = Math.PI / 2;
    browBand.position.y = 0.16;
    helm.add(browBand);
    // Forehead sun-disc emblem
    const browSun = mesh(new THREE.CircleGeometry(0.04, 16), M.sunRune);
    browSun.position.set(0, 0.18, 0.215); helm.add(browSun);
    const browSunRing = mesh(new THREE.TorusGeometry(0.04, 0.005, 8, 16), M.sunGoldHi);
    browSunRing.position.set(0, 0.18, 0.22); helm.add(browSunRing);
    // 6 rays around the forehead sun
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const ray = mesh(new THREE.ConeGeometry(0.005, 0.018, 4), M.sunGoldHi);
      ray.position.set(Math.cos(a) * 0.05, 0.18 + Math.sin(a) * 0.05, 0.22);
      ray.rotation.z = a - Math.PI / 2;
      helm.add(ray);
    }

    // Bottom rim — gold band
    const helmRim = mesh(new THREE.TorusGeometry(0.21, 0.015, 8, 24), M.sunGoldHi);
    helmRim.rotation.x = Math.PI / 2;
    helmRim.position.y = -0.21;
    helm.add(helmRim);

    return helm;
  }
}

  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.95, 0.7, 0.3) } },
  vertexShader: `
    attribute float seed; uniform float uTime; varying float vAlpha;
    void main() {
      vec3 p = position;
      p.y = mod(p.y + uTime * (0.15 + seed * 0.25), 4.5);
      p.x += sin(uTime * 0.5 + seed * 6.28) * 0.15;
      p.z += cos(uTime * 0.4 + seed * 6.28) * 0.15;
      vAlpha = (1.0 - p.y / 4.5) * (0.5 + seed * 0.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed * 2.0) * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.0) * vAlpha;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

// ─── Post-processing ──────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.78, 0.4, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ───────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Class registry ───────────────────────────────────────────────────────
const classRegistry = {
  berserker: {
    name: 'Berserker',
    family: 'Fighter · I/VI',
    role: 'Rage · Glass Cannon',
    accent: '#ffaa30',
    accentGlow: 'rgba(255, 170, 48, 0.5)',
    auraColor: 0xff8020,
    emberColor: new THREE.Color(0.95, 0.7, 0.3),
    abilities: { attack: 'Reaving Strike', spell1: 'Bloodthirst', spell2: 'Whirlwind' },
    factory: () => new Berserker(scene, new THREE.Vector3(0, 0, 0)),
  },
  gladiator: {
    name: 'Gladiator',
    family: 'Fighter · II/VI',
    role: 'Crowd-Pleaser · Brief Taunt',
    accent: '#ff7030',
    accentGlow: 'rgba(255, 112, 48, 0.5)',
    auraColor: 0xff5018,
    emberColor: new THREE.Color(1.0, 0.55, 0.25),
    abilities: { attack: 'Crowd Strike', spell1: 'Net Cast', spell2: 'Showmanship' },
    factory: () => new Gladiator(scene, new THREE.Vector3(0, 0, 0)),
  },
  samurai: {
    name: 'Samurai',
    family: 'Fighter · III/VI',
    role: 'Crit · Parry · Iaijutsu',
    accent: '#a0c0ff',
    accentGlow: 'rgba(160, 192, 255, 0.5)',
    auraColor: 0xa0c0ff,
    emberColor: new THREE.Color(0.7, 0.82, 1.0),
    abilities: { attack: 'Iaijutsu', spell1: 'Wave Slash', spell2: 'Meditation' },
    factory: () => new Samurai(scene, new THREE.Vector3(0, 0, 0)),
  },
  monk: {
    name: 'Monk',
    family: 'Fighter · IV/VI',
    role: 'Speed · Combo · Ki',
    accent: '#60ff90',
    accentGlow: 'rgba(96, 255, 144, 0.5)',
    auraColor: 0x40ff80,
    emberColor: new THREE.Color(0.4, 1.0, 0.6),
    abilities: { attack: 'Flurry', spell1: 'Tiger Palm', spell2: 'Inner Peace' },
    factory: () => new Monk(scene, new THREE.Vector3(0, 0, 0)),
  },
  spellblade: {
    name: 'Spellblade',
    family: 'Fighter · V/VI',
    role: 'Hybrid Melee · Brief Taunt',
    accent: '#90c0ff',
    accentGlow: 'rgba(144, 192, 255, 0.5)',
    auraColor: 0x4060ff,
    emberColor: new THREE.Color(0.5, 0.7, 1.0),
    abilities: { attack: 'Enchanted Edge', spell1: 'Phase Slash', spell2: 'Aetheric Challenge' },
    factory: () => new Spellblade(scene, new THREE.Vector3(0, 0, 0)),
  },
  paladin: {
    name: 'Paladin',
    family: 'Fighter · VI/VI',
    role: 'Holy Fighter · Brief Group Taunt',
    accent: '#ffd860',
    accentGlow: 'rgba(255, 216, 96, 0.5)',
    auraColor: 0xffc830,
    emberColor: new THREE.Color(1.0, 0.85, 0.4),
    abilities: { attack: 'Smite', spell1: 'Word of Glory', spell2: 'Hammer of Justice' },
    factory: () => new Paladin(scene, new THREE.Vector3(0, 0, 0)),
  },
};

// ─── Build all champions up front (single per class — viewer only shows one)
const champions = {};
for (const key in classRegistry) {
  const champ = classRegistry[key].factory();
  champ.group.visible = false;
  champions[key] = champ;
}
let activeChampion = champions.berserker;
activeChampion.group.visible = true;

// ─── Class swap ───────────────────────────────────────────────────────────
function selectClass(key) {
  const def = classRegistry[key];
  if (!def) return;
  // Hide previous, show new
  if (activeChampion) {
    activeChampion.group.visible = false;
    activeChampion.stopAnimation && activeChampion.stopAnimation();
  }
  effectMgr.clear();
  activeChampion = champions[key];
  activeChampion.group.visible = true;

  // Update UI
  document.getElementById('familyLabel').textContent = def.family;
  document.getElementById('nameLabel').textContent = def.name;
  document.getElementById('roleLabel').textContent = def.role;
  document.getElementById('ab-attack-name').textContent = def.abilities.attack;
  document.getElementById('ab-spell1-name').textContent = def.abilities.spell1;
  document.getElementById('ab-spell2-name').textContent = def.abilities.spell2;
  document.documentElement.style.setProperty('--accent', def.accent);
  document.documentElement.style.setProperty('--accent-glow', def.accentGlow);

  // Update aura + embers tint
  auraMat.uniforms.uColor.value.setHex(def.auraColor);
  emberMat.uniforms.uColor.value.copy(def.emberColor);
}

// ─── UI wiring ────────────────────────────────────────────────────────────
document.getElementById('classSelect').addEventListener('change', (e) => {
  selectClass(e.target.value);
});

const abilityButtons = document.querySelectorAll('.ab-btn');
abilityButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeChampion || activeChampion.isPlaying()) return;
    const animName = btn.dataset.anim;
    activeChampion.playAnimation(animName, clock.getElapsedTime(), effectMgr);
    btn.classList.add('cooling');
    setTimeout(() => btn.classList.remove('cooling'), (activeChampion.animations[animName]?.duration || 1) * 1000 + 100);
  });
});

let demoMode = false;
let demoIdx = 0;
let demoNextTime = 0;
const demoOrder = ['attack', 'spell1', 'attack', 'spell2'];
document.getElementById('demoBtn').addEventListener('click', (e) => {
  demoMode = !demoMode;
  demoIdx = 0;
  e.target.textContent = demoMode ? '⏸ Stop Demo' : '▶ Cycle Animations';
  demoNextTime = clock.getElapsedTime() + 0.4;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  controls.update();

  if (activeChampion) activeChampion.update(time, dt);
  effectMgr.update(time, dt);

  emberMat.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;

  if (demoMode && time >= demoNextTime && activeChampion && !activeChampion.isPlaying()) {
    const animName = demoOrder[demoIdx % demoOrder.length];
    activeChampion.playAnimation(animName, time, effectMgr);
    demoIdx++;
    const dur = activeChampion.animations[animName]?.duration || 1;
    demoNextTime = time + dur + 0.5;
  }

  composer.render();
}

// Initial UI setup
selectClass('berserker');

// Hide loading splash
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 220);

animate();

</script>
</body>
