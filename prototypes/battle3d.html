        mgr.spawn(new ParticleBurst(champ.scene, chestPos, { color: 0xc8d0ff, count: 70, speed: 3.5, duration: 1.4, upwardBias: 1.6, gravity: -0.8 }), time);
      }},
      { time: 0.55, fn: (champ, mgr, time) => {
        const pos = new THREE.Vector3(); champ.group.getWorldPosition(pos); pos.y = 0.12;
        // Secondary cascading shockwave (the heal pulse propagating)
        mgr.spawn(new ShockwaveRing(champ.scene, pos, { color: 0xffffff, maxRadius: 2.0, duration: 0.7 }), time);
      }},
    ],
  },
};


// ─── ARCHER ────────────────────────────────────────────────────────────────
class Archer extends Champion {
  constructor(scene, position) {
    super(scene, position);
    this.build();
    this.captureRestPose();
    this.animations = archerAnimations;
  }

  build() {
    const root = this.group;

    // Legs — ranger brown leather pants and boots
    const buildArcherLeg = (sx) => {
      const leg = new THREE.Group();
      // Upper thigh — forest-green leggings
      const thigh = mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.55, 14), M.forestGreenDark);
      thigh.position.y = 0.95; leg.add(thigh);
      // Lower shin — same
      const shin = mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.5, 14), M.forestGreenDark);
      shin.position.y = 0.36; leg.add(shin);
      // Leather thigh-strap (small accent across the upper thigh)
      const thighStrap = mesh(new THREE.TorusGeometry(0.135, 0.012, 6, 14), M.rangerBrown);
      thighStrap.rotation.x = Math.PI / 2; thighStrap.position.y = 0.85;
      leg.add(thighStrap);
      // Knee leather pad
      const kneePad = mesh(new THREE.SphereGeometry(0.1, 12, 8), M.rangerBrown);
      kneePad.position.y = 0.66; kneePad.scale.set(1.1, 0.6, 1.2); leg.add(kneePad);
      // Calf wraps (leather strapping)
      for (let i = 0; i < 5; i++) {
        const wrap = mesh(new THREE.TorusGeometry(0.122, 0.008, 6, 14), M.rangerBrownHi);
        wrap.rotation.x = Math.PI / 2;
        wrap.position.y = 0.52 - i * 0.07;
        leg.add(wrap);
      }
      // Boot — soft tall leather boot
      const boot = mesh(new THREE.BoxGeometry(0.2, 0.15, 0.32), M.rangerBrown);
      boot.position.set(0, 0.11, 0.06); leg.add(boot);
      // Boot toe (slight curve via small box)
      const toe = mesh(new THREE.BoxGeometry(0.18, 0.08, 0.1), M.rangerBrownHi);
      toe.position.set(0, 0.06, 0.21); toe.rotation.x = -0.18;
      leg.add(toe);
      // Boot lacing (subtle vertical line)
      const laces = mesh(new THREE.BoxGeometry(0.012, 0.14, 0.005), M.rangerBrownHi);
      laces.position.set(0, 0.13, 0.22); leg.add(laces);
      leg.position.x = sx * 0.18;
      return leg;
    };
    root.add(buildArcherLeg(-1));
    root.add(buildArcherLeg(1));

    // Pelvis — leather belt with arrow-pouch and pouches
    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    pelvis.add(mesh(new THREE.CylinderGeometry(0.26, 0.28, 0.16, 16), M.forestGreenDark));
    // Leather belt
    const belt = mesh(new THREE.CylinderGeometry(0.285, 0.285, 0.1, 18), M.rangerBrown);
    belt.position.y = 0.0; pelvis.add(belt);
    // Bronze buckle (small)
    const buckle = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.018), M.amber);
    buckle.position.set(0, 0, 0.3); pelvis.add(buckle);
    // Side arrow-pouches (small bag with arrow tips poking out)
    for (let i = -1; i <= 1; i += 2) {
      const pouch = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.rangerBrownHi);
      pouch.position.set(i * 0.26, -0.06, 0.16); pouch.scale.set(0.9, 1.2, 0.7);
      pelvis.add(pouch);
      // 2 arrowhead tips poking out of pouch
      for (let j = 0; j < 2; j++) {
        const arrowTip = mesh(new THREE.ConeGeometry(0.012, 0.04, 4), M.bladeDark);
        arrowTip.position.set(i * (0.26 + j * 0.012), 0.06, 0.18);
        arrowTip.rotation.z = i * 0.2;
        pelvis.add(arrowTip);
      }
    }
    root.add(pelvis);

    // TORSO — forest-green tunic with leather over-vest
    const torso = new THREE.Group();
    torso.position.y = 1.85;

    // Forest-green tunic underlayer
    const tunic = mesh(new THREE.CylinderGeometry(0.32, 0.3, 0.7, 16), M.forestGreen);
    tunic.scale.set(1.0, 1, 0.85);
    torso.add(tunic);

    // Leather over-vest (front-only, shorter)
    const vest = mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.55, 16, 1, false, -Math.PI / 2.4, Math.PI * 1.2), M.rangerBrown);
    vest.scale.set(1.05, 1, 0.85);
    vest.position.y = 0.04;
    torso.add(vest);

    // Vest lacing (cross-pattern down the front)
    for (let i = 0; i < 4; i++) {
      const left = mesh(new THREE.BoxGeometry(0.005, 0.06, 0.005), M.rangerBrownHi);
      left.position.set(-0.04, 0.18 - i * 0.13, 0.4); left.rotation.z = 0.5;
      torso.add(left);
      const right = mesh(new THREE.BoxGeometry(0.005, 0.06, 0.005), M.rangerBrownHi);
      right.position.set(0.04, 0.18 - i * 0.13, 0.4); right.rotation.z = -0.5;
      torso.add(right);
    }

    // Pec mounds (leather)
    const pecL = mesh(new THREE.SphereGeometry(0.16, 14, 12), M.rangerBrownHi);
    pecL.position.set(-0.14, 0.22, 0.22); pecL.scale.set(1, 0.7, 0.55);
    torso.add(pecL);
    const pecR = pecL.clone(); pecR.position.x = 0.14;
    torso.add(pecR);

    // CHEST EMBLEM — crossed arrow + leaf (the marquee Archer symbol)
    const emblemBack = mesh(new THREE.CircleGeometry(0.06, 16), M.forestGreenDark);
    emblemBack.position.set(0, 0.05, 0.41); torso.add(emblemBack);
    // Diagonal arrow shaft
    const arrowShaft = mesh(new THREE.BoxGeometry(0.012, 0.1, 0.008), M.rangerBrownHi);
    arrowShaft.position.set(0, 0.05, 0.42); arrowShaft.rotation.z = Math.PI / 4;
    torso.add(arrowShaft);
    // Arrow head (cone tip on the diagonal)
    const arrowHead = mesh(new THREE.ConeGeometry(0.012, 0.025, 4), M.bladeDark);
    arrowHead.position.set(0.04, 0.09, 0.42); arrowHead.rotation.z = -Math.PI / 4;
    torso.add(arrowHead);
    // Arrow fletching
    const fletch = mesh(new THREE.BoxGeometry(0.018, 0.025, 0.005), M.archerLeaf);
    fletch.position.set(-0.035, 0.015, 0.42); fletch.rotation.z = Math.PI / 4;
    torso.add(fletch);
    // Crossed leaf (other diagonal)
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0, 0.04); leafShape.bezierCurveTo(0.025, 0.03, 0.025, -0.03, 0, -0.04);
    leafShape.bezierCurveTo(-0.025, -0.03, -0.025, 0.03, 0, 0.04);
    leafShape.closePath();
    const leaf = mesh(new THREE.ExtrudeGeometry(leafShape, { depth: 0.005, bevelEnabled: false }), M.archerLeaf);
    leaf.position.set(0, 0.05, 0.43); leaf.rotation.z = -Math.PI / 4;
    torso.add(leaf);
    // Leaf veins
    const leafVein = mesh(new THREE.BoxGeometry(0.005, 0.07, 0.003), M.archerRune);
    leafVein.position.set(0, 0.05, 0.44); leafVein.rotation.z = -Math.PI / 4;
    torso.add(leafVein);

    // Leather collar
    const collar = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.1, 16), M.rangerBrown);
    collar.position.y = 0.4; torso.add(collar);

    root.add(torso);
    this.parts.body = torso;

    // Soft cloth shoulders (no plate, leather pauldrons)
    for (let side = -1; side <= 1; side += 2) {
      const cap = mesh(new THREE.SphereGeometry(0.13, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8), M.rangerBrown);
      cap.scale.set(1, 0.6, 1);
      cap.position.set(side * 0.42, 2.18, 0);
      root.add(cap);
      // Leather strap accents
      const strap = mesh(new THREE.BoxGeometry(0.03, 0.18, 0.04), M.rangerBrownHi);
      strap.position.set(side * 0.42, 2.1, 0.04); strap.rotation.x = -0.18;
      root.add(strap);
    }

    // ARMS — slim, with leather bracer on the bow-arm (left)
    const armPalette = { cloth: M.forestGreen, mid: M.rangerBrownHi, dark: M.rangerBrown, hi: M.rangerBrownHi, accent: M.amber };
    const leftArm = buildArm(-1, 0.18, armPalette);
    leftArm.rotation.x = -0.05;
    root.add(leftArm);
    this.parts.leftArm = leftArm;

    const rightArm = buildArm(1, 0.18, armPalette);
    rightArm.rotation.x = -0.05;
    root.add(rightArm);
    this.parts.rightArm = rightArm;

    // Heavy leather bracer on left forearm (bow-arm guard, distinctive)
    const bracer = mesh(new THREE.CylinderGeometry(0.092, 0.09, 0.32, 14), M.rangerBrown);
    bracer.position.y = -0.62; leftArm.add(bracer);
    // Bracer lacing
    for (let i = 0; i < 4; i++) {
      const lacing = mesh(new THREE.BoxGeometry(0.005, 0.04, 0.005), M.rangerBrownHi);
      lacing.position.set(-0.005, -0.5 - i * 0.08, 0.092); lacing.rotation.z = 0.5;
      leftArm.add(lacing);
      const lacing2 = mesh(new THREE.BoxGeometry(0.005, 0.04, 0.005), M.rangerBrownHi);
      lacing2.position.set(0.005, -0.5 - i * 0.08, 0.092); lacing2.rotation.z = -0.5;
      leftArm.add(lacing2);
    }
    // Right hand finger-tabs (small leather thumb guard for drawing)
    const fingerTab = mesh(new THREE.BoxGeometry(0.04, 0.05, 0.04), M.rangerBrownHi);
    fingerTab.position.y = -0.96; rightArm.add(fingerTab);

    // LONGBOW — held vertically in left hand (resting position)
    const bow = this._buildLongbow();
    leftArm.userData.hand.add(bow);
    bow.position.set(0, 0, 0.05);
    bow.rotation.set(0, 0, 0);
    this.parts.weapon = bow;

    // QUIVER on back — leaf-fletched arrows poking up
    const quiver = this._buildQuiver();
    quiver.position.set(0.18, 1.85, -0.28);
    quiver.rotation.set(0, 0, -Math.PI / 6);
    root.add(quiver);
    this.parts.quiver = quiver;

    // CLOAK — long brown cloak with hood up (separate from the cape mesh — covers shoulders + back)
    const cape = buildCape({ material: M.rangerBrown, width: 1.4, height: 1.95 });
    cape.position.set(0, 2.4, -0.05);
    root.add(cape);
    this.cape = cape;

    // Forest-green inner cloak trim
    const cloakTrim = mesh(new THREE.TorusGeometry(0.55, 0.012, 8, 28, Math.PI), M.forestGreenHi);
    cloakTrim.rotation.x = Math.PI / 2;
    cloakTrim.position.set(0, 0.6, -0.1);
    cloakTrim.scale.set(1.3, 1, 0.5);
    root.add(cloakTrim);

    // Neck (skin)
    const neck = mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 12), M.skin);
    neck.position.y = 2.32; root.add(neck);

    // HEAD — hood UP, face partially shadowed
    const head = this._buildArcherHead();
    head.position.y = 2.56;
    root.add(head);
    this.parts.head = head;

    M.archerEye.userData.baseIntensity = 5.0;
    this.eyeMaterial = M.archerEye;
  }

  _buildLongbow() {
    const bow = new THREE.Group();
    // Bow body — a tall arc shape (curved wood)
    const segments = 14;
    const bowHeight = 1.4;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const y = (t - 0.5) * bowHeight;
      // Curve: bows outward at the middle, tapers at ends
      const xCurve = Math.sin(t * Math.PI) * 0.12;
      const seg = mesh(new THREE.CylinderGeometry(0.014 + Math.sin(t * Math.PI) * 0.008, 0.014 + Math.sin(t * Math.PI) * 0.008, bowHeight / segments + 0.01, 8), M.rangerBrownHi);
      seg.position.set(-xCurve, y, 0);
      // Tilt segments slightly to follow curve
      if (i > 0) {
        const prevT = (i - 1) / (segments - 1);
        const prevX = Math.sin(prevT * Math.PI) * 0.12;
        const dx = -xCurve - (-prevX);
        seg.rotation.z = Math.atan2(dx, bowHeight / segments);
      }
      bow.add(seg);
    }
    // Bowstring (thin straight line from top to bottom tip)
    const bowstring = mesh(new THREE.CylinderGeometry(0.003, 0.003, bowHeight - 0.05, 4), M.ivoryHi || M.cbBolt);
    bowstring.position.set(0.05, 0, 0); bowstring.rotation.z = 0;
    bow.add(bowstring);
    // Leather grip wrap at center
    const grip = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.22, 12), M.rangerBrown);
    grip.position.set(-0.12, 0, 0);
    bow.add(grip);
    // Wrap bands on grip
    for (let i = 0; i < 4; i++) {
      const band = mesh(new THREE.TorusGeometry(0.024, 0.004, 6, 12), M.forestGreenDark);
      band.rotation.x = Math.PI / 2;
      band.position.set(-0.12, -0.08 + i * 0.05, 0);
      bow.add(band);
    }
    // Bow tips (notches at top and bottom)
    const tipTop = mesh(new THREE.ConeGeometry(0.012, 0.04, 6), M.amber);
    tipTop.position.set(0, bowHeight / 2 + 0.02, 0);
    bow.add(tipTop);
    const tipBot = mesh(new THREE.ConeGeometry(0.012, 0.04, 6), M.amber);
    tipBot.position.set(0, -bowHeight / 2 - 0.02, 0); tipBot.rotation.x = Math.PI;
    bow.add(tipBot);
    return bow;
  }

  _buildQuiver() {
    const quiver = new THREE.Group();
    // Cylinder body (leather)
    const body = mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.5, 14), M.rangerBrown);
    quiver.add(body);
    // Cap
    const cap = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.025, 14), M.rangerBrownHi);
    cap.position.y = 0.26; quiver.add(cap);
    // Leaf insignia on quiver side
    const leafInsig = mesh(new THREE.SphereGeometry(0.025, 10, 6), M.archerLeaf);
    leafInsig.position.set(0, -0.05, 0.07); leafInsig.scale.set(1, 0.4, 1.4);
    quiver.add(leafInsig);
    // Leather strap across the front of body
    const strap = mesh(new THREE.BoxGeometry(0.03, 0.5, 0.03), M.rangerBrownHi);
    strap.position.set(0, 0, 0.07); strap.rotation.z = -0.1;
    quiver.add(strap);
    // Several arrows poking out the top with leaf fletching
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      // Arrow shaft
      const shaft = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.4, 6), M.rangerBrownHi);
      shaft.position.set(Math.cos(a) * 0.04, 0.4, Math.sin(a) * 0.04);
      quiver.add(shaft);
      // Leaf fletching at top
      for (let f = 0; f < 3; f++) {
        const fa = (f / 3) * Math.PI * 2;
        const fletching = mesh(new THREE.BoxGeometry(0.004, 0.05, 0.018), M.archerLeaf);
        fletching.position.set(Math.cos(a) * 0.04 + Math.cos(fa) * 0.012, 0.55, Math.sin(a) * 0.04 + Math.sin(fa) * 0.012);
        fletching.rotation.y = -fa;
        quiver.add(fletching);
      }
    }
    return quiver;
  }

  _buildArcherHead() {
    const head = new THREE.Group();

    // Brown hair scalp
    const scalp = mesh(new THREE.SphereGeometry(0.21, 20, 16), M.rangerBrown);
    scalp.scale.set(1, 1.05, 1.05);
    head.add(scalp);

    // Face skin (visible inside hood)
    const face = mesh(new THREE.SphereGeometry(0.19, 18, 14), M.skin);
    face.position.set(0, -0.02, 0.04); face.scale.set(0.95, 1, 1);
    head.add(face);

    // ===== HOOD UP — large brown ranger hood covering most of head =====
    // Hood shell (large, slightly pointed top)
    const hood = mesh(new THREE.SphereGeometry(0.28, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.65), M.rangerBrown);
    hood.scale.set(1.1, 1.2, 1.2);
    hood.position.set(0, 0.04, -0.02);
    head.add(hood);
    // Inner hood lining (forest-green)
    const hoodLining = mesh(new THREE.SphereGeometry(0.265, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.65), M.forestGreenDark);
    hoodLining.scale.set(1.08, 1.18, 1.18);
    hoodLining.position.set(0, 0.04, -0.02);
    head.add(hoodLining);
    // Hood pointed tip at the back
    const hoodTip = mesh(new THREE.ConeGeometry(0.06, 0.14, 8), M.rangerBrown);
    hoodTip.position.set(0, 0.32, -0.18); hoodTip.rotation.x = -0.4;
    head.add(hoodTip);
    // Hood front edge (leather trim around the opening)
    const hoodTrim = mesh(new THREE.TorusGeometry(0.24, 0.012, 8, 28, Math.PI * 1.3), M.rangerBrownHi);
    hoodTrim.rotation.x = Math.PI / 2.4;
    hoodTrim.rotation.y = -Math.PI / 2;
    hoodTrim.position.y = 0.06;
    head.add(hoodTrim);

    // Eyes — emerald glow inside the hood shadow
    const eyeStrip = mesh(new THREE.BoxGeometry(0.22, 0.02, 0.02), M.stoneDark);
    eyeStrip.position.set(0, -0.025, 0.16); head.add(eyeStrip);
    const eyeL = mesh(new THREE.SphereGeometry(0.022, 10, 8), M.archerEye);
    eyeL.position.set(-0.075, -0.02, 0.19); head.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.075; head.add(eyeR);

    // Subtle nose
    const nose = mesh(new THREE.ConeGeometry(0.025, 0.06, 6), M.skin);
    nose.position.set(0, -0.07, 0.21); nose.rotation.x = Math.PI / 2;
    head.add(nose);

    // Mouth (focused, slight scowl)
    const mouth = mesh(new THREE.BoxGeometry(0.06, 0.008, 0.005), M.skinDark);
    mouth.position.set(0, -0.13, 0.21); head.add(mouth);

    // Small face-paint mark across the nose-bridge (subtle dark stripe — woodland marker)
    const facePaint = mesh(new THREE.BoxGeometry(0.18, 0.015, 0.005), M.forestGreenDark);
    facePaint.position.set(0, -0.06, 0.215);
    head.add(facePaint);

    return head;
  }
}

        for (let i = -1; i <= 1; i++) {
          const offset = new THREE.Vector3(i * 0.9, 1.5, 1.6 + Math.abs(i) * 0.2);
          const target = champPos.clone().add(offset);
          mgr.spawn(new ImpactFlash(champ.scene, target, { color: 0x80e090, maxScale: 0.45, duration: 0.3 }), time);
          const groundPos = new THREE.Vector3(target.x, 0.12, target.z);
          mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0x30a050, maxRadius: 0.9, duration: 0.5 }), time);
          mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0x4a8030, count: 14, speed: 3.5, duration: 0.6, upwardBias: 0.7, gravity: -2.5 }), time);
          mgr.spawn(new ParticleBurst(champ.scene, target, { color: 0x80e090, count: 12, speed: 3, duration: 0.55, upwardBias: 0.5, gravity: -2.0 }), time);
        }
      }},
    ],
  },
  // PIERCING ARROW — slow careful draw, single line-AoE shot
  spell2: {
    duration: 1.6,
    keyframes: [
      { t: 0,    values: {} },
      { t: 0.35, values: {                                          // slow steady draw — long aim
        leftArm:  { rx: -0.95, rz: 0.05 },
        rightArm: { rx: -0.4, rz: -0.95 },
        body:     { ry: 0.04, rz: -0.04 },
        head:     { rx: 0.04 },
      }, ease: ease.inOut },
      { t: 0.7,  values: {                                          // hold the aim (the patience)
        leftArm:  { rx: -0.95, rz: 0.05 },
        rightArm: { rx: -0.4, rz: -0.95 },
        body:     { ry: 0.04, rz: -0.04 },
        head:     { rx: 0.04 },
      }},
      { t: 0.82, values: {                                          // release
        leftArm:  { rx: -0.85, rz: 0.05 },
        rightArm: { rx: 0.05, rz: -0.2 },
        body:     { ry: 0.04 },
      }, ease: ease.out },
      { t: 1.0,  values: {}, ease: ease.inOut },
    ],
    effects: [
      { time: 0.35, fn: (champ, mgr, time) => {
        // Building emerald glow at the bow's nock-point
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        const nockPos = new THREE.Vector3(champPos.x - 0.4, 1.95, champPos.z + 0.3);
        mgr.spawn(new ImpactFlash(champ.scene, nockPos, { color: 0x80e090, maxScale: 0.4, duration: 0.6 }), time);
        mgr.spawn(new ParticleBurst(champ.scene, nockPos, { color: 0x30a050, count: 18, speed: 1.0, duration: 0.5, upwardBias: 0, gravity: 0 }), time);
      }},
      { time: 0.82, fn: (champ, mgr, time) => {
        const champPos = new THREE.Vector3(); champ.group.getWorldPosition(champPos);
        // Long line-AoE — emerald light pillar laid down the center of the line
        // Multiple impact points stretching forward (the piercing line)
        for (let i = 0; i < 4; i++) {
          const dist = 0.8 + i * 0.6;
          const target = new THREE.Vector3(champPos.x, 1.5, champPos.z + dist);
          mgr.spawn(new ImpactFlash(champ.scene, target, { color: 0x80e090, maxScale: 0.55 - i * 0.05, duration: 0.3 + i * 0.05 }), time + i * 0.05);
          const groundPos = new THREE.Vector3(target.x, 0.12, target.z);
          mgr.spawn(new ShockwaveRing(champ.scene, groundPos, { color: 0x30a050, maxRadius: 1.1 - i * 0.1, duration: 0.55 }), time + i * 0.05);
        }
        // Big leaf-burst at far end (the arrow's final landing)
        const farTarget = new THREE.Vector3(champPos.x, 1.5, champPos.z + 3.0);
        mgr.spawn(new ParticleBurst(champ.scene, farTarget, { color: 0x4a8030, count: 60, speed: 5, duration: 0.95, upwardBias: 1.4, gravity: -2.5 }), time);
      }},
    ],
  },
};



// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  BATTLE PROTOTYPE — scene, combat tick, waves                            ║
// ╚══════════════════════════════════════════════════════════════════════════╝

// ─── Scene + renderer ─────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d18);
scene.fog = new THREE.Fog(0x0a0d18, 24, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(13, 11, 13);
camera.lookAt(0, 1.4, 0);

// ─── Lighting ─────────────────────────────────────────────────────────────
const sun = new THREE.DirectionalLight(0xfff0d8, 1.4);
sun.position.set(8, 18, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x6a7090, 0.45));
const rim = new THREE.DirectionalLight(0x6080ff, 0.35);
rim.position.set(-6, 4, -8);
scene.add(rim);

// ─── Ground (Everfall theme — moss + dirt) ────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 24),
  new THREE.MeshStandardMaterial({ color: 0x2a2c1a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// scattered tile accent
for (let i = 0; i < 30; i++) {
  const t = new THREE.Mesh(
    new THREE.BoxGeometry(0.4 + Math.random() * 0.3, 0.06, 0.4 + Math.random() * 0.3),
    new THREE.MeshStandardMaterial({ color: 0x1e2010, roughness: 0.9 })
  );
  t.position.set((Math.random() - 0.5) * 18, 0.03, (Math.random() - 0.5) * 10);
  t.rotation.y = Math.random() * Math.PI;
  t.receiveShadow = true;
  scene.add(t);
}

// ─── Bloom ────────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55, 0.45, 0.82
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Effect manager ───────────────────────────────────────────────────────
const effectMgr = new EffectManager(scene);

// ─── Combat unit wrapper ──────────────────────────────────────────────────
const allUnits = [];
const heroes = [];
const enemies = [];

class Unit {
  constructor(opts) {
    this.name = opts.name;
    this.team = opts.team;
    this.maxHp = opts.maxHp;
    this.hp = opts.maxHp;
    this.atk = opts.atk;
    this.def = opts.def;
    this.attackSpeed = opts.attackSpeed;
    this.attackTimer = Math.random() * 60;
    this.isAlive = true;
    this.role = opts.role || 'dps';
    this.kind = opts.kind || 'melee';
    this.position = opts.position;
    this.mesh = opts.mesh;
    this.champion = opts.champion || null;
    this.color = opts.color || 0xffffff;
    this.hpBar = makeHpBar();
    scene.add(this.hpBar);
  }
  takeDamage(amount, time) {
    if (!this.isAlive) return 0;
    const reduction = this.def / (this.def + 100);
    const base = Math.max(1, Math.floor(amount * (1 - reduction)));
    const isCrit = Math.random() < 0.06;
    const dealt = isCrit ? Math.floor(base * 1.5) : base;
    this.hp = Math.max(0, this.hp - dealt);
    spawnDamageText(this.position, isCrit ? `${dealt}!` : `${dealt}`, isCrit ? '#ffe080' : '#ff8060', isCrit ? 1.3 : 1.0);
    effectMgr.spawn(new ImpactFlash(scene, new THREE.Vector3(this.position.x, 1.1, this.position.z), { color: 0xff8060, maxScale: 0.45, duration: 0.28 }), time);
    if (this.hp <= 0) {
      this.isAlive = false;
      log(`${this.name} fell!`, this.team === 'hero' ? 'dmg' : 'sys');
      if (this.champion && this.champion.animations && this.champion.animations.death) {
        try { this.champion.playAnimation('death', time, effectMgr); } catch (e) {}
      } else if (this.mesh) {
        this.mesh.userData.dying = true;
      }
    }
    return dealt;
  }
  heal(amount, time) {
    if (!this.isAlive) return 0;
    const healed = Math.min(amount, this.maxHp - this.hp);
    this.hp += healed;
    spawnDamageText(this.position, `+${healed}`, '#80ff90', 1.0);
    return healed;
  }
}

// ─── HP bar (billboarded plane) ───────────────────────────────────────────
function makeHpBar() {
  const grp = new THREE.Group();
  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(0.95, 0.12),
    new THREE.MeshBasicMaterial({ color: 0x101018, transparent: true, opacity: 0.85, depthTest: false })
  );
  grp.add(bg);
  const fill = new THREE.Mesh(
    new THREE.PlaneGeometry(0.9, 0.08),
    new THREE.MeshBasicMaterial({ color: 0x60d070, depthTest: false })
  );
  fill.position.z = 0.001;
  grp.add(fill);
  grp.userData.fill = fill;
  grp.renderOrder = 999;
  bg.renderOrder = 998;
  return grp;
}

function updateHpBars() {
  for (const u of allUnits) {
    if (!u.hpBar) continue;
    if (!u.isAlive) { u.hpBar.visible = false; continue; }
    u.hpBar.visible = true;
    const ratio = u.hp / u.maxHp;
    u.hpBar.userData.fill.scale.x = Math.max(0.001, ratio);
    u.hpBar.userData.fill.position.x = -0.45 * (1 - ratio);
    u.hpBar.userData.fill.material.color.setHex(
      ratio > 0.5 ? (u.team === 'hero' ? 0x60d070 : 0xd06060) :
      ratio > 0.25 ? 0xe0c040 : 0xd03020
    );
    u.hpBar.position.set(u.position.x, 3.0, u.position.z);
    u.hpBar.lookAt(camera.position);
  }
}

// ─── Floating damage text (canvas sprite) ─────────────────────────────────
const floatingTexts = [];
function spawnDamageText(worldPos, value, color, scale = 1.0) {
  const c = document.createElement('canvas');
  c.width = 192; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 56px Sora, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 7;
  ctx.strokeStyle = '#000';
  ctx.strokeText(value, 96, 48);
  ctx.fillStyle = color;
  ctx.fillText(value, 96, 48);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(1.8 * scale, 0.9 * scale, 1);
  sprite.position.set(worldPos.x + (Math.random() - 0.5) * 0.4, 2.0, worldPos.z);
  sprite.renderOrder = 1000;
  scene.add(sprite);
  floatingTexts.push({ sprite, t0: performance.now() / 1000, life: 0.95 });
}

function updateFloatingTexts(time) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    const k = (time - ft.t0) / ft.life;
    if (k >= 1) {
      scene.remove(ft.sprite);
      ft.sprite.material.map.dispose();
      ft.sprite.material.dispose();
      floatingTexts.splice(i, 1);
      continue;
    }
    ft.sprite.position.y = 2.0 + k * 1.6;
    ft.sprite.material.opacity = 1 - k * k;
  }
}

// ─── Spawn heroes (4 archetypes from 4 families) ──────────────────────────
function spawnHeroes() {
  const defs = [
    { name: 'Knight',    cls: Knight,    role: 'tank',   maxHp: 240, atk: 7,  def: 14, attackSpeed: 0.7 },
    { name: 'Berserker', cls: Berserker, role: 'dps',    maxHp: 140, atk: 13, def: 4,  attackSpeed: 1.4 },
    { name: 'Archer',    cls: Archer,    role: 'ranged', maxHp: 105, atk: 10, def: 3,  attackSpeed: 1.2 },
    { name: 'Cleric',    cls: Cleric,    role: 'healer', maxHp: 115, atk: 5,  def: 6,  attackSpeed: 1.0 },
  ];
  defs.forEach((d, i) => {
    const z = -3 + i * 2;
    const pos = new THREE.Vector3(-4.8, 0, z);
    const champ = new d.cls(scene, pos);
    champ.group.rotation.y = Math.PI / 2;
    const u = new Unit({ ...d, team: 'hero', kind: d.role === 'ranged' ? 'ranged' : 'melee', position: pos, mesh: champ.group, champion: champ, color: 0x80c0ff });
    heroes.push(u);
    allUnits.push(u);
  });
}

// ─── Spawn enemy primitive ────────────────────────────────────────────────
function spawnEnemy(type, slot) {
  const z = -3 + slot * 2;
  const pos = new THREE.Vector3(4.8, 0, z);
  const grp = new THREE.Group();
  grp.position.copy(pos);

  const s = type.scale || 1.0;
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.38 * s, 0.85 * s, 4, 12),
    new THREE.MeshStandardMaterial({ color: type.color, roughness: 0.75, metalness: 0.05 })
  );
  body.position.y = 0.85 * s + 0.35;
  body.castShadow = true;
  grp.add(body);

  const headSize = 0.32 * s;
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(headSize, 12, 10),
    new THREE.MeshStandardMaterial({ color: type.color, roughness: 0.75 })
  );
  head.position.y = 0.85 * s + 0.35 + 0.85 * s + 0.1;
  head.castShadow = true;
  grp.add(head);

  // glowing eyes
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff4030, emissive: 0xff4030, emissiveIntensity: 2.5 });
  const eyeGeo = new THREE.SphereGeometry(0.05 * s, 8, 6);
  for (const ex of [-0.1, 0.1]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(ex * s, head.position.y + 0.04, headSize * 0.78);
    grp.add(eye);
  }

  // forward facing
  grp.rotation.y = -Math.PI / 2;

  scene.add(grp);
  const u = new Unit({
    name: type.name, team: 'enemy',
    maxHp: type.maxHp, atk: type.atk, def: type.def,
    attackSpeed: type.attackSpeed,
    position: pos, mesh: grp, color: type.color,
    role: 'dps', kind: 'melee',
  });
  enemies.push(u);
  allUnits.push(u);
}

// ─── Targeting ────────────────────────────────────────────────────────────
function pickTarget(unit) {
  const opp = unit.team === 'hero' ? enemies : heroes;
  const alive = opp.filter(u => u.isAlive);
  if (!alive.length) return null;
  if (unit.team === 'enemy') {
    const tank = alive.find(u => u.role === 'tank');
    if (tank && Math.random() < 0.7) return tank;
  }
  return alive[Math.floor(Math.random() * alive.length)];
}

// ─── Combat tick (port of everfall's frame-stepped attack timer) ──────────
function combatTick(time, dt) {
  for (const u of allUnits) {
    if (!u.isAlive) continue;
    u.attackTimer += u.attackSpeed * dt * 100;
    if (u.attackTimer < 100) continue;
    u.attackTimer = 0;

    // Healer special: heal lowest-hp ally < 70%
    if (u.role === 'healer') {
      const allies = u.team === 'hero' ? heroes : enemies;
      const wounded = allies.filter(a => a.isAlive && a.hp / a.maxHp < 0.7);
      if (wounded.length) {
        wounded.sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp);
        const target = wounded[0];
        if (u.champion && u.champion.animations && u.champion.animations.spell1) {
          try { u.champion.playAnimation('spell1', time, effectMgr); } catch (e) {}
        }
        target.heal(Math.floor(u.maxHp * 0.18), time);
        effectMgr.spawn(new HolyCircle(scene, new THREE.Vector3(target.position.x, 0.05, target.position.z), { color: 0xffe080, maxRadius: 1.1, duration: 0.7 }), time);
        continue;
      }
    }

    const target = pickTarget(u);
    if (!target) continue;

    if (u.champion && u.champion.animations) {
      const animKey = u.kind === 'ranged' && u.champion.animations.spell1 ? 'spell1' :
                      u.champion.animations.attack ? 'attack' : null;
      if (animKey) {
        try { u.champion.playAnimation(animKey, time, effectMgr); } catch (e) {}
      }
    }

    // Ranged: damage applies after a short delay + arrow burst at target
    if (u.kind === 'ranged') {
      const tgt = target;
      setTimeout(() => {
        if (!tgt.isAlive) return;
        const tNow = performance.now() / 1000;
        tgt.takeDamage(u.atk, tNow);
        effectMgr.spawn(new ParticleBurst(scene, new THREE.Vector3(tgt.position.x, 1.0, tgt.position.z), { color: 0xc0e060, count: 8, speed: 2.4, duration: 0.35 }), tNow);
      }, 220);
    } else {
      target.takeDamage(u.atk, time);
    }
  }

  if (waveActive && enemies.length && enemies.every(e => !e.isAlive)) {
    waveActive = false;
    log(`Wave ${waveIndex} cleared!`, 'wave');
    setTimeout(() => { if (!paused) nextWave(); }, 1500);
  }
  if (heroes.every(h => !h.isAlive)) {
    if (!partyDefeated) {
      partyDefeated = true;
      log('Party defeated. Press Reset.', 'sys');
    }
  }
}

// ─── Wave system ──────────────────────────────────────────────────────────
let waveIndex = 0;
let waveActive = false;
let partyDefeated = false;

function clearEnemies() {
  for (const e of enemies) {
    if (e.mesh) scene.remove(e.mesh);
    if (e.hpBar) scene.remove(e.hpBar);
  }
  enemies.length = 0;
  for (let i = allUnits.length - 1; i >= 0; i--) {
    if (allUnits[i].team === 'enemy') allUnits.splice(i, 1);
  }
}

function nextWave() {
  clearEnemies();
  waveIndex++;
  document.getElementById('wave-val').textContent = waveIndex;
  log(`Wave ${waveIndex} approaches…`, 'wave');

  const baseHp = 28 + waveIndex * 9;
  const baseAtk = 4 + waveIndex * 0.7;
  const types = [
    { name: 'Forest Wolf',   maxHp: baseHp,        atk: baseAtk,        def: 2, attackSpeed: 1.05, scale: 0.9, color: 0x4a6a30 },
    { name: 'Bandit Cutthroat', maxHp: baseHp * 1.3, atk: baseAtk * 1.1, def: 3, attackSpeed: 1.0,  scale: 1.0, color: 0x6a4a30 },
    { name: 'Moss Boar',     maxHp: baseHp * 1.7,  atk: baseAtk * 0.9,  def: 5, attackSpeed: 0.8,  scale: 1.2, color: 0x584a3a },
    { name: 'Briar Spider',  maxHp: baseHp * 0.85, atk: baseAtk * 1.2,  def: 1, attackSpeed: 1.3,  scale: 0.85, color: 0x402048 },
  ];

  if (waveIndex % 5 === 0) {
    spawnEnemy({
      name: 'Rotting Treant',
      maxHp: Math.floor(baseHp * 5),
      atk: Math.floor(baseAtk * 1.6),
      def: 8, attackSpeed: 0.55, scale: 1.7, color: 0x305020,
    }, 1);
  } else {
    const count = Math.min(4, 2 + Math.floor(waveIndex / 2));
    for (let i = 0; i < count; i++) {
      const t = types[Math.floor(Math.random() * types.length)];
      spawnEnemy({
        ...t,
        maxHp: Math.floor(t.maxHp),
        atk: Math.floor(t.atk),
      }, i);
    }
  }
  waveActive = true;
}

// ─── Controls ─────────────────────────────────────────────────────────────
let paused = false;
let speedMult = 1;

document.getElementById('pauseBtn').onclick = () => {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
};
document.getElementById('speedBtn').onclick = () => {
  speedMult = speedMult === 1 ? 2 : speedMult === 2 ? 4 : 1;
  document.getElementById('speedBtn').textContent = `Speed ${speedMult}×`;
  document.getElementById('speed-val').textContent = `${speedMult}×`;
};
document.getElementById('resetBtn').onclick = () => location.reload();

// ─── Combat log ───────────────────────────────────────────────────────────
function log(msg, kind = 'sys') {
  const box = document.getElementById('logBox');
  const div = document.createElement('div');
  div.className = `line ${kind}`;
  div.textContent = msg;
  div.style.opacity = '1';
  div.style.transition = 'opacity 0.6s';
  box.appendChild(div);
  while (box.children.length > 8) box.removeChild(box.firstChild);
  setTimeout(() => { div.style.opacity = '0'; }, 4000);
}

// ─── Init ─────────────────────────────────────────────────────────────────
spawnHeroes();
nextWave();
document.getElementById('loading').classList.add('hidden');

// ─── Main loop ────────────────────────────────────────────────────────────
let lastFrame = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  const time = now / 1000;

  if (!paused) {
    for (let s = 0; s < speedMult; s++) {
      combatTick(time, dt);
    }
    for (const u of allUnits) {
      if (u.champion) {
        try { u.champion.update(time, dt); } catch (e) {}
      }
    }
    effectMgr.update(time, dt);
    updateFloatingTexts(time);
    updateHpBars();

    // Dying enemies tilt over
    for (const u of enemies) {
      if (!u.isAlive && u.mesh && u.mesh.userData.dying) {
        u.mesh.rotation.z = Math.min((u.mesh.rotation.z || 0) + dt * 3.2, Math.PI / 2);
        u.mesh.position.y = Math.max(u.mesh.position.y - dt * 0.4, -0.15);
        if (u.mesh.rotation.z >= Math.PI / 2 - 0.01) u.mesh.userData.dying = false;
      }
    }
  }

  composer.render();
  requestAnimationFrame(frame);
}
frame();

// ─── Resize ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

</script>
